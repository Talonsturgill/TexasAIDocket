<!doctype html>
<!-- SLIDE 7 — THE EMPTY NAMEPLATE.
     The one place a screen genuinely appears in this record, and the vendor field carries
     no name. TX.svgPlate exists to measure laid out text and draw the plate behind it, and
     here the lower plate is measured for a line the record does not contain.
     The unfilled plate is RULED AND TRANSPARENT, never filled, because a filled one reads
     as a redaction and implies something was withheld rather than never stated.
     This is the deck's one dark frame and its one interior. Claim c8. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: #1A211F; position: relative; font-family: "Manrope", sans-serif; }

  canvas#art { position: absolute; inset: 0; width: 1080px; height: 1350px; }

  .kick { position: absolute; top: 104px; left: 84px;
          font-family: "JetBrains Mono", monospace; font-size: 25px;
          letter-spacing: 0.13em; text-transform: uppercase; color: #C3D0C6; }
  h2 { position: absolute; top: 164px; left: 84px; right: 130px;
       font-family: "Fraunces", serif; font-weight: 800; font-size: 80px;
       line-height: 1.0; letter-spacing: -0.018em; color: #E9EAE6;
       font-variation-settings: "opsz" 82; }

  svg.plates { position: absolute; inset: 0; }

  .counter { position: absolute; right: 84px; bottom: 132px;
             font-family: "JetBrains Mono", monospace; font-size: 24px;
             color: #A9B7AC; }
</style>
</head>
<body>
  <canvas id="art" width="2160" height="2700"></canvas>

  <div class="kick">Where a screen actually appears</div>
  <h2>One platform,<br>no vendor named</h2>

  <svg class="plates" id="plates" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
  <div class="counter" data-decorative>07 / 09</div>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script>
window.renderReady = new Promise(function (resolve) {
  var SEED = 20260818;
  TX.reseed(SEED);
  var R = TX.rng(SEED);

  var cv = document.getElementById("art");
  var ctx = cv.getContext("2d");
  ctx.scale(2, 2);
  var W = 1080, H = 1350;

  /* ---- the shadowed wall, with real tooth so the frame never reads as a black rectangle */
  for (var y = 0; y < H; y += 2) {
    for (var x = 0; x < W; x += 2) {
      var n = TX.fbm2(x * 0.0032, y * 0.0032, { octaves: 4 });
      var v = 0.5 + 0.5 * n;
      var l = 20 + 26 * v;
      ctx.fillStyle = "rgb(" + Math.round(l * 0.86) + "," + Math.round(l * 1.02) + "," + Math.round(l * 0.94) + ")";
      ctx.fillRect(x, y, 2, 2);
    }
  }

  /* ---- the panel: the only surface in the deck that makes its own light -------------- */
  var PX = 300, PY = 470, PW = 480, PH = 270;

  /* the glow it throws, falling off across the wall texture */
  var glow = ctx.createRadialGradient(PX + PW / 2, PY + PH / 2, 30,
                                      PX + PW / 2, PY + PH / 2, 640);
  glow.addColorStop(0.00, "rgba(214,226,216,0.60)");
  glow.addColorStop(0.28, "rgba(190,205,194,0.26)");
  glow.addColorStop(0.62, "rgba(150,168,156,0.09)");
  glow.addColorStop(1.00, "rgba(150,168,156,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  /* the panel face */
  var face = ctx.createLinearGradient(PX, PY, PX, PY + PH);
  face.addColorStop(0.00, "#E2EAE3");
  face.addColorStop(0.34, "#CBD8CD");
  face.addColorStop(0.62, "#D3DED5");
  face.addColorStop(1.00, "#A6B7AA");
  ctx.fillStyle = face;
  ctx.fillRect(PX, PY, PW, PH);
  /* One soft lit band across the face, carrying no glyph and no brand shape, so the panel
     reads as a lit display rather than as an unfilled rectangle at thumbnail size. */
  var band = ctx.createLinearGradient(PX, PY + PH * 0.30, PX, PY + PH * 0.52);
  band.addColorStop(0, "rgba(255,255,255,0)");
  band.addColorStop(0.5, "rgba(255,255,255,0.30)");
  band.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = band;
  ctx.fillRect(PX, PY + PH * 0.30, PW, PH * 0.22);
  ctx.strokeStyle = "rgba(20,26,24,0.75)";
  ctx.lineWidth = 3;
  ctx.strokeRect(PX - 1.5, PY - 1.5, PW + 3, PH + 3);

  /* the pool of panel light on the floor beneath, graded */
  var pool = ctx.createLinearGradient(0, 980, 0, 1350);
  pool.addColorStop(0, "rgba(176,192,180,0.22)");
  pool.addColorStop(1, "rgba(176,192,180,0.02)");
  ctx.fillStyle = pool;
  ctx.fillRect(0, 980, W, 370);

  /* THE BOTTOM BAND. The plates alone left the lower third at 10% of the frame's own craft
     density. The floor gets its own graded pool, a skirting rule and the beam's falloff
     rather than a larger quiet zone. */
  /* A real floor rather than a wash. The wall meets it at a lit skirting, and the terrazzo
     runs away from the reader in perspective toward the panel's own vanishing point, so the
     band carries structure a gate can see and a reader reads as a room. */
  var FLOOR_Y = 1132;
  var fg2 = ctx.createLinearGradient(0, FLOOR_Y, 0, 1350);
  fg2.addColorStop(0, "rgba(120,140,126,0.30)");
  fg2.addColorStop(0.45, "rgba(96,114,102,0.20)");
  fg2.addColorStop(1, "rgba(58,72,64,0.34)");
  ctx.fillStyle = fg2;
  ctx.fillRect(0, FLOOR_Y, W, 1350 - FLOOR_Y);

  /* the skirting, the brightest line in the lower band */
  ctx.strokeStyle = "rgba(206,220,209,0.62)";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(W, FLOOR_Y); ctx.stroke();

  /* terrazzo joints running to the vanishing point under the panel */
  var VPX = PX + PW / 2, VPY = FLOOR_Y - 210;
  ctx.lineWidth = 1.4;
  for (var jx = -900; jx <= W + 900; jx += 96) {
    var t0 = 0.30 + 0.34 * (1 - Math.abs(jx - VPX) / (W * 1.6));
    ctx.strokeStyle = "rgba(198,214,202," + Math.max(0.10, t0 * 0.40).toFixed(3) + ")";
    ctx.beginPath();
    ctx.moveTo(VPX + (jx - VPX) * 0.16, FLOOR_Y);
    ctx.lineTo(jx, 1350);
    ctx.stroke();
  }
  /* cross joints, spaced by depth so the floor recedes */
  var dstep = 16;
  for (var dy2 = FLOOR_Y + 14; dy2 < 1350; dy2 += dstep) {
    ctx.strokeStyle = "rgba(198,214,202,0.20)";
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, dy2); ctx.lineTo(W, dy2); ctx.stroke();
    dstep *= 1.30;
  }

  /* dust in the light, so the beam has something to be in */
  for (var i = 0; i < 210; i++) {
    var dx = PX - 120 + R() * (PW + 240);
    var dy = PY + R() * 860;
    ctx.fillStyle = "rgba(226,236,228," + (0.03 + R() * 0.09) + ")";
    ctx.fillRect(dx, dy, 1.7, 1.7);
  }

  /* ---- the two plates ---------------------------------------------------------------
     Upper: what the record states. Lower: measured for a line the record does not contain. */
  var svg = document.getElementById("plates");
  var NS = "http://www.w3.org/2000/svg";

  function mkText(x, y, size, fill, str, family) {
    var t = document.createElementNS(NS, "text");
    t.setAttribute("x", x); t.setAttribute("y", y);
    t.setAttribute("font-family", family || "Manrope, sans-serif");
    t.setAttribute("font-size", size);
    t.setAttribute("fill", fill);
    t.textContent = str;
    svg.appendChild(t);
    return t;
  }

  /* Baselines set 74px apart. At 46px the second plate was painted across the first
     line's descenders, which is the opaque-over-type failure. */
  var t1 = mkText(120, 996, 31, "#16201C",
    "An accelerated AI-driven platform for reading and math", "Manrope, sans-serif");
  var t2 = mkText(120, 1070, 31, "#16201C",
    "Optional, for students in the top percentile", "Manrope, sans-serif");
  var t3 = mkText(120, 1190, 31, "#C6D3C8",
    "vendor", "JetBrains Mono, monospace");

  document.fonts.ready.then(function () {
    /* the upper plate is a real plate, the LEAST plate that keeps the type legible */
    TX.svgPlate(t1, { padX: 18, padY: 12, fill: "#CFDBD1" });
    TX.svgPlate(t2, { padX: 18, padY: 12, fill: "#CFDBD1" });

    /* The unfilled field. Measured from the laid-out label, then drawn as a rule on all
       four sides with NO fill, so it reads as a bounded field nobody wrote in rather than
       as a redaction over something removed. */
    var b = t3.getBBox();
    var r = document.createElementNS(NS, "rect");
    r.setAttribute("x", b.x + b.width + 26);
    r.setAttribute("y", b.y - 12);
    r.setAttribute("width", 520);
    r.setAttribute("height", b.height + 24);
    r.setAttribute("fill", "none");
    r.setAttribute("stroke", "#9FB3A5");
    r.setAttribute("stroke-width", 1.8);
    svg.insertBefore(r, t3);

    var g = new Image();
    g.onload = function () {
      ctx.globalAlpha = 0.034;
      ctx.fillStyle = ctx.createPattern(g, "repeat");
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      resolve();
    };
    g.onerror = function () { resolve(); };
    g.src = TX.grainTile(246, 42, SEED);
  });
});
</script>
</body>
</html>
