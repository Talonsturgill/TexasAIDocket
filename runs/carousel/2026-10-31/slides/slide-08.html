<!doctype html>
<!-- 2026-10-31, frame 8 of 9. Archetype DIAGRAM. A TXBENCH material relief in plan under the deck's declared key: a concrete kerb strip cut with hours_after_certification saw cut grooves in rows of 24, a terracotta thermoplastic start bar at the head of the first row. One groove for each hour. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">72 hours after the count is certified</h1>
<p class="dek" data-follow="24" style="width:900px">If voters say no, that is when the city starts bagging the cameras, Long told the council, the Tribune reported. Houston Public Media quoted him on getting them down within 72 hours. One groove for each hour. Drawn to&nbsp;illustrate.</p>
<div class="lab" id="lab-a">CERTIFIED</div>
<script>window.FIG = {"hours_after_certification": 72};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-31-roadpaint.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script>
window.renderReady = (async () => {
  const cx = await CH.bootFlat({ kicker: "The mayor's clock", counter: "08 / 09", src: "c22 c33 c46", fit: { min: 72, max: 96, maxLines: 2 } });
  TX.reseed(20261031);
  /* THE FIGURE, from figures.json: one saw cut groove per hour after certification, in rows of a day each */
  const nH = Math.round(FIG.hours_after_certification), PER = 24, rowsN = Math.ceil(nH / PER);
  const X0 = 140, PITCH = 36, GW = 9, GH = 124, RG = 46, Y0 = 676, SX0 = -20, SX1 = 1100;
  const SY0 = Y0 - 46, SY1 = Y0 + rowsN * (GH + RG) - RG + 46;
  const M = { ASPH: 0, CONC: 1, CUT: 2, TERRA: 3 };
  const asphH = (X, Y) => 0.5 * TX.fbm2(X * 0.09, Y * 0.09, 3) + 0.35 * TX.simplex2(X * 0.6, Y * 0.6);
  function sample(X, Y) {
    if (X < SX0 || X > SX1 || Y < SY0 || Y > SY1) return [asphH(X, Y), M.ASPH];
    const edge = Math.min(X - SX0, SX1 - X, Y - SY0, SY1 - Y), top = 14 * Math.min(1, edge / 4) + 0.25 * TX.fbm2(X * 0.1, Y * 0.1, 2);
    /* the terracotta start bar at the head of the first row */
    if (X > X0 - 66 && X < X0 - 22 && Y > Y0 && Y < Y0 + GH) return [top + 5 * Math.min(1, Math.min(X - X0 + 66, X0 - 22 - X, Y - Y0, Y0 + GH - Y) / 2.5), M.TERRA];
    const row = Math.floor((Y - Y0) / (GH + RG)), k = Math.floor((X - X0) / PITCH);
    if (row >= 0 && row < rowsN && k >= 0 && k < PER && row * PER + k < nH) {
      const gx = X0 + k * PITCH, gy = Y0 + row * (GH + RG);
      if (X >= gx && X <= gx + GW && Y >= gy && Y <= gy + GH) {
        /* a saw cut with a floor and a sloped far wall: the wall facing the key rises out of the floor and catches it */
        const u = (X - gx) / GW, w = Math.max(0, Math.min(1, (u - 0.45) / 0.55));
        return [top - 9 + 9 * w * w * (3 - 2 * w), w > 0.25 ? M.CONC : M.CUT];
      }
    }
    return [top, M.CONC];
  }
  const cache = new Map(), key = (X, Y) => (X * 4 | 0) + ',' + (Y * 4 | 0);
  const S = (X, Y) => { const kk = key(X, Y); let v = cache.get(kk); if (!v) { v = sample(X, Y); cache.set(kk, v); } return v; };
  const albedo = (X, Y, m) => {
    if (m === M.ASPH) { const a = 1 + 0.45 * TX.simplex2(X * 0.5, Y * 0.5); return [0.03 * a, 0.031 * a, 0.035 * a]; }
    if (m === M.CONC) { const a = 1 + 0.18 * TX.simplex2(X * 0.3, Y * 0.3) + 0.1 * TX.simplex2(X * 0.02, Y * 0.02); const st = TX.simplex2(X * 0.012, Y * 0.03) > 0.5 ? 0.75 : 1; return [0.13 * a * st, 0.13 * a * st, 0.124 * a * st]; }
    if (m === M.CUT) return [0.03, 0.03, 0.03];
    return [3.3, 1.0, 0.58];
  };
  const pool = (X, Y) => { const d = Math.hypot((X - 300) / 600, (Y - 760) / 380), t = Math.max(0, Math.min(1, (d - 0.35) / 0.8)); return 1 - 0.94 * t * t * (3 - 2 * t); };
  cx.fillStyle = '#09080c'; cx.fillRect(0, 0, 2160, 2700);
  const rep = TXBENCH.relief(cx, { x: 0, y: 560, w: 1080, h: 790, scale: 2, height: (X, Y) => S(X, Y)[0], material: (X, Y) => S(X, Y)[1], keyMask: pool, albedo,
    spec: { [M.CONC]: [0.1, 12], [M.TERRA]: [0.5, 30] }, keyColor: [1, 0.88, 0.74], ambColor: [0.55, 0.62, 0.8],
    ambient: 0.05, diffuse: 2.0, ao: 1.0, shadow: 0.92, softness: 3, castLength: 200 });
  { const g = cx.createLinearGradient(0, 1120, 0, 1250); g.addColorStop(0, 'rgba(9,8,12,1)'); g.addColorStop(1, 'rgba(9,8,12,0)'); cx.fillStyle = g; cx.fillRect(0, 1110, 2160, 140); }
  const el = document.getElementById('lab-a'); el.style.left = '80px'; el.style.top = (SY0 - 44) + 'px';
  cx.setTransform(2, 0, 0, 2, 0, 0);
  CH.post(cx, { a: 0.4, pad: 80, fade: 220, veil: 0.32, footWash: 0.5 });
  window.__relief = rep;
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
