<!doctype html>
<!-- BESPOKE, 2026-11-15, frame 3 of 9. THE LOCKER BANK: a hallway bank of a hundred cobalt steel lockers in five tiers,
     a material relief through txbench.js seen with a fifteen degree yaw so it recedes to the left, raked by the deck's key
     from the upper left. Sixty one doors stand swung out thirty five to fifty degrees on their left hinges, each slab
     catching the key on its face and throwing a hard cast across the door beside it. Inside every open one a small laptop
     on the hat shelf lights the walls and a backpack hangs under it. The rest are shut. The bank stands on a plum terrazzo
     floor that runs away in the same perspective, where the type sits. Counts read from window.FIG. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="left:80px; top:886px; width:920px; text-align:left">61% reported students using it too</h1>
<p class="dek" data-follow="18" style="left:82px; width:916px">Same leaders, same fall 2025 survey, per Texas 2036. Drawn to illustrate, one locker for each leader in a hundred. An open door marks reported student use.</p>

<script>window.FIG = {"per_hundred": 100, "student_use_of_100": 61};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script src="@@ASSETS@@/js/txlook.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-15-ruleroom-bespoke.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = (async () => {
  await document.fonts.ready;
  CH.start({ kicker: "Texas schools", counter: "03 / 09", src: "c2", fit: { min: 78, max: 92, maxLines: 2 } });
  const c = document.getElementById('art'), cx = c.getContext('2d'); cx.scale(2, 2);
  TX.reseed(CH.SEED + 3);
  const L = TXLOOK.lin, rng = CH.rng(20261115 + 303);

  /* ---------------- THE FIGURE ----------------
   * One locker per leader in a hundred (drawn to illustrate), five tiers of COLS. An open door marks reported student
   * use. Both counts come from window.FIG and are checked against what is built. */
  const ROWS = 5, N = FIG.per_hundred, COLS = N / ROWS;
  if (!Number.isInteger(COLS)) throw new Error('per_hundred does not split into ' + ROWS + ' tiers');
  const NOPEN = FIG.student_use_of_100;
  if (!(NOPEN >= 0 && NOPEN <= N && Number.isInteger(NOPEN))) throw new Error('student_use_of_100 is not a count of the hundred');
  const order = Array.from({ length: N }, (_, i) => i);
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const openSet = new Set(order.slice(0, NOPEN));
  const PACKS = ['#ff5c8a', '#2ec4b6', '#b48cff', '#e04fd0', '#ff7aa8', '#4fd1e8'];
  const doors = [];
  for (let r = 0; r < ROWS; r++) for (let k = 0; k < COLS; k++) {
    const i = r * COLS + k, open = openSet.has(i);
    doors.push({ r, k, open, th: open ? (40 + 10 * rng()) * Math.PI / 180 : 0, tint: rng(), dent: rng(), dev: rng(),
      pack: PACKS[Math.floor(rng() * PACKS.length)] });
  }
  const builtOpen = doors.filter(d => d.open).length;
  if (doors.length !== FIG.per_hundred) throw new Error('drew ' + doors.length + ' lockers, FIG says ' + FIG.per_hundred);
  if (builtOpen !== FIG.student_use_of_100) throw new Error('opened ' + builtOpen + ' doors, FIG says ' + FIG.student_use_of_100);

  /* ---------------- THE CAMERA ----------------
   * A pinhole looking down the hallway: the bank's plane is yawed PSI so it recedes to the left. The near end stands at
   * unit scale on the right edge; the far end's screen x is solved so the whole bank, all hundred doors, stays in frame. */
  const PSI = 15 * Math.PI / 180, F = 3000, CXP = 900, CYP = 325, XR = 1076, XL = 6;
  const U = [Math.cos(PSI), 0, -Math.sin(PSI)], NW = [Math.sin(PSI), 0, Math.cos(PSI)];   /* along the bank, into the wall */
  const B = (XR - XL) / (Math.cos(PSI) + (XL - CXP) * Math.sin(PSI) / F);                /* the bank's length in bank px */
  const O = [XR - CXP - B * U[0], -CYP, F - B * U[2]];                                    /* bank (0, 0) in camera space */
  const dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
  const nO = dot(NW, O);
  function onWall(X, Y) {
    const d = [(X - CXP) / F, (Y - CYP) / F, 1], dn = dot(NW, d), t = nO / dn;
    const P = [t * d[0] - O[0], t * d[1] - O[1], t * d[2] - O[2]];
    return { a: dot(P, U), b: P[1], s: F / t, cU: dot(d, U) / dn, d };
  }
  const toScreen = (a, b) => { const W = [O[0] + a * U[0], O[1] + b, O[2] + a * U[2]]; return [CXP + F * W[0] / W[2], CYP + F * W[1] / W[2]]; };

  /* ---------------- THE BANK, in bank px ---------------- */
  const CT = 10, CB = 114, GY1 = 846, BASE1 = 880;
  const GX0 = 12, GX1 = B - 12, PX = (GX1 - GX0) / COLS, PY = (GY1 - CB) / ROWS;
  const ST = 3, GAP = 1.3, DW = PX - 2 * ST, DH = PY - 8;
  const FF = 8, DF = 9.5, K = 1.5, CAV = -28, SHELF = 44;
  const M = { wall: 0, crown: 1, frame: 2, door: 3, edge: 4, groove: 5, slit: 6, chrome: 7, plate: 8, cav: 9, shelf: 10,
    screen: 11, bezel: 12, plinth: 13, floor: 14, cap: 15, hook: 16, strip: 17, pack: 18, packDark: 19, laptop: 20 };
  const sstep = (a, b, t) => { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); };

  /* the divider strips are knocked out behind the type, feathered over 36 px, so no strip runs through a glyph */
  const TYPEBOX = ['hook', 'site'].map(id => document.getElementById(id).getBoundingClientRect())
    .concat(Array.from(document.querySelectorAll('.dek, .src')).map(e => e.getBoundingClientRect()));
  const clearOfType = (X, Y) => { let dmin = 1e9; for (const b of TYPEBOX) { const dx = Math.max(b.left - 14 - X, 0, X - b.right - 14), dy = Math.max(b.top - 10 - Y, 0, Y - b.bottom - 10); dmin = Math.min(dmin, Math.hypot(dx, dy)); } return Math.min(1, dmin / 36); };

  /* details on a door face in door local u (0 hinge .. DW free edge), v (0 top .. DH) */
  function doorFace(u, v, d) {
    const e = Math.min(u, DW - u, v, DH - v);
    let h = DF - 1.6 * (1 - sstep(0, 2.2, e));
    if (u > 5 && u < DW - 5 && v > 46 && v < DH - 36) h += 0.7 * sstep(0, 2, Math.min(u - 5, DW - 5 - u, v - 46, DH - 36 - v));
    const louv = (vs) => { if (Math.abs(u - DW / 2) > 14) return null; const t = v - vs, end = 14 - Math.abs(u - DW / 2), ef = sstep(0, 1.5, end);
      if (t >= -2.2 && t < 0) return [h + 1.5 * ef * Math.sin((t + 2.2) / 2.2 * Math.PI / 2), M.door];
      if (t >= 0 && t < 1.3) return [h - 2.4 * ef, ef > 0.3 ? M.slit : M.door]; return null; };
    for (let s = 0; s < 4; s++) { const q = louv(9 + s * 7); if (q) return q; }
    for (let s = 0; s < 3; s++) { const q = louv(DH - 27 + s * 7); if (q) return q; }
    const hu = DW - 10, hv = DH * 0.46, du = Math.abs(u - hu), dv = Math.abs(v - hv);
    if (du < 4.5 && dv < 13) {
      const ce = Math.min(4.5 - du, 13 - dv), cup = h - 2.6 * sstep(0, 1.6, ce);
      if (du < 2 && dv < 6) return [cup + 2.6 + 0.8 * sstep(0, 1, Math.min(2 - du, 6 - dv)), M.chrome];
      return [cup, M.groove];
    }
    const pu = Math.abs(u - DW / 2), pv = Math.abs(v - 40);
    if (pu < 9 && pv < 3.2) return [h + 0.7 * sstep(0, 0.8, Math.min(9 - pu, 3.2 - pv)), M.plate];
    h += 0.12 * TX.fbm2(u / 3 + d.k * 7, v / 3 + d.r * 5, 2);
    if (d.dent > 0.82) { const dd = Math.hypot(u - DW * 0.4, v - DH * (0.55 + 0.3 * d.tint)); if (dd < 7) h -= 0.6 * (1 - dd / 7) ** 2; }
    return [h, M.door];
  }

  /* inside an open locker, door local u, v: the hat shelf, a small laptop open on it, a backpack on the hook under it */
  const lapBox = (d) => ({ u0: DW - 34 + 3 * d.dev, u1: DW - 3, v0: 14, v1: SHELF - 4 });
  const packBox = (d) => ({ u0: DW - 31 + 4 * d.dev, u1: DW - 2.5, v0: SHELF + 11, v1: DH - 7 - 8 * d.tint });
  function cavity(u, v, d) {
    const e = Math.min(u, DW - u, v, DH - v);
    const lp = lapBox(d);
    if (u > lp.u0 && u < lp.u1 && v > lp.v0 && v < lp.v1) {                        /* the lid, leaning back, its screen lit */
      const be = Math.min(u - lp.u0, lp.u1 - u, v - lp.v0, lp.v1 - v);
      return [CAV + 10 + 6 * (v - lp.v0) / (lp.v1 - lp.v0), be < 1.6 ? M.laptop : M.screen];
    }
    if (u > lp.u0 - 1 && u < lp.u1 + 1 && v >= lp.v1 && v < SHELF) return [CAV + 17, M.laptop];   /* the keyboard deck */
    if (v >= SHELF && v < SHELF + 4) return [CAV + 12 * sstep(SHELF, SHELF + 1, v), M.shelf];      /* the shelf's front */
    if (v >= SHELF + 4 && v < SHELF + 6.5) return [CAV + 2, M.cav];
    const pb = packBox(d), pw = (pb.u1 - pb.u0) / 2, pcx = (pb.u0 + pb.u1) / 2;
    if (Math.abs(u - pcx) < 1.4 && v > SHELF + 6 && v < pb.v0 + 2) return [CAV + 9, M.hook];        /* hook and grab loop */
    if (v > pb.v0 && v < pb.v1 && Math.abs(u - pcx) < pw) {
      const nu = (u - pcx) / pw, nv = (v - (pb.v0 + pb.v1) / 2) / ((pb.v1 - pb.v0) / 2);
      const top = v < pb.v0 + 8 ? Math.sqrt(Math.max(0, 1 - ((pb.v0 + 8 - v) / 8) ** 2)) : 1;     /* a rounded top */
      const w = Math.abs(nu) / Math.max(0.05, top);
      if (w < 1) {
        let h = CAV + 6 + 16 * Math.sqrt(Math.max(0, 1 - w * w)) * Math.sqrt(Math.max(0, 1 - nv * nv * 0.6));
        const pk = nv > 0.15 && nv < 0.85 && Math.abs(nu) < 0.72;                                    /* front pocket */
        if (pk) h += 4 * sstep(0, 0.12, Math.min(nv - 0.15, 0.85 - nv, 0.72 - Math.abs(nu)));
        if (Math.abs(nv - 0.15) < 0.035 && Math.abs(nu) < 0.7) return [h - 1.2, M.packDark];      /* its zip */
        if (Math.abs(Math.abs(nu) - 0.55) < 0.06 && nv < 0.1) return [h + 0.8, M.packDark];        /* straps seam */
        return [h + 0.25 * TX.fbm2(u * 1.5, v * 1.5, 2), M.pack];
      }
    }
    return [CAV + 6 * (1 - sstep(0, 3, e)) + 0.2 * TX.fbm2(u / 4, v / 4, 2), M.cav];
  }

  /* one sample of the scene: the bank, the wall it is set in, or the floor in front of it. Returns [height, material] in
   * screen px (bank heights scale with distance) and remembers the door it hit for the albedo. */
  let lx = -1, ly = -1, lh = 0, lm = 0, ld = null;
  function bankAt(w) {
    const a = w.a, b = w.b, s = w.s;
    const sideE = Math.min(a, B - a);
    if (b < CB) {
      if (b < CT + 20) return [4 + 9 * sstep(0, 20, b - CT) - 2 * (1 - sstep(0, 2, sideE)), M.cap];
      return [12 - 1.5 * (1 - sstep(0, 2.5, Math.min(sideE, CB - b, b - CT - 20))), M.crown];
    }
    if (b >= GY1) return [2.5 + 0.3 * TX.fbm2(a / 4, b / 30, 2), M.plinth];
    if (a < GX0 || a > GX1) return [12 - 2 * (1 - sstep(0, 3, sideE)), M.frame];
    const k = Math.min(COLS - 1, Math.floor((a - GX0) / PX)), r = Math.min(ROWS - 1, Math.floor((b - CB) / PY));
    const d = doors[r * COLS + k]; ld = d;
    const x0 = GX0 + k * PX + ST, y0 = CB + r * PY + 4, u0 = a - x0, v = b - y0;
    if (u0 < -GAP || u0 > DW + GAP || v < -GAP || v > DH + GAP) return [FF, M.frame];
    if (!d.open) { if (u0 < 0 || u0 > DW || v < 0 || v > DH) return [4, M.groove]; return doorFace(u0, v, d); }
    if (u0 < 0 || u0 > DW || v < 0 || v > DH) return [CAV + 8, M.cav];
    /* the slab, swung out th about its left hinge. Seen down the hallway its raised free edge slides toward the hinge by
     * its height times the ray's slant (cU), so the apparent slab is wp wide and the opening beside it shows. */
    const ct = Math.cos(d.th), st = Math.sin(d.th), hEdge = K * DW * st;
    const wp = Math.max(0.16 * DW, Math.min(DW - 6, DW * ct + 0.4 * w.cU * hEdge));
    if (u0 <= wp) { const u = u0 * DW / wp, q = doorFace(u, v, d); return [q[0] + K * u * st, q[1]]; }
    if (u0 <= wp + 3.2) return [DF + hEdge - 0.5 * (u0 - wp), M.edge];
    return cavity(u0, v, d);
  }
  function geo(X, Y) {
    if (X === lx && Y === ly) return; lx = X; ly = Y; ld = null;
    const w = onWall(X, Y);
    if (w.b >= BASE1) {
      /* the floor: where the ray meets the ground in front of the bank */
      const d = w.d, t = (BASE1 - CYP) / d[1], P = [t * d[0] - O[0], t * d[1] - O[1], t * d[2] - O[2]];
      const ga = dot(P, U), gd = -dot(P, NW), sg = F / t;
      if (gd < 7) { lh = 4 * sg * (1 - sstep(0, 7, gd)); lm = M.plinth; return; }
      const hw = 1.9, sa = Math.abs(ga - Math.round(ga / 96) * 96), sd = Math.abs(gd - 7 - Math.round((gd - 7) / 96) * 96);
      const ct = clearOfType(X, Y);
      if ((sa < hw || sd < hw) && ct > 0.02) { lh = 0.5 * ct; lm = M.strip; return; }
      lh = 0.12 * TX.fbm2(X / 9, Y / 9, 2); lm = M.floor; return;
    }
    if (w.a < 0 || w.a > B || w.b < CT) {
      const mx = ((w.a + (Math.floor(w.b / 26) % 2) * 28) % 56 + 56) % 56, my = ((w.b % 26) + 26) % 26;
      lh = (-3 - (mx < 1.5 || my < 1.5 ? 1.2 : 0)) * w.s + 0.3 * TX.fbm2(w.a / 5, w.b / 5, 2); lm = M.wall; return;
    }
    const q = bankAt(w); lh = q[0] * w.s; lm = q[1];
  }
  const height = (X, Y) => (geo(X, Y), lh), material = (X, Y) => (geo(X, Y), lm);

  /* ---------------- ALBEDO: cobalt steel, violet insides, bright packs, plum terrazzo; nothing amber ---------------- */
  const albedo = (X, Y, m) => {
    const n = TX.fbm2(X / 7, Y / 7, 2);
    const door = () => { lx = -1; geo(X, Y); return ld; };
    switch (m) {
      case M.door: { const d = door() || { tint: 0.5 }; const base = d.tint > 0.9 ? '#6a8cf8' : d.tint < 0.06 ? '#4a6ae0' : '#567ff2'; return L(base, 0.95 + 0.07 * n); }
      case M.edge: return L('#ffe6d6', 1.05);
      case M.frame: return L('#3c5ed8', 0.92 + 0.06 * n);
      case M.groove: return L('#22307e', 0.9);
      case M.slit: return L('#1c1656', 0.9);
      case M.chrome: return L('#e4ebf8', 0.95);
      case M.plate: return L('#cdd6ea', 0.9 + 0.08 * TX.fbm2(X / 1.2, Y / 9, 1));
      case M.cav: return L('#6c38ae', 0.85 + 0.08 * n);
      case M.shelf: return L('#8a4cc4', 0.95);
      case M.hook: return L('#d6dcf0', 0.9);
      case M.screen: return L('#8fe6ff', 1.2);
      case M.bezel: case M.laptop: return L('#b9c0d8', 0.8);
      case M.pack: { const d = door(); return L(d ? d.pack : '#ff5c8a', 0.92 + 0.1 * TX.fbm2(X / 2, Y / 2, 2)); }
      case M.packDark: return L('#2a1a50', 1);
      case M.cap: return L('#6a8af4', 0.95);
      case M.crown: return L('#3048b4', 0.95 + 0.05 * n);
      case M.plinth: return L('#3b1f5e', 0.95 + 0.1 * n);
      case M.wall: return L('#6a3e9e', 0.9 + 0.08 * n);
      case M.strip: { const w = clearOfType(X, Y), a = L('#d2c4ec', 0.85), b = L('#9a52b4', 0.95); return a.map((v, i) => b[i] + (v - b[i]) * w); }
      case M.floor: {
        const w = onWall(X, Y), d = w.d, t = (BASE1 - CYP) / d[1], P = [t * d[0] - O[0], t * d[1] - O[1], t * d[2] - O[2]];
        const A = dot(P, U) / 5, Bq = -dot(P, NW) / 5, ci = Math.floor(A), cj = Math.floor(Bq);
        for (let a = ci - 1; a <= ci + 1; a++) for (let b = cj - 1; b <= cj + 1; b++) {
          const hs = Math.sin(a * 127.1 + b * 311.7) * 43758.5453, f = hs - Math.floor(hs); if (f > 0.42) continue;
          const h2 = Math.sin(a * 269.5 + b * 183.3) * 43758.5453, f2 = h2 - Math.floor(h2), h3 = Math.sin(a * 419.2 + b * 371.9) * 43758.5453, f3 = h3 - Math.floor(h3);
          if (Math.hypot(A - a - f2, Bq - b - f3) < 0.12 + 0.55 * f) return f < 0.1 ? L('#ecd2f8', 0.85) : f < 0.22 ? L('#e07ab8', 0.85) : L('#7a90f0', 0.85);
        }
        return L('#9a52b4', 0.92 + 0.08 * TX.fbm2(X / 60, Y / 60, 2));
      }
    }
    return L('#ff00ff');
  };

  /* THE KEY: a hallway window high on the left, toward the far end. Its warm pool falls across the bank and fades toward
   * the near lower right, so one side of the hall is warm and lit and the other leans into violet shade. */
  const keyMask = (X, Y) => 0.24 + 0.9 * (1 - sstep(60, 1300, 0.62 * X + 0.78 * Y));
  TXBENCH.relief(cx, { ...TXLOOK.reliefLight(), keyColor: L('#ffc09a', 1.4), keyMask, ambColor: L('#8f86ff', 1.0), x: 0, y: 0, w: 1080, h: 1350, scale: 2, height, material, albedo,
    spec: { [M.door]: [0.35, 36], [M.edge]: [0.7, 40], [M.frame]: [0.25, 30], [M.chrome]: [1.1, 90], [M.plate]: [0.7, 50],
      [M.screen]: [0.5, 60], [M.cap]: [0.4, 40], [M.crown]: [0.2, 24], [M.floor]: [0.4, 50], [M.hook]: [0.8, 60], [M.strip]: [0.9, 60],
      [M.laptop]: [0.7, 50], [M.pack]: [0.15, 16] },
    ambient: 0.56, diffuse: 1.8, ao: 0.85, shadow: 0.92, softness: 1.4, castLength: 160, dither: true });

  /* ---------------- THE LAPTOPS' OWN LIGHT ----------------
   * Each open locker's laptop lights the inside: a cool spill over the walls, the shelf and the top of the backpack,
   * clipped to the opening beside the slab, and a chat thread on its screen. */
  const quad = (pts) => { cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]); cx.closePath(); };
  for (const d of doors) {
    if (!d.open) continue;
    const x0 = GX0 + d.k * PX + ST, y0 = CB + d.r * PY + 4;
    const mid = toScreen(x0 + DW / 2, y0 + DH / 2), w = onWall(mid[0], mid[1]);
    const hEdge = K * DW * Math.sin(d.th), wp = Math.max(0.16 * DW, Math.min(DW - 6, DW * Math.cos(d.th) + 0.4 * w.cU * hEdge));
    const lp = lapBox(d), a0 = Math.max(x0 + wp + 3.2, x0 + lp.u0 + 1.6), a1 = x0 + lp.u1 - 1.6;
    const sc = toScreen((x0 + lp.u0 + x0 + lp.u1) / 2, y0 + (lp.v0 + lp.v1) / 2);
    cx.save();
    /* first a soft halo that leaks out of the opening onto the frame and the swung door's inner edge */
    cx.globalCompositeOperation = 'lighter';
    const hg = cx.createRadialGradient(sc[0], sc[1] + 10, 2, sc[0], sc[1] + 10, 46 * w.s);
    hg.addColorStop(0, 'rgba(90,200,255,0.22)'); hg.addColorStop(1, 'rgba(60,120,255,0)');
    cx.fillStyle = hg; cx.fillRect(sc[0] - 60, sc[1] - 50, 120, 130);
    quad([toScreen(x0 + wp - 2, y0), toScreen(x0 + DW, y0), toScreen(x0 + DW, y0 + DH), toScreen(x0 + wp - 2, y0 + DH)]); cx.clip();
    const g = cx.createRadialGradient(sc[0], sc[1] + 6, 2, sc[0], sc[1] + 6, 95 * w.s);
    g.addColorStop(0, 'rgba(110,220,255,0.75)'); g.addColorStop(0.35, 'rgba(80,190,255,0.42)'); g.addColorStop(0.7, 'rgba(70,130,255,0.14)'); g.addColorStop(1, 'rgba(70,90,255,0)');
    cx.fillStyle = g; cx.fillRect(sc[0] - 110, sc[1] - 110, 220, 260);
    if (a1 - a0 > 2) {
      const v0 = y0 + lp.v0 + 1.6, v1 = y0 + lp.v1 - 1.6;
      cx.fillStyle = 'rgba(90,210,255,0.35)'; quad([toScreen(a0, v0), toScreen(a1, v0), toScreen(a1, v1), toScreen(a0, v1)]); cx.fill();
      cx.globalCompositeOperation = 'source-over';
      const bub = (f0, f1, g0, g1, col) => { cx.fillStyle = col; quad([toScreen(a0 + (a1 - a0) * f0, v0 + (v1 - v0) * g0), toScreen(a0 + (a1 - a0) * f1, v0 + (v1 - v0) * g0), toScreen(a0 + (a1 - a0) * f1, v0 + (v1 - v0) * g1), toScreen(a0 + (a1 - a0) * f0, v0 + (v1 - v0) * g1)]); cx.fill(); };
      bub(0.08, 0.7, 0.14, 0.34, 'rgba(50,80,200,0.6)');
      bub(0.35, 0.92, 0.44, 0.66, 'rgba(255,255,255,0.75)');
      bub(0.08, 0.6, 0.76, 0.92, 'rgba(50,80,200,0.5)');
    }
    cx.restore();
  }

  /* seat the type on the floor, and the furniture */
  CH.seat(cx, { a: 0.4, fade: 140 });
  TXLOOK.footWash(cx, { a: 0.32, height: 150 });
  TXDECK.finish(cx);
  return true;
})();
