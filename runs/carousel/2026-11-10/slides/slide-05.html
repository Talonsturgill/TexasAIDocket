<!doctype html>
<!-- 2026-11-10, frame 5 of 9. Archetype DIAGRAM. The frame 4 section and bench with its state moved: the vesicle's inner core and the flat bilayer's core joined by one raised graphite band where the heads part, two copper bundles standing each side of it. The local detergent model, drawn to illustrate. Drawn to illustrate, never the lab's structure or a frame of its simulation. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">SNAREs act as a local detergent</h1>
<p class="dek" data-follow="26" style="width:880px">Rizo-Rey calls it the local detergent model of membrane fusion. In it the SNAREs catalyze mixing of the hydrophobic interiors of the two membranes. Drawn to illustrate, not a frame from the simulation.</p>
<script>window.FIG = {"snares": 4};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-10-tray.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
function lead(cx, a, b) { cx.save(); cx.strokeStyle = 'rgba(237,230,214,0.9)'; cx.fillStyle = cx.strokeStyle; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke(); cx.beginPath(); cx.arc(b[0], b[1], 5, 0, 7); cx.fill(); cx.restore(); }
window.renderReady = (async () => {
  const cx = await CH.bootFlat({ kicker: "The local detergent model", counter: "05 / 09", src: "c13 c14 c34", fit: { min: 80, max: 100, maxLines: 2 } });
  cx.scale(2, 2); TX.reseed(20261110);
  /* THE SECTION. A bilayer is two leaflets of lipids, heads out and tails in. Heads are steel beads, the tail core is
   * graphite with fine tail ridges running across the membrane, so the beam from the upper left catches them. */
  const HEAD_R = 9.5, PITCH = 20.5, THICK = 128;                 /* drawing units, not to scale */
  const FY = 1100;                                               /* the flat bilayer's mid plane */
  const VC = [420, 150], VR = 790;                               /* the vesicle's mid surface, a circle */
  /* THE FIGURE: snares bundles, spaced along the cleft where the two membranes come closest */
  const N = FIG.snares, JX = 420, JW = 84, BX = []; for (let i = 0; i < N; i++) BX.push(JX + (i < N / 2 ? -1 : 1) * (JW + 58 + (i % (N / 2)) * 62) * (i < N / 2 ? 1 : 1));
  BX.sort((a, b) => a - b);
  function membrane(d, s) {   /* d = signed distance from the mid surface (outward +), s = arc length along it */
    const a = Math.abs(d);
    if (a > THICK / 2 + HEAD_R) return null;
    const hc = THICK / 2 - HEAD_R * 0.2;                         /* head row centre line */
    if (a > hc - HEAD_R * 1.1) {                                 /* the head row: packed domes */
      const k = Math.round(s / PITCH), ds = s - k * PITCH, dr = a - hc, r2 = ds * ds + dr * dr;
      if (r2 < HEAD_R * HEAD_R) return [16 + Math.sqrt(HEAD_R * HEAD_R - r2) * 1.4, 1];
      return [3, 5];
    }
    const ridge = 0.5 + 0.5 * Math.cos((s / PITCH) * Math.PI * 2);  /* two tails per head, a fine ridge each */
    return [5 + 1.2 * ridge, 6];
  }
  function bundle(X, Y) {   /* a coiled pair of helices standing in the cleft, copper */
    for (const bx of BX) {
      const yTop = VC[1] + Math.sqrt(Math.max(0, VR * VR - (bx - VC[0]) * (bx - VC[0]))) + THICK / 2 - 10, yBot = FY - THICK / 2 + 10;
      if (Y < yTop || Y > yBot) continue;
      const u = X - bx; if (Math.abs(u) > 22) continue;
      const tw = Math.sin((Y - yTop) * 0.16) * 10, w1 = Math.abs(u - tw), w2 = Math.abs(u + tw);
      const w = Math.min(w1, w2); if (w > 10.5) continue;
      return [34 + Math.sqrt(110 - Math.min(110, w * w)) * 1.5, 2];
    }
    return null;
  }
  /* round 2: the join is a fusion neck, not a box. The two outer head rows bend into each other round a half circle on
   * each side, the way a stalk is drawn, and the graphite core runs through the waist at the membranes' own core height
   * with the flat bilayer's own ridges, so the change of state reads as two cores merging */
  const HC = THICK / 2 - HEAD_R * 0.2;                           /* head row centre line, as in membrane() */
  const YV = VC[1] + Math.sqrt(Math.max(0, VR * VR - (JX - VC[0]) * (JX - VC[0])));
  const YA = YV + HC, YB = FY - HC, YM = (YA + YB) / 2, RF = (YB - YA) / 2;   /* the two outer head rows and the fillet radius */
  const NK0 = 70, XC = NK0 + HEAD_R + RF;                        /* the waist's half width and the fillet centres' offset */
  const NB = Math.max(2, Math.round(Math.PI * RF / PITCH)), SP = Math.PI * RF / NB;
  function join(X, Y) {
    if (Y < YV || Y > FY) return null;
    const dx = Math.abs(X - JX); if (dx > XC) return null;
    const rho = Math.hypot(dx - XC, Y - YM);
    if (Math.abs(rho - RF) < HEAD_R * 1.1) {                     /* heads lining the neck, round the half circle */
      const sArc = Math.atan2(Y - YM, XC - dx) * RF + Math.PI * RF / 2, k = Math.round(sArc / SP), ds = sArc - k * SP, dr = rho - RF, r2 = ds * ds + dr * dr;
      return r2 < HEAD_R * HEAD_R ? [16 + Math.sqrt(HEAD_R * HEAD_R - r2) * 1.4, 1] : [3, 5];
    }
    if (rho < RF) return null;                                   /* the cleft, beside the neck */
    /* the merged core carries the vesicle's own ridges above the waist and the flat bilayer's below, blended across it,
     * so no seam shows where the neck meets either membrane */
    const rv = 0.5 + 0.5 * Math.cos((Math.atan2(Y - VC[1], X - VC[0]) * VR / PITCH) * Math.PI * 2), rf = 0.5 + 0.5 * Math.cos((X / PITCH) * Math.PI * 2);
    const t = Math.min(1, Math.max(0, (Y - (YM - RF)) / (2 * RF))), rj = rv + (rf - rv) * t * t * (3 - 2 * t);
    return [5 + 1.2 * rj, 6];   /* the merged core */
  }
  function surf(X, Y) {
    const j = join(X, Y); if (j) return j;
    const b = bundle(X, Y); if (b) return b;
    const dv = Math.hypot(X - VC[0], Y - VC[1]) - VR, sv = Math.atan2(Y - VC[1], X - VC[0]) * VR;
    const mv = membrane(dv, sv); if (mv) return mv;
    const mf = membrane(Y - FY, X); if (mf) return mf;
    return [0, 0];
  }
  /* round 3: the camera pushed in 1.25x on the fusion neck, which sits at (480, 960) on the frame, so the neck and the
   * four bundles carry the middle third at feed size; heights scale with it so the light reads the same slopes */
  const ZM = 1.25, AX = 480, AY = 960, wx = X => JX + (X - AX) / ZM, wy = Y => YM + (Y - AY) / ZM;
  const height = (X, Y) => surf(wx(X), wy(Y))[0] * ZM, material = (X, Y) => surf(wx(X), wy(Y))[1];
  TXBENCH.relief(cx, CH.reliefOpts({ x: 0, y: 0, w: 1080, h: 1350, height, material, castLength: 200 }));
  CH.typeDark(cx, { a: 0.55 });
  CH.footWash(cx, { a: 0.5 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
