<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Still short", counter: "07 / 09", src: "c41 c47 c51", fit: { min: 72, max: 96, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 34, near: 0.05, far: 3000 });
  /* THE FIGURES, from figures.json: arc_cot_base 77.2 sets the brass datum and gap_arc_pct 17.3 is how far
   * under it the best repaired model stopped, both at the deck's CH.S metres per point. The repaired
   * stair's rise is the base less the shortfall, computed here and printed nowhere */
  const ARC_BASE = FIG.arc_cot_base, GAP_ARC = FIG.gap_arc_pct;
  const rise = (ARC_BASE - GAP_ARC) * CH.S;
  const stair = K.make('stair_flight', { rise, dose: 0, landing: 1.6, fresh: true, seed: 17 });
  TXT.add(R, stair);
  /* the repaired landing is fresh sawn limestone, paler than the wall it stops short under */
  stair.traverse((m) => { if (!m.isMesh) return; m.geometry.computeBoundingBox(); const b = m.geometry.boundingBox; if (m.position.y > rise - 0.12 && b.max.z - b.min.z > 1.2) m.material = CH.limeMat(K, true); });
  const zf = stair.userData.landingZ, L = 1.6;
  const wall = K.make('datum_wall', { length: 20, height: ARC_BASE * CH.S + 0.45, datum: ARC_BASE * CH.S, seed: 12 });
  wall.position.set(-5.5, 0, zf - L - 0.25); TXT.add(R, wall);
  /* the metal's base is held dark on this frame, so its face glows in the accent instead of mirroring the sky */
  CH.brassMat(THREE).color.set(0x7a4c2c);
  /* the wall stands behind the subject and is held a step darker, so the fresh landing is the light mass */
  wall.traverse((m) => { if (m.isMesh && m.material && m.material.map) m.material.color.multiplyScalar(0.45); });
  TXT.ground(R, { surface: 'caliche', size: 600, color: 0x5a5244, seed: 27, tile: 4 });
  /* a three quarter view from the stair's open side: the whole repaired flight climbs into frame to its landing,
   * the brass line on the wall above it, and the wall falls to background (flow critic, no. 57) */
  const from = [5.4, 2.4, 1.6];
  const look = CH.aim(THREE, R, TXT, from, [0, rise * 0.7, zf * 0.7], 560, 1000, 34);
  TXT.frame(R, { fov: 34, from, look });
  TXT.sky(R);
  CH.warm(R, 0.25);
  { const spec = CH.rigSpec(W, 14, 4096); TXT.deckRig(R, spec, CH.rigOpts([-1, rise, zf - 1], { distance: 40, shadowFar: 120 })); }
  CH.unacne(R, 0.02);
  TXT.contact(R, stair);
  TXT.stage(R, stair, { behind: 0.3, depth: 1.3, poolInner: 2.4, poolOuter: 6.5 });
  TXT.weather(R, { grime: 0.25, height: 0.4, mottle: 0.3 });
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.35, veil: 0.2, footWash: 0.45 });
  CH.knock(cx, [".tx-site", ".src"], 0.5);
  TXDECK.finish(cx);
  return true;
})();
