<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#2A3134}
  canvas#art{position:absolute;inset:0;width:1080px;height:1350px;display:block}
  .wrap{position:absolute;inset:0;width:1080px;height:1350px}
  .tscrim{position:absolute;left:0;top:0;width:1080px;height:470px;
     background:linear-gradient(to bottom,rgba(38,45,47,.96) 0%,rgba(38,45,47,.94) 66%,rgba(38,45,47,0) 100%)}
  .fscrim{position:absolute;left:0;bottom:0;width:1080px;height:176px;
     background:linear-gradient(to bottom,rgba(38,45,47,0) 0%,rgba(38,45,47,.86) 50%,rgba(38,45,47,.98) 100%)}
  .mast{position:absolute;top:84px;left:80px;font-family:"JetBrains Mono",monospace;
        font-weight:500;font-size:26px;letter-spacing:.16em;color:#A3B0AC}
  h1{position:absolute;top:162px;left:80px;width:900px;margin:0;font-family:Fraunces,serif;
     font-weight:800;font-size:76px;line-height:1.04;color:#E6ECEA;letter-spacing:-.018em}
  .dek{position:absolute;top:334px;left:80px;width:880px;margin:0;font-family:Manrope,sans-serif;
       font-weight:500;font-size:28px;line-height:1.34;color:#A9AEA4}
  .foot{position:absolute;bottom:76px;left:80px;right:80px;display:flex;justify-content:space-between;
        gap:26px;white-space:nowrap;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
        letter-spacing:.05em;color:#A9AEA4;font-variant-numeric:tabular-nums}
  svg#lay{position:absolute;inset:0;width:1080px;height:1350px}
  .rlab{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;letter-spacing:.04em;fill:#8FA0A6}
  .nlab{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:26px;letter-spacing:.05em;fill:#C3D4DE}
  .plane{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;letter-spacing:.12em;fill:#9CAAAE}
</style></head>
<body>
<canvas id="art"></canvas>
<div class="wrap">
  <div class="tscrim" data-decorative></div>
  <div class="mast">TEXAS AI DOCKET</div>
  <h1>Six were invited. Three came south.</h1>
  <p class="dek">Six companies were invited to the Maryland Test Facility. Three solutions were carried forward for data collection at the bridge.</p>
  <div class="fscrim" data-decorative></div>
  <div class="foot"><span>SELECTION</span><span>c3 c4</span><span class="tx-site">texasaidocket.com</span><span>03 / 09</span></div>
</div>
<svg id="lay" viewBox="0 0 1080 1350"></svg>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script>
window.renderReady = (async () => {
  const W=1080,H=1350;
  const c=document.getElementById('art'); c.width=W*2; c.height=H*2;
  const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260904); const R=TX.rng(20260904);

  const BAFFLE='#0D1013', LED='#C3D4DE', HOUSING='#2B343E';
  g.fillStyle='#2A3134'; g.fillRect(0,0,W,H);

  // THE OBJECT PLANE at the top and the IMAGE PLANE at the bottom, split by a hard break at
  // the element line. Six and three are counts of DIFFERENT THINGS, so they never share a
  // baseline and no reader can compute one over the other.
  const OBJ_Y=568, ELEM_Y=830, IMG_Y=1024;
  const objX = i => 132 + i*(816/5);          // six bundles across the object plane
  const imgX = i => 246 + i*294;              // three landings, on their own spacing

  // six ray bundles, each an emissive stroke with a falloff along its own length
  for(let i=0;i<6;i++){
    const x0=objX(i), x1=540 + (x0-540)*0.22;
    for(let k=-2;k<=2;k++){
      const off=k*3.2;
      const grd=g.createLinearGradient(x0,OBJ_Y,x1,ELEM_Y);
      const a=(k===0?0.60:0.24);
      grd.addColorStop(0,'rgba(195,212,222,'+(a*0.30).toFixed(3)+')');
      grd.addColorStop(.55,'rgba(195,212,222,'+a.toFixed(3)+')');
      grd.addColorStop(1,'rgba(195,212,222,'+(a*0.72).toFixed(3)+')');
      g.strokeStyle=grd; g.lineWidth=(k===0?2.0:1.1);
      g.beginPath(); g.moveTo(x0+off,OBJ_Y); g.lineTo(x1+off*0.3,ELEM_Y-16); g.stroke();
    }
    // the object-plane tick each bundle leaves from
    g.fillStyle='rgba(195,212,222,.52)'; g.fillRect(x0-13,OBJ_Y-2.4,26,2.4);
  }

  // THE ELEMENT. The one modeled solid on an otherwise linear frame, with real thickness,
  // two curved faces, and the coating bloom that is the lightest area here.
  (function element(){
    const cxm=540, halfW=380, th=44;
    g.beginPath();
    g.moveTo(cxm-halfW, ELEM_Y);
    g.bezierCurveTo(cxm-halfW*0.4, ELEM_Y-th*0.92, cxm+halfW*0.4, ELEM_Y-th*0.92, cxm+halfW, ELEM_Y);
    g.bezierCurveTo(cxm+halfW*0.4, ELEM_Y+th*0.92, cxm-halfW*0.4, ELEM_Y+th*0.92, cxm-halfW, ELEM_Y);
    g.closePath();
    const gr=g.createLinearGradient(cxm-halfW,ELEM_Y-th,cxm+halfW*0.5,ELEM_Y+th);
    gr.addColorStop(0,'rgba(43,52,62,.96)'); gr.addColorStop(.34,'rgba(150,178,190,.86)');
    gr.addColorStop(.52,'rgba(196,214,222,.94)'); gr.addColorStop(.72,'rgba(88,110,122,.90)');
    gr.addColorStop(1,'rgba(30,38,45,.96)');
    g.fillStyle=gr; g.fill();
    g.strokeStyle='rgba(214,230,236,.72)'; g.lineWidth=1.4; g.stroke();
  })();

  // three image points landing on drawn knife-edge baffles with real thickness
  for(let i=0;i<3;i++){
    const x=imgX(i);
    for(let k=-1;k<=1;k++){
      const grd=g.createLinearGradient(540,ELEM_Y+16,x,IMG_Y);
      grd.addColorStop(0,'rgba(195,212,222,.62)'); grd.addColorStop(1,'rgba(195,212,222,.30)');
      g.strokeStyle=grd; g.lineWidth=(k===0?2.2:1.2);
      g.beginPath(); g.moveTo(540+k*30,ELEM_Y+16); g.lineTo(x+k*7,IMG_Y-14); g.stroke();
    }
    // the baffle: a lit top land, a body, and a shaded inner face
    g.fillStyle=HOUSING; g.fillRect(x-96,IMG_Y-12,192,26);
    g.fillStyle='rgba(195,212,222,.46)'; g.fillRect(x-96,IMG_Y-12,192,2.8);
    g.fillStyle='rgba(0,0,0,.50)'; g.fillRect(x-96,IMG_Y+8,192,6);
    // the landing itself, a small bright area on the land
    const gr=g.createRadialGradient(x,IMG_Y-11,1,x,IMG_Y-11,26);
    gr.addColorStop(0,'rgba(230,240,244,.90)'); gr.addColorStop(1,'rgba(230,240,244,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,IMG_Y-11,26,0,6.2832); g.fill();
  }

  // THE HARD BREAK at the element line. This is what stops six and three sharing a scale.
  g.strokeStyle='rgba(143,160,166,.34)'; g.lineWidth=1; g.setLineDash([9,7]);
  g.beginPath(); g.moveTo(56,ELEM_Y+62); g.lineTo(W-56,ELEM_Y+62); g.stroke(); g.setLineDash([]);

  (function grain(){
    for(let k=0;k<22000;k++){
      const x=R()*W, y=R()*H;
      g.fillStyle='rgba(255,255,255,'+(R()*0.020).toFixed(3)+')';
      g.fillRect(x,y,1,1);
    }
  })();

  // ---- SVG labels, so every string stays vector -----------------------------------------
  const NS='http://www.w3.org/2000/svg', svg=document.getElementById('lay');
  function txt(x,y,s,cls,anchor){
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('class',cls);
    if(anchor) t.setAttribute('text-anchor',anchor);
    t.textContent=s; svg.appendChild(t); return t;
  }
  txt(80, 528, 'OBJECT PLANE   SIX INVITED', 'plane');
  txt(80, 1176, 'IMAGE PLANE   THREE CARRIED FORWARD', 'plane');
  const NAMES=['NEC NATIONAL SECURITY SYSTEMS','NEC NATIONAL SECURITY SYSTEMS','PARAVISION AND AIFI'];
  for(let i=0;i<3;i++){
    const x=246+i*294;
    txt(x, 1072, (i===2?'PARAVISION':'NEC NSS'), 'nlab', 'middle');
    txt(x, 1126, (i===2?'AND AIFI':'SOLUTION '+(i+1)), 'rlab', 'middle');
  }
  await document.fonts.ready;
  TX.svgPlateAll('#lay .nlab', {padX:12, padY:7, fill:'#2A3134'});
  TX.svgPlateAll('#lay .rlab', {padX:10, padY:6, fill:'#2A3134'});
  TX.svgPlateAll('#lay .plane', {padX:10, padY:6, fill:'#2A3134'});

})();
</script>
</body></html>
