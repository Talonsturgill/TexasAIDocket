<!doctype html>
<!-- 2026-11-07, frame 9 of 9. Archetype FULL_BLEED. A spatial scene through txthree.js in the lastLight world: the kit ranch_house of frame 1 at its front walk, a kit person as the resident holding the chassis notice sheet with its accent band and an unscannable code panel, a warm porch practical, the kit mailbox cropped in the foreground. Drawn to illustrate; the notice carries no real text or code. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">A notice asks for no action yet</h1>
<p class="dek" data-follow="26" style="width:820px">City officials say a courtesy notice is not a citation and requires no action. The notice warns that continued violations could bring a citation or other enforcement.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-07-curbside.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Next", counter: "09 / 09", src: "c54", fit: { min: 76, max: 100, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 32, near: 0.05, far: 3000, exposure: 1.0 });
  TXT.ground(R, { surface: 'grass', size: 600, color: 0x3a3f2c });
  const house = K.make('ranch_house', { material: 'brick', color: 0x8c5a3c, garage: 'right', chimney: true, seed: 7 }); house.position.set(0, 0, -8); TXT.add(R, house); TXT.contact(R, house);
  /* the lawn either side of the front walk, so no grass grows through the concrete */
  const yardL = K.make('yard', { size: [11.6, 12], dryness: 0.7 }); yardL.position.set(-9.1, 0, 4); TXT.add(R, yardL);
  const yardR = K.make('yard', { size: [17, 12], dryness: 0.7 }); yardR.position.set(6.5, 0, 4); TXT.add(R, yardR);
  const walk = K.make('driveway', { width: 1.2, length: 6.8, flare: false, age: 0.5 }); walk.position.set(-2.6, 0, 3.2); TXT.add(R, walk);
  const myrtle = K.make('crape_myrtle', { height: 3.6, spread: 2.6, bloom: false, seed: 4 }); myrtle.position.set(2.4, 0, 0.2); TXT.add(R, myrtle); TXT.contact(R, myrtle);
  /* the resident at the foot of the walk, three quarters to the camera, reading the notice */
  const res = K.make('person', { role: 'resident', pose: 'read', seed: 11 });
  res.rotation.y = -0.35; res.position.set(-2.55, 0.12, -0.4); TXT.add(R, res); TXT.contact(R, res);
  const note = K.make('notice', { kind: 'sheet' });
  const hold = new THREE.Group(); hold.rotation.y = -0.35; hold.position.set(-2.656, 1.18, -0.08);
  note.rotation.x = 1.3; note.scale.setScalar(1.7); hold.add(note); TXT.add(R, hold);
  const from = [-1.1, 1.0, 6.6];
  const look = CH.aim(THREE, R, TXT, from, [-2.45, 0.8, -0.4], 640, 900, 32);
  TXT.frame(R, { fov: 32, from, look });
  TXT.sky(R);
  TXT.deckRig(R, CH.rigSpec(W, 18, 4096), CH.rigOpts([-2, 1, -1], { distance: 40, shadowFar: 90, normalBias: 0.02 }));
  CH.unacne(R, 0.02);
  /* the porch lamp beside the door, warm, lighting the step and the resident's shoulders */
  /* the porch lantern itself: its glass found in the house mesh nearest the door, lit, and the glow and pool placed on it */
  house.updateMatrixWorld(true);
  let lp = new THREE.Vector3(-3.5, 2.0, -1.95), bestD = 1e9; const v = new THREE.Vector3();
  house.traverse((o) => { if (!o.isMesh || !o.material || !o.material.emissive || o.material.emissive.getHex() !== 0xffc27a) return; o.material.emissiveIntensity = 2.4;
    const pa = o.geometry.attributes.position; const pts = [];
    for (let i = 0; i < pa.count; i++) { v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); pts.push(v.clone()); }
    let near = null, nd = 1e9; pts.forEach((q) => { const d = q.distanceTo(lp); if (d < nd) { nd = d; near = q; } });
    if (near && nd < bestD) { bestD = nd; const c = new THREE.Vector3(); let k = 0; pts.forEach((q) => { if (q.distanceTo(near) < 0.3) { c.add(q); k++; } }); lp = c.multiplyScalar(1 / k); } });
  CH.lampGlow(THREE, R, [lp.x, lp.y, lp.z + 0.08], 0xffc890, 0.32, 7);
  /* the lamp's warm pool falling soft on the door frame, the step and the notice */
  CH.spot(THREE, R, [lp.x + 0.1, lp.y + 0.15, lp.z + 0.3], [-2.45, 0.7, -0.1], { color: 0xffc890, i: 30, reach: 7, angle: 1.0, penumbra: 1.0 });
  /* a narrow warm fill on the face and the sheet, and a cool rim from behind right */
  CH.spot(THREE, R, [-1.4, 2.0, 2.2], [-2.5, 1.45, -0.3], { color: 0xffe0c0, i: 18, reach: 6, angle: 0.14, penumbra: 0.7 });
  CH.spot(THREE, R, [-0.9, 2.3, -2.4], [-2.55, 1.3, -0.4], { color: 0xa8c0ff, i: 22, reach: 6, angle: 0.25, penumbra: 0.6 });
  TXT.stage(R, res, { behind: 0.03, depth: 0.9 });
  TXT.weather(R, { grime: 0.3, height: 0.5, mottle: 0.12 });
  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  CH.post(cx, { a: 0.35, veil: 0.35, veilH: 240 });
  CH.footWash(cx);
  CH.typeDark(cx, { a: 0.78 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
