<!doctype html>

<body>
<canvas id="art" width="2160" height="2700"></canvas>

<h1 class="hook" id="hook" style="width:900px">An officer inspects in person</h1>
<p class="dek" data-follow="26" style="width:620px">The memo says a citation comes only after a code officer inspects the property and notifies the owner, and counts 57 citations at 34 properties.</p>
<script>window.FIG = {"citations": 57};</script>

<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Inspection", counter: "05 / 09", src: "c47 c50", fit: { min: 70, max: 92, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 34, near: 0.05, far: 3000, exposure: 1.0 });
  TXT.ground(R, { surface: 'grass', size: 600, color: 0x3a3f2c });
  const road = K.make('road', { lanes: 2, sidewalk: true, parkway: 1.2, length: 80 }); road.position.set(0, 0, -6); TXT.add(R, road);
  const house = K.make('ranch_house', { material: 'brick', color: 0x8c5a3c, garage: 'right', chimney: true, seed: 7 }); house.position.set(-3, 0, -30); TXT.add(R, house);
  const yard = K.make('yard', { size: [34, 10], dryness: 0.7 }); yard.position.set(-3, 0, -18.2); TXT.add(R, yard);
  const pile = K.make('brush_pile', { l: 2.6, w: 1.0, h: 0.7, seed: 5 }); pile.position.set(1.8, 0.0, -10.95); TXT.add(R, pile); TXT.contact(R, pile);
  const t1 = K.make('tire', { lying: true }); t1.position.set(0.1, 0.0, -11.05); TXT.add(R, t1); TXT.contact(R, t1);
  const t2 = K.make('tire', { lying: true }); t2.position.set(0.13, 0.22, -11.03); t2.rotation.y = 0.4; TXT.add(R, t2);
  /* the officer on the sidewalk, three quarters to the camera, reading the clipboard */
  const man = K.make('person', { role: 'official', pose: 'read', vest: true, hat: 'none', seed: 31 });
  CH.vest(man); man.rotation.y = 0.75; man.position.set(-0.9, 0.19, -12.1); TXT.add(R, man); TXT.contact(R, man);
  const clip = K.make('clipboard', { sheets: FIG.citations, board: false });
  const hold = new THREE.Group(); hold.rotation.y = 0.75; hold.position.set(-0.68, 1.08, -11.85);
  clip.rotation.x = 0.95; hold.add(clip); TXT.add(R, hold);
  const from = [2.2, 1.45, -6.4];
  const look = CH.aim(THREE, R, TXT, from, [-0.2, 0.85, -11.6], 540, 980, 34);
  TXT.frame(R, { fov: 34, from, look });
  TXT.sky(R);
  TXT.deckRig(R, CH.rigSpec(W, 16, 4096), CH.rigOpts([0, 1, -11.5], { distance: 40, shadowFar: 90, normalBias: 0.02 }));
  CH.unacne(R, 0.02);
  /* a low warm key from the street light on the camera's left, raking the pile's cut ends and the officer's near cheek */
  CH.spot(THREE, R, [3.5, 6.5, -6.0], [0.2, 0.6, -11.4], { color: 0xffd2a0, i: 210, reach: 22, angle: 0.5, penumbra: 0.75 });
  /* a low warm kicker at the key's azimuth on the pile's cut ends and the tire, a narrow spot on the face, a cool rim behind */
  CH.spot(THREE, R, [2.6, 0.7, -8.6], [1.4, 0.25, -11.0], { color: 0xffc890, i: 70, reach: 8, angle: 0.45, penumbra: 0.8 });
  CH.spot(THREE, R, [1.6, 2.3, -9.2], [-0.9, 1.85, -12.1], { color: 0xffd8b0, i: 80, reach: 8, angle: 0.12, penumbra: 0.7 });
  CH.spot(THREE, R, [-2.6, 2.4, -14.6], [-0.9, 1.3, -12.1], { color: 0xa8c0ff, i: 40, reach: 8, angle: 0.25, penumbra: 0.6 });
  TXT.stage(R, [man, pile]);
  TXT.weather(R, { grime: 0.34, height: 0.4, mottle: 0.16 });
  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  CH.post(cx, { a: 0.3, veil: 0.35, veilH: 240 });
  CH.footWash(cx, { a: 0.5 });
  /* the source line's corner only darkens, so the curb edge stops striking its glyphs */
  { const g = cx.createRadialGradient(170, 1252, 10, 170, 1252, 230); g.addColorStop(0, 'rgba(5,6,10,0.85)'); g.addColorStop(0.6, 'rgba(5,6,10,0.6)'); g.addColorStop(1, 'rgba(5,6,10,0)'); cx.fillStyle = g; cx.fillRect(0, 1000, 500, 350); }
  CH.typeDark(cx, { a: 0.78 });
  TXDECK.finish(cx);
  return true;
})();
