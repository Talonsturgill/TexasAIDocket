<!doctype html>
<!-- 2026-11-05, frame 3 of 9. Archetype OBJECT_AND_CAPTION. A spatial scene through txthree.js in the lastLight world: the kit warehouse with its length and depth set from gill_len_m and gill_dep_m in figures.json, so its floor area is the 209,665 square feet the company leases on Gillingham Lane at a two to one plan, its clerestory glazing lit warm from inside, backlit against the seam on a dark truck court. Drawn to its stated floor area, not its shape, to no company's design. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">Laser chips, made only in Sugar Land</h1>
<p class="dek" data-follow="26" style="width:860px">The quarterly report puts the laser design team there too. The company also leases about 209,665 square feet on Gillingham Lane in Sugar Land, used mainly for manufacturing. The plant is drawn to its stated floor area, not its shape.</p>
<script>window.FIG = {"gill_sqft": 209665, "gill_len_m": 197.38, "gill_dep_m": 98.69};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-05-dockdoor.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Sugar Land", counter: "03 / 09", src: "c19 c8 c9", fit: { min: 80, max: 100, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 34, near: 0.5, far: 6000, fog: 0.0012, exposure: 1.25 });
  /* THE FIGURE: the plant's plan is gill_len_m by gill_dep_m, whose product is the stated floor area */
  const wh = K.make('warehouse', { length: FIG.gill_len_m, depth: FIG.gill_dep_m, height: 12.8, trucks: true, docks: 10, color: 0x9a958c, seed: 4 });
  /* the clerestory and the office glass lit warm from inside: the plant that runs today */
  const lit = new THREE.MeshStandardMaterial({ color: 0x2a2018, emissive: 0xff9a4a, emissiveIntensity: 0.85, roughness: 0.3 });
  /* the kit's glazing is a clearcoated physical material with roughness 0.05 */
  const glassy = (mt) => mt && (mt.transparent || (mt.transmission || 0) > 0 || /glass/i.test(mt.name || '') || (mt.isMeshPhysicalMaterial && mt.clearcoat >= 0.9 && mt.roughness <= 0.06));
  let nLit = 0; wh.traverse((m) => { if (m.isMesh && glassy(m.material)) { m.material = lit; nLit++; } });
  /* the building turned so the camera, standing on its shaded side, looks at it against the seam */
  const s = TXT.sunDir(), yawS = Math.atan2(s.x, s.z);
  wh.rotation.y = yawS + Math.PI + 0.62;
  /* the clerestory as one continuous warm band along the whole dock wall, the plant that runs today */
  { const band = new THREE.Mesh(new THREE.BoxGeometry(FIG.gill_len_m - 8, 1.1, 0.12), new THREE.MeshStandardMaterial({ color: 0x2a1c12, emissive: 0xff8a3a, emissiveIntensity: 0.42, roughness: 0.4 }));
    band.position.set(0, 10.4, (FIG.gill_dep_m - 40) / 2 + 0.08); wh.add(band); }
  /* the plant takes the seam, not the blue sky: its surfaces reflect a fraction of the sky's light */
  wh.traverse((m) => { if (m.isMesh && m.material && m.material !== lit && 'envMapIntensity' in m.material) { m.material = m.material.clone(); m.material.envMapIntensity = 0.3; } });
  TXT.add(R, wh); TXT.contact(R, wh);
  TXT.sky(R);
  TXT.ground(R, { surface: 'asphalt', size: 2400, seed: 31 });
  const hx = Math.sin(yawS), hz = Math.cos(yawS);
  const from = [-hx * 118 + hz * 44, 1.6, -hz * 118 - hx * 44];
  const look = CH.aim(THREE, R, TXT, from, [0, 6, 0], 520, 960, 34);
  TXT.frame(R, { fov: 34, from, look });
  TXT.scatter(R, { kind: 'grass', count: 9000, area: [-500, -500, 500, 500], avoid: [[-150, -130, 150, 130]], seed: 7, scale: [0.7, 1.3] });
  TXT.deckRig(R, CH.rigSpec(W, 320, 4096), CH.rigOpts([0, 0, 0], { distance: 400, shadowFar: 900, normalBias: 0.05 }));
  CH.unacne(R, 0.05);
  TXT.weather(R, { grime: 0.55, height: 2.4, mottle: 0.5 });
  TXT.stage(R, [wh]);
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.4, veil: 0.45, veilH: 300 });
  CH.footWash(cx);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
