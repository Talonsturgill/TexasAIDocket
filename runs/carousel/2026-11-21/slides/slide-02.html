<!doctype html>
<!-- 2026-11-21, frame 2 of 9, 52 ACRES. A raked aerial over one square plot of caliche and Brazos clay whose side is
computed from FIG.acres, turned so its near fence slants across the frame, set in Bermuda grass and ringed by live oaks.
Inside it, drawn to illustrate and not the site plan: a parking frame with its far bays pancaked, three rubble piles, a row
of shopfronts with a fallen roof, an office block with a sheared corner, and a derailed train jackknifed off its track
nearest the camera. A painted dimension line in the grass measures the near fence end to end. No lime on this frame. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="left:76px; top:140px; width:580px; text-align:left">A town built to fall down</h1>
<p class="dek" data-follow="22" style="left:78px; width:900px; font-size:24px; line-height:1.36">Disaster City is a 52 acre mock community with full scale structures that can collapse, rubble piles and a derailed train. The layout here is drawn to illustrate and is not the site plan.</p>
<div class="lab tone" id="labPlan">not the site plan</div>
<style>

.lab.tone { color:#0e3f3c; background:linear-gradient(180deg, #f6f1dc, #e4dcbc); box-shadow:0 10px 26px rgba(10,48,60,0.34), 0 2px 6px rgba(10,48,60,0.3); }
</style>
<script>window.FIG = {"acres": 52};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>

<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "52 acres", counter: "02 / 09", src: "c11 c1", fit: { min: 84, max: 96, maxLines: 2 } });
  const FOV = 34;
  const R = CH.stage(TXT, gl, W, { fov: FOV, near: 2, far: 9000, fog: 0.00012 });
  TX.reseed(20261102);

  /* ---- THE FIGURE. One acre is 4046.8564224 square metres exactly (the international acre), so a square of FIG.acres has
   * this side in metres. Everything below is laid out in that square, and the check throws if the drawn plot disagrees. */
  const M2_PER_ACRE = 4046.8564224;
  const S = Math.sqrt(FIG.acres * M2_PER_ACRE), HS = S / 2;
  const YAW = 19.2 * Math.PI / 180;                                 /* the plot is turned so its near fence slants */
  const rot = (x, z) => [x * Math.cos(YAW) + z * Math.sin(YAW), -x * Math.sin(YAW) + z * Math.cos(YAW)];   /* plot frame to world */
  const site = new THREE.Group(); site.rotation.y = YAW; R.scene.add(site);
  const rng = CH.rng(5202);

  const mat = (key, p, phys) => K.mat(key, p, phys);
  const rbox = (w, h, d, r, m) => { const b = TXT.roundedBox(w, h, d, r, m); b.castShadow = true; b.receiveShadow = true; return b; };
  const put = (obj, x, y, z, ry, parent) => { obj.position.set(x, y, z); if (ry) obj.rotation.y = ry; (parent || site).add(obj); return obj; };

  /* ---- THE GROUND OUTSIDE: Bermuda grass to the horizon */
  TXT.ground(R, { surface: 'grass', color: 0x3f7a2c, size: 9000, tile: 4, seed: 1121 });
  let _mt = null; const plotTexLater = () => _mt || (_mt = CH.canvasTex(THREE, 512, 512, (g, w, h) => { const r = CH.rng(5); g.fillStyle = '#d8d8d8'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 16; i++) { g.fillStyle = 'rgba(255,255,255,' + (0.1 + r() * 0.15) + ')'; g.fillRect(0, i * 32, w, 16); }
    for (let i = 0; i < 20000; i++) { const v = 150 + r() * 105 | 0; g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.35)'; g.fillRect(r() * w, r() * h, 2, 2); } }, [4, 4]));
  /* THE BERMUDA AROUND IT: a mown apron 2.4 km square, stripes square to the near fence, soft patches of greener and
   * straw grass, worn tracks, so the foreground under the type is turf and not felt; the haze takes it to the horizon. */
  { const T = CH.canvasTex(THREE, 2048, 2048, (g, w, h) => { const r = CH.rng(4401);
      g.fillStyle = '#4f8f34'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 340; i++) { const x = r() * w, y = r() * h, rad = 30 + r() * 160, gr = g.createRadialGradient(x, y, 2, x, y, rad);
        const c = r() < 0.35 ? '196,178,96' : (r() < 0.6 ? '40,104,44' : '120,170,70'); gr.addColorStop(0, 'rgba(' + c + ',' + (0.18 + r() * 0.25) + ')'); gr.addColorStop(1, 'rgba(' + c + ',0)'); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
      for (let i = 0; i < 160000; i++) { const v = r(); g.fillStyle = v < 0.5 ? 'rgba(20,60,24,0.28)' : 'rgba(190,226,120,0.22)'; g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 3); } });
    T.repeat.set(8, 8); T.wrapS = T.wrapT = THREE.RepeatWrapping;
    const gm = mat('grass-bermuda-mown', { color: 0xffffff, map: T, roughness: 0.93 });
    const apron = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), gm); apron.rotation.x = -Math.PI / 2; apron.position.y = 0.03; apron.receiveShadow = true; apron.userData.txBevel = false; site.add(apron); }

  /* broken-up turf near the camera: bunchgrass, scrub and caliche cobble outside the fence so no foreground reads as a flat stripe */
  TXT.scatter(R, { kind: 'scrub', count: 700, area: [-420, 300, 150, 395], seed: 211, scale: [1.2, 2.6] });
  TXT.scatter(R, { kind: 'rock', count: 260, area: [-420, 300, 150, 395], seed: 212, scale: [0.8, 1.8] });
  TXT.scatter(R, { kind: 'scrub', count: 400, area: [-460, -160, -305, 300], seed: 213, scale: [1.2, 2.6] });
  /* ---- THE PLOT: caliche worked into Brazos clay, tyre tracks, puddle stains. Its own mesh, S by S, in the site frame. */
  const plotTex = CH.canvasTex(THREE, 2048, 2048, (g, w, h) => {
    const r = CH.rng(77);
    g.fillStyle = '#e2bf8a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) { const x = r() * w, y = r() * h, rad = 40 + r() * 220, gr = g.createRadialGradient(x, y, 4, x, y, rad);
      const c = r() < 0.5 ? '200,110,62' : (r() < 0.6 ? '238,214,168' : '178,120,78'); gr.addColorStop(0, 'rgba(' + c + ',' + (0.18 + r() * 0.3) + ')'); gr.addColorStop(1, 'rgba(' + c + ',0)'); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
    for (let i = 0; i < 90000; i++) { const v = 150 + Math.floor(r() * 100); g.fillStyle = 'rgba(' + v + ',' + Math.floor(v * 0.82) + ',' + Math.floor(v * 0.6) + ',' + (0.15 + r() * 0.35) + ')'; g.fillRect(r() * w, r() * h, 1 + r() * 3, 1 + r() * 3); }
    g.strokeStyle = 'rgba(120,80,52,0.22)'; g.lineWidth = 3;
    for (let k = 0; k < 40; k++) { g.beginPath(); let x = r() * w, y = r() * h; g.moveTo(x, y); for (let s = 0; s < 8; s++) { x += (r() - 0.5) * 300; y += (r() - 0.5) * 300; g.lineTo(x, y); } g.stroke(); }
  });
  const plotMat = mat('caliche-dirt-plot', { color: 0xffffff, map: plotTex, roughness: 0.95, metalness: 0 });
  const plotGeo = new THREE.PlaneGeometry(S, S, 1, 1); plotGeo.rotateX(-Math.PI / 2);
  const plot = new THREE.Mesh(plotGeo, plotMat); plot.position.y = 0.06; plot.receiveShadow = true; plot.userData.txBevel = false; site.add(plot);
  /* THE CHECK: the plot drawn is the plot the figure gives */
  plot.updateMatrixWorld(true);
  { const bb = new THREE.Box3().setFromBufferAttribute(plotGeo.attributes.position), side = bb.max.x - bb.min.x, acres = side * (bb.max.z - bb.min.z) / M2_PER_ACRE;
    if (Math.abs(side - S) > 1e-3 || Math.abs(acres - FIG.acres) > 1e-4)  /* float32 vertices */ throw new Error('plot ' + acres + ' acres differs from FIG.acres ' + FIG.acres); }

  /* ---- ROADS inside the plot: a loop and two cross streets, asphalt with a pale edge */
  const asphalt = mat('asphalt-road', { color: 0x4d4b50, roughness: 0.82 });
  const road = (x0, z0, x1, z1, w) => { const L = Math.hypot(x1 - x0, z1 - z0), m = new THREE.Mesh(new THREE.BoxGeometry(L, 0.12, w), asphalt);
    m.position.set((x0 + x1) / 2, 0.1, (z0 + z1) / 2); m.rotation.y = -Math.atan2(z1 - z0, x1 - x0); m.receiveShadow = true; m.userData.txBevel = false; site.add(m); };
  const RI = HS - 26;
  const gravel = mat('gravel-road-caliche', { color: 0xbcae96, roughness: 0.95 });
  const road2 = (x0, z0, x1, z1, w, m) => { const L = Math.hypot(x1 - x0, z1 - z0), q = new THREE.Mesh(new THREE.BoxGeometry(L, 0.12, w), m);
    q.position.set((x0 + x1) / 2, 0.1, (z0 + z1) / 2); q.rotation.y = -Math.atan2(z1 - z0, x1 - x0); q.receiveShadow = true; q.userData.txBevel = false; site.add(q); };
  road2(-RI, -RI, RI, -RI, 6, gravel); road2(-RI, RI, RI, RI, 6, gravel); road2(-RI, -RI, -RI, RI, 6, gravel); road2(RI, -RI, RI, RI, 6, gravel);
  road(-RI, 40, RI, 40, 6); road(30, -RI, 30, RI, 6);

  /* ---- THE FENCE: galvanised posts every 6 m and a top rail, all four sides */
  const galv = mat('galv-steel-fence', { color: 0xc9d0d6, roughness: 0.4, metalness: 0.8 });
  { const pts = []; for (let s = 0; s < 4; s++) for (let t = 0; t < S; t += 6) { const a = -HS + t; const p = [[a, -HS], [HS, a], [-a, HS], [-HS, -a]][s]; pts.push(p); }
    const pg = new THREE.CylinderGeometry(0.12, 0.12, 2.2, 6); pg.translate(0, 1.1, 0);
    const im = new THREE.InstancedMesh(pg, galv, pts.length), m4 = new THREE.Matrix4();
    pts.forEach((p, i) => { m4.makeTranslation(p[0], 0, p[1]); im.setMatrixAt(i, m4); }); im.castShadow = true; im.userData.txBevel = false; site.add(im);
    [[[-HS, -HS], [HS, -HS]], [[HS, -HS], [HS, HS]], [[HS, HS], [-HS, HS]], [[-HS, HS], [-HS, -HS]]].forEach(([a, b]) => K.bar([a[0], 2.2, a[1]], [b[0], 2.2, b[1]], 0.14, galv, 6, site));
    /* the mesh itself: a faint screen, so the line reads from the air */
    const mesh = mat('galv-chainlink-screen', { color: 0xdfe6ea, roughness: 0.5, metalness: 0.6, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
    mesh.userData.txSurface = false;
    [[0, -HS, 0], [HS, 0, Math.PI / 2], [0, HS, 0], [-HS, 0, Math.PI / 2]].forEach(([x, z, ry]) => { const p = new THREE.Mesh(new THREE.PlaneGeometry(S, 2.1), mesh); p.position.set(x, 1.05, z); p.rotation.y = ry; p.userData.txBevel = false; site.add(p); });
  }

  /* ---- CONCRETE */
  const concTex = CH.canvasTex(THREE, 512, 512, (g, w, h) => { const r = CH.rng(9); g.fillStyle = '#d9cfbb'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { const c = 160 + r() * 80 | 0; g.fillStyle = 'rgba(' + c + ',' + (c - 8) + ',' + (c - 24) + ',' + (0.2 + r() * 0.4) + ')'; g.fillRect(r() * w, r() * h, 1 + r() * 4, 1 + r() * 4); }
    for (let i = 0; i < 60; i++) { g.strokeStyle = 'rgba(110,96,80,' + (0.15 + r() * 0.3) + ')'; g.lineWidth = 1; g.beginPath(); let x = r() * w, y = r() * h; g.moveTo(x, y); for (let s = 0; s < 6; s++) { x += (r() - 0.5) * 40; y += (r() - 0.5) * 40; g.lineTo(x, y); } g.stroke(); } }, [3, 3]);
  const conc = mat('conc-frame-sunbleached', { color: 0xffffff, map: concTex, roughness: 0.86 });
  const concDark = mat('conc-frame-stained', { color: 0xb9ad98, map: concTex, roughness: 0.9 });
  const rebar = mat('rust-rebar', { color: 0x8a4a2a, roughness: 0.6, metalness: 0.7 });

  /* ---- THE PARKING FRAME: three decks on a column grid, 6 by 4 bays of 8 m, its two far bays pancaked to the ground and
   * one deck hanging from the standing part to the dirt, columns snapped, rebar out of the broken edges. */
  function parkingFrame() {
    const g = new THREE.Group(), BX = 8, NX = 6, NZ = 4, ST = 3.4, NS = 3, TH = 0.35;
    const keep = 4;                                               /* bays 0..3 stand; 4 and 5 have fallen */
    const W0 = NX * BX, D0 = NZ * BX, x0 = -W0 / 2, z0 = -D0 / 2;
    for (let s = 1; s <= NS; s++) {
      const y = s * ST;
      const slab = rbox(keep * BX + 0.6, TH, D0 + 0.6, 0.06, s === NS ? conc : conc); slab.position.set(x0 + keep * BX / 2, y, 0); g.add(slab);
      /* spandrel beams on the long faces */
      [-1, 1].forEach(sd => { const b = rbox(keep * BX + 0.6, 0.9, 0.3, 0.05, concDark); b.position.set(x0 + keep * BX / 2, y + 0.5, sd * (D0 / 2 + 0.2)); g.add(b); });
      /* parking stripes on the top deck */
      if (s === NS) for (let k = 0; k < 14; k++) { const st = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, 5), mat('paint-stripe-white', { color: 0xf4f1e8, roughness: 0.6 })); st.position.set(x0 + 1.5 + k * 2.4, y + TH / 2 + 0.01, -D0 / 2 + 3.2); st.userData.txBevel = false; g.add(st);
        const st2 = st.clone(); st2.position.z = D0 / 2 - 3.2; g.add(st2); }
    }
    for (let i = 0; i <= keep; i++) for (let j = 0; j <= NZ; j++) {
      const c = rbox(0.6, NS * ST, 0.6, 0.05, conc); c.position.set(x0 + i * BX, NS * ST / 2, z0 + j * BX); g.add(c);
    }
    /* the fallen bays: decks stacked flat and cracked, a hanging deck from the third floor edge, snapped column stubs */
    const fx = x0 + keep * BX, r = CH.rng(31);
    for (let s = 0; s < NS - 1; s++) for (let pz = 0; pz < 2; pz++) {
      const sl = rbox(BX * 2 * (0.45 + r() * 0.08), TH, D0 / 2 * (0.9 + r() * 0.1), 0.05, s % 2 ? concDark : conc);
      sl.position.set(fx + BX * (0.5 + pz) + (r() - 0.5) * 1.5, 0.3 + s * 0.55, (pz ? 1 : -1) * D0 / 4 + (r() - 0.5) * 2);
      sl.rotation.set((r() - 0.5) * 0.12, (r() - 0.5) * 0.2, (r() - 0.5) * 0.14); g.add(sl);
    }
    const hang = rbox(BX * 1.7, TH, D0 + 0.4, 0.06, conc);
    const ang = Math.atan2(NS * ST - 1.2, BX * 1.7) ;
    hang.position.set(fx + Math.cos(ang) * BX * 0.85, NS * ST - Math.sin(ang) * BX * 0.85, 0); hang.rotation.z = -ang; g.add(hang);
    for (let j = 0; j <= NZ; j++) for (let i = keep + 1; i <= NX; i++) { const h = 0.6 + r() * 2.2; const c = rbox(0.6, h, 0.6, 0.05, concDark); c.position.set(x0 + i * BX, h / 2, z0 + j * BX); c.rotation.z = (r() - 0.5) * 0.5; g.add(c); }
    /* the break line on every standing deck: spalled chunks off the slab edge and rebar ends standing out of it, some bent down */
    for (let s = 1; s <= NS; s++) { const y = s * ST;
      for (let z = -D0 / 2; z <= D0 / 2; z += 0.9) {
        if (r() < 0.55) { const c = rbox(0.4 + r() * 0.6, 0.2 + r() * 0.2, 0.4 + r() * 0.6, 0.04, concDark); c.position.set(fx + 0.2 + r() * 0.3, y - 0.2 - r() * 0.2, z); c.rotation.set(r(), r(), r()); g.add(c); }
        const L = 0.8 + r() * 1.6, droop = r() < 0.4 ? 0.6 + r() * 1.2 : 0.1 * r();
        K.bar([fx - 0.2, y, z], [fx + L, y - droop, z + (r() - 0.5) * 0.4], 0.09, rebar, 5, g); } }
    /* rebar out of every snapped column stub */
    g.children.slice().forEach(m => { if (m.material === concDark && m.position.x > fx + 1 && m.geometry && m.position.y < 1.8 && Math.abs(m.rotation.z) > 0) {
      const top = m.position.y * 2; for (let q = 0; q < 4; q++) { const ox = (q % 2 - 0.5) * 0.36, oz = (q > 1 ? 0.18 : -0.18); K.bar([m.position.x + ox, top - 0.1, m.position.z + oz], [m.position.x + ox + (r() - 0.5) * 0.8, top + 0.6 + r() * 0.9, m.position.z + oz + (r() - 0.5) * 0.6], 0.07, rebar, 5, g); } } });
    /* dust stain fanned out from the fallen bays across the ground */
    { const dt = CH.canvasTex(THREE, 256, 256, (q, w, h) => { const rr = CH.rng(12); for (let i = 0; i < 40; i++) { const x = w * (0.2 + rr() * 0.6), y = h * (0.2 + rr() * 0.6), rad = 30 + rr() * 90, gr = q.createRadialGradient(x, y, 2, x, y, rad);
        gr.addColorStop(0, 'rgba(255,255,255,' + (0.25 + rr() * 0.3) + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)'); q.fillStyle = gr; q.fillRect(0, 0, w, h); } });
      const dm = new THREE.MeshBasicMaterial({ color: 0xe9dfcc, alphaMap: dt, transparent: true, opacity: 0.85, depthWrite: false }); dm.name = 'dust-stain-concrete'; dm.userData.txSurface = false;
      const dp = new THREE.Mesh(new THREE.PlaneGeometry(34, D0 + 22), dm); dp.rotation.x = -Math.PI / 2; dp.position.set(fx + BX + 3, 0.1, 0); dp.userData.txBevel = false; g.add(dp); }
    for (let k = 0; k < 60; k++) { const bx = fx + r() * BX * 2, bz = (r() - 0.5) * D0, by = r() * 2.4; K.bar([bx, by, bz], [bx + (r() - 0.5) * 1.6, by + 0.4 + r() * 1.2, bz + (r() - 0.5) * 1.6], 0.06, rebar, 5, g); }
    for (let k = 0; k < 40; k++) { const b = rbox(0.8 + r() * 2.2, 0.3 + r() * 0.3, 0.8 + r() * 2, 0.06, r() < 0.5 ? conc : concDark);
      b.position.set(fx + BX * 2 + r() * 6 - 1, 0.3, (r() - 0.5) * (D0 + 6)); b.rotation.set((r() - 0.5) * 0.8, r() * 3, (r() - 0.5) * 0.8); g.add(b); }
    return g;
  }
  const PF = put(parkingFrame(), -148, 0, 40, 0.3 + Math.PI);   /* the pancaked bays face the camera */

  /* ---- THE OFFICE BLOCK: five storeys, ribbon windows, one corner sheared off into a cone of debris */
  function officeBlock() {
    const g = new THREE.Group(), w = 22, d = 16, fh = 3.6, n = 5;
    const glass = mat('glass-ribbon-window', { color: 0x4f78b8, roughness: 0.12, metalness: 0.2, clearcoat: 1 }, true);
    for (let s = 0; s < n; s++) {
      const shear = s >= 2 ? (s - 1) * 3.2 : 0;                   /* upper floors lose more of the corner */
      const ww = w - shear;
      const band = rbox(ww, fh * 0.55, d, 0.08, conc); band.position.set(-shear / 2, s * fh + fh * 0.27, 0); g.add(band);
      const win = rbox(ww - 0.4, fh * 0.45, d - 0.4, 0.03, glass); win.position.set(-shear / 2, s * fh + fh * 0.77, 0); g.add(win);
    }
    const roof = rbox(w - 4 * 3.2, 0.5, d, 0.08, concDark); roof.position.set(-6.4, n * fh + 0.25, 0); g.add(roof);
    const r = CH.rng(43);
    for (let k = 0; k < 50; k++) { const a = r() * Math.PI, rad = Math.sqrt(r()) * 12, b = rbox(0.6 + r() * 2, 0.3 + r() * 0.5, 0.6 + r() * 2, 0.06, r() < 0.6 ? conc : concDark);
      b.position.set(w / 2 + Math.sin(a) * rad * 0.8 - 2, 0.3 + (1 - rad / 12) * 3 * r(), Math.cos(a) * rad); b.rotation.set(r() * 2, r() * 3, r() * 2); g.add(b); }
    return g;
  }
  put(officeBlock(), 120, 0, 10, 0);

  /* ---- THE SHOPFRONTS: a strip of five, painted fronts, one roof span fallen in */
  function shopStrip() {
    const g = new THREE.Group(), n = 5, uw = 9, d = 14, h = 5;
    const fronts = [0xd96a3a, 0x2f8f9a, 0xe7b84a, 0xc24a4a, 0x6a7fc8];
    for (let i = 0; i < n; i++) {
      const x = (i - (n - 1) / 2) * uw;
      const wall = rbox(uw - 0.3, h, d, 0.08, mat('paint-block-shop-' + i, { color: fronts[i], roughness: 0.75 })); wall.position.set(x, h / 2, 0); g.add(wall);
      if (i !== 3) { const roof = rbox(uw, 0.4, d + 0.6, 0.06, mat('membrane-roof-pale', { color: 0xe9e4d8, roughness: 0.7 })); roof.position.set(x, h + 0.2, 0); g.add(roof);

    if (Math.abs((NT * (S / NT)) - S) > 1e-6) throw new Error('tape graduations do not divide the side'); }
  { const lath0 = mat('wood-lath-stake', { color: 0xe8cf9a, roughness: 0.85 });
    for (let z = -HS; z <= HS + 0.01; z += S / 15) { const st = rbox(0.5, 1.6, 0.5, 0.04, lath0); st.position.set(TX0, 0.8, z); site.add(st); } }

  /* ---- CONTACT under every staged set */
  site.updateMatrixWorld(true);
  /* sun shadows (PCSS) give every set its contact; no blob planes */

  /* ---- CAMERA: a raked aerial, the plot's near corner low on the right, its far corner up under the kicker */
  /* placed by a solve in out/2026-11-21/tmp/s02: horizon at y 136, the near corner at (950, 1059), the far corner at y 399 */
  const FROM = [-120, 55, 400], LOOK = [-150, 0, -160];   /* panel round 2: pushed in so the train and the fallen sets fill the lower two thirds, horizon low enough for the type in the sky */ //   /* solved, then panned 2.5 degrees right and pulled back 15 percent so the far right corner and the whole far fence sit in frame */
  TXT.frame(R, { fov: FOV, from: FROM, look: LOOK });
  TXT.sky(R, Object.assign({}, TXT.worlds.v2win, { fogDensity: 0.00042, zenith: 0x1d4fc0, horizon: 0x9cc2f0, haze: 0xb4cfee }));
  R.scene.fog.density = 0.00042;

  const spec = CH.rigSpec(W, 700, 4096);

  const proj = (p) => CH.project(THREE, R, p);

  const lab = document.getElementById('labPlan'); { const fe = rot(-40, -HS), fq = proj([fe[0], 0, fe[1]]); lab.style.left = Math.round(Math.max(200, Math.min(860, fq[0]))) + 'px'; lab.style.top = Math.round(fq[1] - 44) + 'px'; }
  window.__dbg = { S, corners, train: proj([TR.position.x, 0, TR.position.z]).map(Math.round) };

  { const low = TXLOOK.palette('win').low, g = cx.createLinearGradient(0, 0, 0, 260);   /* one smooth wash across the top for the kicker and counter */
    for (let k = 0; k <= 6; k++) { const t = k / 6, e = 1 - t * t * (3 - 2 * t); g.addColorStop(t, TXLOOK.rgba(low, (0.7 * e).toFixed(4))); }
