      const arch = 0.0035 * Math.exp(-t * 9), curl = 0.012 * Math.pow(Math.max(0, (1 - u) + t - 1.55) / 0.45, 2);
      p.setY(i, 0.0006 + arch + curl); }
    gB.computeVertexNormals();
    const B = new THREE.Mesh(gB, letterM(letterTex(true), 'letter-paper-open')); B.position.set(0, 0, Z0 - 0.05 - LP / 2); B.castShadow = true; B.receiveShadow = true; B.userData.txBevel = false; env.add(B); }
  /* the soft violet contact where the letter leaves the envelope's throat */
  { const sT = tex(256, 64, (c, w, h) => { const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,0.9)'); c.fillStyle = gr; c.fillRect(0, 0, w, h); });
    const sM = new THREE.MeshBasicMaterial({ map: sT, color: 0x3a2276, transparent: true, opacity: 0.42, depthWrite: false, name: 'throat-shade' }); sM.userData.txSurface = false;
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(LW * 0.98, 0.012), sM); sh.rotation.x = -Math.PI / 2; sh.position.set(0, 0.0015, Z0 - 0.006); sh.renderOrder = 2; sh.userData.txBevel = false; env.add(sh); }
  if (nGold !== 1) throw new Error('exactly one dusk gold line, drew ' + nGold);

  /* THE PEN, uncapped, across the blank signature rule: violet lacquer, the cap posted on its end, a brass nib */
  { const lac = new THREE.MeshPhysicalMaterial({ color: 0x3b2a8a, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.08, name: 'pen-lacquer' });
    const brass = new THREE.MeshStandardMaterial({ color: 0xe8b878, metalness: 1, roughness: 0.25, name: 'pen-brass' });
    const pen = new THREE.Group();
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.0058, 0.0052, 0.09, 24), lac); barrel.rotation.z = Math.PI / 2; pen.add(barrel);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.0066, 0.0066, 0.052, 24), lac); cap.rotation.z = Math.PI / 2; cap.position.x = -0.06; pen.add(cap);
    const capEnd = new THREE.Mesh(new THREE.SphereGeometry(0.0066, 16, 10), lac); capEnd.position.x = -0.086; pen.add(capEnd);
    const clip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.0014, 0.0028), brass); clip.position.set(-0.062, 0.0072, 0); pen.add(clip);
    const capRing = new THREE.Mesh(new THREE.TorusGeometry(0.0066, 0.0007, 8, 24), brass); capRing.rotation.y = Math.PI / 2; capRing.position.x = -0.034; pen.add(capRing);
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.0049, 0.004, 0.02, 24), lac); grip.rotation.z = Math.PI / 2; grip.position.x = 0.055; pen.add(grip);
    const nib = new THREE.Mesh(new THREE.ConeGeometry(0.004, 0.02, 20), brass); nib.rotation.z = -Math.PI / 2; nib.position.x = 0.075; nib.scale.z = 0.4; pen.add(nib);
    pen.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
    pen.position.set(0.01, 0.0072, SIG_Z); pen.rotation.y = -0.22; env.add(pen); }

  /* the envelope rides the loose block, its opening and the letter toward the reader */
  env.position.set(0.004, stack.userData.top, -0.07); env.rotation.y = Math.PI + 0.1; stack.add(env);

  /* A BRASS DESK LAMP at the far left: weighted round base, a jointed arm, a domed shade, a warm bulb */
  { const brass = new THREE.MeshStandardMaterial({ color: 0xd9a066, metalness: 1, roughness: 0.3, name: 'lamp-brass' });
    const shadeM = new THREE.MeshPhysicalMaterial({ color: 0x2f2470, roughness: 0.35, clearcoat: 0.6, side: THREE.DoubleSide, name: 'lamp-enamel' });
    const L = new THREE.Group(); L.position.set(-0.6, DH, DESK_Z - 0.12);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.085, 0.022, 40), brass); base.position.y = 0.011; L.add(base);
    const a1 = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.34, 16), brass); a1.position.set(0.04, 0.18, 0); a1.rotation.z = -0.25; L.add(a1);
    const j = new THREE.Mesh(new THREE.SphereGeometry(0.014, 16, 12), brass); j.position.set(0.083, 0.345, 0); L.add(j);
    const a2 = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.26, 16), brass); a2.position.set(0.19, 0.39, 0.02); a2.rotation.z = -1.2; L.add(a2);
    const pts = []; for (let i = 0; i <= 12; i++) { const t = i / 12; pts.push(new THREE.Vector2(0.012 + 0.07 * Math.sin(t * Math.PI / 2), -0.11 * t)); }
    const shade = new THREE.Mesh(new THREE.LatheGeometry(pts, 40), shadeM); shade.position.set(0.3, 0.44, 0.04); shade.rotation.z = 0.5; L.add(shade);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.024, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff0c8, name: 'lamp-bulb' })); bulb.material.userData.txSurface = false; bulb.position.set(0.33, 0.39, 0.04); L.add(bulb);
    L.traverse((m) => { if (m.isMesh && m !== bulb) { m.castShadow = true; m.receiveShadow = true; } });
    L.rotation.y = -0.5; R.scene.add(L);
    const pl = new THREE.PointLight(0xffb070, 1.6, 2.2, 2); L.updateMatrixWorld(true); const bp = new THREE.Vector3(); bulb.getWorldPosition(bp); pl.position.copy(bp).add(new THREE.Vector3(0, -0.03, 0)); R.scene.add(pl);
  }

  /* THE CAMERA: seated eye, a little above the stack's top, from the front left; the stack stands right of centre */
  const FOV = 34;
  const FROM = [-0.3, 2.1, DESK_Z + 0.98];
  const target = [SX, DH + stack.userData.top * 0.55, SZ];
  const look = CH.aim(THREE, R, TXT, FROM, target, 760, 760, FOV);
  TXT.frame(R, { fov: FOV, from: FROM, look: look });
  const sr = CH.rectOf(THREE, R, stack, 0);
  window.__s9 = { stack: sr.map(Math.round) };
  if (sr[0] < db.right - 20 && sr[1] + sr[3] > hb.top) console.warn('stack under the type column', JSON.stringify(sr));

  /* THE LIGHT: the window's last light from behind and right of the stack, low, coral; violet in the shade */
  CH.KEY_SCALE = 1.5;
  const spec = CH.rigSpec(W, 4, 4096);
  TXT.deckRig(R, spec, Object.assign(CH.rigOpts([SX, DH, SZ], { distance: 8, shadowFar: 20, normalBias: 0.004 }), { light: { az: KEY.az, el: KEY.el } }));
  CH.unacne(R, 0.003);
  R.scene.environmentIntensity = 0.38;
  { const f = new THREE.DirectionalLight(0x8a6cff, 0.55); f.position.set(-2, 2.2, 4); R.scene.add(f); }
  TXT.weather(R, { grime: 0.03, height: 0.1, mottle: 0.05 });

  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  TXLOOK.footWash(cx, { a: 0.45, height: 220 });
  CH.seat(cx, { sel: '.hook, .dek', a: 0.5, fade: 170 });
  CH.seat(cx, { sel: '.dek', a: 0.6, fade: 110 });
  /* the window patch's mullion edge runs behind the kicker: knock it back */
  CH.seat(cx, { sel: '.kick', a: 0.5, fade: 150 });
  CH.seat(cx, { sel: '.kick', a: 0.3, fade: 60 });
  CH.seat(cx, { sel: '.src', a: 0.45, fade: 70 });
  TXDECK.finish(cx);
  return true;
})();
