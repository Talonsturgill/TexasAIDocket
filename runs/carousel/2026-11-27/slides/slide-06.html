  frontTex.anisotropy = 16; frontTex.generateMipmaps = true; frontTex.minFilter = THREE.LinearMipmapLinearFilter;

  const railTex = CH.canvasTex(THREE, 1024, 64, (g, w, h) => { g.fillStyle = '#7a4024'; g.fillRect(0, 0, w, h); const r = CH.rng(5); for (let i = 0; i < 40; i++) { g.strokeStyle = 'rgba(40,14,8,' + (0.05 + r() * 0.1) + ')'; g.lineWidth = 1 + r() * 2; const y = r() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (r() - 0.5) * 4); g.stroke(); } }, [3, 1]);

  [[2.25, 3.75], [3.75, 5.25]].forEach(([s0, s1]) => {
    const A = arc(s0, -0.05, 0), B = arc(s1, -0.05, 0), chord = A.distanceTo(B), c = A.clone().lerp(B, 0.5), yaw = Math.atan2(B.x - A.x, B.z - A.z) - Math.PI / 2;

  /* the upper wall answers the key: a broad warm pool from the right, falling off toward the corners behind the headline */
  { const sp = new THREE.SpotLight(0xffa0c0, 55, 0, 0.75, 1.0, 1.4); const wc = arc(3.73, 6.2, 2.9); sp.position.set(wc.x + 2.5, 4.6, wc.z + 6.5); sp.target.position.set(wc.x - 0.6, 3.0, wc.z); sp.castShadow = false; R.scene.add(sp); R.scene.add(sp.target); }

  const mid = piles[0].base.clone().lerp(piles[1].base, 0.5);
  const camPos = arc(3.73, -1.55, mid.y + 0.24), FOV = 36;

  /* ---- THE CHAMBER CUE: a blank civic seal on the wall behind the dais, the flag pair on stands either side of it ---- */
  R.camera.updateMatrixWorld(true);
  const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(860 / 540 - 1, 1 - 470 / 675), R.camera);
  const wallHit = ray.intersectObject(R.room, true)[0]; if (!wallHit) throw new Error('no wall behind the seal');

  seal.position.copy(wallHit.point).add(nrm.clone().multiplyScalar(0.06));
  { const pil = Math.round(seal.position.x / 2.2) * 2.2, dx = seal.position.x - pil; if (Math.abs(dx) < 0.5) seal.position.x = pil + (dx < 0 ? -0.5 : 0.5); } seal.position.z = -7.83 + 0.035; seal.position.y = Math.min(1.72 - 0.3, Math.max(1.35, wallHit.point.y));  /* in a wainscot bay, clear of the pilasters, under the headline */

  TXT.deckRig(R, CH.rigSpec(W, 10, 4096), Object.assign(CH.rigOpts([focus.x, focus.y, focus.z], { distance: 12, shadowFar: 30, normalBias: 0.004 }), { light: { az: 38, el: 24 } }));
