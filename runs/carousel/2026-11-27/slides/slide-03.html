  { const glowTex = CH.canvasTex(THREE, 64, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h);

      { let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 900; i++) { const x = rnd() * w, y = rnd() * h, r = 4 + rnd() * 14, a = 0.05 + rnd() * 0.08; g.fillStyle = rnd() < 0.5 ? 'rgba(40,24,96,' + a + ')' : 'rgba(210,190,250,' + a + ')'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); } }
