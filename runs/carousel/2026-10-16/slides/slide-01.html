<!doctype html>
<!-- 2026-10-16, frame 1 of 9. Archetype FULL_BLEED. RENDERED through txthree.js in the deck's nightSodium world. The illustrative robotaxi waits at an airport departures curb, seen low from its rear quarter; one curb bollard per day from the creek to the opening runs ahead along the island into the dark. Drawn to illustrate; no real terminal and no real vehicle design is claimed. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  .tx-site { font-size:24px; }
  .dek { width:880px; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Anyone can ride one to the airport now</h1>
<p class="dek" data-follow="26">On October&nbsp;14th Waymo opened its San Antonio robotaxis to anyone with the app, San Antonio International Airport included. The federal record of its flood recall still lists the remedy as under development. Drawn to illustrate.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-16-curb.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "San Antonio, October 14th", counter: "01 / 09", src: "c1 c10", fit: { min: 76, max: 96, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 40, far: 3000 });
  /* THE POSTS, from figures.json: days_creek_to_open 177, one curb bollard per day from the creek on
   * April 20th to the opening on October 14th, starting at the car's rear bumper and running ahead. */
  const DAYS = 177, PITCH = 1.5;
  const curb = K.make('terminal_curb', { length: DAYS * PITCH + 40, bollards: false, downlights: false, seed: 3 });
  curb.position.set(-DAYS * PITCH / 2 + 10, 0, -3.2); TXT.add(R, curb);
  /* the lobby kept below the car's paint, and the canopy columns taken down to near black, so nothing lit climbs into the type */
  curb.traverse(m => { if (!m.isMesh || !m.material) return; if (m.material.isMeshBasicMaterial && m.material.map) { m.material = m.material.clone(); m.material.color.setHex(0x9a9a9a); } else if (m.material.metalness === 0.7 && m.geometry.type === 'CylinderGeometry' && m.geometry.parameters.height > 5) { m.material = m.material.clone(); m.material.color.setHex(0x23252a); m.material.envMapIntensity = 0.15; } });
  const car = K.make('robotaxi', { seed: 4 }); car.rotation.y = -Math.PI / 2; car.position.set(0, 0, -1.25); TXT.add(R, car);
  CH.bollards(THREE, R, K, DAYS, [2.4, 0.15, -3.55], [-1, 0, 0], PITCH, () => 'white');
  CH.matte(TXT.ground(R, { surface: 'asphalt', size: 900, seed: 16 }), 0.35);
  /* the lane's skip line and the curb's painted edge, flat on the asphalt */
  { const m = new THREE.MeshLambertMaterial({ color: 0xcfcac0 }); for (let x = -260; x < -24; x += 9) { const l = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.12), m); l.rotation.x = -Math.PI / 2; l.position.set(x, 0.006, 2.4); l.receiveShadow = true; R.scene.add(l); } }
  TXT.contact(R, car);
  const from = [7.6, 1.05, 4.6];
  const look = CH.aim(THREE, R, TXT, from, [-0.2, 0.85, -1.4], 700, 950, 40);
  TXT.frame(R, { fov: 40, from, look });
  /* the canopy's downlight over the car: a warm cone from the soffit, the pool the car stands in */
  { const sp = new THREE.SpotLight(0xffd9a6, 260, 16, 0.75, 0.6, 1.5); sp.position.set(0.4, 7.2, -1.6); sp.target.position.set(0, 0, -1.4); sp.castShadow = true; sp.shadow.mapSize.set(2048, 2048); sp.shadow.bias = -0.0004; R.scene.add(sp); R.scene.add(sp.target); }
  /* the island's own downlights, a pool every 9 m so the bollard line recedes lit into the dark */
  for (let x = -6; x > -60; x -= 9) { const p = new THREE.SpotLight(0xffd9a6, 120, 12, 0.7, 0.7, 1.6); p.position.set(x, 7.1, -3.4); p.target.position.set(x, 0, -3.4); R.scene.add(p); R.scene.add(p.target); }
  TXT.sky(R);
  TXT.deckRig(R, CH.rigSpec(W, 30, 4096), CH.rigOpts([0, 1, -2], { distance: 50, shadowFar: 140 }));
  TXT.stage(R, [car], { poolInner: 5, poolOuter: 16, behind: 0.5, depth: 7 });
  TXT.weather(R, { grime: 0.2, height: 0.5 });
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.5, pad: 110, veil: 0.4, footWash: 0.54 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
