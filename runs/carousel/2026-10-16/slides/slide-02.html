<!doctype html>
<!-- 2026-10-16, frame 2 of 9. Archetype FIGURE_SCALE. RENDERED through txthree.js in the deck's nightSodium world. The illustrative robotaxi side on at the far curb of a lit San Antonio street at night, an invited rider at true scale walking from the sidewalk toward its rear door under a cobra head streetlight, a live oak's crown arching over the sidewalk into the dark. Drawn to illustrate; no real street is claimed. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  .tx-site { font-size:24px; }
  .dek { width:900px; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">In February, it came by invitation</h1>
<p class="dek" data-follow="26">Waymo took its first public riders in San Antonio on February&nbsp;24th, inviting them from the tens of thousands across four cities who had the app. Texas Public Radio put that first service area at 60 square miles. Drawn to illustrate.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-16-curb.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "San Antonio, February 24th", counter: "02 / 09", src: "c5 c6 c21", fit: { min: 76, max: 96, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 46, far: 3000 });
  /* THE STREET runs along x, its far curb at z -3.6 and the far sidewalk behind it */
  const road = K.make('road', { length: 120, lanes: 2, sidewalk: true, parkway: 1.2 }); TXT.add(R, road);
  /* the pavement without the kit's tar snakes, which read as scribbles at feed width: worn pavement with aggregate and no seal lines */
  road.traverse(m => { if (!m.isMesh || !m.material || !m.material.map) return; const b = new THREE.Box3().setFromObject(m), sz = b.getSize(new THREE.Vector3()); if (sz.y < 0.25 && sz.x > 20 && sz.z > 5) { m.material = m.material.clone(); m.material.map = K.tex('concrete'); m.material.color.setHex(0x55555a); m.material.roughness = 0.88; m.material.needsUpdate = true; } });
  const car = K.make('robotaxi', { seed: 4 }); car.rotation.y = -Math.PI / 2; car.position.set(0.4, 0, -2.45); TXT.add(R, car);
  /* THE RIDER, at true scale, walking from the sidewalk toward the rear door, turned three quarters to the lens */
  const who = K.make('person', { role: 'resident', pose: 'walk', seed: 7, build: 'female' }); who.position.set(3.75, 0, -3.25); who.rotation.y = -0.85; TXT.add(R, who);
  const lamp = K.make('streetlight', { height: 5.8, reach: 1.6 }); lamp.position.set(4.75, 0.15, -4.8); lamp.rotation.y = -0.35; TXT.add(R, lamp); lamp.traverse(m => { if (m.isMesh) m.castShadow = false; });
  const oak = K.make('live_oak', { height: 7, spread: 13 }); oak.position.set(-8.5, 0.15, -8.5); TXT.add(R, oak);
  CH.matte(oak, 0.04);
  CH.matte(TXT.ground(R, { surface: 'asphalt', size: 900, seed: 22 }), 0.35);
  [car, who, lamp, oak].forEach(o => TXT.contact(R, o));
  const from = [1.0, 1.5, 7.2];
  const look = CH.aim(THREE, R, TXT, from, [1.2, 0.9, -2.45], 560, 890, 46);
  TXT.frame(R, { fov: 46, from, look });
  /* the cobra head's pool on the car's roof, the rider and the sidewalk */
  { const sp = new THREE.SpotLight(0xffc98e, 520, 16, 0.75, 0.6, 1.5); sp.position.set(4.2, 5.7, -3.4); sp.target.position.set(2.0, 0, -3.0); sp.castShadow = true; sp.shadow.mapSize.set(2048, 2048); sp.shadow.bias = -0.0004; R.scene.add(sp); R.scene.add(sp.target); }
  /* a low fill from the camera's side, so the rider's face toward the lens is lit */
  { const f = new THREE.PointLight(0xffe2c0, 30, 14, 1.6); f.position.set(4.4, 1.8, 2.5); R.scene.add(f); }
  TXT.sky(R);
  TXT.deckRig(R, CH.rigSpec(W, 46, 4096), CH.rigOpts([0.4, 1, -3], { distance: 50, shadowFar: 120 }));
  TXT.stage(R, [car, who], { poolInner: 6, poolOuter: 18, behind: 0.6, depth: 8 });
  TXT.weather(R, { grime: 0.2, height: 0.5 });
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.4, veil: 0.4, footWash: 0.54 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
