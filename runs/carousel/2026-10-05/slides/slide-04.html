<!doctype html>
<!-- 2026-10-05, frame 4 of 9. Archetype CLOSE_CROP. RENDERED through txthree.js, a room built by TXT.interior and lit low. One monitor at 0.7 m, its screen glowing gold with seven blocks of ruled lines and no letterforms, a mesh chair back cropped at the near left. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  .tx-site { font-size:24px; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">It will read the notes.</h1>
<p class="dek" data-follow="22">A Dell Medical School pilot will use large language models across more than 7 million patient records. It will look for signs of suicide risk.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-05-wards.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const FIG = { notes_records_millions: 7 };
  const { K, gl, W } = await WD.boot(THREE, TXT, initKit, { kicker: "Dell Medical School clinical notes", counter: "04 / 09", src: "c17", fit: { min: 90, max: 120, maxLines: 1 } });
  const R = WD.stage(TXT, gl, W, { near: 0.2, fov: 40, fog: 0.0, far: 100, exposure: 1.3 });
  /* the office's back wall stands further off, and a band of night glass runs behind the screen
   * at desk height with two of the lot's lamps in it, so the screen stands in a room at night */
  const room = TXT.interior(R, { w: 4.2, d: 7.0, h: 2.8, floor: 'concrete', wall: 0x353c49, window: 'back', windowColor: 0x24365a, windowI: 0.55, windowW: 3.2, windowH: 0.4, ceiling: true, light: 0.34 });
  { const pane = room.children[room.children.length - 1]; pane.position.set(0.3, 1.22, pane.position.z);
  }
  /* the band is a window: mullions on a regular pitch and a sill (flow round 1) */
  { const pane = room.children.find((c) => c.geometry && c.geometry.type === 'PlaneGeometry'); const mm = new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: 0.6 });
    const pw = pane.geometry.parameters.width, ph = pane.geometry.parameters.height;
    for (let k = 0; k <= 4; k++) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.035, ph + 0.04, 0.05), mm); b.position.set(pane.position.x - pw / 2 + k * pw / 4, pane.position.y, pane.position.z + 0.03); pane.parent.add(b); }
    const sl = new THREE.Mesh(new THREE.BoxGeometry(pw + 0.1, 0.03, 0.12), new THREE.MeshStandardMaterial({ color: 0x6b6f7a, roughness: 0.5 })); sl.position.set(pane.position.x, pane.position.y - ph / 2 - 0.015, pane.position.z + 0.06); pane.parent.add(sl); }
  const desk = K.make('desk', { pedestal: 'left', seed: 9 }); desk.position.set(0.2, 0, -1.0); TXT.add(R, desk); TXT.contact(R, desk, { opacity: 0.6 });
  /* the screen's note: one block of ruled lines per million records, and no letterforms */
  const mon = WD.goldScreen(THREE, K.make('monitor', { inches: 27, screen: 'doc', seed: 4 }), FIG.notes_records_millions, 1.45);
  mon.position.set(0.15, 0.76, -1.15); mon.rotation.y = -0.18; TXT.add(R, mon);
  const chair = K.make('office_chair', { style: 'mesh', seed: 6 }); chair.position.set(-0.56, 0, -0.42); chair.rotation.y = Math.PI - 0.3; TXT.add(R, chair); TXT.contact(R, chair, { opacity: 0.7 });
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.036, 0.1, 24), new THREE.MeshStandardMaterial({ color: 0xd9d4ca, roughness: 0.5 })); cup.position.set(0.62, 0.81, -0.86); TXT.add(R, cup);
  /* one downlight grazing the back wall above the glass, so the wall reads as a surface (panel round 2) */
  { const wl = new THREE.SpotLight(0xffe8cc, 3, 5, 0.6, 0.9, 2); wl.position.set(-0.6, 2.7, -2.9); wl.target.position.set(-0.6, 1.8, -3.5); R.scene.add(wl); R.scene.add(wl.target); }
  /* the screen's own gold on the desk, the stand and the bezel's lower edge */
  { const g = new THREE.PointLight(0xe0956a, 0.22, 1.2, 2); g.position.set(0.12, 0.84, -0.84); R.scene.add(g); }
  TXT.frame(R, { from: [-0.35, 1.15, 0.55], look: [0.15, 1.08, -1.15] });
  TXT.deckRig(R, WD.rigSpec(W, 8), WD.rigOpts([0, 0, -1], { distance: 20, shadowFar: 50 }));
  TXT.weather(R, { grime: 0.08, height: 0.3 });
  WD.unshadow(R.scene);
  const cx = WD.develop(await TXT.snapshot(R), gl);
  WD.post(cx, { a: 0.12 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
