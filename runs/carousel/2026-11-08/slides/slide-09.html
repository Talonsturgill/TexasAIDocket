<!doctype html>
<!-- 2026-11-08, frame 9 of 9. Archetype FIGURE_SCALE. A spatial scene through txthree.js inside a TXT.interior lab: the cover's bench answered, the protein teaching model on its black plinth and the brass block of every likely pair, one cell per pair, set down on the bench beside it. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">The list is free to use</h1>
<p class="dek" data-follow="26" style="width:860px">The team posted all 2,895 predictions as MitoMatch, free at mitomatch.web.app. The release says cures for diseases linked to mitochondria may still be far off. The block and model are drawn to illustrate.</p>
<script>window.FIG = {"block_cols": 54, "block_full_rows": 53, "block_last_row": 33};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-08-plate.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "MitoMatch", counter: "09 / 09", src: "c4 c20 c21 c23 c29", fit: { min: 80, max: 104, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 30, near: 0.02, far: 60, exposure: 1.0 });
  /* THE COVER'S BENCH, ANSWERED: the same room, the same model on its black plinth and the same light as frame 1, so the
   * one thing that has changed since the question is the brass block of every likely pair, set down on the bench beside
   * it. The window is on the far wall, so no sill crosses the frame under the type. */
  const room = TXT.interior(R, Object.assign(CH.roomOpts({ windowI: 0.14 }), { window: 'right' }));   /* a dim pane: at full strength the empty bench right of the model outshone the block */
  CH.bench(TXT, R, K, { x: -2.55, rotY: Math.PI / 2 });
  const top = CH.BENCH_H;
  const pair = K.make('protein_pair', { state: 'seated', matA: 'bone', matB: 'brass', unit: 0.032 });
  pair.position.set(-2.56, top, 0.0); pair.rotation.y = 1.03; TXT.add(R, pair); TXT.contact(R, pair, { opacity: 0.9 });
  /* the camera stands back and a little higher than the cover's, so the plinth sits upper left and the bench in front of
   * it has room for the block */
  const from = [-1.86, top + 0.24, 0.40];
  const look = CH.aim(THREE, R, TXT, from, [-2.52, top + 0.08, 0.0], 470, 815, 30);
  TXT.frame(R, { fov: 30, from, look });
  /* THE FIGURE: the block is block_cols by block_full_rows cells plus a last row of block_last_row, one cell per likely
   * pair. A cell is drawn at 1.25 mm, a drawing unit. Placed where the ray through screen point (895, 1150) meets the
   * bench top, and turned half a turn so the short last row of 33 sits at the back and the front reads as one edge */
  const block = K.make('pair_block', { cols: FIG.block_cols, rows: FIG.block_full_rows, last: FIG.block_last_row, cell: 0.00125, t: 0.018, major: 10 });
  R.camera.updateMatrixWorld(true);
  const ray = new THREE.Vector3(895 / 1080 * 2 - 1, 1 - 1150 / 1350 * 2, 0.5).unproject(R.camera).sub(R.camera.position).normalize();
  const k = (top - R.camera.position.y) / ray.y, bpos = [R.camera.position.x + ray.x * k, top, R.camera.position.z + ray.z * k];
  block.position.set(bpos[0], bpos[1], bpos[2]); block.rotation.y = 0.35 + Math.PI; TXT.add(R, block); TXT.contact(R, block, { opacity: 0.9 });
  /* polished brass that carries the room in it: the kit's lapped finish read as matte card under this light */
  { const solid = block.children[0];
    solid.material = new THREE.MeshStandardMaterial({ color: 0xd8b468, metalness: 0.8, roughness: 0.3, envMapIntensity: 6 });
    block.traverse(m => { m.userData.txWear = false; }); }
  TXT.deckRig(R, CH.rigSpec(W, 2, 2048), CH.rigOpts([-2.4, top, 0.1], { distance: 6, shadowFar: 14, normalBias: 0.01 }));
  CH.unacne(R, 0.01);
  /* the cover's light: the window's last light rims both chains from behind and to the left */
  { const rim = new THREE.PointLight(0xffb27a, 1.6, 3, 2); rim.position.set(-2.95, top + 0.42, 0.18); R.scene.add(rim); }
  CH.darkRoom(R);
  /* and reaches the front of the model and the block from the reader's left */
  { const key = new THREE.PointLight(0xffd2a8, 1.3, 3, 2); key.position.set(-2.2, top + 0.6, 0.55); R.scene.add(key); }
  CH.slot(THREE, R, 330, 760, { h: 0.6, w: 0.14, i: 2.2, lift: 0.0, light: 0.6 });
  /* a narrow warm lamp from the upper left on the block alone, so it lays a shadow the bench can show and its top
   * edge catches a line of light */
  { const sp = new THREE.SpotLight(0xffd8b0, 1.2, 1.4, 0.16, 0.6, 2); sp.position.set(bpos[0] - 0.22, top + 0.42, bpos[2] - 0.2); sp.target.position.set(bpos[0], top, bpos[2]);
    sp.castShadow = true; sp.shadow.mapSize.set(1024, 1024); sp.shadow.bias = -0.0005; sp.shadow.radius = 5; R.scene.add(sp); R.scene.add(sp.target); }   /* behind the model, so it rims and never glares */
  TXT.weather(R, { grime: 0.1, height: 0.5, mottle: 0.15 });
  TXT.stage(R, [pair, block]);
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.4, pad: 0, fade: 130, veil: 0.35, veilH: 150 });
  /* a small footer wash behind the site line only, so it never dulls the block */
  CH.footWash(cx, { x: 900, r: 230, a: 0.6 });
  /* both washes end soon after the dek: a long fade lay over the chain tops and greyed them */
  CH.typeDark(cx, { pad: 0, fade: 150, a: 0.75 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
