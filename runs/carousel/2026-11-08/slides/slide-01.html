<!doctype html>
<!-- 2026-11-08, frame 1 of 9. Archetype CLOSE_CROP. A spatial scene through txthree.js inside a TXT.interior lab: a space-filling teaching model of two protein chains seated together on a black stand on a black epoxy bench, the window's last light behind. Drawn to illustrate, never a real structure. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">An AI was asked which proteins pair up</h1>
<p class="dek" data-follow="26" style="width:860px">Texas A&amp;M scientists in College Station recast AlphaFold-Multimer as a yes or no test for which mitochondrial proteins interact. The model is drawn to illustrate, not a structure from the paper.</p>
<script>window.FIG = {};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-08-plate.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Texas A&M, College Station", counter: "01 / 09", src: "c5 c7 c28", fit: { min: 80, max: 104, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 30, near: 0.02, far: 60, exposure: 1.0 });
  /* the lab: the bench runs along the window wall, so a camera looking at the model looks into the window */
  /* the window is on the far wall, so the wall behind the model is one lit plane with no sill crossing the frame under the type */
  const room = TXT.interior(R, Object.assign(CH.roomOpts({}), { window: 'right' }));
  CH.bench(TXT, R, K, { x: -2.55, rotY: Math.PI / 2 });
  const top = CH.BENCH_H;
  /* a dark slate tile on the epoxy under the stand, the only plastic on the bench */
  const mat = TXT.mat.plastic(0x141519, { roughness: 0.5 });
  const pair = K.make('protein_pair', { state: 'seated', matA: 'bone', matB: 'brass', unit: 0.032 });
  pair.position.set(-2.56, top, 0.0); pair.rotation.y = 1.03; TXT.add(R, pair); TXT.contact(R, pair, { opacity: 0.9 });
  /* the plinth in a matte black: its metallic anodise mirrored the window as a cool grey slab beside the brass chain,
   * the brightest flat thing in the frame. And the model's own contact core darker, so both chains sit on it. */
  pair.traverse(m => { if (!m.isMesh || !m.material) return;
    if (m.material.metalness > 0.6 && m.material.color && m.material.color.getHex() === 0x121316) { m.material = new THREE.MeshStandardMaterial({ color: 0x0a0b0c, roughness: 1, metalness: 0, envMapIntensity: 0 }); m.userData.txWear = false; }   /* fully rough, no environment and no dust: at this grazing angle any gloss mirrored the lit back wall */
    if (m.material.isMeshBasicMaterial && m.material.map && m.geometry.type === 'PlaneGeometry') { m.scale.set(1.15, 1.3, 1); m.material.opacity = 1; } });
  const from = [-1.95, top + 0.17, 0.34];
  const look = CH.aim(THREE, R, TXT, from, [-2.52, top + 0.08, 0.0], 720, 860, 20.5);   /* close: the pair owns the frame, set right so its brass chain runs off the right edge */
  TXT.frame(R, { fov: 20.5, from, look });
  TXT.deckRig(R, CH.rigSpec(W, 2, 2048), CH.rigOpts([-2.52, top, 0], { distance: 6, shadowFar: 14, normalBias: 0.01 }));
  CH.unacne(R, 0.01);
  /* the window's last light rims both chains from behind and to the left, the brass catching it hardest */
  { const rim = new THREE.PointLight(0xffb27a, 1.6, 3, 2); rim.position.set(-2.95, top + 0.42, 0.18); R.scene.add(rim);
  }
  CH.darkRoom(R);
  /* the bench's epoxy in a satin finish: gloss mirrored the far window as a pale grey sheet beside the brass chain */
  R.scene.traverse(m => { if (m.isMesh && m.material && m.material.color && m.material.color.getHex() === 0x0d0e10) { m.material = m.material.clone(); m.material.roughness = 0.9; m.material.envMapIntensity = 0; } });
  /* the window's light also reaches the front of the model from the reader's left, so the bone chain keeps its colour */
  { const key = new THREE.PointLight(0xffd2a8, 0.9, 3, 2); key.position.set(-2.35, top + 0.38, 0.55); R.scene.add(key); }
  CH.slot(THREE, R, 600, 760, { h: 0.6, w: 0.14, i: 2.2, lift: 0.0 });
  TXT.weather(R, { grime: 0.1, height: 0.5, mottle: 0.15 });
  TXT.stage(R, pair);
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.4, veil: 0.4, veilH: 260 });
  CH.footWash(cx, { x: 820, r: 560, a: 0.85 });   /* the stand top under the footer falls to the dark, so the site line sits on black */
  CH.typeDark(cx, { fade: 120, a: 0.75 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
