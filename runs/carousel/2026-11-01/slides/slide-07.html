<!doctype html>
<!-- 2026-11-01, frame 7 of 9. Archetype CLOSE_CROP. A TXBENCH material relief under the chassis light: award_months steel tensile bars from figures.json standing proud on black phenolic in rows of twelve, one bar a month and one row a year, raked so each casts to the lower right. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">Six years, one bar a month</h1>
<p class="dek" data-follow="26" style="width:860px">The NSF award runs from September 1st to August 31st, 2032. The platform is open access, and its intended users include researchers at non-R1 and EPSCoR institutions. One bar is one month. Drawn to&nbsp;illustrate.</p>
<div class="lab" id="lab-a">2026</div>
<div class="lab" id="lab-b">2032</div>
<script>window.FIG = {"award_months": 72};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-01-foundry.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script>
window.renderReady = (async () => {
  const cx = await CH.bootFlat({ kicker: "The federal clock", counter: "07 / 09", src: "c21 c23 c27 c28", fit: { min: 76, max: 100, maxLines: 2 } });
  TX.reseed(20261101);
  /* THE FIGURE, from figures.json: one bar a month, twelve to a row, so one row is a year */
  const N = Math.round(FIG.award_months), PER = 12, ROWS = Math.ceil(N / PER);
  const X0 = 150, X1 = 1000, Y0 = 640, Y1 = 1200, PX = (X1 - X0) / PER, PY = (Y1 - Y0) / ROWS;
  const L = PY * 0.8, GW = PX * 0.42, WW = PX * 0.17, GL = L * 0.34, FL = L * 0.12, T = 7;
  const M = { BASE: 0, STEEL: 1, RACK: 2 };
  /* a dogbone in plan along y: wide grips, a narrow gauge, filleted shoulders, a bevelled edge, 7 px proud */
  function bar(dx, dy) {
    const ay = Math.abs(dy); if (ay > L / 2) return 0;
    let hw; const g2 = GL / 2;
    if (ay <= g2) hw = WW / 2; else if (ay >= g2 + FL) hw = GW / 2; else { const u = (ay - g2) / FL; hw = WW / 2 + (GW - WW) / 2 * (1 - Math.cos(u * Math.PI / 2)); }
    const e = Math.min(hw - Math.abs(dx), L / 2 - ay); if (e <= 0) return 0;
    return T * Math.min(1, e / 2.2);
  }
  function sample(X, Y) {
    const col = Math.floor((X - X0) / PX), row = Math.floor((Y - Y0) / PY);
    if (col >= 0 && col < PER && row >= 0 && row < ROWS && row * PER + col < N) {
      const h = bar(X - (X0 + (col + 0.5) * PX), Y - (Y0 + (row + 0.5) * PY));
      if (h > 0) return [h + 3 + 0.05 * TX.simplex2(X * 0.3, Y * 0.3), M.STEEL];
    }
    /* the bars lie on one anodised rack plate, 3 px proud with a bevelled rim, so the count reads as one object */
    const rx = Math.min(X - (X0 - 16), 1200 - X), ry = Math.min(Y - (Y0 - 12), 1222 - Y);
    if (rx > 0 && ry > 0) return [3 * Math.min(1, Math.min(rx, ry) / 2.5) + 0.12 * TX.simplex2(X * 0.9, Y * 0.9), M.RACK];
    return [0.1 * TX.simplex2(X * 0.6, Y * 0.6) + 0.08 * TX.simplex2(X * 0.07, Y * 0.07), M.BASE];
  }
  const cache = new Map(), key = (X, Y) => (X * 4 | 0) + ',' + (Y * 4 | 0);
  const S = (X, Y) => { const k = key(X, Y); let v = cache.get(k); if (!v) { v = sample(X, Y); cache.set(k, v); } return v; };
  const albedo = (X, Y, m) => {
    if (m === M.BASE) { const a = 1 + 0.12 * TX.simplex2(X * 0.5, Y * 0.5) + 0.08 * (TX.simplex2(X * 3, Y * 0.2) > 0.75 ? 1 : 0); return [0.03 * a, 0.03 * a, 0.033 * a]; }
    if (m === M.RACK) { const a = 1 + 0.18 * TX.simplex2(X * 0.8, Y * 0.8); return [0.11 * a, 0.115 * a, 0.13 * a]; }
    const s = 1 + 0.25 * TX.simplex2(X * 0.2, Y * 4); return [0.7 * s, 0.71 * s, 0.73 * s];
  };
  /* the window's pane: the first years lit, the later rows falling to black at the bottom and right */
  const pool = (X, Y) => { const d = Math.hypot((X - 320) / 560, (Y - 740) / 380), t = Math.max(0, Math.min(1, (d - 0.12) / 0.62)); return (1 - 0.92 * t * t * (3 - 2 * t)) * Math.min(1, Math.max(0, (Y - 560) / 70)); };
  cx.fillStyle = '#08080b'; cx.fillRect(0, 0, 2160, 2700);
  const rep = TXBENCH.relief(cx, { x: 0, y: 0, w: 1080, h: 1350, scale: 2, height: (X, Y) => S(X, Y)[0], material: (X, Y) => S(X, Y)[1], keyMask: pool, albedo,
    spec: { [M.STEEL]: [0.8, 36], [M.RACK]: [0.25, 20] }, keyColor: [1, 0.9, 0.78], ambColor: [0.5, 0.58, 0.78],
    ambient: 0.02, diffuse: 2.8, ao: 1.0, shadow: 0.94, softness: 3, castLength: 170 });
  const put = (id, x, y) => { const el = document.getElementById(id); el.style.left = x + 'px'; el.style.top = y + 'px'; };
  put('lab-a', 50, Y0 + PY * 0.5 - 18); put('lab-b', 50, Y0 + PY * (ROWS - 0.5) - 18);
  cx.setTransform(2, 0, 0, 2, 0, 0);
  CH.post(cx, { a: 0.4, pad: 80, fade: 200, veil: 0.32 });
  window.__relief = rep;
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
