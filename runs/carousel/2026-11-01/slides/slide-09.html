<!doctype html>
<!-- 2026-11-01, frame 9 of 9. Archetype FULL_BLEED. A TXBENCH material relief under the chassis light: one flat steel tensile bar pulled to fracture, its two halves apart, each grip bitten by the jaw serrations, each half necked at the break and ending in a rough fracture face, the bluebonnet paint mark on the left grip. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">So the metal still gets tested</h1>
<p class="dek" data-follow="26" style="width:880px">Texas A&amp;M's goal is alloys in a week or less instead of months, a target and not a result. PhaseForge is free online and anyone can contribute to it. The NSF platform is open access. Drawn to&nbsp;illustrate.</p>
<script>window.FIG = {};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-01-foundry.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script>
window.renderReady = (async () => {
  const cx = await CH.bootFlat({ kicker: "What a reader can do", counter: "09 / 09", src: "c8 c9 c21 c23 c31", fit: { min: 80, max: 104, maxLines: 2 } });
  TX.reseed(20261101);
  /* THE BAR in plan, along a slight diagonal: grips GW wide, gauge WW, fillets, pulled apart at the middle of the gauge */
  const CX = 560, CY = 960, ANG = -0.2, L = 1400, GW = 238, WW = 104, GL = 588, FL = 126, T = 20, GAP = 60;
  const ca = Math.cos(ANG), sa = Math.sin(ANG);
  const M = { BENCH: 0, STEEL: 1, FRACT: 2, MARK: 3, BITE: 4 };
  /* the jagged break line, a slant with a shear lip, the same line on both halves offset by the gap */
  const brk = (v) => 0.42 * v + 7 * Math.sin(v * 0.21) + 4 * TX.simplex2(v * 0.11, 3.3);
  function sample(X, Y) {
    const dx = X - CX, dy = Y - CY, u = dx * ca + dy * sa, v = -dx * sa + dy * ca;     // u along the bar, v across it
    const au = Math.abs(u); if (au > L / 2) return bench(X, Y);
    let hw; const g2 = GL / 2;
    if (au <= g2) hw = WW / 2; else if (au >= g2 + FL) hw = GW / 2; else { const t = (au - g2) / FL; hw = WW / 2 + (GW - WW) / 2 * (1 - Math.cos(t * Math.PI / 2)); }
    /* which half, and how far from its own broken end */
    const b = brk(v), left = u < b - GAP / 2, right = u > b + GAP / 2;
    if (!left && !right) return bench(X, Y);
    const dEnd = left ? (b - GAP / 2) - u : u - (b + GAP / 2);
    /* the local neck: the last stretch before the break pinches to about 60 percent */
    if (dEnd < 70) hw *= 0.6 + 0.4 * Math.pow(dEnd / 70, 1.6);
    const edge = hw - Math.abs(v); if (edge <= 0) return bench(X, Y);
    let h = T * Math.min(1, edge / 3) * Math.min(1, (L / 2 - au) / 3 + 0.2);
    /* the fracture face: the last few px before the break fall away rough and dull */
    if (dEnd < 9) return [h * (0.55 + 0.45 * dEnd / 9) + 2.2 * TX.simplex2(X * 0.9, Y * 0.9), M.FRACT];
    /* the jaw bites on each grip: diagonal serrations pressed into the steel */
    if (au > g2 + FL + 20) {
      const s1 = Math.sin((u * 0.7 + v * 0.7) * 0.55), s2 = Math.sin((u * 0.7 - v * 0.7) * 0.55);
      const bite = 1.3 * Math.max(0, s1) * Math.max(0, s2);
      if (left && au > 455 && au < 525) return [h - bite * 0.3, M.MARK];
      return [h - bite, M.BITE];
    }
    return [h + 0.15 * TX.simplex2(u * 0.05, v * 1.4), M.STEEL];
  }
  function bench(X, Y) { return [0.5 * TX.simplex2(X * 0.6, Y * 0.6) + 0.3 * TX.simplex2(X * 0.06, Y * 0.06), M.BENCH]; }
  const cache = new Map(), key = (X, Y) => (X * 4 | 0) + ',' + (Y * 4 | 0);
  const S = (X, Y) => { const k = key(X, Y); let v = cache.get(k); if (!v) { v = sample(X, Y); cache.set(k, v); } return v; };
  const albedo = (X, Y, m) => {
    if (m === M.BENCH) { const a = 1 + 0.4 * TX.simplex2(X * 0.35, Y * 0.35) + (TX.simplex2(X * 2.5, Y * 0.15) > 0.82 ? 0.6 : 0); return [0.03 * a, 0.029 * a, 0.03 * a]; }
    if (m === M.MARK) return [0.3, 0.42, 1.45];
    if (m === M.FRACT) { const a = 0.8 + 0.4 * TX.simplex2(X * 1.3, Y * 1.3); return [0.3 * a, 0.29 * a, 0.27 * a]; }
    const g = 1 + 0.1 * TX.simplex2(X * 0.03, Y * 3.0); return m === M.BITE ? [0.4 * g, 0.41 * g, 0.43 * g] : [0.5 * g, 0.51 * g, 0.53 * g];
  };
  const pool = (X, Y) => { const d = Math.hypot((X - 520) / 640, (Y - 980) / 430), t = Math.max(0, Math.min(1, (d - 0.3) / 0.8)); return 1 - 0.94 * t * t * (3 - 2 * t); };
  cx.fillStyle = '#08080b'; cx.fillRect(0, 0, 2160, 2700);
  const rep = TXBENCH.relief(cx, { x: 0, y: 0, w: 1080, h: 1350, scale: 2, height: (X, Y) => S(X, Y)[0], material: (X, Y) => S(X, Y)[1], keyMask: pool, albedo,
    spec: { [M.STEEL]: [0.9, 44], [M.BITE]: [0.5, 24], [M.MARK]: [0.15, 10], [M.FRACT]: [0.08, 6] }, keyColor: [1, 0.9, 0.78], ambColor: [0.5, 0.58, 0.78],
    ambient: 0.05, diffuse: 2.6, ao: 1.0, shadow: 0.92, softness: 3, castLength: 160 });
  cx.setTransform(2, 0, 0, 2, 0, 0);
  CH.post(cx, { a: 0.4, pad: 80, fade: 200, veil: 0.34 });
  window.__relief = rep;
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
