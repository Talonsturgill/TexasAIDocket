<!doctype html>
<!-- 2026-10-07, frame 9 of 9. Archetype FULL_BLEED. RENDERED through txthree.js in the deck's highNoon world. Frame 5's camera to the centimetre with the hull and the keel blocks gone, the 850 foot line in the plan's ink alone on the graded clay, the person and the pickup where they stood. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  .tx-site { font-size:24px; }
  .dek { width:880px; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">The break would shrink if jobs fall short</h1>
<p class="dek" data-follow="20">The Tribune reported the condition, and that opponents told the court the break would take money from public schools. The line runs 850 feet, the longest Saronic says the yard can build at first.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-07-portalpha.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await PA.boot(THREE, TXT, initKit, { kicker: "The ground, drawn to illustrate", counter: "09 / 09", src: "c30 c32 c9", fit: { min: 80, max: 110, maxLines: 2 } });
  const R = PA.stage(TXT, gl, W, { fov: 44, fog: 0.0016 });
  PA.water({ seed: 5, tile: 70, ripple: 0.45, color: 0x24302a });
  const yard = TXT.ground(R, { surface: 'dirt', size: 8000, y: PA.BANK, tile: 6, seed: 47, color: 0x6f655a }); yard.position.z = -4000;
  { const rr = PA.lcg(17); for (let i = 0; i < 160; i++) { const t = K.make(rr() < 0.3 ? 'palm' : 'mesquite', { seed: 300 + i }); t.position.set(-900 + rr() * 1800, PA.BANK, -40 - rr() * 700); TXT.add(R, t); } }
  for (let i = 0; i < 4; i++) { const wh = K.make('warehouse', { seed: 40 + i, length: 140, depth: 70, height: 16, docks: 0, trucks: 0, color: 0xc9c6bc }); wh.position.set(-700 + i * 260, PA.BANK, -520 - (i % 2) * 140); TXT.add(R, wh); }
  /* vessel_m 259.1: the painted line where frame 5's blocks ran, the ship and the blocks gone */
  const VESSEL_M = 259.1, BOW = -70;
  /* the hull's footprint, a worn mark where each of frame 5's keel blocks stood */
  for (let z = BOW - 2; z > BOW - VESSEL_M; z -= 1.83) PA.strip([-12.7, z], [-11.3, z], 0.9, PA.BANK + 0.01, { mat: PA.trackMat() });
  PA.strip([-5.5, BOW + 16], [-5.5, BOW - VESSEL_M], 2.2, PA.BANK + 0.05);
  const p = K.make('person', { seed: 4, role: 'worker', pose: 'stand', hat: true, vest: false }); p.rotation.y = 3.9; p.position.set(0.5, PA.BANK, -55); TXT.add(R, p); TXT.contact(R, p);
  const pk = K.make('pickup', { trim: 'work', color: 0xd8d6d0, seed: 4 }); pk.rotation.y = 2.6; pk.position.set(6.5, PA.BANK + 0.02, -66); TXT.add(R, pk); TXT.contact(R, pk);
  TXT.frame(R, { from: [4, PA.BANK + 1.6, -44], look: [-9, PA.BANK + 8.6, -200] });
  PA.scrub([-1500, -900, 1500, -320], { count: 7000, seed: 12 });
  PA.grit([-40, -140, 60, -10], { count: 40000, seed: 14, scale: [0.008, 0.022], avoid: [[-8, -340, -3, -10]] });
  PA.grass([-60, -160, 70, -12], { count: 12000, seed: 24, scale: [0.2, 0.45], avoid: [[-19, -330, 4, -40], [-7, -330, -4, -10]] });
  PA.tracks(7, [-30, -130, 50, -20], { seed: 62 });
  TXT.sky(R);
  TXT.deckRig(R, PA.rigSpec(W, 120, 4096), PA.rigOpts([-12, 0, -120], { distance: 400, shadowFar: 900 }));
  TXT.weather(R, { grime: 0.2, height: 1.5 });
  const cx = PA.develop(await TXT.snapshot(R), gl);
  PA.post(cx, { a: 0.14, siteBlur: 24, footWash: 0.45 });
  TXDECK.finish(cx);

  return true;
})();
</script>
</body>
</html>
