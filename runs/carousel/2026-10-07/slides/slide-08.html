<!doctype html>
<!-- 2026-10-07, frame 8 of 9. Archetype FIGURE_SCALE. RENDERED through txthree.js in the deck's highNoon world. Twenty workers on the graded clay before the hull on its keel blocks, seven in vests in the plan's ink. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  .tx-site { font-size:24px; }
  .dek { width:880px; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Up to 10,000 jobs, Saronic says</h1>
<p class="dek" data-follow="20">The Tribune reported the break would require 35% of the full-time workforce to be local. Seven of the twenty drawn here wear the local share.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-07-portalpha.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await PA.boot(THREE, TXT, initKit, { kicker: "Saronic's figure, drawn to illustrate", counter: "08 / 09", src: "c5 c29", fit: { min: 80, max: 104, maxLines: 2 } });
  const R = PA.stage(TXT, gl, W, { fov: 34, fog: 0.0016 });
  PA.water({ seed: 5, tile: 70, ripple: 0.45, color: 0x24302a });
  const yard = TXT.ground(R, { surface: 'dirt', size: 8000, y: PA.BANK, tile: 6, seed: 47, color: 0x6f655a }); yard.position.z = -4000;
  { const rr = PA.lcg(17); for (let i = 0; i < 160; i++) { const t = K.make(rr() < 0.3 ? 'palm' : 'mesquite', { seed: 300 + i }); t.position.set(-900 + rr() * 1800, PA.BANK, -40 - rr() * 700); TXT.add(R, t); } }
  for (let i = 0; i < 4; i++) { const wh = K.make('warehouse', { seed: 40 + i, length: 140, depth: 70, height: 16, docks: 0, trucks: 0, color: 0xc9c6bc }); wh.position.set(-700 + i * 260, PA.BANK, -520 - (i % 2) * 140); TXT.add(R, wh); }
  const v = PA.vessel({ state: 'blocks', mast: false }); v.rotation.y = 0.75; v.position.set(-6, PA.BANK, -46); TXT.add(R, v); TXT.contact(R, v, { opacity: 0.6 });
  /* vessel_m 259.1: the plan's line along the hull's keel, 850 feet, running past its stern */
  { const KEEL = 259.1, ax = Math.sin(0.75), az = Math.cos(0.75); PA.strip([-6 + ax * 30, -46 + az * 30], [-6 - ax * (KEEL - 30), -46 - az * (KEEL - 30)], 3.0, PA.BANK + 0.05); }
  /* crew_drawn 20, crew_local_drawn 7: seven of the twenty wear the accent */
  const CREW = 20, LOCAL = 7, rr = PA.lcg(91), ink = new THREE.MeshStandardMaterial({ color: PA.ACCENT, roughness: 0.6, emissive: PA.ACCENT, emissiveIntensity: 0.2 });
  const LOCALS = [1, 3, 7, 10, 12, 16, 18]; if (LOCALS.length !== LOCAL) throw new Error('local count');
  for (let i = 0; i < CREW; i++) { const local = LOCALS.indexOf(i) >= 0; const q = K.make('person', { seed: 120 + i, role: 'worker', pose: i % 4 === 0 ? 'walk' : (i % 5 === 1 ? 'look_up' : 'stand'), hat: true, vest: local, shirt: [0xe0d7c3, 0x6b7d5c, 0xc9b58f, 0x484848, 0xa2493b, 0xf2f0ea][i % 6] });
    if (local) q.traverse((m) => { if (m.isMesh && m.material && m.material.emissiveIntensity === 0.12 && m.material.roughness === 0.7) m.material = ink; });
    /* four staggered rows of five along the line of sight, laid out so every body stays two thirds visible at the camera, clear of the hull */
    const row = Math.floor(i / 5), k = i % 5, dist = 18 + row * 3, step = 0.08 * dist, lat = (k - 2) * step + [0, 0.25, 0.5, 0.75][row] * step;
    const DX = -22 / 56.5, DZ = -52 / 56.5; q.rotation.y = Math.PI + (rr() - 0.5) * 1.2; q.position.set(16 + DX * dist + (-DZ) * lat, PA.BANK, 6 + DZ * dist + DX * lat); TXT.add(R, q); TXT.contact(R, q, { opacity: 0.6 }); }
  TXT.frame(R, { from: [19.9, PA.BANK + 4, 15.2], look: [-6, PA.BANK + 6.5, -46] });
  PA.grit([-40, -90, 50, -3], { count: 40000, seed: 15, scale: [0.008, 0.022], avoid: [[-12, -70, 20, -20]] });
  PA.grass([-60, -100, 70, -6], { count: 10000, seed: 25, scale: [0.2, 0.45], avoid: [[-30, -70, 20, -26]] });
  PA.tracks(2, [-30, -80, 40, -60], { seed: 63 });
  TXT.sky(R);
  TXT.deckRig(R, PA.rigSpec(W, 70, 4096), PA.rigOpts([0, 0, -40], { distance: 200, shadowFar: 500 }));
  TXT.weather(R, { grime: 0.2, height: 1.5 });
  const cx = PA.develop(await TXT.snapshot(R), gl);
  PA.post(cx, { a: 0.14, siteBlur: 24, footWash: 0.45 });
  TXDECK.finish(cx);

  return true;
})();
</script>
</body>
</html>
