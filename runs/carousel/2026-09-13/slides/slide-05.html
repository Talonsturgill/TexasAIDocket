<!doctype html>
<!-- CAROUSEL 22, frame 5 of 9. Archetype GRID.
     198 units above and 69 below, one unit to one patient, every unit identical in size because
     the blocks are laid out in screen space at one scale rather than on a ground plane where
     depth would change them. The two counts and the block geometry come from compute.py, which
     reads them out of claim c20's own quote. Line screen at cell 4.

     BOTH BLOCKS ARE DRAWN IN THE SAME PASS AND TAKE THE SAME SCREEN. The first cut painted the
     lower block flat in `over`, on top of the print, so the two cohorts were drawn in different
     media: the upper eroded by the line plate into tally strokes, the lower solid and figural.
     An isotype whose two halves are drawn differently is not a comparison, it is two pictures.
     So the accent is applied AFTER the print by remapping the printed luminance inside a mask of
     the lower block's own units, which leaves the screen, the erosion and the edge layer exactly
     as they fell on the upper block and changes only the hue. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  :root { --suite:#1B1E21; --ink:#EDE6D6; --dim:#B9B2A3; --accent:#4E5FA8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:var(--suite); }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:168px; width:820px; font-family:"Fraunces", serif; font-weight:700;
          font-size:92px; line-height:1.0; letter-spacing:-0.02em; color:var(--ink); font-variation-settings:"opsz" 144; }
  .dek  { position:absolute; left:80px; top:372px; width:800px; font-size:26px; line-height:1.38; color:var(--dim); }
  /* A SOLID knockout plate, not a tint. A plate at 93 percent opacity still lets an edge
     through a letterform, which is the failure the engine names. */
  .lab  { position:absolute; font-family:"JetBrains Mono", monospace; font-size:24px; line-height:1.1; letter-spacing:0.06em; color:var(--ink); white-space:nowrap; background:#12151A; padding:6px 14px; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace; font-size:24px; letter-spacing:0.07em; line-height:1.5; color:var(--dim); white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Fitted to 198. Tested on 69.</h1>
<p class="dek">The model was built on a public cohort. It then ran on an independent cohort without refitting.</p>
<div class="lab" id="labA" style="left:80px; top:446px;">198  THE COHORT IT WAS BUILT ON</div>
<div class="lab" id="labB" style="left:80px; top:922px;">69  THE COHORT IT HAD NOT MET</div>
<script src="../../computed.js"></script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txscene.js"></script>
<script src="@@ASSETS@@/js/txfig.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(async function (resolve, reject) {
  try {
    await document.fonts.ready;
    TXLAYOUT.mount(document.body, { kicker: "The brain metastasis cohorts", kicker2: "One unit is one patient",
      counter: "05 / 09", src: "c16 c20   TEXAS AI DOCKET", ink: "#B9B2A3" });
    TX.fitText(document.getElementById("hook"), { min: 70, max: 92, maxLines: 2 });

    // THE FIGURES ARE COUNTED, NEVER LAID OUT BY EYE. Both sizes and the block geometry come
    // from out/2026-09-13/computed.json, which reads them out of claim c20's own quote.
    var G = window.TXCOMPUTED;
    var UPPER = G.grid.upper, LOWER = G.grid.lower;

    var cv = document.getElementById("art"), cx = cv.getContext("2d"); cx.scale(2, 2);
    var W = 1080, H = 1350;
    var unit = TXFIG.figure({ view: "front", height: 1.70 });

    // A sprite drawn straight into screen space at one scale, so nothing about depth can make
    // one unit bigger than another.
    function stamp(a, sp, px, py, s, fill) {
      a.save(); a.fillStyle = fill; a.strokeStyle = fill;
      sp.parts.forEach(function (p) {
        a.beginPath();
        if (p.type === "rect") a.rect(px + p.x * s, py - (p.y + p.h) * s, p.w * s, p.h * s);
        else if (p.type === "poly") p.pts.forEach(function (q, i) { i ? a.lineTo(px + q[0] * s, py - q[1] * s) : a.moveTo(px + q[0] * s, py - q[1] * s); });
        else if (p.type === "ellipse") a.ellipse(px + p.cx * s, py - p.cy * s, p.rx * s, p.ry * s, 0, 0, Math.PI * 2);
        else if (p.type === "line") { a.lineWidth = Math.max(1, (p.width || 0.1) * s); a.lineCap = "round";
                                      p.pts.forEach(function (q, i) { i ? a.lineTo(px + q[0] * s, py - q[1] * s) : a.moveTo(px + q[0] * s, py - q[1] * s); }); a.stroke(); a.restore(); a.save(); a.fillStyle = fill; return; }
        a.closePath(); a.fill();
      });
      a.restore();
    }

    // 22 columns inside the 900 px measure. The row pitch is 46 rather than 49 because both
    // labels used to clip the first row of their own block: an isotype with an occluded unit
    // is a miscount, whatever the code counted.
    // S is 21 rather than 26 so a 46 px pitch leaves 10 px of ground between rows. At 26 the
    // rows touched and nine rows of 22 welded into 22 vertical chains, which is a texture and
    // not a count.
    var X0 = 86, PITCH = 42.6, ROW = 46, S = 21;
    var UPPER_Y = 542, LOWER_Y = 1018;   // row 0 BASELINE, the units stand up from it
    function block(a, spec, y0, fill) {
      var n = 0;
      for (var r = 0; r < spec.rows; r++) {
        var inRow = (r === spec.full_rows) ? spec.last_row : spec.cols;
        for (var c = 0; c < inRow; c++) { stamp(a, unit, X0 + c * PITCH, y0 + r * ROW, S, fill); n++; }
      }
      return n;
    }

    TXINK.print(cx, {
      ground: "#1B1E21", ink: "#EDE6D6", fibre: 0.05, seed: 505,
      screen: { mode: "line", cell: 4, angle: 90, gamma: 1.04, floor: 0.04 },
      edges: { threshold: 22, width: 1.1, alpha: 0.62, dx: 1.0, dy: -0.6 },
      draw: function (a) {
        a.fillStyle = "#16191C"; a.fillRect(0, 0, W, H);
        // NO GROUND BAND BEHIND THE BLOCKS. A filled band welds every unit into one silhouette
        // at thumb scale, and a GRID that will not come apart into pieces is not a count.
        // BOTH blocks go through here in ONE ink, so the line plate, the erosion and the edge
        // layer fall on all 267 units identically.
        var nU = block(a, UPPER, UPPER_Y, "#E6EAEC");
        if (nU !== UPPER.n) throw new Error("upper block drew " + nU);
        var nL = block(a, LOWER, LOWER_Y, "#E6EAEC");
        if (nL !== LOWER.n) throw new Error("lower block drew " + nL);
        console.log("blocks drew", nU, nL);
      },
      over: function (c) {
        TXINK.reserve(c, { ground: "#1B1E21", top: 442, topSolid: 442, bottom: 176, bottomSolid: 140 });

        // THE ONE ACCENT: the lower block only, the cohort the fixed model met. The hue is
        // remapped INTO the print rather than painted over it, so the accent carries the same
        // screen the upper block carries and the two halves stay one drawing.
        var dev = c.canvas.width / W;
        var mc = document.createElement("canvas");
        mc.width = c.canvas.width; mc.height = c.canvas.height;
        var mx = mc.getContext("2d"); mx.scale(dev, dev);
        var nM = block(mx, LOWER, LOWER_Y, "#FFFFFF");
        if (nM !== LOWER.n) throw new Error("accent mask drew " + nM);

        // the lower block's own bounding box, padded, in device pixels
        var bx0 = Math.max(0, Math.floor((X0 - 14) * dev));
        var bx1 = Math.min(mc.width,  Math.ceil((X0 + (LOWER.cols - 1) * PITCH + 26) * dev));
        var by0 = Math.max(0, Math.floor((LOWER_Y - 1.75 * S - 8) * dev));
        var by1 = Math.min(mc.height, Math.ceil((LOWER_Y + (LOWER.rows - 1) * ROW + 8) * dev));
        var bw = bx1 - bx0, bh = by1 - by0;

        var mask = mx.getImageData(bx0, by0, bw, bh).data;
        var img  = c.getImageData(bx0, by0, bw, bh), d = img.data;
        var AR = 0x4E, AG = 0x5F, AB = 0xA8;
        var LG = 26, LP = 226;                 // ground and full-ink luminance of this print
        var hit = 0;
        for (var i = 0, n = bw * bh; i < n; i++) {
          var o = i * 4;
          if (mask[o + 3] < 8) continue;
          var lum = 0.2126 * d[o] + 0.7152 * d[o + 1] + 0.0722 * d[o + 2];
          var t = (lum - LG) / (LP - LG);
          if (t <= 0) continue;
          if (t > 1) t = 1;
          hit++;
          d[o]     = d[o]     * (1 - t) + AR * t;
          d[o + 1] = d[o + 1] * (1 - t) + AG * t;
          d[o + 2] = d[o + 2] * (1 - t) + AB * t;
        }
        if (hit < 2000) throw new Error("accent remap touched only " + hit + " px");
        c.putImageData(img, bx0, by0);
        console.log("accent remapped", hit, "px over", nM, "units");
      }
    });
    resolve();
  } catch (e) { reject(e); }
});
</script>
</body>
</html>
