<!doctype html>
<!-- 2026-11-06, frame 1 of 9. Archetype CLOSE_CROP. A spatial scene through txthree.js on the chassis rig_floor at night under the floodlit world: the chassis pipe_robot's gripper closed on a chassis drill_pipe just above its banded pin, the joint below standing in the slips, the chassis rig_mast's lit lattice behind. Drawn to illustrate, to no maker's or operator's design. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:700px">A robot arm now holds the pipe</h1>
<p class="dek" data-follow="26" style="width:600px">ExxonMobil says three of its Permian drilling rigs are automated. Mechanical arms and robotic systems now do much of the heavy pipe handling on the rig floor. The arm is drawn to illustrate.</p>
<script>window.FIG = {"joint_m": 9.4};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-06-rigfloor.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Permian rigs", counter: "01 / 09", src: "c1 c7", fit: { min: 70, max: 92, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 30, near: 0.05, far: 3000, exposure: 1.08 });
  TXT.ground(R, { surface: 'caliche', size: 700 });
  const floor = K.make('rig_floor', { ramp: true }); TXT.add(R, floor); TXT.contact(R, floor);
  const fy = floor.userData.floorY;
  const mast = K.make('rig_mast', {}); mast.position.set(0, fy - 0.12, 0); TXT.add(R, mast);
  /* the joint in the slips: its box stands 0.75 m proud of the floor */
  const low = K.make('drill_pipe', { length: FIG.joint_m }); low.position.set(0, fy + 0.75 - FIG.joint_m, 0); TXT.add(R, low);
  /* the joint the arm holds, its banded pin hanging just over the box */
  const up = K.make('drill_pipe', { length: FIG.joint_m, band: 'pin' }); up.position.set(0, fy + 1.02, 0); TXT.add(R, up);
  const rob = K.make('pipe_robot', { pedestal: 0.45 }); rob.position.set(1.55, fy, 1.75); TXT.add(R, rob); TXT.contact(R, rob);
  const miss = CH.reach(THREE, rob, [0, fy + 1.46, 0]);
  if (miss > 0.03) throw new Error('the gripper misses the pipe by ' + miss.toFixed(3) + ' m');
  /* the camera at arm's length, level with the jaws, the pipe right of centre and the mast above */
  const from = [-2.25, fy + 1.62, 0.9];
  const look = CH.aim(THREE, R, TXT, from, [0, fy + 1.4, 0.0], 470, 930, 30);
  TXT.frame(R, { fov: 30, from, look });
  TXT.sky(R);
  TXT.deckRig(R, CH.rigSpec(W, 8, 4096), CH.rigOpts([0, fy + 1.4, 0], { distance: 30, shadowFar: 80, normalBias: 0.02 }));
  CH.unacne(R, 0.02);
  /* two of the mast's floods, on the key's side, aimed at the well */
  CH.flood(THREE, R, [-2.6, fy + 9.5, 2.6], [-0.4, fy + 1.2, 0.1], { i: 1300, angle: 0.36 });
  CH.flood(THREE, R, [2.6, fy + 12, 2.6], [0, fy, 0], { i: 500, angle: 0.6 });
  /* a pool on the grating under the well, so the pin and the joint below cast onto the floor */
  CH.flood(THREE, R, [-1.2, fy + 6, 1.6], [0.3, fy, -0.2], { i: 1600, angle: 0.3, penumbra: 0.8 });
  CH.flood(THREE, R, [-1.5, fy + 7, 3.5], [0, fy, 0.4], { i: 700, angle: 0.4 });
  /* the mast's floods behind the subject, on its far legs, so the upper third carries the rig's own lamps */
  [[4.6, 3.4, 1.3], [4.6, 2.7, 2.6], [5.4, 3.9, 0.6], [5.0, 3.1, 3.4], [6.2, 4.3, 2.0]].forEach((q) => CH.lampGlow(THREE, R, [q[0], fy + q[1], q[2]], 0xeef2ff, 1.5, 0));
  /* the ember band held on the deck's own hex, diffuse over an emissive base so it keeps its round shading */
  R.scene.traverse((m) => { if (m.isMesh && m.material && m.material.color && m.material.color.getHex() === 0x9a4a34) m.material = new THREE.MeshLambertMaterial({ color: 0x4a281e, emissive: 0x9c5440 }); });
  TXT.stage(R, rob);
  /* two of the mast's floods, far behind the subject in the upper right quarter */
  CH.lampAt(THREE, R, 905, 300, 14, 0.45); CH.lampAt(THREE, R, 1000, 470, 18, 0.4);
  TXT.weather(R, { grime: 0.28, height: 1.2, mottle: 0.14 });
  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  CH.post(cx, { a: 0.4, veil: 0.4, veilH: 280 });
  CH.footWash(cx);
  CH.typeDark(cx, { x1: 760, xf: 240, a: 0.95 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
