<!doctype html>
<!-- 2026-11-06, frame 8 of 9. Archetype DIAGRAM. A TXBENCH material relief of one rack of rack_unit drill pipe joints in plan on two rack beams, the rack_next nearest the top banded in ember paint at their box tool joints. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">About 25% of the fleet next year</h1>
<p class="dek" data-follow="26" style="width:860px">ExxonMobil expects to expand automated rigs to that share of its Permian fleet, chief executive Darren Woods said. The rack stands for the whole fleet, not a rig count.</p>
<div class="lab gold" id="lab-share">about 25%</div>

<script>window.FIG = {"rack_unit": 20, "rack_next": 5};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-06-rigfloor.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
/* the bench's materials: 1 mill scale steel, 2 worn bright steel, 3 ember paint, 4 rust streaked beam, 5 rock */
const ALB = { 0: [0.012, 0.013, 0.016], 1: [0.062, 0.066, 0.072], 2: [0.30, 0.31, 0.32], 3: [0.58, 0.15, 0.085], 4: [0.15, 0.085, 0.052], 5: [0.011, 0.0105, 0.010], 6: [0.019, 0.017, 0.015] };
const SPEC = { 1: [0.55, 28], 2: [0.95, 70], 3: [0.12, 8], 4: [0.25, 16], 5: [0.06, 6], 6: [0.06, 6] };
/* a leader on the plate: a cream hairline from a label to what it names, ending in a dot */
function lead(cx, a, b) { cx.save(); cx.strokeStyle = 'rgba(240,236,228,0.92)'; cx.fillStyle = cx.strokeStyle; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke(); cx.beginPath(); cx.arc(b[0], b[1], 5, 0, 7); cx.fill(); cx.restore(); }
function feather(cx, y) { const g = cx.createLinearGradient(0, y - 4, 0, y + 70); g.addColorStop(0, 'rgba(5,6,10,0.96)'); g.addColorStop(1, 'rgba(5,6,10,0)'); cx.fillStyle = g; cx.fillRect(0, y - 4, 1080, 74); }
function plate(id) { const el = document.getElementById(id); if (el) { el.style.background = 'rgba(6,7,11,0.86)'; el.style.padding = '4px 10px'; } return el; }
function grain(X, Y, s) { return 0.82 + 0.36 * (0.5 + 0.5 * TX.fbm2(X / s, Y / s, 3)); }
window.renderReady = (async () => {
  const cx = await CH.bootFlat({ kicker: "Next year", counter: "08 / 09", src: "c4", fit: { min: 80, max: 104, maxLines: 2 } });
  cx.scale(2, 2); TX.reseed(20261106);
  /* THE FIGURE: rack_unit joints lying side by side; the rack_next nearest the top carry the ember band on their box. */
  const Y0 = 600, P = (1225 - Y0) / FIG.rack_unit, R = P * 0.45, RT = P * 0.5;
  const BOX0 = 96, BOX1 = 176, BAND0 = 98, BAND1 = 174, PIN = 1110;
  const beams = [300, 830];
  function surf(X, Y) {
    if (Y < Y0 - 30) return [0, 0];
    const k = Math.floor((Y - Y0) / P), cy = Y0 + k * P + P / 2, d = Math.abs(Y - cy);
    const onBeam = beams.some((b) => Math.abs(X - b) < 26);
    if (k >= 0 && k < FIG.rack_unit) {
      const tj = X > BOX0 && X < BOX1, up = (X >= BOX1 && X < BOX1 + 26);
      const r = tj ? RT : up ? RT - (RT - R) * (X - BOX1) / 26 : R;
      if (d < r) { const h = 6 + 16 * Math.sqrt(1 - (d * d) / (r * r));
        const m = (tj || up) && X > BAND0 && k < FIG.rack_next ? 3 : (tj || up) ? 2 : 1; return [h, m]; }
    }
    if (onBeam) return [6, 4];
    return [0, 0];
  }
  const height = (X, Y) => surf(X, Y)[0], material = (X, Y) => surf(X, Y)[1];
  const albedo = (X, Y, m) => { const a = ALB[m] || ALB[0], g = grain(X, Y, 17); return [a[0] * g, a[1] * g, a[2] * g]; };
  TXBENCH.relief(cx, { x: 0, y: Y0 - 30, w: 1080, h: 1350 - Y0 + 30, scale: 2, height, material, albedo, spec: SPEC,
    ambient: 0.14, diffuse: 1.0, ao: 0.9, shadow: 1.0, softness: 5, castLength: 120, dither: true });
  const ly = Y0 + (FIG.rack_next * P) / 2, lx = BOX1 + 34;
  CH.typeDark(cx); CH.footWash(cx); feather(cx, Y0 - 30);
  /* a bracket down the right of the banded group's tool joints, the label on it */
  cx.save(); cx.strokeStyle = '#B4664F'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(BOX1 + 10, Y0 + 4); cx.lineTo(BOX1 + 22, Y0 + 4); cx.lineTo(BOX1 + 22, Y0 + FIG.rack_next * P - 4); cx.lineTo(BOX1 + 10, Y0 + FIG.rack_next * P - 4); cx.stroke(); cx.restore();
  plate('lab-share'); CH.pinLabel('lab-share', [lx, ly], [0, -22]);
  window.__txLeaders = [{ target: 'the banded joints', at: [BOX1 + 22, ly], to: [BAND1, ly] }];
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
