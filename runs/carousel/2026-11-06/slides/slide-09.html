<!doctype html>
<!-- 2026-11-06, frame 9 of 9. Archetype GRID. A spatial scene through txthree.js on the pipe deck in the floodlit world: one rack of rack_unit chassis drill_pipe joints on two rack beams, the rack_2028 nearest the lens banded in ember, the chassis rig_floor beyond with the parked pipe_robot, a stand in the slips and the lit rig_mast. Drawn to illustrate, to no maker's or operator's design. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:600px">About half by 2028, with similar staffing</h1>
<p class="dek" data-follow="26" style="width:540px">Woods said ExxonMobil expects automated rigs on approximately half its Permian fleet by 2028. The company expects similar staffing levels on automated rigs.</p>
<script>window.FIG = {"rack_unit": 20, "rack_2028": 10, "joint_m": 9.4};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-06-rigfloor.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "The plan", counter: "09 / 09", src: "c5 c9", fit: { min: 70, max: 92, maxLines: 3 } });
  const R = CH.stage(TXT, gl, W, { fov: 40, near: 0.1, far: 3000, exposure: 1.2 });
  TXT.ground(R, { surface: 'dirt', size: 900 });
  /* the rig, 26 m beyond the rack, its V door and catwalk toward the camera */
  const floor = K.make('rig_floor', { ramp: true }); floor.position.set(36, 0, -46); TXT.add(R, floor); TXT.contact(R, floor);
  const fy = floor.userData.floorY;
  const mast = K.make('rig_mast', {}); mast.position.set(36, fy - 0.12, -46); TXT.add(R, mast);
  const rob = K.make('pipe_robot', { pedestal: 0.45, yaw: -90, shoulder: 10, elbow: -30 }); rob.position.set(37.85, fy, -46.2); TXT.add(R, rob);
  const st = K.make('pipe_stand', { joints: 2, length: FIG.joint_m }); st.position.set(36, fy + 0.75 - FIG.joint_m, -46); TXT.add(R, st);
  /* THE FIGURE: one rack of rack_unit joints of joint_m metres on two steel beams, the rack_2028 nearest the lens banded */
  const BEAM = new THREE.MeshStandardMaterial({ color: 0x3a3430, metalness: 0.6, roughness: 0.62 });
  const pitch = 0.26, depth = (FIG.rack_unit - 1) * pitch;
  [-3.2, 0.8].forEach((x) => { const b = TXT.roundedBox(0.3, 0.72, depth + 0.8, 0.02, BEAM); b.position.set(x - 2.2, 0.36, -2.0 - depth / 2); TXT.add(R, b); TXT.contact(R, b); });
  for (let i = 0; i < FIG.rack_unit; i++) {
    const j = K.make('drill_pipe', { length: FIG.joint_m, lying: true, band: i < FIG.rack_2028 ? 'box' : null, bandH: 0.3, hardband: false, seed: 30 + i });
    j.rotation.y = -Math.PI / 2; j.position.set(-2.2 + FIG.joint_m / 2, 0.72, -2.0 - i * pitch); TXT.add(R, j);
  }
  const from = [-9.6, 3.1, 3.2];
  const look = CH.aim(THREE, R, TXT, from, [-6.2, 0.8, -3.6], 380, 1150, 46);
  TXT.frame(R, { fov: 46, from, look });
  TXT.sky(R);
  TXT.deckRig(R, CH.rigSpec(W, 30, 4096), CH.rigOpts([-3, 0.7, -4], { distance: 40, shadowFar: 120, normalBias: 0.02 }));
  CH.unacne(R, 0.02);
  CH.flood(THREE, R, [-11, 8, 2], [-3.2, 0.7, -4.5], { i: 3100, angle: 0.62, reach: 60 });
  CH.flood(THREE, R, [33.4, fy + 9.5, -43.4], [36, fy, -46], { i: 1400, angle: 0.6 });
  (mast.userData.lamps || []).forEach((p) => CH.lampGlow(THREE, R, [p[0] + 36, p[1] + fy - 0.12, p[2] - 46], 0xeef2ff, 1.6, 0));
  /* the ember bands held on the deck's own hex here, the paint lit from within a step so the cold flood does not wash it pale */
  R.scene.traverse((m) => { if (m.isMesh && m.material && m.material.color && m.material.color.getHex() === 0x9a4a34) m.material = new THREE.MeshLambertMaterial({ color: 0x24130d, emissive: 0xf27c5c }); });
  TXT.stage(R, floor);
  TXT.weather(R, { grime: 0.3, height: 1.0, mottle: 0.14 });
  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  CH.post(cx, { a: 0.42, veil: 0.4, veilH: 280 });
  CH.footWash(cx, { x: 1000, r: 300 });
  CH.typeDark(cx, { x1: 860, xf: 260 });
  /* the lattice falls to black behind the counter */
  { const g = cx.createRadialGradient(945, 98, 10, 945, 98, 170); g.addColorStop(0, 'rgba(5,6,10,0.9)'); g.addColorStop(0.6, 'rgba(5,6,10,0.6)'); g.addColorStop(1, 'rgba(5,6,10,0)'); cx.fillStyle = g; cx.fillRect(760, 0, 320, 280); }
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
