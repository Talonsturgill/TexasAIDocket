<!doctype html>
<!-- 2026-10-29, frame 9 of 9. Archetype FIGURE_SCALE. A spatial scene through txthree.js in the deck's lastLight world: a county courthouse on its square at night with its upper windows lit, a resident walking toward the steps. The kit courthouse is drawn to illustrate a county seat and is not the Briscoe County courthouse. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:880px">An abatement comes first</h1>
<p class="dek" data-follow="24" style="width:860px">Closing depends in part on approval of a tax abatement for the project in Briscoe County. The county posts its tax abatement guidelines beside its Commissioners Court agendas. The courthouse is drawn to illustrate a county&nbsp;seat.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-29-caprock.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "What comes next", counter: "09 / 09", src: "c4 c22", fit: { min: 72, max: 100, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 44, near: 0.2, far: 5000, fog: 0.0022 });
  const C = [0, 0, -78];
  const ch = K.make('county_courthouse', { style: 'romanesque', storeys: 3, square: true, seed: 5 });
  ch.position.set(C[0], 0, C[2]); CH.put(ch, true);
  /* the lit rooms upstairs: the kit's warm glass, brought up to read as a lamp in an office after dark. Non casting */
  /* ONE lit room upstairs: of the kit's warm glass, only the highest pane is brought up to read as a lamp in an office
   * after dark, and every other lit pane goes back to the dark glass. Non casting */
  const lit = []; ch.updateMatrixWorld(true);
  ch.traverse((o) => { if (o.isMesh && o.material && o.material.emissive && o.material.emissive.getHex() === 0xffc98a) lit.push(o); });
  const yOf = (o) => new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()).y;
  lit.sort((u, v) => yOf(v) - yOf(u));
  lit.forEach((o, i) => { o.material = o.material.clone(); o.material.emissiveIntensity = i === 0 ? 1.6 : 0; o.castShadow = false; });
  /* a resident on the walk, turned three quarters away, mid stride, lit from the camera's side */
  const p = K.make('person', { role: 'resident', pose: 'walk', hatColor: 0x2a2620, seed: 23 });
  p.position.set(-2.4, 0.03, 26); p.rotation.y = Math.PI * 0.9; CH.put(p, true);
  p.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  /* the square's walk: jointed paving in a pale caliche tone from the bottom edge to the steps, between dark lawn
   * strips, so the resident walks on a place rather than a slab */
  const walkM = K.mat('cp_walk', { color: 0xffffff, roughness: 0.9, map: K.tex('concrete') });
  const walkG = new THREE.PlaneGeometry(6, 150, 1, 1); walkG.rotateX(-Math.PI / 2); K.uvBox(walkG, 3);
  const walk = new THREE.Mesh(walkG, walkM); walk.position.set(-2, 0.03, 10); walk.receiveShadow = true; walk.userData.txWear = false; TXT.add(R, walk);
  for (let z = 83; z > -64; z -= 3) { const j = new THREE.Mesh(new THREE.PlaneGeometry(6, 0.06).rotateX(-Math.PI / 2), K.mat('cp_joint', { color: 0x2a2724, roughness: 1 })); j.position.set(-2, 0.035, z); j.userData.txWear = false; TXT.add(R, j); }
  const lawnM = K.mat('cp_lawn', { color: 0x2c3320, roughness: 1 });
  [-1, 1].forEach((sd) => { const l = new THREE.Mesh(new THREE.PlaneGeometry(26, 150).rotateX(-Math.PI / 2), lawnM); l.position.set(-2 + sd * 16, 0.02, 10); l.receiveShadow = true; TXT.add(R, l); });
  TXT.sky(R);
  TXT.ground(R, { surface: 'concrete', size: 4000, seed: 41, color: 0x9a948b, joints: true });
  const from = [-6, 1.3, 52];
  const look = CH.aim(THREE, R, TXT, from, [C[0], 0, C[2]], 560, 1150, 44);
  TXT.frame(R, { fov: 44, from, look });
  /* the square's lawn either side of the walk, grass rather than a flat plane */
  TXT.scatter(R, { kind: 'grass', count: 9000, area: [-30, -60, 26, 70], avoid: [[-5.6, -70, 1.6, 90]], seed: 37, scale: [0.25, 0.45] });
  CH.warm(R, 0.18);
  TXT.deckRig(R, CH.rigSpec(W, 150, 4096), CH.rigOpts([C[0], 10, -20], { distance: 220, shadowFar: 520 }));
  TXT.weather(R, { grime: 0.45, height: 2.5 });
  TXT.stage(R, ch, { poolInner: 1.6, poolOuter: 4.5 });
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.3, veil: 0.32 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
