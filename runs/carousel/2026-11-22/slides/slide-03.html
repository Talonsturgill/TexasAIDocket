  /* THE CLINICIAN: on a rolling stool across the table's foot, three quarters away from the doorway, leaning in, one hand up mid sentence */

  /* THE BOOM MIC: hung from the ceiling on its cable, a foam windscreened shotgun mic pointed down between them */
  { const MIC = new THREE.Vector3((ACT.x + CLN.x) / 2 - 0.1, 2.12, (ACT.z + CLN.z) / 2 - 0.15);

    const trof = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.6), new THREE.MeshBasicMaterial({ color: 0xf4fbff, name: 'troffer-lens' })); trof.material.userData.txSurface = false; trof.material.color.multiplyScalar(1.4);

  /* THE PAGE: one printed sheet face down and untouched on the oak desk by the doorway, its print only a ghost through the paper */
  const DESK = new THREE.Vector3(1.1, 0, 0.95);
  const desk = K.make('desk', { w: 0.95, d: 0.55, wood: 0xc8935a, pedestal: 'right' });
  { const oakTex = tex(1024, 512, (g, w, h) => { g.fillStyle = '#8e5a33'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 520; i++) { const y = rnd() * h, a = 0.04 + rnd() * 0.1; g.strokeStyle = 'rgba(' + (120 + rnd() * 40 | 0) + ',' + (70 + rnd() * 30 | 0) + ',30,' + a.toFixed(3) + ')'; g.lineWidth = 0.6 + rnd() * 1.6;

      for (let i = 0; i < 260; i++) { g.fillStyle = 'rgba(255,230,180,0.10)'; g.fillRect(rnd() * w, rnd() * h, 8 + rnd() * 18, 1.5); } }, [1, 1]);
    desk.traverse((m) => { if (m.isMesh && m.material && /veneer/.test(m.material.name || '')) { const om = m.material; m.material = new THREE.MeshPhysicalMaterial({ map: oakTex, color: 0xffffff, roughness: 0.42, clearcoat: 0.55, clearcoatRoughness: 0.25, name: 'white-oak' }); if (om.map) { oakTex.wrapS = oakTex.wrapT = THREE.RepeatWrapping; } } }); }

  const pageBack = tex(512, 660, (g, w, h) => { g.fillStyle = '#fbf8f0'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 3000; i++) { g.fillStyle = 'rgba(120,110,90,' + (rnd() * 0.05).toFixed(3) + ')'; g.fillRect(rnd() * w, rnd() * h, 1.3, 1.3); }
    g.save(); g.translate(w, 0); g.scale(-1, 1);
    for (let L = 0; L < 26; L++) { const y = 60 + L * 21; let x = 50; const end = w - 50 - (L % 7 === 6 ? 200 : rnd() * 40); while (x < end) { const ww = 14 + rnd() * 44; g.fillStyle = 'rgba(80,84,110,0.06)'; g.fillRect(x, y, Math.min(ww, end - x), 6); x += ww + 9; } }

  let pageW;

    const page = new THREE.Mesh(pg, pm); page.rotation.x = -Math.PI / 2; page.rotation.z = 0.15; page.castShadow = true; page.receiveShadow = true; page.userData.txBevel = false;
    page.position.set(-0.14, 0.762, 0.03); desk.add(page); const pageU = new THREE.Mesh(pg, pmB); pageU.userData.txBevel = false; page.add(pageU); desk.updateMatrixWorld(true); pageW = new THREE.Vector3(); page.getWorldPosition(pageW); }
  /* a capped pen lying apart from it, and the clinician's coiled stethoscope by the desk's back edge: nothing on the page */
  { const penM = new THREE.MeshPhysicalMaterial({ color: 0x1d2a7a, roughness: 0.3, clearcoat: 0.8, name: 'pen-plastic' });
    const pen = new THREE.Mesh(new THREE.CylinderGeometry(0.0055, 0.0055, 0.14, 16), penM); pen.rotation.z = Math.PI / 2; pen.rotation.y = 1.1; pen.position.set(0.14, 0.762 + 0.0055, 0.14); pen.castShadow = true; desk.add(pen);
    const clip = rb(0.03, 0.003, 0.004, 0.001, new THREE.MeshStandardMaterial({ color: 0xd8dde6, metalness: 1, roughness: 0.3, name: 'steel-clip' })); clip.position.set(0.14, 0.762 + 0.012, 0.14); clip.rotation.y = 1.1 - Math.PI / 2; desk.add(clip);
  }

  /* THE CAMERA: standing in the doorway, a step back, eye height, the actor and clinician in the window's light */
  const actHead = new THREE.Vector3(...AA.eye).applyMatrix4(actor.matrixWorld);
  actor.updateMatrixWorld(true);

  CH.aim(THREE, R, TXT, FROM, [actHead.x, actHead.y, actHead.z], 470, 330, 44);

  /* the desk goes back and right, beside the clinician: its front feet stop above the headline (y 780), the page at x 975 */
  { const P0 = new THREE.Vector3(-0.14, 0.762, 0.03);
    desk.rotation.y = -0.55;
    const pg = () => { desk.updateMatrixWorld(true); return CH.project(THREE, R, P0.clone().applyMatrix4(desk.matrixWorld).toArray()); };
    const foot = () => { desk.updateMatrixWorld(true); return Math.max(...[[-0.475, 0, 0.275], [0.475, 0, 0.275]].map((q) => CH.project(THREE, R, new THREE.Vector3(...q).applyMatrix4(desk.matrixWorld).toArray())[1])); };
    const clearStool = () => { desk.updateMatrixWorld(true); const bx = new THREE.Box3().setFromObject(desk); return !(bx.min.x < CLN.x + 0.36 && bx.max.z > CLN.z - 0.36 && bx.min.z < CLN.z + 0.36); };
    for (let k = 0; k < 5; k++) {
      for (let it = 0; it < 60 && foot() > 780; it++) desk.position.z -= 0.03;
      for (let it = 0; it < 12; it++) { const a = pg()[0]; desk.position.x += 0.01; const b = pg()[0]; desk.position.x -= 0.01; const d = (b - a) / 0.01; if (Math.abs(d) < 1) break; desk.position.x += (960 - a) / d; if (Math.abs(960 - a) < 1) break; }
      for (let it = 0; it < 40 && !clearStool(); it++) desk.position.x += 0.02; }
    if (foot() > 790) throw new Error('the desk still reaches the type band at ' + Math.round(foot()));
    desk.updateMatrixWorld(true); pageW = P0.clone().applyMatrix4(desk.matrixWorld); TXT.contact(R, desk, { opacity: 0.5 });
   }
  /* checks: faces small, the page in frame, the table wide enough */
  { const e1 = new THREE.Vector3(...CA.eye).applyMatrix4(clin.matrixWorld);
    const fa = CH.project(THREE, R, [e1.x, e1.y + 0.12, e1.z]), fb = CH.project(THREE, R, [e1.x, e1.y - 0.13, e1.z]);
    const fh = Math.abs(fb[1] - fa[1]); if (fh * fh * 0.8 / (1080 * 1350) > 0.02) throw new Error('the clinician face is over 2 percent of the frame');
    { const e2 = new THREE.Vector3(...AA.eye).applyMatrix4(actor.matrixWorld); const ga = CH.project(THREE, R, [e2.x, e2.y + 0.12, e2.z]), gb = CH.project(THREE, R, [e2.x, e2.y - 0.13, e2.z]); const gh = Math.abs(gb[1] - ga[1]); if (gh * gh * 0.8 / (1080 * 1350) > 0.02) throw new Error('the actor face is over 2 percent of the frame'); }
    const pgp = CH.project(THREE, R, pageW.toArray()); if (pgp[0] < 600 || pgp[0] > 1040 || pgp[1] < 300 || pgp[1] > 1150) throw new Error('the page is out of frame at ' + pgp.map(Math.round));
    const t0 = CH.project(THREE, R, [TBL.x - 0.95, 0.7, TBL.z + 0.35]), t1 = CH.project(THREE, R, [TBL.x + 0.95, 0.7, TBL.z + 0.35]);
    window.__s3 = { face: fh, page: pgp, table: [t0, t1] }; }

  CH.KEY_SCALE = 1.25;

  { const f = new THREE.DirectionalLight(0x8a90ff, 0.55); f.position.set(-1, 2.2, 6); R.scene.add(f); }
  TXT.weather(R, { grime: 0.04, height: 0.1, mottle: 0.05 });

  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);

  CH.seat(cx, { sel: '.hook', a: 0.55, fade: 120 });

  /* knock out the lit floor and the desk corner behind the end of the headline's first line, so nothing runs through it */
  { const l1 = hook.getBoundingClientRect(); CH.seat(cx, { box: { x: l1.left + 420, y: l1.top + 40, w: l1.width - 400, h: 120 }, a: 0.7, fade: 90 }); }
  CH.seat(cx, { sel: '.kick', a: 0.6, fade: 60 });
  CH.seat(cx, { sel: '.count', a: 0.5, fade: 60 });
  CH.seat(cx, { sel: '#site', a: 0.92, fade: 80 });
  CH.seat(cx, { sel: '#site', a: 0.6, fade: 40 });
  CH.seat(cx, { sel: '.src', a: 0.45, fade: 50 });
  TXDECK.finish(cx);
  return true;
})();
