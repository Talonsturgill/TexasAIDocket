  { const cb = new THREE.Box3().setFromObject(car); const stopZ = RAIL.z0 - stopInner;   /* +x -> -z */
    if (Math.abs(cb.max.z - stopZ) > 0.0015) throw new Error('the carriage is not parked at the zero stop: ' + cb.max.z.toFixed(4) + ' vs ' + stopZ.toFixed(4)); }

  /* ---- THE TOOL WITHIN REACH: a laptop at the rail's far end, its screen plain cyan, no picture on it ---- */
  const lap = K.make('laptop', { open: 106, finish: 'silver', screen: 'doc' });
  let screens = 0;
  lap.traverse((m) => { if (m.isMesh && m.geometry && m.geometry.type === 'PlaneGeometry' && m.geometry.parameters.width > 0.2) { m.material = CH.toolMat(K); m.material.userData.txSurface = false; screens++; } });
  if (screens !== 1) throw new Error('expected one laptop screen to light, found ' + screens);
  const LAP = { x: 0.06, z: RAIL.z0 - RAIL.L - 0.2 };
  lap.position.set(LAP.x, 0, LAP.z); lap.rotation.y = -0.12;
  shadowAll(lap); TXT.add(R, lap); pad(0.42, 0.34, LAP.x, LAP.z, 0.12, 0.5);
  /* the glow stays the deck's one tool glow; only the sky's reflection is taken off the glass in this frame so the cyan reads */
  { const tm = CH.toolMat(K); tm.envMapIntensity = 0.08; tm.roughness = 0.6; }
  const lapScreen = [LAP.x, 0.13, LAP.z - 0.08];
  CH.lampGlow(THREE, R, [LAP.x, 0.12, LAP.z - 0.22], 0x22d3ee, 1.0, 0);
  const spill = new THREE.PointLight(0x22d3ee, 0.9, 0.9, 2); spill.position.set(LAP.x - 0.02, 0.1, RAIL.z0 - RAIL.L - 0.09); R.scene.add(spill);

  /* ---- THE QUESTION TABS, at the rail's foot: FIG.questions brass tabs, pips 1 to n, the first lit ---- */
  const tabLit = new THREE.MeshPhysicalMaterial({ color: 0xffa82e, map: brushRep, metalness: 1, roughness: 0.34, emissive: 0xff8c10, emissiveIntensity: 0.4, clearcoat: 0.7, name: 'polished-brass' });
  const tabs = [];
  for (let i = 0; i < NQ; i++) {
    const t = new THREE.Group(), m = i === 0 ? tabLit : brassDullE;
    const plate = chamfer(0.05, 0.034, 0.004, 0.0012, m); plate.rotation.x = -Math.PI / 2; plate.position.y = 0.0032; t.add(plate);
    for (let p = 0; p <= i; p++) { const pip = new THREE.Mesh(new THREE.SphereGeometry(0.0034, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), m);
      pip.position.set((p - i / 2) * 0.012, 0.0064, 0.003); t.add(pip); }
    /* a notch hole at the back, where it would hang on a hook */
    t.position.set(RAIL.x + 0.1, 0, RAIL.z0 - 0.23 - i * 0.056); t.rotation.y = 0;
    shadowAll(t); TXT.add(R, t); pad(0.075, 0.055, t.position.x, t.position.z, t.rotation.y, 0.45); tabs.push(t);
  }
  if (tabs.length !== NQ) throw new Error('drew ' + tabs.length + ' question tabs, FIG.questions is ' + NQ);
  const litCount = tabs.filter((t) => t.children[0].material === tabLit).length;
  if (litCount !== 1 || tabs[0].children[0].material !== tabLit) throw new Error('exactly the first question tab must be lit');
  CH.lampGlow(THREE, R, [tabs[0].position.x, 0.01, tabs[0].position.z], 0xffd27a, 0.09, 0);
  { const warm = new THREE.PointLight(0xffc060, 0.25, 0.25, 2); warm.position.set(tabs[0].position.x, 0.05, tabs[0].position.z + 0.02); R.scene.add(warm); }

  /* ---- CAMERA: eleven centimetres above the desk, right over the zero end of the rail, looking down it to the laptop ---- */
  const FOV = 40, from = [0.10, 0.12, SL.zNear + 0.2];
  const look = CH.aim(THREE, R, TXT, from, lapScreen, 770, 560, FOV);
  TXT.frame(R, { fov: FOV, from, look });

  /* ---- LIGHT: the key from the left and a little in front, raking across the ridges ---- */
  const spec = CH.rigSpec(W, 1.8, 4096);
  TXT.deckRig(R, spec, Object.assign(CH.rigOpts([0, 0, -0.6], { distance: 6, shadowFar: 14, normalBias: 0.004 }), { light: { az: 35, el: 40 } }));
  TXT.weather(R, { grime: 0.04, height: 0.03, mottle: 0.05 });

  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  CH.seat(cx, { sel: '.hook', a: 0.42, fade: 140 });
  CH.seat(cx, { sel: '.dek', a: 0.55, fade: 150 });
  TXLOOK.footWash(cx, { a: 0.7, height: 240 });
  /* contrast pass 1 */ CH.seat(cx, { sel: '.hook', a: 0.35, fade: 90 }); CH.seat(cx, { sel: '.dek', a: 0.35, fade: 90 }); CH.seat(cx, { sel: '.kick', a: 0.35, fade: 90 }); CH.seat(cx, { sel: '.count', a: 0.35, fade: 90 });
  /* contrast pass 2 */ CH.seat(cx, { sel: '.tx-site', a: 0.5, fade: 60 }); CH.seat(cx, { sel: '.count', a: 0.3, fade: 60 });
  TXDECK.finish(cx);
  return true;
})();
</script>
