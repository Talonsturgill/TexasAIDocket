<!doctype html>
<!-- 2026-11-11, frame 1 of 9. Archetype FULL_BLEED. A spatial scene through txthree.js in the lastLight world: a green city limit sign close and low on a caliche shoulder on the flats east of Brownsville, the last seam behind it on the left. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">Brownsville let the land go.</h1>
<p class="dek" data-follow="26" style="width:860px">Brownsville took the land out of its city limits at SpaceX&#39;s request, and Starbase annexed it. Starbase will now consider a tax break for a gas-fired power plant and super-compute facility on the site, which its notice puts at about 444 acres.</p>
<script>window.FIG = {};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-11-cityline.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Starbase, Cameron County", counter: "01 / 09", src: "c1 c3 c9 c10 c14", fit: { min: 80, max: 104, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 34, near: 0.05, far: 3000, fog: W.fogDensity * 0.5 });
  /* the sign stands at the origin facing +z, turned toward the camera's right */
  const sign = K.make('city_limit_sign', { seed: 11, color: 0x36a072, tint: 0x3fa07a, glow: 0.22, lit: 0.6, rim: 0.6, legend: 'city_limit' });
  /* galvanized posts: the kit's tall unmapped parts take a grey metal, so the warm key reads as a highlight, not cream paint */
  sign.traverse((m) => { if (!m.isMesh || !m.material || m.material.map) return; m.geometry.computeBoundingBox(); const bb = m.geometry.boundingBox, s = new THREE.Vector3(); m.getWorldScale(s); if ((bb.max.y - bb.min.y) * s.y < 1.0) return; m.material = m.material.clone(); m.material.color.setHex(0x8e9398); m.material.metalness = 0.65; m.material.roughness = 0.42; });
  sign.rotation.y = -0.14; TXT.add(R, sign); TXT.contact(R, sign, { opacity: 0.8 });
  const FROM = [2.66, 1.53, 6.8];
  const LOOK = CH.aim(THREE, R, TXT, FROM, [0, 1.3, 0], 530, 905, 34);
  TXT.frame(R, { fov: 34, from: FROM, look: LOOK });
  TXT.sky(R);
  TXT.ground(R, { surface: 'caliche', color: 0x8a8070, size: 3000, seed: 11 });
  TXT.scatter(R, { kind: 'rock', count: 700, area: [-2.5, -1.5, 3.5, 3.5], seed: 4, scale: [0.01, 0.035] });
  TXT.scatter(R, { kind: 'grass', count: 900, area: [-14, -30, 14, 7], avoid: [[-1.2, -0.8, 4.5, 1.2]], seed: 7, scale: [0.6, 1.0] });
  TXT.deckRig(R, CH.rigSpec(W, 8, 2048), CH.rigOpts([0, 1, 0], { distance: 30, shadowFar: 80, normalBias: 0.02 }));
  /* the key's own pool on the shoulder at the posts, on the declared bearing, so the feet stand on lit caliche and the casts run right */
  const sd = TXT.sunDir();
  /* a warm pool on the caliche at the feet, so both contacts and both casts read */
  /* the pool is aimed under the ground so its cone lights the shoulder and the post feet and stops below the panel */
  CH.pool(THREE, TXT, R, [0.9, -0.9, 0.2], { radius: 1.9, i: 14, color: 0xffc890, normalBias: 0.004 });
  TXT.weather(R, { grime: 0.25, height: 0.6, mottle: 0.2 });
  TXT.stage(R, sign);
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.dress(cx, { foot: 0.88, fade: 50, pad: 6 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
