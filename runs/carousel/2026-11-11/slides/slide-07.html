<!doctype html>
<!-- 2026-11-11, frame 7 of 9. Archetype OBJECT_AND_CAPTION. A spatial scene through txthree.js inside a TXT.interior hearing room: rows of empty padded chairs, counted from figures.json, face an empty dais and a lectern in one lamp's pool, the window on the left taking the last light. One chair per day until the hearing. Drawn to illustrate, not Starbase's room. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">28 days to be heard</h1>
<p class="dek" data-follow="26" style="width:860px">Starbase&#39;s City Commission meets Wednesday, December&nbsp;9th. It will consider a Chapter 312 tax abatement and a Chapter 380 agreement with SpaceX.</p>
<div class="lab" id="lab1" style="left:80px;top:1150px">one chair per day until the hearing</div>
<script>window.FIG = {"days_to_hearing": 28};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-11-cityline.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Starbase, Cameron County", counter: "07 / 09", src: "c4 c5 c6 c7", fit: { min: 80, max: 104, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 38, near: 0.05, far: 200 });
  TXT.interior(R, { w: 14, d: 14, h: 4.2, floor: 'concrete', wall: 0x3a3632, window: 'left', ceiling: false, light: 0.32 });
  /* THE FIGURE: days_to_hearing chairs, seven to a row */
  const per = 7, rows = Math.ceil(FIG.days_to_hearing / per);
  const seats = K.make('public_seating', { rows: rows, perRow: per, aisle: false, type: 'chairs', color: 0x5a4c40, frame: 'chrome' });
  seats.position.set(0, 0, 2.2); TXT.add(R, seats); TXT.contact(R, seats, { opacity: 0.7 });
  const dais = K.make('hearing_dais', { seats: 5, curve: 9, chairs: false, mics: true }); dais.position.set(0, 0, -5.4); TXT.add(R, dais); TXT.contact(R, dais, { opacity: 0.8 });
  const pod = K.make('podium', { mic: true, seal: false }); pod.position.set(0.6, 0, -1.6); pod.rotation.y = Math.PI; TXT.add(R, pod); TXT.contact(R, pod, { opacity: 0.8 });
  const FROM = [-0.3, 3.4, 10.4];
  const LOOK = CH.aim(THREE, R, TXT, FROM, [0.2, 0.6, 0.6], 560, 980, 38);
  TXT.frame(R, { fov: 38, from: FROM, look: LOOK });
  TXT.deckRig(R, CH.rigSpec(W, 16, 2048), CH.rigOpts([0, 0, 0], { distance: 30, shadowFar: 60, normalBias: 0.02 }));
  CH.darkHall(R, { env: 0.12, amb: 0.5, fill: 0.5 });
  /* one lamp over the lectern: the room is dark around it */
  CH.flood(THREE, R, [-1.2, 4.0, -0.4], [0.6, 1.0, -1.6], { color: 0xffe6c8, i: 700, reach: 12, angle: 0.55, penumbra: 0.6 });
  /* the window's last light rakes the chair tops from the left */
  CH.flood(THREE, R, [-7, 2.6, 3.5], [0, 0.8, 2.8], { color: 0xb8c8e8, i: 150, reach: 14, angle: 0.5, penumbra: 0.8 });
  TXT.weather(R, { grime: 0.15, height: 0.4, mottle: 0.15 });
  TXT.stage(R, pod);
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.dress(cx, { foot: 0.6 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
