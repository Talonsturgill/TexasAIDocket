<!doctype html>
<!-- 2026-10-08, frame 1 of 9. Archetype FULL_BLEED. RENDERED through txthree.js in the deck's lastLight world. The Caravan's nose close and low on the apron at last light, every light on, the prop turning, one cyan thread rising from the spine antenna and leaving by the right edge. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  .tx-site { font-size:24px; }
  .dek { width:860px; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Software on the radio</h1>
<p class="dek" data-follow="24">Merlin says it demonstrated AI-powered air traffic control communications at TxDOT's Project Nexus kickoff on September 10th. Neither TxDOT's release nor the FAA's names Merlin. The plane is drawn to illustrate.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-08-nexus.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await NX.boot(THREE, TXT, initKit, { kicker: "Fort Worth Alliance Airport", counter: "01 / 09", src: "c1 c2 c25 c26", fit: { min: 92, max: 124, maxLines: 2 } });
  const R = NX.stage(TXT, gl, W, { fov: 34 });
  TXT.ground(R, { surface: 'grass', size: 9000, tile: 7, seed: 31, color: 0x6f6a4c });   /* the infield, dry little bluestem straw */
  NX.apron(0, 0, 140, 120, { seed: 19 });
  /* the runway far beyond the apron, its lamps on, running east and west across the back */
  const rw = new THREE.Group(); TXT.add(R, rw);
  NX.runway({ length: 3000, z0: 1500, stripes: 8 });
  /* the hero: nose north, its left side to the west, taxiing with every light on and the disc turning */
  const p = NX.plane({ prop: 'disc', lights: true, seed: 3 }); p.rotation.y = Math.PI; p.position.set(0, 0, 0); TXT.add(R, p); TXT.contact(R, p);
  const ws = K.make('windsock', { toward: 2.4 }); ws.position.set(-46, 0, 30); TXT.add(R, ws); TXT.contact(R, ws);
  TXT.frame(R, { from: [-11, 1.7, -13.5], look: [-1.4, 2.75, -4.6] });
  /* the radio path: from the spine antenna up and away to the right edge, drawn to illustrate */
  NX.callPath([0, 3.36, -0.3], [-34, 22, 80], { lift: 10, r: 0.055 });
  NX.grass([-120, -90, -36, 90], { count: 8000, seed: 6 });
  TXT.sky(R);
  TXT.deckRig(R, NX.rigSpec(W, 34, 4096), NX.rigOpts([0, 0, -2], { distance: 120, shadowFar: 300 }));
  TXT.stage(R, p);
  NX.flood([0, 0, -1], { dx: -10, dz: -12, h: 22, angle: 0.5 });   /* the apron flood, south west of the nose */
  TXT.weather(R, { grime: 0.22, height: 1.1 });
  const cx = NX.develop(await TXT.snapshot(R), gl);
  NX.post(cx, { a: 0.32 });
  TXDECK.finish(cx, { bloom: { threshold: 0.95, strength: 0.06, radius: 10 } });
  return true;
})();
</script>
</body>
</html>
