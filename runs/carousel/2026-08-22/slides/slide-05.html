<!doctype html><html><head><meta charset="utf-8">

<style>

      --legend:#E8EFE4;--trace:#9FD3B4;--amber:#D99A32;--key_dark:#060C0D;--red:#BF0A30}
html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:var(--face_sun);

canvas{position:absolute;left:0;top:0}
.kick{position:absolute;left:80px;top:88px;font:500 24px/1 "JetBrains Mono",monospace;

.cnt{position:absolute;right:80px;top:88px;font:500 24px/1 "JetBrains Mono",monospace;
  letter-spacing:.10em;color:#24322F;font-variant-numeric:tabular-nums}

</style></head><body>
<canvas id="c" width="2160" height="2700" style="width:1080px;height:1350px"></canvas>

<div class="hook">What a row actually publishes.</div>
<div class="rowlab" style="left:80px">ITEM</div><div class="cell" style="left:80px">33</div>
<div class="rowlab" style="left:170px">FILE STAMP</div><div class="cell" style="left:170px">8/3/2026</div>
<div class="rowlab" style="left:378px">PARTY</div><div class="cell" style="left:378px">Helen Bryant</div>
<div class="rowlab" style="left:610px">TYPE</div><div class="cell" style="left:610px">PC</div>
<div class="rowlab" style="left:700px">DESCRIPTION</div><div class="cell" style="left:700px">Objection to <br>rule change</div>
<div class="vlab" style="left:128px;top:996px;width:360px">Nothing here states who a filer is.</div>
<div class="vlab" style="left:596px;top:996px;width:350px">This record does not expand PC.</div>
<svg style="position:absolute;left:0;top:0;width:1080px;height:1350px" aria-hidden="true">
  <g stroke="#24322F" stroke-width="2.5" fill="none">
    <!-- from the PARTY cell, which is the field the sentence is actually about -->
    <polyline points="440,486 440,700 300,700 300,956"/>
    <!-- from the TYPE cell, which is the field the second void is about -->
    <polyline points="628,486 628,760 810,760 810,956"/>
  </g>
</svg>
<script>
window.__txLeaders = [
 {target:"the void naming that the row states nobody's identity", at:[300,956], to:[300,956]},
 {target:"the void naming what the type code is not expanded to", at:[810,956], to:[810,956]}
];
</script>

<div class="kick">PROJECT 58482</div>
<div class="cnt">05 / 09</div>
<div class="tx-site">texasaidocket.com</div>
<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6 L14.9 9.2 L23 9.6 L16.7 14.6 L18.9 22.4 L12 17.9 L5.1 22.4 L7.3 14.6 L1 9.6 L9.1 9.2 Z" fill="#24322F"/></svg>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txhachure.js"></script>
<script>
window.renderReady = new Promise(function(resolve){
  var c=document.getElementById('c'), x=c.getContext('2d'); x.scale(2,2);
  TX.reseed(20260822); var R=TX.rng(20260822 + 5);

  x.fillStyle='#C7D2C4'; x.fillRect(0,0,1080,1350);
  TX.hachureField(x, {x:0, y:0, w:1080, h:1350, seed:20260822,
    spacing:15, color:'#9FAEA3', width:1.1, lengthScale:0.62,
    height:function(u,v){ return 1.0 - 0.86*Math.pow(v,2.6) - 0.06*u; }});
  // THE VEIL USED TO ERASE THE FIELD. It ran 0.55 alpha over y0 to 1180, which is the whole
  // working area, so the hachure this frame's technique names survived only below the voids
  // where nothing needed it. It is a GRADIENT now, heaviest behind the type at the top and
  // clearing by the middle band, so the field is present exactly where the frame was empty.
  var veil=x.createLinearGradient(0,0,0,1180);
  veil.addColorStop(0,'rgba(199,210,196,0.80)'); veil.addColorStop(0.30,'rgba(199,210,196,0.62)');
  veil.addColorStop(0.52,'rgba(199,210,196,0.22)'); veil.addColorStop(1,'rgba(199,210,196,0.10)');
  x.fillStyle=veil; x.fillRect(0,0,1080,1180);
  x.fillStyle='#24322F'; x.fillRect(70,340,940,2); x.fillRect(70,486,940,2);
  // THE VOIDS ARE RECESSES, NOT TILES. A hole cannot cast a shadow, and a drop shadow here
  // would say these two absences are objects sitting on the record, which inverts the frame.
  function recess(vx,vy,vw,vh){
    x.fillStyle='#101A1B'; x.fillRect(vx,vy,vw,vh);
    x.fillStyle='#060C0D'; x.fillRect(vx,vy,vw,3); x.fillRect(vx,vy,3,vh);     // cut edge
    x.fillStyle='rgba(199,210,196,0.72)';
    x.fillRect(vx,vy+vh-3,vw,3); x.fillRect(vx+vw-3,vy,3,vh);                  // lit far wall
  }
  recess(96,956,424,168);
  recess(578,956,404,168);

  resolve();
});
</script></body></html>
