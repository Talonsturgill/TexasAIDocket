<!doctype html>
<!-- CAROUSEL 29, frame 5 of 9. Archetype DIAGRAM.
     THE CHAIN. Three bodies move one figure between them. The water board needs a number. It
     can't reach the people holding it, because they are in an interconnection queue the grid
     operator runs. So the grid operator asks the board's question ON THE BOARD'S BEHALF and
     forwards the answer back.

     THREE ELEVATIONS ON ONE GROUND LINE AT ONE DECLARED SCALE, running off both edges, because
     three bodies do not fit in one picture and pretending they do would make this a logo row.
     Each has a lit left face, a dark right return and its own cast on the ground line, because
     a shape with one fill is not a subject.

     THE ROUTE RUNS ABOVE THE ROOFLINE and never crosses a building, and every leader stops short
     of its glyph band. `qa.py` reads a stroke through a line as a strikethrough and it is right.

     THIS IS NOT A FRAME ABOUT FORM MECHANICS. September 14th's deck already ran the form. No
     portal, no notary stamp and no filing is drawn here. What is drawn is who asks whom.
     Planned frame median L* 38. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#18222B; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:130px; width:720px; font-size:88px;
          font-family:"Fraunces", serif; font-weight:700; line-height:1.00;
          letter-spacing:-0.022em; color:#E6DFCC; font-variation-settings:"opsz" 144; z-index:10; }
  /* THESE THREE LABELS ARE THE DIAGRAM'S WHOLE LEGEND AND THEY WERE UNDER THE MOBILE FLOOR.
   * `qa.py` warned all three at 20px against a 24px floor, on the one frame whose argument is
   * carried by its labels rather than by its picture. Raised to 24 and the columns widened to
   * the gaps the elevations already leave, so each still breaks inside its own column. */
  .lb { position:absolute; font-family:"JetBrains Mono", monospace; font-size:24px;
        letter-spacing:0.02em; line-height:1.30; color:#C6C6B8; z-index:14; }
  /* MOVED DOWN 122px IN ROUND 2 so the three labels sit BELOW the ground apron rather than on
   * it. The apron is what fills the 55 percent of this frame a judge measured as empty, and
   * setting mono type straight onto a raking hatch would have answered one note by creating
   * another. */
  .l1 { left:80px;  top:1086px; width:330px; }
  .l2 { left:426px; top:1086px; width:300px; }
  .l3 { left:736px; top:1086px; width:264px; }
  .dek { position:absolute; left:80px; top:394px; width:600px; font-size:25px;
         line-height:1.40; color:#C6C6B8; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#9C9C90;
             white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Three bodies, one answer.</h1>
<p class="dek">The Texas Water Development Board's Executive Administrator authorized ERCOT to ask on the board's behalf.</p>
<p class="lb l1">THE WATER BOARD<br>authorizes the asking</p>
<p class="lb l2">THE GRID OPERATOR<br>asks on its behalf</p>
<p class="lb l3">THE DEVELOPER<br>answers, notarized</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-19-firstlight.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(async function (resolve, reject) {
  try {
    await document.fonts.ready;
    TXLAYOUT.mount(document.body, {
      kicker: "Who asks whom", counter: "05 / 09",
      src: "c13 c16   TEXAS AI DOCKET", ink: "#9C9C90"
    });
    TX.fitText(document.getElementById("hook"), { min: 66, max: 88, maxLines: 2 });

    var cv = document.getElementById("art"), cx = cv.getContext("2d");
    cx.scale(2, 2);
    var M = TXFL, W = M.W, H = M.H;
    TX.reseed(20260905);

    var boxes = TXDECK.lineBoxes(".hook, .dek, .lb, .kick, .count, .src, .tx-site", 18);

    /* ONE DECLARED SCALE FOR THE WHOLE FRAME, 0.058 METRES PER PIXEL, and every height below is
     * stated in metres and converted through m(). THIS COMMENT SAID 0.19 UNTIL ROUND 2 and the
     * code has held 0.058 since the frame was written. A judge read the two against each other
     * and was right to: it is the same defect as frame 8's HORIZON, which this run repaired in
     * round 1 while leaving this one standing, and it was the only place the diagram's scale was
     * declared at all once the scale bar came out. A comment that states a number the file does
     * not hold is worse than no comment, because the next reader checks the comment. */
    var MPP = 0.058, GROUND = 906;
    function m(v) { return v / MPP; }

    M.print(cx, {
      seed: 29,
      draw: function (a) {
        /* NO HORIZON AND NO PERSPECTIVE. This frame is orthographic, which is the second of the
         * deck's two declared camera changes and is what a DIAGRAM is. */
        a.fillStyle = M.G.void;
        a.fillRect(0, 0, W, H);

        /* a flat lit band behind the elevations so they stand on something rather than float */
        var bg = a.createLinearGradient(0, GROUND - m(15), 0, GROUND);
        bg.addColorStop(0.00, "rgba(255,255,255,0.04)");
        bg.addColorStop(1.00, "rgba(255,255,255,0.20)");
        a.fillStyle = bg;
        a.fillRect(0, GROUND - m(26), W, m(26));

        /* THE APRON IS DRAWN HERE, BEFORE THE ELEVATIONS, AND ROUND 4 MOVED IT. Round 2 rebuilt
         * the three casts because a 7 px sliver was invisible, and round 3 added this apron after
         * them, so the hatch went straight over the wedges and a repair that was made for
         * visibility became invisible again for a new reason. A judge caught it by reading the
         * draw order against the render. Ground is drawn before what stands on it, which is an
         * instinct in this repo's own ledger, and a shadow belongs to the object rather than to
         * the surface it falls on. */
        /* THE GROUND APRON BELOW IT, AND IT IS WHY THE BOTTOM OF THIS FRAME IS NO LONGER EMPTY.
         * A judge measured 55 percent of this frame as empty dark below the labels, which is the
         * dead lower zone this project refuses everywhere else. The cure a diagram is allowed is
         * the elevation's OWN convention: a raking hatch under the ground line, thinning with
         * distance from it, which says "this is earth" and is not borrowed furniture from
         * another frame's register. It stops short of the label band and never runs edge to edge
         * at one density, so it reads as a surface rather than as a fill. */
        (function () {
          var pitch = 17, top = GROUND + 4;
          a.lineCap = "butt";
          for (var hx = -260; hx < W + 40; hx += pitch) {
            var depth = 118 + 44 * Math.sin(hx * 0.0032);
            a.strokeStyle = "rgba(230,223,204,0.16)";
            a.lineWidth = 2.0;
            a.beginPath(); a.moveTo(hx, top); a.lineTo(hx + depth * 0.72, top + depth); a.stroke();
            a.strokeStyle = "rgba(0,0,0,0.34)";
            a.lineWidth = 1.2;
            a.beginPath(); a.moveTo(hx + 4, top); a.lineTo(hx + 4 + depth * 0.72, top + depth); a.stroke();
          }
          var fade = a.createLinearGradient(0, GROUND, 0, GROUND + 170);
          fade.addColorStop(0.00, "rgba(24,34,43,0.00)");
          fade.addColorStop(1.00, "rgba(24,34,43,0.94)");
          a.fillStyle = fade; a.fillRect(0, GROUND, W, 170);
        })();

        /* THE THREE ELEVATIONS. Each is a real building at the declared scale with a lit LEFT
         * face, a dark right return and a cast on the ground line running right. */
        var B = [
          { x: 86,  w: 11.0, h: 17.0, kind: "civic" },
          { x: 432, w: 12.0, h: 10.0, kind: "control" },
          { x: 742, w: 17.0, h: 8.0,  kind: "hall" }
        ];
        for (var i = 0; i < B.length; i++) {
          var b = B[i], bw = m(b.w), bh = m(b.h), bx = b.x, by = GROUND - bh;
          /* the cast first, so the building stands on top of its own shadow. It runs RIGHT,
           * which is the deck's one light, and it is FORESHORTENED to 0.55 of the height
           * rather than laid out at the 4x the elevation's light angle implies. This comment
           * used to claim the 4x and a judge checked it against the code. An orthographic
           * elevation has no ground plane to lay a 152 px shadow onto, so 4x would leave the
           * page or turn the ground line into a perspective it does not have. The convention
           * is the drawing's, the direction is the deck's, and the comment now says both. */
          /* ROUND 2 DREW THIS INSTEAD OF ANNOTATING IT. Round 1 was told the casts were 7 px
           * slivers and answered by rewriting the comment above them, which is the worst
           * possible response to a drawing note and the judge said so. A cast 7 px tall on a
           * 1350 px frame is invisible at full size and absent at feed size, so the frame's own
           * acceptance line, that each elevation has a cast on the ground line, was false.
           * It is a wedge now: it LEAVES the base, runs right at 0.5 of the building's height,
           * and thins as it goes, which is what a low key does to a flat-roofed box on level
           * ground. 0.5 rather than the 4x the 14 degree key implies, because at 4x the first
           * building's shadow would run under the second and the diagram would read as one
           * mass. The direction is the deck's law and the length is the drawing's convention. */
          var cl = bh * 0.50;
          var cg = a.createLinearGradient(bx + bw, GROUND, bx + bw + cl, GROUND);
          cg.addColorStop(0.00, "rgba(0,0,0,0.60)");
          cg.addColorStop(1.00, "rgba(0,0,0,0.00)");
          a.fillStyle = cg;
          a.beginPath();
          a.moveTo(bx, GROUND - 2);
          a.lineTo(bx + bw + cl, GROUND - 2);
          a.lineTo(bx + bw + cl, GROUND + 14);
          a.lineTo(bx, GROUND + 26);
          a.closePath(); a.fill();
          /* the lit left face */
          a.fillStyle = M.G.bright;
          a.fillRect(bx, by, bw * 0.62, bh);
          /* the dark right return */
          a.fillStyle = M.G.dark;
          a.fillRect(bx + bw * 0.62, by, bw * 0.38, bh);
          /* the roof line, one value up, taking the key */
          a.fillStyle = M.G.glare;
          a.fillRect(bx - 3, by - 5, bw + 6, 6);
          /* what each building is, in its own geometry rather than in a label */
          if (b.kind === "civic") {
            a.fillStyle = M.G.void;
            for (var c = 0; c < 4; c++) a.fillRect(bx + 12 + c * (bw * 0.62 - 20) / 4, by + bh * 0.38, 9, bh * 0.62);
            a.fillStyle = M.G.glare;
            a.beginPath(); a.arc(bx + bw / 2, by - 6, bw * 0.24, Math.PI, 0); a.fill();
          } else if (b.kind === "control") {
            a.fillStyle = M.G.void;
            a.fillRect(bx + bw * 0.10, by + bh * 0.30, bw * 0.40, bh * 0.22);
            a.fillStyle = M.G.metal;
            a.fillRect(bx + bw * 0.74, by - m(5.0), 5, m(5.0));
          } else {
            a.fillStyle = "rgba(0,0,0,0.34)";
            for (var v = 0; v < 9; v++) a.fillRect(bx + 8 + v * (bw - 16) / 9, by + bh * 0.26, 6, bh * 0.58);
          }
        }

        /* THE GROUND LINE, one rule the three stand on. */
        a.fillStyle = M.G.metal;
        a.fillRect(0, GROUND, W, 3);


        /* THE SCALE BAR IS GONE, AND ITS REMOVAL IS THE ROUND 1 REPAIR. It sat at GROUND + 118,
         * which is under the first label's own column, and a judge's word for what it rendered
         * as was "an unlabelled smudge under a label". Both halves of that are fair. Moving it
         * would have fixed the collision and left the other half, because a scale bar with no
         * number on it does not make a scale CHECKABLE, it only looks as though it does. This
         * project does not get to publish the appearance of rigour, and the number that would
         * fix it is a computed metre value with no claim behind it. The dossier's bands
         * paragraph is amended with it rather than left describing a thing the frame no longer
         * carries. */
      },
      over: function (c) {
        M.reserve(c, { top: 300, topSolid: 190, bottom: 200, bottomSolid: 120 });

        /* KNOCK THE SCREEN OUT FROM UNDER THE TYPE, AND DO IT LAST. The print lays its
         * halftone and its contour across the whole frame and can't consult a mask as it goes,
         * so the reserve is punched afterwards, which is the mechanism txdeck.js documents for
         * exactly this. It runs AFTER the furniture band because the band re-composites, and a
         * punch that anything paints over afterwards is not a punch.
         * It DIMS toward the type with a wide feather rather than removing the screen from
         * around it, because a hole punched at full strength is a plate with the sign flipped,
         * and that is a defect this project has already paid to find out about once. */
        TXDECK.punch(c, boxes, { feather: 66, strength: 0.78 });


        /* THE ROUTE, THE FRAME'S ONE COMAL. It runs ABOVE the rooflines so it crosses no
         * building, and it turns once, which is the eye's landing point. It is the water answer
         * moving between the three, which is water somebody is holding a number for.
         * ITS MIDDLE LEG MOVED UP 64 px IN ROUND 2. It ran at y 700 and the control building's
         * radio mast stands from y 648 to y 734, so the one line in the frame that must cross no
         * building crossed one. The frame's own header states that rule and the drawing broke
         * it, which is what a judge reading the pixels against the prose is for. */
        c.save();
        c.strokeStyle = "rgba(42,122,158,0.92)";
        c.lineWidth = 5; c.lineCap = "round"; c.lineJoin = "round";
        c.beginPath();
        c.moveTo(180, 612);
        c.lineTo(180, 548);
        c.lineTo(536, 548);
        c.lineTo(536, 636);
        c.lineTo(878, 636);
        c.lineTo(878, 762);
        c.stroke();
        /* two terminators, so the route has a direction rather than being a bracket */
        c.fillStyle = "rgba(42,122,158,0.92)";
        c.beginPath(); c.arc(180, 612, 8, 0, Math.PI * 2); c.fill();
        c.beginPath();
        c.moveTo(878, 776); c.lineTo(868, 756); c.lineTo(888, 756);
        c.closePath(); c.fill();
        c.restore();

        /* THE THREE LEADERS, which the dossier has promised since planning and the frame never
         * drew. Each runs from its own building's base down through the apron and STOPS SHORT
         * of its label's glyph band, because `qa.py` reads a stroke through a line as a
         * strikethrough and it is right to. They are drawn in `over` so the screen never runs
         * across them, and they are what makes the apron a part of the diagram rather than a
         * texture somebody put under the type. */
        c.save();
        c.strokeStyle = "rgba(198,198,184,0.52)";
        c.lineWidth = 2;
        var leads = [90, 436, 746];
        for (var li = 0; li < leads.length; li++) {
          c.beginPath();
          c.moveTo(leads[li], 918);
          c.lineTo(leads[li], 1066);
          c.stroke();
          c.fillStyle = "rgba(198,198,184,0.52)";
          c.beginPath(); c.arc(leads[li], 918, 4, 0, Math.PI * 2); c.fill();
        }
        c.restore();
      }
    });

    TXDECK.finish(cx, { w: W, h: H });
    resolve();
  } catch (e) { reject(e); }
});
</script>
</body>
</html>
