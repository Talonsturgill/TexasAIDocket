<!doctype html>
<!-- CAROUSEL 29, frame 6 of 9. Archetype SPLIT_HORIZON.
     THE VESSEL AND THE LOAD, IN ONE FRAME AT TRUE RELATIVE SIZE. A 38 m water tower and a 130 m
     hall on one horizon at a long lens, so a reader can read one against the other. That is the
     only frame in the deck that answers what the argument is actually about.

     ONE STRAIGHT HORIZONTAL CUT, image above it, because the two objects are the subject and the
     flat ground below is where the sentence about the water plan can sit without competing.

     THE SENTENCE IS THE GOVERNOR'S OFFICE DESCRIBING THE BOARD, not the board speaking. No
     statement from the board itself was fetched this run, and the fact checker killed the
     attribution that put it in the board's mouth. The dek says "the release states" for that
     reason and it is not a hedge.

     THE STOCK TANK BELOW THE CUT carries the frame's comal. It is the third of the deck's four
     accent frames and the accent is always water somebody holds a number for.
     Planned frame median L* 34. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#18222B; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:928px; width:640px; font-size:80px;
          font-family:"Fraunces", serif; font-weight:700; line-height:1.00;
          letter-spacing:-0.022em; color:#E6DFCC; font-variation-settings:"opsz" 144; z-index:10; }
  /* 23px was one pixel under the mobile floor, which is a silly way to lose a warn. Lifted to
   * 24 and the block raised 12px so its third line still clears the furniture band at 1234. */
  .dek  { position:absolute; left:80px; top:1112px; width:706px; font-size:24px;
          line-height:1.40; color:#C6C6B8; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#9C9C90;
             white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">The plan needs a number.</h1>
<p class="dek">The release states the board writes the state water plan and can't do that while it is denied detail on existing and anticipated water consumption.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-19-firstlight.js"></script>
<script src="@@ASSETS@@/js/txscene.js"></script>
<script src="@@ASSETS@@/js/txfig.js"></script>
<script src="@@ASSETS@@/js/txobjects.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(async function (resolve, reject) {
  try {
    await document.fonts.ready;
    TXLAYOUT.mount(document.body, {
      kicker: "What the figure is for", counter: "06 / 09",
      src: "c5   TEXAS AI DOCKET", ink: "#9C9C90"
    });
    TX.fitText(document.getElementById("hook"), { min: 60, max: 80, maxLines: 2 });

    var cv = document.getElementById("art"), cx = cv.getContext("2d");
    cx.scale(2, 2);
    var M = TXFL, W = M.W, H = M.H;
    TX.reseed(20260906);

    var boxes = TXDECK.lineBoxes(".hook, .dek, .kick, .count, .src, .tx-site", 18);

    /* THE CUT. One straight horizontal, image above, flat ground below. */
    var CUT = 766;
    /* A LONG LENS, so a 38 m tower at Z 420 and a 130 m hall at Z 520 hold their true relative
     * size on one horizon. A normal lens at this distance would make the nearer one a monster. */
    var HORIZON = 604, FLONG = 2400;

    M.print(cx, {
      seed: 37,
      draw: function (a) {
        var S = M.scene(a, { horizon: HORIZON, f: FLONG, eye: 1.65 });

        M.sky(a, S, 0.66);

        /* the far ridge, low, because a long lens flattens it */
        a.fillStyle = M.G.deep;
        a.beginPath(); a.moveTo(0, HORIZON);
        var RR = TX.rng(606);
        for (var rx = 0; rx <= W; rx += 9) {
          a.lineTo(rx, HORIZON - (5 + TX.fbm2(rx * 0.0018, 9.1, 3) * 11));
        }
        a.lineTo(W, HORIZON); a.closePath(); a.fill();

        /* the ground ABOVE the cut only, because below the cut is flat by construction */
        S.ground({ near: 40, far: 1400, fill: M.G.shade });
        var gg = a.createLinearGradient(0, HORIZON, 0, CUT);
        gg.addColorStop(0.00, "rgba(255,255,255,0.09)");
        gg.addColorStop(1.00, "rgba(0,0,0,0.20)");
        a.fillStyle = gg; a.fillRect(0, HORIZON, W, CUT - HORIZON);

        /* THE TOWER at Z 420. At f 2400 a 38 m object is about 217 px, which is true against
         * the hall beside it rather than flattering. */
        (function () {
          var tower = TXOBJ.sprite("water_tower");
          S.shadow(tower, { X: -32, Z: 186, ink: "#000", alpha: 0.34 });
          S.sprite(tower, { X: -32, Z: 186,
                            inks: { ink: M.G.glare, paper: M.G.dark, accent: M.G.glare },
                            fade: false });
        })();

        /* THE HALL, BUILT RATHER THAN STAMPED, AND ROUND 1 IS WHY. This was `TXOBJ.sprite
         * ("data_center")` over a box, and the catalogue's own parapet motif renders at this
         * size as eight tall square merlons on a single cream fill. Three judges read it as a
         * CRENELLATED BATTLEMENT, on three separate frames, which is the catalogue being asked
         * for a 130 m building at a distance it was not drawn for. A sprite is a good object at
         * its own scale and a silhouette at any other, so this frame draws its own. */
        (function () {
          var ZH = 238, XL = -1, XR = 129;
          function hx(X) { return 540 + FLONG * X / ZH; }
          function hy(h) { return HORIZON + FLONG * (1.65 - h) / ZH; }
          var L = hx(XL), R = hx(XR);
          var TOP = hy(16.0), FASC = hy(14.2), BASE = hy(0);

          a.fillStyle = M.G.mid;  a.fillRect(L, FASC, R - L, BASE - FASC);
          var w6 = a.createLinearGradient(0, FASC, 0, BASE);
          w6.addColorStop(0.00, "rgba(255,255,255,0.26)");
          w6.addColorStop(1.00, "rgba(0,0,0,0.22)");
          a.fillStyle = w6;       a.fillRect(L, FASC, R - L, BASE - FASC);
          a.fillStyle = M.G.bright; a.fillRect(L, TOP, R - L, FASC - TOP);
          a.fillStyle = M.G.dark;   a.fillRect(L, FASC - 2, R - L, 3);
          a.fillStyle = "rgba(0,0,0,0.42)"; a.fillRect(L, BASE - 4, R - L, 5);

          /* expansion joints every 26 m, which is all the detail a long lens resolves here */
          for (var X = XL + 26; X < XR; X += 26) {
            a.fillStyle = "rgba(0,0,0,0.26)";
            a.fillRect(hx(X), FASC, Math.max(1, hx(X + 0.6) - hx(X)), BASE - FASC);
          }
          /* roof plant, low and uneven, so the skyline is a profile and not a battlement */
          var pl = [[4, 12, 2.2], [26, 7, 3.1], [44, 15, 1.7], [70, 9, 2.6], [96, 13, 2.0]];
          for (var i = 0; i < pl.length; i++) {
            var p0 = hx(pl[i][0]), p1 = hx(pl[i][0] + pl[i][1]), pt = hy(16.0 + pl[i][2]);
            a.fillStyle = M.G.glare; a.fillRect(p0, pt, p1 - p0, TOP - pt);
            a.fillStyle = M.G.dark;  a.fillRect(p1 - 3, pt, 3, TOP - pt);
          }
          /* the hall's cast on the pad, running right under the deck's one key */
          var hs = a.createLinearGradient(0, BASE, 0, BASE + 22);
          hs.addColorStop(0.00, "rgba(0,0,0,0.46)");
          hs.addColorStop(1.00, "rgba(0,0,0,0.00)");
          a.fillStyle = hs; a.fillRect(L, BASE, R - L, 22);
        })();

        /* THE CUT ITSELF, and the flat lit caliche below it that carries the type.
         *
         * ROUND 2 REBUILT BOTH. The cut rendered as a white line, then a black band, then a
         * second white line, because a 3 px glare rule sat on a gradient that fell to 34 percent
         * black within a fifth of its run. A judge counted three edges where the plan declares
         * ONE straight cut. It is one lit rule with a thin dark shadow under it now, and the
         * ground below falls away gradually instead of slamming shut. */
        var below = a.createLinearGradient(0, CUT, 0, H);
        below.addColorStop(0.00, "rgba(255,255,255,0.15)");
        below.addColorStop(0.46, "rgba(255,255,255,0.02)");
        below.addColorStop(1.00, "rgba(0,0,0,0.72)");
        a.fillStyle = M.G.stone;
        a.fillRect(0, CUT, W, H - CUT);
        a.fillStyle = below;
        a.fillRect(0, CUT, W, H - CUT);
        a.fillStyle = M.G.glare;
        a.fillRect(0, CUT - 1, W, 3);
        a.fillStyle = "rgba(0,0,0,0.30)";
        a.fillRect(0, CUT + 2, W, 2);

        /* THE FLAT, DRAWN. A judge measured the lower panel as a large empty field with one tiny
         * puddle and the deck's longest body copy on it. Below the cut there is no camera, so
         * this is not a receding plane and cannot be answered with a depth grid. What it can
         * carry is what caliche is: gravel at one size, lit left and casting right, and the
         * blade marks a grader leaves, which are straight here because nothing is in
         * perspective. */
        (function () {
          var GR = TX.rng(6041);
          a.save();
          a.beginPath(); a.rect(0, CUT + 4, W, H - CUT - 4); a.clip();
          /* the grader's blade marks, and they stop at the type column for the same reason the
           * gravel does rather than running under it */
          /* THE GRADER'S BLADE MARKS, AND THEIR Y VALUES ARE CHOSEN AGAINST THE TYPE. An even
           * pitch put two of them at 952 and 1080, inside the headline's own glyph band, and
           * `qa.py` read a horizontal rule crossing a line of type as a strikethrough, which is
           * exactly what it is at feed width. They sit above and below the block now. */
          var marks = [[824, -40], [898, -40], [1162, 812], [1268, 812]];
          for (var b = 0; b < marks.length; b++) {
            var by2 = marks[b][0], x0 = marks[b][1];
            a.strokeStyle = "rgba(0,0,0,0.26)"; a.lineWidth = 9 + b * 3;
            a.beginPath(); a.moveTo(x0, by2); a.lineTo(W + 40, by2 + 14 - b * 9); a.stroke();
            a.strokeStyle = "rgba(230,223,204,0.10)"; a.lineWidth = 3;
            a.beginPath(); a.moveTo(x0, by2 - 6); a.lineTo(W + 40, by2 + 8 - b * 9); a.stroke();
          }
          /* THE GRAVEL STOPS SHORT OF THE TYPE COLUMN. Not because the type needs a plate, which
           * is the cure this project refuses, but because high frequency stone under a serif
           * headline is what makes a punch READ as a rectangle: the dimming has to fight
           * texture, and the edge of the fight is the edge of a box. The ground under the type
           * keeps its own value and loses only its speckle. */
          for (var g = 0; g < 340; g++) {
            var gy = CUT + 8 + GR() * (H - CUT - 16), gx = GR() * W;
            /* A SOFT EDGE RATHER THAN A HARD ONE. A straight cut-off at x 812 is itself a
             * vertical rule, so the stone thins toward the type column instead of stopping at
             * a line a reader could see. */
            if (gy > 890 && GR() > (gx - 620) / 300) { continue; }
            var gr = 1.6 + GR() * 4.4;
            a.fillStyle = "rgba(0,0,0,0.40)";
            a.beginPath(); a.ellipse(gx + gr * 0.55, gy + gr * 0.5, gr * 1.1, gr * 0.5, 0, 0, Math.PI * 2); a.fill();
            a.fillStyle = "rgba(230,223,204,0.22)";
            a.beginPath(); a.ellipse(gx, gy, gr, gr * 0.7, 0, 0, Math.PI * 2); a.fill();
          }
          a.restore();
        })();

        /* THE STOCK TANK, sitting on the flat below the cut at the left, the frame's one comal.
         * It is drawn flat rather than on the bench because below the cut there is no camera. */
        (function () {
          a.fillStyle = "rgba(0,0,0,0.42)";
          a.beginPath(); a.ellipse(846, 880, 132, 20, 0, 0, Math.PI * 2); a.fill();
          a.fillStyle = M.G.metal;
          a.beginPath(); a.ellipse(840, 870, 128, 18, 0, 0, Math.PI * 2); a.fill();
          a.fillStyle = M.G.dark;
          a.beginPath(); a.ellipse(840, 870, 114, 12, 0, 0, Math.PI * 2); a.fill();
        })();
      },
      over: function (c) {
        /* THE BOTTOM RESERVE SHRANK FROM 470 TO THE FURNITURE BAND. At 470 it flattened the
         * whole lower panel to make room for type the punch below already seats, which is the
         * "answer a dead band with a bigger quiet zone" this project refuses by name. */
        /* THE RESERVE HAS TO REACH THE HOOK, AND ROUND 2 LEARNED THAT THE HARD WAY. Shrinking
         * it to 320 left the headline sitting on unreserved caliche with only the punch holding
         * it, and `qa.py` came back with a rule through the glyph band and busy art under the
         * type. It reaches 480 again, which is where the hook starts, but its SOLID part is 170
         * rather than 250, so what it does is fall away over a long run instead of laying a slab
         * across the bottom third. A reserve is a gradient. The thing this frame was failing on
         * was a PLATE, and the two are not the same object. */
        M.reserve(c, { top: 0, topSolid: 0, bottom: 480, bottomSolid: 170 });

        /* KNOCK THE SCREEN OUT FROM UNDER THE TYPE, AND DO IT LAST. The print lays its
         * halftone and its contour across the whole frame and can't consult a mask as it goes,
         * so the reserve is punched afterwards, which is the mechanism txdeck.js documents for
         * exactly this. It runs AFTER the furniture band because the band re-composites, and a
         * punch that anything paints over afterwards is not a punch.
         * It DIMS toward the type with a wide feather rather than removing the screen from
         * around it, because a hole punched at full strength is a plate with the sign flipped,
         * and that is a defect this project has already paid to find out about once. */
        /* THE DECK'S PUNCH, AND THE FRAME'S OWN GROUND DOES THE REST. A round 2 attempt at
         * 104 and 0.58 traded one defect for two: `qa.py` came back with the worst-point
         * contrast at 3.9 against a 4.5 floor and read the punch's own feather boundary as a
         * rule through the headline. The plate this frame showed was never the punch's strength.
         * It was high frequency gravel arriving under a serif headline on the deck's lightest
         * field, so the fix is the reserve and the texture, and the punch goes back to the
         * setting the other eight frames use. */
        TXDECK.punch(c, boxes, { feather: 66, strength: 0.78 });


        /* THE ACCENT. The stock tank's water below the cut. */
        /* DRAWN WITH THE CHASSIS'S `N.tank` FROM ROUND 2. It was a bare comal ellipse, and two
         * judges independently reported the same thing: a flat blue lozenge with no gauge, no
         * vessel and no contact. The deck's accent law turns on the word GAUGED and the drawing
         * never carried it, so the recurring object registered as a colour rather than as the
         * one thing on the frame somebody holds a number for. */
        M.tank(c, { x: 840, y: 869, rx: 108, ry: 10, ink: "rgba(42,122,158,0.82)" });
      }
    });

    TXDECK.finish(cx, { w: W, h: H });
    resolve();
  } catch (e) { reject(e); }
});
</script>
</body>
</html>
