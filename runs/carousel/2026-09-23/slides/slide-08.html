        lg.addColorStop(0, "rgba(255,255,255,0.07)"); lg.addColorStop(1, "rgba(255,255,255,0)");
        a.fillStyle = lg; a.fillRect(0, 300, W, 700);
        a.restore();

        /* THE TWO MARKS. Odessa west, the Bexar County seat south east. */
        function mark(p) {
          a.fillStyle = G.glare;
          a.beginPath(); a.arc(p[0], p[1], 7, 0, Math.PI * 2); a.fill();
          a.strokeStyle = G.metal; a.lineWidth = 1.6;
          a.beginPath(); a.arc(p[0], p[1], 15, 0, Math.PI * 2); a.stroke();
          return [p[0], p[1]];
        }
        var od = mark(GEO.marks["Odessa"]);
        /* THE BEXAR COUNTY MARK IS GONE, FOR TWO REASONS THAT POINT THE SAME WAY.
         * It sat under a cite line reading c19 c20 c21, and the claim that supports it is c12,
         * which is frame 9's. And a map carrying two marks on a frame whose subject is a THIRD
         * place invites a reader to take one of the two dots for it: the deck's central example
         * is a West Texas data center and Odessa is a West Texas city. One mark, for the one
         * project this frame's three claims are about. */
        var sa = null;
        a.restore();
        od = [od[0], od[1] - 70];
        window.__marks = { odessa: od };

        /* THE PLACE LABELS ARE DOM, NEVER CANVAS. Canvas text rasterises into the PDF and
         * loses the platform's semantic ranker and its accessibility mode, so the two marks
         * hand their screen positions up and the DOM layer seats the labels over them. */
        window.__markPx = { odessa: od };

        /* THE BAR PAIR, at the Odessa mark, ONE SCALE, modeled with a lit top edge over a
         * shaded body so they read as drawn objects standing on the map. */
        var bx = 96, by1 = 940, by2 = 1014, bh = 30;
        var span = 840;
        /* THE EDGE SPREAD IS COMPENSATED, AND IT IS A PRINT EFFECT RATHER THAN AN ARITHMETIC ONE.
         *
         * Measured off the render: the long bar draws 840 px and MEASURES 842.5, and the short
         * one draws 147.35 and measures 150.5. The screen and the antialias add about 2.5 px to
         * whatever silhouette they are given, the same 2.5 px to both, which leaves the
         * MEASURED ratio at 0.1786 against a true 207 over 1180 of 0.1754. A reader measures the
         * silhouette, not the fillRect, so the short bar was over-reading by about nine
         * megawatts on the one comparison this frame exists to make.
         *
         * So the compensation is applied to the drawn length: both bars are solved so their
         * PRINTED extents land in the true ratio. */
        var EDGE = 2.5;
        var w1 = span, w2 = (span + EDGE) * (PHASE_MW / PLANT_MW) - EDGE;
        /* THE CONTACT MAY NOT LENGTHEN THE BAR, and the first cut's did.
         *
         * It ran from x + 6 at the bar's own width, so its right edge sat 6 px BEYOND the bar's.
         * A reviewer measuring the short bar off the render read 164 design px where the scaled
         * length is 147, called it nine percent long, and was reading the drawn silhouette
         * correctly. The ratio between these two lengths is the only thing this frame asserts,
         * so six pixels of shadow past the end of a 147 px bar is six pixels of lie.
         *
         * The cast still runs down and to the right from the deck's one light. It is now inset
         * on the left and stops at the bar's own right edge, so the silhouette a reader measures
         * is the bar. */
        function bar(x, y, w) {
          a.save(); a.globalAlpha = 0.4; a.fillStyle = G.voidd;
          a.fillRect(x + 6, y + bh, w - 6, 6); a.restore();
          a.fillStyle = G.mid;    a.fillRect(x, y, w, bh);
          a.fillStyle = G.glare;  a.fillRect(x, y, w, 4);           /* LIT top edge */
          a.fillStyle = G.bright; a.fillRect(x, y + 4, w, 7);
          a.fillStyle = G.dark;   a.fillRect(x, y + bh - 9, w, 5);
          a.fillStyle = G.voidd;  a.fillRect(x, y + bh - 4, w, 4);  /* shaded underside */
        }
        bar(bx, by1, w1);
        bar(bx, by2, w2);
        /* leaders from each mark out to where its label sits, ending short of the glyphs */
        a.strokeStyle = "rgba(255,255,255,0.30)"; a.lineWidth = 1.4;
        a.beginPath(); a.moveTo(od[0] - 17, od[1]); a.lineTo(188, od[1]); a.stroke();
        
        /* THE DROP LEADER LANDS ON THE PLANT BAR. It used to stop 34 px above it, in open
         * ground, which is a line that points at nothing. A leader terminates on its target or
         * it does not exist. */
        /* IT LANDS ON THE ODESSA PROJECT'S OWN BAR. Dropped onto the PLANT bar it read, at a
         * glance, as Odessa equals 1,180 MW, which is the plant's figure and not the project's.
         * The leader runs to the short bar's right cap instead. */
        /* AND THEN IT WAS DELETED. Landing on the plant's bar it said Odessa equals 1,180 MW.
         * Rerouted to the project's own bar, its horizontal leg ran straight through the
         * glyph band of the 207 MW label, which is a strikethrough at feed width. The map marks
         * the place and the two labels name the two figures, so nothing here needs a leader at
         * all, and a leader that has to dodge the label it points at is not a leader. */
        window.__txLeaders = [
          { target: "the Odessa mark", at: [od[0] - 17, od[1]], to: [od[0] - 17, od[1]] },
          

        ];

      },
      over: function (c) {
        /* the print is faded to the deck's ground under the fixed furniture bands, and the
         * light DIMS toward the display type. Both run here, on the finished print, never on
         * the twin, because the edge pass would otherwise contour the reserve itself. */
        M.reserve(c, { top: 150, topSolid: 92, bottom: 150, bottomSolid: 94 });
        M.quiet(c, boxes, 0.14);
      }
    });

    /* seat the two map labels over the marks the projection actually produced */
    (function () {
      var m = window.__markPx;
      function put(id, text, px, dx, dy) {
        var el = document.createElement("div");
        el.className = "pl" + id; el.id = "pl" + id; el.textContent = text;
        el.style.left = (px[0] + dx) + "px"; el.style.top = (px[1] + dy) + "px";
        el.style.position = "absolute"; el.style.zIndex = 11;
        document.body.appendChild(el);
      }
      /* THE LABELS SIT OFF THE STATE, IN THE GROUND BESIDE IT. Set over the county mesh
       * they were struck by it seven ways, and the cure for a label on a drawn surface is to
       * move the label rather than to plate it. */
      put("1", "ODESSA", [96, m.odessa[1]], 0, -12);

    })();

    TXDECK.finish(cx);
    resolve();
  } catch (e) { document.title = "ERR " + e.message; reject(e); }
  });
});
