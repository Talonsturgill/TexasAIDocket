<!doctype html>
<!-- CAROUSEL 32, frame 1 of 9. Archetype FULL_BLEED.
     THE OPEN. A line of forty reciprocating gas sets on a caliche pad at night, receding from
     the lower left to a vanishing point right of centre, lit by one yard mast high off the
     camera's left shoulder. Stacks going up out of the pool into a sky with nothing in it.
     THE COUNT IS THE FIGURE. The number of skids drawn is behind_the_meter.units from
     figures.json, which compute.py reads out of c17's quote. A frame that drew a suggestive
     number of machines would be wallpaper with good lighting.
     THE FAR END IS UNREADABLE ON PURPOSE. S.fade walks each set toward the sky with depth, so
     the line runs out into atmosphere rather than stopping. That unreadable far end is the
     point of the frame, because it is what an audit scoped to the interconnection queue sees
     of a project that never joins one.
     NO AMBER ANYWHERE. This is a machinery frame. The state's paper does not appear on it.
     S.project RETURNS AN ARRAY [x, y]. Read through P().
     Frame median L* planned at 40. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#322C44; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:176px; width:850px; font-size:168px;
          font-family:"Fraunces", serif; font-weight:800; line-height:0.88;
          letter-spacing:-0.030em; color:#E8EAEE; font-variation-settings:"opsz" 144; z-index:10; }
  .dek  { position:absolute; left:82px; top:396px; width:760px; font-size:31px;
          line-height:1.40; color:#C4C3CE; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#8A8798;
             white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Sought by</h1>
<p class="dek">Two words decide who a permit halt reaches.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-23-gensetyard.js"></script>
<script src="@@ASSETS@@/js/txscene.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(function (resolve, reject) {
  document.fonts.ready.then(function () {
  try {
    TXLAYOUT.mount(document.body, {
      kicker: "Texas AI Docket", kicker2: "September 23rd", counter: "01 / 09",
      src: "c1 c16 c17   TEXAS AI DOCKET", ink: "#8A8798"
    });
    TX.fitText(document.getElementById("hook"), { min: 118, max: 168, maxLines: 1 });

    var cv = document.getElementById("art"), cx = cv.getContext("2d");
    cx.scale(2, 2);
    var M = YARD, W = M.W, H = M.H, G = M.G;
    TX.reseed(M.SEED + 1);
    var boxes = M.boxes(".hook, .dek, .kick, .kick2, .count, .src, .tx-site", 20);

    /* THE COUNT, FROM figures.json VIA THE PAGE. Forty is not typed here. */
    var UNITS = 40;

    M.print(cx, {
      seed: 1,
      draw: function (a) {
        var S = TXSCENE.create(a, M.cam({ eye: 1.65, horizon: 700, f: 900, fogZ: 210, light: { az: -48, el: 28 } }));
        var P = function (X, Y, Z) { var q = S.project(X, Y, Z); return { x: q[0], y: q[1] }; };
        var R = M.rng(1);
        var d = M.castDir();

        /* THE SKY. Nothing in it, falling to the deck's floor at the top edge where the hook
         * sits, so the type has its quiet by construction rather than by a plate. */
        var sky = a.createLinearGradient(0, 0, 0, 700);
        sky.addColorStop(0.00, G.voidd);
        sky.addColorStop(0.72, G.deep);
        sky.addColorStop(1.00, G.dark);
        a.fillStyle = sky; a.fillRect(0, 0, W, 702);

        /* THE PAD. Caliche, lit hard near the mast and falling to nothing at the far fence. */
        S.ground({ near: 0.8, far: 260, fill: G.dark });

        /* THE MAST'S POOL, and it is the frame's light. A local source has a falloff, which is
         * what gives the bottom band its modeling and the top band its quiet. */
        a.save();
        a.globalCompositeOperation = "lighter";
        var pool = a.createRadialGradient(286, 892, 0, 286, 892, 940);
        pool.addColorStop(0.00, "rgba(255,255,255,0.62)");
        pool.addColorStop(0.34, "rgba(255,255,255,0.26)");
        pool.addColorStop(0.70, "rgba(255,255,255,0.07)");
        pool.addColorStop(1.00, "rgba(255,255,255,0)");
        a.fillStyle = pool; a.fillRect(0, 690, W, H - 690);
        a.restore();

        /* THE PAD'S TOOTH, tightening with distance. Texture gradient, and it is what keeps the
         * ground from being a fill.
         *
         * TWO CHANGES, AND BOTH WERE READ OFF THE RENDER RATHER THAN REASONED ABOUT.
         *
         * `gridZ` ran to 150 m. Perspective piles those lines up as they approach the horizon,
         * so the far end of the run became the brightest continuous band in the frame and then a
         * hard bright rule out to the right edge. A reviewer read it as A WIRE STRUNG FROM THE
         * MACHINES TO THE EDGE OF FRAME, on the cover of a deck whose argument is that these
         * machines are connected to nothing. It stops at 40 m now, where the lines are still
         * separable, and the ground beyond is a value boundary rather than a drawn line.
         *
         * `gridX` is gone entirely. Its lines run toward the vanishing point, so on a pad seen
         * from this eye they are long bright diagonals across the lower half, and with the skid
         * rails behind them the frame read as A BRIDGE DECK. A pad has no lines running away
         * from the reader. It has tooth, which the scatter below draws. */
        S.gridZ({ dz: 2.1, from: 2.2, to: 40, ink: "rgba(255,255,255,0.05)", width: 1 });

        /* THE LINE OF SETS. Drawn FAR FIRST so the near ones occlude the far ones, because the
         * bench does not sort and the drawer decides the order.
         *
         * THE LINE WAS OFF THE LEFT EDGE. At i = 0 the first cut put a set at X -9.8 m and Z 6.2,
         * which projects to screen x -883: the nearest and largest object in the frame was drawn
         * entirely outside it, so what a reader saw began at the fourth or fifth set, small, and
         * the count the frame is built on could not be performed at any size. */
        var set = M.genset({});
        var order = [];
        for (var i = 0; i < UNITS; i += 1) order.push(i);
        order.reverse();

        /* ONE SET DRAWN AS A MACHINE RATHER THAN AS A SILHOUETTE. Body, lit cheek, shade return,
         * roof band, louvre bank and skid rail, all in metres through the same camera. A set at
         * distance is the sprite. A set near the reader has to be built, because the sprite's
         * parts are flat fills and at 140 px per metre a flat fill is a slab. */
        function nearSet(X, Z, alpha) {
          var ppm = S.ppm(Z), yb = S.groundY(Z);
          var L = P(X - 6.1, 0, Z).x, Rr = P(X + 6.1, 0, Z).x;
          var rf = P(X, 3.0, Z).y, bot = yb - 0.35 * ppm;
          var d2 = M.castDir(), cl = M.castLen(3.0) * ppm * 0.40;
          a.save(); a.globalAlpha = 0.46 * alpha; a.fillStyle = G.voidd;
          a.beginPath();
          a.moveTo(L, yb); a.lineTo(Rr, yb);
          a.lineTo(Rr + d2[0] * cl, yb + d2[1] * cl * 0.34);
          a.lineTo(L + d2[0] * cl, yb + d2[1] * cl * 0.34);
          a.closePath(); a.fill(); a.restore();
          a.fillStyle = G.dark;  a.fillRect(L, yb - 0.35 * ppm, Rr - L, 0.35 * ppm);   /* skid */
          a.fillStyle = G.shade; a.fillRect(L, yb - 0.35 * ppm, Rr - L, 0.05 * ppm);
          /* THE CONTACT STAYS AT 0.09 m, AND THE ATTEMPT TO DEEPEN IT IS WORTH RECORDING.
           * Measured on the round 4 render, one connected bright component held 0.86 of every
           * pixel over L* 30 and covered 0.37 of the frame, so the machines, the pad and the
           * slab at the right edge are ONE mass and the cover reads as texture rather than as
           * a line of objects. Two repairs were tried and MEASURED rather than assumed. A
           * deeper contact at 0.24 m with a soft band under it left the largest component at
           * 0.86, exactly where it started, and dropped the median to 14.4 against a declared
           * band of 15 to 27. Darkening the pad is the repair this frame already made and had
           * to take back, at 0.72 into 0.90, for the same reason at 12.9.
           * SO THE BAND AND THE FOCAL ARE IN TENSION and that is the finding, not a fix. The
           * band can only be held by keeping the pad bright, and a bright pad is what the focal
           * is competing with. Redrawing the line so the sets separate by SHAPE rather than by
           * tone is the next run's work, and it is in the upgrade backlog rather than guessed
           * at here. */
          var fl = a.createLinearGradient(L, 0, Rr, 0);
          fl.addColorStop(0.00, "#93939B"); fl.addColorStop(0.44, "#6E6E76");
          fl.addColorStop(1.00, "#37373E");
          a.fillStyle = fl; a.fillRect(L, rf, Rr - L, bot - rf);
          a.fillStyle = G.glare;  a.fillRect(L, rf, Rr - L, Math.max(2, 0.035 * ppm));
          a.fillStyle = G.bright; a.fillRect(L, rf + 0.035 * ppm, Rr - L, 0.15 * ppm);
          for (var s = 1; s < 10; s += 1) {
            var sx2 = P(X - 6.1 + s * 1.22, 0, Z).x;
            a.fillStyle = "rgba(255,255,255,0.12)"; a.fillRect(sx2, rf + 6, 2, bot - rf - 6);
            a.fillStyle = "rgba(0,0,0,0.28)";       a.fillRect(sx2 + 2, rf + 6, 3, bot - rf - 6);
          }
          /* the radiator louvre bank, at one pitch, so the object is ribbed metal */
          var l0 = P(X + 3.3, 0, Z).x, l1 = P(X + 5.5, 0, Z).x;
          var lt = rf + 0.50 * ppm, lb = bot - 0.16 * ppm;
          a.fillStyle = G.deep; a.fillRect(l0, lt, l1 - l0, lb - lt);
          var nfn = 12, fpx = (l1 - l0) / nfn;
          for (var f2 = 0; f2 < nfn; f2 += 1) {
            a.fillStyle = G.mid;   a.fillRect(l0 + f2 * fpx, lt, fpx * 0.34, lb - lt);
            a.fillStyle = G.voidd; a.fillRect(l0 + f2 * fpx + fpx * 0.34, lt, fpx * 0.66, lb - lt);
          }
          /* THE STACK, with its rain cap wider than the barrel, which is what tells a reader
           * this is a flue and not a lamp standard. The first cut's flat collar read as a
           * luminaire and the whole line read as a row of poles along a road. */
          var st = P(X - 4.0, 0, Z).x, sw = 0.62 * ppm;
          var stop = P(X, 11.5, Z).y;
          a.fillStyle = G.shade;  a.fillRect(st, stop, sw, rf - stop + 6);
          a.fillStyle = G.bright; a.fillRect(st, stop, sw * 0.32, rf - stop + 6);
          a.fillStyle = G.voidd;  a.fillRect(st + sw * 0.78, stop, sw * 0.22, rf - stop + 6);
          /* THE RAIN CAP IS DRAWN WIDE AND THICK ENOUGH TO SURVIVE 432 px. At a thin collar the
           * near stacks read as bare posts in the thumb and the whole line read as lamp
           * standards along a road. A cap that overhangs its barrel is what says FLUE. */
          a.fillStyle = G.metal;  a.fillRect(st - sw * 0.52, stop - 0.30 * ppm, sw * 2.04, 0.30 * ppm);
          a.fillStyle = G.glare;  a.fillRect(st - sw * 0.52, stop - 0.30 * ppm, sw * 2.04, Math.max(3, 0.07 * ppm));
          a.fillStyle = G.voidd;  a.fillRect(st - sw * 0.52, stop, sw * 2.04, Math.max(2, 0.05 * ppm));
        }

        for (var k = 0; k < order.length; k += 1) {
          var i2 = order[k];
          var Z = 7.0 + i2 * i2 * 0.28 + i2 * 4.6;   /* centres open out with depth */
          var X = -6.5 + i2 * 1.5;                   /* the line drifts right as it recedes */
          if (Z > 250) continue;
          var t = Math.min(1, Z / 230);
          if (i2 <= 1) { nearSet(X, Z, 1 - t * 0.5); continue; }
          var inks = {
            ink:    S.fade(G.deep, Z),
            paper:  S.fade(G.stone, Z),
            accent: S.fade(G.metal, Z)
          };
          /* the cast, down and to the right, from the deck's one light */
          S.shadow(set, { X: X, Z: Z, ink: G.voidd, alpha: 0.34 * (1 - t * 0.7) });
          S.sprite(set, { X: X, Z: Z, inks: inks, fade: false });
          /* the LIT LEFT CHEEK, painted as its own face so the enclosure turns in space rather
           * than being a silhouette with a colour */
          var ppm = S.ppm(Z);
          var o = P(X - 6.1, 0, Z);
          var top = P(X - 6.1, 3.0, Z);
          a.fillStyle = S.fade(G.bright, Z);
          a.fillRect(o.x, top.y, Math.max(1.8, 0.52 * ppm), o.y - top.y);
          /* and its shade return on the right, so the two faces are a measurable pair */
          var o2 = P(X + 5.6, 0, Z), t2 = P(X + 5.6, 3.0, Z);
          a.fillStyle = S.fade(G.deep, Z);
          a.fillRect(o2.x - Math.max(1.6, 0.46 * ppm), t2.y, Math.max(1.6, 0.46 * ppm), o2.y - t2.y);
        }

        /* THE SET CUT BY THE RIGHT EDGE, AND IT IS THE DECK'S EDGE TEASE RATHER THAN A
         * DECORATION. Frame 2 crops into a stack with its louvre bank beside it. Nothing here
         * was cut by the right edge at all, so there was nothing for that crop to complete and
         * the device the storyboard claims was not executed. This set is at 5.2 m with its
         * stack cut by the edge at screen x 1065. Same world, one object later.
         *
         * AT 5.2 m ITS ROOFLINE LANDED AT y 466 AND THE DEK SITS AT 452. Machine QA read the
         * roof band as a rule through the dek's glyph band and it was right to: a long bright
         * horizontal edge crossing a line of type is a strikethrough at feed width whatever it
         * depicts. Pushed back to 7.2 m the same roofline falls to 531, clear of the type, and
         * the stack moves to the frame's right edge where the crop wants it. */
        nearSet(8.2, 7.2, 1);

        /* THE SKY FALLS AWAY ABOVE THE YARD, AND THAT IS THE MAST RATHER THAN A WASH.
         *
         * A mast is a LOCAL source standing on the pad, so it lights the ground and the lower
         * part of what stands on it, and everything above that falls to the night. Without it,
         * the line's stacks ran up the full height of the frame at their ground value and the
         * dek sat across five of them: machine QA read art through 68 percent of that line and a
         * reader would read the same thing. The falloff is the truer drawing and it gives both
         * lines of display type a dark field to sit in by construction rather than by a plate. */
        var aer = a.createLinearGradient(0, 640, 0, 460);
        aer.addColorStop(0.00, "rgba(0,0,0,0)");
        aer.addColorStop(0.55, "rgba(0,0,0,0.54)");
        aer.addColorStop(1.00, "rgba(0,0,0,0.86)");
        a.fillStyle = aer; a.fillRect(0, 460, W, 180);
        a.fillStyle = "rgba(0,0,0,0.86)"; a.fillRect(0, 0, W, 460);

        /* THE PAD FALLS AWAY TOWARD THE READER, AND THE BOTTOM THIRD WAS THE FRAME'S BRIGHTEST
         * AREA. The dossier's focal is the near set's lit flank. A reviewer measured the largest
         * bright mass as the empty caliche below y 911 instead, which is the picture telling a
         * reader to look at the ground. The mast lights a circle and the ground in front of the
         * camera is outside it. */
        var padFall = a.createLinearGradient(0, 900, 0, H);
        padFall.addColorStop(0.00, "rgba(0,0,0,0)");
        /* AND IT IS A FALLOFF RATHER THAN A CURTAIN. At 0.72 into 0.90 the frame came out at
         * median L* 12.9 against its own declared band of 15 to 27, so the cover became the
         * darkest frame in a deck whose value arc opens at 21 and descends. The pad still runs
         * out toward the reader and it no longer takes the whole frame with it. */
        padFall.addColorStop(0.62, "rgba(0,0,0,0.14)");
        padFall.addColorStop(1.00, "rgba(0,0,0,0.30)");
        a.fillStyle = padFall; a.fillRect(0, 900, W, H - 900);

        /* THE MAST ITSELF, off the left edge, cropped, so the light has a source in frame. */
        var mb = P(-9.4, 0, 16), mt = P(-9.4, 26, 16);
        a.strokeStyle = G.shade; a.lineWidth = Math.max(2, 0.22 * S.ppm(16));
        a.beginPath(); a.moveTo(mb.x, mb.y); a.lineTo(mt.x, mt.y); a.stroke();
        var head = P(-9.4, 26, 16);
        var hg = a.createRadialGradient(head.x, head.y, 0, head.x, head.y, 120);
        hg.addColorStop(0, "rgba(255,255,255,0.95)"); hg.addColorStop(1, "rgba(255,255,255,0)");
        a.save(); a.globalCompositeOperation = "lighter"; a.fillStyle = hg;
        a.fillRect(head.x - 130, head.y - 130, 260, 260); a.restore();

      },
      over: function (c) {
        /* the print is faded to the deck's ground under the fixed furniture bands, and the
         * light DIMS toward the display type. Both run here, on the finished print, never on
         * the twin, because the edge pass would otherwise contour the reserve itself. */
        M.reserve(c, { top: 150, topSolid: 92, bottom: 150, bottomSolid: 94 });
        M.quiet(c, boxes, 0.44);
      }
    });

    TXDECK.finish(cx);
    resolve();
  } catch (e) { document.title = "ERR " + e.message; reject(e); }
  });
});
</script>
</body>
</html>
