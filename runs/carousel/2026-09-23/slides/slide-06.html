<!doctype html>
<!-- CAROUSEL 32, frame 6 of 9. Archetype FIGURE_SCALE.
     THE COUNT GETS A SIZE. One gas set at true scale with a person at 1.70 m at its radiator
     end, seen from a standing eye at 1.65 m, the stack running up out of the top of the frame.
     Forty of a thing means nothing until the reader knows how big one is and that somebody
     stands next to it.
     THE PERSON IS GIVEN A GREY DISTINCT FROM THE ENCLOSURE BEHIND THEM. Figures at the same
     tone as the object beside them merge into one pale shape, which the doctrine names as a
     thing that still fails.
     AN OBJECT TALLER THAN THE EYE PROJECTS ABOVE THE HORIZON AND THE TYPE LIVES UP THERE. The
     enclosure is 3.0 m against a 1.65 m eye, so its roof line is checked before the hook is
     placed and the hook sits left of the stack rather than behind it.
     NO AMBER. A machinery frame.
     Frame median L* planned at 23. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#322C44; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:470px; top:188px; width:530px; font-size:100px;
          font-family:"Fraunces", serif; font-weight:700; line-height:0.93;
          letter-spacing:-0.025em; color:#E8EAEE; font-variation-settings:"opsz" 128; z-index:10; }
  .dek  { position:absolute; left:470px; top:412px; width:530px; font-size:27px;
          line-height:1.42; color:#E4D8C3; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#8A8798;
             white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">This is one of them</h1>
<p class="dek">A single set on its skid, and somebody who works on it.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-23-gensetyard.js"></script>
<script src="@@ASSETS@@/js/txscene.js"></script>
<script src="@@ASSETS@@/js/txfig.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(function (resolve, reject) {
  document.fonts.ready.then(function () {
  try {
    TXLAYOUT.mount(document.body, {
      kicker: "The size of the thing", counter: "06 / 09",
      src: "c16 c17   TEXAS AI DOCKET", ink: "#8A8798"
    });
    TX.fitText(document.getElementById("hook"), { min: 72, max: 100, maxLines: 2 });

    var cv = document.getElementById("art"), cx = cv.getContext("2d");
    cx.scale(2, 2);
    var M = YARD, W = M.W, H = M.H, G = M.G;
    TX.reseed(M.SEED + 6);
    var boxes = M.boxes(".hook, .dek, .kick, .count, .src, .tx-site", 20);

    M.print(cx, {
      seed: 6,
      draw: function (a) {
        var S = TXSCENE.create(a, M.cam({ eye: 1.65, horizon: 700, f: 900, fogZ: 300, light: { az: -48, el: 28 } }));
        var P = function (X, Y, Z) { var q = S.project(X, Y, Z); return { x: q[0], y: q[1] }; };
        var R = M.rng(6);
        var d = M.castDir();

        /* Z 8.5, AND THE THIRD CAMERA IS THE ONE THAT DREW THE MACHINE.
         *
         * At nine metres the set was 300 px of a 1350 px frame and the figure beside it was a
         * smudge at the right edge. Pulled in to five, the figure read and THE MACHINE LEFT THE
         * PICTURE: a 12.2 m enclosure at five metres is 1830 px wide on a 1080 px frame, so its
         * roofline, both ends, its stack base and its louvre bank all fell outside, and three
         * separate reviewers said in three different words that the frame is a corridor wall
         * with a door in it. They were reading what was drawn. A FIGURE_SCALE frame whose
         * subject is off screen gives scale to a wall.
         *
         * At 8.5 m the enclosure is 1292 px, so it still bleeds both side edges by about 100 px
         * and is one continuous mass, AND its roofline sits at y 557 against open sky, its stack
         * rises off the top edge, and the radiator louvre bank closes the right end inside the
         * frame. The person stands at 7.6 m, a metre in front of the near flank, 201 px tall
         * against a 318 px enclosure. That ratio IS the frame: the machine towers and the reader
         * can see by how much. The first two cameras each fixed one half and lost the other.
         */
        var Z = 12, ppm = S.ppm(Z);
        var yBase = S.groundY(Z);
        var roofY = P(0, 3.0, Z).y;
        /* THE MACHINE SITS LEFT OF THE LENS AXIS SO ONE END IS IN THE PICTURE.
         * At 8.5 m it ran off BOTH side edges and three reviewers in two rounds read it as a
         * long louvred WALL, because an object with neither end in frame has no silhouette and
         * therefore no length. At 12 m, centred 2 m left of the axis, it still bleeds the left
         * edge and its right end cap closes inside the frame. One visible end plus a person at
         * true scale is what turns a wall into an object. */
        var CX = -2.0;
        var encL = P(CX - 6.1, 0, Z).x, encR = P(CX + 6.1, 0, Z).x;

        /* sky and pad */
        /* THE SKY IS FLAT AT THE DECK'S FLOOR. Graded up toward `deep` it carried visible screen
         * exactly where the dek sits, and a reviewer could not read the dek's last line off the
         * 432 px thumb. A line screen lays ink in proportion to tone, so the cure is the tone. */
        a.fillStyle = G.voidd; a.fillRect(0, 0, W, roofY + 2);
        /* the night lifts toward the roofline, where the mast's throw reaches it. The type band
         * above stays at the deck's floor, which is the whole reason the sky is flat up there. */
        var lift = a.createLinearGradient(0, 520, 0, roofY + 2);
        lift.addColorStop(0, "rgba(255,255,255,0)"); lift.addColorStop(1, "rgba(255,255,255,0.16)");
        a.save(); a.globalCompositeOperation = "lighter";
        a.fillStyle = lift; a.fillRect(0, 520, W, roofY - 518); a.restore();
        S.ground({ near: 1.0, far: 120, fill: G.dark });

        /* the mast's pool, on the pad in front of the machine */
        a.save(); a.globalCompositeOperation = "lighter";
        var pool = a.createRadialGradient(300, 960, 0, 300, 960, 980);
        pool.addColorStop(0.00, "rgba(255,255,255,0.56)");
        pool.addColorStop(0.44, "rgba(255,255,255,0.28)");
        pool.addColorStop(1.00, "rgba(255,255,255,0)");
        a.fillStyle = pool; a.fillRect(0, roofY, W, H - roofY); a.restore();

        /* ITS CAST, down and to the right at 1.881 times its height, laid before the body */
        a.save(); a.globalAlpha = 0.46; a.fillStyle = G.voidd;
        var cl = M.castLen(3.0) * ppm * 0.40;
        a.beginPath();
        a.moveTo(encL, yBase); a.lineTo(encR, yBase);
        a.lineTo(encR + d[0] * cl, yBase + d[1] * cl * 0.34);
        a.lineTo(encL + d[0] * cl, yBase + d[1] * cl * 0.34);
        a.closePath(); a.fill(); a.restore();

        /* A SECOND SET BEHIND IT AND TO THE RIGHT, so the hook THIS IS ONE OF THEM has a THEM
         * in the frame with it, and so the right quarter of the picture carries the yard instead
         * of carrying nothing. Drawn before the near enclosure, which occludes it.
         * IT IS NOW ACTUALLY DRAWN BEFORE IT. The comment said so and the call sat AFTER the
         * body, so a machine 26 m away painted over the near enclosure's right end: the cap
         * that closes the box, the turn the storyboard declared, and a band across the middle
         * of the flank. plan_render_check measured the declared lit and shade faces at 1.002
         * and was reading one surface twice. A drawing order is not a comment. */
        (function () {
          var Z2 = 26, p2 = S.ppm(Z2), yb2 = S.groundY(Z2);
          var l2 = P(9 - 6.1, 0, Z2).x, r2 = P(9 + 6.1, 0, Z2).x;
          var rf2 = P(9, 3.0, Z2).y, bt2 = yb2 - 0.35 * p2;
          a.fillStyle = G.deep;  a.fillRect(l2, yb2 - 0.35 * p2, r2 - l2, 0.35 * p2);
          a.fillStyle = "#5A5A62"; a.fillRect(l2, rf2, r2 - l2, bt2 - rf2);
          a.fillStyle = G.stone; a.fillRect(l2, rf2, r2 - l2, Math.max(2, 0.10 * p2));
          a.fillStyle = G.deep;  a.fillRect(r2 - 0.4 * p2, rf2, 0.4 * p2, bt2 - rf2);
          var s2 = P(9 + 4.0, 0, Z2).x, sw2 = 0.62 * p2;
          a.fillStyle = "#4E4E56"; a.fillRect(s2, P(9, 11.5, Z2).y, sw2, rf2 - P(9, 11.5, Z2).y);
          a.fillStyle = G.stone;  a.fillRect(s2 - sw2 * 0.5, P(9, 11.5, Z2).y - 0.24 * p2, sw2 * 2, 0.24 * p2);
        })();

        /* THE SKID, and it is a rail rather than a line */
        a.fillStyle = G.dark;  a.fillRect(encL, yBase - 0.35 * ppm, encR - encL, 0.35 * ppm);
        a.fillStyle = G.shade; a.fillRect(encL, yBase - 0.35 * ppm, encR - encL, 0.06 * ppm);
        a.fillStyle = G.voidd; a.fillRect(encL, yBase, encR - encL, 0.10 * ppm);

        /* THE ENCLOSURE BODY, ONE CONTINUOUS MASS with a real roofline against the sky.
         * The flank falls off left to right under the deck's one light, so the form turns
         * across its own length rather than being a filled band. */
        var bodyTop = roofY, bodyBot = yBase - 0.35 * ppm;
        var flank = a.createLinearGradient(encL, 0, encR, 0);
        /* THE FLANK COMES UP A STEP, because a reviewer measured the empty apron as the
         * brightest area on a frame whose declared focal is the enclosure's lit flank. The
         * machine is the lit thing in the picture it is the subject of. */
        flank.addColorStop(0.00, "#B4B4BC");
        flank.addColorStop(0.42, "#8B8B93");
        flank.addColorStop(1.00, "#45454C");
        a.fillStyle = flank; a.fillRect(encL, bodyTop, encR - encL, bodyBot - bodyTop);
        /* THE LIT ROOF EDGE. One bright rule along the top, which is the line that tells a
         * reader where the machine stops and the night starts. */
        a.fillStyle = G.glare;  a.fillRect(encL, bodyTop, encR - encL, 5);
        a.fillStyle = G.bright; a.fillRect(encL, bodyTop + 5, encR - encL, 0.17 * ppm);
        a.fillStyle = G.shade;  a.fillRect(encL, bodyTop + 5 + 0.17 * ppm, encR - encL, 4);

        /* the enclosure's own seams, one panel every 1.22 m, each a lit left edge over a dark
         * channel, tightening the flank into a made object rather than a gradient */
        for (var s = 1; s < 10; s += 1) {
          var sxp = P(CX - 6.1 + s * 1.22, 0, Z).x;
          a.fillStyle = "rgba(255,255,255,0.13)"; a.fillRect(sxp, bodyTop + 6, 2, bodyBot - bodyTop - 6);
          a.fillStyle = "rgba(0,0,0,0.30)";       a.fillRect(sxp + 2, bodyTop + 6, 3, bodyBot - bodyTop - 6);
        }

        /* THE RIGHT END CAP, so the enclosure CLOSES inside the frame. A box with neither end
         * drawn is a wall, whatever it is called in the plan. */
        /* AND IT IS THE DARK SIDE, MEASURED RATHER THAN NAMED. At G.deep the cap came out
         * within 1.002 of the flank it is supposed to turn away from, which is a silhouette
         * with a colour rather than a solid: the storyboard declared a turn the render did
         * not draw. The separation between two faces of one object IS the information that
         * it has depth, so the cap is the deck's void with one catch light down its leading
         * edge, and the pair clears WCAG 1.4.11's 3 to 1 on the finished print. */
        var capW = 0.52 * ppm;
        a.fillStyle = G.voidd; a.fillRect(encR - capW, bodyTop, capW, bodyBot - bodyTop);
        a.fillStyle = G.stone; a.fillRect(encR - capW, bodyTop, 3, bodyBot - bodyTop);
        a.fillStyle = G.dark;  a.fillRect(encR - capW + 3, bodyTop, 5, bodyBot - bodyTop);


        /* THE ACCESS DOOR, with a jamb and a return, both inside the picture */
        var dX = P(CX + 0.6, 0, Z).x, dW = P(CX + 1.75, 0, Z).x - dX;
        var dTop = bodyTop + 0.36 * ppm, dBot = bodyBot;
        a.fillStyle = G.shade;  a.fillRect(dX, dTop, dW, dBot - dTop);
        a.fillStyle = G.bright; a.fillRect(dX, dTop, dW * 0.16, dBot - dTop);   /* LIT jamb */
        a.fillStyle = G.voidd;  a.fillRect(dX + dW - dW * 0.12, dTop, dW * 0.12, dBot - dTop);
        a.fillStyle = G.metal;  a.fillRect(dX, dTop, dW, 0.05 * ppm);
        a.fillStyle = G.stone;  a.fillRect(dX + dW * 0.66, dTop + (dBot - dTop) * 0.46, 0.14 * ppm, 0.05 * ppm);

        /* THE RADIATOR LOUVRE BANK, closing the right end INSIDE the frame, at one pitch,
         * every fin a lit leading edge over a shadowed channel. This is the frame's texture
         * gradient and it is what says radiator rather than shipping container. */
        var lx0 = P(CX + 3.3, 0, Z).x, lx1 = Math.min(P(CX + 5.7, 0, Z).x, encR - 0.42 * ppm);
        var lTop = bodyTop + 0.52 * ppm, lBot = bodyBot - 0.18 * ppm;
        a.fillStyle = G.deep; a.fillRect(lx0, lTop, lx1 - lx0, lBot - lTop);
        var nf = 13, fp = (lx1 - lx0) / nf;
        for (var f = 0; f < nf; f += 1) {
          a.fillStyle = G.mid;   a.fillRect(lx0 + f * fp, lTop, fp * 0.34, lBot - lTop);
          a.fillStyle = G.voidd; a.fillRect(lx0 + f * fp + fp * 0.34, lTop, fp * 0.66, lBot - lTop);
        }
        a.fillStyle = G.stone; a.fillRect(lx0 - 4, lTop - 5, lx1 - lx0 + 8, 5);

        /* THE STACK, off the enclosure's left end, leaving the top of the frame. The one thing
         * an air permit is about, and the deck's motif in its single largest state. */
        /* THE MACHINE IS MIRRORED, STACK RIGHT AND LOUVRE LEFT, AND THAT IS A TYPE DECISION.
         * With the stack at its canonical left end it projects to screen x 116 and runs from the
         * top edge down to the roofline, straight through the hook. A unit on a pad has no
         * canonical handedness, so the frame turns the machine around rather than moving the
         * one line of display type it has. */
        /* THE MACHINE IS TURNED BACK THE RIGHT WAY ROUND, AND THAT IS THE MOTIF RATHER THAN A
         * PREFERENCE. It was mirrored, stack right and louvre left, to keep the stack out of the
         * hook. A scorer put the cost plainly: frame 5 teaches a reader one silhouette forty
         * times over, an enclosure with its flue toward the LEFT end and its radiator bank at the
         * right, and then frame 6 says THIS IS ONE OF THEM beside a machine that is the mirror of
         * it. The reader cannot connect the count to the size, which is the one job this pair
         * has. The type moved instead. A hook can sit anywhere on a frame. A motif cannot. */
        var stX = P(CX - 4.0, 0, Z).x, stW = 0.62 * ppm;
        a.fillStyle = G.shade;  a.fillRect(stX, 0, stW, bodyTop + 8);
        a.fillStyle = G.bright; a.fillRect(stX, 0, stW * 0.34, bodyTop + 8);
        a.fillStyle = G.voidd;  a.fillRect(stX + stW * 0.76, 0, stW * 0.24, bodyTop + 8);
        /* TWO FLANGES, NOT FOUR RUNGS, AND THE DIFFERENCE IS THE WHOLE ARGUMENT.
         *
         * Four bands at 120 px spacing across a 46 px barrel is a ladder's proportion, and two
         * independent reviewers read this element as a LATTICE MAST, which is transmission
         * structure. On a deck whose entire case is that these machines never ask the grid for
         * anything, and on which frame 2's own acceptance forbids a transmission structure
         * anywhere in frame, that is not a craft note. It is the art contradicting the argument.
         *
         * A galvanised flue has two or three circumferential weld flanges, wider than the barrel
         * and much closer together than a ladder's rungs, and a rain cap at the top. It reads as
         * one solid object. */
        a.fillStyle = G.voidd; a.fillRect(stX - 4, 0, 4, bodyTop + 8);
        a.fillStyle = G.voidd; a.fillRect(stX + stW, 0, 4, bodyTop + 8);
        for (var b = 1; b < 3; b += 1) {
          var by2 = bodyTop * (0.26 + b * 0.24);
          a.fillStyle = G.metal;  a.fillRect(stX - 7, by2, stW + 14, 9);
          a.fillStyle = G.glare;  a.fillRect(stX - 7, by2, stW + 14, 3);
          a.fillStyle = G.voidd;  a.fillRect(stX - 7, by2 + 9, stW + 14, 4);
        }

        /* THE PERSON at 1.70 m, one metre in front of the near flank, on open pad and CLEAR of
         * the louvre bank. Drawn DARK against the lit flank rather than light against it: the
         * enclosure is the lit surface in this frame, so a pale figure standing on it merges
         * into one shape, which is the failure the doctrine names and which the first cut of
         * this frame produced exactly. */
        var fX = -3.4, fZ = 11.6, fppm = S.ppm(fZ);
        var fig = TXFIG.figure({ pose: "stand", height: 1.70, hat: "hard", hold: "clipboard" });
        a.save(); a.globalAlpha = 0.50; a.fillStyle = G.voidd;
        var fb = P(fX, 0, fZ), fcl = M.castLen(1.70) * fppm * 0.44;
        a.beginPath();
        a.moveTo(fb.x - 0.26 * fppm, fb.y); a.lineTo(fb.x + 0.26 * fppm, fb.y);
        a.lineTo(fb.x + 0.20 * fppm + d[0] * fcl, fb.y + d[1] * fcl * 0.34);
        a.lineTo(fb.x - 0.20 * fppm + d[0] * fcl, fb.y + d[1] * fcl * 0.34);
        a.closePath(); a.fill(); a.restore();
        S.shadow(fig, { X: fX, Z: fZ, ink: G.voidd, alpha: 0.34 });
        S.sprite(fig, { X: fX, Z: fZ, fade: false,
                        inks: { ink: G.voidd, paper: G.deep, accent: G.dark } });
        /* one lit rim down the figure's left side, from the same mast, so the silhouette is a
         * person under a light rather than a hole cut in the machine */
        a.save();
        a.fillStyle = G.metal;
        a.fillRect(fb.x - 0.21 * fppm, fb.y - 1.70 * fppm, Math.max(2, 0.035 * fppm), 1.70 * fppm);
        a.restore();

        /* the pad's tooth, coarsening toward the reader, and stopping clear of the footer */
        for (var i = 0; i < 110; i += 1) {
          var gx = R() * W, gy = yBase + 10 + R() * (1150 - yBase);
          var gs = 1.6 + (gy - yBase) / (H - yBase) * 5.0;
          a.fillStyle = R() > 0.5 ? G.shade : G.deep;
          a.fillRect(gx, gy, gs, gs * 0.7);
        }
        /* THE APRON FALLS AWAY FROM THE MACHINE. It came out as the largest bright area on the
         * frame, above the enclosure's own lit flank, on a frame whose subject is the machine.
         * A mast lights a circle and the ground in front of the camera is outside it. */
        var ap = a.createLinearGradient(0, yBase + 40, 0, H);
        ap.addColorStop(0.00, "rgba(0,0,0,0)");
        ap.addColorStop(0.70, "rgba(0,0,0,0.18)");
        ap.addColorStop(1.00, "rgba(0,0,0,0.34)");
        a.fillStyle = ap; a.fillRect(0, yBase + 40, W, H - yBase - 40);

      },
      over: function (c) {
        /* the print is faded to the deck's ground under the fixed furniture bands, and the
         * light DIMS toward the display type. Both run here, on the finished print, never on
         * the twin, because the edge pass would otherwise contour the reserve itself. */
        M.reserve(c, { top: 150, topSolid: 92, bottom: 150, bottomSolid: 94 });
        M.quiet(c, boxes, 0.14);
      }
    });

    TXDECK.finish(cx);
    resolve();
  } catch (e) { document.title = "ERR " + e.message; reject(e); }
  });
});
</script>
</body>
</html>
