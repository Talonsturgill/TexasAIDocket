<!doctype html>
<!-- CAROUSEL 30, frame 4 of 9. Archetype FIGURE_SCALE.
     THE SECOND INSTRUMENT, AND THE HAND THAT WRITES IT. An operator at 1.7 m standing at the
     shelf, seen from shoulder height, with the 1.2 m by 3.0 m hydropneumatic tank behind them so
     its crown runs off the top edge and the tank gets a size from the person.
     A PERSON IS IN THIS FRAME BECAUSE c15 IS A CLAIM ABOUT WHAT PEOPLE DO. The abstract's
     criticism is of practices, and a practice has somebody carrying it out.
     THE MOTIF LANDS AS THE RULED BLANK LINES under the last written entry. The log is current to
     that line and the page below it is empty, which is the same fact the chart on frame 2 states
     with a pen.
     THE ACCENT IS ON THE WRITTEN ENTRIES AND NEVER ON A BLANK LINE.
     Planned frame median L* 16. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#2E2016; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:150px; width:700px; font-size:80px;
          font-family:"Fraunces", serif; font-weight:700; line-height:1.00;
          letter-spacing:-0.021em; color:#DCD3B4; font-variation-settings:"opsz" 144; z-index:10; }
  .dek  { position:absolute; left:80px; top:390px; width:560px; font-size:24px;
          line-height:1.42; color:#B9B096; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#9A9280;
             white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">The log is current to this line.</h1>
<p class="dek">Under the last entry, ruled blank lines. A record answers what happened and never what is about to.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-20-waterworks.js"></script>
<script src="@@ASSETS@@/js/txscene.js"></script>
<script src="@@ASSETS@@/js/txfig.js"></script>
<script src="@@ASSETS@@/js/txobjects.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(async function (resolve, reject) {
  try {
    await document.fonts.ready;
    TXLAYOUT.mount(document.body, {
      kicker: "The other instrument", counter: "04 / 09",
      src: "c15   TEXAS AI DOCKET", ink: "#9A9280"
    });
    TX.fitText(document.getElementById("hook"), { min: 58, max: 80, maxLines: 2 });

    var cv = document.getElementById("art"), cx = cv.getContext("2d");
    cx.scale(2, 2);
    var M = TXWW, W = M.W, H = M.H;
    TX.reseed(20260904);

    var boxes = M.boxes(".hook, .dek, .kick, .count, .src, .tx-site", 18);

    /* THE OPEN LOGBOOK, 0.30 x 0.21 m, hoisted so the over pass can ink the written entries in
     * granite after the screen has run. Seven written lines, then RULED BLANK ONES. */
    var LOG = { x: 470, y: 856, w: 470, h: 330, rot: -0.028 };
    LOG.written = 7; LOG.rules = 14;

    M.print(cx, {
      seed: 15,
      draw: function (a) {
        var S = M.scene(a, { horizon: 640, f: 900, eye: 1.45 });
        var castX = M.castDir()[0];

        /* THE BACK WALL, block, falling away east into the room's shade. */
        (function () {
          M.blockWall(a, { x: 0, y: 0, w: W, h: H }, S.ppm(3.4),
                      { face: M.G.shade, joint: M.G.dark });
          var g = a.createLinearGradient(0, 0, W, H * 0.5);
          g.addColorStop(0.00, "rgba(246,235,200,0.16)");
          g.addColorStop(0.42, "rgba(0,0,0,0.26)");
          g.addColorStop(1.00, "rgba(0,0,0,0.62)");
          a.fillStyle = g; a.fillRect(0, 0, W, H);
        })();

        /* THE HYDROPNEUMATIC TANK, 1.2 m diameter and 3.0 m long on two 0.5 m saddles, lying
         * across the frame behind the figure with its crown running OFF THE TOP EDGE. A subject
         * cropped by the frame is inside the reader's space. */
        (function () {
          var ppm = S.ppm(2.6);
          var tY = 150, tR = 0.6 * ppm;
          /* the tank's own cast on the wall, east */
          a.fillStyle = "rgba(0,0,0,0.40)";
          a.fillRect(120 + 26, tY - tR + 20, W, tR * 2);
          /* the cylinder, its west flank taking the key and its east falling to the deck's dark */
          var g = a.createLinearGradient(0, tY - tR, 0, tY + tR);
          g.addColorStop(0.00, M.G.metal);
          g.addColorStop(0.30, M.G.bright);
          g.addColorStop(0.72, M.G.shade);
          g.addColorStop(1.00, M.G.dark);
          a.fillStyle = g;
          a.fillRect(-40, tY - tR, W + 80, tR * 2);
          /* the chalked enamel's longitudinal seam and two strap bands */
          a.strokeStyle = "rgba(0,0,0,0.30)"; a.lineWidth = 2;
          a.beginPath(); a.moveTo(-40, tY - tR * 0.42); a.lineTo(W + 40, tY - tR * 0.42); a.stroke();
          for (var s = 0; s < 2; s++) {
            var sx = 210 + s * 520;
            a.fillStyle = M.G.metal; a.fillRect(sx, tY - tR, 16, tR * 2);
            a.fillStyle = "rgba(246,235,200,0.22)"; a.fillRect(sx, tY - tR, 5, tR * 2);
          }
          /* the dished head at the west end, so it reads as a vessel and not a pipe */
          a.fillStyle = M.G.bright;
          a.beginPath(); a.ellipse(-40, tY, tR * 0.34, tR, 0, 0, Math.PI * 2); a.fill();
          a.strokeStyle = "rgba(0,0,0,0.34)"; a.lineWidth = 2;
          a.beginPath(); a.moveTo(-40, tY - tR); a.lineTo(W + 40, tY - tR); a.stroke();
          a.beginPath(); a.moveTo(-40, tY + tR); a.lineTo(W + 40, tY + tR); a.stroke();
          /* one saddle, cropped, carrying it */
          a.fillStyle = M.G.dark; a.fillRect(190, tY + tR, 96, 150);
          a.fillStyle = "rgba(246,235,200,0.10)"; a.fillRect(190, tY + tR, 26, 150);
        })();

        /* THE SHELF, 1.8 m of painted plywood at 0.95 m, with the room's light raking along it. */
        (function () {
          var sy = 760;
          a.fillStyle = "rgba(0,0,0,0.52)"; a.fillRect(0, sy + 14, W, H - sy);
          a.fillStyle = M.G.stone; a.fillRect(0, sy, W, 22);
          a.fillStyle = "rgba(246,235,200,0.24)"; a.fillRect(0, sy, W, 7);
          a.fillStyle = M.G.dark; a.fillRect(0, sy + 22, W, H - sy - 22);
          var g = a.createLinearGradient(0, sy + 22, W, H);
          g.addColorStop(0.00, "rgba(246,235,200,0.14)");
          g.addColorStop(0.50, "rgba(0,0,0,0.20)");
          g.addColorStop(1.00, "rgba(0,0,0,0.58)");
          a.fillStyle = g; a.fillRect(0, sy + 22, W, H - sy - 22);
          /* THE PLYWOOD'S GRAIN. Without it the lower half of this frame is a gradient, which
           * is what layout_check measured and called a flat plate under a plan that promises a
           * drawn room. A shelf is a material and a material has a surface. */
          var RG = TX.rng(541);
          a.globalAlpha = 0.09;
          for (var i = 0; i < 120; i++) {
            var gy = sy + 24 + RG() * (H - sy - 24);
            a.strokeStyle = RG() < 0.5 ? "#000" : M.G.bright;
            a.lineWidth = 0.7 + RG() * 1.9;
            a.beginPath(); a.moveTo(-20, gy);
            a.bezierCurveTo(W * 0.32, gy + (RG() - 0.5) * 18,
                            W * 0.68, gy + (RG() - 0.5) * 18, W + 20, gy);
            a.stroke();
          }
          a.globalAlpha = 1;
          /* the shelf's own brackets, cropped, so the bottom band has a thing in it */
          for (var b = 0; b < 2; b++) {
            var bxx = 120 + b * 620;
            a.fillStyle = "rgba(0,0,0,0.50)"; a.fillRect(bxx + 12, sy + 34, 34, 210);
            a.fillStyle = M.G.dark; a.fillRect(bxx, sy + 22, 34, 222);
            a.fillStyle = "rgba(246,235,200,0.14)"; a.fillRect(bxx, sy + 22, 9, 222);
          }
        })();

        /* THE OPERATOR, 1.7 m at shoulder height, INKED DARK against the lit tank behind them.
         * Left of centre so the eye reaches the person before the thing the person is doing,
         * which is the order c15 is written in. */
        (function () {
          var fig = TXFIG.figure({ pose: "stand", height: 1.7 });
          S.shadow(fig, { X: -0.9, Z: 2.6, ink: "#000", alpha: 0.44 });
          S.sprite(fig, { X: -0.9, Z: 2.6,
                          inks: { ink: M.G.void, paper: M.G.deep, accent: M.G.dark },
                          fade: false });
        })();

        /* THE OPEN LOGBOOK on the shelf, its spine down the middle and its leaves lifting very
         * slightly at the fore edge, with a real contact shadow under it. */
        (function () {
          a.save();
          a.translate(LOG.x, LOG.y); a.rotate(LOG.rot);

          a.fillStyle = "rgba(0,0,0,0.56)";
          a.fillRect(12, 16, LOG.w, LOG.h);

          a.fillStyle = M.G.bright;
          a.fillRect(0, 0, LOG.w, LOG.h);
          var g = a.createLinearGradient(0, 0, LOG.w, LOG.h * 0.6);
          g.addColorStop(0.00, "rgba(246,235,200,0.30)");
          g.addColorStop(0.50, "rgba(246,235,200,0.06)");
          g.addColorStop(1.00, "rgba(0,0,0,0.26)");
          a.fillStyle = g; a.fillRect(0, 0, LOG.w, LOG.h);

          /* the gutter shadow down the spine, which is what makes it a bound book */
          var gg = a.createLinearGradient(LOG.w * 0.44, 0, LOG.w * 0.56, 0);
          gg.addColorStop(0.00, "rgba(0,0,0,0.00)");
          gg.addColorStop(0.50, "rgba(0,0,0,0.42)");
          gg.addColorStop(1.00, "rgba(0,0,0,0.00)");
          a.fillStyle = gg; a.fillRect(LOG.w * 0.44, 0, LOG.w * 0.12, LOG.h);

          /* the ruling, and the two vertical column rules a log is kept in */
          a.strokeStyle = "rgba(46,32,22,0.28)"; a.lineWidth = 1;
          for (var r = 1; r <= LOG.rules; r++) {
            var ry = 26 + r * ((LOG.h - 50) / (LOG.rules + 1));
            a.beginPath(); a.moveTo(18, ry); a.lineTo(LOG.w - 18, ry); a.stroke();
          }
          a.strokeStyle = "rgba(46,32,22,0.34)"; a.lineWidth = 1.2;
          a.beginPath(); a.moveTo(LOG.w * 0.20, 14); a.lineTo(LOG.w * 0.20, LOG.h - 14); a.stroke();
          a.beginPath(); a.moveTo(LOG.w * 0.74, 14); a.lineTo(LOG.w * 0.74, LOG.h - 14); a.stroke();

          a.strokeStyle = "rgba(0,0,0,0.30)"; a.lineWidth = 1.4;
          a.strokeRect(0.5, 0.5, LOG.w - 1, LOG.h - 1);
          a.restore();
        })();

        /* THE BALLPOINT, 0.14 m, lying across the page where the hand left it, with its own cast. */
        (function () {
          a.save();
          a.translate(LOG.x + 250, LOG.y + 214); a.rotate(-0.44);
          a.fillStyle = "rgba(0,0,0,0.46)"; a.fillRect(5, 7, 120, 9);
          a.fillStyle = M.G.dark; a.fillRect(0, 0, 120, 9);
          a.fillStyle = "rgba(246,235,200,0.28)"; a.fillRect(0, 0, 120, 3);
          a.fillStyle = M.G.metal; a.fillRect(104, 1, 22, 7);
          a.restore();
        })();
      },
      over: function (c) {
        M.reserve(c, { top: 126, topSolid: 66, bottom: 180, bottomSolid: 108 });
        M.quiet(c, boxes);
        TXDECK.punch(c, boxes, { feather: 92, strength: 0.58 });

        /* THE WRITTEN ENTRIES, IN GRANITE, AFTER THE SCREEN. Seven lines of a hand's ballpoint,
         * and then NOTHING. The ruled lines under them stay bare stock, which is where this
         * frame's motif lands and why the accent law forbids the colour going any further. */
        c.save();
        c.translate(LOG.x, LOG.y); c.rotate(LOG.rot);
        var R = TX.rng(377);
        var step = (LOG.h - 50) / (LOG.rules + 1);
        c.strokeStyle = M.ACCENT; c.lineCap = "round";
        for (var r = 1; r <= LOG.written; r++) {
          var ry = 26 + r * step - 4;
          /* the date column, the reading column, the initial column. A log is kept in columns. */
          var cols = [[24, LOG.w * 0.18], [LOG.w * 0.23, LOG.w * 0.70], [LOG.w * 0.77, LOG.w * 0.92]];
          for (var k = 0; k < cols.length; k++) {
            var x0 = cols[k][0], x1 = cols[k][1];
            c.lineWidth = 3.4 + R() * 1.2;
            c.beginPath();
            var x = x0;
            c.moveTo(x, ry + (R() - 0.5) * 2);
            while (x < x1) {
              var seg = 5 + R() * 11;
              x += seg;
              c.lineTo(Math.min(x, x1), ry + (R() - 0.5) * 4.6);
              if (R() < 0.22) { x += 3 + R() * 5; c.moveTo(Math.min(x, x1), ry + (R() - 0.5) * 3); }
            }
            c.stroke();
          }
        }
        c.restore();
      }
    });

    TXDECK.finish(cx, { w: W, h: H });
    resolve();
  } catch (e) { reject(e); }
});
</script>
</body>
</html>
