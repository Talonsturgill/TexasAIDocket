<!doctype html>
<!-- 2026-09-26, frame 5 of 9. Archetype GRID. RENDERED through txthree.js in the deck's declared
     blueHour world. THE YEAR'S NUMBER AND THE REPORTED ONE, AT ONE SCALE. A concrete yard of painted
     tractor stalls, one per truck in Aurora's year end allocation, and one rendered tractor in each of
     the first stalls for every truck Breitbart, citing a CNBC ride, reports running now. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#151D33; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; font-family:"Fraunces", serif; font-weight:800; line-height:0.94;
          letter-spacing:-0.008em; color:#F3F1EC; font-variation-settings:"opsz" 144; z-index:10;
          text-shadow:0 2px 18px rgba(8,12,24,0.4); }
  .dek  { position:absolute; font-size:30px; line-height:1.40; color:#E3E7EE; z-index:10;
          text-shadow:0 0 3px rgba(8,12,24,0.75), 0 0 10px rgba(8,12,24,0.45); }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#C8D1DC;
             white-space:nowrap; z-index:20; }
  .kick, .count, .src, .tx-site { text-shadow:0 0 5px rgba(8,12,24,0.85), 0 1px 14px rgba(8,12,24,0.6); }
  .hook { left:80px; top:150px; width:900px; } .dek { left:82px; width:820px; font-size:30px; }
  .haze { position:absolute; left:0; top:0; width:1080px; height:620px; z-index:5; background:linear-gradient(180deg, rgba(10,14,28,0.5) 0%, rgba(10,14,28,0.42) 70%, rgba(10,14,28,0) 100%); }
  .floor { position:absolute; left:0; bottom:0; width:1080px; height:220px; z-index:5; background:linear-gradient(0deg, rgba(10,14,28,0.5) 0%, rgba(10,14,28,0.4) 55%, rgba(10,14,28,0) 100%); }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="haze" data-decorative></div>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">200 places, 20 trucks</h1>
<p class="dek" data-follow="26">Aurora says it is fully allocated to end 2026 with 200 driverless trucks. Breitbart puts the fleet running now at 20. It cites a CNBC ride.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-26-fortyfive.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
const FIG = {"aurora_trucks_year_end": {"value": 200, "from": ["c29"], "basis": "Aurora's allocation to exit 2026, not trucks now running"}, "aurora_trucks_now_reported": {"value": 20, "from": ["c34"], "basis": "Breitbart, citing a CNBC ride. Secondary"}};
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "Aurora's year", counter: "05 / 09", src: "c29 c34   YARD ILLUSTRATIVE", ink: '#C8D1DC' });
  TX.fitText(document.getElementById("hook"), { min: 88, max: 124, maxLines: 2 });
  FORTYFIVE.follow();
  const TXT = init(THREE), K = initKit(THREE, TXT), F = FORTYFIVE, gl = F.glCanvas();
  const W = TXT.deckWorld(), M = F.mats(TXT, THREE);
  const R = TXT.setup(gl, { w: 1080, h: 1350, fog: [W.haze, W.fogDensity * 1.8], exposure: W.exposure - 0.45, tone: W.tone, fov: 44 });

  /* THE YARD. One painted tractor stall per truck in the allocation, read from figures.json, ten
   * across and twenty rows deep, every row with its own drive aisle. The two nearest rows hold one tractor
   * per stall for the reported count, noses out to the camera. One scale for stalls and trucks.
   * A high oblique from the near aisle: the twenty cabs fill the lower third and the 180 empty
   * stalls recede row by row toward the type and the horizon. */
  const STALLS = FIG.aurora_trucks_year_end.value, NOW = FIG.aurora_trucks_now_reported.value;
  const ACROSS = NOW / 2, SW = 4.2, SL = 9.6, AISLE = 8;
  const rows = Math.ceil(STALLS / ACROSS);
  const rowZ = (r) => -r * (SL + AISLE);          /* row 0 nearest, rows recede to -z */
  const width = ACROSS * SW, zNear = 0;
  TXT.frame(R, { from: [0, 40, zNear + 50], look: [0, 0, zNear - 40] });
  TXT.sky(R);
  TXT.deckRig(R, Object.assign({}, W.rig, { key: Object.assign({}, W.rig.key, { shadowSize: 50 }) }), { target: [0, 0, -40], distance: 200, shadowFar: 600 });
  TXT.ground(R, { surface: 'asphalt', size: 4000, seed: 17 });

  /* each place painted: two worn white lines per stall and a stop bar, answering the light */
  const paint = TXT.mat.clay(0xcfd2d4, { roughness: 0.42 });
  const lineG = new THREE.BoxGeometry(0.15, 0.012, SL);
  const barG = new THREE.BoxGeometry(width, 0.012, 0.2);
  const lines = new THREE.InstancedMesh(lineG, paint, rows * (ACROSS + 1));
  const mx = new THREE.Matrix4(); let k = 0, placed = 0;
  for (let r = 0; r < rows; r++) {
    const zc = rowZ(r) - SL / 2;
    for (let c = 0; c <= ACROSS; c++) { mx.makeTranslation(-width / 2 + c * SW, 0.007, zc); lines.setMatrixAt(k++, mx); }
    const bar = new THREE.Mesh(barG, paint); bar.position.set(0, 0.007, zc - SL / 2); bar.receiveShadow = true; R.scene.add(bar);
    placed += Math.min(ACROSS, STALLS - r * ACROSS);
  }
  lines.receiveShadow = true; R.scene.add(lines);
  window.__stalls = placed;

  /* oil stains in the occupied stalls, tyre polish in the near aisle */
  const stain = new THREE.MeshStandardMaterial({ color: 0x0b0c0f, roughness: 0.25, transparent: true, opacity: 0.55, depthWrite: false });
  let sd = 5; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < NOW; i++) {
    const d = new THREE.Mesh(new THREE.CircleGeometry(0.5 + rnd() * 0.5, 20), stain);
    d.rotation.x = -Math.PI / 2; d.scale.set(1, 1.6, 1); d.position.set(-width / 2 + (i % ACROSS + 0.5) * SW + (rnd() - 0.5), 0.012, rowZ(Math.floor(i / ACROSS)) - SL * 0.55); R.scene.add(d);
  }

  /* the reported count, one lit tractor per stall along the nearest row, noses out to the aisle */
  const base = F.truck(THREE, TXT, K, M, { trailer: false, lit: false, seed: 3 });
  for (let i = 0; i < NOW; i++) {
    const tr = i === 0 ? base : base.clone(true);
    tr.position.set(-width / 2 + (i % ACROSS + 0.5) * SW, 0, rowZ(Math.floor(i / ACROSS)) - SL / 2); TXT.add(R, tr); TXT.contact(R, tr);
  }
  /* yard masts down the aisles, their heads lit, a warm pool under each */
  for (const r of [2]) for (const x of [-width / 2 - 5, width / 2 + 5]) {
    const l = K.make('streetlight', { height: 15, seed: r }); l.position.set(x, 0, rowZ(r) + AISLE / 2); l.rotation.y = x < 0 ? Math.PI / 2 : -Math.PI / 2; TXT.add(R, l);
    const pl = new THREE.PointLight(0xffc98a, 900, 60, 2); pl.position.set(x + (x < 0 ? 2.2 : -2.2), 14.6, rowZ(r) + AISLE / 2); R.scene.add(pl);
  }
  TXT.weather(R, {});
  const cx = F.develop(await TXT.snapshot(R), gl);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
