<!doctype html>
<!-- 2026-09-26, frame 1 of 9. Archetype FULL_BLEED. RENDERED through txthree.js in the deck's
     declared blueHour world. THE COVER. A white Class 8 rig in the right lane of a concrete I-45,
     coming toward a low camera on the shoulder, the dark windshield mirroring the sky. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#151D33; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; font-family:"Fraunces", serif; font-weight:800; line-height:0.94;
          letter-spacing:-0.008em; color:#F3F1EC; font-variation-settings:"opsz" 144; z-index:10;
          text-shadow:0 2px 18px rgba(8,12,24,0.4); }
  .dek  { position:absolute; font-size:30px; line-height:1.40; color:#E3E7EE; z-index:10;
          text-shadow:0 0 5px rgba(8,12,24,0.8), 0 1px 14px rgba(8,12,24,0.6); }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#C8D1DC;
             white-space:nowrap; z-index:20; }
  .kick, .count, .src, .tx-site { text-shadow:0 0 5px rgba(8,12,24,0.85), 0 1px 14px rgba(8,12,24,0.6); }
  .hook { left:80px; top:150px; width:900px; } .dek { left:82px; width:900px; font-size:30px; }
  .haze { position:absolute; left:0; top:0; width:1080px; height:620px; z-index:5; background:linear-gradient(180deg, rgba(10,14,28,0.5) 0%, rgba(10,14,28,0.42) 70%, rgba(10,14,28,0) 100%); }
  .floor { position:absolute; left:0; bottom:0; width:1080px; height:220px; z-index:5; background:linear-gradient(0deg, rgba(10,14,28,0.5) 0%, rgba(10,14,28,0.4) 55%, rgba(10,14,28,0) 100%); }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Nobody at the wheel</h1>
<p class="dek" data-follow="28">Kodiak plans unsupervised driverless service on the Dallas to Houston lane by the end of 2026. Aurora said investor day guests could ride part of its route with nobody behind the wheel.</p>
<div class="haze" data-decorative></div><div class="floor" data-decorative></div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-26-fortyfive.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "Interstate 45, Dallas to Houston", counter: "01 / 09", src: "c22 c25 c28   ILLUSTRATIVE", ink: '#C8D1DC' });
  TX.fitText(document.getElementById("hook"), { min: 96, max: 132, maxLines: 2 });
  FORTYFIVE.follow();
  const TXT = init(THREE), K = initKit(THREE, TXT), F = FORTYFIVE, gl = F.glCanvas();
  const W = TXT.deckWorld(), M = F.mats(TXT, THREE);
  const R = TXT.setup(gl, { w: 1080, h: 1350, fog: [W.haze, W.fogDensity], exposure: W.exposure, tone: W.tone, fov: 28 });

  /* THE ROAD. The kit's divided highway along z, concrete, the southbound carriageway on -x (a truck
   * heading +z drives on its right). Right lane centre at -(median/2 + inside shoulder + 1.5 lanes). */
  const ROAD_Y = 0.62, LANE_R = -(0.45 + 1.2 + 3.66 * 1.5);
  const hw = K.make('highway', { length: 900, lanes: 2, surface: 'concrete', gantry: false, embank: 0.6, seed: 4 });
  hw.position.set(0, 0, -300); TXT.add(R, hw);

  /* camera on the shoulder embankment, ahead of the truck, looking back up the lane at the cab,
   * level enough that the horizon sits near a third and the fencerow reads against the sky */
  TXT.frame(R, { from: [LANE_R - 4.2, ROAD_Y + 3.0, 20], look: [LANE_R + 2.2, ROAD_Y + 3.7, -6] });
  TXT.sky(R);
  TXT.deckRig(R, W.rig, { target: [LANE_R, 0, 0], distance: 90, shadowFar: 260 });
  TXT.ground(R, { surface: 'grass', size: 12000, seed: 9 });

  const t = F.truck(THREE, TXT, K, M, { lit: true, seed: 3 });
  t.position.set(LANE_R, ROAD_Y, -t.userData.front + 0.5);
  TXT.add(R, t); TXT.contact(R, t, { y: ROAD_Y + 0.01 });

  /* a second rig far back in the left lane, lamps only, so the road is a road with traffic on it */
  const t2 = F.truck(THREE, TXT, K, M, { lit: true, seed: 6, lidar: false, color: 0x2a3440 });
  t2.position.set(LANE_R + 3.66, ROAD_Y, -150); TXT.add(R, t2);

  /* the right of way: a fencerow of cedar elm beyond the far verge, off the type */
  for (let i = 0; i < 9; i++) {
    const tr = K.make('cedar_elm', { seed: 20 + i, height: 9 + (i % 3) * 2 });
    tr.position.set(19 + (i % 2) * 7, 0, -75 - i * 26); TXT.add(R, tr); TXT.contact(R, tr);
  }
  TXT.scatter(R, { kind: 'grass', count: 9000, area: [13.5, -260, 60, 30], seed: 5, scale: [0.2, 0.6] });
  /* high-mast lamps down the median, their heads just lit at the turn of the hour */
  for (let i = 0; i < 5; i++) {
    const z = -120 - i * 70, l = K.make('streetlight', { height: 12, reach: 3.2, seed: 40 + i });
    l.position.set(0, ROAD_Y, z); l.rotation.y = -Math.PI / 2; TXT.add(R, l);
    const pl = new THREE.PointLight(0xffd3a0, 260, 30, 2); pl.position.set(-3.0, ROAD_Y + 11.6, z); R.scene.add(pl);
  }
  TXT.weather(R, {});
  const cx = F.develop(await TXT.snapshot(R), gl);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
