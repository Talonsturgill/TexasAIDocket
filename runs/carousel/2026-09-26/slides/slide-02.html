<!doctype html>
<!-- 2026-09-26, frame 2 of 9. Archetype MAP. Drawn on the canvas from assets/geo through TXGeo, the
     one frame that is not rendered. THE LANE. Texas's counties in the Albers projection, Dallas County
     and Harris County lit, a straight dashed line between them that is not the road, and a scale bar
     at Kodiak's own 219 miles computed through the projection. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#151D33; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; font-family:"Fraunces", serif; font-weight:800; line-height:0.94;
          letter-spacing:-0.008em; color:#F3F1EC; font-variation-settings:"opsz" 144; z-index:10;
          text-shadow:0 2px 18px rgba(8,12,24,0.4); }
  .dek  { position:absolute; font-size:30px; line-height:1.40; color:#E3E7EE; z-index:10;
          text-shadow:0 0 5px rgba(8,12,24,0.8), 0 1px 14px rgba(8,12,24,0.6); }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#C8D1DC;
             white-space:nowrap; z-index:20; }
  .kick, .count, .src, .tx-site { text-shadow:0 0 5px rgba(8,12,24,0.85), 0 1px 14px rgba(8,12,24,0.6); }
  .hook { left:80px; top:150px; width:900px; } .dek { left:82px; width:840px; font-size:30px; }
  svg#map { position:absolute; left:0; top:0; width:1080px; height:1350px; z-index:12; overflow:visible; }
  .lab { font-family:"JetBrains Mono", monospace; font-size:24px; letter-spacing:0.05em; fill:#E3E7EE; stroke:#101726; stroke-width:6px; paint-order:stroke; stroke-linejoin:round; }
  .haze { position:absolute; left:0; top:0; width:1080px; height:620px; z-index:5; background:linear-gradient(180deg, rgba(10,14,28,0.5) 0%, rgba(10,14,28,0.42) 70%, rgba(10,14,28,0) 100%); }
  .floor { position:absolute; left:0; bottom:0; width:1080px; height:220px; z-index:5; background:linear-gradient(0deg, rgba(10,14,28,0.5) 0%, rgba(10,14,28,0.4) 55%, rgba(10,14,28,0) 100%); }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">219 miles, Kodiak says</h1>
<p class="dek" data-follow="28">That is Kodiak's figure for the lane from its Lancaster hub to Houston. Waabi, which hauls the same corridor, calls it roughly 240.</p>
<div class="haze" data-decorative></div><div class="floor" data-decorative></div>
<svg id="map" viewBox="0 0 1080 1350"></svg>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-26-fortyfive.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script src="@@ASSETS@@/js/d3.v7.min.js"></script>
<script src="@@ASSETS@@/js/topojson-client.min.js"></script>
<script src="@@ASSETS@@/js/txgeo.js"></script>
<script>
const FIG = {"kodiak_lane_miles": {"value": 219, "from": ["c25"], "basis": "Kodiak's own figure"}, "geometry": {"_note": "metres for the renderer, never printed", "mile_m": 1609.344}};
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "The lane", counter: "02 / 09", src: "c23 c25 c33", ink: '#C8D1DC' });
  TX.fitText(document.getElementById("hook"), { min: 96, max: 132, maxLines: 1 });
  FORTYFIVE.follow();
  /* XMLHttpRequest rather than fetch: a file:// fetch is refused by this renderer, and XHR is not */
  const topo = await new Promise((ok, bad) => { const x = new XMLHttpRequest(); x.open("GET", "@@ASSETS@@/geo/tx-counties.topo.json"); x.onload = () => ok(JSON.parse(x.responseText)); x.onerror = bad; x.send(); });
  const counties = TXGeo.counties(topo), state = TXGeo.outline(topo);
  const proj = TXGeo.texasProjection(state, [[60, 420], [1020, 1300]]);
  /* the east half large: the corridor's midpoint put below the type at 1.75x */
  TXGeo.zoomTo(proj, state, [-96.3, 31.1], [640, 900], 1.8);
  const path = d3.geoPath(proj);

  const cv = document.getElementById("art"), cx = cv.getContext("2d");
  cx.scale(2, 2);
  /* the ground: the deck's night blue, lifted toward the Gulf where the lane ends */
  const bg = cx.createLinearGradient(0, 0, 0, 1350);
  bg.addColorStop(0, "#121A2E"); bg.addColorStop(1, "#1C2742");
  cx.fillStyle = bg; cx.fillRect(0, 0, 1080, 1350);
  /* the map lives under the type: everything above the dek's foot stays the plain ground */
  cx.save(); cx.beginPath(); cx.rect(0, 440, 1080, 910); cx.clip();
  const lit = new Set(["Dallas", "Harris"]);
  const p2d = d3.geoPath(proj, cx);
  /* counties, a slate fill shaded by a raking light from the lamp's side (the north west), so the
   * state reads as a surface: each county a step lighter the further north west its centroid */
  counties.features.forEach((f) => {
    const c = proj(d3.geoCentroid(f)); if (!c) return;
    const k = Math.max(0, Math.min(1, (1350 - c[1]) / 1350 * 0.6 + (1080 - c[0]) / 1080 * 0.4));
    const name = (f.properties && (f.properties.name || f.properties.NAME)) || "";
    cx.beginPath(); p2d(f);
    cx.fillStyle = lit.has(name) ? "#8FA9CC" : d3.interpolateRgb("#232E47", "#33405E")(k);
    cx.fill();
  });
  cx.beginPath(); p2d(TXGeo.borders(topo)); cx.strokeStyle = "rgba(200,209,220,0.42)"; cx.lineWidth = 1.2; cx.stroke();
  cx.beginPath(); p2d(state); cx.strokeStyle = "rgba(220,226,234,0.7)"; cx.lineWidth = 1.6; cx.stroke();

  /* the two ends, at their counties' centroids, and a straight dashed line between them */
  const cf = (n) => counties.features.find((f) => ((f.properties && (f.properties.name || f.properties.NAME)) || "") === n);
  const A = proj(d3.geoCentroid(cf("Dallas"))), B = proj(d3.geoCentroid(cf("Harris")));
  cx.setLineDash([10, 9]); cx.strokeStyle = "#E3E7EE"; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(A[0], A[1]); cx.lineTo(B[0], B[1]); cx.stroke(); cx.setLineDash([]);
  [A, B].forEach((p) => { cx.beginPath(); cx.arc(p[0], p[1], 7, 0, Math.PI * 2); cx.fillStyle = "#F3F1EC"; cx.fill(); });

  cx.restore();
  /* THE SCALE BAR, Kodiak's miles converted to a great circle angle and projected along the
   * meridian at the corridor's own latitude, so its length is the projection's, never typed */
  const miles = FIG.kodiak_lane_miles.value, metres = miles * FIG.geometry.mile_m;
  const ang = metres / 6371008.8 * 180 / Math.PI;
  const lon = -95.2, lat = 31.3;
  const p0 = proj([lon, lat + ang / 2]), p1 = proj([lon, lat - ang / 2]);
  const len = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
  const bx = 82, by = 1150;
  cx.fillStyle = "#C8D1DC"; cx.fillRect(bx, by - 5, len, 10);
  cx.fillRect(bx, by - 16, 2, 32); cx.fillRect(bx + len - 2, by - 16, 2, 32);

  TXDECK.finish(cx);

  const svg = document.getElementById('map'), NS = 'http://www.w3.org/2000/svg';
  const txt = (x, y, s, anchor) => { const e = document.createElementNS(NS, 'text'); e.setAttribute('class', 'lab'); e.setAttribute('x', x); e.setAttribute('y', y); if (anchor) e.setAttribute('text-anchor', anchor); e.textContent = s; svg.appendChild(e); return e; };
  txt(A[0] + 30, A[1] - 22, 'DALLAS COUNTY');
  txt(B[0] - 44, B[1] + 8, 'HARRIS COUNTY', 'end');
  txt(bx, by + 40, miles + ' MILES, KODIAK');
  txt((A[0] + B[0]) / 2 - 22, (A[1] + B[1]) / 2, 'STRAIGHT LINE', 'end');
  txt((A[0] + B[0]) / 2 - 22, (A[1] + B[1]) / 2 + 30, 'NOT THE ROAD', 'end');
  return true;
})();
</script>
</body>
</html>
