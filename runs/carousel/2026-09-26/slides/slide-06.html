<!doctype html>
<!-- 2026-09-26, frame 6 of 9. Archetype DOCUMENT. RENDERED through txthree.js in the deck's
     declared blueHour world, inside the chassis cab set. THE PERMISSION. A letter sheet lying on the
     empty driver's seat, six ruled rows and six ticks, the recording device row's tick in the accent. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#151D33; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; font-family:"Fraunces", serif; font-weight:800; line-height:0.94;
          letter-spacing:-0.008em; color:#F3F1EC; font-variation-settings:"opsz" 144; z-index:10;
          text-shadow:0 2px 18px rgba(8,12,24,0.4); }
  .dek  { position:absolute; font-size:30px; line-height:1.40; color:#E3E7EE; z-index:10;
          text-shadow:0 0 5px rgba(8,12,24,0.8), 0 1px 14px rgba(8,12,24,0.6); }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#C8D1DC;
             white-space:nowrap; z-index:20; }
  .kick, .count, .src, .tx-site { text-shadow:0 0 5px rgba(8,12,24,0.85), 0 1px 14px rgba(8,12,24,0.6); }
  .hook { left:80px; top:150px; width:900px; } .dek { left:82px; width:800px; font-size:30px; }
  .haze { position:absolute; left:0; top:0; width:1080px; height:600px; z-index:5; background:linear-gradient(180deg, rgba(10,14,28,0.5) 0%, rgba(10,14,28,0.42) 70%, rgba(10,14,28,0) 100%); }
  .floor { position:absolute; left:0; bottom:0; width:1080px; height:220px; z-index:5; background:linear-gradient(0deg, rgba(10,14,28,0.5) 0%, rgba(10,14,28,0.4) 55%, rgba(10,14,28,0) 100%); }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Six statements and no fee</h1>
<p class="dek" data-follow="28">Since May 28th a company running vehicles with no driver needs a state authorization. The company acknowledges six statements and pays nothing. The authorization does not expire.</p>
<div class="haze" data-decorative></div><div class="floor" data-decorative></div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-26-fortyfive.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
const FIG = {"acknowledgements": {"value": 6, "word": "six", "from": ["c5", "c6", "c7", "c8", "c9", "c10"], "basis": "count of the numbered list the applicant acknowledges, one claim per item"}};
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "The permission", counter: "06 / 09", src: "c1 c5 to c10 c12   ILLUSTRATIVE", ink: '#C8D1DC' });
  TX.fitText(document.getElementById("hook"), { min: 88, max: 120, maxLines: 2 });
  FORTYFIVE.follow();
  const TXT = init(THREE), K = initKit(THREE, TXT), F = FORTYFIVE, gl = F.glCanvas();
  const W = TXT.deckWorld(), M = F.mats(TXT, THREE);
  const R = TXT.setup(gl, { w: 1080, h: 1350, fog: [W.haze, W.fogDensity], exposure: W.exposure + 0.65, tone: W.tone, fov: 40 });

  const ROAD_Y = 0.62, LANE = 0.45 + 1.2 + 3.66 * 1.5, FLOOR = ROAD_Y + 1.25;
  const hw = K.make('highway', { length: 700, lanes: 2, surface: 'concrete', gantry: false, embank: 0.6, seed: 4 });
  hw.position.set(0, 0, -200); TXT.add(R, hw);
  const cab = F.cab(THREE, TXT, K, M, { dome: 6.5, domeColor: 0xfff0dc });
  cab.position.set(LANE, FLOOR, 0); TXT.add(R, cab);
  const seat = cab.userData.seat;                       /* [x, y, z] of the driver's cushion, cab local */

  /* THE SHEET. US letter, 0.216 by 0.279 m, a slight curl, lying turned on the cushion. Its rows are
   * set by figures.json: one ruled row and one tick box per acknowledged statement, and no more. */
  const N = FIG.acknowledgements.value;
  const c = document.createElement('canvas'); c.width = 864; c.height = 1116;
  const g = c.getContext('2d');
  g.fillStyle = '#F2EEE6'; g.fillRect(0, 0, 864, 1116);
  g.fillStyle = '#2B2F36'; g.fillRect(70, 90, 724, 10);            /* the heavy rule under the head */
  const top = 150, rowH = 128;
  for (let i = 0; i < N; i++) {
    const y = top + i * rowH;
    g.strokeStyle = '#2B2F36'; g.lineWidth = 5; g.strokeRect(78, y + 28, 52, 52);   /* the tick box */
    g.fillStyle = '#8A8C92';                                                     /* the statement, unreadable, cool grey so the one tick is the only warm mark */
    g.fillRect(160, y + 34, 560 - (i % 3) * 70, 14); g.fillRect(160, y + 62, 380 + (i % 2) * 120, 14);
    g.fillStyle = 'rgba(43,47,54,0.35)'; g.fillRect(70, y + rowH - 4, 724, 3);   /* hairline between rows */
  }
  g.fillStyle = '#2B2F36'; g.fillRect(70, top + N * rowH + 16, 724, 8);           /* the heavy rule after the six */
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const geo = new THREE.PlaneGeometry(0.216, 0.279, 12, 16);
  const pos = geo.attributes.position;
  for (let j = 0; j < pos.count; j++) { const x = pos.getX(j), y = pos.getY(j); pos.setZ(j, 0.006 * Math.pow((y + 0.1395) / 0.279, 2) + 0.003 * Math.abs(x) / 0.108); }
  geo.computeVertexNormals();
  const sheet = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0, side: THREE.DoubleSide }));
  const A = 0.18 + Math.PI;
  sheet.rotation.set(-Math.PI / 2, 0, A);
  const sx = LANE + seat[0] - 0.02, sy = FLOOR + 0.59, sz = seat[2] + 0.02;
  sheet.position.set(sx, sy, sz); sheet.castShadow = true; sheet.receiveShadow = true; R.scene.add(sheet);

  /* the ticks, extruded marks sitting in the boxes, the recording device row (2) in the accent */
  const tickShape = [[0, 0.010], [0.006, 0.003], [0.018, 0.016], [0.015, 0.019], [0.006, 0.009], [0.003, 0.013]];   /* a check: short arm down, long arm up */
  const ink = TXT.mat.clay(0x22262c, { roughness: 0.6 });
  const accentInk = new THREE.MeshBasicMaterial({ color: F.ACCENT, toneMapped: false });
  for (let i = 0; i < N; i++) {
    const mk = TXT.extrude(tickShape, 0.0012, i === 1 ? accentInk : ink, { bevel: false });
    if (i === 1) mk.scale.set(4.8, 4.8, 1);   /* the recording device row, ticked large in the one accent */
    const u = (78 + 26) / 864 * 0.216 - 0.108, v = 0.1395 - (top + i * rowH + 54) / 1116 * 0.279;
    const lx = u, lz = -v;                                                         /* sheet local, after the -90 degree tilt */
    const cs = Math.cos(A), sn = Math.sin(A);
    mk.rotation.set(-Math.PI / 2, 0, A);
    const ccx = 0.008, ccy = 0.009;                                              /* the mark's own centre */
    mk.position.set(sx + lx * cs + lz * sn - (ccx * cs - ccy * sn), sy + 0.009, sz - lx * sn + lz * cs + (ccx * sn + ccy * cs));
    R.scene.add(mk);
  }

  /* from under the roof between the wheel and the seat, looking down onto the cushion */
  TXT.frame(R, { from: [LANE + seat[0] - 0.22, FLOOR + 1.78, seat[2] - 0.2], look: [sx + 0.03, sy + 0.14, sz + 0.1] });
  TXT.sky(R);
  TXT.deckRig(R, W.rig, { target: [LANE, 0, 0], distance: 60, shadowFar: 120 });
  TXT.ground(R, { surface: 'grass', size: 12000, seed: 9 });
  TXT.weather(R, { skip: [cab] });
  const cx = F.develop(await TXT.snapshot(R), gl);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
