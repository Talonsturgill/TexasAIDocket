<!doctype html>
<!-- 2026-09-26, frame 9 of 9. Archetype SPLIT_HORIZON. RENDERED through txthree.js in the deck's
     declared blueHour world. THE WAY IN. A Texan at an overpass rail over I-45, the rig passing south
     beneath toward Houston's glow; below the cut, the authorization's run from May 28th to today as a
     bar, then a hairline, because it does not expire. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#151D33; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; font-family:"Fraunces", serif; font-weight:800; line-height:0.94;
          letter-spacing:-0.008em; color:#F3F1EC; font-variation-settings:"opsz" 144; z-index:10;
          text-shadow:0 2px 18px rgba(8,12,24,0.4); }
  .dek  { position:absolute; font-size:30px; line-height:1.40; color:#E3E7EE; z-index:10;
          text-shadow:0 0 5px rgba(8,12,24,0.8), 0 1px 14px rgba(8,12,24,0.6); }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#C8D1DC;
             white-space:nowrap; z-index:20; }
  .kick, .count, .src, .tx-site { text-shadow:0 0 5px rgba(8,12,24,0.85), 0 1px 14px rgba(8,12,24,0.6); }
  .hook { left:80px; top:936px; width:920px; } .dek { left:82px; width:760px; font-size:26px; line-height:1.36; }
  svg#bar { position:absolute; left:0; top:0; width:1080px; height:1350px; z-index:12; overflow:visible; }
  .lab { font-family:"JetBrains Mono", monospace; font-size:24px; letter-spacing:0.05em; fill:#E3E7EE; stroke:#101726; stroke-width:6px; paint-order:stroke; stroke-linejoin:round; }
  .haze { position:absolute; left:0; top:0; width:1080px; height:200px; z-index:5; background:linear-gradient(180deg, rgba(10,14,28,0.45) 0%, rgba(10,14,28,0) 100%); }
  .floor { position:absolute; left:0; bottom:0; width:1080px; height:600px; z-index:5; background:linear-gradient(0deg, rgba(10,14,28,0.54) 0%, rgba(10,14,28,0.5) 70%, rgba(10,14,28,0) 100%); }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Where to report one</h1>
<p class="dek" data-follow="18">A concern about a driverless vehicle that could cause serious bodily injury or death can be sent for review to the TxDMV Enforcement Division at txmccs.txdmv.gov/truckstop where law enforcement can also verify authorizations.</p>
<div class="haze" data-decorative></div><div class="floor" data-decorative></div>
<svg id="bar" viewBox="0 0 1080 1350"></svg>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-26-fortyfive.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
const FIG = {"days_enforceable_to_run": {"value": 121, "from": ["c1"], "basis": "May 28th, 2026 to the run date September 26th, 2026"}, "enforceable": {"iso": "2026-05-28", "from": ["c1"]}};
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "If you see one", counter: "09 / 09", src: "c1 c12 c36 c37", ink: '#C8D1DC' });
  TX.fitText(document.getElementById("hook"), { min: 80, max: 90, maxLines: 1 });
  FORTYFIVE.follow();
  const TXT = init(THREE), K = initKit(THREE, TXT), F = FORTYFIVE, gl = F.glCanvas();
  const W = TXT.deckWorld(), M = F.mats(TXT, THREE);
  const R = TXT.setup(gl, { w: 1080, h: 1350, fog: [W.haze, W.fogDensity], exposure: W.exposure - 0.45, tone: W.tone, fov: 38 });

  /* THE OVERPASS. The kit highway's crossing bridge sits at z = length * 0.2; its deck top is the
   * embankment plus 5.2 m of clearance, a 1.4 m girder and the slab. The southbound carriageway is
   * -x, so the Texan stands over it at the south parapet, facing south, and the rig runs away +z. */
  const LEN = 700, E = 0.6, OZ = LEN * 0.2 - 200, DECK = E + 5.2 + 1.4 + 0.22, ROAD_Y = 0.62;
  const hw = K.make('highway', { length: LEN, lanes: 2, surface: 'concrete', gantry: false, overpass: true, embank: E, seed: 4 });
  hw.position.set(0, 0, -200); TXT.add(R, hw);
  /* the lanes run on south past the city, so the road does not end at the skyline */
  const hw2 = K.make('highway', { length: 1600, lanes: 2, surface: 'concrete', gantry: false, embank: E, seed: 5 });
  hw2.position.set(0, 0, -200 + LEN / 2 + 800); TXT.add(R, hw2);
  const px = -5.2, pz = OZ + 5.7;
  const cam = [px + 0.72, DECK + 1.82, pz - 3.4];
  TXT.frame(R, { from: cam, look: [px + 2.2, cam[1] - 7.9, pz + 70] });
  TXT.sky(R);
  TXT.deckRig(R, W.rig, { target: [px, DECK, pz], distance: 80, shadowFar: 200 });
  TXT.ground(R, { surface: 'grass', size: 12000, seed: 9 });

  const who = K.make('person', { seed: 11, role: 'resident', pose: 'stand', hat: 'none', shirt: 0x2a2622, trousers: 0x1c1d22 });   /* dark against the city glow, a figure rather than a costume */
  who.position.set(px, DECK, pz); TXT.add(R, who); TXT.contact(R, who, { y: DECK + 0.01 });

  const LANE_R = -(0.45 + 1.2 + 3.66 * 1.5);
  M.tailLamp.emissiveIntensity = 7;   /* the rig's two tail lamps bloom at feed size, the frame's focal */
  const t = F.truck(THREE, TXT, K, M, { lit: true, seed: 3 });
  t.position.set(LANE_R, ROAD_Y, pz + 62); TXT.add(R, t); TXT.contact(R, t, { y: ROAD_Y + 0.01 });
  const t2 = F.truck(THREE, TXT, K, M, { lit: false, seed: 9, lidar: false, color: 0x303844 });   /* dark, so the rig's tail lamps are the only warm points below the horizon */
  t2.position.set(-LANE_R, ROAD_Y, pz + 120); t2.rotation.y = Math.PI; TXT.add(R, t2);

  /* Houston's glow on the south horizon, inside the far plane. The skyline is scaled to the size a
   * city many miles off subtends, since the far plane sits well short of the real distance */
  const city = K.make('city_skyline', { city: 'houston', dusk: true, lit: true, seed: 2 });
  city.scale.setScalar(0.12); city.position.set(-40, 0, pz + 430); city.rotation.y = Math.PI; TXT.add(R, city);
  for (let i = 0; i < 6; i++) { const l = K.make('streetlight', { height: 12, seed: i }); l.position.set(-13.2, 0, pz + 30 + i * 55); l.rotation.y = Math.PI / 2; TXT.add(R, l); }
  TXT.weather(R, {});
  const cx = F.develop(await TXT.snapshot(R), gl);
  TXDECK.finish(cx);

  /* THE BAR. The authorization's run at one scale, 4 px a day with a tick each week, from May 28th
   * to the run date; then a hairline to the edge, because it runs until revoked. */
  const svg = document.getElementById('bar'), NS = 'http://www.w3.org/2000/svg';
  const PXD = 4, X0 = 82, Y = 862, days = FIG.days_enforceable_to_run.value, X1 = X0 + days * PXD;
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  el('rect', { x: X0, y: Y - 7, width: X1 - X0, height: 14, fill: '#C8D1DC' });
  for (let d = 7; d < days; d += 7) el('rect', { x: X0 + d * PXD - 0.75, y: Y - 7, width: 1.5, height: 14, fill: '#151D33' });
  el('rect', { x: X1, y: Y - 1, width: 1080 - X1, height: 2, fill: '#C8D1DC' });
  el('rect', { x: X0 - 1, y: Y - 20, width: 2, height: 40, fill: '#E3E7EE' });
  el('rect', { x: X1 - 1, y: Y - 20, width: 2, height: 40, fill: '#E3E7EE' });
  const t1 = el('text', { class: 'lab', x: X0, y: Y - 32 }); t1.textContent = 'MAY 28TH';
  const t3 = el('text', { class: 'lab', x: X1, y: Y - 32, 'text-anchor': 'middle' }); t3.textContent = 'TODAY';
  const t4 = el('text', { class: 'lab', x: 825, y: Y + 50, 'text-anchor': 'end' }); t4.textContent = 'UNTIL REVOKED';
  const t5 = el('text', { class: 'lab', x: X0 + 10, y: Y + 50 }); t5.textContent = 'A TICK A WEEK';
  return true;
})();
</script>
</body>
</html>
