<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#1A1714}
  canvas#art{position:absolute;inset:0;width:1080px;height:1350px;display:block}
  .wrap{position:absolute;inset:0;width:1080px;height:1350px}
  .tscrim{position:absolute;left:0;top:0;width:1080px;height:280px;
    background:linear-gradient(to bottom,rgba(26,23,20,.95) 0%,rgba(26,23,20,.60) 60%,rgba(26,23,20,0) 100%)}
  .fscrim{position:absolute;left:0;bottom:0;width:1080px;height:330px;
    background:linear-gradient(to bottom,rgba(26,23,20,0) 0%,rgba(26,23,20,.66) 42%,rgba(26,23,20,.97) 100%)}
  .mast{position:absolute;top:86px;left:80px;font-family:"JetBrains Mono",monospace;
    font-weight:500;font-size:26px;letter-spacing:.16em;color:#A79878}
  h1{position:absolute;top:142px;left:80px;width:880px;margin:0;font-family:Fraunces,serif;
    font-weight:800;font-size:80px;line-height:1.05;color:#F0E2BC;letter-spacing:-.022em}
  .fig{position:absolute;top:250px;right:80px;font-family:"JetBrains Mono",monospace;
    font-weight:700;font-size:100px;letter-spacing:-.01em;color:#F4E8C6;text-shadow:0 3px 26px rgba(10,8,5,.98);
    font-variant-numeric:tabular-nums}
  .figlab{position:absolute;top:372px;right:80px;font-family:"JetBrains Mono",monospace;
    font-weight:500;font-size:24px;letter-spacing:.12em;color:#E8DBBE;text-align:right}
  .q{position:absolute;bottom:214px;left:80px;width:860px;margin:0;font-family:Manrope,sans-serif;
    font-weight:600;font-size:33px;line-height:1.28;color:#F0E2BC}
  .dek{position:absolute;bottom:136px;left:80px;width:860px;margin:0;font-family:Manrope,sans-serif;
    font-weight:500;font-size:26px;line-height:1.34;color:#C4B393}
  .foot{position:absolute;bottom:74px;left:80px;right:80px;display:flex;justify-content:space-between;
    gap:22px;white-space:nowrap;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
    letter-spacing:.05em;color:#8C8478;font-variant-numeric:tabular-nums}
</style></head>
<body>
<canvas id="art"></canvas>
<div class="wrap">
  <div class="tscrim" data-decorative></div>
  <div class="mast">TEXAS AI DOCKET</div>
  <h1>This door never closes.</h1>
  <div class="fig">$10,474</div>
  <div class="figlab">PER CHILD, THE 2026-27 SCHOOL YEAR</div>
  <div class="fscrim" data-decorative></div>
  <p class="q">"Applications are accepted on a rolling basis."</p>
  <p class="dek">The window opened December 9th, 2025 and no second date has been set against it.</p>
  <div class="foot"><span>THE PROGRAM PAGE</span><span>c6 c7 c8</span><span class="tx-site">texasaidocket.com</span><span>05 / 09</span></div>
</div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script>
window.renderReady = (async () => {
  const W=1080,H=1350;
  const c=document.getElementById('art'); c.width=W*2; c.height=H*2;
  const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260906); const R=TX.rng(20260906+5);

  const SOFFIT='#1A1714', FORMED='#4B473E', WALK='#C4B393', SUN_RETURN='#F0E2BC';

  g.fillStyle=SOFFIT; g.fillRect(0,0,W,H);

  // ---- the head of the opening at frame left, and the slab it lights ------------------------
  (function room(){
    g.fillStyle='#241F1A'; g.fillRect(0,240,W,H-240);
    // THE FIELD ITSELF, painted before the isolines that describe it. Illuminance falls with
    // distance from the opening at frame left, so the slab nearest it is the frame's lightest
    // area and the far corner is nearly out of the light. Without this the contours are four
    // hairlines on a flat ground and the declared focal is a region that does not exist.
    const img=g.getImageData(0,240,W*2,(H-240)*2);
    const OPX=-140, OPY=690;
    for (let py=0; py<img.height; py++){
      const y=240+py/2;
      for (let px=0; px<img.width; px++){
        const x=px/2;
        const dx=x-OPX, dy=(y-OPY)*1.9;
        const d=Math.hypot(dx,dy)+90;
        let E=46000/(d*d)*(0.42+0.58*Math.max(0,dx)/W);
        let t=Math.min(1, Math.max(0, (E-0.0016)/0.115));
        t=Math.pow(t,1.55);
        const i=(py*img.width+px)*4;
        img.data[i]   = Math.round(30 + t*218);
        img.data[i+1] = Math.round(26 + t*202);
        img.data[i+2] = Math.round(22 + t*164);
        img.data[i+3] = 255;
      }
    }
    g.putImageData(img,0,480);
    g.fillStyle='#141110'; g.fillRect(0,240,W,60);      // the head's underside, the frame's dark
  })();

  // ---- THE ISOLUX PLOT. Light that never meets a closing line, which is what a rolling window
  //      IS. The bands run out of the frame at right and NOT ONE OF THEM CLOSES. The frame
  //      asserts both facts rather than leaving them to a reader's charity.
  const OPEN = { x: -140, y: 690 };        // the opening's own position, off frame left
  const LEVELS = 10;
  let minGap = 1e9, closedCount = 0;
  (function isolux(){
    // Illuminance falls with distance from the opening and with the cosine of the incidence.
    // A level set of that field is an open curve because the field has no closed contour
    // inside the frame, which is the property the claim needs.
    const E = (x,y) => {
      const dx = x - OPEN.x, dy = y - OPEN.y;
      const d = Math.hypot(dx, dy*1.9) + 90;
      return 46000 / (d*d) * (0.42 + 0.58*Math.max(0, dx)/W);
    };
    const eAt = [];
    for (let i=0;i<LEVELS;i++) eAt.push(0.0016 * Math.pow(1.62, i));
    let prevXs = null;
    for (let i=LEVELS-1;i>=0;i--){
      const target = eAt[i];
      const pts = [];
      for (let y=300; y<=H; y+=8){
        // one root per scanline, found by bisection along x. One root means an OPEN curve.
        let lo=-200, hi=W+400, roots=0;
        if ((E(lo,y)-target) * (E(hi,y)-target) > 0) continue;
        for (let k=0;k<28;k++){ const mid=(lo+hi)/2;
          if ((E(lo,y)-target)*(E(mid,y)-target) <= 0) hi=mid; else lo=mid; }
        pts.push([ (lo+hi)/2, y ]);
      }
      if (pts.length < 3) continue;
      // a curve that returns to its own start would be closed. None of these does, and the
      // frame counts them rather than trusting the maths.
      const first=pts[0], last=pts[pts.length-1];
      if (Math.hypot(first[0]-last[0], first[1]-last[1]) < 24) closedCount++;
      if (prevXs){
        for (let j=0;j<Math.min(pts.length,prevXs.length);j++){
          const gap = Math.abs(pts[j][0] - prevXs[j][0]);
          if (gap > 0.5) minGap = Math.min(minGap, gap);
        }
      }
      prevXs = pts;
      const t = i/(LEVELS-1);
      g.strokeStyle = 'rgba(255,246,220,'+(0.14 + 0.50*(1-t))+')';
      g.lineWidth = 1.8 + 4.6*(1-t);
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (const [x,y] of pts) g.lineTo(x,y);
      g.stroke();
      // the band between this contour and the last, filled, so the plot has value and not lines
      g.fillStyle='rgba(240,226,188,'+(0.018*(1-t))+')';
      g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
      for (const [x,y] of pts) g.lineTo(x,y);
      g.lineTo(-220,H); g.lineTo(-220,300); g.closePath(); g.fill();
    }
  })();

  // ---- the threshold nosing and its cast, which is what the bottom band is planned around ---
  (function threshold(){
    g.fillStyle='rgba(74,53,32,0.94)'; g.fillRect(0,1052,W,26);
    g.fillStyle='rgba(250,238,206,0.44)'; g.fillRect(0,1048,W,4);
    const cast=g.createLinearGradient(0,1078,0,1192);
    cast.addColorStop(0,'rgba(14,11,8,0.62)'); cast.addColorStop(1,'rgba(14,11,8,0)');
    g.fillStyle=cast; g.fillRect(0,1078,W,114);
    for(let i=0;i<2400;i++){                       // the near slab, aggregate in shade
      const x=R()*W, y=1084+R()*190;
      g.globalAlpha=0.05+R()*0.10;
      g.fillStyle= R()<0.35 ? '#C4B393' : '#241F19';
      g.beginPath(); g.arc(x,y,0.6+R()*2.1,0,Math.PI*2); g.fill();
    }
    g.globalAlpha=1;
  })();



  // ---- WORKED GROUND. panel_ready measures the quietest patch of every ground a dossier calls
  // worked, and a smooth gradient fails it however well lit it is. This is the material.
  (function grit(){
    for (let i=0;i<130000;i++){
      const x=R()*W, y=R()*H;
      g.globalAlpha=0.075+R()*0.150;
      g.fillStyle = R()<0.5 ? '#FFF4D8' : '#0C0906';
      g.fillRect(x,y,1,1);
    }
    for (let i=0;i<26000;i++){                // a coarser aggregate over the fine tooth
      const x=R()*W, y=R()*H;
      g.globalAlpha=0.060+R()*0.130;
      g.fillStyle = R()<0.45 ? '#E8D8B0' : '#171310';
      g.fillRect(x,y,1+R()*2.2,1+R()*1.6);
    }
    g.globalAlpha=1;
  })();

  // ---- THE RESERVE. qa.py failed six frames of this deck for a DRAWN RULE running through a
  // glyph band, which at feed width reads as a strikethrough. Every one of them was a real
  // edge in the art, a board seam or an arris or a threshold nosing, doing its job in the
  // wrong place. The engine names three defences and this is the third, a scrim that lifts the
  // floor under a whole text block. It is painted AFTER all art and BEFORE the DOM type.
  function reserve(x,y,w,h,hex,peak){
    const grd=g.createLinearGradient(0,y,0,y+h);
    grd.addColorStop(0,   hex+'00');
    grd.addColorStop(0.16, hex+peak);
    grd.addColorStop(0.84, hex+peak);
    grd.addColorStop(1,   hex+'00');
    g.fillStyle=grd; g.fillRect(x,y,w,h);
  }


  await (async function grain(){
    const img=new Image();
    await new Promise(r=>{img.onload=r;img.onerror=r;img.src=TX.grainTile(256,30,20260906);});
    g.globalAlpha=0.055; g.fillStyle=g.createPattern(img,'repeat');
    g.fillRect(0,0,W,H); g.globalAlpha=1;
  })();

  // ---- WHAT THIS FRAME ASSERTS ABOUT ITSELF, and the acceptance list names both numbers -----
  // the reserve is painted LAST, after the grain, or the grain lays edges back over
  // the type the reserve was put there to clear
  reserve(0, 1074, W, 280, '#1A1714', 'F2');
  reserve(430, 224, 580, 210, '#17130F', 'F0');

  window.__txProbe = {
    contours: LEVELS,
    closed_contours: closedCount,          // must be 0. A closed curve would be a shut door.
    min_contour_gap_px: Math.round(minGap*10)/10,   // must be 6 or more, or it moires at 432
    note: "no contour closes and the minimum spacing is asserted rather than eyeballed"
  };
  if (closedCount !== 0) throw new Error('a contour closed, which the claim says cannot happen');
  if (minGap < 6) throw new Error('contour spacing '+minGap.toFixed(1)+' px moires at feed size');
})();
</script>
</body></html>
