<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#F0E2BC}
  canvas#art{position:absolute;inset:0;width:1080px;height:1350px;display:block}
  .wrap{position:absolute;inset:0;width:1080px;height:1350px}
  /* THE DECK'S ONE INVERSION. This is the only frame whose type is dark ink on a light ground,
     and it is the only frame in the deck without a scrim anywhere on it. */
  .mast{position:absolute;top:86px;left:80px;font-family:"JetBrains Mono",monospace;
    font-weight:500;font-size:26px;letter-spacing:.16em;color:#CFC6B0}
  h1{position:absolute;top:952px;right:80px;width:660px;margin:0;font-family:Fraunces,serif;
    font-weight:800;font-size:86px;line-height:1.03;color:#231D14;letter-spacing:-.024em;
    text-align:right}
  .dek{position:absolute;top:1152px;right:80px;width:660px;margin:0;font-family:Manrope,sans-serif;
    font-weight:600;font-size:33px;line-height:1.30;color:#3B3225;text-align:right}
  .m{position:absolute;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:24px;
    letter-spacing:.02em;color:#241D13;white-space:nowrap}
  .foot{position:absolute;bottom:74px;left:80px;right:80px;display:flex;justify-content:space-between;
    gap:22px;white-space:nowrap;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
    letter-spacing:.05em;color:#6B6353;font-variant-numeric:tabular-nums}
</style></head>
<body>
<canvas id="art"></canvas>
<div class="wrap">
  <div class="mast">TEXAS AI DOCKET</div>
  <div class="m" style="top:482px;left:222px">Be accredited</div>
  <div class="m" style="top:592px;left:222px">Be a proven operator</div>
  <div class="m" style="top:702px;left:222px">Administer a nationally norm-referenced assessment.</div>
  <div class="m" style="top:812px;left:222px">Be located in Texas</div>
  <h1>The list stops at four.</h1>
  <p class="dek">None of the four is about the teaching.</p>
  <div class="foot"><span>PROGRAM PAGE</span><span>a1 c1 c2 c3 c4 c5</span><span class="tx-site">texasaidocket.com</span><span>06 / 09</span></div>
</div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script>
window.renderReady = (async () => {
  const W=1080,H=1350;
  const c=document.getElementById('art'); c.width=W*2; c.height=H*2;
  const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260906); const R=TX.rng(20260906+6);

  const FORMED='#4B473E', SUN_RETURN='#F0E2BC', SOFFIT='#1A1714';

  // ---- THE NORTHER FRONT. A hard horizontal value break with a soft gradient beneath it, cool
  //      above and blazing below. It is the overhang's own shadow, which is why the deck's most
  //      abstract idea is carried by the most literal thing in the frame. Deliberately NOT on
  //      the vertical centre, which is the named failure of this atmosphere.
  const BREAK = Math.round(H*0.31);      // 418, well off centre
  (function ground(){
    const above=g.createLinearGradient(0,0,0,BREAK);
    above.addColorStop(0,'#3E3A32'); above.addColorStop(1,'#575246');
    g.fillStyle=above; g.fillRect(0,0,W,BREAK);
    const below=g.createLinearGradient(0,BREAK,0,H);
    below.addColorStop(0,'#E2D2A8'); below.addColorStop(0.20,SUN_RETURN);
    below.addColorStop(0.78,'#F6EBCC'); below.addColorStop(1,'#E7D8B2');
    g.fillStyle=below; g.fillRect(0,BREAK,W,H-BREAK);
    // the soft gradient immediately beneath the hard edge, which is what makes it a front
    const soft=g.createLinearGradient(0,BREAK,0,BREAK+150);
    soft.addColorStop(0,'rgba(52,46,36,0.55)'); soft.addColorStop(1,'rgba(52,46,36,0)');
    g.fillStyle=soft; g.fillRect(0,BREAK,W,150);
    g.fillStyle='rgba(28,24,18,0.85)'; g.fillRect(0,BREAK-3,W,3);   // the hard edge itself
  })();

  // ---- BOARD FORMED CONCRETE. The lit run has to read as concrete rather than as blank paper,
  //      so the grain, the seams and the tie holes are all here and all of them cast.
  (function boardform(){
    for (let y=8; y<H; y+=54){                       // board seams, one per board
      const lit = y > BREAK;
      g.fillStyle = lit ? 'rgba(255,250,232,0.85)' : 'rgba(120,112,96,0.30)';
      g.fillRect(0,y,W,2);
      g.fillStyle = lit ? 'rgba(120,102,66,0.42)' : 'rgba(18,16,12,0.35)';
      g.fillRect(0,y+2,W,4);                          // the seam's own shadow, down and left
    }
    for (let i=0;i<26000;i++){                        // the board's raked grain
      const x=R()*W, y=R()*H, lit = y>BREAK;
      g.globalAlpha = lit ? 0.030+R()*0.055 : 0.020+R()*0.035;
      g.fillStyle = R()<0.5 ? (lit?'#FFF8E2':'#7C7462') : (lit?'#B8AA76':'#211E18');
      g.fillRect(x,y,1.2+R()*3.4,1);
    }
    g.globalAlpha=1;
    const ties=[[150,946],[150,1086],[150,1226],[300,1010],[300,1150],
                [150,610],[150,750],[300,600],[300,740],[300,880],
                [860,470],[940,610],[860,750],[940,890],[860,1030],[940,1170],
                [660,1226],[520,1170],[760,1090],[600,1010]];
    for (const [tx,ty] of ties){
      if (ty < BREAK) continue;
      g.fillStyle='#6B5F45'; g.beginPath(); g.arc(tx,ty,17,0,Math.PI*2); g.fill();
      g.fillStyle='#403829'; g.beginPath(); g.arc(tx,ty,12,0,Math.PI*2); g.fill();
      g.strokeStyle='rgba(255,250,232,0.92)'; g.lineWidth=3;   // the lit lip, sun side
      g.beginPath(); g.arc(tx,ty,17,Math.PI*1.30,Math.PI*2.14); g.stroke();
      g.fillStyle='rgba(96,84,58,0.62)';                        // its own cast, down and LEFT
      g.beginPath(); g.ellipse(tx-11,ty+9,18,9,0,0,Math.PI*2); g.fill();
    }
  })();

  // ---- THE FOUR MORTISES, and NOTHING BELOW THEM. The run stops. There is no fifth cut and no
  //      scribe line anywhere a fifth would have been set out from, which is the whole frame.
  const MORT_Y=[486,596,706,816];
  (function mortises(){
    for (const y of MORT_Y){
      // A NARROW SLOT, not a bar. It is a cut in a lit face, so it reads as depth rather than
      // as something painted over. Nothing on this frame is a black rectangle.
      const x=96, w=118, h=54;
      const floor=g.createLinearGradient(x,y,x,y+h);
      floor.addColorStop(0,'#2E2519'); floor.addColorStop(0.42,'#4A3E28'); floor.addColorStop(1,'#7A6A48');
      g.fillStyle=floor; g.fillRect(x,y,w,h);
      g.fillStyle='rgba(20,16,10,0.80)'; g.fillRect(x,y,w,14);          // the shadowed upper wall
      g.fillStyle='rgba(255,250,232,0.92)'; g.fillRect(x,y-4,w,4);      // sun on the cut arris
      g.fillStyle='rgba(180,158,110,0.70)'; g.fillRect(x,y+h,w,4);      // the lower lip, lit
      const side=g.createLinearGradient(x+w-22,0,x+w,0);
      side.addColorStop(0,'rgba(226,204,150,0)'); side.addColorStop(1,'rgba(240,222,170,0.62)');
      g.fillStyle=side; g.fillRect(x+w-22,y,22,h);
      // its own cast onto the lit concrete, down and left like every other shadow in the deck
      const cast=g.createLinearGradient(x,y+h,x-26,y+h+30);
      cast.addColorStop(0,'rgba(88,74,48,0.42)'); cast.addColorStop(1,'rgba(88,74,48,0)');
      g.fillStyle=cast; g.fillRect(x-26,y+h+4,w,26);
    }
  })();


  // ---- THE RESERVE. qa.py failed six frames of this deck for a DRAWN RULE running through a
  // glyph band, which at feed width reads as a strikethrough. Every one of them was a real
  // edge in the art, a board seam or an arris or a threshold nosing, doing its job in the
  // wrong place. The engine names three defences and this is the third, a scrim that lifts the
  // floor under a whole text block. It is painted AFTER all art and BEFORE the DOM type.
  function reserve(x,y,w,h,hex,peak){
    const grd=g.createLinearGradient(0,y,0,y+h);
    grd.addColorStop(0,   hex+'00');
    grd.addColorStop(0.16, hex+peak);
    grd.addColorStop(0.84, hex+peak);
    grd.addColorStop(1,   hex+'00');
    g.fillStyle=grd; g.fillRect(x,y,w,h);
  }


  await (async function grain(){
    const img=new Image();
    await new Promise(r=>{img.onload=r;img.onerror=r;img.src=TX.grainTile(256,30,20260906);});
    g.globalAlpha=0.028; g.fillStyle=g.createPattern(img,'repeat');
    g.fillRect(0,0,W,H); g.globalAlpha=1;
  })();

  // the reserve is painted LAST, after the grain, or the grain lays edges back over
  // the type the reserve was put there to clear
  reserve(208, 470, 600, 74, '#F2E6C8', 'FF');
  reserve(208, 580, 600, 74, '#F3E7CA', 'FF');
  reserve(208, 684, 790, 86, '#F4E8CC', 'FF');
  reserve(208, 800, 600, 74, '#F5E9CE', 'FF');
  reserve(392, 930, W-392, 300, '#F6EACF', 'FA');
  reserve(0, 1244, W, 110, '#EFE3C4', 'F7');

  // the concrete laid back over the reserves, so the bottom third is a surface again rather
  // than a quiet zone. The reserve cleared the type and it took the material with it.
  (function jambBack(){
    for (let i=0;i<46000;i++){
      const x=R()*W, y=930+R()*(H-930);
      g.globalAlpha=0.030+R()*0.070;
      g.fillStyle = R()<0.5 ? '#FFF8E2' : '#8B7F63';
      g.fillRect(x,y,1+R()*2.6,1);
    }
    for (const [tx,ty] of [[132,1000],[132,1150],[132,1290],[300,1070],[300,1220],
                           [860,1000],[860,1150],[1000,1080],[1000,1240],[520,1300],[690,1300]]){
      g.globalAlpha=1;
      g.fillStyle='#7A6E52'; g.beginPath(); g.arc(tx,ty,16,0,Math.PI*2); g.fill();
      g.fillStyle='#4A4231'; g.beginPath(); g.arc(tx,ty,11,0,Math.PI*2); g.fill();
      g.strokeStyle='rgba(255,250,232,0.90)'; g.lineWidth=3;
      g.beginPath(); g.arc(tx,ty,16,Math.PI*1.30,Math.PI*2.14); g.stroke();
      g.fillStyle='rgba(104,92,64,0.55)';
      g.beginPath(); g.ellipse(tx-10,ty+9,17,8,0,0,Math.PI*2); g.fill();
    }
    for (let y=944; y<H; y+=54){                 // the board seams keep running
      g.globalAlpha=1;
      g.fillStyle='rgba(255,250,232,0.55)'; g.fillRect(0,y,W,2);
      g.fillStyle='rgba(120,102,66,0.30)'; g.fillRect(0,y+2,W,4);
    }
    g.globalAlpha=1;
  })();

  reserve(330, 930, W-330, 320, '#F6EACF', 'FA');
  reserve(0, 1238, W, 116, '#EFE3C4', 'F9');

  window.__txProbe={ mortises: MORT_Y.length, break_y: BREAK, break_fraction: BREAK/H,
    fifth_cut: false, scribe_line: false,
    note:"the run stops at four and nothing below it marks where a fifth would go" };
})();
</script>
<script>
document.body.setAttribute('data-encodes', JSON.stringify([{
  claim: "the run of cuts stops and the jamb below it is unbroken",
  reads: "differ",
  a: [[120, 300, 400, 400]],
  b: [[120, 760, 400, 400]]
}]));
</script>
</body></html>
