<!doctype html>
<!-- 2026-09-27, frame 8 of 9. Archetype GRID. RENDERED in the declared nightSodium world. From the near kerb, the hero dark between two lit neighbours. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#171310; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:150px; width:900px; font-family:"Fraunces", serif; font-weight:800;
          line-height:0.95; letter-spacing:-0.008em; color:#F3EEE6; font-variation-settings:"opsz" 144; z-index:10; }
  .dek  { position:absolute; left:82px; width:880px; font-size:30px; line-height:1.4; color:#F0EAE0; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#E2D8C8; white-space:nowrap; z-index:20; }
  .lab { position:absolute; font-family:"JetBrains Mono", monospace; font-size:24px; line-height:1.25; color:#EDE4D6;
         letter-spacing:0.02em; white-space:nowrap; z-index:12; }
  .hook, .dek, .tx-site, .lab { text-shadow:0 0 6px rgba(10,8,6,0.9), 0 1px 16px rgba(10,8,6,0.65); }
  svg.lead { position:absolute; left:0; top:0; width:1080px; height:1350px; z-index:11; pointer-events:none; }

</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">It binds one landlord</h1>
<p class="dek" data-follow="30">The judgment is proposed and Pinnacle admits nothing. The government's claims against the remaining defendants go on. The complaint says AIRM and YieldStar penetration runs from at least around 26% to 69% in each listed submarket.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-27-nightrent.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "The rest of the case", counter: "08 / 09", src: "c55 c56 c58 c59 c36   DRAWN", ink: '#E2D8C8' });
  TX.fitText(document.getElementById("hook"), { min: 90, max: 128, maxLines: 2 });
  NIGHTRENT.follow();
  const TXT = init(THREE), K = initKit(THREE, TXT), F = NIGHTRENT, gl = F.glCanvas();
  F.installKit(K, THREE, TXT);
  const W = TXT.deckWorld();
  const R = TXT.setup(gl, { w: 1080, h: 1350, fog: [W.haze, W.fogDensity * 0.6], exposure: W.exposure * 0.82, tone: W.tone, fov: 40 });
  /* ONE LANDLORD. Across the road three buildings stand in a row: the hero in the middle with its
   * five breezeway cores dark, as on frame 7, and a neighbour either side with its cores lit and
   * 12 front units each, lit_units_low and lit_units_high of them
   * lit: figures.json, the complaint's low and high penetration share applied to the units,
   * rounded half up. The units are taken in one fixed order so the lit ones scatter. */
  const LIT_LOW = 3, LIT_HIGH = 8;
  const ORDER = [[0,1],[3,2],[2,0],[1,2],[3,0],[0,2],[2,1],[1,0],[3,1],[0,0],[2,2],[1,1]];
  const mk = (n, seed, brick, siding) => F.hero(K, { seed, cores: 1, groupBays: 2, office: false, lampsOn: true, lampI: 10, poolI: 30,
    brick, siding, litUnits: ORDER.slice(0, n) });
  const hero = F.hero(K, { office: false, lampsOn: false, lit: 0 });
  const HL = hero.userData.dims.L;
  const nA = mk(LIT_LOW, 21, '#b99c7c', '#b8b9ad'), nB = mk(LIT_HIGH, 22, '#8f5a44', '#d2cbbb');
  const NL = nA.userData.dims.L, GAPB = 3;
  nA.position.set(-HL / 2 - GAPB - NL / 2, 0, 4); nB.position.set(HL / 2 + GAPB + NL / 2, 0, 4);
  [hero, nA, nB].forEach((b) => { TXT.add(R, b); TXT.contact(R, b); });
  /* the lot in front of them, the four lane road at the camera, the near kerb the lens stands on */
  const CZ = 185;  /* the lens stands on the near kerb 60 m in from the road's far side */
  const road = K.make('road', { length: 600, lanes: 4, sidewalk: false, seed: 5 }); road.position.set(0, 0, 104); road.rotation.y = 0.0; TXT.add(R, road);
  TXT.frame(R, { from: [-110, 2.0, 124], look: [-5, 11.5, 0] });
  TXT.sky(R);
  TXT.deckRig(R, W.rig, { target: [0, 0, 60], distance: 220, shadowFar: 480 });
  TXT.ground(R, { surface: 'asphalt', size: 6000, seed: 17 });
  [-78, 78].forEach((x, i) => F.lotLamp(THREE, TXT, K, R, x, 24, { ry: Math.PI, i: 520, seed: 48 + i, height: 9 }));
  [-110, 105].forEach((x, i) => { const o = K.make('live_oak', { seed: 90 + i, height: 9 }); o.position.set(x, 0, 14); TXT.add(R, o); TXT.contact(R, o); });
  /* the near verge under the lens: a streetlight just off frame left, its sodium pool on the lot */
  { const pl = new THREE.PointLight(F.SODIUM, 700, 40, 2); pl.position.set(-108, 9, 104); R.scene.add(pl); }
  F.stalls(THREE, TXT, R, -112, 86, 12, { dir: -1 });
  [['sedan', -17.5, 0x3b3e42], ['pickup', -6.3, 0x2c2f33], ['suv', 8.1, 0x44484c], ['sedan', 19.4, 0x6e7478]].forEach((c, i) => {
    const v = K.make(c[0], { seed: 61 + i, color: c[2] }); v.position.set(c[1] - 88, 0, 83.5); v.rotation.y = Math.PI; TXT.add(R, v); TXT.contact(R, v); });
  R.scene.traverse((m) => { if (m.isMesh && m.material && m.material.emissive && m.material.emissiveIntensity > 1 && (m.material.emissive.getHex() & 0xff) > 0x80) m.material.emissiveIntensity = 0; });

  TXT.weather(R, {});
  const cx = F.develop(await TXT.snapshot(R), gl);
  TXDECK.finish(cx);

  return true;
})();
</script>
</body>
</html>
