<!doctype html>
<!-- CAROUSEL 26, frame 9 of 9. Archetype OBJECT_AND_CAPTION.
     THE CLOSE. The front of the room does not change. A podium and the person at it under the
     same fluorescent grid the classroom had on frame 3, three desk backs cropped in the near
     ground, and NOT ONE PIXEL OF THE ACCENT ANYWHERE, which is the deck's load bearing absence:
     the machine's mark has been in a margin and on a floor, and here there is none, because on
     the record's own dates nothing has been handed to anybody yet.
     Planned frame median L* 22, on a line screen at cell 4 whose measured floor on this stock is 8.9. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  :root { --bond:#BBC0C6; --toner:#070016; --table:#525862; --block:#818C90; --shade:#343C46; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:var(--bond); }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; background:rgba(9,10,15,0.97); padding:14px 22px 18px 22px;  left:80px; top:158px; width:900px; font-family:"Fraunces", serif;
          font-weight:700; font-size:96px; line-height:1.02; letter-spacing:-0.02em;
          color:#E6E9EC; font-variation-settings:"opsz" 144; }
  .dek { position:absolute; background:rgba(9,10,15,0.97); padding:14px 22px;  left:80px; top:372px; width:820px; font-size:30px; line-height:1.42;
         color:#C4CAD2; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#AEB6C0; white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Nothing has been graded yet.</h1>
<p class="dek" id="dek">The award starts October 1st, 2026 and runs to September 30th, 2029. Neither the university nor the federal record publishes a result.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txscene.js"></script>
<script src="@@ASSETS@@/js/txfig.js"></script>
<script src="@@ASSETS@@/js/txobjects.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(async function (resolve, reject) {
  try {
    await document.fonts.ready;
    TX.reseed(20260916);
    TXLAYOUT.mount(document.body, {
      kicker: "The record's own dates",
      counter: "09 / 09",
      src: "c27 c25 c13   TEXAS AI DOCKET",
      ink: "#AEB6C0"
    });
    TX.fitText(document.getElementById("hook"), { min: 62, max: 96, maxLines: 2 });

    var cv = document.getElementById("art"), cx = cv.getContext("2d");
    cx.scale(2, 2);
    var W = 1080, H = 1350;

    TXINK.print(cx, {
      ground: "#BBC0C6", ink: "#070016", fibre: 0.055, seed: 96,
      screen: { mode: "line", cell: 4, angle: 31, gamma: 1.02, floor: 0.06 },
      edges: { threshold: 26, width: 1.3, alpha: 0.72, dx: 1.1, dy: -0.9 },

      // THE TWIN IS DRAWN DARK ON LIGHT, which is the paper polarity: TXINK lays toner where the
      // twin is DARK, because the ground's luminance is over 128 and `invert` is off.
      draw: function (a) {
        var S = TXSCENE.create(a, {
          w: W, h: H, eye: 1.62, horizon: 700, f: 1150,
          sky: "#0E0E0E", fogZ: 1e9, light: { az: 0, el: 72 }
        });

        // the room. A back wall at Z 11, a suspended ceiling, and the troffer run in it.
        a.fillStyle = "#0E0E0E"; a.fillRect(0, 0, W, H);
        var wallTop = 150, wallBot = S.groundY(11);
        a.fillStyle = "#1E1E1E"; a.fillRect(0, wallTop, W, wallBot - wallTop);
        // the suspended ceiling grid, converging, so the top band is built rather than blank
        a.strokeStyle = "#2A2A2A"; a.lineWidth = 2;
        for (var i = -5; i <= 5; i++) {
          var xf = S.project(i * 1.2, 2.9 - 1.62, 11), xn = S.project(i * 1.2 * 3.4, 2.9 - 1.62, 2.2);
          a.beginPath(); a.moveTo(xf[0], xf[1]); a.lineTo(xn[0], xn[1]); a.stroke();
        }
        // THE LIGHT IS OFF-FRAME AND THE SHADOWS CARRY IT. A troffer run was drawn here and at
        // a 1.62 m eye with a 2.9 m ceiling it projected onto four pixels of the horizon, so it
        // read as a dashed line rather than as a light. What says "fluorescent grid" in this
        // frame is the direction of every shadow, which is short and hard and straight down.
        var wl = a.createLinearGradient(0, wallTop, 0, wallBot);
        wl.addColorStop(0, "#151515"); wl.addColorStop(0.62, "#2C2C2C"); wl.addColorStop(1, "#1A1A1A");
        a.fillStyle = wl; a.fillRect(0, wallTop, W, wallBot - wallTop);
        // the wall to floor junction, so the room has a depth a reader can stand in
        a.strokeStyle = "#3A3A3A"; a.lineWidth = 3;
        a.beginPath(); a.moveTo(0, wallBot); a.lineTo(W, wallBot); a.stroke();

        // the floor, lit under the grid and falling away at the edges
        S.ground({ near: 0.6, far: 40, fill: "#1A1A1A" });
        var fg = a.createRadialGradient(540, 980, 60, 540, 980, 760);
        fg.addColorStop(0, "#3C3C3C"); fg.addColorStop(1, "#0C0C0C");
        a.save(); a.beginPath(); a.rect(0, S.groundY(11), W, H - S.groundY(11)); a.clip();
        a.fillStyle = fg; a.fillRect(0, 0, W, H); a.restore();

        // THE CAMERA, SOLVED RATHER THAN GUESSED, and this is why the desk backs "were not
        // drawn". They were drawn. At horizon 700 with eye 1.62 and f 1150, the ground at Z 1.6
        // projects to y = 700 + 1.62 * (1150/1.6) = 1865, which is 515 px BELOW THE FRAME, so all
        // three desks and the podium's own base were rendered off the bottom of the canvas. The
        // pixel critic read that as absent and it was. Everything below is placed at a depth whose
        // ground line lands inside the picture.
        //
        // THE PODIUM, its base at y 1235 and its lit top face at y 875, which is 1.09 m, a real
        // lectern. The first cut had a hip high box at 0.93 m carrying a shoulder high microphone.
        var PODX = 0.62, PODZ = 3.48;
        var pod = TXOBJ.sprite("podium", { seed: 9 });
        S.shadow(pod, { X: PODX, Z: PODZ, ink: "#000000", alpha: 0.6 });
        S.sprite(pod, { X: PODX, Z: PODZ, inks: { ink: "#C8C8C8", paper: "#E2E2E2", accent: "#C8C8C8" } });

        // THE FRAME'S DECLARED FOCAL, which the first cut did not contain: the lit top face of the
        // podium, drawn as the parallelogram the camera actually sees and the brightest area in a
        // frame built of greys. Without it the podium was a flat trapezoid and the thumb read two
        // blobs rather than a room.
        var t0 = S.project(PODX - 0.33, 1.09, PODZ - 0.23);
        var t1 = S.project(PODX + 0.33, 1.09, PODZ - 0.23);
        var t2 = S.project(PODX + 0.33, 1.09, PODZ + 0.23);
        var t3 = S.project(PODX - 0.33, 1.09, PODZ + 0.23);
        a.fillStyle = "#FFFFFF";
        a.beginPath(); a.moveTo(t0[0], t0[1]); a.lineTo(t1[0], t1[1]);
        a.lineTo(t2[0], t2[1]); a.lineTo(t3[0], t3[1]); a.closePath(); a.fill();
        a.strokeStyle = "#8E8E8E"; a.lineWidth = 2; a.stroke();
        // the microphone, its head 0.25 m above the new top face rather than above the speaker
        var m0 = S.project(PODX - 0.10, 1.09, PODZ - 0.08);
        var m1 = S.project(PODX - 0.10, 1.34, PODZ - 0.08);
        a.strokeStyle = "#D2D2D2"; a.lineWidth = 4;
        a.beginPath(); a.moveTo(m0[0], m0[1]); a.lineTo(m1[0], m1[1]); a.stroke();
        a.fillStyle = "#E6E6E6";
        a.beginPath(); a.ellipse(m1[0], m1[1], 11, 7, -0.4, 0, Math.PI * 2); a.fill();

        // THE PERSON AT IT, overlapping the podium's left edge so the two are one scene rather
        // than two objects 0.65 m apart facing away from each other.
        var fig = TXFIG.figure({ pose: "stand", height: 1.70 });
        S.shadow(fig, { X: 0.10, Z: 3.80, ink: "#000000", alpha: 0.5 });
        S.sprite(fig, { X: 0.10, Z: 3.80, inks: { ink: "#B4B4B4", paper: "#D0D0D0", accent: "#B4B4B4" } });

        // THE THREE DESK BACKS, cropped hard by the frame foot, each with a lit top edge from the
        // ceiling grid and a short hard shadow under it. The composition leaves the near desktops
        // EMPTY so a reader can see there is no mark on them, which is the frame's load bearing
        // absence and which a reader cannot see on desks that are off the canvas.
        var dk = TXOBJ.sprite("student_desk", { seed: 3 });
        [[-1.95, 2.30], [0.05, 2.22], [2.10, 2.34]].forEach(function (q) {
          S.shadow(dk, { X: q[0], Z: q[1], ink: "#000000", alpha: 0.62 });
          S.sprite(dk, { X: q[0], Z: q[1], inks: { ink: "#DCDCDC", paper: "#F6F6F6", accent: "#DCDCDC" } });
        });
      },

      over: function (c) {
        // THE TYPE'S ZONE IS KEPT QUIET BY CONSTRUCTION. A flat scrim painted after the press,
        // so no screen mark crosses a letterform. qa.py reads a screen dot through a glyph as a
        // strikethrough and it is right to.
        // the furniture bands only. An earlier cut scrimmed half of every room frame and the
        // deck's value arc collapsed into three paper frames and six near-black ones, which is
        // the exact defect two shipped decks were marked down for. The hook and the dek carry
        // their own knockout plates instead, so the IMAGE keeps the frame.
        (function (ctx) {
          var g = ctx.createLinearGradient(0, 0, 0, 168);
          g.addColorStop(0, "rgba(9,10,15,1)"); g.addColorStop(0.74, "rgba(9,10,15,1)"); g.addColorStop(1, "rgba(9,10,15,0)");
          ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 168);
        })(c);
        (function (ctx) {
          var g = ctx.createLinearGradient(0, 1350, 0, 1182);
          g.addColorStop(0, "rgba(9,10,15,1)"); g.addColorStop(0.72, "rgba(9,10,15,1)"); g.addColorStop(1, "rgba(9,10,15,0)");
          ctx.fillStyle = g; ctx.fillRect(0, 1182, 1080, 168);
        })(c);
        // bare stock under the furniture bands so the type is ink on paper and never on a screen
        // no reserve on a room frame. The scene keeps its own type zone dark by construction,
        // which is the illustration system's first option and the one that keeps the value.
        void c;
      }
    });
    resolve();
  } catch (e) { reject(e); }
});
</script>
</body>
</html>
