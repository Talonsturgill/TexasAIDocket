<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#1A1C33}
  #tooth{position:absolute;left:0;top:1160px;width:1080px;height:190px;display:block}
  svg{position:absolute;inset:0;display:block}
  .eyebrow{position:absolute;top:84px;left:80px;font-family:"JetBrains Mono",monospace;
        font-weight:500;font-size:24px;letter-spacing:.16em;color:#8C8496}
  /* Law 6 puts every figure in mono, and a mono figure inside a Fraunces line brings mono's
     word space with it. At 70px that space is about twice the 82px Fraunces space on either
     side, so "260 MW" fell apart while "MW load" closed up and the unit read as a paste-up.
     The internal space is pulled to match its neighbours and the span is given its own outer
     breathing room, so the gap INSIDE the unit is the smallest gap on the line. */
  .fig{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:70px;
       font-variant-numeric:tabular-nums;letter-spacing:-.02em;word-spacing:-.30em;
       padding:0 .06em}
  h1{position:absolute;top:140px;left:80px;width:840px;margin:0;font-family:Fraunces,serif;
     font-weight:800;font-size:82px;line-height:1.05;color:#F5F1E6;letter-spacing:-.015em}
  .dek{position:absolute;top:1030px;left:80px;width:920px;margin:0;font-family:Manrope,sans-serif;
       font-weight:500;font-size:27px;line-height:1.35;color:#E4DCC6}
  .scrim{position:absolute;left:0;bottom:0;width:1080px;height:150px;
         background:linear-gradient(to bottom,rgba(26,28,51,0) 0%,rgba(26,28,51,.86) 52%,rgba(26,28,51,.94) 100%)}
  .foot{position:absolute;bottom:100px;left:80px;right:80px;display:flex;justify-content:space-between;
        font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
        letter-spacing:.02em;color:#A79FB4;font-variant-numeric:tabular-nums;white-space:nowrap}
</style></head>
<body>
<canvas id="tooth"></canvas>
<svg id="dia" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
<div class="eyebrow">PUCT DOCKET 59220, ORDER</div>
<h1>A <span class="fig">260 MW</span> load behind one interconnection.</h1>
<p class="dek">"the Crusoe One and Crusoe Two loads will be co-located with GOODNIT1 and interconnected at the GOODNIT1 point of interconnection"</p>
<div class="scrim" data-decorative></div>
<div class="foot"><span>ARMSTRONG COUNTY</span><span>c4 c5 c6 c7 c28</span><span class="tx-site">texasaidocket.com</span><span>02 / 09</span></div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script>
window.renderReady = (async () => {
  const NS='http://www.w3.org/2000/svg';
  // ---- the bottom band's own ground: an even tecovas tooth, so the band is never flat -------
  const c=document.getElementById('tooth');
  c.width=1080*2; c.height=190*2; const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260828); const R=TX.rng(20260828);
  g.fillStyle='#1A1C33'; g.fillRect(0,0,1080,190);
  for(let i=0;i<46000;i++){
    const x=R()*1080, y=R()*190;
    const v=TX.fbm2(x/150,y/150,3);
    g.fillStyle=`rgba(140,132,150,${(0.06+v*0.24).toFixed(3)})`;
    g.fillRect(x,y,0.9,0.9);
  }
  for(let i=0;i<900;i++){                      // small stones with their own cast
    const x=R()*1080, y=20+R()*160, r=1.4+R()*3.4;
    g.fillStyle='rgba(28,20,26,0.55)'; g.fillRect(x+r*0.7,y+r*0.5,r*1.5,r*0.8);
    g.fillStyle=`rgba(198,162,119,${(0.24+R()*0.30).toFixed(3)})`; g.fillRect(x,y,r,r*0.9);
  }
  const fade=g.createLinearGradient(0,0,0,54);
  fade.addColorStop(0,'#1A1C33'); fade.addColorStop(1,'rgba(26,28,51,0)');
  g.fillStyle=fade; g.fillRect(0,0,1080,54);

  // ---- the single line diagram --------------------------------------------------------------
  const s=document.getElementById('dia');
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const SPAR='#F5F1E6', CAL='#E4DCC6', FIELD='#1A1C33';
  const NODEC='#F2D9B4';   // rim light. A commission finding takes a commission value.
  // ITS SHADOWED LOWER HALF, AND IT MUST NOT BE MISTAKEN FOR OCHRE. This was #B98F52, which is
  // hue 37 and lightness 52 against ochre #B4903F's hue 44 and lightness 48. Law 4 makes ochre
  // mean A PARTY SAID THIS, and a commission finding wearing a value that near it applies the
  // deck's best idea backwards to anyone who cannot sample the pixel. Round 3's craft judge
  // could not tell them apart and said so. The shadow is now rim light carried toward
  // ledge_shadow, which drops saturation to 14 and puts it out of ochre's reach by eye.
  const NODER='#94836C';

  const NODE=[540,760];
  const GEN={t:'GOODNIT1', v:'265.5 MW', at:[540,530], w:392, h:100};
  const LOADS=[{t:'Crusoe One Load', v:'265 MW', at:[290,930], w:344, h:112},
               {t:'Crusoe Two Load', v:'260 MW', at:[790,930], w:344, h:112}];

  // the generator leg, then the two load legs. Three lines meet at the node.
  s.appendChild(mk('line',{x1:NODE[0],y1:NODE[1],x2:NODE[0],y2:GEN.at[1]+GEN.h/2,
                           stroke:SPAR,'stroke-width':5,'stroke-linecap':'square'}));
  LOADS.forEach(b=>{
    s.appendChild(mk('path',{d:`M ${NODE[0]} ${NODE[1]} L ${NODE[0]} 848 L ${b.at[0]} 880 L ${b.at[0]} ${b.at[1]-b.h/2}`,
                             fill:'none',stroke:SPAR,'stroke-width':5,
                             'stroke-linejoin':'miter','stroke-linecap':'square'}));
  });

  // the three bodies, open plates with real stroke weight
  [GEN].concat(LOADS).forEach(b=>{
    s.appendChild(mk('rect',{x:b.at[0]-b.w/2,y:b.at[1]-b.h/2,width:b.w,height:b.h,
                             fill:FIELD,stroke:SPAR,'stroke-width':4}));
    const t1=mk('text',{x:b.at[0],y:b.at[1]-8,'text-anchor':'middle',
                        'font-family':'JetBrains Mono, monospace','font-size':28,
                        'font-weight':500,fill:CAL,'letter-spacing':'0.03em'});
    t1.textContent=b.t; s.appendChild(t1);
    const t2=mk('text',{x:b.at[0],y:b.at[1]+32,'text-anchor':'middle',
                        'font-family':'JetBrains Mono, monospace','font-size':34,
                        'font-weight':700,fill:SPAR,'font-variant-numeric':'tabular-nums'});
    t2.textContent=b.v; s.appendChild(t2);
  });

  // the shared settlement meter, tapped OFF the generator leg so no rule crosses its type
  s.appendChild(mk('line',{x1:NODE[0],y1:668,x2:686,y2:668,stroke:CAL,'stroke-width':4}));
  s.appendChild(mk('rect',{x:686,y:640,width:118,height:56,fill:FIELD,stroke:CAL,'stroke-width':4}));
  const ml=mk('text',{x:745,y:678,'text-anchor':'middle','font-family':'JetBrains Mono, monospace',
                      'font-size':26,'font-weight':500,fill:CAL,'letter-spacing':'0.06em'});
  ml.textContent='EPS'; s.appendChild(ml);
  const ml2=mk('text',{x:790,y:738,'text-anchor':'middle','font-family':'JetBrains Mono, monospace',
                       'font-size':24,'font-weight':400,fill:'#8C8496','letter-spacing':'0.05em'});
  ml2.textContent='SHARED SETTLEMENT METER  c28'; s.appendChild(ml2);

  // THE NODE: the only saturated element on the frame, an area rather than a dot
  s.appendChild(mk('circle',{cx:NODE[0],cy:NODE[1],r:40,fill:NODER}));
  s.appendChild(mk('path',{d:`M ${NODE[0]-40} ${NODE[1]} a 40 40 0 0 1 80 0 z`,fill:NODEC}));
  s.appendChild(mk('circle',{cx:NODE[0],cy:NODE[1],r:40,fill:'none',stroke:FIELD,'stroke-width':8}));
  const nl=mk('text',{x:NODE[0]-58,y:NODE[1]+9,'text-anchor':'end',
                      'font-family':'JetBrains Mono, monospace',
                      'font-size':25,'font-weight':500,fill:NODEC,'letter-spacing':'0.08em'});
  nl.textContent='POINT OF INTERCONNECTION'; s.appendChild(nl);

  await document.fonts.ready;
})();
</script></body></html>
