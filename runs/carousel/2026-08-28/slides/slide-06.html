<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#2A2028}
  #face{position:absolute;inset:0;width:1080px;height:1350px;display:block}
  svg{position:absolute;inset:0;display:block}
  /* THE HOOK AND ITS ATTRIBUTION SIT IN ONE BLOCK, on a reserve, because the face beneath is
     raked and a figure this contested can never be read against a gradient. */
  .head{position:absolute;top:70px;left:80px;width:920px;background:#241E22;
        padding:30px 34px 32px 34px;box-sizing:border-box}
  .head h1{margin:0;font-family:Fraunces,serif;font-weight:800;font-size:76px;line-height:1.04;
           color:#B4903F;letter-spacing:-.015em}
  .strap{margin-top:22px;display:inline-block;background:#B4903F;color:#241E22;
         font-family:"JetBrains Mono",monospace;font-weight:700;font-size:34px;
         letter-spacing:.03em;padding:14px 18px;line-height:1.28}
  .dekbox{position:absolute;top:1060px;left:80px;width:920px;background:#241E22;
          padding:24px 28px 26px 28px;box-sizing:border-box}
  .dekbox p{margin:0;font-family:Manrope,sans-serif;font-weight:600;font-size:29px;
            line-height:1.3;color:#B4903F}
  .scrim{position:absolute;left:0;bottom:0;width:1080px;height:150px;
         background:linear-gradient(to bottom,rgba(42,32,40,0) 0%,rgba(42,32,40,.88) 54%,rgba(42,32,40,.95) 100%)}
  .foot{position:absolute;bottom:100px;left:80px;right:80px;display:flex;justify-content:space-between;
        font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
        letter-spacing:.1em;color:#E4DCC6;font-variant-numeric:tabular-nums}
</style></head>
<body>
<canvas id="face"></canvas>
<svg id="ov" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
<div class="head">
  <h1>The applicants did the arithmetic.</h1>
  <div class="strap">THE APPLICANTS' FIGURE, AS THE ORDER RECORDS IT</div>
</div>
<div class="dekbox"><p>"it would result in a total curtailment of 525.5 MW"</p></div>
<div class="scrim" data-decorative></div>
<div class="foot"><span>ARMSTRONG COUNTY</span><span>c3 c5 c12</span><span class="tx-site">texasaidocket.com</span><span>06 / 09</span></div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script>
window.renderReady = (async () => {
  const W=1080,H=1350,NS='http://www.w3.org/2000/svg';
  const c=document.getElementById('face');
  c.width=W*2; c.height=H*2; const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260828); const R=TX.rng(20260828);

  // ---- a raking lit sandstone face, sun from the left on the deck's one azimuth --------------
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x+=2){
      const grain = TX.fbm2(x/260, y/58, 4);
      const rake  = 1 - (x/W)*0.58;
      const L = 15 + grain*24*rake + rake*9;
      g.fillStyle=`hsl(${30-grain*4},${26+grain*6}%,${L.toFixed(1)}%)`;
      g.fillRect(x,y,2,1);
    }
  }
  // THE AZIMUTH HAS TO BE VISIBLE, NOT JUST PRESENT IN THE ARITHMETIC.
  //
  // The rake term was always in the lightness above, and round 3 still read this frame as a
  // smeared brown cloud with no discernible light source. A gradient across 1080 px is not how
  // an eye finds a sun. It finds one by seeing the SAME relief lit on one side and shadowed on
  // the other, over and over, at a size it can resolve. So the speckle is drawn as raking grain
  // in lit and shadowed PAIRS on the deck's one azimuth, rather than as isolated pale dots.
  for(let i=0;i<86000;i++){
    const x=R()*W, y=R()*H, rake=1-(x/W)*0.58;
    const len=5+R()*22;
    g.fillStyle=`rgba(238,222,196,${(0.03+R()*0.16*rake).toFixed(3)})`;
    g.fillRect(x,y,len,1.0);
    g.fillStyle=`rgba(16,10,12,${(0.05+R()*0.20).toFixed(3)})`;   // its own shadow, down sun
    g.fillRect(x+1.4,y+1.0,len,1.2);
  }

  // ---- THE SLOPE. one quantity at two states, untruncated, drawn and labelled zero -----------
  const s=document.getElementById('ov');
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const CAL='#E4DCC6', OCH='#B4903F', DK='#241E22';

  const PX_PER_MW = 0.9324452901998097;  // out/2026-08-28/compute.py. One rate for the deck.
  const ZERO_Y = 1000, AX = 224;
  // emitted by out/2026-08-28/compute.py, never typed here
  const AXIS_ZERO = '0 MW', SCALE_STEP = '100 MW', SCALE_STEP_PX = 93.24;
  const GEN_MW = 265.5, TOTAL_MW = 525.5;
  const yFor = mw => ZERO_Y - mw*PX_PER_MW;

  // the value axis, starting below the head block so no rule ever crosses the strap
  s.appendChild(mk('line',{x1:AX,y1:ZERO_Y,x2:AX,y2:yFor(TOTAL_MW)-58,stroke:CAL,'stroke-width':3}));
  s.appendChild(mk('line',{x1:AX-18,y1:ZERO_Y,x2:1000,y2:ZERO_Y,stroke:CAL,'stroke-width':3}));
  const z=mk('text',{x:AX-30,y:ZERO_Y+11,'text-anchor':'end','font-family':'JetBrains Mono, monospace',
                     'font-size':28,'font-weight':500,fill:CAL,'font-variant-numeric':'tabular-nums'});
  z.textContent=AXIS_ZERO; s.appendChild(z);

  // the scale bar, so the rate is ON the frame rather than only in the code
  const sbTop=ZERO_Y - SCALE_STEP_PX;
  s.appendChild(mk('line',{x1:1000,y1:ZERO_Y,x2:1000,y2:sbTop,stroke:CAL,'stroke-width':3}));
  s.appendChild(mk('line',{x1:990,y1:ZERO_Y,x2:1000,y2:ZERO_Y,stroke:CAL,'stroke-width':3}));
  s.appendChild(mk('line',{x1:990,y1:sbTop,x2:1000,y2:sbTop,stroke:CAL,'stroke-width':3}));
  const sl=mk('text',{x:978,y:(ZERO_Y+sbTop)/2+9,'text-anchor':'end',
                      'font-family':'JetBrains Mono, monospace','font-size':24,'font-weight':400,
                      fill:CAL,'letter-spacing':'0.04em'});
  sl.textContent=SCALE_STEP; s.appendChild(sl);

  // the commission's nameplate, a caliche hairline across the whole chart
  const gy=yFor(GEN_MW);
  s.appendChild(mk('line',{x1:AX,y1:gy,x2:1000,y2:gy,stroke:CAL,'stroke-width':3,
                           'stroke-dasharray':'14 10'}));

  // the two seated blocks, each recessed into the face so it reads as an area
  const B1=[404, gy], B2=[760, yFor(TOTAL_MW)];
  // A RECESS, NOT A DROP SHADOW, AND THE DIFFERENCE IS THE WHOLE VALUE STRUCTURE OF THE FRAME.
  //
  // This drew a dark square offset down and to the RIGHT of each block, which is the signature
  // of an object floating ABOVE a surface. The dossier declares blocks seated INTO the face, so
  // the frame asserted the opposite of its own plan and round 3 caught it.
  //
  // A hole lit from the left is shadowed on the walls the sun cannot reach, which are the left
  // and the top, and lit on the two it rakes across, which are the right and the bottom. That
  // is the reverse of a drop shadow on both axes, and it is the deck's one azimuth, the same
  // sun that rakes the face behind it.
  [[B1,CAL],[B2,OCH]].forEach(([p,col])=>{
    const x0=p[0]-52, y0=p[1]-52, S=104, WALL=9;
    s.appendChild(mk('rect',{x:x0,y:y0,width:S,height:S,fill:'rgba(8,5,9,0.74)'}));      // aperture
    s.appendChild(mk('rect',{x:x0,y:y0,width:S,height:WALL,fill:'rgba(4,2,5,0.86)'}));   // top, shadowed
    s.appendChild(mk('rect',{x:x0,y:y0,width:WALL,height:S,fill:'rgba(4,2,5,0.86)'}));   // left, shadowed
    s.appendChild(mk('rect',{x:x0+S-WALL,y:y0,width:WALL,height:S,
                             fill:'rgba(255,246,226,0.30)'}));                           // right, lit
    s.appendChild(mk('rect',{x:x0,y:y0+S-WALL,width:S,height:WALL,
                             fill:'rgba(255,246,226,0.22)'}));                           // floor, lit
    s.appendChild(mk('rect',{x:x0+WALL,y:y0+WALL,width:S-WALL*2,height:S-WALL*2,fill:col}));
  });
  // the slope, from the commission's state to the applicants' count
  // the slope leaves each block AT ITS OWN EDGE, which moved when the recess replaced the shadow
  s.appendChild(mk('line',{x1:B1[0]+52,y1:gy-30,x2:B2[0]-52,y2:B2[1]+30,
                           stroke:OCH,'stroke-width':7,'stroke-linecap':'square'}));

  // the labels. Both plates are MEASURED off their own laid out text, never typed.
  const gt=mk('text',{x:1000,y:gy-26,'text-anchor':'end','font-family':'JetBrains Mono, monospace',
                      'font-size':26,'font-weight':500,fill:CAL,'letter-spacing':'0.04em'});
  gt.textContent='265.5 MW  GOODNIT1 nameplate'; s.appendChild(gt);

  // LAW 5: 525.5 is NEVER set larger than its attribution. The strap carrying "THE APPLICANTS'
  // FIGURE, AS THE ORDER RECORDS IT" is 34 px, and this was 38, so the deck's most contested
  // numeral was the larger of the two on the one frame the law exists for.
  const at=mk('text',{x:B2[0]+58,y:B2[1]+56,'font-family':'JetBrains Mono, monospace','font-size':32,
                      'font-weight':700,fill:OCH,'font-variant-numeric':'tabular-nums'});
  at.textContent='525.5 MW'; s.appendChild(at);

  // THE ARITHMETIC THE HOOK PROMISES. The frame read "The applicants did the arithmetic." and
  // then showed 525.5 and 265.5 on one chart without ever saying they were related. A reader
  // judge found it and was right: this sum is the deck's only available stake, it needed no new
  // source, and it was sitting on the frame unsaid. Emitted by compute.py as component_sum_expr,
  // which refuses to publish the sum unless the two quoted components equal the quoted total.
  const SUM_EXPR = '260 MW load + 265.5 MW generation';
  // Right aligned to the chart's own right edge. Set left of the figure it explains, it ran
  // 250 px off the frame and its knockout plate landed on top of "525.5 MW".
  const sx=mk('text',{x:1000,y:B2[1]+124,'text-anchor':'end',
                      'font-family':'JetBrains Mono, monospace','font-size':24,
                      'font-weight':500,fill:CAL,'letter-spacing':'0.01em',
                      'font-variant-numeric':'tabular-nums'});
  sx.textContent=SUM_EXPR; s.appendChild(sx);

  await document.fonts.ready;
  TX.svgPlate(gt, {padX:14, padY:10, fill:DK});
  TX.svgPlate(at, {padX:16, padY:12, fill:DK});
  TX.svgPlate(sx, {padX:12, padY:9,  fill:DK});
  // The axis labels get the same knockout the value labels already had. Drawing the face's
  // grain as lit and shadowed PAIRS gave it the azimuth it was missing and also gave it real
  // horizontal edges, and one of them ran through '0 MW' at 1.5:1, which reads as a
  // strikethrough on the one label that proves this axis is not truncated.
  TX.svgPlate(z,  {padX:12, padY:9, fill:DK});
  TX.svgPlate(sl, {padX:12, padY:9, fill:DK});
})();
</script></body></html>
