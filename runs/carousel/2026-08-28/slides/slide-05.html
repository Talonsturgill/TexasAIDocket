<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#4A4356}
  #tooth{position:absolute;left:0;top:0;width:1080px;height:1350px;display:block}
  .eyebrow{position:absolute;top:84px;left:80px;font-family:"JetBrains Mono",monospace;
        font-weight:500;font-size:24px;letter-spacing:.16em;color:#E4DCC6}
  h1{position:absolute;top:150px;left:80px;width:860px;margin:0;font-family:Fraunces,serif;
     font-weight:800;font-size:104px;line-height:1.03;color:#F5F1E6;letter-spacing:-.015em}
  .rows{position:absolute;top:474px;left:0;width:1080px}
  .row{position:absolute;left:0;width:1080px;height:120px}
  .fig{position:absolute;top:12px;font-family:"JetBrains Mono",monospace;font-weight:700;
       font-size:76px;line-height:1;color:#F5F1E6;font-variant-numeric:tabular-nums;
       letter-spacing:-.01em}
  .lab{position:absolute;top:34px;font-family:Manrope,sans-serif;font-weight:600;
       font-size:30px;line-height:1.24;color:#E4DCC6;width:480px}
  .strap{position:absolute;top:874px;left:80px;width:920px;font-family:"JetBrains Mono",monospace;
         font-weight:500;font-size:25px;letter-spacing:.09em;color:#241E22;
         background:#E4DCC6;padding:16px 20px;box-sizing:border-box}
  .dek{position:absolute;top:962px;left:80px;width:920px;font-family:Manrope,sans-serif;
       font-weight:500;font-size:27px;line-height:1.36;color:#F5F1E6}
  .foot{position:absolute;bottom:100px;left:80px;right:80px;display:flex;justify-content:space-between;
        font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
        letter-spacing:.1em;color:#F5F1E6;font-variant-numeric:tabular-nums}
</style></head>
<body data-encodes='[{"claim":"this frame carries no drawn light, so its ground is one value everywhere","reads":"same","a":[[120,1160,300,60]],"b":[[660,1160,300,60]]}]'>
<canvas id="tooth"></canvas>
<div class="eyebrow">PUCT DOCKET 59220, ORDER, FINDINGS OF FACT</div>
<h1>Alike is not the same.</h1>
<div class="rows" id="rows"></div>
<div class="strap">ALL THREE FROM THE COMMISSION'S OWN FINDINGS</div>
<div class="dek">"Goodnight owns and operates GOODNIT1, a stand-alone 265.5-MW wind generation resource in Armstrong County."</div>
<div class="foot"><span>ARMSTRONG COUNTY</span><span>c3 c5</span><span class="tx-site">texasaidocket.com</span><span>05 / 09</span></div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script>
window.renderReady = (async () => {
  const W=1080,H=1350;
  // THE DECK'S ONE FLAT FRAME. No gradient, no cast, no specular. Even tooth only, so the
  // eye has nowhere to go except the figure column.
  const c=document.getElementById('tooth');
  c.width=W*2; c.height=H*2; const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260828); const R=TX.rng(20260828);
  g.fillStyle='#4A4356'; g.fillRect(0,0,W,H);
  // The tooth carries real per pixel variance, which the near uniform gate requires and which
  // a mudstone actually has. What it must NOT carry is a low frequency ramp, so every term
  // below is symmetric about the field value and none of them depends on x or y directly.
  for(let i=0;i<230000;i++){
    const x=R()*W,y=R()*H;
    const v=TX.fbm2(x/70,y/70,4);
    const a=0.10+v*0.42;
    g.fillStyle= R()<0.5 ? `rgba(232,226,206,${a.toFixed(3)})`
                         : `rgba(24,18,28,${a.toFixed(3)})`;
    g.fillRect(x,y,1.3,1.3);
  }
  for(let i=0;i<9000;i++){                    // coarser grit, same even distribution
    const x=R()*W,y=R()*H, s2=1.6+R()*3.4;
    g.fillStyle= R()<0.5 ? `rgba(238,232,214,${(0.10+R()*0.30).toFixed(3)})`
                         : `rgba(20,14,24,${(0.12+R()*0.34).toFixed(3)})`;
    g.fillRect(x,y,s2,s2*0.8);
  }

  // ---- three rows, every figure on ONE computed column ---------------------------------------
  const FIG_X = 96.0, LAB_X = 500.0;          // emitted by out/2026-08-28/compute.py
  const ROWS=[
    {fig:'265.5 MW', lab:"GOODNIT1's own rating"},
    {fig:'265 MW',   lab:'the first data center'},
    {fig:'260 MW',   lab:'the second data center'}
  ];
  const host=document.getElementById('rows');
  ROWS.forEach((r,i)=>{
    const row=document.createElement('div'); row.className='row'; row.style.top=(i*128)+'px';
    const f=document.createElement('div'); f.className='fig';
    f.style.left=FIG_X+'px'; f.textContent=r.fig; row.appendChild(f);
    const l=document.createElement('div'); l.className='lab';
    l.style.left=LAB_X+'px'; l.textContent=r.lab; row.appendChild(l);
    host.appendChild(row);
  });
  await document.fonts.ready;
})();
</script></body></html>
