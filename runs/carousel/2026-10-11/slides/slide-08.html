<!doctype html>
<!-- 2026-10-11, frame 8 of 9. Archetype CLOSE_CROP. RENDERED through txthree.js in the deck's lastLight world. Close in the feed alley at the neck rail, looking south: a Hereford steer's white face comes through the rail toward the camera, raked by the low west key, a blank dusk gold tag in its near ear, the windrow along the lower left. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  .tx-site { font-size:24px; }
  .dek { width:820px; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">No AI tool, vendor or result is named</h1>
<p class="dek" data-follow="28">The release names no camera or model either. The blank tag is drawn to illustrate.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-11-feedyard.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "What the release leaves out", counter: "08 / 09", src: "c7", fit: { min: 72, max: 96, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 30, far: 6000 });
  TXT.ground(R, { surface: 'dirt', size: 4000, tile: 6, seed: 18 });
  CH.penFloor(-30, 3.66, 30, 40);
  const bunk = CH.bunk({ length: 12.2, fill: 0.9, bites: 1, seed: 19 });
  bunk.position.set(0, 0, 0);
  /* the steer on the apron facing the alley (-z), its head through the rail */
  const st = CH.steer(1.45, 1.45, { ry: Math.PI - 0.12, seed: 41 });
  const CAM = [1.2, 1.5, -2.7];
  /* the yard lamp over the alley behind the camera, warm on the white face */
  CH.yardLight(-2.5, -4.2, { h: 6, at: [1.5, 1.0, 1.2], i: 55, angle: 0.25, penumbra: 0.8 });
  CH.tagEar(st, CAM, { scale: 1.9, lift: 0.05 });
  TXT.frame(R, { from: CAM, look: [1.45, 1.1, 0.5] });
  TXT.sky(R);
  TXT.deckRig(R, CH.rigSpec(W, 8, 4096), CH.rigOpts([0.2, 0.8, 0.6], { distance: 30, shadowFar: 80 }));
  TXT.stage(R, st, { poolInner: 0.9, poolOuter: 2.6 });
  TXT.weather(R, { grime: 0.24, height: 0.45 });  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.3, veil: 0.4, veilH: 260 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
