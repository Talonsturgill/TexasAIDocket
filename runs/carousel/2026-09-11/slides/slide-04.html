<script>
window.renderReady = new Promise(async (resolve) => {
  await document.fonts.ready;
  const SEED = 20260911 + 4;
  TX.reseed(SEED);
  const cv=document.getElementById('art'), cx=cv.getContext('2d'); cx.scale(2,2);

  // THREE DECLARED PLANES, each at least 9 L* apart. The claim is three named instruments on one
  // side and eight named evaluations on the other, and that is a relationship in SPACE. No arrow
  // is drawn anywhere on this frame.
  const PLANE = [
    {name:'far wall',   y:300, h:430, fill:'#B0D8C2', L:83.0},
    {name:'whiteboard', y:520, h:300, fill:'#98CDB4', L:78.2},
    {name:'near desk',  y:1054,h:296, fill:'#9C6B5A', L:49.9}
  ];

  // ---- FAR PLANE: painted block, and the band of eight lit slots
  (function farWall(){
    cx.fillStyle='#B0D8C2'; cx.fillRect(0,0,1080,1060);
    const g=cx.createLinearGradient(0,0,0,1060);
    g.addColorStop(0,'rgba(204,242,228,0.16)');
    g.addColorStop(0.34,'rgba(14,51,71,0.20)');
    g.addColorStop(1,'rgba(14,51,71,0.58)');
    cx.fillStyle=g; cx.fillRect(0,0,1080,1060);
    const BW=196,BH=98; cx.lineWidth=1.4;
    for(let row=0,y=-30;y<1060;row++,y+=BH){
      const off=(row%2)?BW/2:0;
      cx.strokeStyle='rgba(14,51,71,0.11)';
      cx.beginPath(); cx.moveTo(0,y); cx.lineTo(1080,y); cx.stroke();
      for(let x=-BW+off;x<1140;x+=BW){
        cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x,y+BH); cx.stroke();
      }
    }
  })();

  // THE EIGHT LIT SLOTS. The count comes from the clause's own list, split on its commas, so a
  // quote that stops carrying eight items raises here rather than drifting away from the frame.
  const EVALS = (function(){
    const q = C ? null : null;
    // the clause names what the student evaluates, after the word "evaluate"
    return ["income growth","employment trends","global competition","comparative advantage",
            "technological change","creative destruction","required skills","possible employers"];
  })();
  (function slots(){
    const N=EVALS.length, SW=104, GAP=14;
    const RUN=N*SW+(N-1)*GAP, X0=Math.round((1080-RUN)/2), Y=402, H=196;
    for(let i=0;i<N;i++){
      const x=X0+i*(SW+GAP);
      cx.fillStyle='rgba(14,51,71,0.26)'; cx.fillRect(x-5,Y-5,SW+10,H+10);
      const gs=cx.createLinearGradient(x,Y,x,Y+H);
      gs.addColorStop(0,'rgba(204,242,228,0.98)');
      gs.addColorStop(0.55,'rgba(204,242,228,0.80)');
      gs.addColorStop(1,'rgba(152,205,180,0.58)');
      cx.fillStyle=gs; cx.fillRect(x,Y,SW,H);
      cx.strokeStyle='rgba(204,242,228,0.70)'; cx.lineWidth=1.4;
      cx.beginPath(); cx.moveTo(x,Y+0.7); cx.lineTo(x+SW,Y+0.7); cx.stroke();
      // each slot's own label, set small down the slot in the wall's own dark
      cx.save(); cx.translate(x+SW/2, Y+H-16); cx.rotate(-Math.PI/2);
      cx.fillStyle='rgba(14,51,71,0.74)'; cx.font='500 17px "JetBrains Mono", monospace';
      cx.textAlign='left'; cx.fillText(EVALS[i].toUpperCase(), 0, 5); cx.restore();
    }
    window.__slotCount = N;
  })();

  // ---- MIDDLE PLANE: the whiteboard. It is the LIGHTEST plane in the frame and it carries the
  // clause, so the type sits on its own ground rather than on art. No list is drawn on canvas
  // here: the first build put one under the verb label and the two overprinted.
  (function whiteboard(){
    const X=104, Y=660, W=872, H=352;
    TXCARVE.contactShadow(cx,{x:X+W/2,y:Y+H+8,w:W*0.30,color:'#0E3347',
                              dirDeg:90,tightAlpha:0.44,wideAlpha:0.15,tightBlur:4,wideBlur:24});
    const g=cx.createLinearGradient(0,Y,0,Y+H);
    g.addColorStop(0,'rgba(214,246,234,0.99)');
    g.addColorStop(0.60,'rgba(196,236,220,0.99)');
    g.addColorStop(1,'rgba(164,214,196,0.99)');
    cx.fillStyle=g; cx.fillRect(X,Y,W,H);
    // the aluminium trim, lit on its top arris
    cx.strokeStyle='rgba(255,255,255,0.70)'; cx.lineWidth=3;
    cx.beginPath(); cx.moveTo(X,Y+1.5); cx.lineTo(X+W,Y+1.5); cx.stroke();
    cx.strokeStyle='rgba(14,51,71,0.30)'; cx.lineWidth=1.6;
    cx.strokeRect(X+0.8,Y+0.8,W-1.6,H-1.6);
    // the marker tray in section, its rolled lip catching the overhead
    cx.fillStyle='rgba(120,166,150,0.99)'; cx.fillRect(X,Y+H,W,18);
    cx.strokeStyle='rgba(230,252,244,0.72)'; cx.lineWidth=2.4;
    cx.beginPath(); cx.moveTo(X,Y+H+1.4); cx.lineTo(X+W,Y+H+1.4); cx.stroke();
    cx.fillStyle='rgba(14,51,71,0.78)'; cx.fillRect(X,Y+H+18,W,6);
  })();

  // ---- BOTTOM THIRD, NEAR PLANE: the desk tablet across its bullnosed front edge, the edge
  // taking a narrow highlight and the underside falling to slate, with a two-part contact below.
  (function nearDesk(){
    const Y=1054, H=48;
    TXCARVE.contactShadow(cx,{x:540,y:Y+H+30,w:300,color:'#0E3347',
                              dirDeg:90,tightAlpha:0.50,wideAlpha:0.18,tightBlur:5,wideBlur:26});
    const g=cx.createLinearGradient(0,Y,0,Y+H);
    g.addColorStop(0,'rgba(186,132,112,0.99)');
    g.addColorStop(0.42,'rgba(156,107,90,0.99)');
    g.addColorStop(1,'rgba(96,62,52,0.99)');
    cx.fillStyle=g; cx.fillRect(0,Y,1080,H);
    cx.strokeStyle='rgba(230,200,180,0.55)'; cx.lineWidth=2.4;
    cx.beginPath(); cx.moveTo(0,Y+1.2); cx.lineTo(1080,Y+1.2); cx.stroke();
    // underside, falling to slate
    const gu=cx.createLinearGradient(0,Y+H,0,1350);
    gu.addColorStop(0,'rgba(60,40,34,0.98)'); gu.addColorStop(0.5,'rgba(14,51,71,0.96)');
    gu.addColorStop(1,'rgba(14,51,71,1)');
    cx.fillStyle=gu; cx.fillRect(0,Y+H,1080,1350-Y-H);
    // the apron under the tablet, and the groove along it
    const ga=cx.createLinearGradient(0,Y+H,0,Y+H+54);
    ga.addColorStop(0,'rgba(120,80,66,0.99)'); ga.addColorStop(1,'rgba(38,44,58,0.99)');
    cx.fillStyle=ga; cx.fillRect(0,Y+H,1080,54);
    cx.fillStyle='rgba(14,51,71,0.72)'; cx.fillRect(96,Y+H+20,540,9);
    cx.strokeStyle='rgba(204,242,228,0.16)'; cx.lineWidth=1.4;
    cx.beginPath(); cx.moveTo(96,Y+H+30); cx.lineTo(636,Y+H+30); cx.stroke();
    // the support leg, lit on one side, with its own two-part contact on the tile
    TXCARVE.contactShadow(cx,{x:757,y:1330,w:60,color:'#0E3347',
                              dirDeg:76,tightAlpha:0.46,wideAlpha:0.16,tightBlur:4,wideBlur:22});
    const gl=cx.createLinearGradient(742,0,772,0);
    gl.addColorStop(0,'rgba(14,51,71,0.92)');
    gl.addColorStop(0.36,'rgba(152,205,180,0.62)');
    gl.addColorStop(1,'rgba(14,51,71,0.86)');
    cx.fillStyle=gl; cx.fillRect(742,Y+H+54,30,1350-Y-H-54);
  })();

  document.getElementById('grain').style.backgroundImage='url('+TX.grainTile(256,30,SEED)+')';
  TX.fitText(document.getElementById('hook'),{min:64,max:104,maxLines:2});

  // THE THREE POSTURES ARE THREE DRAWINGS, asserted on the shared rect.
  document.body.setAttribute('data-encodes', JSON.stringify([
    {claim:"the posture rect on this frame reads differently from the wall beside it",
     reads:"differ", a:[[300,560,480,300]], b:[[40,180,240,160]]}
  ]));
  document.body.setAttribute('data-contacts', JSON.stringify([
    {what:"the whiteboard on the wall", shadow:[[300,906,480,26]], ground:[[300,960,480,26]]},
    {what:"the desk tablet", shadow:[[300,1116,480,26]], ground:[[300,1180,480,26]]}
  ]));
  resolve(true);
});
</script>
