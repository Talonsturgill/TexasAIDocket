<script>
window.renderReady = new Promise(async (resolve) => {
  await document.fonts.ready;
  const SEED = 20260911 + 7;
  TX.reseed(SEED);
  const cv=document.getElementById('art'), cx=cv.getContext('2d'); cx.scale(2,2);

  // THE PROJECTED RECTANGLE. It is the lightest thing in the DECK and it is deliberately large:
  // the state's own summary fills the room, and what it leaves out is the strip underneath.
  const R={x:64,y:150,w:952,h:708};
  const FALLOFF=R.y+R.h;          // where the beam stops, and the room begins

  // ---- THE ROOM, front bank off.
  (function room(){
    // THE ROOM IS LIT, DIMLY, which is the frame's own argument: a projected image in a lit room
    // has no black point. The first build painted the room at L* 6 with a p05 of 1.9, under a
    // deck law that says there is no black in it, and round 1's craft judge measured both.
    cx.fillStyle='#0C2A3A'; cx.fillRect(0,0,1080,1350);
    // tee bar grid above the board, receding
    for(let i=0;i<5;i++){
      const y=18+i*30;
      cx.strokeStyle='rgba(126,176,158,'+(0.20-0.03*i)+')'; cx.lineWidth=1.6;
      cx.beginPath(); cx.moveTo(0,y); cx.lineTo(1080,y); cx.stroke();
    }
    for(let x=60;x<1080;x+=180){
      cx.strokeStyle='rgba(126,176,158,0.13)'; cx.lineWidth=1.4;
      cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x-26,150); cx.stroke();
    }
    // THE PROJECTOR'S FAN GRILLE, upper right, which is where the beam comes from. It sits LEFT
    // of the counter rather than behind it: the first build ran its housing straight across
    // "07 / 09" and the counter came back unreadable at feed width.
    cx.save();
    cx.fillStyle='rgba(10,34,48,0.96)';
    cx.beginPath(); cx.moveTo(646,0); cx.lineTo(782,0); cx.lineTo(764,52); cx.lineTo(662,52);
    cx.closePath(); cx.fill();
    cx.strokeStyle='rgba(126,176,158,0.34)'; cx.lineWidth=1.2;
    for(let i=0;i<7;i++){
      const t=i/6;
      cx.beginPath(); cx.moveTo(652+t*124,5); cx.lineTo(666+t*94,47); cx.stroke();
    }
    cx.restore();
  })();

  // ---- THE DUST COLUMN. One off-centre column from the upper right with a HARD falloff, which
  // is the library's instrument for something ARRIVING. It is what makes the rectangle read as
  // light rather than as paper, and it may not be removed during repair.
  (function beam(){
    cx.save();
    cx.beginPath();
    cx.moveTo(694,8); cx.lineTo(748,8); cx.lineTo(R.x+R.w-24,FALLOFF); cx.lineTo(R.x+180,FALLOFF);
    cx.closePath(); cx.clip();
    const g=cx.createLinearGradient(940,0,540,FALLOFF);
    g.addColorStop(0,'rgba(204,242,228,0.40)');
    g.addColorStop(0.55,'rgba(204,242,228,0.19)');
    g.addColorStop(1,'rgba(204,242,228,0.05)');
    cx.fillStyle=g; cx.fillRect(0,0,1080,FALLOFF);
    // the dust itself, a warped field rather than a gradient, so the column has grain in it
    for(let y=6;y<FALLOFF;y+=5){
      for(let x=R.x+140;x<R.x+R.w;x+=5){
        const n=TX.warp2(x/150,y/150,1.5,{octaves:3});
        if(n<0.12) continue;
        const a=Math.min(0.26,(n-0.12)*0.42)*(1-y/FALLOFF*0.72);
        cx.fillStyle='rgba(214,246,234,'+a.toFixed(3)+')';
        cx.fillRect(x,y,4,4);
      }
    }
    cx.restore();
  })();

  // ---- THE WHITEBOARD AND THE PROJECTED RECTANGLE.
  (function board(){
    // the board's own surface just outside the throw, at wax
    cx.fillStyle='rgba(152,205,180,0.92)';
    cx.fillRect(R.x-26,R.y-26,R.w+52,R.h+52);
    cx.strokeStyle='rgba(230,252,244,0.55)'; cx.lineWidth=2.4;
    cx.strokeRect(R.x-26.5,R.y-25.5,R.w+53,R.h+52);
    // the throw. A projected image in a lit room has no black point and no shadow, and that
    // washed-out low contrast IS the claim rather than a treatment of it.
    const g=cx.createLinearGradient(R.x+R.w,R.y,R.x+120,FALLOFF);
    g.addColorStop(0,'rgba(214,248,236,0.995)');
    g.addColorStop(0.48,'rgba(204,242,228,0.99)');
    g.addColorStop(1,'rgba(186,230,214,0.985)');
    cx.fillStyle=g; cx.fillRect(R.x,R.y,R.w,R.h);
    // the keystone edge, very slightly off square, because a real throw is
    cx.strokeStyle='rgba(236,254,246,0.80)'; cx.lineWidth=2;
    cx.beginPath();
    cx.moveTo(R.x+2,R.y+3); cx.lineTo(R.x+R.w-1,R.y);
    cx.lineTo(R.x+R.w-3,FALLOFF-2); cx.lineTo(R.x,FALLOFF-4); cx.closePath(); cx.stroke();
  })();

  // ---- THE HARD FALLOFF, and the room under it. The three expectations sit here, lit by nothing.
  (function underneath(){
    const g=cx.createLinearGradient(0,FALLOFF-6,0,FALLOFF+62);
    g.addColorStop(0,'rgba(152,205,180,0.86)');
    g.addColorStop(0.22,'rgba(40,84,98,0.92)');
    g.addColorStop(1,'rgba(11,38,52,1)');
    cx.fillStyle=g; cx.fillRect(0,FALLOFF-6,1080,68);
    cx.fillStyle='#0B2634'; cx.fillRect(0,FALLOFF+62,1080,1350-FALLOFF-62);
    // THE FLOOR BOUNCE. A shadow is a subtraction, so it needs a lit ground to be subtracted
    // from. The first build cast the tray onto a room measuring L* 1.5 and the gate said so:
    // there was nothing left to take away and the tray floated. The VCT under the front of the
    // room returns a weak bounce onto the wall, which is both true and what makes the contact
    // readable.
    const gb=cx.createLinearGradient(0,FALLOFF+70,0,1350);
    gb.addColorStop(0,'rgba(70,118,104,0)');
    gb.addColorStop(0.55,'rgba(70,118,104,0.26)');
    gb.addColorStop(1,'rgba(96,146,128,0.40)');
    cx.fillStyle=gb; cx.fillRect(0,FALLOFF+70,1080,1350-FALLOFF-70);
    // the marker tray in section, its rolled lip taking the last of the throw
    const Y=FALLOFF+22;
    cx.fillStyle='rgba(58,96,90,0.95)'; cx.fillRect(0,Y,1080,20);
    cx.strokeStyle='rgba(152,205,180,0.42)'; cx.lineWidth=2;
    cx.beginPath(); cx.moveTo(0,Y+1.2); cx.lineTo(1080,Y+1.2); cx.stroke();
    // THE UNDERSIDE IS THE DARKEST THING IN THE FRAME AND IT IS NOT BLACK. The deck's second law
    // says a room under a troffer ceiling has no L* 8 in it, and round 1 measured this strip at
    // L* 1.9, a full-width band the law forbade. rgb 8,28,40 sits near L* 10 and still reads as
    // the tray's own shadow against the room and the bounce below it.
    cx.fillStyle='rgba(8,28,40,0.96)'; cx.fillRect(0,Y+20,1080,14);
    const gs=cx.createLinearGradient(0,Y+34,0,Y+96);
    gs.addColorStop(0,'rgba(8,28,40,0.92)'); gs.addColorStop(1,'rgba(8,28,40,0)');
    cx.fillStyle=gs; cx.fillRect(0,Y+34,1080,62);
  })();

  // ---- THE WALL MEETS THE FLOOR under the expectations, a strip of receding tile between the
  // labels and the footer, so the bottom third is a room's bottom third rather than a void.
  (function floorBand(){
    const FY=1192, FB=1244;
    cx.save(); cx.beginPath(); cx.rect(0,FY,1080,FB-FY); cx.clip();
    const g=cx.createLinearGradient(0,FY,0,FB);
    g.addColorStop(0,'rgba(60,104,96,0.55)'); g.addColorStop(1,'rgba(40,78,74,0.45)');
    cx.fillStyle=g; cx.fillRect(0,FY,1080,FB-FY);
    cx.strokeStyle='rgba(8,28,40,0.55)'; cx.lineWidth=1.8;
    cx.beginPath(); cx.moveTo(0,FY+0.9); cx.lineTo(1080,FY+0.9); cx.stroke();
    for(let x=-300;x<1500;x+=96){ cx.beginPath(); cx.moveTo(540+(x-540)*0.4,FY); cx.lineTo(x,FB); cx.stroke(); }
    cx.beginPath(); cx.moveTo(0,FY+26); cx.lineTo(1080,FY+26); cx.stroke();
    cx.restore();
  })();

  // ============================================================ THE COUNTED ABSENCE
  //
  // EXACTLY SIX TERMS, EACH READ FROM computed.json. compute.py RAISES if any of them is non-zero,
  // so this frame cannot draw a zero the document does not support. A summary OMITS, which is not
  // the same as concealing, and no word on this frame says otherwise.
  const HITS=C.release_hits;
  const TERMS=Object.keys(HITS);
  if(TERMS.length!==6) throw new Error('slide-07: expected six searched terms, got '+TERMS.length);
  if(C.n_release_hits!==0) throw new Error('slide-07: the release is no longer silent');
  const zbox=document.getElementById('zeros');
  TERMS.forEach(function(t){
    const s=document.createElement('span');
    // THE COUNT LEADS. "artificial 0" reads as a label with a number after it and the zero is the
    // whole point of the frame, so the tally is set count first. It is also the form the aggregate
    // scanner reads as a computed count, which is what lets the figure be DECLARED with its
    // computation rather than left as a numeral no claim can reach.
    // The stem is printed as a stem. Round 2's reader took a bare 'technolog' for a typo.
    s.innerHTML='<b>'+HITS[t]+'</b> '+(t==='technolog' ? 'technolog(y)' : t);
    if(HITS[t]!==0) throw new Error('slide-07: '+t+' is not zero');
    zbox.appendChild(s);
  });

  // THE RELEASE'S OWN SENTENCE, and the two words the three expectations are inside of.
  const SENT=C.release_summary;
  const AM=C.and_more;
  if(SENT.indexOf(AM)<0) throw new Error('slide-07: the release sentence no longer ends in '+AM);
  document.getElementById('sentence').innerHTML =
    '"' + SENT.slice(0,SENT.lastIndexOf(AM)) + '<em>' + AM + '</em>' +
    SENT.slice(SENT.lastIndexOf(AM)+AM.length) + '"';

  // NO ACCUSATION APPEARS ON THIS FRAME. The dossier names the five words that would turn an
  // omission into a charge, and the frame refuses to render if one of them reached it.
  const BANNED=['buried','hidden','quietly','concealed','suppressed'];
  const page=document.body.innerText.toLowerCase();
  for(const b of BANNED) if(page.indexOf(b)>=0)
    throw new Error('slide-07: the word "'+b+'" is on this frame, which makes an omission into an accusation');

  document.getElementById('grain').style.backgroundImage='url('+TX.grainTile(256,30,SEED)+')';
  TX.fitText(document.getElementById('hook'),{min:56,max:92,maxLines:2});

  // THE BLOOM IS A FINISH AND NEVER A RESCUE. The value structure above is built and reviewed at
  // full contrast first. These three numbers are declared here rather than tuned until it looked
  // right, and they are the last thing that touches the canvas.
  const BLOOM={strength:0.30, threshold:0.74, radius:26};
  // THE SHADOW LIFT IS THE FRAME'S OWN ARGUMENT. A projected image in a lit room has no black
  // point, and the grade's contrast and filmic toe were crushing every dark this frame drew
  // back under L* 8, whatever value it was painted at: round 1 measured a p05 of 1.9, and a
  // tray underside repainted at L* 10 still came out at 6.7. So the lift is declared here,
  // beside the bloom, as a number the frame is held to rather than a look tuned by eye.
  const LIFT=[0.014,0.020,0.028];
  TXPOST.grade(cx,{bloom:BLOOM, lift:LIFT});
  window.__lift=LIFT;
  window.__bloom=BLOOM;

  document.body.setAttribute('data-encodes', JSON.stringify([
    {claim:"the lit rectangle reads differently from the room beneath the falloff",
     reads:"differ", a:[[300,560,480,300]], b:[[300,1000,480,240]]}
  ]));
  document.body.setAttribute('data-contacts', JSON.stringify([
    {what:"the marker tray under the board", shadow:[[300,FALLOFF+44,300,16]],
     ground:[[300,1276,300,16]]}
  ]));
  resolve(true);
});
</script>
