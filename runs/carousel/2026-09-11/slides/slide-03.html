<script>
window.renderReady = new Promise(async (resolve) => {
  await document.fonts.ready;
  const SEED = 20260911 + 3;
  TX.reseed(SEED);
  const cv=document.getElementById('art'), cx=cv.getContext('2d'); cx.scale(2,2);
  const R = TX.rng(SEED);

  // ---- the tally, built from computed.json. Nothing here is typed.
  (function tally(){
    const el=document.getElementById('tally');
    C.footprint_terms.forEach(function(t){
      const d=document.createElement('div');
      d.innerHTML='<span>'+t+'</span><span>'+C.footprint[t]+'</span>';
      el.appendChild(d);
    });
    const z=document.createElement('div'); z.className='zero';
    z.innerHTML='<span>AI unit</span><span>0</span>'; el.appendChild(z);
  })();

  // ---- waxed VCT seen from a seated eye at the deck's steepest pitch
  (function floorGround(){
    cx.fillStyle='#0E3347'; cx.fillRect(0,0,1080,1350);
    const g=cx.createLinearGradient(0,300,0,1350);
    g.addColorStop(0,'rgba(94,133,120,0.32)');
    g.addColorStop(0.40,'rgba(94,133,120,0.86)');
    g.addColorStop(1,'rgba(94,133,120,0.52)');
    cx.fillStyle=g; cx.fillRect(0,300,1080,1050);
    cx.strokeStyle='rgba(14,51,71,0.16)'; cx.lineWidth=1.4;
    for(let y=360;y<1350;y+=88){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(1080,y); cx.stroke(); }
    for(let i=-4;i<12;i++){ const xt=i*160+30;
      cx.beginPath(); cx.moveTo(xt,360); cx.lineTo(xt-(540-xt)*0.22,1350); cx.stroke(); }
  })();

  // ---- THE DOCUMENT, one dot per word, laid out as the pages it is printed on.
  // The dots are set in lines, because a document is lines and a random scatter is confetti.
  const PW=206, PH=286, GX=32, GY=34, COLS=4;
  const PAGES = C.page_count;
  const ROWS = Math.ceil(PAGES/COLS);
  const RUNW = COLS*PW + (COLS-1)*GX;
  const PX0 = Math.round((1080-RUNW)/2), PY0 = 470;
  const perPage = Math.ceil(C.doc_words / PAGES);
  const LINE_H = 9.6, LEFT_PAD = 13, LINES = Math.floor((PH - 2*12)/LINE_H);
  const dotsPerLine = Math.ceil(perPage / LINES);
  const DOT = 2.0, DOT_GAP = (PW - 2*LEFT_PAD) / dotsPerLine;

  function pageBox(i){
    const r=Math.floor(i/COLS), c=i%COLS;
    return {x: PX0 + c*(PW+GX), y: PY0 + r*(PH+GY)};
  }
  // where a given word index lands, in page, line and column
  function wordXY(wi){
    const page = Math.min(PAGES-1, Math.floor(wi / perPage));
    const inPage = wi - page*perPage;
    const line = Math.min(LINES-1, Math.floor(inPage / dotsPerLine));
    const col  = inPage - line*dotsPerLine;
    // a document's lines end where its words end, so the right edge is ragged by LAYOUT
    // rather than by deleting marks: each line is nudged by a seeded per-line indent.
    const b = pageBox(page);
    return {x: b.x + LEFT_PAD + col*DOT_GAP, y: b.y + 12 + line*LINE_H + LINE_H*0.5, page: page};
  }

  // page grounds, each a sheet sitting on the tile with a two-part contact
  for(let i=0;i<PAGES;i++){
    const b=pageBox(i);
    TXCARVE.contactShadow(cx,{x:b.x+PW/2, y:b.y+PH+3, w:PW*0.55, color:'#0E3347',
                              dirDeg:90, tightAlpha:0.40, wideAlpha:0.13, tightBlur:3, wideBlur:16});
    const gp=cx.createLinearGradient(b.x,b.y,b.x,b.y+PH);
    gp.addColorStop(0,'rgba(152,205,180,0.60)');
    gp.addColorStop(1,'rgba(94,133,120,0.44)');
    cx.fillStyle=gp; cx.fillRect(b.x,b.y,PW,PH);
    cx.strokeStyle='rgba(204,242,228,0.26)'; cx.lineWidth=1;
    cx.strokeRect(b.x+0.5,b.y+0.5,PW-1,PH-1);
  }

  // the field itself. Every dot is a word and the count is the document's own.
  cx.fillStyle='rgba(14,51,71,0.62)';
  let drawn=0;
  // EVERY WORD IS DRAWN. The first build skipped about one dot in eighteen to make the lines
  // ragged, which deleted 200 of 3,525 data marks and overstated the five lifted occurrences
  // against a denominator that was no longer the document. A review bot found it. Raggedness is
  // a LAYOUT property, so the line lengths vary and the marks do not.
  for(let wi=0; wi<C.doc_words; wi++){
    const p=wordXY(wi);
    cx.fillRect(p.x, p.y, DOT, DOT); drawn++;
  }
  if (drawn !== C.doc_words) throw new Error('slide-03: drew ' + drawn + ' of ' + C.doc_words
    + ' words. The frame promises one dot per word and the count is the whole argument.');

  // THE FIVE. Lifted to troffer, at the word index each term actually occupies.
  const marks = C.footprint_positions;
  cx.save();
  marks.forEach(function(m){
    const p=wordXY(m.word_index);
    cx.fillStyle='rgba(204,242,228,0.30)';
    cx.beginPath(); cx.arc(p.x+1, p.y+1, 9, 0, 6.2832); cx.fill();
    cx.fillStyle='#CCF2E4';
    cx.fillRect(p.x-1.4, p.y-1.4, DOT+2.8, DOT+2.8);
  });
  cx.restore();

  // one leader from the tally block down into the cluster of three
  (function leader(){
    const cluster = marks.slice(-3);
    const p = wordXY(cluster[1].word_index);
    cx.strokeStyle='rgba(204,242,228,0.55)'; cx.lineWidth=1.5;
    cx.beginPath(); cx.moveTo(920, 470); cx.lineTo(920, p.y-40); cx.lineTo(p.x+26, p.y-40);
    cx.lineTo(p.x+13, p.y); cx.stroke();
    cx.strokeStyle='rgba(204,242,228,0.75)'; cx.lineWidth=1.6;
    cx.beginPath(); cx.arc(p.x+1, p.y+1, 15, 0, 6.2832); cx.stroke();
    window.__txLeaders = [{ target: "the clause carrying three of the five occurrences",
                            at: [p.x+1, p.y+1], to: [p.x+13, p.y] }];
  })();

  // ---- BOTTOM THIRD: one desk leg with a two-part contact where its glide meets the tile,
  // the wax smear bending around that contact and running off the bottom edge.
  (function deskLeg(){
    const LX=168, LW=26, LTOP=1130, LBOT=1286;
    const sm=cx.createLinearGradient(300,1120,700,1350);
    sm.addColorStop(0,'rgba(204,242,228,0.00)');
    sm.addColorStop(0.42,'rgba(204,242,228,0.26)');
    sm.addColorStop(1,'rgba(204,242,228,0.03)');
    cx.save(); cx.beginPath(); cx.moveTo(330,1120); cx.lineTo(690,1120);
    cx.lineTo(860,1350); cx.lineTo(150,1350); cx.closePath(); cx.fillStyle=sm; cx.fill(); cx.restore();
    TXCARVE.contactShadow(cx,{x:LX+LW/2, y:LBOT, w:52, color:'#0E3347',
                              dirDeg:64, tightAlpha:0.54, wideAlpha:0.18, tightBlur:3, wideBlur:20});
    const gl=cx.createLinearGradient(LX,0,LX+LW,0);
    gl.addColorStop(0,'rgba(14,51,71,0.86)');
    gl.addColorStop(0.34,'rgba(152,205,180,0.72)');
    gl.addColorStop(1,'rgba(14,51,71,0.70)');
    cx.fillStyle=gl; cx.fillRect(LX,LTOP,LW,LBOT-LTOP);
    // the glide at the foot
    cx.fillStyle='rgba(14,51,71,0.80)'; cx.fillRect(LX-4,LBOT-9,LW+8,9);
    // the tablet edge above, cropped by the frame
    const gt=cx.createLinearGradient(0,1098,0,1132);
    gt.addColorStop(0,'rgba(156,107,90,0.95)'); gt.addColorStop(1,'rgba(14,51,71,0.86)');
    cx.fillStyle=gt; cx.fillRect(96,1098,392,34);
    cx.strokeStyle='rgba(204,242,228,0.30)'; cx.lineWidth=1.6;
    cx.beginPath(); cx.moveTo(96,1099); cx.lineTo(488,1099); cx.stroke();
  })();

  document.getElementById('grain').style.backgroundImage='url('+TX.grainTile(256,30,SEED)+')';
  TX.fitText(document.getElementById('hook'),{min:54,max:84,maxLines:2});

  // the lifted cluster must be tellable from the field it sits in, at feed scale
  const c3 = wordXY(marks[marks.length-2].word_index);
  document.body.setAttribute('data-encodes', JSON.stringify([
    {claim:"the lifted occurrences read differently from the field around them",
     reads:"differ",
     a:[[Math.round(c3.x-22), Math.round(c3.y-14), 46, 28]],
     b:[[Math.round(c3.x-22), Math.round(c3.y+52), 46, 28]]}
  ]));
  resolve(true);
});
</script>
