<script>
window.renderReady = new Promise(async (resolve) => {
  await document.fonts.ready;
  const SEED = 20260911 + 9;
  TX.reseed(SEED);
  const cv=document.getElementById('art'), cx=cv.getContext('2d'); cx.scale(2,2);

  // THE BREAK SITS ON THE DECK'S EYE LINE, 67px below the vertical centre. The library's named
  // failure for this atmosphere is the break landing on the centre and cutting the slide in half,
  // and that offset is the whole difference between a horizon and a division.
  const BREAK=742;
  if(BREAK===Math.round(1350/2)) throw new Error('slide-09: the break is at the vertical centre');

  // ---- ABOVE THE BREAK: the cold ceiling plane. Nothing below it in the deck is darker.
  (function above(){
    const g=cx.createLinearGradient(0,0,0,BREAK);
    g.addColorStop(0,'rgba(8,30,43,1)');
    g.addColorStop(0.58,'rgba(12,44,62,1)');
    g.addColorStop(1,'rgba(17,58,79,1)');
    cx.fillStyle=g; cx.fillRect(0,0,1080,BREAK);
    // the tee bar grid, receding toward the break so the plane has a direction
    for(let i=0;i<9;i++){
      const y=BREAK-(BREAK-26)*Math.pow(1-i/9,1.7);
      cx.strokeStyle='rgba(126,176,158,'+(0.05+0.012*i)+')'; cx.lineWidth=1.5;
      cx.beginPath(); cx.moveTo(0,y); cx.lineTo(1080,y); cx.stroke();
    }
    for(let x=-120;x<1260;x+=168){
      cx.strokeStyle='rgba(126,176,158,0.07)'; cx.lineWidth=1.4;
      cx.beginPath(); cx.moveTo(x,0); cx.lineTo(540+(x-540)*0.16,BREAK); cx.stroke();
    }
  })();

  // ---- THE BREAK ITSELF. Hard on top, soft underneath, which is what a norther front does and
  // is why the library keeps it for a frame about a boundary rather than for weather.
  (function front(){
    const g=cx.createLinearGradient(0,BREAK,0,BREAK+128);
    g.addColorStop(0,'rgba(204,242,228,0.96)');
    g.addColorStop(0.16,'rgba(176,216,194,0.92)');
    g.addColorStop(1,'rgba(152,205,180,0.99)');
    cx.fillStyle=g; cx.fillRect(0,BREAK,1080,128);
    cx.fillStyle='rgba(230,252,244,0.92)'; cx.fillRect(0,BREAK-2.5,1080,3);
  })();

  // ---- BELOW THE BREAK: the lit floor in raking tile, the joints receding.
  (function below(){
    const g=cx.createLinearGradient(0,BREAK+128,0,1350);
    g.addColorStop(0,'rgba(152,205,180,0.99)');
    g.addColorStop(0.42,'rgba(164,212,188,0.99)');
    g.addColorStop(1,'rgba(132,182,162,0.99)');
    cx.fillStyle=g; cx.fillRect(0,BREAK+128,1080,1350-BREAK-128);
    cx.save();
    cx.beginPath(); cx.rect(0,BREAK,1080,1350-BREAK); cx.clip();
    for(let i=0;i<13;i++){
      const y=BREAK+40+Math.pow(i/13,1.9)*(1350-BREAK);
      cx.strokeStyle='rgba(14,51,71,0.13)'; cx.lineWidth=1.4;
      cx.beginPath(); cx.moveTo(0,y); cx.lineTo(1080,y); cx.stroke();
    }
    for(let x=-400;x<1600;x+=142){
      cx.strokeStyle='rgba(14,51,71,0.11)'; cx.lineWidth=1.4;
      cx.beginPath(); cx.moveTo(540+(x-540)*0.30,BREAK); cx.lineTo(x,1350); cx.stroke();
    }
    cx.restore();
    // ONE DESK LEG'S TWO-PART CONTACT, and it stands in the clear band between the closing line
    // and the next step rather than under either of them. The first build put its foot at y 1176,
    // inside the reserve laid down for the next step, so the wash lifted the shadow and the ground
    // to within 0.3 L* of each other and the leg floated.
    TXCARVE.contactShadow(cx,{x:168,y:986,w:58,color:'#062330',
                              dirDeg:74,tightAlpha:0.62,wideAlpha:0.24,tightBlur:4,wideBlur:24});
    const gl=cx.createLinearGradient(152,0,186,0);
    gl.addColorStop(0,'rgba(14,51,71,0.86)');
    gl.addColorStop(0.42,'rgba(120,166,150,0.66)');
    gl.addColorStop(1,'rgba(14,51,71,0.80)');
    cx.fillStyle=gl; cx.fillRect(152,BREAK+96,34,986-BREAK-96);
  })();

  // ============================================================ THE CITATION AND THE CLOSE
  //
  // The instrument, named in full, with the date parsed from the item's own line by compute.py.
  document.getElementById('cite').innerHTML =
    'SECOND READING AND FINAL ADOPTION<br>'
    + 'TEXAS STATE BOARD OF EDUCATION &nbsp;<b>' + C.item_date_long + '</b>';

  // WHAT THIS RECORD KNOWS THAT A READER WOULD NOT, said plainly. A close that admits the filed
  // text is unread is not a hedge. It is the one thing worth reading this record for.
  document.getElementById('closing').textContent =
    'What was filed with the Texas Register has not been checked against the attachment the '
    + 'board acted on.';

  // THE SITE LINE IS AN ELEMENT IN THE SOURCE, not a string this script assembles. coherence_check
  // reads the slide FILE, so a footer built at render time is invisible to the one gate that
  // exists to prove every frame carries the brand's own URL.
  document.getElementById('tb').textContent = 'TEXAS AI DOCKET  NO. ' + C.deck;

  // THE BARE WORD IS NOT WHAT HAPPENED. The board took a second reading and a final adoption, and
  // "adopted" on its own loses the half of that which a reader would check.
  if(/\badopted\b/i.test(document.body.innerText))
    throw new Error('slide-09: the bare word "adopted" reached the close');
  // No date on this frame may be presented as a deadline, because the record has none.
  for(const w of ['deadline','comment by','closes','last day'])
    if(document.body.innerText.toLowerCase().indexOf(w)>=0)
      throw new Error('slide-09: "'+w+'" manufactures a door this record does not have');

  // A RESERVE UNDER EVERY LINE THAT SITS ON THE TILE. The floor below the break is built out of
  // raking joints, and a joint crossing a glyph band reads as a strikethrough at feed width. The
  // first build ran three of them through the closing line and three more through the next step.
  // This lays the floor's own colour back over the joints under the type, heavily feathered, so
  // it reads as the falloff a real floor has rather than as a plate. No joint is removed anywhere
  // it is not under a glyph, and nothing moves.
  TX.fitText(document.getElementById('hook'),{min:56,max:94,maxLines:3});
  function reserve(sel,rgb,a,pad,blur){
    document.querySelectorAll(sel).forEach(function(el){
      const r=el.getBoundingClientRect();
      if(!(r.width>1&&r.height>1)) return;
      cx.save(); cx.filter='blur('+(blur||24)+'px)';
      cx.fillStyle='rgba('+rgb+','+a+')';
      cx.fillRect(r.left-pad,r.top-pad,r.width+pad*2,r.height+pad*2);
      cx.restore();
    });
  }
  // Softer and wider than the first build's, which left four visible rectangular smudges. A
  // reserve that can be SEEN has stopped being lighting and become a patch.
  reserve('.closing,.next,.nslab','176,220,200',0.72,64,46);
  reserve('.tb,.src','176,220,200',0.66,48,38);
  reserve('.hook,.cite,.kick,.count','11,42,58',0.70,64,46);

  document.getElementById('grain').style.backgroundImage='url('+TX.grainTile(256,30,SEED)+')';

  window.__break=BREAK;
  document.body.setAttribute('data-encodes', JSON.stringify([
    {claim:"the cold plane above the break reads differently from the lit floor below it",
     reads:"differ", a:[[300,520,480,180]], b:[[300,900,480,180]]}
  ]));
  document.body.setAttribute('data-contacts', JSON.stringify([
    {what:"the desk leg on the tile", shadow:[[140,982,80,18]], ground:[[420,982,80,18]]}
  ]));
  resolve(true);
});
</script>
