<script>
window.renderReady = new Promise(async (resolve) => {
  await document.fonts.ready;
  const SEED = 20260911 + 8;
  TX.reseed(SEED);
  const cv=document.getElementById('art'), cx=cv.getContext('2d'); cx.scale(2,2);

  // THE DECK'S EYE LINE. Frames 8 and 9 both put a real horizontal on it, which is what turns a
  // structural law into something a reader can check by scrolling back.
  const HORIZON=742;
  // THE SILL CARRIES THE DATES, so its lit face has to be deep enough to hold all three rows.
  // The first build ran the third row off the face and into the return, and the gate measured
  // 1.2:1 on it. A figure a reader cannot read is not published.
  const SILL=1000;
  const FACE=1240;          // where the lit face ends and the return begins

  // ---- BEYOND THE GLASS: sky, then the bus loop, then the asphalt that does the work.
  (function outside(){
    const gs=cx.createLinearGradient(0,150,0,HORIZON);
    gs.addColorStop(0,'rgba(176,216,194,0.98)');
    gs.addColorStop(0.62,'rgba(200,232,216,0.99)');
    gs.addColorStop(1,'rgba(224,246,236,1)');
    cx.fillStyle=gs; cx.fillRect(0,0,1080,HORIZON);
    // the far treeline sitting ON the horizon, so the eye line is a real edge and not an idea
    cx.fillStyle='rgba(94,133,120,0.88)';
    cx.beginPath(); cx.moveTo(0,HORIZON);
    for(let x=0;x<=1080;x+=9){
      const n=TX.fbm2(x/230,4.1,{octaves:3});
      cx.lineTo(x,HORIZON-16-n*24);
    }
    cx.lineTo(1080,HORIZON); cx.closePath(); cx.fill();
    // the asphalt
    const ga=cx.createLinearGradient(0,HORIZON,0,SILL);
    ga.addColorStop(0,'rgba(168,208,192,0.99)');
    ga.addColorStop(0.45,'rgba(152,205,180,0.99)');
    ga.addColorStop(1,'rgba(120,166,150,0.99)');
    cx.fillStyle=ga; cx.fillRect(0,HORIZON,1080,SILL-HORIZON);
    // THE BUS LOOP, AND THE REASON IT IS THERE. Shimmer is a horizontal displacement, so it is
    // invisible on a surface that has no vertical edges to bend: the first build warped a smooth
    // asphalt gradient and nothing moved. Three buses and a shelter standing ON the horizon give
    // the warp something to act on, and they are what a school bus loop holds at 7:12 anyway.
    (function loop(){
      cx.fillStyle='rgba(64,100,92,0.94)';
      [[92,140,44],[300,168,50],[560,126,40],[762,150,46]].forEach(function(b){
        const x=b[0], w=b[1], h=b[2];
        cx.fillRect(x,HORIZON-h,w,h);
        cx.fillStyle='rgba(44,76,70,0.94)';
        cx.fillRect(x,HORIZON-h,w,Math.round(h*0.34));
        cx.fillStyle='rgba(64,100,92,0.94)';
      });
      // the shelter's posts, the thinnest verticals out there and the ones the heat bends most
      cx.fillStyle='rgba(50,84,78,0.92)';
      [960,1004,1048].forEach(function(x){ cx.fillRect(x,HORIZON-96,7,96); });
      cx.fillRect(950,HORIZON-102,112,9);
    })();
    // the bus loop kerb, the frame's ONE warm and the only thing out there that is not surface
    cx.fillStyle='rgba(156,107,90,0.92)'; cx.fillRect(0,HORIZON+58,1080,13);
    cx.fillStyle='rgba(112,74,62,0.90)'; cx.fillRect(0,HORIZON+71,1080,7);
    // lane paint, receding, which gives the asphalt a rate
    for(let i=0;i<6;i++){
      const y=HORIZON+104+i*26+i*i*4.2;
      cx.fillStyle='rgba(226,248,238,'+(0.26+0.040*i)+')';
      for(let k=0;k<4;k++) cx.fillRect(120+k*250+i*10, y, 92+i*16, 3+i*0.6);
    }
  })();

  // ============================================================ THE HEAT SHIMMER
  //
  // THIS IS THE FRAME THAT CARRIES TEXAS WITHOUT A PLACE NAME. A school year that opens in the
  // middle of August under a hundred degrees is a Texas fact, and shimmer is the one instrument
  // in the library that says so without a county, a coordinate or a locator map.
  //
  // WARP THE FIELD, NEVER THE GLYPHS. The library's named failure is shimmer touching type, so
  // this runs on the CANVAS only and every string on this frame is a DOM node in a separate
  // stratum with no shared transform. The amplitude is measured and asserted below.
  const AMP_CAP=6;
  let ampMax=0;
  (function shimmer(){
    const top=HORIZON-150, bot=SILL;
    const src=cx.getImageData(0,top*2,2160,(bot-top)*2);
    const out=cx.createImageData(src.width,src.height);
    for(let y=0;y<src.height;y++){
      const yy=top+y/2;
      // amplitude grows with height ABOVE the horizon, which is how rising air actually behaves
      const h=Math.max(0,(HORIZON-yy))/150;
      const grow=yy>HORIZON ? 0.34 : (0.34+0.66*h);
      const amp=AMP_CAP*grow*(yy>HORIZON?1:1);
      const n=TX.simplex2(yy/9.5, 3.7)*0.7 + TX.simplex2(yy/3.1, 11.3)*0.3;
      const dx=Math.round(n*amp*2);          // device px, canvas is at 2x
      if(Math.abs(dx)/2>ampMax) ampMax=Math.abs(dx)/2;
      for(let x=0;x<src.width;x++){
        const sxp=Math.min(src.width-1,Math.max(0,x+dx));
        const si=(y*src.width+sxp)*4, di=(y*src.width+x)*4;
        out.data[di]=src.data[si]; out.data[di+1]=src.data[si+1];
        out.data[di+2]=src.data[si+2]; out.data[di+3]=src.data[si+3];
      }
    }
    const t=cx.getTransform(); cx.setTransform(1,0,0,1,0,0);
    cx.putImageData(out,0,top*2); cx.setTransform(t);
  })();
  if(ampMax>AMP_CAP) throw new Error('slide-08: shimmer amplitude '+ampMax+' exceeds the '+AMP_CAP+'px cap');
  window.__shimmer={amp:ampMax, cap:AMP_CAP};

  // ---- THE GLAZING. Frame, mullion and the room's own troffers reflected as a faint double,
  // which is the second subject and what ties this frame back to slide 1 across the whole deck.
  (function glazing(){
    // the head is deep enough to carry the kicker and the counter inside the safe zone
    cx.fillStyle='rgba(78,116,104,0.99)';
    cx.fillRect(0,0,1080,150);                 // window head
    cx.fillStyle='rgba(94,133,120,0.99)';
    cx.fillRect(0,0,58,SILL); cx.fillRect(1022,0,58,SILL);
    cx.fillStyle='rgba(94,133,120,0.99)'; cx.fillRect(526,150,26,SILL-150);
    cx.strokeStyle='rgba(204,242,228,0.50)'; cx.lineWidth=2.2;
    cx.beginPath(); cx.moveTo(0,151.5); cx.lineTo(1080,151.5); cx.stroke();
    cx.beginPath(); cx.moveTo(527.5,150); cx.lineTo(527.5,SILL); cx.stroke();
    // THE REFLECTED FIXTURE DOUBLE, off-axis so it reads as reflection and not as a light, and on
    // the RIGHT half because on the left it sat behind the headline and read as a pale box
    // somebody had left under the type.
    cx.save(); cx.globalAlpha=0.26;
    [[600,232],[600,326]].forEach(function(p){
      const g=cx.createLinearGradient(0,p[1],0,p[1]+48);
      g.addColorStop(0,'rgba(230,252,244,0.95)');
      g.addColorStop(1,'rgba(204,242,228,0.10)');
      cx.fillStyle=g; cx.fillRect(p[0],p[1],330,48);
    });
    cx.restore();
  })();

  // ---- THE SILL, modelled across its depth. The window stop stands proud with a highlight on
  // its top arris, and the sill's return falls to slate underneath.
  (function sill(){
    // the window stop, standing proud with a highlight on its top arris
    cx.fillStyle='rgba(126,172,152,0.99)'; cx.fillRect(0,SILL,1080,18);
    cx.strokeStyle='rgba(240,255,248,0.88)'; cx.lineWidth=3;
    cx.beginPath(); cx.moveTo(0,SILL+1.5); cx.lineTo(1080,SILL+1.5); cx.stroke();
    // the lit face, deep enough to carry the dates and even enough to read them on
    const g=cx.createLinearGradient(0,SILL+18,0,FACE);
    g.addColorStop(0,'rgba(200,234,218,0.995)');
    g.addColorStop(0.52,'rgba(188,226,208,0.995)');
    g.addColorStop(1,'rgba(174,214,196,0.995)');
    cx.fillStyle=g; cx.fillRect(0,SILL+18,1080,FACE-SILL-18);
    // THE RETURN, and the sill's own cast shadow on the wall directly beneath it. The first
    // build declared a contact across the return's gradient, where the upper rect was LIGHTER
    // than the lower one, so the measured delta came back negative and the sill floated.
    cx.fillStyle='rgba(8,30,42,0.96)'; cx.fillRect(0,FACE,1080,26);
    const gs=cx.createLinearGradient(0,FACE+26,0,FACE+74);
    gs.addColorStop(0,'rgba(8,30,42,0.90)'); gs.addColorStop(1,'rgba(8,30,42,0)');
    cx.fillStyle=gs; cx.fillRect(0,FACE+26,1080,48);
    // the wall below, lit by the room's own troffers, which is the ground the shadow reads on
    const gw=cx.createLinearGradient(0,FACE+26,0,1350);
    gw.addColorStop(0,'rgba(70,116,104,0)');
    gw.addColorStop(0.62,'rgba(96,146,128,0.52)');
    gw.addColorStop(1,'rgba(120,170,150,0.66)');
    cx.fillStyle=gw; cx.fillRect(0,FACE+26,1080,1350-FACE-26);
  })();

  // ============================================================ THE DATES, ALL COMPUTED
  //
  // Every figure here is read from computed.json and none is typed on this frame. The year renders
  // in the house's own form rather than the document's hyphenated one, which is why the frame reads
  // C.school_year instead of carrying the quote.
  document.getElementById('hook').textContent =
    'Districts teach it from the school year that opens in ' + C.school_year_from + '.';
  const rows=[
    ['IMPLEMENTED',   C.school_year + ' school year'],
    ['EFFECTIVE',     C.effective_days + ' days after filing with the Texas Register'],
    ['CREDIT',        C.credit_words]
  ];
  const box=document.getElementById('dates');
  rows.forEach(function(r){
    const d=document.createElement('div'); d.className='row';
    const k=document.createElement('div'); k.className='rk'; k.textContent=r[0];
    const v=document.createElement('div'); v.className='rv'; v.textContent=r[1];
    d.appendChild(k); d.appendChild(v); box.appendChild(d);
  });
  // The document's own hyphenated year is a quote, and this frame is not quoting.
  if(document.body.innerText.indexOf(C.school_year_from+'-'+C.school_year_to)>=0)
    throw new Error('slide-08: the hyphenated school year reached a frame that is not quoting it');

  document.getElementById('grain').style.backgroundImage='url('+TX.grainTile(256,30,SEED)+')';
  TX.fitText(document.getElementById('hook'),{min:58,max:92,maxLines:3});

  document.body.setAttribute('data-encodes', JSON.stringify([
    {claim:"the warped asphalt band reads differently from the unwarped sill below it",
     reads:"differ", a:[[300,760,480,200]], b:[[300,1000,480,120]]}
  ]));
  document.body.setAttribute('data-contacts', JSON.stringify([
    {what:"the sill against the wall below it", shadow:[[300,FACE+4,300,18]],
     ground:[[300,1320,300,18]]}
  ]));
  resolve(true);
});
</script>
