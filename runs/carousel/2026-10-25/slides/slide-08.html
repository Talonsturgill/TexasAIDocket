<!doctype html>
<!-- 2026-10-25, frame 8 of 9. Archetype DOCUMENT. A material relief through txbench.js under the deck's light: a sheet of cotton bond with a raised notary seal ring and pressed signature lines over dark steel, its corner curling off the right edge, and below it a cast iron day rule from the notice to the deadline stop. The rule's length is the days from the notice to the deadline, read from figures.json. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>.dek { width:880px !important; }</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site" style="font-size:24px">texasaidocket.com</div>
<h1 class="hook" id="hook" style="line-height:1.02">A notarized answer was due October 12th</h1>
<p class="dek" data-follow="22">The developer's own utility files each response. A complete one carries a notarized attestation. A failure to respond is reported to the PUC and the Office of the&nbsp;Governor.</p>
<div class="lab" id="l1" style="font-size:24px">September 14th, the notice</div>
<div class="lab" id="l2" style="font-size:24px">October 12th, 5 p.m.</div>
<div class="lab" id="l3" style="font-size:24px">28 days</div>
<script>window.FIG = {"notice_to_due_days": 28};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-25-returnplate.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script>
window.renderReady = (async () => {
  const cx = await CH.bootFlat({ kicker: "The attestation", counter: "08 / 09", src: "c1 c19 c20 c21 c23", fit: { min: 66, max: 86, maxLines: 2 } });
  TX.reseed(20261025);
  /* THE FIGURE, from figures.json: the days from the notice to the deadline, at one px per day scale on the rule */
  const DAYS = FIG.notice_to_due_days, PXD = 25, R0 = 150, R1 = R0 + DAYS * PXD;
  const hookB = document.getElementById("hook").getBoundingClientRect();
  const dekB = document.querySelector(".dek").getBoundingClientRect();
  /* the sheet: a cotton bond page running off the right edge, its top right corner lifting */
  const SX = 330, SY = Math.round(dekB.bottom + 46), SB = 1048, SEAL = [760, SY + 0.52 * (SB - SY)];
  const RY = 1118, RH = 46;
  /* the sheet lies turned a few degrees on the desk, so it reads as a page put down and never as a panel */
  const TH = -0.035, CXS = 620, CYS = (SY + SB) / 2;
  const rot = (X, Y) => { const dx = X - CXS, dy = Y - CYS; return [CXS + dx * Math.cos(TH) + dy * Math.sin(TH), CYS - dx * Math.sin(TH) + dy * Math.cos(TH)]; };
  const inSheet = (X, Y) => { const q = rot(X, Y); return q[0] >= SX && q[1] >= SY && q[1] <= SB; };
  const inFolder = (X, Y) => { const dx = X - 600, dy = Y - (CYS + 26), c = Math.cos(0.05), sn = Math.sin(0.05), u = 600 + dx * c - dy * sn, v = CYS + 26 + dx * sn + dy * c; return u >= SX - 34 && v >= SY - 16 && v <= SB + 30; };
  function sheetH(X0, Y0) {
    const q = rot(X0, Y0), X = q[0], Y = q[1];
    let h = 18 - 3 * Math.max(0, 1 - Math.min(X - SX, Y - SY, SB - Y) / 4);
    const cdx = X - 1080, cdy = Y - SY, cd = Math.hypot(cdx, cdy);                      /* the corner lifts toward the top right */
    
    const r = Math.hypot(X - SEAL[0], Y - SEAL[1]);                                      /* the embossed seal: two rings and a bead row */
    if (r > 104 && r < 132) h += 11 * Math.sin((r - 104) / 28 * Math.PI);
    if (r > 70 && r < 98) { const a = Math.atan2(Y - SEAL[1], X - SEAL[0]); h += 3.2 * Math.max(0, Math.cos(a * 30)) * Math.sin((r - 70) / 28 * Math.PI); }   /* the crimp, radial ridges pressed into the paper */
    if (r < 52) h += 2.5 + 0.6 * Math.cos(Math.atan2(Y - SEAL[1], X - SEAL[0]) * 40) * Math.max(0, (r - 44) / 8);   /* the foil disc, its crimped rim */
    
    h += 0.08 * TX.simplex2(X * 0.9, Y * 0.9) + 0.04 * TX.simplex2(X * 1.8, Y * 1.8);   /* cotton fibre tooth, isotropic and faint */
    for (const ly of [SB - 120, SB - 70]) if (Math.abs(Y - ly) < 2.2 && X > SX + 50 && X < SX + 470) h -= 1.4;   /* pressed signature lines */
    for (let k = 0; k < 6; k++) { const ly = SY + 54 + k * 34; if (Math.abs(Y - ly) < 5 && X > SX + 50 && X < Math.min(SX + 420 + 90 * ((k * 37) % 3), SEAL[0] - 170)) h -= 0.7; }  /* greeked lines of type, unreadable */
    return h;
  }
  function h(X, Y) {
    if (Y >= RY && Y <= RY + RH) {                                                       /* the cast iron day rule */
      let r = 12;
      const d = X - R0;
      if (d >= 0 && d <= DAYS * PXD && Math.abs(d % PXD) < 1.6) r -= (Math.round(d / PXD) % 7 === 0 ? 3 : 1.6);
      if (Math.abs(X - R0) < 2.5) r -= 4;
      if (X > R1 - 12 && X < R1 + 12 && Y > RY + 2 && Y < RY + RH - 2) r = 60;          /* the raised stop at the deadline */
      return r;
    }
    /* a kraft folder under the sheet, turned the other way, so the sheet's edges cast onto it */
    if (inSheet(X, Y)) return sheetH(X, Y);
    if (inFolder(X, Y)) return 6 + 0.3 * TX.simplex2(X * 0.4, Y * 0.4);
    return 0.04 * TX.simplex2(X * 0.6, Y * 0.6);                                         /* dark steel desk */
  }
  function m(X, Y) {
    if (Y >= RY && Y <= RY + RH) return (X > R1 - 10 && X < R1 + 10) ? CH.M.BOLT : CH.M.IRON;
    if (inSheet(X, Y)) { const q = rot(X, Y), r = Math.hypot(q[0] - SEAL[0], q[1] - SEAL[1]); return r < 52 ? CH.M.BRASS : CH.M.PAPER; }   /* the seal is embossed in the paper itself, with a small brass foil disc at its centre, an answer returned */
    if (inFolder(X, Y)) return CH.M.COAT;
    return CH.M.STEEL;
  }
  const pool = (X, Y) => { if (Y >= RY - 4 && Y <= RY + RH + 4) return 0.95; const d = Math.hypot((X - SEAL[0] + 20) / 460, (Y - SEAL[1]) / 380), t = Math.max(0, Math.min(1, (d - 0.3) / 0.7)); return 1 - 0.85 * t * t * (3 - 2 * t); };
  const RTOP = SY - 70;
  const rep = TXBENCH.relief(cx, { x: 0, y: RTOP, w: 1080, h: 1350 - RTOP, scale: 2, height: h, material: m, keyMask: pool,
    albedo: (X, Y, mm) => {
      /* cotton bond is warm off-white with a fibre tooth, and the day rule's iron is lifted so its ticks read at feed size */
      if (mm === CH.M.BRASS) { const k = 1 + 0.05 * TX.simplex2(X * 0.5, Y * 0.5); return [0.72 * k, 0.50 * k, 0.21 * k]; }
      if (mm === CH.M.PAPER) { const k = 1 + 0.06 * TX.simplex2(X * 1.3, Y * 1.3) + 0.04 * TX.simplex2(X * 0.08, Y * 0.3); return [0.90 * k, 0.74 * k, 0.50 * k]; }
      const a = CH.albedo(X, Y, mm); if (Y >= RY && Y <= RY + RH) return [a[0] * 3.4, a[1] * 3.4, a[2] * 3.4]; return a; },
    spec: CH.SPEC, ambient: 0.04, diffuse: 1.1, ao: 1.0, shadow: 0.92, softness: 5, castLength: 260, visBlur: 4 });
  window.__relief = rep;
  cx.setTransform(2, 0, 0, 2, 0, 0);
  const place = (id, x, y) => { const el = document.getElementById(id); el.style.left = x + "px"; el.style.top = y + "px"; };
  place("l1", R0 - 6, RY - 40);
  const l2 = document.getElementById("l2"); place("l2", R1 - l2.getBoundingClientRect().width / 2, RY - 40);
  const l3 = document.getElementById("l3"); place("l3", (R0 + R1) / 2 - l3.getBoundingClientRect().width / 2, RY + RH + 10);
  /* the labels above the rule sit on the dark steel between the sheet and the rule */
  if (RY - 40 < SB + 6) throw new Error("the rule's labels would sit on the sheet");
  CH.post(cx, { a: 0.3, veil: 0.3, footWash: 0.5 });
  CH.knock(cx, [".dek", "#l1", "#l2", "#l3"], 0.4);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
