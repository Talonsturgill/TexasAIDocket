<!doctype html>
<!-- 2026-10-25, frame 9 of 9. Archetype FULL_BLEED. A spatial scene through txthree.js in the deck's lastLight world: the reverse of the cover, the return plate seen from 34 cm off the caliche behind its brass rows, the plugs large in the foreground and the open bores receding into the dark. The bore count and the plug count are read from figures.json. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>.dek { width:860px !important; }</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site" style="font-size:24px">texasaidocket.com</div>
<h1 class="hook" id="hook" style="line-height:1.02">ERCOT expects a report by December 10th</h1>
<p class="dek" data-follow="26">ERCOT says the report will set out conclusions from its own review, with the PUC. A case over a skipped survey is up to local officials, the Tribune reports. A bigger fine needs the Legislature, which meets in Austin in&nbsp;January.</p>
<script>window.FIG = {"facilities": 334, "submitted": 101, "never": 233};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-25-returnplate.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "What comes next", counter: "09 / 09", src: "c25 c26 c34 c36 c37", fit: { min: 72, max: 96, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 34, near: 0.02, far: 2000 });
  /* THE FIGURES, from figures.json: one bore per facility in the Tribune's records, a plug in each that returned a survey */
  /* the open bores beyond the brass are the facilities that never returned a survey, checked against the drawing */
  if (FIG.facilities - FIG.submitted !== FIG.never) throw new Error('the open bores no longer equal the facilities less the plugged');
  const plate = K.make('return_plate', { total: FIG.submitted + FIG.never, answered: FIG.submitted });
  /* the plate is turned so its north row, where the plugs stand, faces the declared light: the camera at the open
   * south end then looks into the seam across the open rows */
  const set = new THREE.Group(); set.rotation.y = TXDECK.deck().light.az * Math.PI / 180 + Math.PI * 0.62;
  set.add(plate); TXT.add(R, set);
  const local = (p) => new THREE.Vector3(p[0], p[1], p[2]).applyAxisAngle(new THREE.Vector3(0, 1, 0), set.rotation.y).toArray();
  set.updateMatrixWorld(true);
  TXT.sky(R);
  TXT.ground(R, { surface: 'caliche', size: 80, seed: 25 });
  const L = plate.userData.layout;
  const from = local([-0.06, 0.30, -L.d / 2 - 0.30]);
  const look = CH.aim(THREE, R, TXT, from, local([0.0, 0.06, -L.d / 2 + 0.55]), 560, 1010, 34);
  TXT.frame(R, { fov: 34, from, look });
  CH.warm(R, 0.3);
  { const spec = CH.rigSpec(W, 6, 4096); TXT.deckRig(R, spec, CH.rigOpts(local([0, 0, 0]), { distance: 30, shadowFar: 80, normalBias: 0.004 })); }
  CH.unacne(R, 0.004);
  TXT.contact(R, plate, { grit: false });
  TXT.stage(R, plate);
  TXT.weather(R, { grime: 0.3, height: 0.05, mottle: 0.25 });
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.4, veil: 0.5, veilH: 300, footWash: 0.54 });
  CH.knock(cx, [".dek"], 0.35);
  CH.knock(cx, [".tx-site"], 0.5);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
