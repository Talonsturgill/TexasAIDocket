<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#14100E}
  canvas#art{position:absolute;inset:0;width:1080px;height:1350px;display:block}
  .wrap{position:absolute;inset:0;width:1080px;height:1350px}
  .tscrim{position:absolute;left:0;top:0;width:1080px;height:530px;
    background:linear-gradient(to bottom,rgba(20,16,14,.95) 0%,rgba(20,16,14,.90) 56%,rgba(20,16,14,.50) 84%,rgba(20,16,14,0) 100%)}
  .fscrim{position:absolute;left:0;bottom:0;width:1080px;height:140px;
    background:linear-gradient(to bottom,rgba(20,16,14,0) 0%,rgba(20,16,14,.72) 48%,rgba(20,16,14,.96) 100%)}
  .mast{position:absolute;top:84px;left:80px;font-family:"JetBrains Mono",monospace;
    font-weight:500;font-size:26px;letter-spacing:.16em;color:#8C8478}
  h1{position:absolute;top:142px;left:80px;width:900px;margin:0;font-family:Fraunces,serif;
    font-weight:800;font-size:88px;line-height:1.04;color:#E8E1D4;letter-spacing:-.022em}
  .dek{position:absolute;top:352px;left:80px;width:840px;margin:0;font-family:Manrope,sans-serif;
    font-weight:500;font-size:29px;line-height:1.34;color:#B6ADA0}
  .lab{position:absolute;font-family:"JetBrains Mono",monospace;font-weight:500;
    letter-spacing:.10em;color:#E8E1D4;font-variant-numeric:tabular-nums;white-space:nowrap}
  .lab .pct{color:#CFC4E2}
  .foot{position:absolute;bottom:74px;left:80px;right:80px;display:flex;justify-content:space-between;
    gap:22px;white-space:nowrap;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
    letter-spacing:.05em;color:#8C8478;font-variant-numeric:tabular-nums}
</style></head>
<body>
<canvas id="art"></canvas>
<div class="wrap">
  <div class="tscrim" data-decorative></div>
  <div class="mast">TEXAS AI DOCKET</div>
  <h1>71 percent from one country.</h1>
  <p class="dek">A federal survey lists where the United States gets the rare earth compounds and metals it imports. Five sources, and one of them is most of it.</p>

  <div class="lab" id="l0" style="left:648px;top:846px;font-size:38px">CHINA <span class="pct">71%</span></div>
  <div class="lab" id="l1" style="left:96px;top:980px;font-size:26px">MALAYSIA <span class="pct">13%</span></div>
  <div class="lab" id="l2" style="left:378px;top:980px;font-size:26px">JAPAN <span class="pct">5%</span></div>
  <div class="lab" id="l3" style="left:566px;top:980px;font-size:26px">ESTONIA <span class="pct">5%</span></div>
  <div class="lab" id="l4" style="left:790px;top:980px;font-size:26px">OTHER <span class="pct">6%</span></div>

  <div class="fscrim" data-decorative></div>
  <div class="foot"><span>USGS MCS 2026</span><span>c17 c18</span><span class="tx-site">texasaidocket.com</span><span>01 / 09</span></div>
</div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script>
window.renderReady = (async () => {
  const W=1080,H=1350;
  const c=document.getElementById('art'); c.width=W*2; c.height=H*2;
  const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260905); const R=TX.rng(20260905);

  // ---- palette -------------------------------------------------------------------------
  const NIGHT='#14100E', BENCH='#2A2420', NEO='#B3A6D2', HAL='#F6ECD2';

  // ---- the bench, an oiled hard maple top under one lamp high and left -------------------
  // THE LAMP IS NEVER IN FRAME. Its position drives the falloff, the crest side of every
  // field and the lee side of every field, so all of that agrees by construction.
  const LAMPX=372, LAMPY=470, LAMPR=1180;

  g.fillStyle=NIGHT; g.fillRect(0,0,W,H);
  (function bench(){
    // THE 2x TRAP, AND IT IS NOT THE ONE THE SKILL FILE NAMES. putImageData IGNORES the canvas
    // transform. An ImageData built at 1080x1350 lands in the top-left QUARTER of a 2160x2700
    // backing store whatever scale(2,2) says, and the rest keeps the body background, which
    // renders as a hard edged rectangle down the middle of the frame. Measured here at x 520
    // as a step of 7 on values of 10 to 20 before it was found.
    //
    // So this buffer is built in DEVICE pixels and the design coordinate is derived, which is
    // the only arrangement where the bench covers the frame.
    const DW=W*2, DH=H*2;
    const im=g.createImageData(DW,DH), d=im.data;
    for(let py=0;py<DH;py++){
      const y=py*0.5;
      for(let px=0;px<DW;px++){
        const x=px*0.5;
        const dx=x-LAMPX, dy=y-LAMPY;
        let f=1-Math.min(1,Math.sqrt(dx*dx+dy*dy)/LAMPR);
        f=f*f;
        // maple grain, long axis running left to right, warped so it is not a comb
        const gy=TX.fbm2((x+2200)*0.0016,(y+900)*0.0180,4);
        const gr=TX.fbm2((x+50)*0.0009,(y+30)*0.0042,3);
        const grain=0.55*gy+0.45*gr;
        const v=8 + f*46 + grain*13*(0.35+f);
        const i=(py*DW+px)*4;
        d[i]=Math.max(0,Math.min(255,v*1.22));
        d[i+1]=Math.max(0,Math.min(255,v*1.03));
        d[i+2]=Math.max(0,Math.min(255,v*0.88));
        d[i+3]=255;
      }
    }
    g.save(); g.setTransform(1,0,0,1,0,0); g.putImageData(im,0,0); g.restore();
  })();

  // ---- the five fields ------------------------------------------------------------------
  // Areas come from out/2026-09-05/compute.py, which parses the five figures out of c18's own
  // quote. Radius goes as the SQUARE ROOT of the share, because a stipple field's visual
  // weight is its area. A radius drawn proportional to the share would overstate the 71 by
  // the square of its lead, which is the one way this frame could lie with a true number.
  const FIELDS=[
    {n:'China',   pct:71, cx:330, cy:790,  r:282.09, part:11500},
    {n:'Malaysia',pct:13, cx:176, cy:1126, r:120.71, part:2106},
    {n:'Japan',   pct:5,  cx:434, cy:1132, r:74.86,  part:810},
    {n:'Estonia', pct:5,  cx:624, cy:1132, r:74.86,  part:810},
    {n:'Other',   pct:6,  cx:846, cy:1128, r:82.00,  part:972}
  ];

  function repose(cx,cy,r,seed){
    // The boundary is the material's own angle of repose, not a circle and never a rectangle.
    // A rectangle here would read as a bar and the frame would have published a chart.
    const pts=[], N=176;
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2;
      const w=TX.fbm2(Math.cos(a)*0.62+seed, Math.sin(a)*0.62+seed, 2);
      const rr=r*(0.92+0.15*w);
      pts.push([cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*0.62]);
    }
    return pts;
  }

  function drawField(f,idx){
    const pts=repose(f.cx,f.cy,f.r,idx*7.3);
    // lee shadow first, offset away from the lamp, so the field sits in the bench. Drawn with
    // shadowBlur rather than ctx.filter, because a filter layer's bounds rendered as a visible
    // step in the dark half of this frame.
    g.save();
    g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
    g.closePath();
    g.shadowColor='rgba(0,0,0,0.66)'; g.shadowBlur=26; g.shadowOffsetX=17; g.shadowOffsetY=14;
    g.fillStyle='rgba(0,0,0,0.9)'; g.fill();
    g.restore();

    // the powder itself, stippled. Every particle is lit from the lamp, so the crest of the
    // heap is bright and the lee falls away, which is what makes it a mass and not a blob.
    g.save();
    g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
    g.closePath(); g.clip();
    const cr=g.createRadialGradient(f.cx-f.r*0.30,f.cy-f.r*0.34,f.r*0.06,f.cx,f.cy,f.r*1.12);
    cr.addColorStop(0,'#CFC4E2'); cr.addColorStop(0.52,NEO); cr.addColorStop(1,'#5E5570');
    g.fillStyle=cr; g.fill();
    for(let i=0;i<f.part;i++){
      const a=R()*Math.PI*2, rad=Math.sqrt(R())*f.r;
      const x=f.cx+Math.cos(a)*rad, y=f.cy+Math.sin(a)*rad*0.62;
      // grain brightness follows the lamp direction across the heap
      const t=1-Math.min(1,(Math.hypot(x-(f.cx-f.r*0.30), (y-(f.cy-f.r*0.34))*1.6))/(f.r*1.5));
      const b=0.20+0.80*t*t;
      g.fillStyle='rgba('+Math.round(150+95*b)+','+Math.round(140+90*b)+','+Math.round(175+75*b)+','+(0.16+0.5*b)+')';
      const s=0.7+R()*1.5;
      g.fillRect(x,y,s,s);
    }
    g.restore();
  }
  FIELDS.forEach(drawField);

  // The frame reports what it drew, so the acceptance items are checked against a measurement
  // rather than against an opinion.
  window.__txProbe={
    lamp:{x:LAMPX,y:LAMPY},
    fields:FIELDS.map(f=>({name:f.n,pct:f.pct,particles:f.part,r:f.r})),
    biggest_area_exceeds_rest: (282.09*282.09) > (120.71*120.71+74.86*74.86+74.86*74.86+82*82)
  };
})();
</script>
</body></html>
