<!doctype html>
<!-- 2026-10-01, frame 7 of 9. Archetype FULL_BLEED. RENDERED through txthree.js in the deck's blueHour world. KEPT, CLOSE. One plate reader at its own height on a Hill Country road, the camera head on and its IR ring lit under the panels, the lamp far down the road. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  .tx-site { font-size:24px; }
  .dek { width:920px; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Kyle kept its contract, 6 to 1.</h1>
<p class="dek" data-follow="30">Its $205,000 grant for 2026 had not arrived, the Tribune reported. Of that, $80,000 would help pay for 32 Flock cameras.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-01-plates.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await PL.boot(THREE, TXT, initKit, { kicker: "Kept without the grant", counter: "07 / 09", src: "c8 c9", fit: { min: 96, max: 128, maxLines: 2 } });
const FIG = {"kyle_cameras": 32};

  /* KEPT, CLOSE. The one place the deck comes in to the object: a single plate reader on a Hill
   * Country road in Kyle, seen at its own height from the verge, the camera head switched on with
   * its IR ring lit under the two panels, the panels against the sky, the road and live oak below
   * at the horizon and the lamp far down the road on the key side. Behind it the rest of the 32 recede in a line into the haze. */
  const R = PL.stage(TXT, gl, W, { fov: 40, near: 0.05, far: 5000 });
  const pole = PL.pole(K, { yaw: -Math.PI / 2, face: 0, seed: 11, ir: 0.6 });
  pole.position.set(0, 0, 0); TXT.add(R, pole); TXT.contact(R, pole, { opacity: 0.8 });
  /* the rest of the kyle_cameras behind it, one pole per camera, receding into the haze in a line,
   * so the close camera stands at the head of the count the grant was for */
  let drawn = 1;
  for (let i = 1; i < FIG.kyle_cameras; i++) {
    const s = 10 + i * 9, p = PL.pole(K, { yaw: -Math.PI / 2, face: 0, seed: 11 + i });
    p.position.set(-0.51 * s - 2.8, 0, -0.86 * s + 1.6); TXT.add(R, p); if (i < 8) TXT.contact(R, p, { opacity: 0.6 }); drawn++;
  }
  PL.lane(K, R, TXT, [-200, 5.4], { length: 900, gravel: 0x5f5a50 });
  PL.lamp(K, R, TXT, [-34, -30], 0.5, { lit: 3.4, pool: 90 });
  PL.trees(K, R, TXT, [[-60, -48, 'live_oak', 3, 11], [-20, -64, 'live_oak', 5, 13], [24, -52, 'ashe_juniper', 4, 9], [60, -70, 'live_oak', 6, 12], [-110, -60, 'ashe_juniper', 8, 9], [110, -45, 'live_oak', 7, 11], [-150, -40, 'live_oak', 9, 12]]);
  for (let x = -160; x < 160; x += 20) { const f = K.make('barbed_wire_fence', { length: 20 }); f.position.set(x + 10, 0, -14); TXT.add(R, f); }
  TXT.frame(R, { from: [2.9, 3.0, 4.9], look: [0, 4.1, 0] });
  TXT.sky(R);
  TXT.deckRig(R, W.rig, { target: [0, 0, 0], distance: 40, shadowFar: 120, normalBias: 0.04 });
  TXT.ground(R, { surface: 'grass', color: 0x5c6450, size: 6000, seed: 17 });
  TXT.scatter(R, { kind: 'grass', count: 9000, area: [-80, -40, 80, 2.6], avoid: [[-0.8, -0.8, 0.8, 0.8]], seed: 7, scale: [0.16, 0.32], colors: [0x9a9474, 0x8f8a6a, 0xa49c7a] });
  TXT.weather(R, { grime: 0.4 });
  const cx = PL.develop(await TXT.snapshot(R), gl);

  PL.post(cx, { a: 0.42 });
  TXDECK.finish(cx);
  window.__txDrawn = { poles: drawn };
  return true;
})();
</script>
</body>
</html>
