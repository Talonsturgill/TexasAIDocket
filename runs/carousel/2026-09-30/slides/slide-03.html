<!doctype html>
<!-- 2026-09-30, frame 3 of 9. Archetype FIGURE_SCALE. RENDERED through txthree.js in the deck's overcast world. A block of one hundred desks on the practice field, ten by ten, two readers in bluebonnet at a seeded quarter of them, the rest alone with screens lit, the school wing beyond. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#D7D9DA; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:150px; width:900px; font-family:"Fraunces", serif; font-weight:800;
          line-height:0.96; letter-spacing:-0.01em; color:#12131A; font-variation-settings:"opsz" 144; z-index:10; }
  .dek  { position:absolute; left:82px; width:860px; font-size:31px; font-weight:600; line-height:1.38; color:#1E2028; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#111216; white-space:nowrap; z-index:20; }
  .hook .num { font-family:"Manrope", sans-serif; font-weight:800; letter-spacing:-0.02em; font-size:1em; }
  .hook, .dek, .tx-site, .kick, .count, .src { text-shadow:0 0 2px rgba(240,242,242,0.35), 0 1px 10px rgba(240,242,242,0.25); }
  .tx-site, .src { text-shadow:0 0 3px rgba(240,242,242,0.55), 0 1px 12px rgba(240,242,242,0.4); }

</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">About <span class="num">75%</span> keep the machine's score.</h1>
<p class="dek" data-follow="30">In the agency's own chart the engine sets the score of record on about 75% of answers. Two people read the rest. A person's score is the one that counts.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-30-firstreader.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "The score of record", counter: "03 / 09", src: "c13 c31 c3 DRAWN", ink: '#111216' });
  TX.fitText(document.getElementById("hook"), { min: 80, max: 104, maxLines: 2 });
  FR.follow();
  const TXT = init(THREE), K = initKit(THREE, TXT), F = FR, gl = F.glCanvas();
  F.installKit(K, THREE, TXT);
  const W = TXT.deckWorld();
const FIG = {"per100_engine": 75, "per100_people": 25};

  const R = TXT.setup(gl, { w: 1080, h: 1350, fog: [W.haze, W.fogDensity], exposure: W.exposure, tone: W.tone, fov: 36, near: 0.1, far: 4000 });
  /* THE SHARE. A block of one hundred desks on the practice field, ten by ten. Two readers are at
   * per100_people of them, drawn as the far left five by five so one in four reads as a quarter,
   * and per100_engine stand alone with their screens lit. The counts are asserted. */
  const N = FIG.per100_engine + FIG.per100_people, P = 1.6, x0 = -7.2, z0 = -18;
  /* the attended share drawn as one quarter of the square, the far left five by five: the near
   * quarter swelled to half the block in perspective at thumb size, the far one reads as a quarter */
  const read = new Set(); for (let i = 0; i < N; i++) { const c = i % 10, r = Math.floor(i / 10); if (c < 5 && r >= 5) read.add(i); }
  const field = F.field(K, THREE, TXT, { count: N, cols: 10, pitch: [P, P], origin: [x0, z0], near: () => true });
  TXT.add(R, field);
  let readers = 0;
  /* two people at each attended desk, because a routed answer is read twice (c31): one seated at
   * the screen and one leaning in at its side, both turned to it */
  field.userData.units.forEach(([x, z], i) => {
    if (!read.has(i)) return;
    F.attend(K, { x, z, rotY: 0 }, { seed: 30 + i * 2, side: i % 2 ? 1 : -1, detail: z < z0 - 1 ? 'low' : 'full' })
      .forEach((p) => { TXT.add(R, p); TXT.contact(R, p); readers++; });
  });
  if (read.size !== FIG.per100_people || field.userData.drawn - read.size !== FIG.per100_engine) throw new Error('split drawn wrong');
  F.campus(K, THREE, TXT, R, {});
  /* the school's drive beside the wing: a pickup and two sedans parked on it, shrubs along the front */
  const drive = K.make('road', { length: 40, lanes: 2, sidewalk: true }); drive.position.set(-22, 0, -76.5); TXT.add(R, drive);
  [['pickup', 0x7a7f86, -31], ['sedan', 0x8e2f2a, -24], ['sedan', 0xc9ccd0, -17.5]].forEach(([m, c, x], i) => { const v = K.make(m, { seed: 5 + i, color: c }); v.position.set(x, 0, -75.4); v.rotation.y = Math.PI / 2; TXT.add(R, v); TXT.contact(R, v); });
  for (let i = 0; i < 6; i++) { const sh = K.make('shrub', { seed: 3 + i }); sh.position.set(-16 + i * 6.5, 0, -84.6); TXT.add(R, sh); TXT.contact(R, sh); }
  TXT.frame(R, { from: [3, 7.5, 13], look: [-0.5, 6.3, -40] });
  TXT.sky(R);
  TXT.deckRig(R, W.rig, { target: [0, 0, -25], distance: 60, shadowFar: 140, normalBias: 0.04 });
  TXT.ground(R, { surface: 'grass', color: F.STRAW, size: 6000, seed: 27 });
  F.grass(TXT, R, { count: 8000, area: [-16, -40, 16, 4], scale: [0.07, 0.14], seed: 31 });
  TXT.weather(R, { grime: 0.35 });
  const cx = F.develop(await TXT.snapshot(R), gl);
  F.post(cx, { a: 0.24, type: ['.kick', '.count', '.hook', '.dek'] });
  TXDECK.finish(cx);
  window.__txDrawn = { desks: field.userData.drawn, withReaders: read.size, alone: field.userData.drawn - read.size, readers: readers };

  return true;
})();
</script>
</body>
</html>
