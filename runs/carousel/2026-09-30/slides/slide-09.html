<!doctype html>
<!-- 2026-09-30, frame 9 of 9. Archetype FULL_BLEED. RENDERED through txthree.js in the deck's overcast world. THE CLOSE. Frame 1's desk and camera with the parent standing at its side, leaning over it and reading the screen. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#D7D9DA; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:150px; width:900px; font-family:"Fraunces", serif; font-weight:800;
          line-height:0.96; letter-spacing:-0.01em; color:#12131A; font-variation-settings:"opsz" 144; z-index:10; }
  .dek  { position:absolute; left:82px; width:860px; font-size:31px; font-weight:600; line-height:1.38; color:#1E2028; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#111216; white-space:nowrap; z-index:20; }
  .hook .num { font-family:"Manrope", sans-serif; font-weight:800; letter-spacing:-0.02em; font-size:1em; }
  .hook, .dek, .tx-site, .kick, .count, .src { text-shadow:0 0 2px rgba(240,242,242,0.35), 0 1px 10px rgba(240,242,242,0.25); }
  .tx-site, .src { text-shadow:0 0 3px rgba(240,242,242,0.55), 0 1px 12px rgba(240,242,242,0.4); }

</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Ask the district for a rescore.</h1>
<p class="dek" data-follow="30">District testing staff request it for a fee, inside a window set in the agency's Calendar of Events. If the score changes, the fee is waived.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-30-firstreader.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "What a family can do", counter: "09 / 09", src: "c9 c11 c35 DRAWN", ink: '#111216' });
  TX.fitText(document.getElementById("hook"), { min: 96, max: 128, maxLines: 2 });
  FR.follow();
  const TXT = init(THREE), K = initKit(THREE, TXT), F = FR, gl = F.glCanvas();
  F.installKit(K, THREE, TXT);
  const W = TXT.deckWorld();

  /* THE HOME CAMERA, shared exactly by frames 1, 7 and 9: seated eye behind the desk's empty seat,
   * looking north over it to the laptop and past it to the school wing 92 m out. */
  const HOME = { from: [-0.9, 1.02, 3.3], look: [0.1, 1.8, -8] };
  const DESK = { at: [-0.45, -2.35], rotY: 0.55 };

  const R = TXT.setup(gl, { w: 1080, h: 1350, fog: [W.haze, W.fogDensity], exposure: W.exposure, tone: W.tone, fov: 34, near: 0.05, far: 4000 });
  /* THE CLOSE. Frame 1's desk and camera, and now the parent leans over it and reads the screen. */
  const desk = F.desk(K, { seed: 7 }); desk.position.set(DESK.at[0], 0, DESK.at[1]); desk.rotation.y = DESK.rotY; TXT.add(R, desk); TXT.contact(R, desk);
  /* the parent stands at the desk's side, leaning over it and reading the lit screen, the same
   * parent as frame 8 in her own shirt, not the accent the scorers wear */
  const parent = F.attend(K, { x: DESK.at[0], z: DESK.at[1], rotY: DESK.rotY }, { sit: false, side: 1, gap: 0.5, make: (pose) => F.parent(K, { pose }) })[0];
  /* she stands a step toward the seat, so she looks down onto the screen's face and never over the lid's back */
  { const c = Math.cos(DESK.rotY), s2 = Math.sin(DESK.rotY); parent.position.x += 0.1 * s2; parent.position.z += 0.1 * c;
    const lp = new THREE.Vector3(); desk.updateMatrixWorld(true); desk.userData.laptop.getWorldPosition(lp); parent.rotation.y = Math.atan2(lp.x - parent.position.x, lp.z - parent.position.z); }
  TXT.add(R, parent); TXT.contact(R, parent);
  F.campus(K, THREE, TXT, R, { flagScale: 0.8 });
  /* the same campus as frame 1, and a pickup the parent drove, parked on the field's edge road */
  const bus9 = K.make('school_bus', { seed: 2, stopArm: false }); bus9.position.set(-30, 0, -70); bus9.rotation.y = Math.PI / 2; TXT.add(R, bus9); TXT.contact(R, bus9);
  const truck9 = K.make('pickup', { seed: 7, color: 0x6a4b3a }); truck9.position.set(-11, 0, -26); truck9.rotation.y = 1.2; TXT.add(R, truck9); TXT.contact(R, truck9);
  const bench9 = K.make('bench', { length: 1.8 }); bench9.position.set(-7.5, 0, -14); bench9.rotation.y = 0.3; TXT.add(R, bench9); TXT.contact(R, bench9);
  TXT.frame(R, HOME);
  TXT.sky(R);
  TXT.deckRig(R, W.rig, { target: [0, 0, -2], distance: 40, shadowFar: 120, normalBias: 0.04 });
  TXT.ground(R, { surface: 'grass', color: F.STRAW, size: 6000, seed: 21 });
  F.grass(TXT, R, { count: 14000, area: [-14, -40, 14, 3.5], avoid: [[-1.25, -3.15, 0.6, -1.2], [-2.2, 1.2, 2.4, 3.4]], scale: [0.06, 0.12] });
  TXT.weather(R, { grime: 0.35 });
  const cx = F.develop(await TXT.snapshot(R), gl);
  F.post(cx, { a: 0.22, type: ['.kick', '.count', '.hook', '.dek'] });
  TXDECK.finish(cx);
  window.__txDrawn = { desks: 1, readers: 1 };

  return true;
})();
</script>
</body>
</html>
