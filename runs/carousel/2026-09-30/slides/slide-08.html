<!doctype html>
<!-- 2026-09-30, frame 8 of 9. Archetype OBJECT_AND_CAPTION. RENDERED through txthree.js in the deck's overcast world. The school's covered walkway to its front doors seen from the lawn, a parent walking under it toward the entrance. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#D7D9DA; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:150px; width:900px; font-family:"Fraunces", serif; font-weight:800;
          line-height:0.96; letter-spacing:-0.01em; color:#12131A; font-variation-settings:"opsz" 144; z-index:10; }
  .dek  { position:absolute; left:82px; width:740px; font-size:31px; font-weight:600; line-height:1.38; color:#1E2028; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#111216; white-space:nowrap; z-index:20; }
  .hook .num { font-family:"Manrope", sans-serif; font-weight:800; letter-spacing:-0.02em; font-size:1em; }
  .hook, .dek, .tx-site, .kick, .count, .src { text-shadow:0 0 2px rgba(240,242,242,0.35), 0 1px 10px rgba(240,242,242,0.25); }
  .tx-site, .src { text-shadow:0 0 3px rgba(240,242,242,0.55), 0 1px 12px rgba(240,242,242,0.4); }

</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Start with the district.</h1>
<p class="dek" data-follow="30">A rescore can start with a parent or guardian's concern about a score. Rescores are read by people.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-30-firstreader.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "A concern about a score", counter: "08 / 09", src: "c12 c10 DRAWN", ink: '#111216' });
  TX.fitText(document.getElementById("hook"), { min: 84, max: 112, maxLines: 2 });
  FR.follow();
  const TXT = init(THREE), K = initKit(THREE, TXT), F = FR, gl = F.glCanvas();
  F.installKit(K, THREE, TXT);
  const W = TXT.deckWorld();

  const R = TXT.setup(gl, { w: 1080, h: 1350, fog: [W.haze, W.fogDensity], exposure: W.exposure, tone: W.tone, fov: 36, near: 0.1, far: 4000 });
  /* THE DOOR. The school's covered walkway to its front entrance seen from the lawn to its south
   * east, the parent walking under it toward the doors, the flagpole beside the entry walk. The
   * walkway's line is read off the kit school's own layout: posts 88 m north of the field's desk. */
  const C = F.campus(K, THREE, TXT, R, { oaks: true });
  /* the covered entry walk the kit school's front lacks at its doors, built out from the vestibule */
  F.canopy(K, THREE, TXT, R, { from: [-9.5, -88.6], len: 15, w: 3.2 });
  const parent = F.parent(K, { pose: 'walk' });
  parent.position.set(-9.1, 0, -75.8); parent.rotation.y = Math.PI + 0.05; TXT.add(R, parent); TXT.contact(R, parent);
  const crape = K.make('crape_myrtle', { seed: 3 }); crape.position.set(-17, 0, -76); TXT.add(R, crape); TXT.contact(R, crape);
  const bus8 = K.make('school_bus', { seed: 9, stopArm: true }); bus8.position.set(14, 0, -70.5); bus8.rotation.y = Math.PI / 2; TXT.add(R, bus8); TXT.contact(R, bus8);
  for (let i = 0; i < 5; i++) { const sh = K.make('shrub', { seed: 20 + i }); sh.position.set(-27 + i * 3.4, 0, -85.6); TXT.add(R, sh); TXT.contact(R, sh); }
  TXT.frame(R, { from: [-5.2, 1.6, -56], look: [-9.9, 5.6, -89] });
  TXT.sky(R);
  TXT.deckRig(R, W.rig, { target: [0, 0, -88], distance: 50, shadowFar: 120, normalBias: 0.04 });
  TXT.ground(R, { surface: 'grass', color: F.STRAW, size: 6000, seed: 23 });
  F.grass(TXT, R, { count: 5000, area: [-26, -84, 16, -50], avoid: [[-11.7, -92, -7.3, -72]], scale: [0.06, 0.12], seed: 29 });
  TXT.weather(R, { grime: 0.35 });
  const cx = F.develop(await TXT.snapshot(R), gl);
  F.post(cx, { a: 0.22, type: ['.hook', '.dek'] });
  TXDECK.finish(cx);

  return true;
})();
</script>
</body>
</html>
