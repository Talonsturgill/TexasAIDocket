<!doctype html>
<!-- 2026-09-30, frame 7 of 9. Archetype FULL_BLEED. RENDERED through txthree.js in the deck's overcast world. THE TURN. Frame 1's camera and field, filled with one desk per student credited in the fall review, rows running to the school, one content expert rereading at a desk in the near rows. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#D7D9DA; }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:150px; width:900px; font-family:"Fraunces", serif; font-weight:800;
          line-height:0.96; letter-spacing:-0.01em; color:#12131A; font-variation-settings:"opsz" 144; z-index:10; }
  .dek  { position:absolute; left:82px; width:860px; font-size:31px; font-weight:600; line-height:1.38; color:#1E2028; z-index:10; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace;
             font-size:24px; letter-spacing:0.07em; line-height:1.5; color:#111216; white-space:nowrap; z-index:20; }
  .hook .num { font-family:"Manrope", sans-serif; font-weight:800; letter-spacing:-0.02em; font-size:1em; }
  .hook, .dek, .tx-site, .kick, .count, .src { text-shadow:0 0 2px rgba(240,242,242,0.35), 0 1px 10px rgba(240,242,242,0.25); }
  .tx-site, .src { text-shadow:0 0 3px rgba(240,242,242,0.55), 0 1px 12px rgba(240,242,242,0.4); }
  .tx-site, .src { color:#EEF0F0 !important; text-shadow:0 0 3px rgba(20,22,20,0.65), 0 1px 12px rgba(20,22,20,0.5) !important; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">The agency says the engine scored none of the regraded answers.</h1>
<p class="dek" data-follow="30">About 27,200 students got more credit on the reading test after content experts reread short typed answers, like "ferst" for "first." That says nothing about how often the engine's own scores would change.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-09-30-firstreader.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  await document.fonts.ready;
  TXLAYOUT.mount(document.body, { kicker: "The human reread", counter: "07 / 09", src: "c20 c19 c21 c23 c22 DRAWN", ink: '#111216' });
  TX.fitText(document.getElementById("hook"), { min: 84, max: 112, maxLines: 2 });
  FR.follow();
  const TXT = init(THREE), K = initKit(THREE, TXT), F = FR, gl = F.glCanvas();
  F.installKit(K, THREE, TXT);
  const W = TXT.deckWorld();

  /* THE HOME CAMERA, shared exactly by frames 1, 7 and 9: seated eye behind the desk's empty seat,
   * looking north over it to the laptop and past it to the school wing 92 m out. */
  const HOME = { from: [-0.9, 1.02, 3.3], look: [0.1, 1.8, -8] };
  const DESK = { at: [-0.45, -2.35], rotY: 0.55 };
const FIG = {"students_credited": 27200};

  const R = TXT.setup(gl, { w: 1080, h: 1350, fog: [W.haze, W.fogDensity], exposure: W.exposure, tone: W.tone, fov: 34, near: 0.05, far: 4000 });
  /* THE TURN. Frame 1's field and camera, filled: one desk per student the agency said received
   * more credit, 425 across and the rows running north to the school's walk. Frame 1's own desk is
   * in the front row. The count is exact and the render reports it. */
  const COLS = 425, P = [1.1, 1.15];
  const field = F.field(K, THREE, TXT, { count: FIG.students_credited, cols: COLS, pitch: P, origin: [-212 * P[0] + DESK.at[0], DESK.at[1]], lidGlow: true, castShadow: false,
    near: (x, z) => Math.abs(x - DESK.at[0]) < 6 && z > DESK.at[1] - 9 });
  TXT.add(R, field);
  if (field.userData.drawn !== FIG.students_credited) throw new Error('field drew ' + field.userData.drawn);
  F.campus(K, THREE, TXT, R, { flag: false });
  /* one content expert rereading at a desk in the near rows, leaning over its lit screen, in the
   * accent that means a person is reading an answer */
  const ex = F.attend(K, { x: DESK.at[0] + P[0] * 2, z: DESK.at[1] - P[1] * 17, rotY: 0 }, { sit: false, side: -1, seed: 6 });
  ex.forEach((p) => { TXT.add(R, p); TXT.contact(R, p); });
  /* the buses at the curb along the wing, seen over the field, clear of the building's face */
  for (let i = 0; i < 2; i++) { const b = K.make('school_bus', { seed: 12 + i }); b.position.set(-30 + i * 13, 0, -70); b.rotation.y = Math.PI / 2; TXT.add(R, b); TXT.contact(R, b); }
  TXT.frame(R, { from: [HOME.from[0], 7.2, HOME.from[2]], look: [HOME.look[0], 5.4, HOME.look[2] - 40] });
  TXT.sky(R);
  TXT.deckRig(R, W.rig, { target: [0, 0, -6], distance: 50, shadowFar: 140, normalBias: 0.04 });
  TXT.ground(R, { surface: 'grass', color: F.STRAW, size: 6000, seed: 21 });
  F.grass(TXT, R, { count: 6000, area: [-14, -2, 14, 4], scale: [0.06, 0.12] });
  TXT.weather(R, { grime: 0.35 });
  const cx = F.develop(await TXT.snapshot(R), gl);
  F.post(cx, { a: 0.24, type: ['.kick', '.count', '.hook', '.dek'], veil: 0.45, veilH: 220, dark: true });
  TXDECK.finish(cx);
  window.__txDrawn = { desks: field.userData.drawn, detailed: field.userData.detailed };

  return true;
})();
</script>
</body>
</html>
