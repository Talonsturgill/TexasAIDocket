<!doctype html>
<!-- 2026-11-02, frame 5 of 9. Archetype CLOSE_CROP. The human half: at a reviewer's desk in a dark room, a kit monitor whose screen carries the street clip rendered live from a second scene (the tan dog on the parkway inside a gold box) beside review_checks lit rows, the desk's wood edge lit by the screen. Drawn to illustrate, to no breed and no maker's design. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">A person reviews the clips too</h1>
<p class="dek" data-follow="26" style="width:880px">The release says automated and human review of the video clips "will verify that the detected animals were&nbsp;unrestrained."</p>
<div class="lab" id="r0" style="font-size:23px">unrestrained</div>
<div class="lab" id="r1" style="font-size:23px">human supervision</div>
<div class="lab" id="r2" style="font-size:23px">dogs present</div>
<div class="lab" id="r3" style="font-size:23px">owned or a stray</div>
<script>window.FIG = {"review_checks": 4};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-02-sightline.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Human review", counter: "05 / 09", src: "c4 c5", fit: { min: 76, max: 100, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 36, near: 0.02, far: 200, fog: 0.004 });
  /* THE CLIP: a second scene, the same street and dog, rendered from the lens into a texture the monitor shows */
  const S2 = new THREE.Scene(); S2.background = new THREE.Color(0x0a0d18);
  const key = new THREE.DirectionalLight(0xffc69a, 5.5); key.position.set(-6, 3, -4); S2.add(key);
  S2.add(new THREE.HemisphereLight(0x1a2236, 0x3a3128, 0.9));
  const pool = new THREE.PointLight(0xffd2a6, 14, 6, 2); pool.position.set(0.4, 2.2, -4.2); S2.add(pool);
  const dog2 = K.make('street_dog', { build: 'full', pose: 'step', coat: 'tan', seed: 66 }); dog2.rotation.y = -0.95; dog2.position.set(0.5, 0, -4.95); S2.add(dog2);
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(20, 1.4), new THREE.MeshStandardMaterial({ color: 0x4a4228, roughness: 0.95 })); grass.rotation.x = -Math.PI / 2; grass.position.set(0, 0.001, -4.96); S2.add(grass);
  const walk = new THREE.Mesh(new THREE.PlaneGeometry(20, 1.5), new THREE.MeshStandardMaterial({ color: 0x55534e, roughness: 0.9 })); walk.rotation.x = -Math.PI / 2; walk.position.set(0, 0.002, -6.3); S2.add(walk);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(20, 6), new THREE.MeshStandardMaterial({ color: 0x1c1c1f, roughness: 0.9 })); road.rotation.x = -Math.PI / 2; road.position.set(0, 0, -1.2); S2.add(road);
  const fence = K.make('chain_link_fence', { length: 20, height: 1.22, color: 'galvanized' }); fence.position.set(0, 0, -8.2); S2.add(fence);
  const cam2 = new THREE.PerspectiveCamera(15, 16 / 9, 0.05, 200); cam2.position.set(0, 0.95, 0.66); cam2.lookAt(0.45, 0.4, -4.95);
  /* the box in the clip, one corner per check, the count read from figures.json */
  const nC = Math.round(FIG.review_checks), goldM = new THREE.MeshBasicMaterial({ color: 0xe0956a });
  { const c = new THREE.Vector3(0.45, 0.42, -4.9), hw = 0.62, hh = 0.42, L = 0.16, t = 0.014;
    [[-1, 1], [1, 1], [1, -1], [-1, -1]].slice(0, nC).forEach(([a, b]) => {
      const h = new THREE.Mesh(new THREE.BoxGeometry(L, t, t), goldM); h.position.set(c.x + a * (hw - L / 2), c.y + b * hh, c.z); S2.add(h);
      const v = new THREE.Mesh(new THREE.BoxGeometry(t, L, t), goldM); v.position.set(c.x + a * hw, c.y + b * (hh - L / 2), c.z); S2.add(v);
    }); }
  const rt = new THREE.WebGLRenderTarget(1280, 720, { samples: 4 }); rt.texture.colorSpace = THREE.SRGBColorSpace;
  R.renderer.setRenderTarget(rt); R.renderer.render(S2, cam2); R.renderer.setRenderTarget(null);
  /* the check rows beside the clip: one lit row per check, a gold lamp and a grey bar, no text */
  const rc = document.createElement('canvas'); rc.width = 640; rc.height = 720; const rx = rc.getContext('2d');
  rx.fillStyle = '#10131c'; rx.fillRect(0, 0, 640, 720);
  for (let i = 0; i < nC; i++) { const y = 120 + i * 140; rx.strokeStyle = '#e0956a'; rx.lineWidth = 6; rx.beginPath(); rx.arc(62, y, 19, 0, 7); rx.stroke(); }
  const rowsT = new THREE.CanvasTexture(rc); rowsT.colorSpace = THREE.SRGBColorSpace;
  /* the room, dark, its window on the left */
  TXT.interior(R, { w: 4.2, d: 3.8, h: 2.7, floor: 'concrete', wall: 0x0d0c11, window: 'left', ceiling: true, light: 0.02 });
  const desk = K.make('desk', { pedestal: 'right' }); desk.position.set(0, 0, -1.0); TXT.add(R, desk); TXT.contact(R, desk);
  const mon = K.make('monitor', { inches: 27, screen: 'chart' }); mon.position.set(0.15, 0.76, -1.12); TXT.add(R, mon);
  /* the screen's own plane takes the clip on its left and the rows on its right */
  mon.updateMatrixWorld(true);
  let scr = null; mon.traverse((o) => { if (o.isMesh && o.geometry && o.geometry.type === 'PlaneGeometry' && o.geometry.parameters.width > 0.4) scr = o; });
  if (scr) {
    const sw = scr.geometry.parameters.width, sh = scr.geometry.parameters.height;
    scr.material = new THREE.MeshBasicMaterial({ color: 0x050608, toneMapped: true });
    const clip = new THREE.Mesh(new THREE.PlaneGeometry(sw * 0.55, sh * 0.55 * 0.9), new THREE.MeshBasicMaterial({ map: rt.texture, toneMapped: false }));
    clip.scale.set(1, (sw * 0.55 * 9 / 16) / (sh * 0.55 * 0.9), 1); clip.position.set(scr.position.x - sw * 0.205, scr.position.y + sh * 0.02, scr.position.z + 0.0004); scr.parent.add(clip);
    const rows = new THREE.Mesh(new THREE.PlaneGeometry(sw * 0.40, sh * 0.8), new THREE.MeshBasicMaterial({ map: rowsT, toneMapped: false })); rows.position.set(scr.position.x + sw * 0.28, scr.position.y, scr.position.z + 0.0004); scr.parent.add(rows); window.__rows = { rows, sw, sh };
  }
  /* the screen's light on the desk and the reviewer */
  const sp = new THREE.PointLight(0xc8d2e6, 4.5, 2.4, 2); sp.position.set(0.15, 1.02, -0.9); R.scene.add(sp);
  const sp2 = new THREE.SpotLight(0xc8d4ee, 3.5, 2.2, 0.8, 0.9, 2); sp2.position.set(0.15, 1.05, -1.05); sp2.target.position.set(0.15, 0.7, -0.75); R.scene.add(sp2); R.scene.add(sp2.target);
  const from = [0.12, 1.3, 0.32];
  const look = CH.aim(THREE, R, TXT, from, [0.18, 1.02, -1.1], 560, 900, 36);
  TXT.frame(R, { fov: 36, from, look });
  /* THE FOUR CHECKS, set as type on the screen's rows beside their empty rings: what the review will verify, still to come */
  if (window.__rows) { const { rows, sw, sh } = window.__rows; rows.updateMatrixWorld(true);
    for (let i = 0; i < nC; i++) { const y = 120 + i * 140, v = new THREE.Vector3(-sw * 0.20 + sw * 0.40 * (110 / 640), (0.5 - y / 720) * sh * 0.8, 0); rows.localToWorld(v);
      const q = CH.project(THREE, R, [v.x, v.y, v.z]), el = document.getElementById('r' + i); el.style.left = Math.round(q[0]) + 'px'; el.style.top = Math.round(q[1] - el.getBoundingClientRect().height / 2) + 'px'; } }
  TXT.deckRig(R, CH.rigSpec(W, 4, 2048), CH.rigOpts([0, 0.8, -1], { distance: 12, shadowFar: 30 }));
  CH.unacne(R, 0.01);
  /* THE SCREEN IS THE ROOM'S ONLY LIGHT: the deck key and the sky fill fall to almost nothing, so the wall goes to true black
   * and the screen's spill models the keyboard and the desk edge */
  R.scene.traverse((l) => { if (l.isLight && l !== sp && l !== sp2 && !l.isPointLight && !l.isSpotLight) l.intensity *= 0.12; });
  R.scene.environmentIntensity = 0.04;
  { const kb = new THREE.Group(), base = TXT.roundedBox(0.44, 0.018, 0.15, 0.006, new THREE.MeshStandardMaterial({ color: 0x1b1c20, roughness: 0.5 })); kb.add(base);
    const keyM = new THREE.MeshStandardMaterial({ color: 0x2a2c32, roughness: 0.45 }), kg = new THREE.BoxGeometry(0.022, 0.008, 0.022);
    const inst = new THREE.InstancedMesh(kg, keyM, 15 * 5), m4 = new THREE.Matrix4(); let k = 0;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 15; c++) { m4.makeTranslation(-0.196 + c * 0.028, 0.013, -0.056 + r * 0.028); inst.setMatrixAt(k++, m4); }
    inst.castShadow = true; inst.receiveShadow = true; kb.add(inst); kb.position.set(0.1, 0.77, -0.93); kb.rotation.y = 0.04; TXT.add(R, kb); TXT.contact(R, kb, { grit: false }); }
  TXT.weather(R, { grime: 0.3, height: 0.4 });
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.3, veil: 0.4, veilH: 300 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
