<!doctype html>
<!-- 2026-11-04, frame 6 of 9. Archetype OBJECT_AND_CAPTION. A Permian tank battery in its containment wall at last light, a float gauge board on the nearest tank with its dusk_gold target set at the crude share of the company's output, the pump jack at crank 200 cropped into the left edge. Drawn to illustrate, to no operator's battery. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">Crude is a little under half of its output</h1>
<p class="dek" data-follow="26" style="width:860px">Crude oil averaged 208,029 barrels a day in the third quarter. The gauge's target sits at that share of everything the company produced.</p>
<script>window.FIG = {"oil_share_pct": 45.5};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-04-wellpad.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "The output", counter: "06 / 09", src: "c6 c7", fit: { min: 76, max: 100, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 36, near: 0.05, far: 4000, fog: 0.004 });
  /* the battery: four stock tanks of the kit's Permian battery (R 1.83 m, H 6.1 m on a 0.35 m ring), facing +z */
  const bat = K.make('oil_tank', { seed: 8, tanks: 4, color: 0x55614c }); bat.rotation.y = 0.9; TXT.add(R, bat); TXT.contact(R, bat);
  /* THE SHARE: the gauge board on the nearest tank's front carries its target at figures.json's oil_share_pct */
  const n = 4, pitch = 4.5, xi = -n * pitch / 2 + 0.5 * pitch, zc = -1.5;
  const board = K.make('gauge_board', { height: 5.0, level: FIG.oil_share_pct / 100, w: 0.2 });
  board.position.set(xi + 0.55, 1.15, zc + 1.83 + 0.06); bat.add(board);
  /* the kit's own narrow board on each tank stands down (the kit bakes by material, so its vertices fold to a point): this tank carries the gauge the frame reads */
  bat.children.forEach(m => { const P = m.geometry && m.geometry.attributes && m.geometry.attributes.position; if (!P) return; let hit = 0;
    for (let v = 0; v < P.count; v++) { const X = P.getX(v), Y = P.getY(v), Z = P.getZ(v);
      for (let i = 0; i < n; i++) { const bx = -n * pitch / 2 + (i + 0.5) * pitch - 1.3, bz = zc + 1.83 - 0.55; if (Math.hypot(X - bx, Z - bz) < 0.09 && Y > 0.5 && Y < 6.4) { P.setXYZ(v, bx, 3, bz); hit++; } } }
    if (hit) { P.needsUpdate = true; m.geometry.computeBoundingSphere(); } });
  /* the shells weather: rust bleeds from the roof seam and each hoop in uneven clusters, oil-film blotches of many sizes, dust banked at the foot, in a matte paint that stays green at the grazing edge */
  { const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, 1024, 512); const r = CH.lcg(77);
    for (let cl = 0; cl < 34; cl++) { const cx0 = r() * 1024, y0 = [0, 0, 170, 340][Math.floor(r() * 4)], m = 1 + Math.floor(r() * 5);
      for (let k = 0; k < m; k++) { const sx = cx0 + (r() - 0.5) * 30, len = 15 + Math.pow(r(), 2) * 220, w = 0.8 + r() * 3.5, a0 = 0.12 + r() * 0.38; const g = x.createLinearGradient(0, y0, 0, y0 + len); g.addColorStop(0, 'rgba(92,48,22,' + a0.toFixed(3) + ')'); g.addColorStop(0.6, 'rgba(92,48,22,' + (a0 * 0.4).toFixed(3) + ')'); g.addColorStop(1, 'rgba(92,48,22,0)'); x.fillStyle = g; x.beginPath(); x.moveTo(sx - w / 2, y0); x.lineTo(sx + w / 2, y0); x.lineTo(sx + w * 0.15, y0 + len); x.lineTo(sx - w * 0.15, y0 + len); x.fill(); } }
    for (let k = 0; k < 220; k++) { const px = r() * 1024, py = r() * 512, rad = 3 + Math.pow(r(), 3) * 60, a0 = 0.06 + r() * 0.2; const g = x.createRadialGradient(px, py, 0, px, py, rad); g.addColorStop(0, 'rgba(38,30,22,' + a0.toFixed(3) + ')'); g.addColorStop(1, 'rgba(38,30,22,0)'); x.fillStyle = g; x.fillRect(px - rad, py - rad, rad * 2, rad * 2); }
    /* each course is welded from steel plates: staggered vertical seams, a bead with a shaded lip */
    for (let cr = 0; cr < 3; cr++) { const off = cr % 2 ? 64 : 0; for (let k = 0; k < 8; k++) { const sx = off + k * 128 + (r() - 0.5) * 6; x.fillStyle = 'rgba(20,18,14,0.42)'; x.fillRect(sx, cr * 170.7, 2.2, 170.7); x.fillStyle = 'rgba(255,250,235,0.16)'; x.fillRect(sx + 2.2, cr * 170.7, 1.4, 170.7); } }
    for (let k = 0; k < 2600; k++) { const a0 = r() * 0.12; x.fillStyle = (r() < 0.5 ? 'rgba(30,24,18,' : 'rgba(200,190,160,') + a0.toFixed(3) + ')'; x.fillRect(r() * 1024, r() * 512, 1 + r() * 2.5, 1 + r() * 2.5); }
    { const g = x.createLinearGradient(0, 360, 0, 512); g.addColorStop(0, 'rgba(110,86,58,0)'); g.addColorStop(1, 'rgba(110,86,58,0.55)'); x.fillStyle = g; x.fillRect(0, 360, 1024, 152); }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    bat.children.forEach(m => { const mc = m.material && m.material.color; if (mc && Math.abs(mc.getHex() - 0x55614c) < 0x030303 && !m.material.map) { const o0 = m.material; m.material = new THREE.MeshPhysicalMaterial({ color: o0.color.clone(), map: tex, metalness: 0.0, roughness: 0.9, specularIntensity: 0.12, envMapIntensity: 0.5 }); } }); }
  /* the shell hoops: the kit's four-sided rings fold away and a rounder band takes their place, so each course meets the next cleanly at the silhouette */
  { let shellMat = null, shellMesh = null; bat.children.forEach(m => { if (m.material && m.material.map && m.material.roughness === 0.9) { shellMat = m.material; shellMesh = m; } const P = m.geometry && m.geometry.attributes && m.geometry.attributes.position; if (!P || !shellMat || m.material !== shellMat) return;
      for (let v = 0; v < P.count; v++) { const X = P.getX(v), Y = P.getY(v), Z = P.getZ(v);
        for (let i = 0; i < n; i++) { const tx = -n * pitch / 2 + (i + 0.5) * pitch, d = Math.hypot(X - tx, Z - zc);
          for (const hy of [0.35 + 6.1 / 3, 0.35 + 2 * 6.1 / 3]) if (Math.abs(Y - hy) < 0.03 && d > 1.832 && d < 1.86) P.setXYZ(v, tx, hy, zc); } }
      P.needsUpdate = true; });
    if (shellMat) for (let i = 0; i < n; i++) for (const hy of [0.35 + 6.1 / 3, 0.35 + 2 * 6.1 / 3]) { const ring = new THREE.Mesh(new THREE.TorusGeometry(1.842, 0.016, 10, 96), shellMat); ring.rotation.x = Math.PI / 2; ring.position.set(-n * pitch / 2 + (i + 0.5) * pitch, hy, zc); ring.castShadow = ring.receiveShadow = true; shellMesh.add(ring); } }
  /* the battery's galvanized steel is weathered dull, so the stair post at the landing does not flare against the horizon */
  bat.children.forEach(m => { const mc = m.material && m.material.color; if (mc && Math.abs(mc.getHex() - 0xa9adb0) < 0x030303 && m.material.metalness > 0.8) { m.material = m.material.clone(); m.material.metalness = 0.45; m.material.roughness = 0.75; m.material.color.setHex(0x8a8d8e); m.material.envMapIntensity = 0.4; } });
  const jack = K.make('pump_jack', { seed: CH.JACK.seed, crank: 200, color: CH.JACK.color, head: CH.JACK.head, guard: false });
  jack.rotation.y = 1.72; jack.position.set(-2, 0, 22); TXT.add(R, jack); TXT.contact(R, jack);
  TXT.sky(R);
  TXT.ground(R, { surface: 'dirt', size: 1400, seed: 47, bumpScale: 0.18 });
  bat.updateMatrixWorld(true);
  const bw = new THREE.Vector3(xi, 3.2, zc + 1.9).applyMatrix4(bat.matrixWorld);
  const A = 0.9 + 0.42, from = [bw.x + Math.sin(A) * 16.5, 3.1, bw.z + Math.cos(A) * 16.5];
  const look = CH.aim(THREE, R, TXT, from, [bw.x, 3.7, bw.z], 470, 925, 36);
  TXT.frame(R, { fov: 36, from, look });
  TXT.scatter(R, { kind: 'scrub', count: 1400, area: [-260, -220, 120, 200], avoid: [[-20, -14, 20, 14], [from[0] - 12, from[2] - 12, from[0] + 12, from[2] + 12]], seed: 49, scale: [0.5, 1.1] });
  CH.warm(R, 0.5);
  TXT.deckRig(R, CH.rigSpec(W, 40, 4096), CH.rigOpts([0, 3, 0], { distance: 70, shadowFar: 160, normalBias: 0.09 }));
  CH.unacne(R, 0.09);
  /* a light plant on the pad throws a pool across the tank fronts, so the board, its scale and its target read */
  { const sp = new THREE.SpotLight(0xffe2c0, 220, 40, 0.42, 0.7, 1.5); sp.position.set(from[0] - 1.5, 2.6, from[2] + 1.5); sp.target.position.copy(bw).setY(3.2); R.scene.add(sp); R.scene.add(sp.target); }
  TXT.weather(R, { grime: 0.85, height: 3.2, mottle: 0.6 });
  TXT.stage(R, [bat], { poolInner: 10, poolOuter: 20 });
  board.updateMatrixWorld(true);
  const tw = new THREE.Vector3(0.3, board.userData.targetY, 0.07).applyMatrix4(board.matrixWorld);
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.3, veil: 0.5, veilH: 320 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
