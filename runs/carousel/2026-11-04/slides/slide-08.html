<!doctype html>
<!-- 2026-11-04, frame 8 of 9. Archetype CLOSE_CROP. A material relief in plan: a gauger's steel tape lying across the roof plate of a stock tank, one painted graduation a day and a longer one every seventh, a brass plumb bob at its zero end and a brass clip at the last graduation, weld seams in the plate. Drawn to illustrate, to no operator's tank. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="width:900px">The regulator was not aware of any AI use</h1>
<p class="dek" data-follow="26" style="width:880px">On May 21st the Texas Tribune reported the Railroad Commission said it was not aware of any use of AI by oil and gas companies. The release came 167 days later.</p>
<div class="lab gold" id="lab-may">May 21st</div>
<div class="lab gold" id="lab-nov">November 4th</div>
<script>window.FIG = {"days_since_rrc": 167};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-04-wellpad.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = (async () => {
  const cx = await CH.bootFlat({ kicker: "The regulator", counter: "08 / 09", src: "c27 c4", fit: { min: 72, max: 96, maxLines: 2 } });
  TX.reseed(20261104);
  /* ONE MARK A DAY: figures.json's days_since_rrc graduations between the plumb bob's zero and the clip, a longer one every seventh */
  const ND = Math.round(FIG.days_since_rrc), WK = 7;
  const P0 = [150, 1130], P1 = [990, 760], LEN = Math.hypot(P1[0] - P0[0], P1[1] - P0[1]);
  const ux = (P1[0] - P0[0]) / LEN, uy = (P1[1] - P0[1]) / LEN, nx = -uy, ny = ux, HW = 26;   /* along and across the tape */
  const T0 = 40, T1 = LEN - 30, PITCH = (T1 - T0) / ND;                                     /* the graduated run */
  const M = { PLATE: 0, TAPE: 1, BRASS: 2, WELD: 3, INK: 4 };
  function sample(X, Y) {
    const dx = X - P0[0], dy = Y - P0[1], s = dx * ux + dy * uy, t = dx * nx + dy * ny;
    /* the plumb bob, a brass body on the zero end, round in plan with a turned collar */
    const bx = P0[0] - ux * 34, by = P0[1] - uy * 34, rb = Math.hypot(X - bx, Y - by);
    if (rb < 34) return [26 * Math.sqrt(1 - (rb / 34) ** 2) + (rb < 12 ? 6 : 0), M.BRASS];
    /* the brass clip at the last graduation */
    if (Math.abs(s - T1) < 16 && Math.abs(t) < HW + 10) return [32 - 4 * Math.max(0, Math.abs(t) - HW) / 10, M.BRASS];
    if (s > -6 && s < LEN + 40 && Math.abs(t) < HW) {
      const curl = 20 + 4 * (Math.abs(t) / HW) ** 2;
      if (s >= T0 - 1 && s <= T1 + 1) {
        const k = Math.round((s - T0) / PITCH), near = Math.abs(s - T0 - k * PITCH);
        const long = k % WK === 0, reach = long ? HW * 0.95 : HW * 0.45;
        if (near < (long ? 1.6 : 1.0) && t > HW - 2 * reach) return [curl, M.INK];
      }
      return [curl, M.TAPE];
    }
    /* weld seams in the roof plate, straight and proud, and the plate's grain in the albedo */
    if (Math.abs(Y - 610 - 0.12 * X) < 4 || Math.abs(X - 330 + 0.2 * Y) < 4) return [2.5, M.WELD];
    const pit = TX.fbm2(X * 0.045, Y * 0.045, 3), sc = TX.fbm2(X * 0.011 + 4, Y * 0.011, 2);
    return [(pit > 0.32 ? 2.2 : 0) + (sc > 0.25 ? 1.2 : 0), M.PLATE];
  }
  const cache = new Map(), key = (X, Y) => (X * 4 | 0) + ',' + (Y * 4 | 0);
  const S = (X, Y) => { const k = key(X, Y); let v = cache.get(k); if (!v) { v = sample(X, Y); cache.set(k, v); } return v; };
  const albedo = (X, Y, m) => {
    if (m === M.TAPE) return [0.52, 0.5, 0.45];
    if (m === M.INK) return [0.02, 0.02, 0.022];
    if (m === M.BRASS) return [0.95, 0.42, 0.2];
    if (m === M.WELD) return [0.07, 0.05, 0.04];
    const g = 1 + 0.9 * TX.fbm2(X * 0.05, Y * 0.05, 4), r = TX.fbm2(X * 0.012 + 9, Y * 0.012, 3) > 0.15 ? 2.0 : 1;
    return [0.05 * g * r, 0.032 * g, 0.024 * g];
  };
  const pool = (X, Y) => { const d = Math.hypot((X - 560) / 680, (Y - 950) / 400), t = Math.max(0, Math.min(1, (d - 0.38) / 0.7)); return 1 - 0.92 * t * t * (3 - 2 * t); };
  cx.fillStyle = '#08090c'; cx.fillRect(0, 0, 2160, 2700);
  const rep = TXBENCH.relief(cx, { x: 0, y: 470, w: 1080, h: 880, scale: 2, height: (X, Y) => S(X, Y)[0], material: (X, Y) => S(X, Y)[1], keyMask: pool, albedo,
    spec: { [M.PLATE]: [0.12, 10], [M.TAPE]: [0.9, 70], [M.BRASS]: [0.9, 40], [M.WELD]: [0.1, 8], [M.INK]: [0.2, 20] }, keyColor: [1.0, 0.8, 0.58], ambColor: [0.5, 0.56, 0.78],
    ambient: 0.13, diffuse: 2.6, ao: 1.0, shadow: 0.92, softness: 6, castLength: 300 });
  /* the brass clip's painted face in the deck's accent, at the last graduation */
  { const ex0 = P0[0] + ux * T1, ey0 = P0[1] + uy * T1; cx.save(); cx.setTransform(2, 0, 0, 2, 0, 0); cx.translate(ex0, ey0); cx.rotate(Math.atan2(uy, ux)); cx.fillStyle = '#E0956A'; cx.fillRect(-17, -(HW + 9), 34, 2 * (HW + 9)); cx.strokeStyle = 'rgba(40,22,10,0.85)'; cx.lineWidth = 1.5; cx.strokeRect(-17, -(HW + 9), 34, 2 * (HW + 9)); cx.restore(); }
  /* and the plumb bob's lit crown */
  { const bx = P0[0] - ux * 34, by = P0[1] - uy * 34; cx.save(); cx.setTransform(2, 0, 0, 2, 0, 0); cx.fillStyle = '#E0956A'; cx.beginPath(); cx.arc(bx - 6, by - 6, 18, 0, Math.PI * 2); cx.fill(); cx.restore(); }
  /* the relief's top edge feathers into the type field over 170 px, darken only, so no edge crosses a line of the dek */
  { cx.save(); cx.setTransform(2, 0, 0, 2, 0, 0); const g = cx.createLinearGradient(0, 470, 0, 640); g.addColorStop(0, 'rgba(8,9,12,1)'); g.addColorStop(1, 'rgba(8,9,12,0)'); cx.fillStyle = g; cx.fillRect(0, 468, 1080, 172); cx.restore(); }
  const put = (id, x, y) => { const el = document.getElementById(id); el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(y) + 'px'; return el; };
  put('lab-may', P0[0] - 60, P0[1] + 56);
  const nov = document.getElementById('lab-nov'), ex = P0[0] + ux * T1, ey = P0[1] + uy * T1;
  put('lab-nov', ex - nov.getBoundingClientRect().width + 30, ey - 140);
  cx.setTransform(2, 0, 0, 2, 0, 0);
  CH.post(cx, { a: 0, veil: 0.4 });
  window.__relief = rep;
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
