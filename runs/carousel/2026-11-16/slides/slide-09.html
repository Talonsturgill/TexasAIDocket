<script type="module">

import { init } from '@@ASSETS@@/js/txthree.js';

window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "What comes next", counter: "09 / 09", src: "c12 c4 c9", fit: { min: 54, max: 62, maxLines: 4 } });

  /* the type stands top left in clear sky; its foot stays well above the horizon and the gate */
  /* pin the dek 24 px under the hook's last set line, measured on the text itself after the fit */

    const rs = Array.from(rg.getClientRects()); const bot = Math.max(...rs.map(r => r.bottom));
    d.removeAttribute('data-follow'); d.style.top = Math.round(bot + 24) + 'px'; }
  const typeFoot = (() => { const h = document.getElementById('hook'), d = document.querySelector('.dek'), hb = h.getBoundingClientRect(), db = d.getBoundingClientRect();
    if (db.bottom > 640) throw new Error('the dek runs to ' + Math.round(db.bottom) + ' px, too near the horizon');
    if (hb.right > 1016 || db.right > 1016) throw new Error('the type leaves the right safe margin');

    g0.fillStyle = '#dcc39c'; g0.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) { const x = r() * w, y = r() * h, s = 60 + r() * 260, k = r();
      const gr = g.createRadialGradient(x, y, 0, x, y, s), c = k < 0.4 ? '226,188,146' : k < 0.75 ? '252,242,222' : '206,190,180';
      gr.addColorStop(0, 'rgba(' + c + ',' + (0.2 + r() * 0.2) + ')'); gr.addColorStop(1, 'rgba(' + c + ',0)'); g.fillStyle = gr; g.fillRect(x - s, y - s, 2 * s, 2 * s); }
    for (let i = 0; i < 2600; i++) { const x = r() * w, y = r() * h, s = 3 + r() * 16, k = r();
      g.fillStyle = k < 0.5 ? 'rgba(206,180,148,' + (0.12 + r() * 0.2) + ')' : 'rgba(250,240,222,' + (0.06 + r() * 0.1) + ')';
      g.beginPath(); g.ellipse(x, y, s, s * (0.4 + r() * 0.6), r() * 3, 0, 6.3); g.fill(); }
    for (let i = 0; i < 2400; i++) { const x = r() * w, y = r() * h, s = 0.8 + r() * 3.2;

  });

  limeM.name = 'limestone';
  const pr = CH.rng(5150), pits = [];
  for (let i = 0; i < 40; i++) { const u = 2.7 + pr() * 2.4, v = -1.9 + pr() * 3.6, rad = 0.02 + pr() * 0.06;
    if (Math.hypot(u - CAL_U, v - CAL_V) < 0.52 || Math.abs(v + 0.8 - (u - 3.0) * 0.2) < 0.2) continue; pits.push([u, v, rad, 0.006 + pr() * 0.012]); }

  const hgt = (u, v) => {

    const st = stoneEdge(v) - u;                                     /* the stone stands a few centimetres proud of the track */
    y += 0.04 * Math.max(0, Math.min(1, st / 0.12 + 0.5));
    pits.forEach(([pu, pv, rad, d]) => { const q = Math.hypot(u - pu, (v - pv) * 1.3) / rad; if (q < 1) y -= d * (1 - q * q) * (1 - q * q); });
    { const d = segD(u, v, joint[0], joint[1]); if (d < 0.02) y -= 0.025 * Math.pow(1 - d / 0.02, 1.5); }
    const tb = u - BLUFF(v); if (tb > 0) { const k = Math.min(1, tb / 0.6), e = k * k * (3 - 2 * k); y = y * (1 - e) - 4 * e; }
    return y;
  };

  const lg = new THREE.PlaneGeometry(LV1 - LV0, LU1 - LU0, NV, NU); lg.rotateX(-Math.PI / 2);
  { const p = lg.attributes.position, uv = lg.attributes.uv, col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) { const v = p.getX(i) + (LV0 + LV1) / 2, u = -p.getZ(i) + (LU0 + LU1) / 2;

  const ground = new THREE.Mesh(lg, limeM); ground.receiveShadow = true; ground.castShadow = true; ground.userData.txBevel = false;
  ground.rotation.y = Math.atan2(-f[0], -f[1]); ground.updateMatrixWorld(true);
  { const pX = new THREE.Vector3(0, 0, -1).applyQuaternion(ground.quaternion), pS = new THREE.Vector3(1, 0, 0).applyQuaternion(ground.quaternion);

  const gate = K.make('ranch_gate', { w: 3.05, rails: 5, finish: 'galvanized', open: 0, fence: true, seed: 3 });

  /* THE VOICE: one continuous run of the gold waveform strip, standing on its edge, from the stone at the camera's feet up

  goldM.userData.txSurface = false;
  { const env = new THREE.Scene();
    env.add(new THREE.Mesh(new THREE.SphereGeometry(30, 48, 24), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,
      uniforms: { uTop: { value: new THREE.Color('#7080b0') }, uMid: { value: new THREE.Color('#c8b8a8') }, uLow: { value: new THREE.Color('#ffe6c0') }, uFloor: { value: new THREE.Color('#4a3424') } },
      vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 uTop,uMid,uLow,uFloor; varying vec3 vP; void main(){ float y = vP.y; vec3 c = y > 0.0 ? mix(mix(uLow, uMid, smoothstep(0.0,0.35,y)), uTop, smoothstep(0.35,1.0,y)) : mix(uLow, uFloor, smoothstep(0.0,-0.3,y)); gl_FragColor = vec4(c, 1.0); }' })));
    const card = (w, h, hex, k, pp) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(pp[0], pp[1], pp[2]); m.lookAt(0, 0, 0); env.add(m); };
    const bk = at(-12, 0, 1.5), lf = at(-4, -13, 1.5), rt = at(-4, 13, 1.5), sb = at(-6, 8, 9), rim = at(12, 0, 4);
    card(46, 14, '#ffe0b8', 2.3, bk); card(22, 12, '#ffe0b8', 2.1, lf); card(22, 12, '#ffe0b8', 2.1, rt);
    card(9, 6, '#fff4e6', 4.5, sb); card(16, 0.9, '#7fe3ff', 2.6, rim);
    const pm = new THREE.PMREMGenerator(R.renderer); goldM.envMap = pm.fromScene(env, 0.02).texture; pm.dispose(); goldM.needsUpdate = true; }
  const bez = (t, P) => { const s = 1 - t; return [0, 1].map(k => s * s * s * P[0][k] + 3 * s * s * t * P[1][k] + 3 * s * t * t * P[2][k] + t * t * t * P[3][k]); };
  const PATH = [[3.05, -0.4], [5.4, -1.5], [7.0, 2.1], [GATE_U - 0.05, GATE_V - 0.15]];
  const lut = [[0, 0, ...bez(0, PATH)]]; for (let i = 1; i <= 2000; i++) { const p = bez(i / 2000, PATH), q = lut[i - 1]; lut.push([i / 2000, q[1] + Math.hypot(p[0] - q[2], p[1] - q[3]), p[0], p[1]]); }
  const LEN = lut[lut.length - 1][1];
  const atLen = (d) => { let lo = 0, hi = lut.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (lut[m][1] < d) lo = m; else hi = m; } const a = lut[lo], b = lut[hi], k = (d - a[1]) / Math.max(1e-9, b[1] - a[1]); return [a[2] + (b[2] - a[2]) * k, a[3] + (b[3] - a[3]) * k]; };
  /* the chassis waveform itself (voice_ribbon's userData.heightAt), its cusps eased by a 5 tap average so no crease
   * throws a glint, swept along the measured path as a rounded rectangle section square to the curve. The tall troughs
   * are machined flat where they meet the ground, so it stands, exactly as frame 1 builds it. */

  const hRaw = src.userData.heightAt; if (typeof hRaw !== 'function') throw new Error('the chassis voice_ribbon exposes no heightAt');

  for (let run = 0; run < RUNS; run++) {
    const NS = 6000; let hMax = 0; for (let i = 0; i <= NS; i++) hMax = Math.max(hMax, hAt(i / NS));
    const MID = 0.032, botAt = (t) => 0;   /* a continuous machined band 5 cm tall, the waveform rising off its top */
    const ringS = (a, b) => { const r = Math.min(a * 0.92, b), k = 5, out = [], cs = [[a - r, b - r, 0], [-(a - r), b - r, 1], [-(a - r), -(b - r), 2], [a - r, -(b - r), 3]];
      cs.forEach(([cx0, cy0, q]) => { for (let j = 0; j <= k; j++) { const t = (q + j / k) * Math.PI / 2; out.push([cx0 + r * Math.cos(t), cy0 + r * Math.sin(t)]); } }); return out; };
    const M = ringS(1, 1).length, P = [], I = [];
    const frameAt = (s) => { const d = s * LEN, p = atLen(d), p2 = atLen(Math.min(LEN, d + 0.004)), p1 = atLen(Math.max(0, d - 0.004)); let tu = p2[0] - p1[0], tv = p2[1] - p1[1]; const tl = Math.hypot(tu, tv) || 1; return { p, nu: -tv / tl, nv: tu / tl }; };
    for (let i = 0; i <= NS; i++) { const s = i / NS, F = frameAt(s), base = hgt(F.p[0], F.p[1]) - 0.002, top = MID + hAt(s) * 0.9, bot = botAt(s), yc = (top + bot) / 2;
      ringS(TH / 2, Math.max(TH * 0.6, (top - bot) / 2)).forEach(([uu, vv]) => { const q = at(F.p[0] + F.nu * uu, F.p[1] + F.nv * uu, base + yc + vv); P.push(q[0], q[1], q[2]); }); }

      for (let j = 0; j < M; j++) { const a0 = i * M + j, a1 = i * M + (j + 1) % M; if (e === 0) I.push(c, a1, a0); else I.push(c, a0, a1); } });
    const rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); rg.setIndex(I); rg.computeVertexNormals();
    const m = new THREE.Mesh(rg, goldM); m.castShadow = m.receiveShadow = true; m.userData.txBevel = false; m.userData.voiceRun = true; TXT.add(R, m); ribbons.push(m);

      c.strokeStyle = 'rgba(60,66,76,0.9)'; for (let i = 0; i < 300; i++) { const x = 40 + i * 6.5; c.lineWidth = i % 10 === 0 ? 2.2 : 1.2; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, i % 10 === 0 ? 34 : i % 5 === 0 ? 24 : 15); c.stroke(); }
      c.fillStyle = 'rgba(255,255,255,0.18)'; for (let y = 0; y < h; y += 2) c.fillRect(0, y, w, 1); });
    const steel = new THREE.MeshPhysicalMaterial({ color: 0xc9c9c9, metalness: 1, roughness: 0.3, anisotropy: 0.7, anisotropyRotation: 0, envMapIntensity: 0.55, side: THREE.DoubleSide }); steel.name = 'stainless-steel';
    const beamM = new THREE.MeshPhysicalMaterial({ color: 0xd2d2d2, map: scaleTex, bumpMap: scaleTex, bumpScale: -1.2, metalness: 1, roughness: 0.3, envMapIntensity: 0.55, side: THREE.DoubleSide }); beamM.name = 'stainless-beam'; beamM.name = 'stainless-beam';
    const rb = (w, h, d, m, x, y, z, r) => { const mm = new THREE.Mesh(TXT.roundedBox ? TXT.roundedBox(w, h, d, r || Math.min(w, h, d) * 0.3) : new THREE.BoxGeometry(w, h, d), m); mm.position.set(x, y, z); mm.castShadow = mm.receiveShadow = true; g.add(mm); return mm; };

      const s = new THREE.Shape(), J = 0.052 * KS, wj = 0.014 * KS;
      s.moveTo(0, -bw / 2); s.lineTo(0, -J); s.lineTo(dir * wj * 0.35, -J - 0.004 * KS); s.lineTo(dir * wj, -bw * 0.9); s.lineTo(dir * wj, bw / 2);

      const geo = new THREE.ExtrudeGeometry(s, { depth: bt * 0.9, bevelEnabled: true, bevelThickness: bt * 0.25, bevelSize: 0.0012 * KS, bevelSegments: 3, curveSegments: 6 });
      geo.rotateX(Math.PI / 2); const m = new THREE.Mesh(geo, steel); m.position.set(x, bt * 1.1, 0); m.castShadow = m.receiveShadow = true; m.userData.txBevel = false; g.add(m); return m; };
    const x0 = -Lb / 2 + 0.004 * KS; jaw(x0, 1);

    jaw(xs, -1);
