<!doctype html>
<!-- BESPOKE, 2026-11-16, carousel no. 79, frame 3 of 9, the tests. A material relief through txbench.js, carved in side
     elevation and raked from the upper left: a brass test sieve cut through its middle, its coarse woven mesh holding
     FIG.tests_built_for cream limestone stones, one per condition the tests were built for, each named in an indigo pill.
     A thin stream of dusk gold grains (the deck's accent, the veteran's own words) drops through the openings past the
     stones into an empty brass pan below, where only the first few have landed. No reading, no fill level, no score.
     The headline sits low on the deep blue floor under the pan. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="left:80px; top:832px; width:916px; text-align:left">Most adult language tests were built for other conditions</h1>
<p class="dek" data-follow="26" style="left:82px; width:880px">Rocio Norman says they were made for aphasia after a stroke or for severe brain injury. The sieve is drawn to illustrate.</p>
<div class="lab plain" id="l-0" style="font-size:28px">Aphasia after a stroke</div>
<div class="lab plain" id="l-1" style="font-size:28px">Severe brain injury</div>
<script>window.FIG = {"tests_built_for": 2};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script src="@@ASSETS@@/js/txlook.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-16-voicebench-bespoke.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = (async () => {
  await document.fonts.ready;
  CH.start({ kicker: "The tests", counter: "03 / 09", src: "c18", fit: { min: 60, max: 76, maxLines: 3 } });
  const c = document.getElementById('art'), cx = c.getContext('2d'); cx.scale(2, 2);
  TX.reseed(CH.SEED + 3);
  const fb = (x, y, n) => TX.fbm2(x, y, { octaves: n || 3 });
  const rnd = CH.rng(CH.SEED + 303);

  /* the type stands low on the deep floor under the pan; its foot must clear the claim ids */
  { const h = document.getElementById('hook'), d = document.querySelector('.dek'), db = d.getBoundingClientRect(), hb = h.getBoundingClientRect();
    if (db.bottom > 1212) throw new Error('the dek runs to ' + Math.round(db.bottom) + ' px, into the footer band');
    if (hb.top < 800) throw new Error('the hook rose to ' + Math.round(hb.top) + ' px, into the pan'); }

  /* ---- THE GEOMETRY, design px. A round spun brass sieve seen from about 20 degrees above, its front wall cut away
   * in a notch so the cloth's front edge and the streams leaving it show; a spun brass dish below. ---- */
  const CX0 = 540, CY = 360, A = 452, B = 152, S = B / A;          /* the rim ellipse: a circle of radius A raked to B */
  const DH = 80, SK = 18, WALL = 14, NOTCH = 318;                  /* drop to the cloth, skirt, wall, half width of the cutaway */
  const CYc = CY + DH, Ac = A - WALL, Bc = Ac * S;                 /* the cloth ellipse */
  const PC = 60, DP = PC * S, WR = 4.2, WF = 3.6;                    /* cloth pitch (true), on screen in depth, wire radii */
  const DX = 540, DY = 742, DA = 384, DB = 46;                      /* the dish rim ellipse */
  const OPEN_W = PC - 2 * WR, OPEN_H = DP - 2 * WF;
  const ell = (u, v, a, b) => { const f = (u / a) ** 2 + (v / b) ** 2 - 1, g = 2 * Math.hypot(u / (a * a), v / (b * b)) || 1e-6; return f / g; };   /* signed distance, px */
  const arc = (u, a, b) => b * Math.sqrt(Math.max(0, 1 - (u / a) ** 2));
  const dishH = (X, Y) => { const u = X - DX, v = (Y - DY) / (DB / DA); const r2 = (u * u + v * v) / (DA * DA); return -18 * (1 - r2); };

  /* ---- THE STONES: exactly FIG.tests_built_for, one per condition, seated on the cloth ---- */
  const N = FIG.tests_built_for;
  if (!Number.isInteger(N) || N < 1) throw new Error('tests_built_for is not a count');
  const stones = [];
  for (let i = 0; i < N; i++) {
    const u = (N === 1 ? 0 : -0.5 + i / (N - 1)) * Ac * 1.02, rw = 122 - 8 * (i % 2), rh = 92 + 8 * (i % 2);
    const base = CYc + Bc * 0.28 - 6 * (i % 2);
    stones.push({ x: CX0 + u, y: base - rh * 0.8, base, rw, rh, seed: 11 + i * 37, tilt: (i % 2 ? -0.08 : 0.1) });
  }
  if (stones.length !== N) throw new Error('drew ' + stones.length + ' stones for ' + N + ' conditions');
  stones.forEach(s => { if (2 * s.rw < 4 * OPEN_W) throw new Error('a stone is not clearly wider than a mesh opening'); });
  function stoneAt(s, X, Y) {
    if (Y > s.base) return null;
    const dx = X - s.x, dy = Y - s.y, ca = Math.cos(s.tilt), sa = Math.sin(s.tilt);
    const u = (dx * ca + dy * sa) / s.rw, v = (-dx * sa + dy * ca) / s.rh;
    const ang = Math.atan2(v, u), wob = 1 + 0.07 * Math.sin(3 * ang + s.seed) + 0.05 * Math.sin(5 * ang + s.seed * 1.7) + 0.035 * fb(Math.cos(ang) * 1.3 + s.seed, Math.sin(ang) * 1.3, 2);
    const r = Math.hypot(u, v) / wob; if (r >= 1) return null;
    return { r, h: 22 + 58 * Math.pow(Math.sqrt(1 - r * r), 0.8) };
  }

  /* ---- THE GRAINS: sand of the voice. A few rest against the stones; four streams leave cloth openings ---- */
  const grains = [];
  const mk = (x, y, r, o) => Object.assign({ x, y, r, ar: 0.78 + rnd() * 0.44, rot: rnd() * Math.PI, s: 1, base: 16 }, o || {});
  stones.forEach((st, si) => { for (let k = 0; k < 3; k++) {                       /* settled against each stone's foot */
    const x = st.x + (si % 2 ? -1 : 1) * (st.rw * 0.5 + k * 17) + (rnd() - 0.5) * 6, y = st.base + 4 + rnd() * 6;
    grains.push(mk(x, y, 5.6 + rnd() * 2.2, { base: 15 })); } });
  /* the streams: each starts in a real opening of the cloth's front row, under or between the stones */
  const STREAM_U = [-0.36, -0.06, 0.14, 0.4].map(f => f * Ac);
  const streams = STREAM_U.map(u0 => {
    const j = Math.floor(u0 / PC), u = (j + 0.5) * PC;                                /* the opening's centre, between two warp wires */
    const kmax = Math.floor(arc(u, Ac, Bc) / DP - 0.5), yo = CYc + (kmax + 0.5) * DP - 0.5 * DP + DP * 0.5;   /* centre of the front row opening */
    if (Math.abs(u) > NOTCH - 30) throw new Error('a stream leaves the cutaway');
    return { x: CX0 + u, y: CYc + kmax * DP + DP / 2, front: CYc + arc(u, Ac, Bc) };
  });
  streams.forEach(st => {
    grains.push(mk(st.x, st.y, 6.2, { base: 13, ar: 1 }));                          /* the grain in the opening, passing through */
    const land = DY + (st.x - DX) * 0 + 6 + (rnd() - 0.5) * 10, n = 5, top = st.front + 18, Aq = (land - 16 - top) / Math.pow(n - 0.5, 2);
    for (let i = 0; i < n; i++) grains.push(mk(st.x + (rnd() - 0.5) * 3, top + Aq * Math.pow(i + 0.4, 2), 6.2 + rnd() * 1.6, { s: 1 + 0.18 * i, ar: 0.92, rot: 0 }));
    st.land = land;
  });
  for (let t = 0, n = 0; t < 900 && n < 15; t++) {                                  /* a loose scatter in the dish, never a heap */
    const st = streams[n % streams.length], x = st.x + (rnd() - 0.5) * 110, y = DY + (rnd() - 0.35) * DB * 1.1;
    if (ell(x - DX, y - DY, DA - 30, DB - 12) > 0) continue;
    if (grains.some(g => Math.hypot(g.x - x, (g.y - y) * 1.6) < 17)) continue;
    grains.push(mk(x, y, 5.2 + rnd() * 2.4, { rest: true, base: 16 + dishH(x, y) + 1 })); n++;
  }
  const falling = grains.filter(g => g.s > 1.01).length, landed = grains.filter(g => g.rest).length;
  if (streams.length < 3 || falling < 12 || landed < 8) throw new Error('the grains do not visibly pass the cloth into the dish');
  grains.forEach(g => { if (2 * g.r * Math.max(1, g.ar) >= OPEN_W) throw new Error('a grain is not smaller than an opening'); });
  const GC = 24, gcols = Math.ceil(1080 / GC), grid = new Map();
  grains.forEach((g, i) => { const R = g.r * g.s * 1.3 + 2; for (let a = Math.floor((g.x - R) / GC); a <= Math.floor((g.x + R) / GC); a++) for (let b = Math.floor((g.y - R) / GC); b <= Math.floor((g.y + R) / GC); b++) { const key = b * gcols + a; if (!grid.has(key)) grid.set(key, []); grid.get(key).push(i); } });
  function grainAt(X, Y) {
    const l = grid.get(Math.floor(Y / GC) * gcols + Math.floor(X / GC)); if (!l) return null;
    for (const i of l) { const g = grains[i], c = Math.cos(g.rot), sn = Math.sin(g.rot), px = X - g.x, py = Y - g.y;
      const dx = (px * c + py * sn) / (g.r * g.ar), dy = (-px * sn + py * c) / (g.r / g.ar * g.s), d = dx * dx + dy * dy;
      if (d < 1) return { g, d, dx, dy }; }
    return null;
  }

  /* ---- THE HEIGHT FIELD ---- */
  let lastX = NaN, lastY = NaN, last = null;
  function geo(X, Y) { if (X === lastX && Y === lastY) return last; lastX = X; lastY = Y; last = geo0(X, Y); return last; }
  const tube = (d, r) => Math.sqrt(Math.max(0, 1 - (d / r) * (d / r)));
  function cloth(X, Y) {   /* the woven wire cloth in its own true coordinates, crimped over one and under the next */
    const u = X - CX0, w = (Y - CYc) / S; let best = -1;
    const k = Math.round(w / PC), dk = Math.abs(Y - (CYc + k * DP));
    if (dk < WF) best = Math.max(best, 10 + 2.6 * Math.cos(Math.PI * u / PC + k * Math.PI) + 3.2 * tube(dk, WF));
    const j = Math.round(u / PC), dj = Math.abs(u - j * PC);
    if (dj < WR) best = Math.max(best, 10 + 2.6 * Math.cos(Math.PI * w / PC + j * Math.PI + Math.PI) + 3.6 * tube(dj, WR));
    return best > 0 ? [best, 2] : [1.5, 8];           /* an opening: the shade under the sieve seen through it */
  }
  function geo0(X, Y) {
    const gr = grainAt(X, Y);
    if (gr) return [gr.g.base + 8 * Math.sqrt(1 - gr.d), 4];
    for (const s of stones) { const q = stoneAt(s, X, Y); if (q) {
      const pit = fb(X / 7 + s.seed, Y / 7, 2), pore = pit > 0.52 ? -2.2 * (pit - 0.52) / 0.48 : 0;
      return [q.h + 1.6 * fb(X / 22, Y / 22 + s.seed, 3) + pore * 4, 3]; } }
    const u = X - CX0, v = Y - CY, inNotch = Math.abs(u) < NOTCH && v > 0;
    const dR = ell(u, v, A, B);
    /* the rolled rim bead, broken by the cutaway */
    if (Math.abs(dR) < 10 && !(Math.abs(u) < NOTCH + 12 && v > 0)) return [36 + 8 * tube(dR, 10), 5];
    /* the cut faces of the wall at the notch, freshly machined */
    if (v > 0 && Math.abs(u) >= NOTCH && Math.abs(u) < NOTCH + 12 && Y >= CY + arc(u, A, B) - 10 && Y <= CY + DH + SK + arc(u, A, B)) return [30 + 2 * tube(Math.abs(u) - NOTCH - 6, 6), 5];
    /* the spun outer wall, outside the notch: convex across, with lathe rings */
    if (v > 0 && !inNotch && Math.abs(u) < A && dR > 0 && Y <= CY + DH + SK + arc(u, A, B)) {
      const t = Y - (CY + arc(u, A, B)), foot = t > DH + SK - 8 ? -(t - (DH + SK - 8)) * 0.8 : 0;
      return [26 + 6 * Math.sqrt(Math.max(0, 1 - (u / A) ** 2)) + 0.25 * Math.sin(t * 1.7) + foot, 1]; }
    /* inside the drum */
    if (dR < 0 || inNotch) {
      const dC = ell(u, Y - CYc, Ac, Bc);
      if (dC <= 0) {
        if (inNotch && dC > -4) return [8 + 3 * tube(dC + 2, 2.5), 5];               /* the cloth's cut front edge, its binding strip */
        return cloth(X, Y);
      }
      if (dR < 0 && Y < CYc) { const t = Math.max(0, Math.min(1, (Y - (CY - B)) / (DH + B))); return [6 + 0.2 * Math.sin((Y - CY) * 1.3), 6]; }   /* the far inner wall */
    }
    /* THE DISH: rolled rim, shaded hollow, spun belly */
    { const du = X - DX, dv = Y - DY, dD = ell(du, dv, DA, DB);
      if (Math.abs(dD) < 8) return [18 + 6 * tube(dD, 8), 5];
      if (dD < 0) return [16 + dishH(X, Y), 7];
      if (dv > 0 && Math.abs(du) < DA && Y < DY + arc(du, DA, DB) + 26 * Math.sqrt(Math.max(0, 1 - (du / DA) ** 2))) {
        const t = (Y - DY - arc(du, DA, DB)) / 26; return [16 - 8 * t * t + 4 * Math.sqrt(Math.max(0, 1 - (du / DA) ** 2)), 1]; } }
    return [0.1 * fb(X / 60, Y / 60, 2) + 0.03 * fb(X / 5, Y / 5, 2), 0];
  }
  const height = (X, Y) => geo(X, Y)[0], material = (X, Y) => geo(X, Y)[1];

  /* ---- THE ALBEDO: saturated tone colour in every mid tone ---- */
  const L = TXLOOK.lin, P = CH.P;
  const fieldAt = (Y) => {   /* deep cobalt at the top, bright cerulean behind the stream, deep blue floor for the type */
    const top = L('#1d4cb4'), mid = L('#2f8fe0'), lo = L('#1a45a8'), fl = L('#14378f');
    const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
    if (Y < 580) return mix(top, mid, Math.pow(Y / 580, 0.9));
    if (Y < 820) return mix(mid, lo, (Y - 580) / 240);
    return mix(lo, fl, Math.min(1, (Y - 820) / 300));
  };
  const albedo = (X, Y, m) => {
    if (m === 0) { const f = fieldAt(Y), n = 0.94 + 0.06 * fb(X / 60, Y / 60, 2), gl = Math.exp(-(((X - 260) / 520) ** 2 + ((Y - 420) / 520) ** 2)) * 0.22;
      return [f[0] * n + gl * 0.5, f[1] * n + gl * 0.55, f[2] * n + gl * 0.5]; }
    if (m === 1) { const br = fb(X / 120, Y / 1.4, 2), k = 0.9 + 0.1 * br; return L('#eab43c', k); }          /* brass, brushed */
    if (m === 5) { const k = 1.0 + 0.05 * fb(X / 9, Y / 9, 2); return L('#ffd77a', k); }                        /* the cut bead, freshly machined */
    if (m === 6) { const k = 0.82 + 0.06 * fb(X / 200, Y / 2, 2), cen = 1 - 0.35 * Math.abs((X - 540) / 450); return L('#d99a34', k * (0.85 + 0.2 * cen)); }  /* far wall, in its own shade */
    if (m === 2) return L('#c98a2a', 1.0);                                                                      /* the mesh wire, darker bronze */
    if (m === 3) { const fl = fb(X / 14, Y / 14, 3), v = fb(X / 60, Y / 60, 2); const base = L('#ffe4b4', 1.0 + 0.06 * v);
      return fl > 0.45 ? L('#e6c690', 0.95) : base; }                                                             /* cream limestone, fossil flecks */
    if (m === 4) { const gr = grainAt(X, Y); if (!gr) return L('#e0956a', 1.1);
      const hx = gr.dx + 0.38, hy = gr.dy / Math.max(1, gr.g.s * 0.8) + 0.42, hot = Math.exp(-(hx * hx + hy * hy) / 0.16), rim = Math.pow(gr.d, 2);
      /* pre-warmed so that under the blue sky ambient the rendered grain lands on the accent #e0956a */
      const base = L(TXLOOK.mix('#e0956a', '#ff8a2a', 0.55), 1.15), deep = L('#b8541c', 0.9), hi = L('#ffc277', 1.45);
      return base.map((v, i) => (v + (deep[i] - v) * rim * 0.75) * (1 - 0.8 * hot) + hi[i] * 0.8 * hot); }
    if (m === 7) { const u = (X - DX) / DA, v = (Y - DY) / DB, r = Math.min(1, Math.hypot(u, v)); return L(TXLOOK.mix('#f6cf6e', '#b9792a', r * r), 0.95); }   /* the dish hollow, spun, brightest at its floor */
    if (m === 8) return L('#163a8e', 0.75);                                                                      /* through an opening: the shade under the sieve */
    return [0.5, 0.5, 0.5];
  };

  TXBENCH.relief(cx, { ...TXLOOK.reliefLight(), x: 0, y: 0, w: 1080, h: 1350, scale: 2, height, material, albedo,
    spec: { 0: [0.05, 8], 1: [0.75, 46], 2: [0.6, 30], 3: [0.08, 6], 4: [0.45, 70], 7: [0.55, 30], 8: [0, 1], 5: [0.9, 70], 6: [0.35, 20] },
    ambient: 0.42, diffuse: 1.15, ao: 0.9, shadow: 0.85, softness: 5, castLength: 110, dither: true });

  /* ---- THE LABELS: one indigo pill per stone, a short ink leader down to it ---- */
  const labs = Array.from(document.querySelectorAll('.lab'));
  if (labs.length !== N) throw new Error(labs.length + ' labels for ' + N + ' stones');
  const svg = CH.svg();
  stones.forEach((s, i) => {
    const el = labs[i], w = el.getBoundingClientRect().width, h = el.getBoundingClientRect().height;
    let x = Math.round(s.x - w / 2); x = Math.max(70, Math.min(1010 - w, x));
    const y = 134; el.style.left = x + 'px'; el.style.top = y + 'px';
    const top = s.y - s.rh * 0.9, ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', s.x); ln.setAttribute('y1', y + h + 6); ln.setAttribute('x2', s.x); ln.setAttribute('y2', top);
    ln.setAttribute('stroke', P.ink); ln.setAttribute('stroke-width', '3'); ln.setAttribute('stroke-linecap', 'round'); svg.appendChild(ln);
    (window.__txLeaders = window.__txLeaders || []).push({ target: 'stone ' + i, at: [s.x, top], to: [s.x, top] });
  });
  { const a = labs[0].getBoundingClientRect(), b = labs[1] && labs[1].getBoundingClientRect(); if (b && a.right > b.left - 12) throw new Error('the two condition pills collide'); }

  CH.seat(cx, { a: 0.42, fade: 180 });
  TXLOOK.footWash(cx, { a: 0.5, height: 230 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
