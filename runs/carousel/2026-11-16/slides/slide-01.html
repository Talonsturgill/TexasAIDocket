<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Speech as data", counter: "01 / 09", src: "c3 c6 c2", fit: { min: 84, max: 116, maxLines: 2 } });
  /* THIS FRAME DRAWS NO COUNT. window.FIG is empty and nothing below is read as a quantity. */
  if (Object.keys(window.FIG).length !== 0) throw new Error('frame 1 carries no figure, FIG must stay empty');

  /* the type: centred high on the wall, the dek's foot well above the ribbon */
  { const h = document.getElementById('hook'), d = document.querySelector('.dek'), hb = h.getBoundingClientRect(), db = d.getBoundingClientRect();

    if (hb.top < 140) throw new Error('the hook rides into the kicker band'); }

  TXT.studio(R, { tone: 'explainer', w: 6, d: 2.6, h: 2.2, radius: 0.55, floor: '#56a8ee', wall: '#2a7fd6', top: '#123d8f', env: 1.05, hemi: 0.55, softbox: 5.5, accentStrip: 0.6 });

      const m = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 4.2, 128, 1, true), new THREE.MeshBasicMaterial({ map: t, color: new THREE.Color('#ffd9a8').multiplyScalar(2.4), side: THREE.DoubleSide }));

    card(9, 6, '#fff4e6', 4.5, [-8, 9, 3]);          /* the key's softbox */
    card(16, 0.9, '#7fe3ff', 2.6, [0, 4, -12]);      /* the rim strip */
    const pm = new THREE.PMREMGenerator(R.renderer); R.scene.environment = pm.fromScene(env, 0.02).texture; pm.dispose();
    if ('environmentIntensity' in R.scene) R.scene.environmentIntensity = 1.0; }

  /* THE VOICE RIBBON: the chassis model's own waveform (its userData.heightAt), swept as a rounded section along a gentle
   * S in plan, so it bends across the floor with true rounded edges and no cap triangulation. Each section is a rounded
   * rectangle RTH thick and twice the waveform's height tall, set square to the curve. */
  const RL = 0.80, RTH = 0.012, SA = 0.055;
  const src = K.make('voice_ribbon', { length: RL, amp: 0.13, thick: RTH, seed: 115, cycles: 9 });
  const hRaw = src.userData.heightAt; if (typeof hRaw !== 'function') throw new Error('the chassis voice_ribbon exposes no heightAt');
  /* the chassis waveform, its cusps eased by a 5 tap average over 3 mm so no crease throws a glint */
  const hAt = (t) => { let a = 0; for (let k = -2; k <= 2; k++) a += hRaw(t + k * 0.0008); return a / 5; };
  const gold = src.children[0].material.clone(); gold.name = 'machined-gold'; gold.color.set(0xe0956a); gold.roughness = 0.2; gold.metalness = 0.9; gold.clearcoat = 0.6; gold.clearcoatRoughness = 0.08; gold.envMapIntensity = 1.35;
  const zc = (x) => SA * Math.sin((x / RL) * Math.PI * 1.6 + 0.5), dz = (x) => SA * Math.cos((x / RL) * Math.PI * 1.6 + 0.5) * Math.PI * 1.6 / RL;
  const NS = 600; let hMax = 0; for (let i = 0; i <= NS; i++) hMax = Math.max(hMax, hAt(i / NS));

    for (let i = 0; i < NS; i++) for (let k = 0; k < 2; k++) { const a0 = i * 3 + k, b0 = a0 + 3; ci.push(a0, b0, a0 + 1, a0 + 1, b0, b0 + 1); }

  /* THE CALIPER: a vernier caliper modelled here in full: a 0.30 m stainless beam with tapered outside jaws, knife inside

   * ticks with no numerals and no readout. It is held up in the ribbon's own plane over its tallest central peak, jaws

  const neutralEnv = (() => { const e = new THREE.Scene();
    e.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,

      fragmentShader: 'varying vec3 vP; void main(){ float y = vP.y; vec3 c = mix(vec3(0.20,0.22,0.26), vec3(0.62,0.66,0.72), smoothstep(-0.3,0.6,y)); gl_FragColor = vec4(c,1.0); }' })));

  const shapeOf = (a) => { const sh = new THREE.Shape(); sh.moveTo(a[0][0], a[0][1]); for (let i = 1; i < a.length; i++) sh.lineTo(a[i][0], a[i][1]); sh.closePath(); return sh; };

  /* the jaws' inside edges and the beam's underside, as segments in the caliper's own plane, for the clearance check */
  const jawSegs = (W) => { const SX = 0.016 + W, u0 = -W / 2 - 0.016, P = (x, y) => [x + u0, y];
    return [[P(0.016, 0), P(0.016, -0.040)], [P(0.016, -0.040), P(0.010, -0.056)], [P(0.010, -0.056), P(0.004, -0.056)],
            [P(SX, -0.0035), P(SX, -0.040)], [P(SX, -0.040), P(SX + 0.006, -0.056)], [P(SX + 0.006, -0.056), P(SX + 0.012, -0.056)],
            [P(0.016, 0), P(SX, 0)], [P(SX + 0.075, 0), P(0.30, 0)]]; };
  const segDist = (p, a, b) => { const vx = b[0] - a[0], vy = b[1] - a[1], L2 = vx * vx + vy * vy, t = L2 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / L2)) : 0; return Math.hypot(p[0] - a[0] - t * vx, p[1] - a[1] - t * vy); };

  const vTex = CH.canvasTex(THREE, 512, 96, (g, w, h) => { g.fillStyle = '#979ca3'; g.fillRect(0, 0, w, h); g.strokeStyle = '#14161b'; g.lineWidth = 3;
    for (let i = 0; i <= 20; i++) { const x = 12 + i * (w - 24) / 20; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h * (i % 5 === 0 ? 0.65 : 0.42)); g.stroke(); } });
  const vM = new THREE.MeshStandardMaterial({ map: vTex, metalness: 0.55, roughness: 0.28, envMap: neutralEnv }); vM.userData.txSurface = false;
  const vern = new THREE.Mesh(new THREE.PlaneGeometry(0.042, 0.007), vM); vern.position.set(SX + 0.045, 0.0005 - 0.0035 + 0.0045, ST / 2 + 0.0002); calInner.add(vern);

  const knurlM = new THREE.MeshPhysicalMaterial({ name: 'knurled-steel', color: 0x9a9fa5, metalness: 1, roughness: 0.42, envMap: neutralEnv });
  const knurl = new THREE.Mesh(new THREE.TorusGeometry(0.0068, 0.0009, 8, 48), knurlM); knurl.position.copy(wheel.position); calInner.add(knurl);
  const lock = new THREE.Mesh(new THREE.CylinderGeometry(0.0034, 0.0038, 0.005, 24), steelC); lock.position.set(SX + 0.058, 0.0035 + 0.0025 + 0.016 - 0.016 + 0.0195 - 0.0035, 0); calInner.add(lock);

  calInner.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  calInner.position.x = -OPEN / 2 - 0.016;                       /* the opening's centre on the caliper's origin */
  const cal = new THREE.Group(); cal.add(calInner);
  { const f = frameAt(pick.tp), d = dz(f.x); cal.position.set(f.x, pick.beamY, f.z); cal.rotation.y = -Math.atan(d) + (pick.sgn < 0 ? Math.PI : 0); }
  ribbon.add(cal);

  /* ITS SUPPORT: a gauge stand on the sweep behind the strip, a graphite magnetic base, a stainless post and a short
   * arm with a clamp on the caliper's beam well clear of the jaws, so the instrument is held, not floating */
  { cal.updateMatrixWorld(true); ribbon.updateMatrixWorld(true);
    const grip = new THREE.Vector3(0.22, 0.008, 0).applyMatrix4(calInner.matrixWorld);     /* a point on the beam, world */
    const inv = new THREE.Matrix4().copy(ribbon.matrixWorld).invert(), gl0 = grip.clone().applyMatrix4(inv);
    /* the ribbon's normal at that x, toward the camera side */
    let tb = (gl0.x + RL / 2) / RL; tb = Math.max(0, Math.min(1, tb)); const fb = frameAt(tb), OFF = 0.05;
    const px = gl0.x - fb.nx * OFF, pz = gl0.z - fb.nz * OFF, yaw = Math.atan2(fb.nx, fb.nz);
    const stand = new THREE.Group();
    const baseM = new THREE.MeshPhysicalMaterial({ name: 'anodised-graphite', color: 0x5a6270, metalness: 0.6, roughness: 0.35, clearcoat: 0.3, envMap: neutralEnv });
    const base = TXT.roundedBox(0.05, 0.034, 0.04, 0.005, baseM); base.position.set(px, 0.017, pz); base.rotation.y = yaw; stand.add(base);
    const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.01, 24), steelC); knob.rotation.z = Math.PI / 2; knob.position.set(px, 0.022, pz); knob.rotation.y = yaw + Math.PI / 2; stand.add(knob);
    const H = gl0.y - 0.002, post = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, H - 0.034 + 0.012, 24), steelC); post.position.set(px, 0.034 + (H - 0.034 + 0.012) / 2, pz); stand.add(post);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.0032, 0.0032, OFF, 20), steelC); arm.rotation.x = Math.PI / 2; arm.rotation.y = yaw; arm.position.set((px + gl0.x) / 2, gl0.y, (pz + gl0.z) / 2);
    { const a2 = new THREE.Group(); a2.position.set((px + gl0.x) / 2, gl0.y, (pz + gl0.z) / 2); a2.rotation.y = yaw; const ab = new THREE.Mesh(new THREE.CylinderGeometry(0.0032, 0.0032, OFF, 20), steelC); ab.rotation.x = Math.PI / 2; a2.add(ab); stand.add(a2); }
    const boss = TXT.roundedBox(0.014, 0.014, 0.014, 0.003, steelC); boss.position.set(px, gl0.y, pz); boss.rotation.y = yaw; stand.add(boss);
    const clamp = TXT.roundedBox(0.016, 0.026, 0.012, 0.003, steelC); clamp.position.set(gl0.x - fb.nx * 0.007, gl0.y, gl0.z - fb.nz * 0.007); clamp.rotation.y = yaw; stand.add(clamp);
    stand.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
    /* its contact: a tight indigo footprint and a softer halo under the base */
    [[0.07, 0.06, 0.85, 6], [0.13, 0.11, 0.35, 26]].forEach(([w, d, a, blur]) => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
      g.filter = 'blur(' + blur + 'px)'; g.fillStyle = 'rgba(28,22,96,' + a + ')'; const iw = 256 * 0.05 / w, idp = 256 * 0.04 / d; g.fillRect(128 - iw / 2, 128 - idp / 2, iw, idp);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const m = new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }); m.userData.txSurface = false;
      const q = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m); q.rotation.x = -Math.PI / 2; q.rotation.z = yaw; q.position.set(px, 0.0009, pz); q.userData.txSurface = false; stand.add(q); });
    /* the base never touches the gold */
    if (OFF - 0.02 <= RTH / 2 + 0.003) throw new Error('the stand base would touch the ribbon');
    ribbon.add(stand); }

  /* THE CAMERA: low, near the ribbon's own midline, tilted up so the sweep rises behind it into indigo */
  ribbon.updateMatrixWorld(true);
  const peakW = new THREE.Vector3(frameAt(pick.tp).x, topAt(pick.tp), frameAt(pick.tp).z).applyMatrix4(ribbon.matrixWorld);
  const FROM = [peakW.x + 0.32, 0.10, peakW.z + 1.0];
  const LOOK = CH.aim(THREE, R, TXT, FROM, [peakW.x, peakW.y, peakW.z], 520, 690, 30);
  TXT.frame(R, { fov: 30, from: FROM, look: LOOK });

  /* THE KEY: big and soft from high camera left, raking the ribbon's rounded edge */
  const spec = CH.rigSpec(W, 1.6, 4096); spec.key = Object.assign({}, spec.key, { radius: 2.5, color: 0xfff0dc });
  TXT.deckRig(R, spec, Object.assign(CH.rigOpts([0, 0.1, 0], { distance: 6, shadowFar: 14, normalBias: 0.002 }), { light: { az: -50, el: 40 } }));
  CH.unacne(R, 0.002);

  const cx = CH.develop(await TXT.snapshot(R), gl);

  /* the ribbon spans at least 600 px of the frame */
  { const rc = CH.rectOf(THREE, R, ribbon, 0), x0 = Math.max(0, rc[0]), x1 = Math.min(1080, rc[0] + rc[2]);
    if (x1 - x0 < 600) throw new Error('the ribbon spans ' + Math.round(x1 - x0) + ' px, under 600'); }

  CH.seat(cx, { a: 0.22, fade: 200 });
  CH.seat(cx, { sel: '.dek', a: 0.42, fade: 130 });
  ['.kick', '.count', '.src', '.tx-site'].forEach(sel => CH.seat(cx, { sel, a: 0.5, fade: 70 }));
  TXLOOK.footWash(cx, { a: 0.5, height: 220 });
  TXDECK.finish(cx);
  return true;
})();
</script>
