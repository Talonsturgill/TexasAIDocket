<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#070A0D}
  #scene{position:absolute;inset:0;width:1080px;height:1350px;display:block}
  .wrap{position:absolute;inset:0;width:1080px;height:1350px}
  .halo{ text-shadow:
      0 0 16px rgba(4,6,9,.98), 0 0 34px rgba(4,6,9,.95), 0 0 70px rgba(4,6,9,.88),
      0 0 130px rgba(4,6,9,.74), 0 3px 6px rgba(4,6,9,.96); }
  .mast{position:absolute;top:84px;left:80px;font-family:"JetBrains Mono",monospace;
        font-weight:500;font-size:26px;letter-spacing:.16em;color:#8B9AA4}
  .lede{position:absolute;top:150px;left:80px;width:920px;margin:0;font-family:Fraunces,serif;
     font-weight:800;font-size:100px;line-height:1.01;color:#F2F0E8;letter-spacing:-.022em}
  .dek{position:absolute;top:394px;left:80px;width:840px;margin:0;font-family:Manrope,sans-serif;
     font-weight:600;font-size:34px;line-height:1.32;color:#D6DDE0}
  /* THE DATE. The deck's one saturated colour, and its value is DERIVED against the surface it
     lands on rather than authored, then printed to the render report. */
  .date{position:absolute;top:742px;left:80px;width:920px;margin:0;font-family:Fraunces,serif;
     font-weight:800;font-size:88px;line-height:1.04;letter-spacing:-.02em;color:#BF0A30}
  .what{position:absolute;top:876px;left:80px;width:920px;margin:0;
     font-family:"JetBrains Mono",monospace;font-weight:700;font-size:28px;letter-spacing:.05em;
     line-height:1.34;color:#EDF2F4}
  .src{position:absolute;top:962px;left:80px;width:900px;margin:0;
     font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;letter-spacing:.05em;
     line-height:1.38;color:#BFCBD2}
  .foot{position:absolute;bottom:74px;left:80px;right:80px;display:flex;justify-content:space-between;
        font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
        letter-spacing:.05em;color:#7E8C96;font-variant-numeric:tabular-nums}
</style></head>
<body data-encodes='[{"claim":"the doorway is the light extreme and the field around it is the deck floor","reads":"differ","a":[[620,660,180,220]],"b":[[110,1130,180,140]]}]'>
<canvas id="scene"></canvas>
<div class="wrap">
  <div class="mast halo">TEXAS AI DOCKET</div>
  <p class="lede halo">The board meets<br>October 13th.</p>
  <p class="dek halo">The Motor Vehicle Crime Prevention Authority posts its agenda for the meeting.</p>
  <p class="date halo">October 13, 2026</p>
  <p class="what halo">MVCPA BOARD MEETING &nbsp;&middot;&nbsp; AGENDA</p>
  <p class="src halo">LISTED ON THE STATE MOTOR VEHICLES DEPARTMENT'S OWN PAGE &nbsp;c40<br>txdmv.gov</p>
  <div class="foot halo"><span>TEXAS AI DOCKET</span><span>c40</span><span class="tx-site">texasaidocket.com</span><span>09 / 09</span></div>
</div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script>
window.renderReady = (async () => {
  const W=1080,H=1350;
  const c=document.getElementById('scene'); c.width=W*2; c.height=H*2;
  const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260830); const R=TX.rng(20260839);

  // ---- the field. The deck closes dark with one way through it, so the frame is a body of air
  // with a single opening standing in it. No object, no outline, no edge.
  (function field(){
    g.fillStyle='#070A0D'; g.fillRect(0,0,W,H);
    for(const [x,y,r,col] of [
      [712, 760, 620, 'rgba(46,64,78,0.82)'],
      [712, 760, 300, 'rgba(96,124,142,0.58)'],
      [180, 1160, 620, 'rgba(18,26,34,0.74)'],
      [200, 380, 540, 'rgba(20,30,38,0.70)'],
    ]){
      const gr=g.createRadialGradient(x,y,r*0.03,x,y,r);
      gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(0,0,W,H);
    }
  })();

  // ---- THE OPENING. A tall soft aperture standing in the field, brightest at its threshold and
  // dying at its head, so the deck's last image is a way in rather than an object.
  (function opening(){
    const OX=712, OY=744, OW=176, OH=286;
    // the light spilling out of it, which is what makes it a door and not a panel
    const sp=g.createRadialGradient(OX,OY+OH*0.30,10,OX,OY+OH*0.30,540);
    sp.addColorStop(0,'rgba(198,224,238,0.34)'); sp.addColorStop(0.42,'rgba(150,184,204,0.10)');
    sp.addColorStop(1,'rgba(150,184,204,0)');
    g.fillStyle=sp; g.fillRect(0,0,W,H);
    // the aperture itself, feathered in many passes so it has no cut edge
    for(let i=16;i>=0;i--){
      const t=i/16;
      const w=OW*(1+t*0.55), h=OH*(1+t*0.42);
      const a=(1-t)*0.085;
      g.fillStyle='rgba(214,236,246,'+a.toFixed(4)+')';
      g.beginPath();
      g.moveTo(OX-w/2, OY+h);
      g.bezierCurveTo(OX-w/2, OY+h*0.24, OX-w*0.36, OY, OX, OY);
      g.bezierCurveTo(OX+w*0.36, OY, OX+w/2, OY+h*0.24, OX+w/2, OY+h);
      g.closePath(); g.fill();
    }
    // the threshold, the frame's light extreme, an AREA at the foot of the opening
    const th=g.createLinearGradient(0,OY+OH*0.72,0,OY+OH*1.06);
    th.addColorStop(0,'rgba(236,248,252,0)'); th.addColorStop(0.55,'rgba(236,248,252,0.50)');
    th.addColorStop(1,'rgba(236,248,252,0)');
    g.save();
    g.beginPath();
    g.moveTo(OX-OW/2, OY+OH);
    g.bezierCurveTo(OX-OW/2, OY+OH*0.24, OX-OW*0.36, OY, OX, OY);
    g.bezierCurveTo(OX+OW*0.36, OY, OX+OW/2, OY+OH*0.24, OX+OW/2, OY+OH);
    g.closePath(); g.clip();
    g.fillStyle=th; g.fillRect(OX-OW, OY, OW*2, OH*1.2);
    g.restore();
    // the light lying on the ground in front of it, so the bottom band carries modeled tone
    const pool=g.createRadialGradient(OX-30,OY+OH+70,10,OX-30,OY+OH+70,420);
    pool.addColorStop(0,'rgba(178,206,222,0.24)'); pool.addColorStop(0.5,'rgba(120,148,164,0.07)');
    pool.addColorStop(1,'rgba(120,148,164,0)');
    g.save(); g.translate(OX-30,OY+OH+70); g.scale(1,0.34); g.translate(-(OX-30),-(OY+OH+70));
    g.fillStyle=pool; g.beginPath(); g.arc(OX-30,OY+OH+70,420,0,Math.PI*2); g.fill(); g.restore();
  })();

  // a soft trough of shade where the date sits, so the reserved red clears against the ground
  // rather than having to be lightened into pink to clear against the door's spill
  (function dateShade(){
    const gr=g.createRadialGradient(420,850,20,420,850,600);
    gr.addColorStop(0,'rgba(1,2,4,0.96)'); gr.addColorStop(0.5,'rgba(1,2,4,0.72)');
    gr.addColorStop(1,'rgba(2,4,7,0)');
    g.save(); g.translate(420,850); g.scale(1,0.62); g.translate(-420,-850);
    g.fillStyle=gr; g.beginPath(); g.arc(420,850,600,0,Math.PI*2); g.fill(); g.restore();
  })();

  (function haze(){
    for(let y=0;y<H;y+=3){ for(let x=0;x<W;x+=3){
      const n=TX.fbm2(x*0.0031+4.4,y*0.0031+6.1,5);
      const v=(n-0.5)*1.5;
      if(v>0){ g.fillStyle='rgba(150,180,198,'+Math.min(0.30,v*0.44).toFixed(3)+')'; }
      else   { g.fillStyle='rgba(1,3,5,'+Math.min(0.52,(-v)*0.66).toFixed(3)+')'; }
      g.fillRect(x,y,3,3);
    }}
  })();
  (function tooth(){
    for(let y=0;y<H;y+=2){ for(let x=0;x<W;x+=2){
      const n=TX.fbm2(x*0.048+4.4, y*0.048+3.9, 3);
      const v=(n-0.5);
      if(v>0){ g.fillStyle='rgba(186,208,222,'+Math.min(0.26,v*0.46).toFixed(3)+')'; }
      else   { g.fillStyle='rgba(0,0,0,'+Math.min(0.34,(-v)*0.54).toFixed(3)+')'; }
      g.fillRect(x,y,2,2);
    }}
  })();

  (function fines(){
    for(let y=0;y<H;y+=2){ for(let x=0;x<W;x+=2){
      const n=TX.simplex2(x*0.34+7.1, y*0.34+2.6);
      const v=n*0.5;
      if(v>0){ g.fillStyle='rgba(198,216,228,'+Math.min(0.11,v*0.20).toFixed(3)+')'; }
      else   { g.fillStyle='rgba(0,0,0,'+Math.min(0.15,(-v)*0.26).toFixed(3)+')'; }
      g.fillRect(x,y,2,2);
    }}
  })();

  (function grain(){
    for(let y=0;y<H;y+=3){ for(let x=0;x<W;x+=3){
      const v=(R()-0.5)*0.030;
      g.fillStyle=(v>0?'rgba(255,255,255,':'rgba(0,0,0,')+Math.abs(v).toFixed(3)+')';
      g.fillRect(x,y,3,3);
    }}
  })();

  // ---- THE RESERVED RED, derived rather than authored. The design doctrine records this exact
  // colour failing at 2.94 to 1 on a mid value ground, so the frame measures its own surface and
  // walks the red toward the light in 8 bit steps until it clears 4.5 to 1, then reports what it
  // achieved. A colour that only clears by being typed lighter is a colour nobody checked.
  await document.fonts.ready;
  (function deriveRed(){
    const el=document.querySelector('.date');
    const r=el.getBoundingClientRect();
    const px=g.getImageData(Math.round(r.left*2)+8, Math.round(r.top*2)+8,
                            Math.max(2,Math.round(r.width*2)-16), Math.max(2,Math.round(r.height*2)-16)).data;
    let sr=0,sg=0,sb=0,n=0;
    for(let i=0;i<px.length;i+=4*37){ sr+=px[i]; sg+=px[i+1]; sb+=px[i+2]; n++; }
    const bg=[sr/n, sg/n, sb/n];
    const lin=v=>{v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4);};
    const L=c=>0.2126*lin(c[0])+0.7152*lin(c[1])+0.0722*lin(c[2]);
    const ratio=(a,b)=>{const l1=Math.max(L(a),L(b)), l2=Math.min(L(a),L(b)); return (l1+0.05)/(l2+0.05);};
    // walk the RED's own luminance, keeping its hue. Adding equal steps to all three channels
    // desaturates it toward pink, which is a different colour wearing the same name.
    let col=[0xBF,0x0A,0x30], steps=0;
    while(ratio(col,bg) < 4.8 && steps < 150){
      col=[Math.min(255,col[0]+4), Math.min(255,Math.round(col[1]+1.6)), Math.min(255,Math.round(col[2]+2.2))];
      steps++;
    }
    el.style.color='rgb('+col.map(Math.round).join(',')+')';
    window.__txRed={ achieved:+ratio(col,bg).toFixed(2), steps, colour:'rgb('+col.map(Math.round).join(',')+')' };
  })();
})();
</script>
</body></html>
