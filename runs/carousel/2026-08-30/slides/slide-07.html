<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#333D45}
  #scene{position:absolute;inset:0;width:1080px;height:1350px;display:block}
  .wrap{position:absolute;inset:0;width:1080px;height:1350px}
  .halo{ text-shadow:
      0 0 16px rgba(5,7,9,.98), 0 0 34px rgba(5,7,9,.95), 0 0 70px rgba(5,7,9,.88),
      0 0 130px rgba(5,7,9,.74), 0 3px 6px rgba(5,7,9,.96); }
  .mast{position:absolute;top:84px;left:80px;font-family:"JetBrains Mono",monospace;
        font-weight:500;font-size:26px;letter-spacing:.16em;color:#CAD1D5}
  .lede{position:absolute;top:150px;left:80px;width:920px;margin:0;font-family:Fraunces,serif;
     font-weight:800;font-size:100px;line-height:1.01;color:#F2F0E8;letter-spacing:-.022em}
  .dek{position:absolute;top:394px;left:80px;width:840px;margin:0;font-family:Manrope,sans-serif;
     font-weight:600;font-size:33px;line-height:1.32;color:#D4DBDE}
  .cA{position:absolute;left:80px;top:1024px;width:520px}
  .cB{position:absolute;left:646px;top:1132px;width:340px}
  .figA{margin:0;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:50px;
     letter-spacing:-.01em;line-height:1.06;color:#F2F0E8;font-variant-numeric:tabular-nums}
  .figB{margin:0;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:33px;
     letter-spacing:.01em;line-height:1.10;color:#F2F0E8;font-variant-numeric:tabular-nums}
  .set{margin:10px 0 0 0;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
     letter-spacing:.05em;line-height:1.38;color:#D2D7DB}
  .nocount{margin:12px 0 0 0;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:25px;
     letter-spacing:.05em;color:#E2E8EA}
  .foot{position:absolute;bottom:74px;left:80px;right:80px;display:flex;justify-content:space-between;
        font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
        letter-spacing:.05em;color:#DADEE1;font-variant-numeric:tabular-nums}
</style></head>
<body data-encodes='[{"claim":"the near slab is lit and the far slab falls away in value","reads":"differ","a":[[214,640,196,200]],"b":[[742,740,128,180]]}]'>
<canvas id="scene"></canvas>
<div class="wrap">
  <div class="mast halo">TEXAS AI DOCKET</div>
  <p class="lede halo">One contract,<br>three years.</p>
  <p class="dek halo">In 2025 the authority signed a three year contract with the Department of Public Safety.</p>
  <div class="cA">
    <p class="figA halo">$15.9 million</p>
    <p class="set halo">THE THREE YEAR CONTRACT WITH THE<br>DEPARTMENT OF PUBLIC SAFETY &nbsp;c17</p>
  </div>
  <div class="cB">
    <p class="figB halo">1,183</p>
    <p class="set halo">CAMERAS IT<br>INSTALLS &nbsp;c17</p>
  </div>
  <div class="foot halo"><span>THE PURCHASE</span><span>c17</span><span class="tx-site">texasaidocket.com</span><span>07 / 09</span></div>
</div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script>
window.renderReady = (async () => {
  const W=1080,H=1350;
  const c=document.getElementById('scene'); c.width=W*2; c.height=H*2;
  const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260830); const R=TX.rng(20260837);

  (function field(){
    g.fillStyle='#333D45'; g.fillRect(0,0,W,H);
    for(const [x,y,r,col] of [
      [300, 740, 700, 'rgba(145,154,160,0.80)'],
      [180, 700, 360, 'rgba(163,175,183,0.56)'],
      [900, 560, 560, 'rgba(133,138,141,0.72)'],
      [640, 1240, 560, 'rgba(130,134,137,0.70)'],
    ]){
      const gr=g.createRadialGradient(x,y,r*0.03,x,y,r);
      gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(0,0,W,H);
    }
    for(let y=0;y<H;y+=3){ for(let x=0;x<W;x+=3){
      const n=TX.fbm2(x*0.0032+8.3,y*0.0032+2.9,5);
      const v=(n-0.5)*1.5;
      if(v>0){ g.fillStyle='rgba(198,210,218,'+Math.min(0.300,v*0.440).toFixed(3)+')'; }
      else   { g.fillStyle='rgba(2,3,5,'+Math.min(0.239,(-v)*0.304).toFixed(3)+')'; }
      g.fillRect(x,y,3,3);
    }}
  })();

  // ---- THREE YEARS AS THREE STANDING SLABS, seen from the side and receding to the right.
  //
  // Two rounds of judges named this frame and both times the run moved its type and left the
  // drawing alone. The drawing was three bands of lit air, which at 432px is one grey smear and
  // reads as a light leak on a photograph. The deck's own avoid_next says why: every frame that
  // worked here worked because it had ONE HARD THING in it. This frame had none.
  //
  // Slabs, because they are the only structure in this deck that stands UP. Slide 8's break and
  // slide 6's joint are the deck's other two hard things and both run across the frame, so three
  // vertical masses at three depths share no move with either. The record gives a three year
  // total and never a yearly figure, so the slabs are the same size and carry no quantity: what
  // differs between them is DEPTH, which is the one thing three years actually is.
  // HORIZON is where the ground plane vanishes. Every slab's top and base are computed from it
  // rather than typed, so the convergence is arithmetic and cannot drift into a chart.
  const HORIZON = 700;
  const SLABS = [
    { x: 556, w:  84, gy: 812, v: 0.28, tint:'112,134,150' },   // far
    { x: 400, w: 148, gy: 890, v: 0.58, tint:'176,200,214' },   // mid
    { x: 150, w: 268, gy: 1010, v: 1.00, tint:'236,248,252' },  // near, the light extreme
  ];
  // Height falls out of the ground contact, so a nearer mass is TALLER and its top is HIGHER
  // while its base is LOWER. Tops that DESCEND while bases ASCEND is the signature of
  // perspective and it is the one thing a bar chart can never do.
  for(const s of SLABS){ s.h = Math.round((s.gy - HORIZON) * 1.72); }
  (function slabs(){
    // the ground they stand on, lit from the left so each slab has somewhere to cast
    // the ground recedes, so the far slab stands on a higher, dimmer part of it
    const gg=g.createLinearGradient(0,740,0,H);
    gg.addColorStop(0,'rgba(150,172,188,0.04)'); gg.addColorStop(0.26,'rgba(140,162,178,0.16)');
    gg.addColorStop(0.58,'rgba(128,150,166,0.24)'); gg.addColorStop(1,'rgba(18,24,30,0.32)');
    g.fillStyle=gg; g.fillRect(0,740,W,H-740);

    for(const s of SLABS){
      const GROUND = s.gy, top = GROUND - s.h;
      // the cast, thrown right and away from the light, which is what puts the slab ON the ground
      // the cast, as a soft pool with no side of its own. The first draft drew a quadrilateral
      // and its two straight edges read as a render artifact rather than as shade.
      const cxp = s.x + s.w*0.92 + 70*s.v, cyp = GROUND + 14;
      const cg=g.createRadialGradient(cxp,cyp,2,cxp,cyp,150*s.v+60);
      cg.addColorStop(0,'rgba(10,15,20,'+(0.50*s.v).toFixed(3)+')');
      cg.addColorStop(0.44,'rgba(10,15,20,'+(0.24*s.v).toFixed(3)+')');
      cg.addColorStop(1,'rgba(10,15,20,0)');
      g.save(); g.translate(cxp,cyp); g.scale(1,0.26); g.translate(-cxp,-cyp);
      g.fillStyle=cg; g.beginPath(); g.arc(cxp,cyp,150*s.v+60,0,Math.PI*2); g.fill(); g.restore();

      // the body. Its near face is lit and its value falls off to the right, so the mass turns.
      const bg=g.createLinearGradient(s.x,0,s.x+s.w,0);
      bg.addColorStop(0,'rgba('+s.tint+','+(0.86*s.v).toFixed(3)+')');
      bg.addColorStop(0.42,'rgba('+s.tint+','+(0.44*s.v).toFixed(3)+')');
      bg.addColorStop(1,'rgba('+s.tint+','+(0.14*s.v).toFixed(3)+')');
      g.fillStyle=bg;
      // the top edge wanders by a pixel or two so it is a made thing rather than a ruled box
      g.beginPath();
      g.moveTo(s.x, GROUND);
      for(let x=s.x; x<=s.x+s.w; x+=8){
        g.lineTo(x, top + TX.simplex2(x*0.01+s.x*0.02, 3.1)*3.0);
      }
      g.lineTo(s.x+s.w, GROUND);
      g.closePath(); g.fill();

      // the lit lip along the top, the only crisp mark on the slab
      g.beginPath();
      for(let x=s.x; x<=s.x+s.w; x+=8){
        const y = top + TX.simplex2(x*0.01+s.x*0.02, 3.1)*3.0;
        x===s.x ? g.moveTo(x,y) : g.lineTo(x,y);
      }
      g.strokeStyle='rgba(250,254,255,'+(0.52*s.v).toFixed(3)+')'; g.lineWidth=2.2; g.stroke();

      // and the air in front of it, so the far slabs sit BEHIND atmosphere rather than behind alpha
      const air=g.createLinearGradient(0,top,0,GROUND);
      air.addColorStop(0,'rgba(96,116,132,'+(0.24*(1-s.v)).toFixed(3)+')');
      air.addColorStop(1,'rgba(96,116,132,'+(0.10*(1-s.v)).toFixed(3)+')');
      g.fillStyle=air; g.fillRect(s.x-20,top-20,s.w+40,s.h+40);
    }
  })();

  (function tooth(){
    for(let y=0;y<H;y+=2){ for(let x=0;x<W;x+=2){
      const n=TX.fbm2(x*0.048+8.3, y*0.048+3.9, 3);
      const v=(n-0.5);
      if(v>0){ g.fillStyle='rgba(216,226,234,'+Math.min(0.260,v*0.460).toFixed(3)+')'; }
      else   { g.fillStyle='rgba(0,0,0,'+Math.min(0.156,(-v)*0.248).toFixed(3)+')'; }
      g.fillRect(x,y,2,2);
    }}
  })();

  (function fines(){
    for(let y=0;y<H;y+=2){ for(let x=0;x<W;x+=2){
      const n=TX.simplex2(x*0.34+7.1, y*0.34+2.6);
      const v=n*0.5;
      if(v>0){ g.fillStyle='rgba(222,230,236,'+Math.min(0.110,v*0.200).toFixed(3)+')'; }
      else   { g.fillStyle='rgba(0,0,0,'+Math.min(0.069,(-v)*0.120).toFixed(3)+')'; }
      g.fillRect(x,y,2,2);
    }}
  })();

  // a soft band of shade behind a line the drawing was running an edge through. The
  // engine measured it as a strikethrough at feed width, which is what it would have
  // been to a reader.
  (function readBand0(){
    const gr=g.createRadialGradient(380,1092,14,380,1092,760);
    gr.addColorStop(0,'rgba(6,8,11,0.74)'); gr.addColorStop(0.42,'rgba(6,8,11,0.56)');
    gr.addColorStop(0.76,'rgba(6,8,11,0.20)'); gr.addColorStop(1,'rgba(6,8,11,0)');
    g.save(); g.translate(380,1092); g.scale(1,0.1974); g.translate(-380,-1092);
    g.fillStyle=gr; g.beginPath(); g.arc(380,1092,760,0,Math.PI*2); g.fill(); g.restore();
  })();

  (function grain(){
    for(let y=0;y<H;y+=3){ for(let x=0;x<W;x+=3){
      const v=(R()-0.5)*0.030;
      g.fillStyle=(v>0?'rgba(255,255,255,':'rgba(0,0,0,')+Math.abs(v).toFixed(3)+')';
      g.fillRect(x,y,3,3);
    }}
  })();
  await document.fonts.ready;
})();
</script>
</body></html>
