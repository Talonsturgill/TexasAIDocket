<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#070A0C}
  #scene{position:absolute;inset:0;width:1080px;height:1350px;display:block}
  #map{position:absolute;inset:0;width:1080px;height:1350px}
  .wrap{position:absolute;inset:0;width:1080px;height:1350px}
  .halo{ text-shadow:
      0 0 16px rgba(4,6,8,.98), 0 0 34px rgba(4,6,8,.95), 0 0 70px rgba(4,6,8,.88),
      0 0 130px rgba(4,6,8,.74), 0 3px 6px rgba(4,6,8,.96); }
  .mast{position:absolute;top:84px;left:80px;font-family:"JetBrains Mono",monospace;
        font-weight:500;font-size:26px;letter-spacing:.16em;color:#8FA0A8}
  .lede{position:absolute;top:150px;left:80px;width:920px;margin:0;font-family:Fraunces,serif;
     font-weight:800;font-size:92px;line-height:1.02;color:#F2F0E8;letter-spacing:-.022em}
  .dek{position:absolute;top:392px;left:80px;width:800px;margin:0;font-family:Manrope,sans-serif;
     font-weight:600;font-size:33px;line-height:1.32;color:#D4DCE0}
  .setwrap{position:absolute;left:80px;top:1042px;width:920px}
  .fig{margin:0;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:38px;
     letter-spacing:.01em;line-height:1.22;color:#F2F0E8;font-variant-numeric:tabular-nums}
  .set{margin:8px 0 0 0;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
     letter-spacing:.05em;line-height:1.38;color:#9AA9B0}
  .refuse{margin:12px 0 0 0;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:25px;
     letter-spacing:.05em;color:#E2E9EC}
  .foot{position:absolute;bottom:74px;left:80px;right:80px;display:flex;justify-content:space-between;
        font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;
        letter-spacing:.05em;color:#7C8B93;font-variant-numeric:tabular-nums}
</style></head>
<body data-encodes='[{"claim":"the named ends are lit and the interior between them carries nothing","reads":"differ","a":[[300,730,120,120]],"b":[[520,760,160,140]]}]'>
<canvas id="scene"></canvas>
<svg id="map" viewBox="0 0 1080 1350"></svg>
<div class="wrap">
  <div class="mast halo">TEXAS AI DOCKET</div>
  <p class="lede halo">El Paso to the<br>Louisiana border.</p>
  <p class="dek halo">At least $30 million of the fee went to cameras along highways and streets.</p>
  <div class="setwrap">
    <p class="fig halo">at least $30 million &nbsp;/&nbsp; at least 3,200</p>
    <p class="set halo">OF THE FEE, AND THE CAMERAS IT BOUGHT &nbsp;c14 c15</p>
    <p class="refuse halo">NO CAMERA IS PLACED ON THIS MAP</p>
  </div>
  <div class="foot halo"><span>THE STATED REACH</span><span>c14 c15</span><span class="tx-site">texasaidocket.com</span><span>05 / 09</span></div>
</div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/d3.v7.min.js"></script>
<script src="@@ASSETS@@/js/topojson-client.min.js"></script>
<script src="@@ASSETS@@/js/txgeo.js"></script>
<script>
window.renderReady = (async () => {
  const W=1080,H=1350;
  const c=document.getElementById('scene'); c.width=W*2; c.height=H*2;
  const g=c.getContext('2d'); g.scale(2,2);
  TX.reseed(20260830); const R=TX.rng(20260835);

  // ---- the field. No drawn light anywhere, because a projection is a measurement rather than an
  // object and a key light on a map invents a sun that is not in the record.
  (function field(){
    g.fillStyle='#070A0C'; g.fillRect(0,0,W,H);
    for(const [x,y,r,col] of [
      [540, 740, 760, 'rgba(34,50,60,0.76)'],
      [200, 700, 420, 'rgba(56,78,92,0.44)'],
      [940, 760, 420, 'rgba(50,70,84,0.40)'],
      [540, 1180, 560, 'rgba(16,24,30,0.72)'],
    ]){
      const gr=g.createRadialGradient(x,y,r*0.03,x,y,r);
      gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(0,0,W,H);
    }
    for(let y=0;y<H;y+=3){ for(let x=0;x<W;x+=3){
      const n=TX.fbm2(x*0.0030+5.9,y*0.0030+3.4,5);
      const v=(n-0.5)*1.5;
      if(v>0){ g.fillStyle='rgba(150,176,192,'+Math.min(0.30,v*0.44).toFixed(3)+')'; }
      else   { g.fillStyle='rgba(2,3,5,'+Math.min(0.52,(-v)*0.66).toFixed(3)+')'; }
      g.fillRect(x,y,3,3);
    }}
  })();
  (function tooth(){
    for(let y=0;y<H;y+=2){ for(let x=0;x<W;x+=2){
      const n=TX.fbm2(x*0.048+5.9, y*0.048+3.9, 3);
      const v=(n-0.5);
      if(v>0){ g.fillStyle='rgba(186,208,222,'+Math.min(0.26,v*0.46).toFixed(3)+')'; }
      else   { g.fillStyle='rgba(0,0,0,'+Math.min(0.34,(-v)*0.54).toFixed(3)+')'; }
      g.fillRect(x,y,2,2);
    }}
  })();

  (function fines(){
    for(let y=0;y<H;y+=2){ for(let x=0;x<W;x+=2){
      const n=TX.simplex2(x*0.34+7.1, y*0.34+2.6);
      const v=n*0.5;
      if(v>0){ g.fillStyle='rgba(198,216,228,'+Math.min(0.11,v*0.20).toFixed(3)+')'; }
      else   { g.fillStyle='rgba(0,0,0,'+Math.min(0.15,(-v)*0.26).toFixed(3)+')'; }
      g.fillRect(x,y,2,2);
    }}
  })();

  (function grain(){
    for(let y=0;y<H;y+=3){ for(let x=0;x<W;x+=3){
      const v=(R()-0.5)*0.030;
      g.fillStyle=(v>0?'rgba(255,255,255,':'rgba(0,0,0,')+Math.abs(v).toFixed(3)+')';
      g.fillRect(x,y,3,3);
    }}
  })();

  // ---- the state. ONE filled silhouette, no county seams, because no claim in this run states a
  // county level fact and a seam invites a reader to look for their own. The span terminates at
  // the two ends c14 actually names and NOTHING is drawn between them.
  // Chromium refuses fetch() on a file:// URL whatever --allow-file-access-from-files says, and
  // the 2026-08-21 deck already paid for this discovery. XMLHttpRequest still serves it.
  const topo = await new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open("GET", "@@ASSETS@@/geo/tx-counties.topo.json");
    x.onload = () => res(JSON.parse(x.responseText));
    x.onerror = () => rej(new Error("county topojson did not load"));
    x.send();
  });
  const state = TXGeo.outline(topo);
  const proj  = TXGeo.texasProjection(state, [[132, 560], [948, 1000]]);
  const path  = d3.geoPath(proj);
  const svg   = d3.select("#map");

  const defs = svg.append("defs");
  // a soft edge on the silhouette, so the land has no hard cut against the air
  const blur = defs.append("filter").attr("id","soft")
      .attr("x","-25%").attr("y","-25%").attr("width","150%").attr("height","150%");
  blur.append("feGaussianBlur").attr("stdDeviation","7");
  const glow = defs.append("filter").attr("id","glow")
      .attr("x","-90%").attr("y","-90%").attr("width","280%").attr("height","280%");
  glow.append("feGaussianBlur").attr("stdDeviation","16");

  // the land's own soft halo, drawn under it
  svg.append("path").attr("d", path(state)).attr("fill","#48627A")
     .attr("opacity",0.52).attr("filter","url(#glow)");
  // the body of the state, darker than the air around it, so the interior is the frame's void
  svg.append("path").attr("d", path(state)).attr("fill","#0A0F13")
     .attr("opacity",0.94).attr("filter","url(#soft)");
  svg.append("path").attr("d", path(state)).attr("fill","#0C1319").attr("opacity",0.92);
  // a soft edge on the land so the silhouette is legible without becoming an outline
  svg.append("path").attr("d", path(state)).attr("fill","none")
     .attr("stroke","#9FC0D4").attr("stroke-width",2.4).attr("opacity",0.30)
     .attr("filter","url(#soft)");
  svg.append("path").attr("d", path(state)).attr("fill","none")
     .attr("stroke","#C3DCEA").attr("stroke-width",1).attr("opacity",0.16);

  // THE TWO NAMED ENDS. Lifted as soft luminous areas rather than as pins, because a pin is a
  // point and the record gives a region. No third mark exists anywhere inside the outline.
  const ends = [
    { at: TXGeo.place("El Paso"),      label: "EL PASO" },
    { at: [-93.85, 31.05],             label: "THE LOUISIANA BORDER" },
  ];
  const seen = [];
  for(const e of ends){
    const p = proj(e.at); seen.push(p);
    const gid = "e"+Math.round(p[0]);
    const rg = defs.append("radialGradient").attr("id",gid);
    rg.append("stop").attr("offset","0%").attr("stop-color","#DCEAF0").attr("stop-opacity","0.92");
    rg.append("stop").attr("offset","38%").attr("stop-color","#A8C6D6").attr("stop-opacity","0.34");
    rg.append("stop").attr("offset","100%").attr("stop-color","#A8C6D6").attr("stop-opacity","0");
    svg.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",86)
       .attr("fill","url(#"+gid+")");
    svg.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",5.5).attr("fill","#EEF5F8");
  }

  // THE SPAN. A single soft run between the two ends, fading to nothing in the middle, because
  // c14 names two ends and names no route. It is a statement about the ends and an assertion
  // about nothing in between.
  const spanId = "span";
  const lg = defs.append("linearGradient").attr("id",spanId)
      .attr("x1",seen[0][0]).attr("y1",seen[0][1])
      .attr("x2",seen[1][0]).attr("y2",seen[1][1]).attr("gradientUnits","userSpaceOnUse");
  lg.append("stop").attr("offset","0%").attr("stop-color","#CFE3EC").attr("stop-opacity","0.70");
  lg.append("stop").attr("offset","32%").attr("stop-color","#CFE3EC").attr("stop-opacity","0.06");
  lg.append("stop").attr("offset","68%").attr("stop-color","#CFE3EC").attr("stop-opacity","0.06");
  lg.append("stop").attr("offset","100%").attr("stop-color","#CFE3EC").attr("stop-opacity","0.70");
  svg.append("line")
     .attr("x1",seen[0][0]).attr("y1",seen[0][1])
     .attr("x2",seen[1][0]).attr("y2",seen[1][1])
     .attr("stroke","url(#"+spanId+")").attr("stroke-width",3);

  // The two end names go in the DOM rather than in the SVG. An SVG label has to prove it sits
  // inside its own plate, and this deck has no plates: the halo is its defence everywhere else
  // and it should be its defence here too. Positioned from the PROJECTED coordinates, so the
  // label is placed by the map rather than by a typed offset.
  await document.fonts.ready;
  const wrap = document.querySelector('.wrap');
  const names = [
    { p: seen[0], t: "EL PASO",              dy: -104 },
    { p: seen[1], t: "THE LOUISIANA BORDER", dy: -104 },
  ];
  for(const N of names){
    const el = document.createElement('div');
    el.className = 'endlabel halo';
    el.textContent = N.t;
    el.style.position = 'absolute';
    el.style.left = Math.round(N.p[0]) + 'px';
    el.style.top  = Math.round(N.p[1] + N.dy) + 'px';
    el.style.transform = 'translateX(-50%)';
    el.style.whiteSpace = 'nowrap';
    el.style.fontFamily = '"JetBrains Mono", monospace';
    el.style.fontWeight = '500';
    el.style.fontSize = '25px';
    el.style.letterSpacing = '0.06em';
    el.style.color = '#EAF1F4';
    wrap.appendChild(el);
  }
})();
</script>
</body></html>
