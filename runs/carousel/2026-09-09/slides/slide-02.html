<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  /* SLIDE 2 — the two answerers, on the study window drawn as the prairie's own calendar.
     THE ONE FRAME IN THE DECK WITH NO CAST SHADOW ANYWHERE, because the sun is at the zenith.
     The reader meets the ground once before shadows become the instrument. */
  html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#B1A291}
  canvas#art{position:absolute;inset:0;width:1080px;height:1350px;display:block}
  .wrap{position:absolute;inset:0;width:1080px;height:1350px}

  .mast{position:absolute;top:84px;left:80px;font-family:"JetBrains Mono",monospace;
    font-weight:500;font-size:25px;letter-spacing:.16em;color:#1D140D}
  .count{position:absolute;top:84px;right:80px;font-family:"JetBrains Mono",monospace;
    font-weight:500;font-size:25px;letter-spacing:.10em;color:#1D140D;
    font-variant-numeric:tabular-nums}

  h1{position:absolute;left:80px;top:158px;width:900px;margin:0;font-family:Fraunces,serif;
    font-weight:600;font-size:96px;line-height:0.98;color:#1D140D;letter-spacing:-.020em}

  /* The two parties, named on plates cut from the deck's own ground values rather than on
     floating chips. CASE MANAGERS sits above and left of AI ESTIMATIONS on every frame that
     carries both, because c4's note says the first figure in every pair is the case managers
     and a frame that reverses them reverses the story. */
  .party{position:absolute;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:31px;
    letter-spacing:.07em;padding:15px 22px;color:#F4EEE4}
  .p1{left:80px;top:352px;background:#AC654B}
  .p2{left:80px;top:436px;background:#647D97}

  .dek{position:absolute;left:80px;top:556px;width:800px;margin:0;font-family:Manrope,sans-serif;
    font-weight:500;font-size:33px;line-height:1.30;color:#1D140D}

  .axis{position:absolute;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:26px;
    letter-spacing:.05em;color:#1D140D;font-variant-numeric:tabular-nums}

  .foot{position:absolute;bottom:74px;left:80px;right:80px;display:flex;
    justify-content:space-between;gap:14px;white-space:nowrap;
    font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;color:#1D140D;
    font-variant-numeric:tabular-nums}
</style></head>
<body>
<canvas id="art"></canvas>
<div class="wrap">
  <div class="mast">HARRIS COUNTY</div>
  <div class="count">02 / 09</div>

  <h1>Two answers, one&nbsp;date</h1>

  <div class="party p1">CASE MANAGERS</div>
  <div class="party p2">AI ESTIMATIONS</div>

  <p class="dek">The hospital's own staff, and a commercial clinician-assisted tool integrated
    with the EHR, over every inpatient encounter discharged in the window below.</p>

  <div class="axis" style="left:104px;top:1132px">AUGUST 1ST, 2023</div>
  <div class="axis" style="right:104px;top:1132px;text-align:right">FEBRUARY 28TH, 2024</div>

  <div class="foot"><span>c1 &middot; c5</span><span class="tx-site">texasaidocket.com</span></div>
</div>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txhachure.js"></script>
<script>
window.renderReady = new Promise(function (resolve) {
  var W = 1080, H = 1350, S = 20260909;
  TX.reseed(S);
  var R = TX.rng(S + 2);

  var c = document.getElementById('art');
  c.width = W * 2; c.height = H * 2;
  var g = c.getContext('2d');
  g.scale(2, 2);

  function grain(gg, w, h, size, k, seed, alpha) {
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    var cx = cv.getContext('2d');
    var img = cx.createImageData(size, size);
    var rr = TX.rng(seed ^ 0x5EED);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = 128 + (rr() - 0.5) * 2 * k;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    cx.putImageData(img, 0, 0);
    gg.save(); gg.globalCompositeOperation = 'overlay'; gg.globalAlpha = alpha;
    gg.fillStyle = gg.createPattern(cv, 'repeat'); gg.fillRect(0, 0, w, h); gg.restore();
  }

  // THE RAMP IS THE CALENDAR. Position along it is days elapsed from compute.py, not a
  // hand-placed stop. 211 days between August 1st, 2023 and February 28th, 2024.
  var RAMP_X0 = 80, RAMP_X1 = 1000, WINDOW_DAYS = 211;
  var PX_PER_DAY = (RAMP_X1 - RAMP_X0) / WINDOW_DAYS;

  // ---- the type reserve. No art enters the top 46 percent of this frame.
  var BED_TOP = 772;
  g.fillStyle = '#C3B7A6'; g.fillRect(0, 0, W, BED_TOP);
  var wash = g.createLinearGradient(0, 0, 0, BED_TOP);
  wash.addColorStop(0, '#CDC2B2'); wash.addColorStop(1, '#BEB2A0');
  g.fillStyle = wash; g.fillRect(0, 0, W, BED_TOP);

  // ---- the sward, seen straight down at high sun. Nothing casts.
  g.fillStyle = '#A99A87'; g.fillRect(0, BED_TOP, W, H - BED_TOP);

  // A phenology ramp in TWO independent variables, so it is a surface rather than a wash.
  // Hue cures from the glaucous green of standing bluestem in August to Indiangrass straw in
  // February, and stroke DENSITY falls with it, so the clay crust shows through more of the
  // frame the further right the reader travels.
  function lerp(a, b, t) { return a + (b - a) * t; }
  function curedColor(t, warm) {
    // green -> copper -> straw, in three stops, sampled per stroke
    var r, gg2, b;
    if (t < 0.5) {
      var u = t / 0.5;
      r = lerp(126, 179, u); gg2 = lerp(130, 117, u); b = lerp(96, 85, u);
    } else {
      var u2 = (t - 0.5) / 0.5;
      r = lerp(179, 212, u2); gg2 = lerp(117, 177, u2); b = lerp(85, 134, u2);
    }
    var j = warm * 26;
    return 'rgb(' + Math.round(r + j) + ',' + Math.round(gg2 + j * 0.7) + ',' + Math.round(b + j * 0.5) + ')';
  }

  // the clay crust under the sward, showing through where the cover thins
  for (var q = 0; q < 5200; q++) {
    var cx2 = R() * W, cy2 = BED_TOP + R() * (H - BED_TOP);
    var tt = Math.max(0, Math.min(1, (cx2 - RAMP_X0) / (RAMP_X1 - RAMP_X0)));
    g.fillStyle = 'rgba(177,162,145,' + (0.10 + tt * 0.55) + ')';
    g.fillRect(cx2, cy2, 2 + R() * 5, 1.5 + R() * 3);
  }

  // the standing grass itself. Stroke direction TURNS gradually across the frame as the crop
  // lies over, so the field carries a real direction change and never reads as a swatch.
  var N = 8600;
  for (var i = 0; i < N; i++) {
    var x = R() * W;
    var y = BED_TOP + R() * (H - BED_TOP);
    var t = Math.max(0, Math.min(1, (x - RAMP_X0) / (RAMP_X1 - RAMP_X0)));
    // density falls to the right. A rejected stroke is bare clay, which is the argument.
    if (R() > (1.0 - t * 0.62)) { continue; }
    var lay = TX.simplex2(x * 0.0018, y * 0.0026) * 0.6;
    var ang = -Math.PI / 2 + lay + t * 0.85;          // the turn
    var len = (30 - t * 13) * (0.55 + R() * 0.9);
    g.strokeStyle = curedColor(t, TX.simplex2(x * 0.004, y * 0.004) * 0.5 + 0.5);
    g.lineWidth = 1.0 + R() * 1.3;
    g.globalAlpha = 0.55 + R() * 0.45;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    g.stroke();
  }
  g.globalAlpha = 1;

  // seed fluff on the cured end only, the single warm accent at one flat intensity
  for (var f = 0; f < 900; f++) {
    var fx = RAMP_X0 + (0.42 + R() * 0.58) * (RAMP_X1 - RAMP_X0);
    var fy = BED_TOP + R() * (H - BED_TOP);
    g.fillStyle = 'rgba(240,231,214,' + (0.28 + R() * 0.42) + ')';
    g.beginPath(); g.arc(fx, fy, 1.1 + R() * 2.0, 0, 6.2832); g.fill();
  }

  // ---- THE MOWN EDGE. A hard boundary, not a fade, so the ramp reads as a surface somebody
  // maintains rather than as a gradient somebody drew.
  var MOWN_Y = H - 148;
  g.fillStyle = '#B7A995'; g.fillRect(0, MOWN_Y, W, H - MOWN_Y);
  for (var m = 0; m < 2600; m++) {
    var mx = R() * W, my = MOWN_Y + R() * (H - MOWN_Y);
    var mt = Math.max(0, Math.min(1, (mx - RAMP_X0) / (RAMP_X1 - RAMP_X0)));
    g.strokeStyle = 'rgba(' + Math.round(150 + mt * 40) + ',' + Math.round(142 + mt * 30) + ',' +
                    Math.round(118 + mt * 20) + ',0.55)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(mx, my); g.lineTo(mx + (R() - 0.5) * 5, my - 4 - R() * 7); g.stroke();
  }
  g.strokeStyle = 'rgba(29,20,13,0.34)'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(0, MOWN_Y); g.lineTo(W, MOWN_Y); g.stroke();

  // ---- the window's own end ticks, driven into the mown strip at the computed positions
  [0, WINDOW_DAYS].forEach(function (d) {
    var x = RAMP_X0 + d * PX_PER_DAY;
    g.strokeStyle = '#1D140D'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(x, MOWN_Y - 26); g.lineTo(x, MOWN_Y + 26); g.stroke();
  });

  grain(g, W, H, 200, 26, S + 2, 0.07);

  var d2 = g.getImageData(0, 0, c.width, c.height).data, sum = 0, n = 0;
  for (var z = 0; z < d2.length; z += 4 * 97) {
    sum += (d2[z] * 0.2126 + d2[z + 1] * 0.7152 + d2[z + 2] * 0.0722); n++;
  }
  window.__txProbe = {slide: 2, mean_luma: Math.round(sum / n),
                      window_days: WINDOW_DAYS, px_per_day: Math.round(PX_PER_DAY * 1e4) / 1e4,
                      cast_shadows: 0};
  resolve();
});
</script>
</body></html>
