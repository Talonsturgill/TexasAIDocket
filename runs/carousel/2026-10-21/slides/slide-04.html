<!doctype html>
<!-- 2026-10-21, frame 4 of 9. Archetype FIGURE_SCALE. RENDERED through txthree.js in the deck's lastLight world, inside a TXT.interior room: former office space turned machine room, two rows of the plant's own machining centres facing a centre aisle, their door windows lit, the near one at full detail, a machinist standing at a machine down the row for scale, and last light from the west windows laid across the floor. Lockheed's own machines, never the cell. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  .tx-site { font-size:24px; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">More than 30 machines, already</h1>
<p class="dek" data-follow="26">The company says it turned former office space into manufacturing areas and installed more than 30 high precision machines in a few months. These are Lockheed&#39;s own, not Hadrian&#39;s cell. Drawn&nbsp;to&nbsp;illustrate.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-21-cell.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Already added", counter: "04 / 09", src: "c10 c2", fit: { min: 72, max: 96, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 34, far: 300 });
  TXT.interior(R, { w: 22, d: 70, h: 4.4, ceiling: true, floor: 'concrete', wall: 0x16181b, trim: 0x0e0f11, window: 'left', windowW: 12, windowH: 1.6, windowI: 1.2 });
  TXT.ground(R, { surface: 'concrete', size: 120, y: 0.003, wear: 'interior', color: 0x2c2f32, seed: 4 });
  /* THE FIGURE, from figures.json: added_machines 30, the more than 30 machines the company installed in a few months,
   * in two rows of 15 facing a centre aisle, the nearest at full detail */
  const ADDED = 30, PER = ADDED / 2, PITCH = 3.4;
  const near = [];
  for (let i = 0; i < ADDED; i++) {
    const side = i < PER ? -1 : 1, k = i % PER;
    const full = side === 1 && k < 2;   /* the east row is the one the camera holds close */
    const m = K.make('machining_centre', { lod: full ? 'full' : 'low', door: 0, part: full ? 'finished' : null, workLight: true, lamp: 'warm', seed: 60 + i });
    m.position.set(side * 3.6, 0, 3 - k * PITCH); m.rotation.y = -side * Math.PI / 2;
    TXT.add(R, m); TXT.contact(R, m); if (k < 2) near.push(m);
  }
  /* the machinist at the third machine of the east row, for scale */
  const p = K.make('person', { role: 'worker', pose: 'stand', seed: 23, vest: false, hat: 'cap', shirt: 0x2f353b, trousers: 0x1f2226 });
  p.position.set(1.9, 0, 3 - 3 * PITCH + 0.8); p.rotation.y = Math.PI / 2 + 0.3; TXT.add(R, p); TXT.contact(R, p);
  const from = [0.1, 1.6, 9.6];
  const look = CH.aim(THREE, R, TXT, from, [0.4, 1.0, -14], 560, 850, 34);
  TXT.frame(R, { fov: 34, from, look });
  { const spec = CH.rigSpec(W, 16, 8192); TXT.deckRig(R, spec, CH.rigOpts([3.2, 0, -2], { distance: 30, shadowFar: 90, normalBias: 0.035 })); }
  CH.unacne(R, 0.02);
  CH.warm(R, 0.25);
  /* the room's own high bays down the aisle, practicals out of frame above, pooling on the floor between the rows */
  [[0.3, 3.5, 180, 0.3], [1.0, -6.0, 420, 1.6], [1.6, 1.5, 520, 3.4], [1.6, -5.5, 360, 3.4]].forEach(([x0, z, I0, tx], i) => { const hb = new THREE.SpotLight(0xf1e7d6, I0, 16, 0.55, 0.7, 2); hb.position.set(x0, 4.2, z); hb.target.position.set(tx, tx > 1 ? 1.2 : 0, z - 0.8);
    hb.castShadow = true; hb.shadow.mapSize.set(1024, 1024); hb.shadow.bias = -0.0004; R.scene.add(hb); R.scene.add(hb.target); });
  /* a soft fill from the camera side on the machinist, so his face and shirt read */
  { const fl = new THREE.PointLight(0xf1e7d6, 6, 5, 2); fl.position.set(1.2, 1.9, p.position.z + 2.2); R.scene.add(fl); }
  R.scene.traverse((m) => { if (m.isMesh && m.material && m.material.emissive && m.material.emissive.getHex() === 0x9fb3b8) m.material.emissive.setHex(0xc9a47c); });
  TXT.stage(R, near.concat([p]), { behind: 1.6, depth: 3.5, poolInner: 4, poolOuter: 12 });
  TXT.weather(R, { grime: 0.2, height: 0.6, mottle: 0.15 });
  const shot = await TXT.snapshot(R);
  const cx = CH.develop(shot, gl);
  CH.post(cx, { a: 0.4, veil: 0.08, veilH: 140, footWash: 0.35, fade: 160 });
  CH.knock(cx, [".tx-site", ".src"], 0.5);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
