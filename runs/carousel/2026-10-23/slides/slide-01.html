<!doctype html>
<!-- 2026-10-23, frame 1 of 9. Archetype FULL_BLEED. A spatial scene through txthree.js in the deck's lastLight world: two bone record cards upright in a graphite steel holder on a dark shale ledge, the right card notched and carrying an ember tape strip across its middle. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>.dek { width:700px !important; }</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site" style="font-size:24px">texasaidocket.com</div>
<h1 class="hook" id="hook" style="line-height:1.05">One added line moved the sicker patient back</h1>
<p class="dek" data-follow="26">UT Southwestern researchers asked AI models which of two matched emergency patients to see first. A single added detail sometimes shifted a model away from the patient who later deteriorated. The cards are drawn to&nbsp;illustrate.</p>
<script>window.FIG = {"visits": 17, "months": 12, "downgraded_pct": 10, "downgraded_of_100": 10, "per_hundred": 100, "downgraded_one_in": 10, "models": 3, "departments": 2, "preprint_models": 2, "preprint_pairs_mimic": 999, "preprint_pairs_mcmed": 997, "preprint_pairs_total": 1996, "hours": 6, "conditions": 10, "psych_holds": 3, "preprint_psych_range": [2.9, 10.7], "preprint_freq_range": [2.9, 9.9]};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-23-ledger.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "UT Southwestern, Dallas", counter: "01 / 09", src: "c1 c2 c8 c10 c12", fit: { min: 76, max: 100, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 30, near: 0.02, far: 3000, fog: W.fogDensity * 0.35 });
  const Y = CH.LEDGE_Y;
  const ledge = K.make('shale_ledge', { width: 2.4, height: Y, depth: 1.6 }); ledge.position.set(0.1, 0, -0.35); TXT.add(R, ledge);
  /* the matched pair: two cards in one holder, the right one notched (the patient who later deteriorated) and taped */
  const holder = K.make('card_holder', {}); holder.position.set(0, Y, 0); holder.rotation.y = 0.12; TXT.add(R, holder);
  const lean = -holder.userData.lean * Math.PI / 180, seat = holder.userData.seat;
  holder.userData.slots.forEach((sx, i) => {
    const c = K.make('record_card', { notch: i === 1, tape: i === 1, seed: i });
    c.position.set(sx, seat.y, seat.z); c.rotation.x = lean; c.rotation.y = i ? -0.03 : 0.02;
    holder.add(c);
  });
  TXT.ground(R, { surface: 'dirt', size: 400, color: 0x17130f, seed: 23, tile: 3 });
  const from = [0.64, Y + 0.27, 0.64];
  const look = CH.aim(THREE, R, TXT, from, [0.0, Y + 0.08, 0], 560, 975, 30);
  TXT.frame(R, { fov: 30, from, look });
  TXT.sky(R);
  CH.warm(R, 0.22);
  { const spec = CH.rigSpec(W, 1.2, 4096); TXT.deckRig(R, spec, CH.rigOpts([0, Y, 0], { distance: 8, shadowFar: 30, normalBias: 0.004 })); }
  CH.unacne(R, 0.004);
  TXT.contact(R, holder);
  TXT.stage(R, holder, { behind: 0.6, depth: 1.6, poolInner: 0.32, poolOuter: 0.9 });
  TXT.weather(R, { grime: 0.15, height: 0.05, mottle: 0.25 });
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.45, veil: 0.2, footWash: 0.45 });
  CH.knock(cx, [".tx-site", ".src"], 0.5);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
