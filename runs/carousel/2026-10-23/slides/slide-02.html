<!doctype html>
<!-- 2026-10-23, frame 2 of 9. Archetype DIAGRAM. A spatial scene through txthree.js in the deck's lastLight world: two stacks of the deck's record card on the shale ledge, one per emergency department, each with its top pair slid forward, one notched card and one plain. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>.dek { width:760px !important; }</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site" style="font-size:24px">texasaidocket.com</div>
<h1 class="hook" id="hook" style="line-height:1.05">Two medical centers, paired patients</h1>
<p class="dek" data-follow="24">The records came from Stanford Medicine in California and Beth Israel Deaconess Medical Center in Massachusetts, not a Texas hospital. Each patient was paired with one of similar starting&nbsp;severity.</p>
<div class="lab" id="lA">Stanford Medicine</div>
<div class="lab" id="lB">Beth Israel Deaconess</div>
<svg id="lead" width="1080" height="1350" style="position:absolute;left:0;top:0;z-index:11;pointer-events:none"></svg>
<script>window.FIG = {"visits": 17, "months": 12, "downgraded_pct": 10, "downgraded_of_100": 10, "per_hundred": 100, "downgraded_one_in": 10, "models": 3, "departments": 2, "preprint_models": 2, "preprint_pairs_mimic": 999, "preprint_pairs_mcmed": 997, "preprint_pairs_total": 1996, "hours": 6, "conditions": 10, "harmful_lines": 5, "cleared_lines": 3, "unaccounted_lines": 2, "psych_holds": 3, "preprint_psych_range": [2.9, 10.7], "preprint_freq_range": [2.9, 9.9]};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-23-ledger.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "The records", counter: "02 / 09", src: "c11 c12", fit: { min: 76, max: 100, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 30, near: 0.02, far: 3000, fog: W.fogDensity * 0.35 });
  const Y = CH.LEDGE_Y;
  const ledge = K.make('shale_ledge', { width: 2.4, height: Y, depth: 1.6 }); ledge.position.set(0, 0, -0.35); TXT.add(R, ledge);
  /* THE FIGURE, from figures.json: departments, one stack per emergency department the release names */
  const DEPTS = FIG.departments, stacks = [];
  for (let k = 0; k < DEPTS; k++) {
    const st = K.make('card_stack', { height: 0.11 + 0.012 * k, slide: 0.07, seed: k + 1 });
    st.position.set((k - (DEPTS - 1) / 2) * 0.30, Y, -0.04 * k); st.rotation.y = 0.2 - 0.08 * k; TXT.add(R, st); stacks.push(st);
  }
  TXT.ground(R, { surface: 'dirt', size: 400, color: 0x17130f, seed: 23, tile: 3 });
  /* GRIT ON THE LEDGE behind the stacks: seeded chips of shale and caliche, so the ledge top reads as stone */
  { let sd = 7; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    const geo = new THREE.DodecahedronGeometry(1, 0), n = 6000;
    const mat = new THREE.MeshStandardMaterial({ color: 0x8a7a66, roughness: 0.9, metalness: 0 });
    const im = new THREE.InstancedMesh(geo, mat, n), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3();
    const col = new THREE.Color();
    for (let i = 0; i < n; i++) {
      const sz = 0.0007 + Math.pow(rnd(), 3) * 0.0022;
      v.set(-0.9 + rnd() * 1.8, Y + sz * 0.35, -0.30 - Math.pow(rnd(), 1.4) * 0.85);   /* thinning with distance */
      e.set(rnd() * 3, rnd() * 3, rnd() * 3); q.setFromEuler(e); sc.set(sz, sz * (0.4 + rnd() * 0.4), sz * (0.7 + rnd() * 0.5));
      m4.compose(v, q, sc); im.setMatrixAt(i, m4); col.setHSL(0.07, 0.05, 0.12 + rnd() * 0.2); im.setColorAt(i, col);
    }
    im.castShadow = im.receiveShadow = true; TXT.add(R, im); }
  const from = [0.46, Y + 0.44, 1.10];
  const look = CH.aim(THREE, R, TXT, from, [0, Y + 0.08, 0], 540, 955, 30);
  TXT.frame(R, { fov: 30, from, look });
  TXT.sky(R);
  CH.warm(R, 0.22);
  { const spec = CH.rigSpec(W, 1.4, 4096); TXT.deckRig(R, spec, CH.rigOpts([0, Y, 0], { distance: 8, shadowFar: 30, normalBias: 0.004 })); }
  CH.unacne(R, 0.004);
  stacks.forEach((s) => TXT.contact(R, s));
  TXT.stage(R, stacks, { behind: 0.6, depth: 1.6, poolInner: 0.45, poolOuter: 1.1 });
  TXT.weather(R, { grime: 0.12, height: 0.03, mottle: 0.2 });
  /* each label stands above its own stack, its leader landing on that stack's top */
  const svg = document.getElementById("lead"), leaders = [];
  stacks.forEach((s, k) => {
    const top = s.localToWorld(new THREE.Vector3(0, s.userData.top + 0.002, 0)), q = CH.project(THREE, R, [top.x, top.y, top.z]);
    const el = document.getElementById(k ? "lB" : "lA"), lx = Math.max(84, Math.min(1000 - el.offsetWidth, q[0] - el.offsetWidth / 2)), ly = q[1] - 150;
    el.style.left = lx + "px"; el.style.top = ly + "px";
    const from2 = [q[0], ly + 40]; CH.leader(svg, from2, q); leaders.push({ target: k ? "the second stack's top" : "the first stack's top", at: q, to: q });
  });
  window.__txLeaders = leaders;
  const cx = CH.develop(await TXT.snapshot(R), gl);
  CH.post(cx, { a: 0.45, veil: 0.2, footWash: 0.45 });
  CH.knock(cx, [".tx-site", ".src", "#lA", "#lB"], 0.5);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
