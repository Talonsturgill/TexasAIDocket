<!doctype html>
<!-- 2026-10-23, frame 4 of 9. Archetype DOCUMENT. A MATERIAL RELIEF through txbench.js under the deck's declared light: one bone record card in plan, its ruled lines debossed, an ember tape strip laid over one line with its left corner lifted, the shale falling to black outside the pool. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>.dek { width:800px !important; } #lN { color:#0e0a07 !important; font-weight:700 !important; text-shadow:none !important; } #lS { color:#ECE6DA !important; text-shadow:none !important; }</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site" style="font-size:24px">texasaidocket.com</div>
<h1 class="hook" id="hook">Neutral words against stigmatizing ones</h1>
<p class="dek" data-follow="24">One wording pair in the study set a neutral description against a stigmatizing one. The tape here carries the second, set under the&nbsp;first.</p>
<div class="lab" id="lN">established patient with multiple chronic conditions</div>
<div class="lab" id="lS">17 visits in the past 12 months</div>
<script>window.FIG = {"visits": 17, "months": 12, "downgraded_pct": 10, "downgraded_of_100": 10, "per_hundred": 100, "downgraded_one_in": 10, "models": 3, "departments": 2, "preprint_models": 2, "preprint_pairs_mimic": 999, "preprint_pairs_mcmed": 997, "preprint_pairs_total": 1996, "hours": 6, "conditions": 10, "psych_holds": 3, "preprint_psych_range": [2.9, 10.7], "preprint_freq_range": [2.9, 9.9]};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/txbench.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-23-ledger.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = (async () => {
  const cx = await CH.bootFlat({ kicker: "The added line", counter: "04 / 09", src: "c19", fit: { min: 80, max: 104, maxLines: 2 } });
  TX.reseed(20261023);
  /* THE CARD in plan, CSS px: its top edge at Y0, bleeding off the right and the bottom. Ruled lines every RULE px, the
   * tape laid over the fourth line with its left end lifted. Heights in CSS px out of the shale. */
  const X0 = 70, Y0 = 690, RULE = 64, CARD_H = 5, TAPE_ROW = 3, TAPE_W = 46, TX0 = 120, TX1 = 1080;
  const rows = Array.from({ length: 10 }, (_, k) => Y0 + 70 + k * RULE);
  const tapeY = rows[TAPE_ROW] - TAPE_W / 2 - 6;
  const inCard = (X, Y) => X >= X0 && Y >= Y0;
  const onTape = (X, Y) => X >= TX0 && X <= TX1 && Y >= tapeY && Y <= tapeY + TAPE_W;
  const lift = (X) => X < TX0 + 90 ? Math.pow(1 - (X - TX0) / 90, 2) * 16 : 0;   /* the corner lifted off the card */
  const onRod = (X, Y) => { const t = (X - 70) / 470, yy = 1300 - t * 40; return X >= 40 && X <= 560 && Math.abs(Y - yy) < 9; };
  /* THE PROP: the card leans toward the key, so its plane rises away from the light, toward the lower left */
  const tilt = (X, Y) => 0.55 * ((1080 - X) * 0.88 + (Y - Y0) * 0.47);
  function h(X, Y) {
    if (!inCard(X, Y)) return 0;
    let z = tilt(X, Y) + CARD_H + 0.25 * TX.simplex2(X * 0.6, Y * 0.6);
    if (onTape(X, Y)) return z + 2.6 + lift(X) * (1 - (Y - tapeY) / TAPE_W * 0.35);
    for (const r of rows) if (Math.abs(Y - r) < 1.6 && X > X0 + 36) return z - 1.0;
    return z;
  }
  function m(X, Y) {
    if (!inCard(X, Y)) return CH.M.SHALE;
    if (onTape(X, Y)) return CH.M.TAPE;
    for (const r of rows) if (Math.abs(Y - r) < 1.6 && X > X0 + 36) return CH.M.RULE;
    return CH.M.CARD;
  }
  /* the key lands in a pool over the taped line and the card's far reaches fall off into the dark */
  const pool = (X, Y) => { const d = Math.hypot((X - 470) / 760, (Y - 905) / 330), t = Math.max(0, Math.min(1, (d - 0.35) / 0.65)); return 1 - 0.97 * t * t * (3 - 2 * t); };
  const rep = TXBENCH.relief(cx, { x: 0, y: 0, w: 1080, h: 1350, scale: 2, height: h, material: m, keyMask: pool,
    /* diffuse held down, because the propped plane takes the key nearly full on */
    albedo: (X, Y, mm) => mm === CH.M.TAPE ? [0.42, 0.028, 0.0] : mm === CH.M.SHALE ? [0.014, 0.014, 0.017] : mm === CH.M.RULE ? [0.2, 0.18, 0.16] : mm === CH.M.CARD ? CH.albedo(X, Y, mm).map((v, i) => v * [1.42, 1.3, 1.02][i]) : CH.albedo(X, Y, mm), spec: Object.assign({}, CH.SPEC, { 3: [0.05, 10] }), ambient: 0.05, diffuse: 1.4, ao: 1.0, shadow: 0.9, softness: 4, castLength: 120 });
  window.__relief = rep;
  cx.setTransform(2, 0, 0, 2, 0, 0);
  /* the neutral wording on the ruled line above the tape, in card ink; the stigmatizing wording on the tape itself */
  const lN = document.getElementById("lN"), lS = document.getElementById("lS");
  lN.style.left = (TX0 + 10) + "px"; lN.style.top = (rows[TAPE_ROW - 1] - 44) + "px"; lN.style.fontSize = "23px";
  lS.style.left = (TX0 + 110) + "px"; lS.style.top = (tapeY + (TAPE_W - 32) / 2) + "px"; lS.style.fontSize = "26px";
  CH.post(cx, { a: 0.3, veil: 0.2, footWash: 0.45 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
