window.renderReady = (async () => {

  const A = groundAt(330, 598), B = groundAt(968, 836);

  };

  /* the two tyre ruts, packed darker into the crushed stone */
  { const rutM = new THREE.MeshStandardMaterial({ name: 'caliche-packed-rut', color: 0xc07a44, roughness: 0.72, emissive: 0x4a2408, emissiveIntensity: 0.2 }); rutM.userData.txSurface = 'concrete';

  { const marks = []; for (let m = 1; m <= N_POSTS; m++) if (tAt(m) >= bandT0 && tAt(m) <= bandT1) marks.push(m);
