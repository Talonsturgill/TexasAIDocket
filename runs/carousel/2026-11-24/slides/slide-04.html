<!doctype html>
<!-- 2026-11-24, frame 4 of 9, ROOF BY ROOF. A low drone oblique over a back yard: one brick ranch's back slope torn to OSB
     decking with nail rows and ragged courses, a blue tarp with sandbags, a barked live oak limb running in off the frame edge
     with its crown crushed over the ridge, a hollow rim in a different CH.RAMP step round each of three roofs, and the gold
     route on the street beyond. No figure is drawn (window.FIG is empty). Colors drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="left:76px; top:146px; width:820px">Then every roof is judged</h1>
<p class="dek" data-follow="22" style="left:78px; width:880px; font-size:30px">The Building Damage Assessment rates the damage to each individual building and gives responders a color coded view, structure by structure. Colors drawn to illustrate.</p>
<script>window.FIG = {};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/txlook.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-24-roofread-bespoke.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Structure by structure", counter: "04 / 09", src: "c5 c6",
    fit: { min: 84, max: 120, maxLines: 2 } });

  /* THE FIGURES. This frame draws no count: window.FIG must stay empty. Every roof in view wears one rim (checked below). */

  const R = CH.stage(TXT, gl, W, { fov: 38, near: 0.1, far: 9000, fog: 0.0085 });
  R.renderer.localClippingEnabled = true;
  const rng = CH.rng(4404);

  /* ---------- THE HOUSE. One brick ranch, front on +z toward the street, its back slope toward the camera ---------- */
  const house = K.make('ranch_house', { seed: 11, material: 'brick', color: '#a0583c', roof: '#5e4a44', trim: 0xefece4, garage: 'right', chimney: false, gable: false });
  TXT.add(R, house); house.updateMatrixWorld(true);
  /* the kit's turbine vents are flat shaded: give them smooth spun metal */
  /* the kit's turbine vane caps are flat shaded lathes that read as chrome balls: find them, hide them, and stand a modelled
   * ribbed turbine vent in matte galvanised steel on each one's own spot */
  const vaneSpots = [];
  house.traverse((m) => { if (!m.isMesh || Array.isArray(m.material) || !m.material.flatShading) return;
    const ps = m.geometry.attributes.position, sums = {};
    for (let k = 0; k < ps.count; k++) { const key = ps.getX(k) < 0 ? 'a' : 'b'; const S = sums[key] = sums[key] || [0, 0, 0, 0, 1e9]; S[0] += ps.getX(k); S[1] += ps.getZ(k); S[2]++; S[4] = Math.min(S[4], ps.getY(k)); }
    Object.values(sums).forEach((S) => vaneSpots.push([S[0] / S[2], S[4], S[1] / S[2]])); m.visible = false; });
  { const prof = [[0.0, 0.0], [0.17, 0.0], [0.2, 0.05], [0.21, 0.12], [0.19, 0.2], [0.13, 0.27], [0.05, 0.3], [0.0, 0.305]].map((q) => new THREE.Vector2(q[0], q[1]));
    const vg = new THREE.LatheGeometry(prof, 72), vp = vg.attributes.position;
    for (let k = 0; k < vp.count; k++) { const x = vp.getX(k), z = vp.getZ(k), y = vp.getY(k), a = Math.atan2(z, x), rib = 1 + 0.07 * Math.max(0, Math.sin(a * 18 + y * 9)) * Math.min(1, y / 0.06) * (1 - Math.min(1, y / 0.3));
      vp.setX(k, x * rib); vp.setZ(k, z * rib); }
    vg.computeVertexNormals();
    const galv = K.mat('galv-steel-turbine-matte', { color: 0xa9aeb4, metalness: 0.55, roughness: 0.58 });
    const neckM = K.mat('galv-steel-turbine-neck', { color: 0x8e949a, metalness: 0.5, roughness: 0.6 });
    vaneSpots.forEach(([x, y, z]) => { const v = new THREE.Mesh(vg, galv); v.position.set(x, y, z); v.castShadow = true; v.userData.txBevel = false; R.scene.add(v);
      const band = new THREE.Mesh(new THREE.TorusGeometry(0.205, 0.012, 8, 48), neckM); band.rotation.x = Math.PI / 2; band.position.set(x, y + 0.13, z); R.scene.add(band); }); }
  const HS = house.userData.size;                    /* [W, H, D] measured by K.make */
  const hb = new THREE.Box3().setFromObject(house);

  /* the roof surface, read by casting down onto the house rather than restating the kit's seeded pitch */
  const ray = new THREE.Raycaster();
  const roofY = (x, z) => { ray.set(new THREE.Vector3(x, 30, z), new THREE.Vector3(0, -1, 0)); const h = ray.intersectObject(house, true); return h.length ? h[0].point.y : null; };
  const zEave = hb.min.z + 0.25;                       /* just inside the back gutter */
  const zA = zEave + 1.0, zB2 = zEave + 2.6, xS = -5.0;
  const yA = roofY(xS, zA), yB = roofY(xS, zB2);
  if (yA == null || yB == null) throw new Error('could not find the back slope');
  const pitch = (yB - yA) / (zB2 - zA);
  if (!(pitch > 0.3 && pitch < 0.7)) throw new Error('unexpected roof pitch ' + pitch.toFixed(3));
  const ang = Math.atan(pitch);
  const slopeLen = (hb.max.y - yA) / Math.sin(ang);
  /* a frame on the back slope: local x along the eave, local z up the slope, local y off the roof */
  const onSlope = (x, z, lift) => { const g = new THREE.Group(); const y = roofY(x, z); g.position.set(x, y + (lift || 0), z); g.rotation.x = -ang; return g; };

  /* ---------- THE DAMAGE. OSB decking in torn course rows, ragged shingle edges, felt remnants, nail rows ---------- */
  const deckTex = CH.canvasTex(THREE, 1024, 1024, (g, w, h) => {
    /* one tile = 2.44 m: an OSB sheet's strand flakes, sheet seams, rafter nail lines and shingle nail holes */
    const r = CH.rng(77); g.fillStyle = '#c99a5e'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) {
      const x = r() * w, y = r() * h, L = 14 + r() * 46, T = 3 + r() * 7, a = (r() - 0.5) * 1.2 + (r() < 0.5 ? 0 : Math.PI / 2);
      const t = r(); g.fillStyle = t < 0.35 ? 'rgba(150,98,48,' + (0.25 + r() * 0.3) + ')' : t < 0.75 ? 'rgba(232,196,130,' + (0.25 + r() * 0.35) + ')' : 'rgba(178,124,66,' + (0.3 + r() * 0.3) + ')';
      g.save(); g.translate(x, y); g.rotate(a); g.fillRect(-L / 2, -T / 2, L, T); g.restore();
    }
    const px = w / 2.44;                               /* pixels per metre */
    g.strokeStyle = 'rgba(70,42,20,0.75)'; g.lineWidth = 3;
    [0, 1.22].forEach((m) => { g.beginPath(); g.moveTo(m * px + 1, 0); g.lineTo(m * px + 1, h); g.stroke(); });
    g.beginPath(); g.moveTo(0, 1); g.lineTo(w, 1); g.stroke();
    /* rafter nail lines every 0.61 m, nails every 15 cm */
    for (let m = 0.305; m < 2.44; m += 0.61) for (let y = 8; y < h; y += 0.15 * px) {
      g.fillStyle = 'rgba(40,40,52,0.9)'; g.beginPath(); g.arc(m * px + (r() - 0.5) * 3, y, 3.4, 0, 7); g.fill();
      g.fillStyle = 'rgba(220,226,236,0.85)'; g.beginPath(); g.arc(m * px - 0.8, y - 0.8, 1.6, 0, 7); g.fill(); }
    /* the torn shingles' own nail holes: four per tab width, one row per 143 mm course */
    for (let y = 0.11 * px; y < h; y += 0.143 * px) for (let x = 10; x < w; x += 0.228 * px) {
      if (r() < 0.25) continue; g.fillStyle = 'rgba(30,30,40,0.8)'; g.fillRect(x + (r() - 0.5) * 6, y + (r() - 0.5) * 3, 4, 4); }
    /* old water stain tide lines */
    for (let k = 0; k < 5; k++) { const cx0 = r() * w, cy0 = r() * h, rad = 40 + r() * 90; const gr = g.createRadialGradient(cx0, cy0, rad * 0.6, cx0, cy0, rad);
      gr.addColorStop(0, 'rgba(120,80,40,0)'); gr.addColorStop(0.85, 'rgba(110,70,36,0.22)'); gr.addColorStop(1, 'rgba(110,70,36,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }
  }, null);
  deckTex.wrapS = deckTex.wrapT = THREE.RepeatWrapping;
  const deckBump = deckTex.clone(); deckBump.colorSpace = THREE.NoColorSpace; deckBump.needsUpdate = true;
  const osb = K.mat('osb-wood-decking', { color: 0xffffff, map: deckTex, bumpMap: deckBump, bumpScale: 1.2, roughness: 0.86 });
  const shingleTex = CH.canvasTex(THREE, 512, 256, (g, w, h) => {
    const r = CH.rng(5); g.fillStyle = '#5e4a44'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { const v = r(); g.fillStyle = v < 0.5 ? 'rgba(30,28,36,0.5)' : v < 0.85 ? 'rgba(120,112,118,0.45)' : 'rgba(150,110,80,0.4)'; g.fillRect(r() * w, r() * h, 2, 2); }
    g.fillStyle = 'rgba(20,18,26,0.85)'; for (let x = 0; x < w; x += w / 3) g.fillRect(x, h * 0.42, 5, h);   /* tab slots */
    g.fillStyle = 'rgba(16,14,20,0.55)'; g.fillRect(0, h * 0.38, w, 7);                                   /* the sealant strip */
  }, null);
  const shingleBump = shingleTex.clone(); shingleBump.colorSpace = THREE.NoColorSpace; shingleBump.needsUpdate = true;
  const shg = K.mat('asphalt-shingle-strip', { color: 0xffffff, map: shingleTex, bumpMap: shingleBump, bumpScale: 2.0, roughness: 0.93 });
  const felt = K.mat('felt-underlayment-paper', { color: 0x2c2a34, roughness: 0.7 });

  /* ONE SHINGLE TAB, modelled: a 6 mm slab 0.31 m deep whose upper edge sits at local z 0 and whose free lower edge (+z) and torn
   * end (+x or -x by the sign of `twist`) curl up off the deck, so a low key throws a real shadow line under every edge */
  const TAB_D = 0.31;
  const tabGeo = (len, curl, twist) => {
    const g = new THREE.BoxGeometry(len, 0.006, TAB_D, 14, 1, 8); g.translate(0, 0.003, TAB_D / 2);
    const p = g.attributes.position;
    for (let k = 0; k < p.count; k++) { const x = p.getX(k), z = p.getZ(k), u = z / TAB_D, e = (x / len + 0.5);
      const end = twist > 0 ? e : 1 - e;
      p.setY(k, p.getY(k) + curl * u * u + Math.abs(twist) * end * end * u); }
    g.computeVertexNormals(); return g;
  };
  const E = 0.143, ROWS = 19, PATCH_U = -6.4;                 /* course exposure, rows torn, patch centre along the eave */
  const patchZ = zEave + 0.75;                                /* first torn row, measured along plan z */
  const dmg = onSlope(PATCH_U, patchZ, 0.012); R.scene.add(dmg);
  const span = [];
  for (let i = 0; i < ROWS; i++) {
    const t = i / (ROWS - 1), env = Math.sin(Math.PI * (0.08 + 0.84 * t));
    const half = 0.35 + 1.55 * Math.pow(env, 0.7);
    const a = -half + (rng() - 0.5) * 0.8 + Math.sin(i * 0.9) * 0.22, b = half + (rng() - 0.5) * 0.8 + Math.sin(i * 1.3 + 1) * 0.26;
    span.push([a, b]);
    const v0 = i * E;
    const strip = new THREE.Mesh(new THREE.PlaneGeometry(b - a, E), osb);
    strip.rotation.x = -Math.PI / 2; strip.position.set((a + b) / 2, 0, -(v0 + E / 2)); /* local -z is up the slope after the flip below */
    const uv = strip.geometry.attributes.uv;
    for (let k = 0; k < uv.count; k++) uv.setXY(k, ((a + b) / 2 + (uv.getX(k) - 0.5) * (b - a) + PATCH_U + 10) / 2.44, (v0 + uv.getY(k) * E) / 2.44);
    strip.receiveShadow = true; dmg.add(strip);
    /* the torn ends: a modelled shingle tab at each end of the row, 6 mm thick, its free edge curled, some lifted by the wind */
    [[a, -1], [b, 1]].forEach(([x, s]) => {
      const len = 0.3 + rng() * 0.45, lift = rng() < 0.5 ? 0.2 + rng() * 0.45 : 0.02 * rng();
      const piece = new THREE.Mesh(tabGeo(len, 0.04 + rng() * 0.1, s * (0.03 + rng() * 0.08)), shg);
      const pivot = new THREE.Group(); pivot.position.set(x + s * len / 2, 0.004, -(v0 + TAB_D)); pivot.add(piece);
      piece.rotation.x = lift; pivot.rotation.y = (rng() - 0.5) * 0.12;
      piece.castShadow = true; piece.receiveShadow = true; piece.userData.txBevel = false; dmg.add(pivot);
      if (rng() < 0.45) { const f = new THREE.Mesh(new THREE.PlaneGeometry(0.06 + rng() * 0.12, E * 0.9), felt); f.rotation.x = -Math.PI / 2;
        f.position.set(x - s * 0.04, 0.003, -(v0 + E / 2)); f.receiveShadow = true; dmg.add(f); }
    });
  }
  /* the intact course above the hole: a full strip whose torn lower edge overhangs the decking and casts a fine line */
  [[-1, span[ROWS - 1]], [0, span[0]]].forEach(([end, sp]) => {
    const v = end ? ROWS * E : 0; const w = sp[1] - sp[0] + 1.2;
    for (let k = 0; k < Math.ceil(w / 0.9); k++) {
      const p = K.box(0.92, 0.011, E * 1.1, shg, sp[0] - 0.6 + k * 0.9 + 0.45, 0.002, -(v + (end ? E * 0.45 : -E * 0.1)), 0.003);
      p.rotation.y = (rng() - 0.5) * 0.06; p.rotation.x = end ? 0.03 : -0.02; p.castShadow = true; dmg.add(p);
    }
  });
  dmg.rotation.order = 'YXZ'; dmg.rotation.y = Math.PI; dmg.rotation.x = ang;   /* local -z runs up the back slope toward the ridge */
  dmg.position.set(PATCH_U, roofY(PATCH_U, patchZ) + 0.012, patchZ);

  /* loose tabs blown down the slope and onto the lawn under the eave */
  const tabs = new THREE.Group();
  for (let k = 0; k < 9; k++) {
    const x = PATCH_U - 3 + rng() * 6, z = zEave + 0.15 + rng() * 0.5; const y = roofY(x, z);
    if (y == null) continue; const p = new THREE.Mesh(tabGeo(0.33 + rng() * 0.3, 0.05 + rng() * 0.08, (rng() - 0.5) * 0.12), shg); p.position.set(x, y + 0.01, z); p.rotation.set(-ang + (rng() - 0.5) * 0.15, rng() * 6.28, 0, 'YXZ'); p.userData.txBevel = false; tabs.add(p);
  }
  for (let k = 0; k < 40; k++) {
    const x = PATCH_U - 6 + rng() * 12, z = hb.min.z - 0.4 - rng() * 4.5; const p = new THREE.Mesh(tabGeo(0.3 + rng() * 0.32, 0.04 + rng() * 0.1, (rng() - 0.5) * 0.14), shg); p.position.set(x, 0.01, z); p.rotation.set(0, rng() * 6.28, 0); p.userData.txBevel = false; tabs.add(p);
  }
  for (let k = 0; k < 22; k++) {
    const a2 = rng() * Math.PI * 2, x = PATCH_U + Math.cos(a2) * (1.9 + rng() * 0.9), z = patchZ + 1.3 + Math.sin(a2) * (1.3 + rng() * 0.6), y = roofY(x, z);
    if (y == null) continue; const p = new THREE.Mesh(tabGeo(0.3 + rng() * 0.35, 0.05 + rng() * 0.12, (rng() - 0.5) * 0.18), shg);
    p.position.set(x, y + 0.012, z); p.rotation.set(-ang, rng() * 6.28, 0, 'XYZ'); p.userData.txBevel = false; tabs.add(p);
  }
  TXT.add(R, tabs);

  /* ---------- THE TARP. A blue poly tarp over the upper right of the hole, creased, hemmed, grommeted, sandbagged ---------- */
  const TW = 3.0, TD = 2.4;
  const tarpG = new THREE.PlaneGeometry(TW, TD, 60, 48), tp = tarpG.attributes.position;
  for (let k = 0; k < tp.count; k++) { const x = tp.getX(k), y = tp.getY(k);
    const crease = 0.035 * Math.abs(Math.sin(x * 2.1 + 0.4)) + 0.025 * Math.abs(Math.sin(y * 2.6 + x * 0.3)) + 0.012 * Math.sin(x * 9 + y * 7);
    const sag = 0.05 * Math.exp(-((x - 0.3) * (x - 0.3) + (y + 0.2) * (y + 0.2)) * 0.8);
    tp.setZ(k, crease + sag); }
  tarpG.computeVertexNormals();
  const tarpTex = CH.canvasTex(THREE, 512, 512, (g, w, h) => { const r = CH.rng(9); g.fillStyle = '#2f6fd6'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(20,60,150,0.25)'; g.lineWidth = 1; for (let i = 0; i < w; i += 4) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
    for (let i = 0; i < 1400; i++) { g.fillStyle = 'rgba(255,255,255,' + (r() * 0.08) + ')'; g.fillRect(r() * w, r() * h, 3, 3); } }, [2, 2]);
  const tarpM = K.mat('poly-tarp-plastic', { color: 0xffffff, map: tarpTex, roughness: 0.42, clearcoat: 0.45, clearcoatRoughness: 0.35, sheen: 0.4, sheenColor: 0x9cc2ff, side: THREE.DoubleSide }, true);
  const tarp = new THREE.Mesh(tarpG, tarpM); tarp.castShadow = true; tarp.receiveShadow = true;
  const tarpHold = new THREE.Group(); tarpHold.add(tarp); tarp.rotation.x = -Math.PI / 2;
  const hem = K.mat('poly-tarp-hem-rope', { color: 0x2a5fc0, roughness: 0.5 });
  const brass = K.mat('brass-grommet-metal', { color: 0xc9a24a, metalness: 1, roughness: 0.3 });
  const edge = [[-TW / 2, -TD / 2], [TW / 2, -TD / 2], [TW / 2, TD / 2], [-TW / 2, TD / 2], [-TW / 2, -TD / 2]];
  for (let s = 0; s < 4; s++) { const A = edge[s], B = edge[s + 1];
    K.bar([A[0], 0.02, -A[1]], [B[0], 0.02, -B[1]], 0.014, hem, 8, tarpHold);
    const n = Math.round(Math.hypot(B[0] - A[0], B[1] - A[1]) / 0.6);
    for (let q = 0; q < n; q++) { const t = (q + 0.5) / n; const gm = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.007, 8, 16), brass); gm.rotation.x = Math.PI / 2;
      gm.position.set(A[0] + (B[0] - A[0]) * t, 0.03, -(A[1] + (B[1] - A[1]) * t)); tarpHold.add(gm); } }
  /* sandbags: woven polypropylene, lumpy, folded neck tucked under */
  const bagM = K.mat('sandbag-woven-fabric', { color: 0xa98f5c, roughness: 0.96 });
  const bagGeo = new THREE.SphereGeometry(1, 40, 24); { const bp = bagGeo.attributes.position;
    const sp = (v) => Math.sign(v) * Math.pow(Math.abs(v), 0.35);       /* a superellipsoid: a filled sack, square cornered, soft */
    for (let k = 0; k < bp.count; k++) { const x = bp.getX(k), y = bp.getY(k), z = bp.getZ(k); const n = 1 + 0.035 * Math.sin(x * 9 + z * 7) + 0.03 * Math.sin(z * 11 - x * 5);
      bp.setXYZ(k, sp(x) * 0.3 * n, Math.max(sp(y), -0.5) * 0.075 * n * (1 - 0.35 * x * x), sp(z) * 0.17 * n); } bagGeo.computeVertexNormals(); }
  const bagScale = new THREE.Box3().setFromBufferAttribute(bagGeo.attributes.position).getSize(new THREE.Vector3());
  if (bagScale.x > 0.7 || bagScale.y > 0.2) throw new Error('a sandbag is not sandbag sized: ' + bagScale.toArray().map((v) => v.toFixed(2)));
  [[-TW / 2 + 0.15, TD / 2 - 0.2, 0.4], [TW / 2 - 0.25, TD / 2 - 0.15, -0.3], [-TW / 2 + 0.25, -TD / 2 + 0.2, 0.9], [TW / 2 - 0.2, -TD / 2 + 0.25, 0.1], [0.2, -TD / 2 + 0.12, 1.6]].forEach(([x, y, ry]) => {
    const b = new THREE.Mesh(bagGeo, bagM); b.userData.txBevel = false; b.position.set(x, 0.06, -y); b.rotation.y = ry; b.castShadow = true; b.receiveShadow = true; tarpHold.add(b);
    const neck = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.14, 10), bagM); neck.rotation.set(0, ry, Math.PI / 2); neck.position.set(x + Math.cos(ry) * 0.36, 0.04, -y - Math.sin(ry) * 0.36); neck.castShadow = true; neck.userData.txBevel = false; tarpHold.add(neck);
  });
  const tU = PATCH_U + 1.75, tZ = patchZ + 1.85;
  tarpHold.rotation.order = 'YXZ'; tarpHold.rotation.y = 0.12; tarpHold.rotation.x = ang;
  /* the tarp lies in the back slope's plane: rotate its XZ plane up by the pitch about the eave line */
  tarpHold.rotation.set(0, 0, 0); { const qS = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -ang); const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.1);
    tarpHold.quaternion.copy(qS).multiply(qY); }
  tarpHold.position.set(tU, roofY(tU, tZ) + 0.03, tZ);
  TXT.add(R, tarpHold);

  /* ---------- THE CAMERA, framed first so the limb can be sent off the frame edge by measurement. A low drone oblique from
   * behind the back yard: the damaged back slope fills the middle, two neighbours recede beyond it, the sky is the type's field ---------- */
  TXT.frame(R, { fov: 50, from: [-24.0, 13.0, -20.0], look: [26.9, 1.34, 11.8] });
  R.camera.rotateZ(0.03); R.camera.updateMatrixWorld(true); R.camera.updateProjectionMatrix();
  const ndc = (v) => v.clone().project(R.camera);

  /* ---------- THE LIMB. One live oak limb, barked and tapering, still on its tree beyond the bottom left of the frame: it drops
