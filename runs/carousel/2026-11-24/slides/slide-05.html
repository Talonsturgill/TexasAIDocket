  /* painted block coursing on the back wall: 400 by 200 mm units, joints in a darker cobalt */
  { const bt = tex(1024, 1024, (g, w, h) => { g.fillStyle = '#3c63cf'; g.fillRect(0, 0, w, h);

      const s0 = new THREE.Mesh(new THREE.SphereGeometry(r0, 20, 14), nitrile); g.add(s0); const s1 = new THREE.Mesh(new THREE.SphereGeometry(r1, 20, 14), nitrile); s1.position.y = len; g.add(s1);
      if (flat) g.children.forEach((m) => m.scale.set(1, 1, flat));
      g.position.copy(A); g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); g.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; m.userData.txBevel = false; } }); hand.add(g); return g; };
    const blob = (p, sc) => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20), nitrile); m.scale.set(...sc); m.position.set(...p); m.castShadow = true; m.receiveShadow = true; m.userData.txBevel = false; hand.add(m); return m; };
    /* the back of the hand over the top edge, palm down onto it */
    blob([-0.006, TOP + 0.028, ZC + z(0.016)], [0.032, 0.032, 0.056]);
    /* four fingers over the edge and down the back face, each with a knuckle on the edge and two bends */
    [[-0.032, 0.9], [-0.011, 1.0], [0.01, 0.97], [0.03, 0.8]].forEach(([dz, k]) => {

    });
    /* the thumb on the printed face, laid flat and angled down and in, from a soft mound on the near side of the edge */
    blob([PT / 2 + 0.008, TOP + 0.004, ZC + z(0.044)], [0.014, 0.024, 0.02]);
    const a0 = [PT / 2 + 0.0105, TOP - 0.004, ZC + z(0.042)], a1 = [PT / 2 + 0.0095, TOP - 0.03, ZC + z(0.03)], a2 = [PT / 2 + 0.0088, TOP - 0.05, ZC + z(0.02)];
    seg(a0, a1, 0.0128, 0.0118, 0.8); seg(a1, a2, 0.0118, 0.0102, 0.8);

    const W0 = [-0.008, TOP + 0.038, ZC + z(0.056)], DIR = new THREE.Vector3(-0.04, 0.32, sR * 0.95).normalize();

    const cp = []; for (let i = 0; i <= 12; i++) { const t = i / 12; cp.push(new THREE.Vector2(0.031 + 0.004 * Math.sin(t * Math.PI), t * 0.03)); }
    const cuffM = new THREE.Mesh(new THREE.LatheGeometry(cp, 36), nitrile); cuffM.castShadow = true; cuffM.userData.txBevel = false;
    const cg = new THREE.Group(); cg.position.copy(W1); cg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), DIR); cg.add(cuffM); hand.add(cg);
    const prof = []; for (let i = 0; i <= 48; i++) { const t = i / 48; prof.push(new THREE.Vector2(0.045 + 0.016 * t + 0.0035 * Math.sin(t * 34) * (0.4 + t), t * 0.9)); }
    const slv = new THREE.Mesh(new THREE.LatheGeometry(prof, 44), coat); slv.castShadow = true; slv.receiveShadow = true; slv.userData.txBevel = false;
    const sg = new THREE.Group(); sg.position.copy(W1.clone().add(DIR.clone().multiplyScalar(0.022))); sg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), DIR); sg.add(slv); hand.add(sg);
    const hemR = new THREE.Mesh(new THREE.TorusGeometry(0.046, 0.006, 12, 36), coat); hemR.position.copy(sg.position); hemR.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), DIR); hemR.castShadow = true; hand.add(hemR);
  }

  /* THE BENCH POOL: the window's warm light lying across the empty front of the bench, and a hard contact under the cradle */
  { const raycast = (sx, sy) => { const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(sx / 540 - 1, 1 - sy / 675), R.camera); const t = (BY - rc.ray.origin.y) / rc.ray.direction.y; return rc.ray.origin.clone().add(rc.ray.direction.clone().multiplyScalar(t)); };
    const P = raycast(330, 1090);
    const sp = new THREE.SpotLight(0xffc27a, 26, 7, 0.36, 0.7, 1.0); sp.position.set(P.x - 1.6, BY + 2.0, P.z + 1.2); sp.target.position.copy(P); sp.castShadow = true; sp.shadow.mapSize.set(2048, 2048); sp.shadow.bias = -0.0005; sp.shadow.radius = 4;
    R.scene.add(sp); R.scene.add(sp.target);
    const cs = TXT.contact(R, rack, { opacity: 0.9, layers: [{ spread: 0.008, opacity: 0.75 }, { spread: 0.1, opacity: 0.35 }] }); (cs || []).forEach((m) => m.material.color.set(0x2a1470)); }

  /* THE LIGHT: a warm window low at front left, its frame and mullions cast across the bench and wall */
  const LAZ = 18, LEL = 22;  /* REPAIR: a raking key from front right, grazing the plate faces and catching every top edge */
  const spec = CH.rigSpec(W, 3.2, 4096);
  TXT.deckRig(R, spec, Object.assign(CH.rigOpts([-0.4, 1.0, -0.2], { distance: 9, shadowFar: 20, normalBias: 0.004 }), { light: { az: LAZ, el: LEL } }));
  CH.unacne(R, 0.004);
  { const a = LAZ * Math.PI / 180, e = LEL * Math.PI / 180, dir = new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
    const C = new THREE.Vector3(-0.4, 1.0, -0.2).add(dir.clone().multiplyScalar(3.2));
    const occ = new THREE.Group(); const om = new THREE.MeshBasicMaterial({ color: 0x000000, colorWrite: false, name: 'window-occluder' }); om.userData.txSurface = false;
    const piece = (x, y, w, h) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), om); m.position.set(x, y, 0); m.castShadow = true; m.userData.txBevel = false; occ.add(m); };
    /* REPAIR: the window opening is placed by search, so its lit patch on the wall stays clear of the dek box
       while the pulled plate's four corners stay in the light */
    occ.position.copy(C); occ.lookAt(C.clone().add(dir)); occ.updateMatrixWorld(true);
    const WH = 1.6, plateCorners = [[0, PW / 2, PW / 2], [0, PW / 2, -PW / 2], [0, -PW / 2, PW / 2], [0, -PW / 2, -PW / 2]].map((q) => held.localToWorld(new THREE.Vector3(...q)));
    const litBy = (P, ox, oy, ww) => { const t = C.clone().sub(P).dot(dir); const L = occ.worldToLocal(P.clone().add(dir.clone().multiplyScalar(t))); return Math.abs(L.x - ox) < ww / 2 - 0.08 && Math.abs(L.y - oy) < WH / 2 - 0.08; };
    const db = dek.getBoundingClientRect(), BOX = [db.left - 40, db.top - 30, db.right + 50, db.bottom + 40];
    const wallHits = (ox, oy, ww) => { for (let i = 0; i <= 16; i++) for (let j = 0; j <= 16; j++) { const Q = occ.localToWorld(new THREE.Vector3(ox + (i / 16 - 0.5) * ww, oy + (j / 16 - 0.5) * WH, 0)); const k = (Q.z + 0.62) / dir.z; const q = CH.project(THREE, R, Q.clone().sub(dir.clone().multiplyScalar(k)).toArray()); if (q[0] > BOX[0] && q[0] < BOX[2] && q[1] > BOX[1] && q[1] < BOX[3]) return true; } return false; };
    let best = null;
    for (const ww of [2.6, 2.2, 1.8, 3.2]) { for (let ox = -3; ox <= 3.001; ox += 0.05) for (let oy = -1.5; oy <= 1.501; oy += 0.1) {
      if (wallHits(ox, oy, ww)) continue; if (!plateCorners.every((P) => litBy(P, ox, oy, ww))) continue;
      const cost = Math.abs(ox) + Math.abs(oy); if (!best || cost < best.cost) best = { ox, oy, ww, cost }; } if (best) break; }
    if (!best) throw new Error('no window placement keeps the lit patch off the dek and the pulled plate lit');
    window.__win = best;
    const WW = best.ww, OX = best.ox, OY = best.oy, pc = (x, y, w, h) => piece(OX + x, OY + y, w, h);
    pc(-WW / 2 - 3, 0, 6, 12); pc(WW / 2 + 3, 0, 6, 12); pc(0, WH / 2 + 3, WW, 6); pc(0, -WH / 2 - 3, WW, 6);
    pc(0, 0, 0.06, WH); pc(-WW / 4, 0, 0.04, WH); pc(WW / 4, 0, 0.04, WH); pc(0, 0.2, WW, 0.05);
    R.scene.add(occ); }
  R.scene.environmentIntensity = 0.7;
  { const f = new THREE.DirectionalLight(0x8a90ff, 0.6); f.position.set(2, 2.5, 5); R.scene.add(f); }

  /* checks: the rack spans the frame, the held plate is big, no face in frame */
  { const a = CH.project(THREE, R, [X0, BY + 0.2, RZ]), b = CH.project(THREE, R, [X1, BY + 0.2, RZ]);
    const span = Math.min(1080, Math.max(a[0], b[0])) - Math.max(0, Math.min(a[0], b[0]));
    if (span < 0.7 * 1080) throw new Error('the rack spans only ' + Math.round(span) + ' px');
    const r0 = CH.rectOf(THREE, R, held, 0); if (r0[2] < 200) throw new Error('the held plate is only ' + Math.round(r0[2]) + ' px wide');
    if (false) { const ep = CH.project(THREE, R, window.__techEye.toArray()); if (ep[0] > 0 && ep[0] < 1080 && ep[1] > 0 && ep[1] < 1350) throw new Error('the technician face is in frame at ' + ep.map(Math.round)); }
    window.__s5 = { span, held: r0 }; }

  TXT.weather(R, { grime: 0.03, height: 0.1, mottle: 0.04 });
  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  /* REPAIR: the block coursing is knocked out behind the dek, a feathered soft focus of the wall itself, so no mortar joint strikes a line */
  { const d = dek.getBoundingClientRect(), P = 36, F = 30, S = 2, cv = cx.canvas;
    const x = (d.left - P) * S, y = (d.top - P) * S, w = (d.width + 2 * P) * S, h = (d.height + 2 * P) * S;

  CH.seat(cx, { sel: '.hook, .dek', a: 0.3, fade: 240 });
  CH.seat(cx, { sel: '.dek', a: 0.62, fade: 200 });
