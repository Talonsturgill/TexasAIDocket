<!-- BESPOKE, 2026-11-24, frame 1 of 9, the cover. AFTER THE STORM. A drone's eye 30 m over a drawn Gulf Coast subdivision
at evening after a storm. The near roofs are kit brick ranch houses cut by the bottom edge, the middle one stripped to OSB
decking with a blue tarp; a live oak from its front yard lies across the street on its gumbo root plate; one gold route
(the way through, the accent's one meaning) bends past the crown and leaves the right edge; every roof to the hazed horizon
carries a thin HOLLOW cool rim. Roofs drawn, kit plus instanced, equal FIG.buildings. Drawn to illustrate, no real place. -->
<html>

<body>

<p class="dek" data-follow="22" style="left:74px; width:930px">Texas A&amp;M's CLARKE reads drone imagery after a disaster and returns a detailed damage assessment within minutes. Neighborhood and colors drawn to illustrate.</p>
<script>window.FIG = {"buildings": 2000};</script>

<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/txlook.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-24-roofread-bespoke.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';

/* CAMERA (frame 9 copies this). Neighbourhood coordinates: streets run along x, the camera looks down +z, screen right is
 * -x. YAW_FROM_SUN turns the whole neighbourhood so the camera's forward is that many degrees clockwise of the sun's
 * bearing (CH.bearing), which puts the evening sun behind the camera's left shoulder. */
const CAM_POS = [0, 30, -63], CAM_TARGET = [0, 0, 84], CAM_FOV = 50, YAW_FROM_SUN = 105;
const KEY = { az: -55, el: 12 };

window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "After the storm", counter: "01 / 09", src: "c24 c1 c16", fit: { min: 84, max: 108, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: CAM_FOV, near: 0.5, far: 6000 });

  /* THE NEIGHBOURHOOD'S BEARING in the world */
  const f = CH.bearing(TXT, YAW_FROM_SUN), YAW = Math.atan2(f[0], f[1]), cy = Math.cos(YAW), sy = Math.sin(YAW);
  const wp = (x, y, z) => [x * cy + z * sy, y, -x * sy + z * cy];
  const place = (obj, x, z, ry, y) => { const p = wp(x, y || 0, z); obj.position.set(p[0], p[1], p[2]); obj.rotation.y = (ry || 0) + YAW; return obj; };
  const rng = CH.rng(2411);

  /* THE FIGURE: FIG.buildings lots, every one carries one roof, kit house or instanced */
  const lots = CH.lots(FIG.buildings, CH.SEED);
  if (lots.length !== FIG.buildings) throw new Error('lots ' + lots.length + ' differ from FIG.buildings ' + FIG.buildings);
  const cols = Math.ceil(Math.sqrt(FIG.buildings * 2.2));
  const HERO = Math.floor((cols - 1) / 2);                       /* row 0, the lot at x near 0 */
  const KIT = new Set();
  for (let c = HERO - 2; c <= HERO + 2; c++) KIT.add(c);           /* the near row, cut by the bottom edge */
  for (let c = HERO - 3; c <= HERO + 3; c++) KIT.add(cols + c);    /* across the street */
  for (let c = HERO - 4; c <= HERO + 4; c++) { KIT.add(2 * cols + c); KIT.add(3 * cols + c); }
  for (let c = HERO - 5; c <= HERO + 5; c++) { KIT.add(4 * cols + c); KIT.add(5 * cols + c); }   /* the next block, so the middle distance is real houses */
  const skip = (L, i) => KIT.has(i);
  const fz = (L) => Math.cos(L.ry) > 0 ? 1 : -1;                   /* +1 when the house fronts +z */

  /* THE CARPET: instanced walls and hip or gable roofs for every lot that is not a kit house, with HOLLOW rims */
  const carpet = CH.carpet(THREE, K, lots, { rims: 'hollow', damage: true, skip });
  carpet.rotation.y = YAW; R.scene.add(carpet);
  /* the instanced roofs take a shingle course texture in world space so the near carpet reads as roofing, not a solid */
  const shingleTex = CH.canvasTex(THREE, 256, 256, (g, w, h) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); const r = CH.rng(91);
    for (let y = 0; y < h; y += 16) { g.fillStyle = 'rgba(40,36,60,0.32)'; g.fillRect(0, y, w, 3);
      for (let x = (y / 16) % 2 ? 0 : 16; x < w; x += 32) { g.fillStyle = 'rgba(40,36,60,0.22)'; g.fillRect(x, y, 2, 16); } }
    for (let i = 0; i < 1400; i++) { g.fillStyle = 'rgba(' + (r() < 0.5 ? '255,255,255' : '30,30,50') + ',' + (r() * 0.12).toFixed(3) + ')'; g.fillRect(r() * w, r() * h, 2, 2); }
  }, [1, 1]);
  carpet.traverse(m => { if (m.isInstancedMesh && m.material && /rr-roof-\d/.test(m.material.name || '')) {
    const mat = m.material.clone(); mat.name = (m.material.name || 'roof') + '-asphalt-shingle';
    mat.onBeforeCompile = (sh) => {
      sh.uniforms.uSh = { value: shingleTex };
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWp;')
        .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWp = (modelMatrix * instanceMatrix * vec4(transformed,1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform sampler2D uSh; varying vec3 vWp;')
        .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb *= texture2D(uSh, vec2(vWp.x * 0.22, vWp.y * 1.6 + vWp.z * 0.22)).rgb;');
    };
    m.material = mat; } });

  /* THE STREETS: asphalt ribbons with concrete curbs along every centreline the layout returns */
  const asphalt = K.mat('asphalt-street', { color: 0x4a4866, roughness: 0.92 }, true);
  const curbM = K.mat('conc-curb', { color: 0xe6d9c4, roughness: 0.85 }, true);
  const ribbon = (line, half, y, mat) => {
    const pos = [], idx = [];
    line.forEach((p, i) => { const a = line[Math.max(0, i - 1)], b = line[Math.min(line.length - 1, i + 1)];
      const dx = b[0] - a[0], dz = b[1] - a[1], n = Math.hypot(dx, dz) || 1, nx = -dz / n, nz = dx / n;
      const L = wp(p[0] + nx * half[0], y, p[1] + nz * half[0]), Rr = wp(p[0] + nx * half[1], y, p[1] + nz * half[1]);
      pos.push(...L, ...Rr); if (i) { const k = i * 2; idx.push(k - 2, k - 1, k, k - 1, k + 1, k); } });
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    if (g.attributes.normal.getY(0) < 0) { idx.reverse(); g.setIndex(idx); g.computeVertexNormals(); }
    const m = new THREE.Mesh(g, mat); m.receiveShadow = true; m.userData.txBevel = false; R.scene.add(m); return m;
  };
  const dense = (line) => { const out = []; for (let i = 0; i < line.length - 1; i++) for (let k = 0; k < 4; k++) { const t = k / 4; out.push([line[i][0] + (line[i + 1][0] - line[i][0]) * t, line[i][1] + (line[i + 1][1] - line[i][1]) * t]); } out.push(line[line.length - 1]); return out; };
  lots.streets.forEach(s => { const d = dense(s); ribbon(d, [-4.2, 4.2], 0.035, asphalt); ribbon(d, [-4.55, -4.2], 0.12, curbM); ribbon(d, [4.2, 4.55], 0.12, curbM); });

  /* THE KIT HOUSES: brick ranch houses at true size on their own lots, each with contact, a hollow rim at eave height */
  const BRICKS = ['#a0583c', '#8e4a33', '#b06a48', '#9a6a4b', '#a4624a', '#7c4637', '#b48a62'];
  const kitHouses = [], heroInfo = {};
  const burlap = K.mat('burlap-fabric-sack', { color: 0x8e7448, roughness: 0.98 }, true);
  const felt0 = K.mat('felt-underlayment-paper', { color: 0x2c2840, roughness: 0.95 }, true);
  const blobTex = CH.canvasTex(THREE, 128, 128, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  const blobMat = new THREE.MeshBasicMaterial({ color: 0x1c1648, alphaMap: blobTex, transparent: true, opacity: 0.6, depthWrite: false }); blobMat.userData.txSurface = false;
  const ray = new THREE.Raycaster();
  const roofY = (obj, x, z) => { ray.set(new THREE.Vector3(x, 60, z), new THREE.Vector3(0, -1, 0)); const h = ray.intersectObject(obj, true)[0]; return h ? h.point.y : null; };
  [...KIT].forEach((i, k) => {
    const L = lots[i], hero = i === HERO;
    const near = i < cols, mat = near ? 'brick' : ['brick', 'brick', 'limestone', 'siding', 'brick'][(i * 7) % 5];
    const roofs = near ? ['#7d6c60', '#8a7a6c', '#6e665c'] : ['#4a4650', '#5d564f', '#6e665c', '#3e4250', '#57524a', '#7a6a5e'];
    const h = K.make('ranch_house', { material: mat, color: mat === 'brick' ? BRICKS[(i * 3) % BRICKS.length] : null, garage: 'none', chimney: !near && (i % 3 === 0), seed: 300 + i, roof: roofs[(i * 5) % roofs.length] });
    h.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(h), sz = bb.getSize(new THREE.Vector3());
    if (hero || i === HERO - 1) {
      /* THE STORM'S DAMAGE on the back slope that faces the camera: decking bared, torn tabs, a tarp on the hero's corner */
      const zc = -sz.z * 0.27, xc = hero ? -0.6 : 1.2;
      const y0 = roofY(h, xc, zc - 0.8), y1 = roofY(h, xc, zc + 0.8);
      if (y0 == null || y1 == null) throw new Error('roof ray missed the kit house');
      const slope = (y1 - y0) / 1.6;
      const dmg = CH.roofDamage(THREE, K, hero ? { w: 5.4, d: 3.6, tarp: true, tw: 3.0, td: 2.4, seed: 5 } : { w: 3.2, d: 1.9, tarp: false, seed: 8 });
      dmg.rotation.x = -Math.atan(slope); dmg.position.set(xc, (y0 + y1) / 2 + 0.06, zc);
      dmg.traverse(m => { if (m.isMesh && /tarp/.test(m.material.name || '')) m.position.y = 0.2; if (m.isMesh && /bag/.test(m.material.name || '')) m.position.y = 0.3; });
      h.add(dmg);
      if (hero) {
        /* the stripped decking carries on to the hip and folds over it: one piece on the back facet up against the hip
         * line (merging into the main patch), one on the end facet just across it, each laid at its own facet's pitch */
        const xe = -sz.x / 2 + 0.15, ze = -sz.z / 2 + 0.15, hipx = (z) => xe + (z - ze);
        const zb = ze + 3.2, xb = hipx(zb) + 1.35, b0 = roofY(h, xb, zb - 0.3), b1 = roofY(h, xb, zb + 0.3);
        const ze2 = ze + 4.6, xe2 = hipx(ze2) - 1.25, e0 = roofY(h, xe2 - 0.3, ze2), e1 = roofY(h, xe2 + 0.3, ze2);
        if ([b0, b1, e0, e1].some(v => v == null)) throw new Error('roof ray missed a hip facet');
        const backP = CH.roofDamage(THREE, K, { w: 1.4, d: 1.2, tarp: false, seed: 6 });
        backP.rotation.x = -Math.atan((b1 - b0) / 0.6); backP.position.set(xb, (b0 + b1) / 2 + 0.065, zb); h.add(backP);
        const endP = CH.roofDamage(THREE, K, { w: 1.2, d: 1.2, tarp: false, seed: 7 });
        endP.rotation.z = Math.atan((e1 - e0) / 0.6); endP.position.set(xe2, (e0 + e1) / 2 + 0.065, ze2); h.add(endP);
        heroInfo.size = sz;
        /* LUMPY SANDBAGS on the tarp: lumpy burlap sacks, each with a soft contact shadow, replacing the chassis lumps */
        let tarp = null; dmg.traverse(m => { if (m.isMesh && /bag/.test(m.material.name || '')) m.visible = false; if (m.isMesh && /tarp/.test(m.material.name || '')) tarp = m; });
        const tp = tarp.position, TW = 3.0, TD = 2.4;
        [[-0.47, -0.3], [-0.12, -0.5], [0.4, -0.46], [0.5, 0.18], [0.08, 0.49], [-0.46, 0.38]].forEach(([u, v], k) => {
          const sack = new THREE.Group();
          const g = new THREE.SphereGeometry(0.26, 22, 14), pp = g.attributes.position;
          for (let q = 0; q < pp.count; q++) { const vv = new THREE.Vector3().fromBufferAttribute(pp, q), n = 1 + 0.09 * Math.sin(vv.x * 31 + k) * Math.cos(vv.z * 27) + 0.05 * Math.sin(vv.y * 40 + vv.x * 17); vv.multiplyScalar(n); if (vv.y < -0.05) vv.y = -0.05 + (vv.y + 0.05) * 0.25; pp.setXYZ(q, vv.x, vv.y, vv.z); }
          g.computeVertexNormals();
          const body = new THREE.Mesh(g, burlap); body.scale.set(1.05, 0.36, 0.62); body.castShadow = true; body.receiveShadow = true; sack.add(body);
          const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.55), blobMat); shadow.rotation.x = -Math.PI / 2; shadow.position.y = -0.1; sack.add(shadow);
          sack.position.set(tp.x + u * TW, 0.32, tp.z + v * TD); sack.rotation.y = (Math.abs(u) > 0.4 ? Math.PI / 2 : 0) + (k * 1.7 % 1 - 0.5) * 0.7; dmg.add(sack);
        });
      }
    }
    /* TORN TABS AND BARE FELT on the near roofs' camera slope, each laid on the roof plane found by a ray */
    if (near) {
      const onRoof = (obj, x, z, lift) => { const a = roofY(h, x, z - 0.3), b = roofY(h, x, z + 0.3); if (a == null || b == null) return false;
        const g = new THREE.Group(); g.rotation.x = -Math.atan((b - a) / 0.6); g.position.set(x, (a + b) / 2 + (lift || 0.03), z); g.add(obj); h.add(g); return true; };
      const rr = CH.rng(77 + i), sh = K.mat('shingle-torn-asphalt-' + k, { color: new THREE.Color(roofs[(i * 5) % roofs.length]).multiplyScalar(0.55), roughness: 0.92 }, true);
      const xs = sz.x / 2 - 4.2, zs = [-sz.z / 2 + 1.0, -1.2];
      const nT = hero ? 32 : 22;
      for (let t = 0; t < nT; t++) {
        const tab = TXT.roundedBox(0.92, 0.025, 0.33, 0.01, sh); tab.castShadow = true;
        tab.rotation.y = (rr() - 0.5) * 0.9; tab.rotation.z = (rr() - 0.5) * 0.35; tab.rotation.x = -rr() * 0.18;
        onRoof(tab, (rr() - 0.5) * 2 * xs, zs[0] + rr() * (zs[1] - zs[0]), 0.05 + rr() * 0.03);
      }
      if (!hero) for (let f = 0; f < 3; f++) {
        const felt = new THREE.Mesh(new THREE.PlaneGeometry(1.6 + rr() * 1.4, 0.9 + rr() * 0.6), felt0); felt.rotation.x = -Math.PI / 2; felt.receiveShadow = true;
        onRoof(felt, (rr() - 0.5) * 2 * xs, zs[0] + 0.6 + rr() * (zs[1] - zs[0] - 1.2), 0.035);
      }
    }
    place(h, L.x, L.z, L.ry); TXT.add(R, h); TXT.contact(R, h, { opacity: 0.8 });
    const rim = CH.rim(THREE, K, sz.x, sz.z, L.step, false, 3.02); place(rim, L.x, L.z, L.ry); R.scene.add(rim);
    kitHouses.push(h);
  });

  /* THE COUNT: every lot carries exactly one roof, so the roofs drawn equal FIG.buildings */
  const drawn = carpet.userData.count + kitHouses.length;
  if (drawn !== FIG.buildings) throw new Error('roofs drawn ' + drawn + ' differ from FIG.buildings ' + FIG.buildings);

  /* DRIVEWAYS, BACK FENCES, POOLS: instanced per lot so the far carpet keeps a texture of yards */
  const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler(), S = new THREE.Vector3(), P = new THREE.Vector3();
  const inst = (geo, mat, list, shadow) => { const im = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((it, j) => { const p = wp(it[0], it[1], it[2]); E.set(0, it[3] + YAW, 0); Q.setFromEuler(E); S.set(it[4], it[5], it[6]); P.set(p[0], p[1], p[2]); M4.compose(P, Q, S); im.setMatrixAt(j, M4); });
    im.instanceMatrix.needsUpdate = true; im.castShadow = !!shadow; im.receiveShadow = true; R.scene.add(im); return im; };
  const unit = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  const drives = [], fences = [], sideF = [], pools = [], coping = [], kitFences = [];
  lots.forEach((L, i) => {
    const s = fz(L), front = L.z + s * (L.d / 2 + 0.3), edge = L.z + s * 15.1, len = Math.abs(edge - front);
    drives.push([L.x + L.w * 0.26, 0.02, (front + edge) / 2, 0, 5.2, 0.06, len]);
    const row = Math.floor(i / cols), kitF = (row === 1 || row === 2) && Math.abs(L.x) < 64;
    if (kitF) { kitFences.push({ L, i, s, back: s < 0 }); }
    else { if (s < 0) fences.push([L.x, 0, L.z - s * 20.6, L.ry, 19.6, 1.8, 0.12]); sideF.push([L.x + 10, 0, L.z - s * 12.6, 0, 0.14, 1.8, 16]); }
    if (rng() < 0.12 && !KIT.has(i)) { const pz = L.z - s * 13.5, px = L.x + (rng() - 0.5) * 5; pools.push([px, 0.06, pz, 0, 7, 0.05, 3.8]); coping.push([px, 0.02, pz, 0, 8.2, 0.07, 5]); }
  });
  inst(unit, K.mat('conc-drive', { color: 0xe9dcc6, roughness: 0.88 }, true), drives, false);
  const cedar = K.mat('cedar-fence-wood', { color: 0x6e4c3a, roughness: 0.92 }, true);
  inst(unit, cedar, fences, true); inst(unit, cedar, sideF, true);
  /* the near blocks get real cedar privacy fences, pickets on rails and posts, and the storm has laid some panels flat */
  const fencePiece = (len, x, z, ry, flat, seed) => {
    const fn = K.make('privacy_fence', { length: len, height: 1.83, weathered: 0.45 + (seed % 5) * 0.08, seed });
    const g = new THREE.Group(); g.add(fn);
    if (flat) { fn.rotation.x = -Math.PI / 2 + 0.06; fn.position.y = 0.1; }
    place(g, x, z, ry); TXT.add(R, g); if (!flat) TXT.contact(R, g, { opacity: 0.5 }); return g;
  };
  kitFences.forEach(({ L, i, s, back }) => {
    if (back) { const knocked = (i % 4) === 1;
      if (knocked) { fencePiece(9.8, L.x - 4.9, L.z - s * 20.6, L.ry, false, i); fencePiece(9.6, L.x + 4.9, L.z - s * 20.6 + s * 1.1, L.ry, true, i + 1); }
      else fencePiece(19.6, L.x, L.z - s * 20.6, L.ry, false, i); }
    const flatSide = (i * 7) % 5 === 0;
    fencePiece(16, L.x + 10 - (flatSide ? 1.0 : 0), L.z - s * 12.6, Math.PI / 2, flatSide, i + 9);
  });
  inst(unit, K.mat('conc-coping', { color: 0xf0e4cf, roughness: 0.8 }, true), coping, false);
  inst(unit, K.mat('pool-water-glass', { color: 0x1fc7d6, roughness: 0.08, emissive: 0x0a6a80, emissiveIntensity: 0.25 }, true), pools, false);

  /* YARD TREES: kit live oaks and crape myrtles on the kit lots, a leaf canopy instanced everywhere else */
  const canopyGeo = (() => { const g = new THREE.SphereGeometry(1, 28, 18), p = g.attributes.position, r = CH.rng(7);
    for (let k = 0; k < p.count; k++) { const v = new THREE.Vector3().fromBufferAttribute(p, k), n = 1 + 0.16 * Math.sin(v.x * 7.1 + v.y * 5.3) * Math.cos(v.z * 6.7) + 0.08 * Math.sin(v.y * 13 + v.x * 9); v.multiplyScalar(n); if (v.y < -0.2) v.y = -0.2 + (v.y + 0.2) * 0.3; p.setXYZ(k, v.x, v.y, v.z); }
    g.computeVertexNormals(); return g; })();
  const leaves = [[], []];
  lots.forEach((L, i) => {
    if (!L.tree || i < cols || i === cols + HERO || i === cols + HERO - 1) return;
    const s = fz(L), tx = L.x + L.treeX * 0.7, tz = L.z + s * (L.d / 2 + 4.6);
    if (KIT.has(i)) {
      const t = (i % 3) ? K.make('live_oak', { height: 7.5, spread: 10, seed: i }) : K.make('crape_myrtle', { height: 5, spread: 5, bloom: 'lavender', seed: i });
      place(t, tx, tz, rng() * 6); TXT.add(R, t); return;
    }
    const r = 2.8 + rng() * 2.2; leaves[i % 2].push([tx, 2.6 + r * 0.55, tz, rng() * 6, r, r * 0.72, r]);
    if (rng() < 0.4) { const r2 = 2.4 + rng() * 2; leaves[(i + 1) % 2].push([L.x - L.treeX * 0.6, 2.4 + r2 * 0.5, L.z - s * 15, rng() * 6, r2, r2 * 0.7, r2]); }
  });
  inst(canopyGeo, K.mat('live-oak-foliage', { color: 0x2f6a2c, roughness: 0.85 }, true), leaves[0], true);
  inst(canopyGeo, K.mat('elm-foliage', { color: 0x3f7a2e, roughness: 0.85 }, true), leaves[1], true);

  /* THE FALLEN OAK, laid fully on its side: built lying down, its trunk diagonal across both lanes and the crown spilling toward the far curb. At the
   * base, a torn gumbo clay root plate stands on edge with root stubs, and the crater it left is open in the parkway. */
  const sz0 = (x) => Math.sin(x / 140) * 9 + Math.sin(x / 61) * 2.5;
  const og = new THREE.Group();
  {
    const clay = K.mat('gumbo-clay-dirt', { color: 0x4a2c20, roughness: 1 }, true), clay2 = K.mat('gumbo-clay-wet-dirt', { color: 0x5e3826, roughness: 0.9 }, true);
    const rootM = K.mat('oak-root-bark-wood', { color: 0x5b3f2a, roughness: 0.95 }, true), sod = K.mat('torn-sod-lawn', { color: 0x4f6e2a, roughness: 1 }, true);
    const rr = CH.rng(44);
    /* THE TREE ITSELF, built lying down along +x. A long bark-textured trunk runs from the root plate into the crown, five
     * great limbs splay flat along the asphalt and touch down, and the crown is built from clustered leaf cards (small
     * cards each carrying a painted cluster of live oak leaves) over a navy shadow core, so the honey key catches the top
     * and the underside goes to navy, and it reads as a tree on its side across the lane. */
    const barkTex = CH.canvasTex(THREE, 256, 512, (g, w, h) => { const r = CH.rng(61);
      g.fillStyle = '#5a3f2e'; g.fillRect(0, 0, w, h);
      for (let x = 0; x < w; x += 10 + r() * 14) { g.fillStyle = 'rgba(28,18,22,' + (0.45 + r() * 0.35).toFixed(2) + ')'; g.fillRect(x, 0, 2 + r() * 4, h); }
      for (let y = 0; y < h; y += 18 + r() * 26) { g.fillStyle = 'rgba(28,18,22,0.5)'; g.fillRect(0, y, w, 2 + r() * 2); }
      for (let i = 0; i < 2600; i++) { g.fillStyle = 'rgba(' + (r() < 0.5 ? '140,110,84' : '40,28,30') + ',' + (r() * 0.35).toFixed(2) + ')'; g.fillRect(r() * w, r() * h, 3 + r() * 8, 2 + r() * 5); }
    }, [3, 1]);
    const barkM = K.mat('live-oak-bark-wood', { color: 0xffffff, map: barkTex, roughness: 0.95 }, true);
    const tube = (pts, r) => { const m = TXT.tube(pts, r, barkM); if (m) { m.castShadow = true; m.receiveShadow = true; og.add(m); } return m; };
    const TRUNK_END = 5.2;
    tube([[-0.25, 0.6, 0], [1.6, 0.58, 0.05], [3.0, 0.56, -0.05]], 0.58);
    tube([[2.8, 0.56, -0.04], [4.2, 0.54, 0.02], [TRUNK_END, 0.52, 0.06]], 0.46);
    const decal = (x, z, w, d, a) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), blobMat); m.rotation.x = -Math.PI / 2; m.rotation.z = a || 0; m.position.set(x, 0.05, z); og.add(m); };
    decal(1.6, 0, 5.4, 1.7, 0); decal(4.4, 0, 2.4, 1.4, 0);
    /* the leaf card: a painted cluster of small glossy live oak leaves on transparent ground */
    const cardTex = CH.canvasTex(THREE, 256, 256, (g, w, h) => { const r = CH.rng(83); g.clearRect(0, 0, w, h);
      const cols = ['#3f5e24', '#4c6b28', '#5a7a2c', '#334f20', '#6b8a34'];
      for (let i = 0; i < 70; i++) { const a = r() * Math.PI * 2, d = Math.sqrt(r()) * w * 0.42, x = w / 2 + Math.cos(a) * d, y = h / 2 + Math.sin(a) * d;
        g.save(); g.translate(x, y); g.rotate(r() * Math.PI); g.fillStyle = cols[Math.floor(r() * cols.length)];

        g.fillStyle = 'rgba(255,255,230,0.18)'; g.beginPath(); g.ellipse(-2, -1, 5, 1.5, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
    });
    const cardM = new THREE.MeshStandardMaterial({ name: 'live-oak-leaf-card-foliage', map: cardTex, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.7, color: 0xffffff });
    const coreM = K.mat('live-oak-shadow-core-foliage', { color: 0x1d2448, roughness: 0.95 }, true);
    const cards = [], cores = [];
    const cluster = (x, y, z, r) => {
      cores.push([x, y - r * 0.12, z, r * 0.85, r * 0.32, r * 0.75]);
      const n = Math.round(30 + r * 26);
      for (let j = 0; j < n; j++) { const a = rr() * Math.PI * 2, d = Math.sqrt(rr()) * r, up = (rr() - 0.35) * r * 0.45;
        cards.push([x + Math.cos(a) * d, y + up + (1 - d / r) * r * 0.25, z + Math.sin(a) * d * 0.9, 0.55 + rr() * 0.4, rr()]); }

    };
    for (let k = 0; k < 5; k++) {
      const a = -0.9 + k * 0.45 + (rr() - 0.5) * 0.16, L = 4.4 + rr() * 2.0, dx = Math.cos(a), dz = Math.sin(a), sx = TRUNK_END - 0.2, sy = 0.5;
      const P = (t, lift) => [sx + dx * L * t, Math.max(0.08, sy + lift), dz * L * t];
      tube([P(0, 0), P(0.3, 0.05), P(0.55, -0.05)], 0.24);

      const tip = P(1, -0.34); decal(tip[0], tip[2], 0.9, 0.7, a);

    }
    { const M = new THREE.Matrix4(), Qq = new THREE.Quaternion(), Ee = new THREE.Euler(), Ss = new THREE.Vector3(), Pp = new THREE.Vector3();
      const sph = new THREE.SphereGeometry(1, 20, 12), core = new THREE.InstancedMesh(sph, coreM, cores.length);

      cards.forEach((c, j) => { Pp.set(c[0], c[1], c[2]); Ee.set(-Math.PI / 2 + (rr() - 0.5) * 1.1, rr() * 6, (rr() - 0.5) * 0.9, 'YXZ'); Qq.setFromEuler(Ee); Ss.set(c[3], c[3], c[3]); M.compose(Pp, Qq, Ss); im.setMatrixAt(j, M);
        C.setHSL(0.24 + c[4] * 0.05, 0.45, 0.42 + c[4] * 0.2); im.setColorAt(j, C); });

    }
    /* leaf litter blown over the asphalt and into the gutter around the crown, as fallen leaf cards */
    {
      const litter = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), cardM, 140), M = new THREE.Matrix4(), Qq = new THREE.Quaternion(), Ee = new THREE.Euler(), Ss = new THREE.Vector3(), Pp = new THREE.Vector3();
      for (let j = 0; j < 140; j++) { const a = (rr() - 0.5) * 2.4, d = 4.5 + rr() * 8, r = 0.35 + rr() * 0.35;
        Pp.set(TRUNK_END + Math.cos(a) * (d - 3), 0.05, Math.sin(a) * d); Ee.set(-Math.PI / 2, 0, rr() * 6); Qq.setFromEuler(Ee); Ss.set(r, r, r); M.compose(Pp, Qq, Ss); litter.setMatrixAt(j, M); }
      litter.instanceMatrix.needsUpdate = true; litter.receiveShadow = true; og.userData.litter = litter;   /* added after the bounds are measured */
    }
    /* THE ROOT PLATE: one flat torn disc of dark gumbo clay standing on edge at the trunk's foot, its face to -x, ragged at
     * the rim and cracked across, with the broken ends of the roots it tore out showing pale wood at their snapped faces */
    const plateTex = CH.canvasTex(THREE, 256, 256, (g, w, h) => { const r = CH.rng(29);
      g.fillStyle = '#3e2519'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 1800; i++) { g.fillStyle = 'rgba(' + (r() < 0.5 ? '96,62,40' : '24,14,12') + ',' + (r() * 0.4).toFixed(2) + ')'; g.fillRect(r() * w, r() * h, 2 + r() * 7, 2 + r() * 5); }
      g.strokeStyle = 'rgba(16,10,10,0.75)'; g.lineWidth = 2;
      for (let c = 0; c < 9; c++) { g.beginPath(); let x = w / 2, y = h / 2; g.moveTo(x, y); const a = c / 9 * Math.PI * 2 + r() * 0.5; for (let k = 0; k < 6; k++) { x += Math.cos(a + (r() - 0.5)) * 20; y += Math.sin(a + (r() - 0.5)) * 20; g.lineTo(x, y); } g.stroke(); }
    });
    const plateM = K.mat('gumbo-clay-plate-dirt', { color: 0xffffff, map: plateTex, roughness: 1 }, true);
    const pg = new THREE.CylinderGeometry(1.75, 1.6, 0.42, 40, 2), pp = pg.attributes.position;
    for (let q = 0; q < pp.count; q++) { const x = pp.getX(q), z = pp.getZ(q), y = pp.getY(q), rad = Math.hypot(x, z), ang = Math.atan2(z, x);
      const k = rad > 0.3 ? 1 + 0.14 * Math.sin(ang * 5 + 1) * Math.cos(ang * 3) + 0.07 * Math.sin(ang * 13) : 1; pp.setXYZ(q, x * k, y + (rad > 0.3 ? 0.05 * Math.sin(ang * 9) : 0), z * k); }
    pg.computeVertexNormals();
    const plate = new THREE.Mesh(pg, plateM); plate.rotation.z = Math.PI / 2 - 0.08; plate.position.set(-0.45, 1.5, 0); plate.castShadow = true; plate.receiveShadow = true; og.add(plate);
    const cutM = K.mat('oak-root-cut-wood', { color: 0xd9b88a, roughness: 0.8 }, true);
    for (let t = 0; t < 16; t++) { const a = rr() * Math.PI * 2, rad = 0.35 + rr() * 1.1, y0 = 1.5 + Math.sin(a) * rad, z0 = Math.cos(a) * rad, rr0 = 0.07 + rr() * 0.1, Lr = 0.18 + rr() * 0.35;
      const stub = new THREE.Mesh(new THREE.CylinderGeometry(rr0 * 0.85, rr0, Lr, 12), rootM); stub.rotation.z = Math.PI / 2; stub.position.set(-0.66 - Lr / 2, y0, z0); stub.castShadow = true; og.add(stub);
      const face = new THREE.Mesh(new THREE.CircleGeometry(rr0 * 0.85, 12), cutM); face.rotation.y = -Math.PI / 2; face.position.set(-0.67 - Lr - 0.002, y0, z0); og.add(face); }
    /* the crater in the parkway, dark wet clay inside a torn ring of sod */
    const pit = new THREE.Mesh(new THREE.CircleGeometry(1.7, 32), clay2); pit.rotation.x = -Math.PI / 2; pit.scale.set(0.8, 1.15, 1); pit.position.set(-2.0, 0.03, 0); pit.receiveShadow = true; og.add(pit);
    { const rg = new THREE.RingGeometry(1.25, 1.75, 40, 2), rp2 = rg.attributes.position; for (let q = 0; q < rp2.count; q++) { const x = rp2.getX(q), y = rp2.getY(q), a = Math.atan2(y, x); rp2.setZ(q, 0.06 + 0.06 * Math.sin(a * 11) * Math.cos(a * 4)); } rg.computeVertexNormals();

  }
  /* the fall line: mostly across the street (+z), a little toward screen right (-x), so the trunk lies diagonal */
  const FALL = [-0.5, 1], fl = Math.hypot(FALL[0], FALL[1]), OAK_RY = Math.atan2(-FALL[1] / fl, FALL[0] / fl);
  og.rotation.y = OAK_RY; og.updateMatrixWorld(true);
  const obb = new THREE.Box3().setFromObject(og);
  og.add(og.userData.litter);
  const OAK_X = 6.0, CURB_CLEAR = 0.25;                                  /* the crown pushes into the far gutter, just short of the curb face */
  const OAK_Z = sz0(OAK_X - 4) + 4.2 - CURB_CLEAR - obb.max.z;
  if (OAK_Z > -4.6) throw new Error('the oak base ' + OAK_Z.toFixed(2) + ' is not in the near parkway');
  place(og, OAK_X, OAK_Z, OAK_RY); TXT.add(R, og);
  const oakX0 = OAK_X + obb.min.x, oakX1 = OAK_X + obb.max.x;
  /* storm litter: broken limbs and torn shingle tabs in the street and the yards near the oak */
  const bark = K.mat('oak-bark-wood', { color: 0x6b4a33, roughness: 0.95 }, true), tabM = K.mat('shingle-tab-asphalt', { color: 0x3c3a48, roughness: 0.9 }, true);
  for (let k = 0; k < 26; k++) { const x = -14 + rng() * 30, z = -8 + rng() * 18, l = 0.8 + rng() * 2.6;
    const a = wp(x, 0.12, z), b = wp(x + Math.cos(k) * l, 0.08 + rng() * 0.3, z + Math.sin(k * 1.7) * l); const m = TXT.tube([a, b], 0.05 + rng() * 0.07, bark); if (m) { m.castShadow = true; R.scene.add(m); } }
  const tabs = []; for (let k = 0; k < 140; k++) tabs.push([-22 + rng() * 40, 0.04, -30 + rng() * 36, rng() * 6, 0.34 + rng() * 0.3, 0.03, 0.3]);
  inst(unit, tabM, tabs, true);

  /* THE WAY THROUGH, and the detour is its shape: the gold route runs down the near lane from the left edge, crosses
   * before the oak, rides a tight arc over the far curb onto the driveway aprons past the crown, drops back into the near
   * lane after the root plate end and leaves the right edge (screen right is -x). Low on the pavement with a soft glow
   * laid under it. The accent's one meaning, nothing else is gold. */
  const NEAR = -2.0, APRON = 6.2, rp = [[50, sz0(50) + NEAR], [oakX1 + 8, sz0(oakX1 + 8) + NEAR], [oakX1 + 4.2, sz0(oakX1 + 4.2) + 1.2], [oakX1 + 2.2, sz0(oakX1 + 2.2) + 4.4], [oakX1 + 0.6, sz0(oakX1 + 0.6) + APRON]];
  for (let x = oakX1 - 2; x > oakX0 + 1.5; x -= 2.5) rp.push([x, sz0(x) + APRON]);
  rp.push([oakX0 - 0.6, sz0(oakX0 - 0.6) + APRON], [oakX0 - 2.2, sz0(oakX0 - 2.2) + 4.4], [oakX0 - 4.2, sz0(oakX0 - 4.2) + 1.2], [oakX0 - 8, sz0(oakX0 - 8) + NEAR], [-52, sz0(-52) + NEAR]);
  const routeLift = (x, z) => (z - sz0(x) > 4.3 ? 0.14 : 0.04);          /* on the apron it rides a curb's height higher */
