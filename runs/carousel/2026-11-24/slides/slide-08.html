<!doctype html>
<!-- 2026-11-24, frame 8 of 9. WHO HAS TRAINED (c8). A training room's painted pegboard wall runs away from the camera at a
     rake: five rows of rescue helmets, white, orange, navy and pale steel, each with a lit crown and a cast on the board under
     a honey window key from the right. One responder, seen from behind, lifts the last helmet onto its empty peg. The
     helmet count is FIG.responders, read and checked in this file. Type in the right column, over the plain end wall.
     Drawn to illustrate: no real room, no agency mark, no face. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook" style="left:612px; top:178px; width:388px">125 responders, 63 agencies</h1>
<p class="dek" data-follow="26" style="left:614px; width:392px; font-size:28px">Texas A&amp;M says 125 emergency responders from 63 agencies in 14 states and Puerto Rico have trained on CLARKE. One helmet stands for one responder.</p>

<script>window.FIG = {"responders": 125};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/txlook.js"></script>
<script src="@@ASSETS@@/js/deck/2026-11-24-roofread-bespoke.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Who has trained", counter: "08 / 09", src: "c8", fit: { min: 70, max: 92, maxLines: 3 } });

  const R = CH.stage(TXT, gl, W, { fov: 50, near: 0.05, far: 60, fog: 0 });
  const rnd = CH.rng(CH.SEED + 808);
  const tex = (w, h, paint, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; paint(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };
  const rb = (w, h, d, r, m) => { const b = TXT.roundedBox(w, h, d, r, m); b.castShadow = true; b.receiveShadow = true; return b; };

  /* THE ROOM, metres. x right, z toward the camera. The pegboard hangs on the left wall (face at x = WALLX); the end wall
   * closes the room at z = BACK, facing the camera. */
  const RW = 8, RD = 15, RH = 3.5, WALLX = -RW / 2 + 0.1, BACK = -RD / 2 + 0.1;
  const BLOCK = 0x2a49c4;
  const room = TXT.interior(R, { w: RW, d: RD, h: RH, floor: 'concrete', wall: BLOCK, trim: 0x1c2a7a, window: null, ceiling: true, light: 0.6 });
  TXT.studio(R, CH.studioOpts({ w: 6, d: 6 }));
  R.scene.remove(R.studio.sweep); R.room = room;
  R.scene.background = new THREE.Color(0x24308a);

  /* painted concrete block on every wall: 0.4 x 0.2 m courses with struck joints, the paint a deep cobalt */
  const blockTex = tex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { g.fillStyle = 'rgba(' + (rnd() < 0.5 ? '200,205,235' : '255,255,255') + ',' + (0.2 + rnd() * 0.3) + ')'; const s = 1 + rnd() * 3; g.fillRect(rnd() * w, rnd() * h, s, s); }
    g.strokeStyle = 'rgba(120,130,190,0.75)'; g.lineWidth = 7;
    for (let r = 0; r <= 8; r++) { const y = r * h / 8; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
      for (let c = 0; c < 4; c++) { const x = (c + (r % 2 ? 0.5 : 0)) * w / 4; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + h / 8); g.stroke(); } }
  }, [1, 1]);
  const wallMat = (rx, ry) => { const t = blockTex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); const m = new THREE.MeshStandardMaterial({ color: BLOCK, map: t, roughness: 0.86, name: 'block-paint' }); m.userData.txSurface = 'paint'; return m; };
  room.children.forEach((c) => { if (!c.isMesh) return; const p = c.geometry.parameters || {}; const along = Math.abs(c.position.z - (-RD / 2)) < 0.01 ? RW : RD;
    if (c.material && c.material.color && c.material.color.getHex() === new THREE.Color(BLOCK).getHex()) c.material = wallMat(along / 1.6, RH / 1.6); });

  /* the floor: a honey epoxy, sealed, with the trowel's faint swirl and a slip strip at the wall */
  const floorTex = tex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#f59a2a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 40; i++) { g.strokeStyle = 'rgba(255,214,160,' + (0.04 + rnd() * 0.05) + ')'; g.lineWidth = 8 + rnd() * 20; g.beginPath(); g.arc(rnd() * w, rnd() * h, 60 + rnd() * 260, rnd() * 6, rnd() * 6 + 2); g.stroke(); }
    for (let i = 0; i < 30000; i++) { g.fillStyle = 'rgba(' + (rnd() < 0.5 ? '150,70,40' : '255,230,190') + ',' + (0.05 + rnd() * 0.08) + ')'; g.fillRect(rnd() * w, rnd() * h, 1.5, 1.5); }
  }, [5, 9]);
  let floorN = 0;
  R.scene.traverse((m) => { if (m.isMesh && m.userData.txGround && m.userData.txSurface === 'concrete') { floorN++;
    m.material = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: floorTex, roughness: 0.32, clearcoat: 0.6, clearcoatRoughness: 0.25, name: 'epoxy-floor' }); m.userData.txSurface = 'plastic'; m.userData.txWear = false; } });
  if (floorN !== 1) throw new Error('expected one floor, found ' + floorN);

  /* THE FIGURE. FIG.responders helmets, five rows; one is in the responder's hands, the rest hang on their pegs */
  const N = FIG.responders, ROWS = 5;
  if (!Number.isInteger(N) || N < ROWS) throw new Error('responders is not a whole count');
  if (N % ROWS !== 0) throw new Error('responders does not fill five whole rows: ' + N);
  const COLS = N / ROWS, PITCH = 0.40, ROWY = [2.56, 2.11, 1.66, 1.21, 0.78];
  const Z0 = 3.6;                                        /* the nearest column */
  const zAt = (c) => Z0 - c * PITCH;
  const EMPTY = { r: 0, c: 6 };                          /* the last peg, waiting */
  const BOARD = { z0: Z0 + 0.32, z1: zAt(COLS - 1) - 0.32, y0: 0.6, y1: 2.88 };
  if (BOARD.z1 < BACK + 0.2) throw new Error('the wall is too short for ' + COLS + ' columns');

  /* the pegboard: 6 mm hardboard, painted cerulean, 25.4 mm hole pitch, on a 20 mm stand off with an aluminium edge trim */
  const holeTex = (bump) => tex(512, 512, (g, w, h) => {
    g.fillStyle = bump ? '#ffffff' : '#ffffff'; g.fillRect(0, 0, w, h);
    if (!bump) for (let i = 0; i < 6000; i++) { g.fillStyle = 'rgba(' + (rnd() < 0.5 ? '210,220,255' : '255,255,255') + ',' + (0.25 + rnd() * 0.3) + ')'; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
    const n = 20, s = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const x = (i + 0.5) * s, y = (j + 0.5) * s;
      if (!bump) { g.fillStyle = 'rgba(70,90,190,0.35)'; g.beginPath(); g.arc(x + 1.2, y + 1.6, s * 0.2, 0, 6.283); g.fill(); }
      g.fillStyle = bump ? '#000000' : '#101a5a'; g.beginPath(); g.arc(x, y, s * 0.15, 0, 6.283); g.fill(); }
  });
  const bLen = BOARD.z0 - BOARD.z1, bH = BOARD.y1 - BOARD.y0, TILE = 0.508;
  const pegMap = holeTex(false), pegBump = holeTex(true);
  [pegMap, pegBump].forEach((t) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(bLen / TILE, bH / TILE); });
  pegBump.colorSpace = THREE.NoColorSpace;
  const boardMat = new THREE.MeshPhysicalMaterial({ color: 0x4f86ee, map: pegMap, bumpMap: pegBump, bumpScale: 2.5, roughness: 0.62, clearcoat: 0.25, clearcoatRoughness: 0.5, name: 'pegboard-paint' });
  boardMat.userData.txSurface = false;
  const board = new THREE.Mesh(new THREE.BoxGeometry(0.006, bH, bLen), boardMat);
  board.position.set(WALLX + 0.023, (BOARD.y0 + BOARD.y1) / 2, (BOARD.z0 + BOARD.z1) / 2); board.receiveShadow = true; board.castShadow = true; board.userData.txBevel = false;
  R.scene.add(board);
  const FACE = WALLX + 0.026;
  const alu = new THREE.MeshPhysicalMaterial({ color: 0xe6ebf4, metalness: 0.85, roughness: 0.3, clearcoat: 0.3, name: 'anodised-alu' });
  [[BOARD.y0, bLen, 'h'], [BOARD.y1, bLen, 'h']].forEach(([y, L]) => { const t = rb(0.03, 0.03, L + 0.03, 0.006, alu); t.position.set(FACE, y, (BOARD.z0 + BOARD.z1) / 2); R.scene.add(t); });
  [BOARD.z0, BOARD.z1].forEach((z) => { const t = rb(0.03, bH + 0.03, 0.03, 0.006, alu); t.position.set(FACE, (BOARD.y0 + BOARD.y1) / 2, z); R.scene.add(t); });
  /* panel seams every 2.44 m */
  for (let z = BOARD.z0 - 2.44; z > BOARD.z1 + 0.1; z -= 2.44) { const s = rb(0.01, bH, 0.012, 0.003, alu); s.position.set(FACE, (BOARD.y0 + BOARD.y1) / 2, z); R.scene.add(s); }

  /* the pegs: chromed J hooks, one per helmet */
  const chrome = new THREE.MeshPhysicalMaterial({ color: 0xf2f4fa, metalness: 1, roughness: 0.14, name: 'chrome-steel' });
  const peg = (y, z, rr) => { const g = new THREE.Group(); rr = rr || 0.0055;
    const a = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, 0.13, 12), chrome); a.rotation.z = Math.PI / 2; a.position.set(FACE + 0.065, y, z); g.add(a);
    const b = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, 0.05, 12), chrome); b.position.set(FACE + 0.128, y + 0.022, z); g.add(b);
    const k = new THREE.Mesh(new THREE.SphereGeometry(rr * 1.3, 12, 8), chrome); k.position.set(FACE + 0.128, y + 0.048, z); g.add(k);
    const plate = rb(0.006, 0.03, 0.03, 0.002, chrome); plate.position.set(FACE + 0.003, y, z); g.add(plate);
    g.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); R.scene.add(g); return g; };

  /* the shells: white, orange, navy and pale steel, seeded, never red and never gold */
  const SHELLS = [0xf4f2ec, 0xff7a1a, 0x24306e, 0xd9dee6];   /* showrunner: no yellow shells, gold means only the route */
  const reflect = new THREE.MeshPhysicalMaterial({ color: 0xdfe6f2, metalness: 0.6, roughness: 0.22, clearcoat: 1, name: 'retroreflective-tape' });
  reflect.userData.txSurface = false;
  const helmets = [];
  const webbing = new THREE.MeshStandardMaterial({ color: 0x1b2266, roughness: 0.85, name: 'nylon-webbing' }); webbing.userData.txSurface = 'fabric';
  const buckle = new THREE.MeshStandardMaterial({ color: 0x14161e, roughness: 0.4, name: 'acetal-buckle' });
  /* a stored rescue helmet: chassis straps tucked up, a wide retroreflective band round the sides and back, and the
   * chin strap draped in a short loop under the brim with its buckle */
  const dress = (h) => {
    h.updateMatrixWorld(true); h.traverse((m) => { if (!m.isMesh) return; const bb = new THREE.Box3().setFromObject(m); if (bb.min.y < -0.02) m.visible = false; });
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.1235, 0.1255, 0.024, 48, 1, true, Math.PI * 0.3, Math.PI * 1.4), reflect);
    band.scale.set(1, 1, 1.12); band.position.set(0, 0.088, 0); band.material.side = THREE.DoubleSide; h.add(band);
    const loop = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.0045, 6, 28, Math.PI), webbing);
    loop.rotation.set(0, 0, Math.PI); loop.scale.set(1, 0.7, 1); loop.position.set(0, 0.03, 0.03); h.add(loop);
    const bk = TXT.roundedBox(0.026, 0.016, 0.01, 0.003, buckle); bk.position.set(0.0, 0.03 - 0.0525, 0.03); h.add(bk);
    h.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  };
  const hang = (r, c, inHand) => {
    const col = SHELLS[Math.floor(rnd() * SHELLS.length)];
    const h = K.make('rescue_helmet', { color: col, seed: r * 100 + c });
    dress(h);
    h.rotation.order = 'YXZ';
    h.rotation.y = Math.PI / 2;                          /* the front faces out of the board */
    h.rotation.x = 0.12 + (rnd() - 0.5) * 0.06;          /* hung by the suspension, the brim dipping forward */
    h.rotation.z = (rnd() - 0.5) * 0.08;
    h.position.set(FACE + 0.2, ROWY[r] - 0.02, zAt(c) + (rnd() - 0.5) * 0.02);
    TXT.add(R, h); helmets.push(h); return h;
  };
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    peg(ROWY[r], zAt(c), r === EMPTY.r && c === EMPTY.c ? 0.009 : 0.0055);
    if (r === EMPTY.r && c === EMPTY.c) continue;
    hang(r, c);
  }
  /* THE LAST ONE, in the responder's hands, a hand's width out from its peg */
  const last = K.make('rescue_helmet', { color: 0xf4f2ec, seed: 999 });
  dress(last);
  /* held level with the brim, then tipped about 17 degrees back toward the bare peg above it */
  last.rotation.order = 'YXZ'; last.rotation.y = Math.PI / 2 + 0.25; last.rotation.x = -0.3; last.rotation.z = 0.05;
  const LAST = new THREE.Vector3(FACE + 0.42, 1.98, zAt(EMPTY.c) + 0.3);
  last.position.copy(LAST); TXT.add(R, last); helmets.push(last);
  if (helmets.length !== FIG.responders) throw new Error('drew ' + helmets.length + ' helmets for ' + FIG.responders + ' responders');

  /* the bench under the wall: white oak slats on powder coated steel legs */
  const oak = new THREE.MeshPhysicalMaterial({ color: 0xd9a066, roughness: 0.5, clearcoat: 0.4, clearcoatRoughness: 0.3, name: 'oak-bench' });
  const legM = new THREE.MeshStandardMaterial({ color: 0x1d2a78, roughness: 0.45, metalness: 0.5, name: 'powder-coat-steel' });
  const BX = FACE + 0.36, BZ0 = BOARD.z0 - 0.1, BZ1 = BOARD.z1 + 0.1, BL = BZ0 - BZ1;
  for (let s = 0; s < 3; s++) { const sl = rb(0.1, 0.035, BL, 0.01, oak); sl.position.set(BX - 0.12 + s * 0.12, 0.46, (BZ0 + BZ1) / 2); R.scene.add(sl); }
  for (let z = BZ0 - 0.2; z > BZ1; z -= 1.6) { const l1 = rb(0.36, 0.42, 0.04, 0.008, legM); l1.position.set(BX, 0.22, z); R.scene.add(l1); }

  /* THE RESPONDER: turned away, reaching up to hang the last helmet */
  const PZ = zAt(EMPTY.c) + 0.72, PX = FACE + 0.86;
  const face = [LAST.x - PX, LAST.z - PZ], ry = Math.atan2(face[0], face[1]);
  const dummy = new THREE.Object3D(); dummy.position.set(PX, 0, PZ); dummy.rotation.y = ry; dummy.updateMatrixWorld(true);
  last.position.copy(LAST); last.updateMatrixWorld(true);
  const grip = (side) => dummy.worldToLocal(new THREE.Vector3(0.158 * side, 0.02, 0.0).applyMatrix4(last.matrixWorld)).toArray();
  const person = K.make('person', { seed: 41, height: 1.86, pose: 'stand', build: 'male', hat: 'none', vest: false, shirt: 0x2a3a9c, trousers: 0x1c2250, headPitch: -0.35,
    hands: [grip(1), grip(-1)] });
  /* the duty kit on the figure, in the person's own frame (front +z, back -z): a webbing belt with a radio pouch on the
   * back, shoulder epaulettes and a lapel radio mic clipped on the left shoulder with its coiled cord */
  { const A = person.userData.attach, hy = A.hip[1], ey = A.eye[1];
    const kitM = new THREE.MeshStandardMaterial({ color: 0x12163a, roughness: 0.7, name: 'nylon-duty-belt' }); kitM.userData.txSurface = 'fabric';
    const steel = new THREE.MeshStandardMaterial({ color: 0xd8dde6, metalness: 1, roughness: 0.3, name: 'brushed-steel-buckle' });
    const belt = new THREE.Mesh(new THREE.TorusGeometry(0.165, 0.022, 8, 48), kitM); belt.rotation.x = Math.PI / 2; belt.scale.set(1, 0.72, 1.6); belt.position.set(0, hy + 0.06, A.hip[2]); person.add(belt);
    const pouch = TXT.roundedBox(0.08, 0.13, 0.05, 0.012, kitM); pouch.position.set(-0.1, hy + 0.02, A.hip[2] - 0.13); person.add(pouch);
    const radio = TXT.roundedBox(0.055, 0.09, 0.03, 0.01, new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.45, name: 'radio-abs' })); radio.position.set(-0.1, hy + 0.12, A.hip[2] - 0.135); person.add(radio);
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.006, 0.12, 8), radio.material); ant.position.set(-0.08, hy + 0.22, A.hip[2] - 0.135); person.add(ant);
    const clip = TXT.roundedBox(0.03, 0.012, 0.02, 0.004, steel); clip.position.set(0, hy + 0.06, A.hip[2] + 0.14); person.add(clip);
    [1, -1].forEach((sd) => { const ep = TXT.roundedBox(0.05, 0.012, 0.13, 0.005, kitM); ep.position.set(sd * 0.15, ey - 0.165, A.eye[2] - 0.06); ep.rotation.z = sd * -0.25; person.add(ep);
      const bt = new THREE.Mesh(new THREE.SphereGeometry(0.007, 10, 8), steel); bt.position.set(sd * 0.15, ey - 0.155, A.eye[2] - 0.0); person.add(bt); });
    const mic = TXT.roundedBox(0.04, 0.06, 0.025, 0.008, radio.material); mic.position.set(0.14, ey - 0.2, A.eye[2] + 0.03); person.add(mic);
    const pts = []; for (let i = 0; i <= 120; i++) { const t = i / 120, a = t * Math.PI * 26; pts.push(new THREE.Vector3(0.12 - t * 0.2 + Math.cos(a) * 0.008, ey - 0.22 - t * (ey - 0.22 - hy - 0.14), A.eye[2] - 0.11 - t * 0.03 + Math.sin(a) * 0.008)); }
    const cord = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 240, 0.0028, 6), radio.material); person.add(cord);
    person.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); }
  person.position.set(PX, 0, PZ); person.rotation.y = ry; TXT.add(R, person);
  { const hs = person.userData.attach && person.userData.attach.hands; console.log('hand short', JSON.stringify(hs && hs.map((h) => h && h.short))); } TXT.contact(R, person, { opacity: 0.5 });

  /* THE WINDOW, out of frame on the right: its mullions and sill cast the key's bars across the floor and the board.
   * The frame is drawn only into the shadow map (colorWrite off), since the camera never sees that wall. */
  { const gm = new THREE.MeshBasicMaterial({ color: 0x000000, colorWrite: false, depthWrite: false, name: 'window-frame-gobo' }); gm.userData.txSurface = false;
    const bar = (w, h, d, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), gm); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = false; m.userData.txBevel = false; m.userData.txNoContact = true; R.scene.add(m); };
    const WXo = RW / 2 + 0.6;
    bar(0.1, 0.55, 22, WXo, 0.2, 0);                       /* the sill wall */
    bar(0.1, 0.14, 22, WXo, 2.25, 0);                      /* the transom */
    bar(0.1, 2, 22, WXo, 4.6, 0);                          /* the head wall */
    for (let z = -9; z <= 9; z += 1.5) bar(0.1, 4.2, 0.12, WXo, 2.1, z); }

  /* a run of linear LED fittings along the ceiling over the wall, in 1.2 m lengths on white housings */
  { const ledM = new THREE.MeshBasicMaterial({ color: 0xfff4e0, name: 'led-diffuser' }); ledM.color.multiplyScalar(2.4); ledM.userData.txSurface = false;
    const hous = new THREE.MeshStandardMaterial({ color: 0xe9ecf4, roughness: 0.4, metalness: 0.2, name: 'painted-alu-housing' });
    for (let z = 5.2; z > 1.2; z -= 1.6) {   /* the run stops before it would pass behind the dek */ const hb = rb(0.16, 0.06, 1.24, 0.012, hous); hb.position.set(WALLX + 1.3, RH - 0.03, z); R.scene.add(hb);
      const d = new THREE.Mesh(new THREE.PlaneGeometry(0.11, 1.18), ledM); d.rotation.x = Math.PI / 2; d.position.set(WALLX + 1.3, RH - 0.061, z); d.userData.txBevel = false; R.scene.add(d); } }

  /* the bare peg's tip catches the window key */
  CH.lampGlow(THREE, R, [FACE + 0.13, ROWY[EMPTY.r] + 0.05, zAt(EMPTY.c)], 0xfff1d0, 0.12, 0);

  /* THE CAMERA: inside the room at eye height, raking down the wall to the far corner */
  /* stood further out from the wall than a rake, so the bare peg clears its nearer neighbour's brim; the far end of
   * the board is aimed to land left of the type column */
  const FROM = [-0.2, 1.9, 7.0];
  CH.aim(THREE, R, TXT, FROM, [WALLX, 1.75, BOARD.z1], 735, 790, 50);
  { const cam = new THREE.Vector3(...FROM), tip = new THREE.Vector3(FACE + 0.13, ROWY[EMPTY.r] + 0.05, zAt(EMPTY.c));
    const nb = helmets.find((h) => Math.abs(h.position.z - (zAt(EMPTY.c) + PITCH)) < 0.03 && Math.abs(h.position.y - (ROWY[EMPTY.r] - 0.02)) < 0.03);
    R.scene.updateMatrixWorld(true); if (!nb) throw new Error('no neighbour found');
    { const ray = new THREE.Raycaster(tip.clone().add(new THREE.Vector3(0.01, 0, 0)), cam.clone().sub(tip).normalize()); const hit = ray.intersectObjects([nb, last, person], true).filter((x) => x.object.visible && x.object.isMesh);
      if (hit.length) throw new Error('the bare peg is hidden by ' + (hit[0].object.material && hit[0].object.material.name)); } }

  /* checks: every hung helmet wide enough to count at feed size, and no face over 2 percent of the frame */
  { let minW = 1e9; helmets.forEach((h) => { const p = h.position; const a = CH.project(THREE, R, [p.x, p.y + 0.1, p.z - 0.15]), b = CH.project(THREE, R, [p.x, p.y + 0.1, p.z + 0.15]); minW = Math.min(minW, Math.abs(b[0] - a[0])); });

    const e = person.userData.attach && person.userData.attach.eye; if (e) { const ev = new THREE.Vector3(...e).applyMatrix4(person.matrixWorld); const fa = CH.project(THREE, R, [ev.x, ev.y + 0.12, ev.z]), fb = CH.project(THREE, R, [ev.x, ev.y - 0.13, ev.z]); const gh = Math.abs(fb[1] - fa[1]); if (gh * gh * 0.8 / (1080 * 1350) > 0.02) throw new Error('face over 2 percent'); } }
  const corner = CH.project(THREE, R, [WALLX, 1.6, BACK]); console.log('corner', corner.map(Math.round));

  CH.KEY_SCALE = 1.2;
  const spec = CH.rigSpec(W, 16, 4096);
  TXT.deckRig(R, spec, Object.assign(CH.rigOpts([-2.5, 1.2, -1], { distance: 20, shadowFar: 50, normalBias: 0.01 }), { light: { az: 72, el: 26 } }));
  CH.unacne(R, 0.006);
  TXT.weather(R, { grime: 0.04, height: 0.1, mottle: 0.05 });

  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  CH.seat(cx, { sel: '.hook, .dek', a: 0.5, fade: 170 });
  CH.seat(cx, { sel: '.dek', a: 0.55, fade: 100 });

  TXLOOK.footWash(cx, { tone: CH.TONE, a: 0.5, height: 220 });
