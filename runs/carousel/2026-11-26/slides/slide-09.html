      /* the thermocouple rake: a streamlined strut across the top of the exhaust with five probe heads pointing upstream, its lead clamped along the case */
      if (false) { const rake = add(TXT.roundedBox(0.03, rr * 0.95, 0.016, 0.006, boss)); rake.position.set(XE + 0.03, AX + rr * 0.52, 0.0);
      for (let k = 0; k < 5; k++) { const pr = add(new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.05, 10), boss)); pr.rotation.z = Math.PI / 2; pr.position.set(XE + 0.0, AX + 0.04 + k * 0.034, 0); }
      const rh = add(TXT.roundedBox(0.06, 0.04, 0.05, 0.01, boss)); rh.position.set(XE + 0.03, AX + rr + 0.03, 0); }
      const rl = null; if (false) TXT.tube([wpt(XE - 0.06, AX + rr + 0.02, 0.05), wpt(XE - 0.1, AX + rr + 0.05, 0.08), wpt(XE - 0.2, AX + 0.2, 0.17), wpt(XE - 0.25, AX - 0.1, 0.28), wpt(XE - 0.2, 0.3, 0.42)], 0.007, lead2, { segments: 80, radial: 8 }); /* the rake lead is gone with the rake */
      /* real instrumentation bosses: hex bodies with lock nuts on the casing where each lead enters */
      runs.forEach(q => { const n = add(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.028, 6), boss)); const dir = new THREE.Vector3(0, q.at[1] - AX, q.at[2]).normalize();
        n.position.set(q.at[0], AX + dir.y * 0.235, dir.z * 0.235); n.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); }); }
    }   /* round 1 repair: the white test tag is gone, the two cases are the only accent */

  /* THE TWO CASED TOOLS, in the accent: one hard case per tool, the count read from FIG.tools */
  const scuff = CH.canvasTex(THREE, 256, 256, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    const r = CH.rng(77); g.strokeStyle = 'rgba(120,70,60,0.35)'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
    for (let n = 0; n < 70; n++) { const x = r() * w, y = r() * h, l = 6 + r() * 30, a = r() * 6.3; g.strokeStyle = r() < 0.5 ? 'rgba(255,240,225,0.55)' : 'rgba(110,60,60,0.3)'; g.lineWidth = 0.8 + r() * 1.6; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } });
  const gold = CH.goldMat(K).clone(); gold.map = scuff; gold.name = 'fr-gold-case-scuffed';
  const trim = K.mat('case-latch-brushed-steel', { color: 0xc8cfdc, metalness: 0.95, roughness: 0.3 }, true);
  const guard = K.mat('case-guard-cast-alu', { color: 0xd3d9e4, metalness: 0.9, roughness: 0.38 }, true);
  const rubber = K.mat('case-foot-rubber', { color: 0x1f2348, roughness: 0.85 }, true);
  const makeCase = (seed) => {
    const g = new THREE.Group(), w = 0.66, d = 0.46, hb = 0.19, hl = 0.1;
    const body = TXT.roundedBox(w, hb, d, 0.045, gold); body.position.y = hb / 2 + 0.012; g.add(body);
    const lid = TXT.roundedBox(w + 0.004, hl, d + 0.004, 0.045, gold); lid.position.y = hb + 0.012 + 0.006 + hl / 2; g.add(lid);
    const seam = TXT.roundedBox(w - 0.02, 0.008, d - 0.02, 0.003, trim); seam.position.y = hb + 0.016; g.add(seam);
    /* stiffening ribs on the lid and a recessed label well left blank */
    [-0.2, 0.2].forEach(x => { const r = TXT.roundedBox(0.05, 0.016, d - 0.08, 0.007, gold); r.position.set(x, hb + hl + 0.026, 0); g.add(r); });
    const well = TXT.roundedBox(0.24, 0.006, 0.12, 0.004, K.mat('case-label-well', { color: 0xc77c52, roughness: 0.5, metalness: 0.1 }, true)); well.position.set(0, hb + hl + 0.02, 0); g.add(well);
    /* two latches, a padlock hasp and a folding handle on the front */
    [-0.2, 0.2].forEach(x => { const l = TXT.roundedBox(0.075, 0.07, 0.022, 0.01, trim); l.position.set(x, hb + 0.01, d / 2 + 0.012); g.add(l);
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.08, 10), steel); pin.rotation.z = Math.PI / 2; pin.position.set(x, hb - 0.022, d / 2 + 0.024); g.add(pin); });
    const hp = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.012, 10, 28, Math.PI), trim); hp.position.set(0, hb + hl - 0.01, d / 2 + 0.03); hp.rotation.x = -0.25; g.add(hp);
    [-0.075, 0.075].forEach(x => { const k = TXT.roundedBox(0.035, 0.035, 0.03, 0.008, trim); k.position.set(x, hb + hl - 0.01, d / 2 + 0.012); g.add(k); });
    /* corner guards and feet */
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(c => { const f = TXT.roundedBox(0.06, 0.016, 0.06, 0.006, rubber); f.position.set(c[0] * (w / 2 - 0.05), 0.008, c[1] * (d / 2 - 0.05)); g.add(f); });
    /* worn metal corner guards top and bottom, where a case is set down and picked up */
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(c => [0.03, hb + hl - 0.012].forEach(y => { const q = TXT.roundedBox(0.07, 0.05, 0.07, 0.014, guard); q.position.set(c[0] * (w / 2 - 0.028), y + 0.012, c[1] * (d / 2 - 0.028)); g.add(q); }));
    g.userData.isToolCase = true;
    return g;
  };
  const casePlaces = [[0.75, -0.75, 8], [-0.25, -0.9, -12]];   /* AD repair: out on the apron, so each long first light shadow runs across it toward camera */   /* both inside the sun patch, x < 1.5 - 0.65 z less the case half width */   /* each straddles the jamb's shadow line, x = 1.5 - 0.65 z */
  const cases = [];
  for (let i = 0; i < window.FIG.tools; i++) {
    const p = casePlaces[i]; if (!p) throw new Error('slide 9: no place for tool case ' + (i + 1));
    const c = makeCase(i); c.position.set(p[0], 0.003, p[1]); c.rotation.y = p[2] * deg; TXT.add(R, c); TXT.contact(R, c); c.traverse(o => { if (o.isMesh) o.castShadow = true; }); pool(p[0], p[1], 0.85, 0.62, p[2] * deg); cases.push(c);
  }
  { let n = 0; R.scene.traverse(o => { if (o.userData && o.userData.isToolCase) n++; });
    if (n !== window.FIG.tools || cases.length !== window.FIG.tools) throw new Error('slide 9: drew ' + n + ' tool cases but FIG.tools is ' + window.FIG.tools); }

  /* THE CAMERA: low inside the bay, eye 0.7 m, level, the lens shifted so the horizon sits low under the type */
  const HZ = 880, F = 1700, EYE = 0.7, CAMZ = 6.9, CAMX = 1.0;
  TXT.frame(R, { from: [CAMX, EYE, CAMZ], look: [CAMX, EYE, CAMZ - 50] });
  const FULLH = 2 * Math.max(HZ, 1350 - HZ);
  R.camera.fov = 2 * Math.atan((FULLH / 2) / F) / deg; R.camera.aspect = 1080 / FULLH;
  R.camera.setViewOffset(1080, FULLH, 0, FULLH / 2 - HZ, 1080, 1350); R.camera.updateProjectionMatrix();

  TXT.sky(R, Object.assign({}, TXT.worlds.v2explainer, { el: [4, 14], zenith: 0x10309a, horizon: 0x2c66d4, haze: 0x9cc6ff, sunDisc: 22, glow: 0.8, horizonGlow: 0.55, span: 0.35, clouds: 0.12 }));
  const spec = CH.rigSpec(W, 14, 4096); spec.key = Object.assign({}, spec.key, { color: 0xffe6cc, i: spec.key.i * 3.0 });
  TXT.deckRig(R, spec, Object.assign(CH.rigOpts([0.5, 0.5, 2.5], { distance: 40, shadowFar: 100, normalBias: 0.01 }), { light: LIGHT }));

  /* the bay's own bounce: the sunlit floor throws a soft indigo fill back onto the engine's near side, from the camera's side, no shadow */
  { const bf = new THREE.DirectionalLight(0x9aa0ff, 0.55); bf.position.set(-1, 1.4, 9); bf.target.position.set(1.6, 1.0, 2.9); R.scene.add(bf); R.scene.add(bf.target); }
  /* both cases read whole: each case's projected box sits inside the frame with a margin */
  cases.forEach((c, i) => { const r = CH.rectOf(THREE, R, c, 0); if (r[0] < 40 || r[0] + r[2] > 1040 || r[1] < 0 || r[1] + r[3] > 1310) throw new Error('slide 9: tool case ' + (i + 1) + ' leaves the frame, box ' + r.map(Math.round).join(',')); });
  /* the engine stands at least a quarter of the frame tall: measured off its own box */
  { const r = CH.rectOf(THREE, R, rig, 0); if (r[3] < 1350 / 4) throw new Error('slide 9: the engine and stand stand ' + Math.round(r[3]) + ' px, under a quarter of the frame'); }

  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  CH.seat(cx, { a: 0.62, fade: 230 });
  TXLOOK.footWash(cx, { tone: 'explainer', a: 0.8, height: 260 });
  CH.seat(cx, { sel: '.tx-site, .src', a: 0.62, fade: 100 });
  CH.seat(cx, { sel: '.kick, .count', a: 0.4, fade: 120 });
  TXDECK.finish(cx);
  return true;
})();
