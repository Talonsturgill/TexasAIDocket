  /* ---- CAMERA: bench height, close, from the front right; the blade low, the door above ---- */
  const FOCAL = [C.x, C.y - 0.004, C.z];

  const tagPts = [[-0.029, -0.018], [0.029, -0.018], [0.029, 0.018], [-0.029, 0.018]].map(([x, z]) => tagG.localToWorld(V(x, 0, z)));

  const AIMP = tagG.position.clone().lerp(toW(V(0, Y0 + SPAN, 0)), 0.5);

  for (let dist = 0.14; dist <= 0.9; dist += 0.005) {

  const FOCUS = V(...FOCAL).distanceTo(R.camera.position);

  CH.unacne(R, 0.0006);
  { const fill = new THREE.SpotLight(0xeaf2ff, 1.0, 0, 0.25, 0.9, 0); fill.position.copy(V(...FROM).add(V(0.25, 0.5, 0.2))); fill.target.position.copy(C); fill.castShadow = false; R.scene.add(fill); R.scene.add(fill.target);

    const rf = new THREE.SpotLight(0xf2f0ff, 1.4, 0, 0.12, 0.9, 0); rf.position.copy(ROOT.clone().add(V(-0.25, 0.3, 0.6))); rf.target.position.copy(ROOT); rf.castShadow = false; R.scene.add(rf); R.scene.add(rf.target); }

  { let gAll = 0, gB = 0; R.scene.traverse((m) => { if (m.isMesh && m.material === gold) gAll++; }); goldOwners.forEach((o) => o.traverse((m) => { if (m.isMesh && m.material === gold) gB++; }));

  const shot = await TXT.snapshot(R, {});

  const GW = gl.width, GH = gl.height;
  const beauty = document.createElement('canvas'); beauty.width = GW; beauty.height = GH; beauty.getContext('2d').drawImage(gl, 0, 0);

    fragmentShader: 'varying float vD; void main(){ float v = sqrt(clamp(vD / ' + DMAX.toFixed(1) + ', 0.0, 1.0)); gl_FragColor = vec4(v, v, v, 1.0); }' });
  const hid = []; R.scene.traverse((o) => { if ((o.isSprite || o.userData.noDepth) && o.visible) { o.visible = false; hid.push(o); } });
  const bg = R.scene.background; R.scene.background = new THREE.Color(1, 1, 1); R.scene.overrideMaterial = depthMat;

  R.renderer.render(R.scene, R.camera);

  R.scene.overrideMaterial = null; R.scene.background = bg; R.renderer.toneMapping = tm; hid.forEach((o) => { o.visible = true; });
  const depth = dctx.getImageData(0, 0, GW, GH).data;
  const dAt = (p) => { const v = depth[p] / 255; return Math.max(0.05, DMAX * v * v); };
  const fpx = CH.project(THREE, R, FOCAL);
  let dF = 0, nF = 0; for (let yy = -4; yy <= 4; yy++) for (let xx = -4; xx <= 4; xx++) { dF += dAt(((Math.round(fpx[1] * 2) + yy) * GW + Math.round(fpx[0] * 2) + xx) * 4); nF++; } dF /= nF;
  if (!(dF > FOCUS * 0.6 && dF < FOCUS * 1.5)) throw new Error('depth pass disagrees with the focus distance: ' + dF + ' vs ' + FOCUS);
  const RADII = [0, 4, 10, 20, 34], iF = 1 / dF, KN = 5, KF = 16;

    if (r) g.filter = 'blur(' + r + 'px)'; g.drawImage(beauty, 0, 0); return g.getImageData(0, 0, GW, GH).data; });
