<!doctype html>
<!-- SLIDE 3 — THE ONE FIGURE BOTH DOCUMENTS GIVE. A graduated machine rail with two
     set collars clamped at the two stated figures. Zero is drawn. No ground plane,
     the only frame in the deck without one. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: #191511; position: relative; font-family: "Fraunces", serif; }
  canvas.art { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
  .hook { position: absolute; left: 82px; top: 120px; width: 900px;
          font-weight: 800; font-size: 118px; line-height: 0.96;
          letter-spacing: -0.024em; color: #E9EEF3;
          font-variation-settings: "opsz" 118; }
  /* A FIGURE ON THIS PRODUCT IS A MEASUREMENT, so it is set in mono with tabular
     numerals. Two judges read this hook as "500 to 500 jobs" at feed size, because
     Fraunces closes the 3's terminals at display weight and it sat next to a real 500. */
  .hook .fig { font-family: "JetBrains Mono", monospace; font-weight: 700;
               font-size: 0.86em; letter-spacing: -0.01em;
               font-variant-numeric: tabular-nums; }
  .dek { position: absolute; left: 82px; top: 360px; width: 780px;
         font-family: "Manrope", sans-serif; font-weight: 500; font-size: 34px;
         line-height: 1.36; color: rgba(233,238,243,0.88); }
  .cid { position: absolute; left: 82px; top: 464px;
         font-family: "JetBrains Mono", monospace; font-size: 25px;
         letter-spacing: 0.13em; color: rgba(233,238,243,0.52); }
  .counter { position: absolute; left: 82px; bottom: 76px;
             font-family: "JetBrains Mono", monospace; font-size: 25px;
             letter-spacing: 0.14em; color: rgba(233,238,243,0.66); }
  .place { position: absolute; right: 80px; bottom: 76px; text-align: right;
           font-family: "JetBrains Mono", monospace; font-size: 25px;
           letter-spacing: 0.14em; color: rgba(233,238,243,0.66); }
  svg.lbl { position: absolute; left: 0; top: 0; }
  .tx-site { position: absolute; right: 80px; bottom: 46px; text-align: right;
             font-family: "JetBrains Mono", monospace; font-size: 24px;
             letter-spacing: 0.10em; color: rgba(233,238,243,0.42); }
</style>
</head>
<body data-encodes='[{"claim":"the guard band between the collars is not the rail","reads":"differ","a":[[540,896,150,22]],"b":[[300,896,150,22]]}]'>
  <canvas class="art" id="art" width="2160" height="2700"></canvas>
  <svg class="lbl" id="lbl" width="1080" height="1350"></svg>

  <h1 class="hook"><span class="fig">300</span> to <span class="fig">500</span> jobs</h1>
  <p class="dek">Both announcements state the same range. Neither release states a headcount inside it.</p>
  <div class="cid">c3 &nbsp; c8</div>
  <div class="counter">03 / 09</div>
  <div class="place">MANUFACTURING AND ENGINEERING</div>

  <div class="tx-site">texasaidocket.com</div>

<script>
window.renderReady = new Promise(function (resolve) {
  var SEED = 20260827;
  TX.reseed(SEED + 3);
  var R = TX.rng(SEED + 3);

  var c = document.getElementById('art'), g = c.getContext('2d');
  g.scale(2, 2);
  var W = 1080, H = 1350;

  function mix(a, b, t) { t = t < 0 ? 0 : t > 1 ? 1 : t;
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgb(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }

  var BLACKLAND = [25, 21, 17], MILL = [126, 131, 133], BRUSHED = [185, 188, 186];
  var COAT = [69, 75, 80], COAT_LIT = [148, 154, 160];
  var GUARD = [231, 184, 25], ZINC = [176, 150, 92], HIGHBAY = [233, 238, 243];

  // one lamp, upper left, off frame
  var GROUND = { x: 300, y: 800 };
  function lit(x, y) {
    var dx = (x - GROUND.x) / 620, dy = (y - GROUND.y) / 420;
    return 1 / (1 + dx * dx + dy * dy);
  }

  // ------------------------------------------------------- dark air, no ground plane
  g.fillStyle = rgb(BLACKLAND); g.fillRect(0, 0, W, H);
  for (var y = 0; y < H; y += 2) {
    for (var x = 0; x < W; x += 6) {
      var t = lit(x, y) * 0.24 + Math.max(0, TX.fbm2(x * 0.0028, y * 0.0055, 3)) * 0.055;
      g.fillStyle = rgb(mix(BLACKLAND, COAT, Math.min(0.44, t)));
      g.fillRect(x, y, 6, 2);
    }
  }

  // ------------------------------------------------------- THE SCALE, computed
  // The rail is the axis. Zero is drawn and sits inside the safe margin.
  var X0 = 122, X_MAX = 966;                 // screen span of the rail
  var JOB_MAX = 620;                         // the rail runs past 500 so 500 is not the end
  function jx(jobs) { return X0 + (X_MAX - X0) * (jobs / JOB_MAX); }
  var RY = 906, RR = 34;                     // rail centre line and radius

  var A = 300, B = 500;                      // both figures, quoted at c3 and c8
  var xa = jx(A), xb = jx(B);

  // ---- the rail body, a cylinder with a specular run and a terminator
  (function () {
    for (var x = X0 - 12; x < X_MAX + 30; x += 2) {
      var l = lit(x, RY);
      var base = mix(mix(BLACKLAND, MILL, 0.55), BRUSHED, Math.min(0.75, l * 0.85));
      for (var dy = -RR; dy <= RR; dy += 1) {
        // lambert across the cylinder, key from upper left
        var n = dy / RR;
        var shade = Math.max(0.06, Math.cos((n + 0.42) * 1.5));
        var col = mix(mix(base, BLACKLAND, 0.62), base, shade);
        if (n > -0.62 && n < -0.30) col = mix(col, HIGHBAY, 0.34 * l);   // specular run
        g.fillStyle = rgb(col);
        g.fillRect(x, RY + dy, 2, 1);
      }
    }
  })();

  // ---- GRADUATIONS, stepping away from the zero end stop, engraved and lamp-caught
  (function () {
    for (var v = 0; v <= JOB_MAX; v += 20) {
      var x = jx(v);
      if (x > X_MAX + 6) break;
      var major = (v % 100 === 0);
      var h = major ? 20 : 11;
      var l = lit(x, RY - RR);
      g.fillStyle = rgb(mix(BLACKLAND, MILL, 0.34));
      g.fillRect(x, RY - RR - h, 2, h);
      g.fillStyle = rgb(mix(mix(MILL, BRUSHED, 0.6), HIGHBAY, 0.20 * l));
      g.fillRect(x, RY - RR - h, 1, h);
    }
  })();

  // ---- THE ZERO END STOP, a bounded object with a lit chamfer and a shadowed bore
  (function () {
    var ex = X0 - 34, ew = 34, eh = RR * 2 + 46;
    var l = lit(ex, RY);
    var body = mix(mix(BLACKLAND, COAT, 0.7), COAT_LIT, Math.min(0.85, l * 0.9));
    var eg = g.createLinearGradient(ex, RY - eh / 2, ex + ew, RY + eh / 2);
    eg.addColorStop(0, rgb(mix(body, HIGHBAY, 0.26)));
    eg.addColorStop(0.5, rgb(body));
    eg.addColorStop(1, rgb(mix(body, BLACKLAND, 0.48)));
    g.fillStyle = eg;
    g.fillRect(ex, RY - eh / 2, ew, eh);
    // the lit chamfer face
    g.fillStyle = rgb(mix(body, HIGHBAY, 0.44));
    g.fillRect(ex, RY - eh / 2, ew, 5);
    // the bore the rail passes into, shadowed
    g.fillStyle = 'rgb(16,15,13)';
    g.beginPath(); g.ellipse(ex + ew, RY, 7, RR * 0.92, 0, 0, Math.PI * 2); g.fill();
  })();

  // ---- THE GUARD BAND, painted around the rail BETWEEN the two collars.
  // One hue at one intensity. No ramp, no partial fill.
  (function () {
    for (var x = xa; x < xb; x += 2) {
      var l = lit(x, RY);
      for (var dy = -RR; dy <= RR; dy += 1) {
        var n = dy / RR;
        var shade = Math.max(0.10, Math.cos((n + 0.42) * 1.5));
        var col = mix(mix(GUARD, BLACKLAND, 0.66), GUARD, shade);
        if (n > -0.62 && n < -0.30) col = mix(col, [255, 246, 208], 0.30);
        g.fillStyle = rgb(col);
        g.fillRect(x, RY + dy, 2, 1);
      }
    }
  })();

  // ---- TWO SET COLLARS, clamped at the two stated figures
  [xa, xb].forEach(function (cx) {
    var cw = 32, ch = RR * 2 + 30;
    var l = lit(cx, RY);
    var body = mix(mix(BLACKLAND, COAT, 0.74), COAT_LIT, Math.min(0.88, l * 0.95));
    var cg = g.createLinearGradient(cx - cw / 2, 0, cx + cw / 2, 0);
    cg.addColorStop(0, rgb(mix(body, HIGHBAY, 0.22)));
    cg.addColorStop(0.46, rgb(body));
    cg.addColorStop(1, rgb(mix(body, BLACKLAND, 0.52)));
    g.fillStyle = cg;
    g.fillRect(cx - cw / 2, RY - ch / 2, cw, ch);
    // the split line and the clamp screw
    g.fillStyle = rgb(mix(body, BLACKLAND, 0.62));
    g.fillRect(cx - cw / 2, RY - ch / 2 + ch * 0.30, cw, 3);
    g.fillStyle = rgb(mix(ZINC, HIGHBAY, 0.24 * l));
    g.beginPath(); g.ellipse(cx, RY - ch / 2 + ch * 0.16, 8, 8, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = rgb(mix(ZINC, BLACKLAND, 0.55));
    g.fillRect(cx - 4, RY - ch / 2 + ch * 0.16 - 1.5, 8, 3);
    // the lit top chamfer
    g.fillStyle = rgb(mix(body, HIGHBAY, 0.40));
    g.fillRect(cx - cw / 2, RY - ch / 2, cw, 4);
  });

  // ---- TWO PILLOW BLOCKS the rail passes through, bodies with lit crowns and dark
  // flanks, so the bottom third carries modeled tone rather than plates alone.
  [X0 + 96, X_MAX - 118].forEach(function (bx) {
    var bw = 96, bh = RR * 2 + 118, by = RY - RR - 24;
    var l = lit(bx, RY + 40);
    var body = mix(mix(BLACKLAND, COAT, 0.66), COAT_LIT, Math.min(0.72, l * 0.78));
    // the block, graded across
    var bg = g.createLinearGradient(bx - bw / 2, 0, bx + bw / 2, 0);
    bg.addColorStop(0, rgb(mix(body, HIGHBAY, 0.16)));
    bg.addColorStop(0.44, rgb(body));
    bg.addColorStop(1, rgb(mix(body, BLACKLAND, 0.58)));
    g.fillStyle = bg;
    g.beginPath();
    g.moveTo(bx - bw / 2, by + 40);
    g.lineTo(bx - bw / 2 + 16, by + 40);
    g.lineTo(bx - bw / 2 + 16, by + bh - 34);
    g.lineTo(bx - bw / 2 - 22, by + bh - 34);
    g.lineTo(bx - bw / 2 - 22, by + bh);
    g.lineTo(bx + bw / 2 + 22, by + bh);
    g.lineTo(bx + bw / 2 + 22, by + bh - 34);
    g.lineTo(bx + bw / 2 - 16, by + bh - 34);
    g.lineTo(bx + bw / 2 - 16, by + 40);
    g.lineTo(bx + bw / 2, by + 40);
    g.closePath(); g.fill();
    // the lit top edges of the foot
    g.fillStyle = rgb(mix(body, HIGHBAY, 0.36));
    g.fillRect(bx - bw / 2 - 22, by + bh - 34, bw + 44, 4);
    // two hold down bolts in the foot, bodies with a lit crown
    [bx - bw / 2 - 4, bx + bw / 2 + 4].forEach(function (fx) {
      g.fillStyle = rgb(mix(ZINC, HIGHBAY, 0.20 * l));
      g.beginPath(); g.ellipse(fx, by + bh - 16, 11, 8, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = rgb(mix(ZINC, BLACKLAND, 0.58));
      g.beginPath(); g.ellipse(fx, by + bh - 12, 11, 8, 0, 0, Math.PI); g.fill();
    });
  });

  // grain
  (function () {
    var img = g.getImageData(0, 0, W * 2, H * 2), d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = (R() - 0.5) * 13; d[i] += v; d[i + 1] += v; d[i + 2] += v;
    }
    g.putImageData(img, 0, 0);
  })();

  // ------------------------------------------------------------- SVG labels on plates
  var svg = document.getElementById('lbl');
  var NS = 'http://www.w3.org/2000/svg';
  function label(x, y, txt, anchor) {
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('text-anchor', anchor || 'middle');
    t.setAttribute('font-family', 'JetBrains Mono, monospace');
    t.setAttribute('font-size', '30');
    t.setAttribute('font-weight', '500');
    t.setAttribute('letter-spacing', '0.06em');
    t.setAttribute('fill', '#E9EEF3');
    t.textContent = txt;
    svg.appendChild(t);
    return t;
  }

  document.fonts.ready.then(function () {
    var l0 = label(X0 - 17, RY + 126, '0');
    var la = label(xa, RY + 126, '300');
    var lb = label(xb, RY + 126, '500');
    var lu = label(X0 - 17, RY - 132, 'JOBS', 'start');
    [l0, la, lb, lu].forEach(function (t) {
      TX.svgPlate(t, { padX: 14, padY: 9, fill: '#14120F', stroke: 'rgba(185,188,186,0.40)' });
    });
    // leader ticks from each collar down to its own plate, terminating on the collar's x
    [[xa, la], [xb, lb], [X0 - 17, l0]].forEach(function (pr) {
      var ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', pr[0]); ln.setAttribute('y1', RY + 54);
      ln.setAttribute('x2', pr[0]); ln.setAttribute('y2', RY + 90);
      ln.setAttribute('stroke', 'rgba(185,188,186,0.55)');
      ln.setAttribute('stroke-width', '2');
      svg.insertBefore(ln, svg.firstChild);
    });
    window.__txScale = { X0: X0, X_MAX: X_MAX, JOB_MAX: JOB_MAX, xa: xa, xb: xb,
                         pxPerJob: (X_MAX - X0) / JOB_MAX,
                         ratio: (xa - X0) / (xb - X0) };
    resolve();
  });
});
</script>
</body>
</html>
