  file.rotation.y = FILE.yaw; file.position.set(FILE.x, DT, FILE.z); TXT.add(R, file); TXT.contact(R, file, { opacity: 0.85, color: 0x3b1f5e });

  { const nOther = tabs.filter(t => t.material === tabOther).length, nScreen = tabs.filter(t => t.material === tabScreen).length;

  /* THE MONITOR, turned edge on toward the window and dark, so nothing on it can be read */

  /* a stoneware mug and a pen by her left hand, a short paper stack against the wall */
  { const mugM = new THREE.MeshPhysicalMaterial({ name: 'glazed-stoneware', color: 0x5a7be6, roughness: 0.3, clearcoat: 0.8 }); mugM.userData.txSurface = 'plastic';

  let HSEED = 21;

  }
  const nav = K.make('person', { seed: HSEED, hat: 'none', handShape: ['press', 'grip'], role: 'resident', pose: 'sit_read', build: 'female', height: 1.66, shirt: 0x8a3c8e, trousers: 0x2d2a5e, headPitch: 0.35,

  /* her hair a warm chestnut with sheen, never a black mass, so the room's light reads on its strands */
  /* her hair, tied back: the long curtain cut away above the nape, a smooth low bun added, a chestnut with an apricot sheen */
  { const hm = new THREE.MeshPhysicalMaterial({ name: 'hair-smooth', color: 0x8a4f36, roughness: 0.55, sheen: 0.8, sheenColor: new THREE.Color(0xffc8a0), sheenRoughness: 0.35, clearcoat: 0.25 }); hm.userData.txSurface = false;
    let hb = null;

      let g = m.geometry; if (g.index) g = g.toNonIndexed(); const P = g.attributes.position, Nn = g.attributes.normal; g.computeBoundingBox(); const top = g.boundingBox.max.y, cut = top - 0.19;
      const keep = []; for (let t = 0; t < P.count; t += 3) { if (P.getY(t) > cut && P.getY(t + 1) > cut && P.getY(t + 2) > cut) keep.push(t); }
      const np = new Float32Array(keep.length * 9), nn = new Float32Array(keep.length * 9);
      keep.forEach((t, k) => { for (let q = 0; q < 3; q++) { const o = k * 9 + q * 3; np[o] = P.getX(t + q); np[o + 1] = P.getY(t + q); np[o + 2] = P.getZ(t + q); if (Nn) { nn[o] = Nn.getX(t + q); nn[o + 1] = Nn.getY(t + q); nn[o + 2] = Nn.getZ(t + q); } } });
      const ng = new THREE.BufferGeometry(); ng.setAttribute('position', new THREE.BufferAttribute(np, 3)); if (Nn) ng.setAttribute('normal', new THREE.BufferAttribute(nn, 3)); else ng.computeVertexNormals(); ng.computeBoundingBox();
      m.geometry = ng; m.material = hm; hb = ng.boundingBox; });
    if (hb) { const bun = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), hm); bun.scale.set(0.07, 0.05, 0.055);
      bun.position.set((hb.min.x + hb.max.x) / 2, hb.min.y + 0.02, hb.min.z + 0.005); bun.castShadow = true; nav.add(bun);
      const band = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.006, 10, 30), new THREE.MeshPhysicalMaterial({ name: 'gold-free-plum-band', color: 0x5a2a7e, roughness: 0.5 })); band.position.copy(bun.position); band.position.z += 0.045; band.scale.setScalar(1.3); nav.add(band);
      window.__hair05b = [hb.min.y, hb.max.y, hb.min.z].map(v => +v.toFixed(3)); } }

  chair.rotation.y = Math.PI; chair.position.set(PERSON.x, A ? A.seat[1] - 0.505 : 0, PERSON.z - 0.02); TXT.add(R, chair); TXT.contact(R, chair);

  const FROM = [1.25, 1.6, 0.05];   /* beside her right shoulder, so her head stays out of frame to the left */
  file.updateMatrixWorld(true);

  const AIMED = CH.aim(THREE, R, TXT, FROM, [fileC.x, fileC.y, fileC.z], 690, 1010, 34);
  TXT.frame(R, { fov: 34, from: FROM, look: AIMED });

  /* THE LIGHT: late afternoon through the left window, apricot, plum fill from the room */
  const spec = CH.rigSpec(W, 6, 4096);

  spec.fill = Object.assign({}, spec.fill, { color: 0x8a62d8, i: 1.2 });

  { const sp = new THREE.SpotLight(0xffbf86, 22, 9, 0.42, 0.55, 1.6); sp.position.set(-1.1, 2.5, ROOM.backZ - 1.6); sp.target.position.set(0.1, DT, -1.0);
