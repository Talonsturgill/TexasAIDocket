    for (let k = 0; k < 12; k++) { const b = TXT.roundedBox(0.04, 0.04, 0.56, 0.008, iron); const o = new THREE.Vector3(-0.42 + k * 0.077, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.785); b.position.set(gx + o.x, 0.04, gz + o.z); b.rotation.y = 0.785; b.castShadow = true; R.scene.add(b); } }
