<!doctype html>
<!-- 2026-10-06, frame 9 of 9. Archetype CLOSE_CROP. RENDERED through txthree.js in the deck's goldenHour world. One 6 foot survey lath at the south line fence, its pink flagging streaming in the last light, FM 112 running west into the low sun with a pickup on it and utility poles receding. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  /* the deck's furniture, one size on every frame: kicker, counter, source line and site line */
  .kick, .count, .src, .tx-site { font-size:24px; }
  .hook { top: 880px !important; }
  .dek { width: 900px !important; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">The vote is October 8th</h1>
<p class="dek" data-follow="18">Big Watt Digital and PowerHouse Data Centers would commit $28.2 million and ask for no tax abatement. Regular council meetings are held in the City Hall Council Chambers.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-06-prairie.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await TT.boot(THREE, TXT, initKit, { kicker: "Taylor City Council", counter: "09 / 09", src: "c1 c4 c35 c43 c58", fit: { min: 84, max: 116, maxLines: 1 } });
  TT.installAll(); TT.flagStrength(2.5);
  const R = TT.stage(TXT, gl, W, { near: 0.02, fov: 26, fog: 0.0011, exposure: 0.45 });
  TXT.ground(R, { surface: 'dirt', size: 6000, tile: 5, seed: 66, color: TT.CLAY });
  /* the stake on the south line, the camera east of it looking west along FM 112 toward town */
  const lath = K.make('survey_lath', { above: TT.ft(6), seed: 61, wind: 0.95, lean: -0.01, tail: 0.55 }); lath.position.set(0, 0, 0); lath.rotation.y = -1.35; TT.put(lath, { opacity: 0.5 });
  const road = K.make('road', { length: 3000, lanes: 2, sidewalk: false, parkway: false, seed: 5 }); road.position.set(-1400, 0, 14); TXT.add(R, road);
  const truck = K.make('pickup', { trim: 'work', color: 0xd6d2c8, seed: 4 }); truck.rotation.y = -Math.PI / 2; truck.position.set(-90, 0.02, 12.2); TT.put(truck, true);
  TT.fenceLine({ xs: [-200, 10], length: 210, seed: 120, z: 0.6 });
  for (let k = 0; k < 14; k++) { const pole = K.make('utility_pole', { seed: 30 + k, height: 10.7 }); pole.position.set(-40 - k * 90, 0, 22); TXT.add(R, pole); }
  for (let i = 0; i < 18; i++) { const t = K.make(i % 2 ? 'live_oak' : 'pecan', { seed: 170 + i, height: 12, spread: 14 }); t.position.set(-900 - i * 110, 0, -60 + ((i * 37) % 160)); TXT.add(R, t); }
  TXT.frame(R, { from: [3.6, 1.6, -0.3], look: [-200, -8.4, 43.0] });
  TXT.sky(R);
  TT.stubble([-300, -20, 2, 10], { count: 9000, seed: 67, scale: [0.14, 0.28] });
  TXT.deckRig(R, ...TT.rig(W, { size: 300, target: [-120, 0, 0], distance: 500, far: 1400 }));
  TXT.weather(R, { grime: 0.18, height: 0.6 });
  const cx = TT.develop(await TXT.snapshot(R), gl);
  TT.post(cx, { shade: 0.2, a: 0.3, to: 150, veilH: 540, veil: 0.44 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
