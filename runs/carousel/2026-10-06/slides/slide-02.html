<!doctype html>
<!-- 2026-10-06, frame 2 of 9. Archetype FULL_BLEED. RENDERED through txthree.js in the deck's goldenHour world. Frame 1's field from frame 1's camera to the centimetre, every stake row pulled, one lath lying unflagged on the clay just inside the south line fence. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  /* the deck's furniture, one size on every frame: kicker, counter, source line and site line */
  .kick, .count, .src, .tx-site { font-size:24px; }
  .hook { top: 870px !important; }
  .dek { width: 880px !important; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Without it, no zoning at all</h1>
<p class="dek" data-follow="18">The developers withdrew their annexation and zoning application on September 3rd. The city says that without the agreement the land stays in unincorporated Williamson County, which has no zoning authority.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-06-prairie.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await TT.boot(THREE, TXT, initKit, { kicker: "Without the agreement, the city says", counter: "02 / 09", src: "c5 c6 c8 c9", fit: { min: 84, max: 116, maxLines: 1 } });
  TT.installAll();
  const R = TT.stage(TXT, gl, W, { near: 0.05, fov: 30, fog: 0.0013, exposure: 1.55 });
  TXT.ground(R, { surface: 'dirt', size: 3000, tile: 5, seed: 6, color: TT.CLAY });
  /* the same place as frame 1 with nothing staked in it: the creek's tree line and the farmstead stand */
  TT.treeLine({ n: 26, seed: 40 });
  const barn = K.make('barn', { style: 'gable', material: 'metal', seed: 5 }); barn.position.set(-260, 0, -820); barn.rotation.y = 0.4; TT.put(barn, true);
  const bin = K.make('grain_bin', { seed: 2 }); bin.position.set(-232, 0, -812); TT.put(bin, true);
  TT.fenceLine({ xs: [-210, 0, 210], length: 210, seed: 4, z: 0 });
  /* the pulled lath: lying on the clay inside the fence, its point muddy, no flagging */
  const pulled = K.make('survey_lath', { state: 'pulled', seed: 7 });
  pulled.position.set(1.4, 0.13, -1.3); pulled.rotation.y = 0.25;
  TT.put(pulled, { opacity: 0.8, dirt: false });
  /* the hub the crew left driven flush beside where the lath stood, and a dropped roll of flagging tape */
  const hubWood = new THREE.MeshStandardMaterial({ color: 0xb7996c, roughness: 0.86 });
  const hub = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.035, 0.05), hubWood); hub.position.set(2.9, 0.012, -3.4); TXT.add(R, hub);
  const roll = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.016, 10, 24), new THREE.MeshStandardMaterial({ color: TT.ACCENT, roughness: 0.6, emissive: TT.ACCENT, emissiveIntensity: 0.3 }));
  roll.rotation.x = Math.PI / 2 - 0.25; roll.position.set(0.9, 0.018, -2.0); TT.put(roll, { opacity: 0.4, dirt: false });
  for (let s = 0; s < 7; s++) { const scuff = new THREE.Mesh(new THREE.CircleGeometry(0.13, 12), new THREE.MeshStandardMaterial({ color: 0x3e3328, roughness: 1 })); scuff.rotation.x = -Math.PI / 2; scuff.scale.set(0.55, 1, 1); scuff.position.set(1.2 + s * 0.42, 0.004, -2.4 - (s % 2) * 0.35); TXT.add(R, scuff); }
  TXT.add(R, TT.furrows({ x0: -260, x1: 260, z0: 12, z1: -700, seed: 31 }));
  TXT.frame(R, { from: [0, 1.6, 8.2], look: [-20, -47.8, -400] });
  TXT.sky(R);
  TT.clods([-40, -60, 40, -2], { count: 1400, seed: 7, scale: [0.02, 0.05] });
  TT.stubble([-140, -300, 140, 8], { count: 9000, seed: 8, scale: [0.12, 0.26] });
  TXT.deckRig(R, ...TT.rig(W, { size: 70, target: [0, 0, -12], distance: 160, far: 420 }));
  TXT.weather(R, { grime: 0.18, height: 0.5 });
  const cx = TT.develop(await TXT.snapshot(R), gl);
  TT.post(cx, { typeFeather: 70, typeBlur: 20, a: 0.45, to: 150, veilH: 560, veil: 0.42 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
