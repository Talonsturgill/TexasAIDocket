<!doctype html>
<!-- 2026-10-06, frame 6 of 9. Archetype OBJECT_AND_CAPTION. RENDERED through txthree.js in the deck's goldenHour world. An earthen berm as the terms describe it, seen from its toe at a crouched eye, turf from green faces to straw crest, young cedar elms on its face, a lath buried flush at its 6 foot crest. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  /* the deck's furniture, one size on every frame: kicker, counter, source line and site line */
  .kick, .count, .src, .tx-site { font-size:24px; }
  .hook { top: 880px !important; }
  .dek { width: 900px !important; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">6 feet of earth</h1>
<p class="dek" data-follow="18">A buffer of at least 400 feet along the south line would carry landscaping and earthen berms at least 6 feet high. The city says the buffer areas would separate the development from nearby homes.</p>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-06-prairie.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await TT.boot(THREE, TXT, initKit, { kicker: "The berm as described, not built", counter: "06 / 09", src: "c32 c33 c59", fit: { min: 84, max: 116, maxLines: 1 } });
  TT.installAll();
  const R = TT.stage(TXT, gl, W, { near: 0.05, fov: 32, fog: 0.0012, exposure: 1.3 });
  TXT.ground(R, { surface: 'dirt', size: 3000, tile: 5, seed: 36, color: TT.CLAY });
  /* the berm, its crest the terms' 6 feet, running east and west 9 m north of the camera's toe */
  const BZ = -9, berm = K.make('earthen_berm', { length: 420, height: TT.ft(6), seed: 6, wobble: 0.5 });
  berm.position.set(0, 0, BZ); TXT.add(R, berm);
  const hAt = (x, z) => berm.userData.heightAt(x, z - BZ);
  /* young cedar elms planted on its south face */
  for (const [x, dz, sd] of [[2.4, 1.2, 9]]) {
    const t = K.make('cedar_elm', { seed: sd, height: 2.6, spread: 1.9 }); const ty = hAt(x, BZ + dz); t.position.set(x, ty - 0.05, BZ + dz); TT.put(t, { y: hAt(x, BZ + dz), opacity: 0.45 });
  }
  /* a 6 foot lath at the berm's toe, its top level with the crest it measures */
  /* the berm's toe: half its crest plus its 3 to 1 slope times its height, out from the centreline */
  const toeZ = BZ + 1.2 + 3 * TT.ft(6) + 0.6;
  const lath = K.make('survey_lath', { above: TT.ft(6), seed: 41, flagging: false, hub: true }); lath.position.set(-0.9, 0, toeZ); TT.put(lath, { opacity: 0.55 });
  /* the landscaping the terms describe: a mown toe strip, tall grass block at the foot, young elms on the face */
  const toe = K.make('pasture', { width: 120, depth: 3, height: 0.14, season: 'fall', flowers: 'none', seed: 4 }); toe.position.set(0, 0, BZ + 9); TXT.add(R, toe);
  /* a long lens from 39 m, low, so the berm rises as a mound and the stake at its toe and the crest
   * it measures stand at nearly one distance and read level */
  TXT.frame(R, { from: [-16, 1.0, 7], look: [40, -5.25, -16] });
  TXT.sky(R);
  /* the berm's turf: October tufts on its south face, lifted onto the surface the berm declares */
  TT.drape(TXT.scatter(R, { kind: 'grass', count: 30000, area: [-40, BZ - 1.2, 40, BZ + 7.4], seed: 39, near: false, scale: [0.12, 0.26], colors: [0xb3a27e, 0x9a8a66, 0x7d7656, 0x8f8a52] }), hAt);
  TT.clods([-30, -1, 30, 12], { count: 4200, seed: 37, scale: [0.025, 0.06] });
  TT.stubble([-60, -2, 60, 29], { count: 24000, seed: 38, scale: [0.12, 0.28] });
  TXT.deckRig(R, ...TT.rig(W, { size: 60, target: [0, 0, -8], distance: 140, far: 360 }));
  TXT.weather(R, { grime: 0.15, height: 0.5 });
  const cx = TT.develop(await TXT.snapshot(R), gl);
  TT.post(cx, { a: 0.45, to: 150, veilH: 520, veil: 0.22 });
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
