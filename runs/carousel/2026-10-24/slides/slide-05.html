<!doctype html>
<!-- 2026-10-24, frame 5 of 9. Archetype FULL_BLEED. A spatial scene through txthree.js inside the deck's dark bay, floodlit through its door: anchor bolt groups close to the lens on a sealed slab, empty pads in bluebonnet tape, crated tools and two work lamps, the high bay lamps present and off, and no robot. The bay's carriers and lit rows are read from figures.json. Drawn to illustrate. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>.dek { width:800px !important; }</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site" style="font-size:24px">texasaidocket.com</div>
<h1 class="hook" id="hook" style="line-height:1.04">Construction, with no figure</h1>
<p class="dek" data-follow="24">Tesla's Texas row for Optimus gives no capacity figure. Tesla defines construction as buildout and tool installation. Robot production began in Fremont, California. The bay is drawn to&nbsp;illustrate.</p>
<script>window.FIG = {"model_y": 375000, "cybertruck": 125000, "cybercab": 125000, "vehicle_rows": 3, "model_y_to_cybercab": 3, "unit": 125, "model_y_blocks": 3, "cybercab_blocks": 1, "cybertruck_blocks": 1, "megapack_gwh": 50, "cells_gwh": 40, "cathode_gwh": 10, "lithium_gwh": 30, "cortex1_mw": 105, "cortex2_mw": 120, "cortex_texas_mw": 225, "plan_mw": 400, "other_mw": 40, "mw_per_row": 5, "cortex1_rows": 21, "cortex2_rows": 24, "optimus_texas_capacity": 0, "hours_start": 6, "hours_open": 18, "hours_closed": 6, "fab_year": 2027, "fab_machines_placed": 0, "population": 1000, "controls_missing": 4, "audit_opened_day": 3, "texas_rows": 5, "production_rows": 4, "construction_rows": 1, "gwh_per_unit": 10, "megapack_units": 5};</script>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txcolor.js"></script>
<script src="@@ASSETS@@/js/txpost.js"></script>
<script src="@@ASSETS@@/js/txdeck.js"></script>
<script src="@@ASSETS@@/js/deck/2026-10-24-apron.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "Optimus, Texas row", counter: "05 / 09", src: "c6 c7 c11 c27", fit: { min: 74, max: 104, maxLines: 2 } });
  const R = CH.stage(TXT, gl, W, { fov: 46, near: 0.05, far: 2000 });
  /* THE FIGURE, from figures.json: the Texas Optimus row's capacity cell is a hyphen, so this bay's line holds this
   * many carriers and its high bay rows are lit this many times: none */
  const carriers = FIG.optimus_texas_capacity;
  /* THE SET FACES THE FLOOD: the bay is turned so its door looks along the deck's declared light. The camera stands
   * just inside the door looking in, so the flood comes over its shoulder and lights the bolts' near faces. Every position below is in the set's own frame. */
  const set = new THREE.Group(); set.rotation.y = TXDECK.deck().light.az * Math.PI / 180; R.scene.add(set);
  const local = (p) => new THREE.Vector3(p[0], p[1], p[2]).applyAxisAngle(new THREE.Vector3(0, 1, 0), set.rotation.y).toArray();
  const bay = K.make('plant_bay', { lit: carriers > 0 }); bay.position.set(0, 0, 15); set.add(bay);
  const room = TXT.interior(R, { w: 15.6, d: 30, h: 12.4, floor: 'concrete', wall: 0x1a1917, window: null, ceiling: false, light: 0.12, tile: 14, joints: 1 }); room.rotation.y = set.rotation.y;
  /* the slab's furniture: bolt groups in two rows where machine bases will stand, three taped empty pads, two crates */
  const bolts = [];
  [[-1.5, 10.2, 0.5], [2.2, 6.6, 0.32], [-2.6, 4.2, 0.32], [2.4, 1.6, 0.32]].forEach((p, i) => { const b = K.make('anchor_bolt_set', { square: 0.56, proud: p[2], rod: i ? 0.017 : 0.02 }); b.position.set(p[0], 0.014, p[1]); b.rotation.y = 0.06 * i; set.add(b); bolts.push(b); });
  { const t = CH.tapeRect(THREE, K, 2.4, 2.0, 0.16); t.position.set(-1.5, 0.016, 10.2); set.add(t); }
  const pads = [];
  [[3.4, -1.2], [-3.0, -0.4]].forEach((p) => { const m = K.make('machine_pad', { tape: CH.ACCENT, tapeLit: true, cordTop: CH.LAMP_Y }); m.position.set(p[0], 0.014, p[1]); set.add(m); pads.push(m); });
  const crates = [];
  [[-4.4, -4.2, 0.2], [4.2, -6.4, -0.1]].forEach((p, i) => { const c = K.make('tool_crate', { open: i === 1 }); c.position.set(p[0], 0, p[1]); c.rotation.y = p[2] + Math.PI / 2; set.add(c); crates.push(c); });
  const lamps = [];
  [[1.9, 7.4, 2.4, true], [-4.4, 4.6, 0.55, false]].forEach((p) => { const l = K.make('tripod_work_lamp', { aim: -0.75, light: p[3] ? 0.5 : 1, shadow: p[3] }); l.position.set(p[0], 0.014, p[1]); l.rotation.y = p[2]; set.add(l); lamps.push(l); });
  /* THE NEAR FOOTING IS SET INTO THE SLAB: its grout pocket sits flush, an aggregate grout with tooth, so the rods
   * rise out of the floor itself and their casts land on concrete */
  { const gm = new THREE.MeshStandardMaterial({ color: 0x9a968e, roughness: 0.95, map: K.tex('concrete') });
    bolts[0].children[0].scale.y = 0.2; bolts[0].children[0].position.y = 0.004; bolts[0].children[0].material = gm; }
  /* the slab's own marks: saw cut joints on a six metre grid and oil where the tool trucks stood */
  { const jm = new THREE.MeshStandardMaterial({ color: 0x141312, roughness: 0.95 });
    [[0, 12.4, 15.2, 0.02], [0, 6.4, 15.2, 0.02], [-0.2, 6, 0.02, 18], [5.6, 6, 0.02, 18]].forEach((j) => { const m = new THREE.Mesh(new THREE.BoxGeometry(j[2], 0.004, j[3]), jm); m.position.set(j[0], 0.015, j[1]); m.receiveShadow = true; set.add(m); });
    const om = new THREE.MeshStandardMaterial({ color: 0x0c0b0a, roughness: 0.35, transparent: true, opacity: 0.45, depthWrite: false });
    [[1.6, 11.8, 0.9], [-3.2, 8.6, 1.2], [3.6, 9.4, 0.7], [-0.9, 12.9, 0.5]].forEach((o, i) => { const m = new THREE.Mesh(new THREE.CircleGeometry(o[2], 28), om); m.rotation.x = -Math.PI / 2; m.scale.set(1, 0.6 + 0.2 * i, 1); m.position.set(o[0], 0.016, o[1]); set.add(m); }); }
  set.updateMatrixWorld(true);
  const from = local([-0.6, 0.9, 14.2]);
  const look = CH.aim(THREE, R, TXT, from, local([-1.5, 0.3, 10.2]), 560, 1000, 46);
  TXT.frame(R, { fov: 46, from, look });
  CH.warm(R, 0.12);
  { const spec = CH.rigSpec(W, 40, 4096); TXT.deckRig(R, spec, CH.rigOpts(local([0, 0, 6]), { distance: 60, shadowFar: 160, normalBias: 0.01 })); }
  CH.unacne(R, 0.01);
  crates.forEach((o) => TXT.contact(R, o));
  lamps.forEach((o) => TXT.contact(R, o, { dirt: false, grit: false }));
  TXT.weather(R, { grime: 0.25, height: 0.6, mottle: 0.2 });
  const cx = CH.develop(await TXT.snapshot(R, { stage: false }), gl);
  CH.post(cx, { a: 0.45, veil: 0, footWash: 0.3 });
  CH.knock(cx, [".dek", ".hook"], 0.5);
  TXDECK.finish(cx);
  return true;
})();
</script>
</body>
</html>
