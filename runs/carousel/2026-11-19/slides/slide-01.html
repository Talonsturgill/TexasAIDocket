<!doctype html>
<!-- 2026-11-19, frame 1 of 9, the cover. AT THE DOOR. A macro render through txthree.js in TXT.studio wonder: one generic
bronze fly, built in this frame at macro detail and drawn to illustrate, grips the fat fire polished lip of a clear glass
mouth at its own eye level. Below the lip, seen through the glass, the throat splits in two and only the keep branch carries
a band of dusk gold. No camera, flap or circuit; no size is claimed for the fly or the glass. -->

<h1 class="hook" id="hook" style="left:72px; top:144px; width:560px; text-align:left">One fly at the door. Which one stays?</h1>
<p class="dek" data-follow="26" style="left:74px; width:500px; font-size:29px">Screwworm was declared eliminated from the US in 1966. More than 120 animal cases were confirmed as of November 12th, most of them in Texas. A trap planned at UT Arlington would decide fly by fly. Drawn to illustrate.</p>

<script type="module">
import * as THREE from '@@ASSETS@@/js/three.module.min.js';
import { init } from '@@ASSETS@@/js/txthree.js';
import { initKit } from '@@ASSETS@@/js/txkit.js';
window.renderReady = (async () => {
  /* THE FIGURES. This frame draws no count, length or share, so FIG must be empty, and it draws exactly one fly. */
  /* fig_inject writes this frame's FIG line as {} because no FIG name is read here. */
  const FLIES_DRAWN = 1;

  const TXT = init(THREE);
  const { K, gl, W } = await CH.boot(THREE, TXT, initKit, { kicker: "At the door", counter: "01 / 09", src: "c2 c4 c1", fit: { min: 78, max: 94, maxLines: 3 } });
  const R = CH.stage(TXT, gl, W, { fov: 24, near: 0.004, far: 5, fog: 0 });
  const mm = 0.001, V = (x, y, z) => new THREE.Vector3(x, y, z), rng = CH.rng(20261119);
  const flat = (m) => { m.userData.txSurface = false; return m; };

  /* ---------------- THE GLASS MOUTH ---------------- */
  /* RT is the height of the bead's top, where the fly stands; RB is the bead itself, a thin fire polished rim */
  const RM = 5.6 * mm, RT = 0.62 * mm, RB = 0.17 * mm, BYC = RT - RB, BORE = 1.25 * mm;
  const glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.03, transmission: 0.95, ior: 1.47, thickness: 0.0002, specularColor: new THREE.Color(0xffffff),
    attenuationColor: new THREE.Color(0xf4f8ff), attenuationDistance: 0.2, clearcoat: 1, clearcoatRoughness: 0.02, specularIntensity: 1,
    envMapIntensity: 1.2, side: THREE.DoubleSide, transparent: true });

  const G = new THREE.Group(); G.name = 'sort-mouth';
  /* the thin fire polished bead of the lip, its top at y = RT */
  const lip = new THREE.Mesh(new THREE.TorusGeometry(RM, RB, 32, 256), glass); lip.rotation.x = Math.PI / 2; lip.position.y = BYC; G.add(lip);
  /* the horn's own glass: it keeps its edges but does not mirror the softbox across the mouth, so the open cone reads
   * through the mouth narrowing into the collar instead of as a sealed disc */
  /* a thin clear wall: nearly invisible face on, brightening toward its silhouettes as real thin glass does */
  const hornGlass = flat(new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: "varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vV = mv.xyz; vN = normalMatrix * normal; gl_Position = projectionMatrix * mv; }",
    fragmentShader: "varying vec3 vN; varying vec3 vV; void main(){ float c = abs(dot(normalize(vN), normalize(-vV))); float f = pow(1.0 - c, 2.6); vec3 col = mix(vec3(0.52, 0.62, 1.0), vec3(0.96, 0.97, 1.0), f); gl_FragColor = vec4(col, 0.035 + 0.62 * f); }" }));
  hornGlass.name = 'horn-glass';
  /* the horn: from just inside the bead down to the throat, steep near the throat */
  const THROAT = -3.7 * mm, FORK = -5.1 * mm;
  const hp = []; for (let i = 0; i <= 48; i++) { const u = i / 48; hp.push(new THREE.Vector2(BORE + (RM - RB * 0.5 - BORE) * Math.pow(1 - u, 1.05), BYC + (THROAT - BYC) * u)); }
  hp.reverse(); G.add(new THREE.Mesh(new THREE.LatheGeometry(hp, 160), hornGlass));
  /* the outer skirt below the bead, so the lip reads as a thick rolled rim */
  const sp = []; for (let i = 0; i <= 24; i++) { const u = i / 24; sp.push(new THREE.Vector2(RM + RT * 0.55 - u * 0.6 * mm * u, -RT * 0.6 - u * 1.6 * mm)); }
  /* (no skirt: the funnel's own wall carries the eye down from the bead into the stem) */
  const tube = (a, b, r) => { const v = b.clone().sub(a), L = v.length(); const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, 64, 1, true), glass);
    m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(V(0, 1, 0), v.normalize()); G.add(m); return m; };
  tube(V(0, THROAT + 0.2 * mm, 0), V(0, FORK, 0), BORE);
  const knot = new THREE.Mesh(new THREE.SphereGeometry(BORE * 1.12, 48, 32), glass); knot.position.set(0, FORK, 0); G.add(knot);
  /* the two branches recede: the Y plane is turned so KEEP runs down and back to the left, RELEASE down and back to the right */
  const A35 = 42 * Math.PI / 180, BL = 8.5 * mm, back = -0.55;
  const dirK = V(-Math.sin(A35), -Math.cos(A35), back).normalize(), dirR = V(Math.sin(A35), -Math.cos(A35), back).normalize();
  const fork = V(0, FORK, 0), keepEnd = fork.clone().addScaledVector(dirK, BL), relEnd = fork.clone().addScaledVector(dirR, BL);
  tube(fork, keepEnd, BORE); tube(fork, relEnd, BORE);
  /* each branch finishes OPEN: a fire polished rim at its mouth, one way in and two ways out */
  [[keepEnd, dirK], [relEnd, dirR]].forEach(([e, d]) => { const rim = new THREE.Mesh(new THREE.TorusGeometry(BORE, 0.16 * mm, 20, 96), glass);
    rim.position.copy(e); rim.quaternion.setFromUnitVectors(V(0, 0, 1), d); G.add(rim); });
  /* THE ACCENT, the only dusk gold on the frame: one band round the keep branch just past the fork */
  const gold = new THREE.MeshPhysicalMaterial({ color: 0xe0956a, emissive: 0xe0956a, emissiveIntensity: 0.42, metalness: 0.0, roughness: 0.36, clearcoat: 0.8 });
  gold.name = 'keep-band-paint';
  const band = new THREE.Mesh(new THREE.TorusGeometry(BORE * 1.04, 0.4 * mm, 20, 96), gold);
  band.position.copy(fork.clone().addScaledVector(dirK, 4.6 * mm)); band.quaternion.setFromUnitVectors(V(0, 0, 1), dirK); G.add(band);
  const band2 = new THREE.Mesh(new THREE.CylinderGeometry(BORE * 1.01, BORE * 1.01, 2.2 * mm, 96, 1, true), gold);
  band2.position.copy(band.position); band2.quaternion.setFromUnitVectors(V(0, 1, 0), dirK); G.add(band2);
  G.traverse(m => { if (m.isMesh) { m.userData.txBevel = false; m.castShadow = false; m.receiveShadow = (m === lip); } });   /* only the bead takes the fly's shadow */
  R.scene.add(G);

  /* THE STUDIO: the floor stands exactly at the lowest point of the two branch rims, so the glass RESTS on its two open ends */
  const RIM_T = 0.16 * mm, rimLow = (e, d) => e.y - (BORE + RIM_T) * Math.sqrt(1 - d.y * d.y);
  const FLOOR_Y = Math.min(rimLow(keepEnd, dirK), rimLow(relEnd, dirR));
  const sweep = TXT.studio(R, { tone: CH.TONE, w: 0.4, d: 0.05, h: 0.2, radius: 0.03, y: FLOOR_Y, env: 0.95, hemi: 0.6, softbox: 3.6, accentStrip: 0, wall: 0x1a6cff, top: 0x0c36c0, floor: 0x4a5ef0 });
  /* the sweep holds its own colour, so the warm key can't turn the cobalt wall to lilac behind the fly; the key's falloff is
   * baked into it instead: a soft pool on the floor under the glass, the cove catching the key as it turns, the wall
   * settling darker as it climbs */
  sweep.material = flat(new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, color: 0xb4b4b4 })); sweep.material.name = 'studio-sweep';
  { const P = sweep.geometry.attributes.position, C = sweep.geometry.attributes.color, RAD = 0.03, zB = -0.025;
    for (let i = 0; i < P.count; i++) { const x = P.getX(i), y = P.getY(i) - FLOOR_Y, z = P.getZ(i); let k;
      if (y < 1e-6) { const r2 = (x * x) / (0.03 * 0.03) + ((z + 0.004) * (z + 0.004)) / (0.022 * 0.022); k = 0.86 + 0.3 * Math.exp(-r2) - 0.1 * Math.min(1, Math.max(0, (zB * 0.4 - z) / 0.02)); }
      else if (y < RAD) { const t = y / RAD; k = 0.74 + 0.36 * Math.sin(Math.PI * Math.pow(t, 0.8)) + 0.02 * t; }
      else { const t = Math.min(1, (y - RAD) / 0.08); k = 0.76 - 0.24 * t * t; }
      k *= 1 - 0.18 * Math.min(1, (x * x) / (0.06 * 0.06));
      C.setXYZ(i, C.getX(i) * k, C.getY(i) * k, C.getZ(i) * k); }
    C.needsUpdate = true; }

  /* ---------------- THE FLY, generic, drawn to illustrate, built here at macro detail ---------------- */
  /* where it stands: astride the bead on the FAR side of the mouth, a little right, its head over the opening, peering in
   * toward the camera, so the door lies open in front of it */
  const TH = 124 * Math.PI / 180;
  const perch = V(RM * Math.sin(TH), RT, RM * Math.cos(TH));
  const fly = new THREE.Group(); fly.name = 'fly';
  fly.position.copy(perch);
  const heading = V(-Math.sin(TH), 0, -Math.cos(TH)).applyAxisAngle(V(0, 1, 0), 0.0);
  fly.rotation.y = Math.atan2(heading.x, heading.z);
  fly.updateMatrixWorld(true);

  /* textures */
  const tex = (w, h, paint, o) => { const t = CH.canvasTex(THREE, w, h, paint); if (o && o.linear) t.colorSpace = THREE.NoColorSpace; return t; };
  const thoraxTex = tex(1024, 512, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#3e5a34'); g.addColorStop(0.5, '#6a6a30'); g.addColorStop(1, '#2c3a26');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    const r = CH.rng(5); for (let i = 0; i < 9000; i++) { x.fillStyle = 'rgba(' + (r() < 0.5 ? '10,20,12,' : '190,170,90,') + (0.05 + r() * 0.12).toFixed(3) + ')'; x.beginPath(); x.arc(r() * w, r() * h, 0.8 + r() * 2.2, 0, 7); x.fill(); }
    x.fillStyle = 'rgba(14,26,24,0.32)'; [0.42, 0.5, 0.58].forEach(u => x.fillRect(0, h * u - 6, w, 12));   /* faint dorsal stripes, generic */
  });
  const bumpTex = tex(512, 512, (x, w, h) => { x.fillStyle = '#808080'; x.fillRect(0, 0, w, h); const r = CH.rng(9);
    for (let i = 0; i < 7000; i++) { const v = r() < 0.5 ? 40 : 200; x.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.35)'; x.beginPath(); x.arc(r() * w, r() * h, 0.7 + r() * 1.8, 0, 7); x.fill(); } }, { linear: true });
  bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping; bumpTex.repeat.set(3, 3);
  const abdTex = tex(512, 1024, (x, w, h) => {
    x.fillStyle = '#4a6a3a'; x.fillRect(0, 0, w, h);
    for (let k = 0; k < 5; k++) { const y0 = h * (0.12 + k * 0.17); const g = x.createLinearGradient(0, y0, 0, y0 + h * 0.17);
      g.addColorStop(0, '#5f7a3c'); g.addColorStop(0.7, '#3a5a46'); g.addColorStop(0.92, '#1c2a24'); g.addColorStop(1, '#5f7a3c'); x.fillStyle = g; x.fillRect(0, y0, w, h * 0.17); }
    const r = CH.rng(6); for (let i = 0; i < 6000; i++) { x.fillStyle = 'rgba(' + (r() < 0.5 ? '8,16,12,' : '200,190,110,') + (0.04 + r() * 0.1).toFixed(3) + ')'; x.fillRect(r() * w, r() * h, 1.5, 1.5); }
  });
  /* compound eye: hex facets as a normal map, each facet a small dome */
  const FAC = 15;
  const eyeN = (() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 1024; const x = c.getContext('2d'); const im = x.createImageData(1024, 1024);
    const sx = FAC, sy = FAC * Math.sqrt(3) / 2;
    for (let py = 0; py < 1024; py++) for (let px = 0; px < 1024; px++) {
      const row = Math.round(py / sy), off = (row % 2) ? sx / 2 : 0; let col = Math.round((px - off) / sx);
      let bx = col * sx + off, by = row * sy, best = 1e9, dx = 0, dy = 0;
      for (let rr = row - 1; rr <= row + 1; rr++) { const o2 = (rr % 2 + 2) % 2 ? sx / 2 : 0; for (let cc = Math.round((px - o2) / sx) - 1; cc <= Math.round((px - o2) / sx) + 1; cc++) {
        const ex = px - (cc * sx + o2), ey = py - rr * sy, d = ex * ex + ey * ey; if (d < best) { best = d; dx = ex; dy = ey; } } }
      const nx = dx / (FAC * 0.55), ny = dy / (FAC * 0.55), q = Math.min(0.95, nx * nx + ny * ny), nz = Math.sqrt(1 - q);
      const i = (py * 1024 + px) * 4; im.data[i] = 128 + nx * 110; im.data[i + 1] = 128 - ny * 110; im.data[i + 2] = 128 + nz * 127; im.data[i + 3] = 255;
    }
    x.putImageData(im, 0, 0); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 1); return t; })();
  const eyeCol = tex(512, 512, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#6e2416'); g.addColorStop(0.5, '#8e3420'); g.addColorStop(1, '#4e180e');
    x.fillStyle = g; x.fillRect(0, 0, w, h); const r = CH.rng(4); for (let i = 0; i < 1500; i++) { x.fillStyle = 'rgba(40,8,4,' + (r() * 0.25).toFixed(2) + ')'; x.fillRect(r() * w, r() * h, 3, 3); } });
  /* the wing: a faintly smoky membrane with the venation of a resting calyptrate fly, generic */
  const wingTex = tex(1536, 640, (x, w, h) => {
    x.clearRect(0, 0, w, h);
    const outline = () => { x.beginPath(); x.moveTo(0.02 * w, 0.5 * h); x.bezierCurveTo(0.2 * w, 0.18 * h, 0.7 * w, 0.06 * h, 0.95 * w, 0.32 * h);
      x.bezierCurveTo(1.0 * w, 0.42 * h, 0.99 * w, 0.62 * h, 0.9 * w, 0.74 * h); x.bezierCurveTo(0.7 * w, 0.96 * h, 0.3 * w, 0.98 * h, 0.12 * w, 0.78 * h);
      x.bezierCurveTo(0.06 * w, 0.7 * h, 0.03 * w, 0.6 * h, 0.02 * w, 0.5 * h); x.closePath(); };
    outline(); const g = x.createLinearGradient(0, 0, w, 0); g.addColorStop(0, 'rgba(110,100,85,0.6)'); g.addColorStop(0.35, 'rgba(205,212,225,0.34)'); g.addColorStop(1, 'rgba(230,236,245,0.26)');
    x.fillStyle = g; x.fill();
    x.save(); outline(); x.clip();
    const vein = (pts, lw, a) => { x.strokeStyle = 'rgba(52,40,30,' + a + ')'; x.lineWidth = lw; x.lineCap = 'round'; x.beginPath(); x.moveTo(pts[0] * w, pts[1] * h);
      for (let i = 2; i < pts.length; i += 4) x.quadraticCurveTo(pts[i] * w, pts[i + 1] * h, pts[i + 2] * w, pts[i + 3] * h); x.stroke(); };
    vein([0.02, 0.5, 0.3, 0.2, 0.6, 0.16, 0.8, 0.14, 0.95, 0.32], 9, 0.95);      /* costa */
    vein([0.03, 0.5, 0.2, 0.32, 0.4, 0.24], 6, 0.9);                              /* R1 */
    vein([0.04, 0.52, 0.4, 0.34, 0.86, 0.24], 5, 0.85);                           /* R2+3 */
    vein([0.05, 0.53, 0.45, 0.42, 0.96, 0.42], 5, 0.85);                          /* R4+5 */
    vein([0.06, 0.56, 0.42, 0.56, 0.62, 0.6, 0.72, 0.62, 0.74, 0.52, 0.76, 0.42, 0.93, 0.36], 5, 0.85); /* M1 with its bend */
    vein([0.08, 0.6, 0.35, 0.72, 0.5, 0.78], 4.5, 0.8);                            /* CuA */
    vein([0.1, 0.62, 0.18, 0.76, 0.22, 0.86], 4, 0.7);                             /* anal */
    vein([0.3, 0.36, 0.31, 0.44, 0.32, 0.53], 3.5, 0.8); vein([0.5, 0.55, 0.52, 0.66, 0.53, 0.76], 3.5, 0.8);   /* cross veins */
    x.restore();
    outline(); x.strokeStyle = 'rgba(52,40,30,0.7)'; x.lineWidth = 3; x.stroke();
  });

  const mat = {
    thorax: new THREE.MeshPhysicalMaterial({ map: thoraxTex, bumpMap: bumpTex, bumpScale: 1.2, metalness: 0.62, roughness: 0.26, clearcoat: 1, clearcoatRoughness: 0.08,
      iridescence: 0.85, iridescenceIOR: 1.55, iridescenceThicknessRange: [320, 720] }),
    abd: new THREE.MeshPhysicalMaterial({ map: abdTex, bumpMap: bumpTex, bumpScale: 0.9, metalness: 0.66, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.06,
      iridescence: 0.9, iridescenceIOR: 1.6, iridescenceThicknessRange: [300, 760] }),
    eye: new THREE.MeshPhysicalMaterial({ map: eyeCol, normalMap: eyeN, normalScale: new THREE.Vector2(1.6, 1.6), roughness: 0.3, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12, sheen: 0.4, sheenColor: new THREE.Color(0xffb080) }),
    face: new THREE.MeshPhysicalMaterial({ color: 0x4a3020, roughness: 0.5, metalness: 0.3, sheen: 0.55, sheenColor: new THREE.Color(0xc89a62), sheenRoughness: 0.5, bumpMap: bumpTex, bumpScale: 1.0 }),
    dark: new THREE.MeshPhysicalMaterial({ color: 0x2a1e14, roughness: 0.58, metalness: 0.12, clearcoat: 0.25, clearcoatRoughness: 0.45, bumpMap: bumpTex, bumpScale: 1.5 }),
    hair: new THREE.MeshStandardMaterial({ color: 0x1c140e, roughness: 0.42, metalness: 0.1 }),
    wing: new THREE.MeshPhysicalMaterial({ map: wingTex, transparent: true, side: THREE.DoubleSide, depthWrite: false, roughness: 0.08, metalness: 0,
      iridescence: 1.0, iridescenceIOR: 1.35, iridescenceThicknessRange: [180, 620], clearcoat: 1, clearcoatRoughness: 0.03, specularIntensity: 1 }),
    calyp: new THREE.MeshPhysicalMaterial({ color: 0xf4ecd8, roughness: 0.5, transmission: 0.3, thickness: 0.0002 }),
    shadow: null
  };
  Object.values(mat).forEach(m => m && flat(m));

  const S = mm, Y0 = 3.0 * S;   /* body centre height above the perch */
  const ell = (geo, rx, ry, rz, m, x, y, z, parent) => { const e = new THREE.Mesh(geo, m); e.scale.set(rx, ry, rz); e.position.set(x, y, z); (parent || fly).add(e); return e; };
  const sph = new THREE.SphereGeometry(1, 64, 48), sphZ = new THREE.SphereGeometry(1, 64, 48); sphZ.rotateX(Math.PI / 2);
  /* thorax, scutellum, abdomen */
  const thorax = ell(sph, 1.6 * S, 1.4 * S, 1.95 * S, mat.thorax, 0, Y0 + 0.25 * S, 0.5 * S);
  ell(sph, 1.0 * S, 0.55 * S, 0.75 * S, mat.thorax, 0, Y0 + 1.15 * S, -1.25 * S);
  const abd = ell(sphZ, 1.6 * S, 1.15 * S, 2.2 * S, mat.abd, 0, Y0 - 0.25 * S, -2.85 * S); abd.rotation.x = -0.1;
  /* head: a broad face plate, two great eyes, antennae, a short proboscis */
  const HZ = 2.85 * S;
  ell(sph, 0.95 * S, 1.2 * S, 0.7 * S, mat.face, 0, Y0 - 0.1 * S, HZ + 0.35 * S);
  [-1, 1].forEach(sx => { const e = ell(sph, 1.02 * S, 1.36 * S, 0.88 * S, mat.eye, sx * 0.84 * S, Y0 + 0.28 * S, HZ + 0.2 * S); e.rotation.y = sx * 0.42; e.rotation.z = -sx * 0.08; });
  ell(sph, 0.42 * S, 0.3 * S, 0.3 * S, mat.dark, 0, Y0 + 1.45 * S, HZ - 0.05 * S);   /* ocellar bump */
  /* the frontal vitta, a dark stripe down the frons between the eyes, and the darker facial grooves either side */
  ell(sph, 0.22 * S, 0.7 * S, 0.2 * S, mat.dark, 0, Y0 + 0.75 * S, HZ + 0.72 * S).rotation.x = -0.35;
  [-1, 1].forEach(sx => ell(sph, 0.16 * S, 0.62 * S, 0.14 * S, mat.dark, sx * 0.36 * S, Y0 - 0.1 * S, HZ + 0.92 * S));
  const bar = (a, b, r0, r1, m, parent, seg, fl) => { const v = b.clone().sub(a), L = v.length(); const gm = new THREE.CylinderGeometry(r1, r0, L, seg || 10); if (fl) gm.scale(1, 1, fl); const c = new THREE.Mesh(gm, m);
    c.position.copy(a).add(b).multiplyScalar(0.5); c.quaternion.setFromUnitVectors(V(0, 1, 0), v.normalize()); (parent || fly).add(c); return c; };
  /* antennae: scape, pedicel and a long flattened flagellum hanging in the facial groove, each with a feathered arista */
  const labMat = flat(new THREE.MeshPhysicalMaterial({ color: 0x4e2e18, roughness: 0.55, metalness: 0.1, sheen: 0.2, sheenColor: new THREE.Color(0xb08050) }));
  const antMat = flat(new THREE.MeshPhysicalMaterial({ color: 0x5e3418, roughness: 0.5, metalness: 0.15, sheen: 0.4, sheenColor: new THREE.Color(0xc08a50) }));
  const tinyBar = (p0, p1, r, m) => bar(p0, p1, r, r * 0.25, m, null, 4);
  [-1, 1].forEach(sx => {

    const cv = cx.canvas, Wp = cv.width, Hp = cv.height, id = cx.getImageData(0, 0, Wp, Hp), dd = id.data, F = new Float32Array(dd.length);
    for (let i = 0; i < dd.length; i++) F[i] = dd[i];
    const layer = (draw, a) => {
      const oc = document.createElement('canvas'); oc.width = Wp; oc.height = Hp; const ox = oc.getContext('2d'); ox.setTransform(cx.getTransform());
      draw(ox); const m = ox.getImageData(0, 0, Wp, Hp).data;
      for (let i = 0; i < m.length; i += 4) { const al = m[i + 3]; if (!al) continue; const k = a * al / 255;
        F[i] += (m[i] - F[i]) * k; F[i + 1] += (m[i + 1] - F[i + 1]) * k; F[i + 2] += (m[i + 2] - F[i + 2]) * k; } };
    layer(ox => CH.seat(ox, { a: 1, fade: 260 }), 0.5);
    ['.count', '.tx-site'].forEach(sel => layer(ox => CH.seat(ox, { sel, a: 1, fade: 140 }), 0.24));
    layer(ox => CH.seat(ox, { sel: '.src', a: 1, fade: 180 }), 0.5);
    layer(ox => TXLOOK.footWash(ox, { tone: CH.TONE, a: 1, height: 220 }), 0.45);
    let st = 0x9e3779b9 >>> 0; const rnd = () => { st ^= st << 13; st >>>= 0; st ^= st >>> 17; st ^= st << 5; st >>>= 0; return st / 4294967296; };
    for (let i = 0; i < dd.length; i += 4) { const n = (rnd() + rnd() - 1) * 1.5;
      dd[i] = F[i] + n + 0.5 * (rnd() - 0.5); dd[i + 1] = F[i + 1] + n; dd[i + 2] = F[i + 2] + n + 0.5 * (rnd() - 0.5); }
    cx.putImageData(id, 0, 0);
  }
  TXDECK.finish(cx);
  return true;
})();
