      const fm = frames[NS >> 1]; if (fm.S.clone().multiplyScalar(sd).dot(R.camera.position.clone().sub(fm.P)) > 0) return;   /* no guard rail on the near side, so the sheet reads */

  [0.42, 0.74].forEach(t => { const f = frames[Math.round(t * NS)], st = new THREE.Group();

    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.085, 0.022, 40), graphite); base.position.y = 0.011; st.add(base);
    const boss = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.03, 32), graphite); boss.position.y = 0.037; st.add(boss);
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.019, y - 0.05, 28), graphite); col.position.y = 0.05 + (y - 0.05) / 2; st.add(col);
    const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.027, 0.027, 0.03, 28), graphite); collar.position.y = y - 0.02; st.add(collar);
    st.position.set(under.x, 0, under.z); st.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

  { const fe = frames[NS]; if (Math.abs(fe.P.x - DESK[0]) > 0.8 || Math.abs(fe.P.z - DESK[2]) > 0.38) throw new Error('the route does not end over the desk'); }

  { const f = frames[Math.round(0.4 * NS)], PS2 = 1.8;

  TXT.deckRig(R, spec, Object.assign(CH.rigOpts([-0.2, 0.3, -0.3], { distance: 10, shadowFar: 30, normalBias: 0.01 }), { light: { az: -125, el: 70 } }));
  CH.unacne(R, 0.01);

  const cx = CH.develop(await TXT.snapshot(R), gl);

  { const rd = CH.rectOf(THREE, R, desk, 0), re = CH.rectOf(THREE, R, eng, 0);
    window.__s09 = { desk: rd.map(Math.round), eng: re.map(Math.round) }; }

  ['.kick', '.count', '.src', '.tx-site'].forEach(sel => CH.seat(cx, { sel, a: 0.45, fade: 70 }));
