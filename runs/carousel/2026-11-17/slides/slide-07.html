    const pm = new THREE.PMREMGenerator(R.renderer); R.scene.environment = pm.fromScene(env, 0.02).texture; pm.dispose();

    gcard(16, 10, '#fff6e6', 5.0, [-10, 10, 6]); gcard(34, 7, '#fff4e0', 4.0, [0, 2.0, 12]); gcard(30, 3, '#3a3040', 1.0, [0, -3, 12]);

  const fibre = (seed, base) => CH.canvasTex(THREE, 512, 512, (c, w, h) => { const r = CH.rng(seed); c.fillStyle = base; c.fillRect(0, 0, w, h);
      for (let i = 0; i < 5000; i++) { const a = r() * Math.PI, L = 3 + r() * 12, x = r() * w, y = r() * h; c.strokeStyle = 'rgba(' + (r() < 0.5 ? '150,120,90' : '255,250,240') + ',' + (0.04 + r() * 0.08).toFixed(3) + ')'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); c.stroke(); } });

  const SW = 0.279, SD = 0.216, GPULL_MAX = 0.03, FOV = 14, ROLL = 0.30;

    [-SW / 2 - 0.004, SW / 2 + 0.004].forEach(x => [0, H].forEach(y => [-SD / 2 - 0.006, SD / 2 + GPULL_MAX + 0.006].forEach(z => c.push([x, y, z])))); return c; };
  const hull = (Pt) => { Pt = Pt.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]); const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

    lo.pop(); up.pop(); return lo.concat(up); };

  }

  /* THE STACK, built at the solved pitch. Every sheet jogged by hand within a millimetre, a gentle fan leaning the upper
   * sheets forward, and the one gilt sheet pulled GPULL out of the fore edge and turned a hair, its edge, bead and the proud
   * strip of its face in satin dusk gold. */
  const stack = new THREE.Group(), rnd = CH.rng(20261107), LEAN = 0.0025;
  let giltDrawn = 0, sheets = 0;
  for (let i = 0; i < PAGES; i++) {
    const gilt = i === GILT_AT; if (gilt) giltDrawn++;
    const em = (i % 2 || rnd() < 0.2) ? edgeB : edgeA;
    const m = new THREE.Mesh(new THREE.BoxGeometry(SW, P * 0.94, SD), [em, em, i === PAGES - 1 ? topM : em, em, gilt ? giltM : em, em]);
    const y = i * P + P / 2, dx = (rnd() - 0.5) * 0.0016, dz = (rnd() - 0.5) * 0.0009 + LEAN * i / PAGES + (gilt ? GPULL : 0);
    m.position.set(dx, y, dz); m.rotation.y = gilt ? 0.012 : (rnd() - 0.5) * 0.004; m.userData.txBevel = false; m.userData.sheet = true; stack.add(m); sheets++;
    m.castShadow = true; m.receiveShadow = i === PAGES - 1;
    if (gilt) {
      const bead = new THREE.Mesh(new THREE.CylinderGeometry(P * 0.5, P * 0.5, SW, 24), giltM); bead.rotation.set(0, m.rotation.y, Math.PI / 2, 'YXZ'); bead.position.set(dx, y, dz + SD / 2); bead.userData.txBevel = false; stack.add(bead);
      const strip = new THREE.Mesh(new THREE.BoxGeometry(SW, P * 0.12, GPULL + 0.002), giltM); strip.rotation.y = m.rotation.y; strip.position.set(dx, y + P * 0.5, dz + SD / 2 - (GPULL + 0.002) / 2); strip.userData.txBevel = false; stack.add(strip);
    }
  }
  if (sheets !== PAGES || stack.children.filter(o => o.userData.sheet).length !== FIG.changed_one_in) throw new Error('the stack does not hold FIG.changed_one_in sheets');
  if (giltDrawn !== 1) throw new Error('drew ' + giltDrawn + ' gilt edges, the dek says one');
  TXT.add(R, stack);
  TXT.contact(R, stack);
  { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
    g.filter = 'blur(6px)'; g.fillStyle = 'rgba(36,18,78,0.8)'; g.fillRect(256 - 512 * SW / (SW + 0.008) / 2, 256 - 512 * SD / (SD + 0.008) / 2, 512 * SW / (SW + 0.008), 512 * SD / (SD + 0.008));
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }); m.userData.txSurface = false;
    const q = new THREE.Mesh(new THREE.PlaneGeometry(SW + 0.008, SD + 0.008), m); q.rotation.x = -Math.PI / 2; q.position.set(0, 0.0008, 0); q.userData.txSurface = false; q.userData.txBevel = false; R.scene.add(q); }
  const focusW = new THREE.Vector3(0, yG, SD / 2 + GPULL);
  window.__s07 = Object.assign({ pages: PAGES, gilt_at: GILT_AT, gilt_px: giltPx, gpull_mm: +(GPULL * 1000).toFixed(1) }, fit);

  /* THE KEY: cool, raking from the left along the fore edge and a little above, so the proud gilt takes the hot line */
  CH.KEY_SCALE = 0.6; const spec = CH.rigSpec(W, 0.9, 4096);
  spec.key = Object.assign({}, spec.key, { radius: 0.5, color: 0xf6f2ff });
  TXT.deckRig(R, spec, Object.assign(CH.rigOpts([0, H / 2, 0], { distance: 4, shadowFar: 10, normalBias: 0.0003 }), { light: { az: -100, el: 22 } }));
  CH.unacne(R, 0.0003);

  const cx = CH.develop(await TXT.snapshot(R), gl);

  {
    const dN = 0.05, dF = 8.0, dFocus = R.camera.position.distanceTo(focusW), A = 90;
    const depthMat = new THREE.ShaderMaterial({ uniforms: { uN: { value: dN }, uF: { value: dF } },
      vertexShader: 'varying float vD; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vD = length(mv.xyz); gl_Position = projectionMatrix * mv; }',

    const bg = R.scene.background, tm = R.renderer.toneMapping, sweep = R.studio.sweep;
    sweep.visible = false; R.scene.background = new THREE.Color(1, 1, 1); R.scene.overrideMaterial = depthMat; R.renderer.toneMapping = THREE.NoToneMapping;
    R.renderer.render(R.scene, R.camera);
    const W2 = 2160, H2 = 2700, dc = document.createElement('canvas'); dc.width = W2; dc.height = H2; const dg = dc.getContext('2d');
    dg.drawImage(gl, 0, 0, W2, H2);
    R.scene.overrideMaterial = null; R.scene.background = bg; R.renderer.toneMapping = tm; sweep.visible = true;
    const dd = dg.getImageData(0, 0, W2, H2).data;
    const LV = [0, 2, 4.5, 8, 13];
    const base = document.createElement('canvas'); base.width = W2; base.height = H2; const bgc = base.getContext('2d'); bgc.drawImage(cx.canvas, 0, 0);
    const lv = LV.map(b => { if (!b) return bgc.getImageData(0, 0, W2, H2).data; const c = document.createElement('canvas'); c.width = W2; c.height = H2; const g = c.getContext('2d'); g.filter = 'blur(' + b + 'px)'; g.drawImage(base, 0, 0); return g.getImageData(0, 0, W2, H2).data; });
    const out = bgc.getImageData(0, 0, W2, H2), o = out.data;
    for (let p = 0, n = W2 * H2; p < n; p++) {
      const v = dd[p * 4]; if (v >= 254) continue;
      const d = dN + ((v + dd[p * 4 + 1] / 255) / 254) * (dF - dN);
      const coc = Math.min(LV[LV.length - 1], A * Math.abs(d - dFocus) / d);
      let k = 0; while (k < LV.length - 2 && coc > LV[k + 1]) k++;
      const t = Math.min(1, Math.max(0, (coc - LV[k]) / (LV[k + 1] - LV[k]))), a = lv[k], b = lv[k + 1], q = p * 4;
      o[q] = a[q] + (b[q] - a[q]) * t; o[q + 1] = a[q + 1] + (b[q + 1] - a[q + 1]) * t; o[q + 2] = a[q + 2] + (b[q + 2] - a[q + 2]) * t;
    }
    cx.save(); cx.setTransform(1, 0, 0, 1, 0, 0); cx.putImageData(out, 0, 0); cx.restore();
  }

  placeDek();
  CH.seat(cx, { sel: '#hook', a: 0.22, fade: 140 });
  CH.seat(cx, { sel: '#dek', a: 0.36, fade: 120 });
  ['.kick', '.count'].forEach(sel => CH.seat(cx, { sel, a: 0.16, fade: 50 }));
  TXLOOK.footWash(cx, { a: 0.6, height: 200 });
  TXDECK.finish(cx, { bloom: { threshold: 0.92, strength: 0.05, radius: 5 } });
  return true;
})();
