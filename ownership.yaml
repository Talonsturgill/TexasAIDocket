# ownership.yaml — who is allowed to write what.
#
# WHY THIS FILE EXISTS
# Alaska ran one automation per repo and kept them apart with prose rules in CLAUDE.md
# ("the gas watch numbers are not yours", "these six files are off limits"). That worked
# because the boundary was also a repo boundary. This repo runs the carousel routine, the
# grid watch collector and the ask lane together, and every one of them ends in a phase whose
# entire job is editing its own machine. A prose rule is not a boundary against a process
# whose job is to edit files. This map is, because it is checked.
#
# HOW IT IS READ
# Rules are evaluated in order and the LAST matching rule wins, exactly like .gitignore.
# Put broad defaults at the top and specific carve-outs below them.
#
# HOW IT IS ENFORCED
#   scripts/shared/ownership_check.py --actor <actor> --diff <git range>
#   .githooks/pre-commit          reads the actor stamp at .git/ACTOR
#   .github/workflows/guards.yml  infers the actor from the branch prefix
#
# FLAGS
#   owner        the one actor allowed to write this path
#   generated    output, never hand-edited; must be reproducible from committed inputs
#   rebuild_by   actors allowed to REGENERATE a generated path (they may not hand-edit it)
#   append_only  existing lines may not be modified or deleted, only appended to
#   note         why the rule exists, for whoever trips it at 3am

version: 1

actors:
  daily:     The one daily routine. Re-verifies and admits the record, then ships the deck.
  upgrade:   The retro phase's narrow lane. The machine only, never the record. See below.
  gridwatch: The ERCOT Grid Watch collector. Runs on cron, never as a routine phase.
  ask:       The ask box's archive lane routine. Fires on API trigger.
  dispatch:  The video routine, which lives in TexasAIDispatch and reaches in for one file.
  human:     A maintainer session. Owns anything an unattended run must never rewrite.

# WHY `daily` AND NOT `docket` PLUS `carousel` (2026-08-12)
# The record and the deck were two routines and are one now. Two actors for one process is a
# fiction the checker cannot enforce: the process stamps one name and then needs the other's
# lane, so the first thing it learns is that the stamp is negotiable. One process, one actor.
#
# The merge does widen one thing, and `upgrade` is the answer to it. Phase 17's whole job is
# editing the machine. While the carousel was its own actor, that phase could not reach
# `ledger/docket.json` because the carousel simply did not own it, and the separation cost
# nothing to maintain because it was a side effect of the split. Merged, that protection is
# gone unless it is stated. So the phase stamps `upgrade` before it runs and `daily` after,
# and `upgrade` owns the machine's own files and nothing else. A self-editing phase should
# never be able to edit the public record, and now it still cannot.

# Branch prefix to actor, used by CI when no explicit actor is passed.
branch_actors:
  "claude/daily-":    daily
  "claude/dispatch-": dispatch
  "gridwatch/":       gridwatch
  "claude/ask-":      ask

rules:

  # ---------------------------------------------------------------- default
  # Anything not named below belongs to a maintainer. A routine that wants to touch
  # something unlisted is doing something nobody designed, and should stop and say so.
  - path: "**"
    owner: human

  # ---------------------------------------------------------------- the constitution
  # No automation edits its own law, its own ownership map, or its own permissions.
  # This is the rule that makes every other rule hold.
  - path: "CLAUDE.md"
    owner: human
  - path: "ownership.yaml"
    owner: human
  - path: ".claude/settings.json"
    owner: human
  - path: ".githooks/**"
    owner: human
  - path: ".github/workflows/**"
    owner: human
    note: >
      A run that can edit its own CI can switch off the gate that judges it. Workflow
      changes go through a maintainer session.

  # ---------------------------------------------------------------- shared identity
  - path: "config/brand.yaml"
    owner: human
    note: >
      One Texas voice across every surface. If the carousel could edit this, a caption-level
      tweak would silently restyle the video and the website too.
  - path: "knowledge/shared/**"
    owner: human
  - path: "assets/**"
    owner: human

  # ---------------------------------------------------------------- the public record
  - path: "ledger/docket.json"
    owner: daily
    note: >
      Maintained in the daily routine's re-verify and admit phases. Items are never deleted,
      and history is append-only within each item.
  - path: "seed/**"
    owner: daily
    note: >
      Candidate items awaiting a primary source. The routine writes here freely; nothing
      published comes from here until docket_build.py admits it.
  - path: "ledger/alerts.json"
    owner: daily
    note: The no-repeat ledger for subscriber emails. Never reused by the grid watch.

  # ---------------------------------------------------------------- what the RUN writes
  # Split from the machine's own files below, by the plain test of who actually writes it.
  # A run writes its output. The retro phase writes the machine. They barely overlap, so
  # nothing is lost by keeping them apart and a self-editing phase is kept off the record.
  - path: "ledger/carousel/**"
    owner: daily
    note: The variety ledgers, written at ship so tomorrow cannot repeat today.
  - path: "runs/carousel/**"
    owner: daily

  # ---------------------------------------------------------------- the machine's own files
  # Written by Phase 17 and by nothing else. The routine RUNS these every day; it does not
  # edit them mid-run, and a run that rewrites the engine it is currently executing is how a
  # machine drifts without anyone noticing.
  - path: "scripts/carousel/**"
    owner: upgrade
  - path: "config/carousel/**"
    owner: upgrade
  - path: "knowledge/carousel/**"
    owner: upgrade
  - path: ".claude/agents/carousel-*.md"
    owner: upgrade
  - path: ".claude/skills/carousel-engine/**"
    owner: upgrade
  - path: "ledger/carousel/upgrades.json"
    owner: upgrade
    append_only: true
    note: >
      The automation-change trail, surfaced in every dated email. Append only, because an
      upgrade that can edit its own history can hide one.
  - path: "prompts/daily_routine.md"
    owner: human
    note: >
      The retro may PROPOSE changes to its own prompt, but a run rewriting the instructions it
      is currently executing is how a machine drifts without anyone noticing.

  # ---------------------------------------------------------------- grid watch
  # The tightest lane in the repo. CINGSA taught Alaska that a series you cannot backfill is
  # worth more protection than the code that reads it; ERCOT is the same, its dashboard API
  # publishes a rolling window and keeps no archive.
  - path: "scripts/gridwatch/**"
    owner: gridwatch
  - path: "config/gridwatch/**"
    owner: gridwatch
    note: >
      Model coefficients live here as data so a refit is a data change with its own commit
      and never a code change.
  - path: "ledger/gridwatch/*.jsonl"
    owner: gridwatch
    append_only: true
    note: >
      One line per day, written by the cron. A run that rewrites a past line corrupts a
      series nobody can rebuild. Append only, forever.

  # THE ONE SERIES HERE THAT IS NOT IRREPLACEABLE, and the append-only rule is lifted from it
  # deliberately rather than by oversight.
  #
  # Read the rule above and notice what it actually protects: "a series nobody can rebuild."
  # That is the entire justification, and it is true of ERCOT, whose dashboard keeps no
  # archive, and of the reservoir feed, whose own publisher asks crawlers not to take the file
  # holding the history. It is NOT true here. This series comes from NCEI daily summaries,
  # which IS the archive: any station, any date range, back to the nineteenth century, keyless
  # and public domain. Every line can be re-derived from the source on demand.
  #
  # So a rewrite here is a re-derivation and not a loss, and holding this file append-only
  # bought no protection while blocking an ordinary change: adding precipitation to a record
  # that already held temperature meant every existing line needed a field it did not have.
  #
  # This is a NARROWING, not a loosening. The glob above now names two irreplaceable series
  # instead of covering three files and meaning it for two, so the protection on the ones that
  # need it is stated rather than inherited. If a future series is added here that cannot be
  # refetched, it falls under the glob and is protected by default. That is the right default.
  - path: "ledger/gridwatch/weather.jsonl"
    owner: gridwatch
    append_only: false
  - path: "ledger/gridwatch/raw/**"
    owner: gridwatch
    append_only: true
    note: >
      The raw ERCOT responses, gzipped, snapshotted BEFORE anything parses them. This is the
      only route back if a parser turns out to have been wrong, because ERCOT keeps no
      archive to refetch from. One file per feed per day, written once and never revised.

  # ---------------------------------------------------------------- the site: THE GATES
  # A routine that can edit the gate that judges it has no gate.
  #
  # This rule used to appear TWICE, and the second one carried `rebuild_by: [carousel,
  # gridwatch]`. Last match wins, so the strict rule was dead and the carousel held write
  # access to site_build.py, house_style_check.py and docket_build.py: every gate that judges
  # it. Nothing warned, because a repealed rule still reads correctly in the file. `--self-test`
  # now proves every rule still answers for its own namesake path, so a shadowed rule is a red
  # gate rather than a comment. It found a second one the moment it was switched on.
  #
  # rebuild_by does NOT belong here. It grants full write, not "allowed to run it", which is
  # what the old note claimed it meant. Running a script needs no permission at all. Only
  # committing its OUTPUT does, and that output is docs/, which grants it below.
  #
  # ORDER MATTERS AND IT IS THE BROAD RULE FIRST. Every carve-out under scripts/site/ lives
  # below this line. Put one above it and this rule is dead again.
  - path: "scripts/site/**"
    owner: human
  - path: "scripts/shared/**"
    owner: human

  # Carve-outs, each naming ONE file. A glob here would hand back the gates the rule above
  # just took away.
  - path: "scripts/site/ask_*.py"
    owner: human
    note: The answer engine is a gate on what the site may claim. Maintainer-owned.
  - path: "scripts/site/gridwatch_page.py"
    owner: human
    rebuild_by: [daily]
    note: Presentation only. The collectors, the model config and the ledgers stay off limits.
  - path: "scripts/site/waterwatch_page.py"
    owner: human
    rebuild_by: [daily]
    note: Presentation only, same terms as the grid watch page.

  # ---------------------------------------------------------------- ask lane
  - path: "workers/ask/**"
    owner: ask
  - path: "prompts/ask_routine.md"
    owner: human

  - path: "docs/**"
    generated: true
    rebuild_by: [daily, gridwatch, human]
    note: >
      A pure deterministic function of the ledgers. site_fresh_check.py rebuilds into a temp
      dir and proves byte equality, which is what makes it impossible for a run to corrupt
      the live site by hand. Regenerate it; never edit it.

  # ---------------------------------------------------------------- hard guards
  - path: "docs/videos/videos.json"
    owner: dispatch
    append_only: true
    note: >
      EXTERNAL DATA. Owned by the publish step in TexasAIDispatch, which prepends one entry
      per shipped video. No build in this repo may write, reformat, or delete it, and
      site_build copies it through verbatim.
  - path: "docs/videos/index.html"
    owner: human
    rebuild_by: [daily, gridwatch]
    note: >
      GENERATED, and this rule changed on 2026-08-13. It was written as a hand-built static
      passthrough, copied verbatim and never regenerated, which is how the sibling product
      does it. That is the wrong trade here. A standalone page carries its own copy of the
      masthead, and this site's masthead changed twice in one afternoon. A hand-maintained
      nav does not fail loudly; it keeps pointing at a tab that no longer exists, on the one
      page nothing regenerates. The shell is built by site_build like every other page and
      only the FEED is external.
  - path: "vendor/**"
    owner: human
    note: >
      Vendored copies of another repo's contract, kept for checking only and never served.
      Updated deliberately by a maintainer when the upstream contract moves.
