# ownership.yaml — who is allowed to write what.
#
# WHY THIS FILE EXISTS
# Alaska ran one automation per repo and kept them apart with prose rules in CLAUDE.md
# ("the gas watch numbers are not yours", "these six files are off limits"). That worked
# because the boundary was also a repo boundary. This repo runs the carousel routine, the
# grid watch collector and the ask lane together, and every one of them ends in a phase whose
# entire job is editing its own machine. A prose rule is not a boundary against a process
# whose job is to edit files. This map is, because it is checked.
#
# HOW IT IS READ
# Rules are evaluated in order and the LAST matching rule wins, exactly like .gitignore.
# Put broad defaults at the top and specific carve-outs below them.
#
# HOW IT IS ENFORCED
#   scripts/shared/ownership_check.py --actor <actor> --diff <git range>
#   .githooks/pre-commit          reads the actor stamp at .git/ACTOR
#   .github/workflows/guards.yml  infers the actor from the branch prefix
#
# FLAGS
#   owner        the one actor allowed to write this path
#   generated    output, never hand-edited; must be reproducible from committed inputs
#   rebuild_by   actors allowed to REGENERATE a generated path (they may not hand-edit it)
#   append_only  existing lines may not be modified or deleted, only appended to
#   note         why the rule exists, for whoever trips it at 3am

version: 1

actors:
  daily:     The one daily routine. Re-verifies and admits the record, then ships the deck.
  upgrade:   The retro phase's narrow lane. The machine only, never the record. See below.
  gridwatch: The ERCOT Grid Watch collector. Runs on cron, never as a routine phase.
  ask:       The ask box's archive lane routine. Fires on API trigger.
  dispatch:  The video routine, which lives in TexasAIDispatch and reaches in for one file.
  human:     A maintainer session. Owns anything an unattended run must never rewrite.

# WHY `daily` AND NOT `docket` PLUS `carousel` (2026-08-12)
# The record and the deck were two routines and are one now. Two actors for one process is a
# fiction the checker cannot enforce: the process stamps one name and then needs the other's
# lane, so the first thing it learns is that the stamp is negotiable. One process, one actor.
#
# The merge does widen one thing, and `upgrade` is the answer to it. Phase 17's whole job is
# editing the machine. While the carousel was its own actor, that phase could not reach
# `ledger/docket.json` because the carousel simply did not own it, and the separation cost
# nothing to maintain because it was a side effect of the split. Merged, that protection is
# gone unless it is stated. So the phase stamps `upgrade` before it runs and `daily` after,
# and `upgrade` owns the machine's own files and nothing else. A self-editing phase should
# never be able to edit the public record, and now it still cannot.

# Branch prefix to actor, used by CI when no explicit actor is passed.
# A branch prefix names the actor its commits are judged against by default. A branch matching
# no prefix is a maintainer session, which owns every path.
branch_actors:
  "claude/daily-":    daily
  "claude/dispatch-": dispatch
  "gridwatch/":       gridwatch
  "claude/ask-":      ask
  "claude/upgrade-":  upgrade

# THE EXTRA LANES A BRANCH MAY CARRY, and the reason this key exists at all.
#
# A lane is scoped to a COMMIT, not to a branch. The pre-commit hook always worked that way,
# reading the stamp in .git/ACTOR, and CI did not: it pinned one actor from the prefix and
# checked the whole branch diff. The daily routine's Phase 17 stamps `upgrade` and commits, on
# the only branch Phase 16 gives it, so obeying the routine produced a branch CI was built to
# reject. The first run to ship a deck hit exactly that and had to route two commits around it.
#
# CI now walks commit by commit and reads each commit's `Actor:` trailer, written by
# .githooks/commit-msg from the same stamp. This key is the bound on that: it says which actors
# a prefix is allowed to stamp, so the trailer widens what a branch can do only as far as the
# map already agreed to.
#
# `human` may NEVER appear here. It owns every path, so a routine able to stamp it would be a
# routine that switched the map off from inside a commit message. `actors_allowed_on_branch`
# drops it rather than trusting this comment to be obeyed.
branch_also_allows:
  # `human` is here on the owner's instruction, 2026-08-30, and it is a real grant rather than a
  # formality, so it is worth knowing what it does before anybody widens it.
  #
  # A commit stamped `Actor: human` owns EVERY path, this file and `.github/workflows/**`
  # included. The checker used to refuse that stamp on a routine branch no matter what the map
  # said. The rule was right about the risk and wrong about where the decision lives: it stopped
  # unattended runs seven times in eleven days, every time on a file the run had itself broken,
  # and a hardcoded refusal is one no map edit can answer at 3am with nobody watching. A run that
  # halts on a permission it cannot resolve has failed at the one thing it is for.
  #
  # The protection that mattered is intact. A routine still cannot declare itself `human` out of
  # thin air, because the grant lives in a file the routine does not own. What changed is that
  # the grant now exists and is written down here.
  #
  # A run that uses it should say so in its run record, and the per commit report names every
  # commit that did.
  "claude/daily-": [upgrade, human]   # Phase 17 edits the machine. `human` is the escape hatch.

rules:

  # ---------------------------------------------------------------- default
  # Anything not named below belongs to a maintainer. A routine that wants to touch
  # something unlisted is doing something nobody designed, and should stop and say so.
  - path: "**"
    owner: human

  # ---------------------------------------------------------------- the constitution
  # No automation edits its own law, its own ownership map, or its own permissions.
  # This is the rule that makes every other rule hold.
  - path: "CLAUDE.md"
    owner: human
  - path: "ownership.yaml"
    owner: human
  - path: ".claude/settings.json"
    owner: human
    note: >
      It STAYS human, and 2026-08-20 is the day that was tested rather than assumed. An
      unattended run stopped twice for approval, the owner told the session to fix it directly,
      and the session could not do it from the run: the file it needed is the one file the
      constitution keeps out of an automation's reach, and so is this map, so a run cannot even
      grant itself the reach. That is the rule working rather than a gap in it. The change was
      made on a branch matching no prefix, which `actors_allowed_on_branch` treats as a
      maintainer session, on the owner's instruction and with the reason written into the file.
      Worth knowing before the next session goes looking here. What was asking was the Bash
      SANDBOX and not the permission mode, which had been correct for nine days, and the cure was
      a rule about where scratch files go rather than a broader permission. See CLAUDE.md.
  - path: ".githooks/**"
    owner: human
  - path: ".github/workflows/**"
    owner: human
    note: >
      A run that can edit its own CI can switch off the gate that judges it. Workflow
      changes go through a maintainer session.

  # ---------------------------------------------------------------- the run's own plan
  #
  # A WORKLOG IS NEVER `human`. Owner's instruction, 2026-09-03, in their words: "i have NOTHING
  # to do with worklog.md that is not human owned EVER". It is a routine's own plan, a maintainer
  # neither reads it nor writes it, and the one time this map said otherwise it cost five
  # interrupted runs.
  #
  # THE GLOB IS NOT `**/WORKLOG.md`, AND THE FIRST DRAFT OF THIS RULE WAS. Last match wins here,
  # so a `**` worklog glob sitting below the constitution reached back INTO `.claude/` and handed
  # `daily` the exact write this whole change exists to stop. A review caught it before it
  # merged. The addresses are named one by one instead, so widening ownership can never quietly
  # widen the gated directory with it.
  #
  # Nothing under `.claude/` is on this list, deliberately. A file there is not a worklog that
  # needs an owner, it is a file that must not exist: `protected_path_shape.py` fails the build
  # if any instruction file so much as names it, and it falls to the `human` default so the
  # pre-commit hook refuses a routine that creates one anyway. Two mechanisms, because the first
  # draft of this rule proved one is not enough.
  - path: "runs/**/WORKLOG.md"
    owner: daily
    note: >
      The worklogs archived inside already-shipped run records. They are history rather than a
      live plan, and they stay `daily` because the run that wrote them owned them.
  - path: "WORKLOG.md"
    owner: daily
    note: >
      The durable plan a long run keeps across context compaction. It lived at
      `.claude/WORKLOG.md` until 2026-09-03 and it was wrong there twice over, which is why it
      is named here rather than left to the `**` default.

      It was in the WRONG LANE. `.claude/` is the constitution's own directory and everything
      in it that this map names is `human` or `upgrade`, so the one file the daily routine was
      told to write on every long run was the one directory an unattended run must never
      rewrite. Nothing caught it because the `**` default is `human` and a run that never
      COMMITS the file never meets the pre-commit hook.

      It was also in a directory the HARNESS gates. A write under `.claude/` asks a human for
      approval whatever the permission mode says, because that directory carries the settings
      and hooks defining the agent's own permissions, exactly as `.git/` carries hooks that
      execute. Five scheduled runs stopped on it and the owner was interrupted every one of
      them. CLAUDE.md carries the full account under the heading about protected directories.

      So it moved to the repository root, which is an ordinary tracked path in the `daily`
      lane, and `scripts/shared/protected_path_shape.py` fails the build if any instruction
      file sends a run back into `.claude/` or `.git/` with a write.

  # ---------------------------------------------------------------- shared identity
  - path: "config/schema_contract.json"
    owner: human
    note: >
      The shape docket.json promises its readers, and the reason it is human's rather than
      daily's. A routine adds ITEMS and never FIELDS, so this will not block a run. When the
      shape does move it is a change to a public contract published under CC BY, and a person
      deciding whether it breaks anybody is exactly the friction that belongs there. A
      contract the process that changes the data can also rewrite is not a contract.
  - path: "config/brand.yaml"
    owner: human
    note: >
      One Texas voice across every surface. If the carousel could edit this, a caption-level
      tweak would silently restyle the video and the website too.
  - path: "knowledge/shared/**"
    owner: human

  # THE ONE FILE IN knowledge/shared A RUN MAY WRITE, and the reason it is a separate file.
  #
  # Phase 17 tells a run that a source which behaved differently than SOURCES_REGISTRY.md
  # describes is knowledge the next run needs. The map refused that write, so until 2026-08-16
  # the routine and the map contradicted each other and a run's four source findings survived
  # only because it wrote them longhand into its run record and a maintainer pasted them across.
  #
  # The registry itself does NOT open, and must not. It carries the crawl boundary, the list of
  # hosts this project has decided not to fetch. A run able to edit its own boundary does not
  # have one: it could delete a disallow and the next fetch would be compliant with a file it
  # had just rewritten.
  #
  # So observation is split from law. A run appends what it SAW here. A maintainer decides what
  # is durable and folds it up into the registry. append_only is what makes that safe, because
  # the risk was never a run adding a note, it was a run removing a restriction.
  - path: "knowledge/shared/SOURCES_FIELD_LOG.md"
    owner: daily
    append_only: true
    note: >
      What a run observed about a source, as opposed to what the project has decided about it.
      A run may only ADD. The registry beside it stays human owned because it carries the
      disallow list, and an unattended run that can edit its own crawl boundary does not have
      one.
  - path: "assets/**"
    owner: human

  # ONE DERIVED FILE UNDER assets/, NAMED RATHER THAN GLOBBED, AND HERE IS WHY.
  #
  # `tx-reservoirs.json` is where each reservoir's gauge sits, and it is a pure function of
  # `ledger/gridwatch/raw/**`, which the collector already owns and already writes. It is under
  # `assets/` because it is committed geodata rather than a time series, not because a person
  # authored it. Nobody types a coordinate into it.
  #
  # THE HOLE THIS CLOSES. The day TWDB adds a reservoir, the collector writes the payload, the
  # water map skips the new lake because it has no pin, and the reproducibility check goes RED
  # ON MAIN. Every actor that could fix it is locked out, because `assets/**` is human owned,
  # so a site with no humans in it stays red and stays a pin short until somebody notices.
  # That is precisely the dependency this project calls its worst failure, one level down from
  # a missed reading.
  #
  # WHAT THIS DOES NOT WIDEN. It is one path, not a glob, so the fonts, the art and the county
  # topology stay human owned. The builder refuses a coordinate that DISAGREES with the record
  # rather than picking a side, so the collector can add a gauge and can never move one, which
  # is the property that makes handing it over safe.
  - path: "assets/geo/tx-reservoirs.json"
    owner: gridwatch
    note: >
      Derived from the collector's own raw archive by scripts/shared/reservoirs.py. Owned by
      the collector so a new reservoir gets a pin without a person, and refused rather than
      resolved when a position disagrees with the one on file.

  # ---------------------------------------------------------------- the public record
  # THE RESEARCHED DOSSIERS. Hand research, one facility at a time, each fact carrying the
  # source it was read from. This is `human` for the same reason the docket is: a self editing
  # routine that could rewrite a researched fact could quietly replace a sourced figure with a
  # generated one, and nothing downstream would know. The registry it annotates stays
  # `gridwatch`, so the collector and the research can never overwrite each other.
  - path: "ledger/facilities/**"
    owner: human
    note: >
      Researched facility dossiers. No routine may write these. Numbers live in fact fields
      with a source id, never in prose, which scripts/site/facility_dossier.py enforces.

  - path: "ledger/reverify.json"
    owner: daily
    note: >
      The re-verification cache. One row per source url holding its ETag, Last-Modified and
      body hash, so the next run asks whether a page changed rather than downloading it again.
      It carries no claim, no quote and no reader copy, only what a conditional request needs.
      Owned by daily because the routine writes it, and COMMITTED because a cache a container
      throws away is a slower first request wearing a cache's name.

  - path: "ledger/docket.json"
    owner: daily
    note: >
      Maintained in the daily routine's re-verify and admit phases. Items are never deleted,
      and history is append-only within each item.
  - path: "seed/**"
    owner: daily
    note: >
      Candidate items awaiting a primary source. The routine writes here freely; nothing
      published comes from here until docket_build.py admits it.
  - path: "ledger/alerts.json"
    owner: daily
    note: The no-repeat ledger for subscriber emails. Never reused by the grid watch.

  # ---------------------------------------------------------------- what the RUN writes
  # Split from the machine's own files below, by the plain test of who actually writes it.
  # A run writes its output. The retro phase writes the machine. They barely overlap, so
  # nothing is lost by keeping them apart and a self-editing phase is kept off the record.
  - path: "ledger/carousel/**"
    owner: daily
    note: The variety ledgers, written at ship so tomorrow cannot repeat today.
  - path: "runs/carousel/**"
    owner: daily

  # ---------------------------------------------------------------- the machine's own files
  # Written by Phase 17 and by nothing else. The routine RUNS these every day; it does not
  # edit them mid-run, and a run that rewrites the engine it is currently executing is how a
  # machine drifts without anyone noticing.
  - path: "scripts/carousel/**"
    owner: upgrade
  - path: "config/carousel/**"
    owner: upgrade
  - path: "knowledge/carousel/**"
    owner: upgrade
  - path: ".claude/agents/carousel-*.md"
    owner: upgrade
  - path: ".claude/skills/carousel-engine/**"
    owner: upgrade
  - path: "ledger/carousel/upgrades.json"
    owner: upgrade
    append_only: true
    note: >
      The automation-change trail, surfaced in every dated email. Append only, because an
      upgrade that can edit its own history can hide one.
  - path: "prompts/daily_routine.md"
    owner: human
    note: >
      The retro may PROPOSE changes to its own prompt, but a run rewriting the instructions it
      is currently executing is how a machine drifts without anyone noticing.

  # ---------------------------------------------------------------- grid watch
  # The tightest lane in the repo. CINGSA taught Alaska that a series you cannot backfill is
  # worth more protection than the code that reads it; ERCOT is the same, its dashboard API
  # publishes a rolling window and keeps no archive.
  - path: "scripts/gridwatch/**"
    owner: gridwatch
  - path: "config/gridwatch/**"
    owner: gridwatch
    note: >
      Model coefficients live here as data so a refit is a data change with its own commit
      and never a code change.
  - path: "ledger/gridwatch/*.jsonl"
    owner: gridwatch
    append_only: true
    note: >
      One line per day, written by the cron. A run that rewrites a past line corrupts a
      series nobody can rebuild. Append only, forever.

  # THE ONE SERIES HERE THAT IS NOT IRREPLACEABLE, and the append-only rule is lifted from it
  # deliberately rather than by oversight.
  #
  # Read the rule above and notice what it actually protects: "a series nobody can rebuild."
  # That is the entire justification, and it is true of ERCOT, whose dashboard keeps no
  # archive, and of the reservoir feed, whose own publisher asks crawlers not to take the file
  # holding the history. It is NOT true here. This series comes from NCEI daily summaries,
  # which IS the archive: any station, any date range, back to the nineteenth century, keyless
  # and public domain. Every line can be re-derived from the source on demand.
  #
  # So a rewrite here is a re-derivation and not a loss, and holding this file append-only
  # bought no protection while blocking an ordinary change: adding precipitation to a record
  # that already held temperature meant every existing line needed a field it did not have.
  #
  # This is a NARROWING, not a loosening. The glob above now names two irreplaceable series
  # instead of covering three files and meaning it for two, so the protection on the ones that
  # need it is stated rather than inherited. If a future series is added here that cannot be
  # refetched, it falls under the glob and is protected by default. That is the right default.
  - path: "ledger/gridwatch/weather.jsonl"
    owner: gridwatch
    append_only: false

  # THE ONE FILE ITS OWN COLLECTOR COULD NOT WRITE, and it took the cron down every day.
  #
  # The glob above says `*.jsonl`, and every other collector here writes only a jsonl, so the
  # glob covered every one of them and read as if it covered the directory. The data center
  # collector is the exception. It writes the whole roster as `datacenters.json` beside the
  # counts-only `datacenters.jsonl`, because the roster is 149 rows that are REVISED rather
  # than appended and a series of full rosters would be most of a megabyte a week.
  #
  # So this single path fell through the glob to the `**` default, which is `human`, and
  # `ownership_check --actor gridwatch --staged` rejected the collector's own output. The
  # workflow's `git add` line names the file first. Nothing else in this repository writes it.
  #
  # WHAT IT COST, WHICH IS MORE THAN ONE RED JOB. The job dies BEFORE its commit, so the
  # rebuilt site dies with it, and `/datacenters/` prints how old its reading is. A page that
  # ages daily and is rebuilt by nothing goes stale by one day per day, and the next pull
  # request to run `site_fresh_check` is told the page was hand edited. It was not. It was
  # simply older than the ledger it is a function of, which is the same shape this workflow's
  # own comment records for 08-19, 08-21, 08-23 and 08-24 and calls flakiness.
  #
  # NOT append_only. A roster is rewritten in full on every reading, which is what makes it a
  # roster and not a series. The irreplaceable series above keep their protection.
  - path: "ledger/gridwatch/datacenters.json"
    owner: gridwatch
    append_only: false

  - path: "ledger/gridwatch/raw/**"
    owner: gridwatch
    append_only: true
    note: >
      The raw ERCOT responses, gzipped, snapshotted BEFORE anything parses them. This is the
      only route back if a parser turns out to have been wrong, because ERCOT keeps no
      archive to refetch from. One file per feed per day, written once and never revised.

  # ---------------------------------------------------------------- the site: THE GATES
  # A routine that can edit the gate that judges it has no gate.
  #
  # This rule used to appear TWICE, and the second one carried `rebuild_by: [carousel,
  # gridwatch]`. Last match wins, so the strict rule was dead and the carousel held write
  # access to site_build.py, house_style_check.py and docket_build.py: every gate that judges
  # it. Nothing warned, because a repealed rule still reads correctly in the file. `--self-test`
  # now proves every rule still answers for its own namesake path, so a shadowed rule is a red
  # gate rather than a comment. It found a second one the moment it was switched on.
  #
  # rebuild_by does NOT belong here. It grants full write, not "allowed to run it", which is
  # what the old note claimed it meant. Running a script needs no permission at all. Only
  # committing its OUTPUT does, and that output is docs/, which grants it below.
  #
  # NARROWED ON 2026-08-30, ON THE OWNER'S INSTRUCTION, AND HERE IS WHAT IT COST BEFORE.
  #
  # `scripts/site/**` and `scripts/shared/**` were blanket `human`, and on the day this changed
  # that blanket blocked a routine three times in one run, every time on a defect the run itself
  # had caused and could have fixed:
  #
  #   docket_calendar.py   a self-test hardcoded 2026-10 as a quiet month, and the run admitted
  #                        an item with a 2026-10-13 key date. Correct data, red CI.
  #   editorial.py         house_style read `about-us` inside a txdmv.gov path as the first
  #                        person plural, on a citation line nobody here wrote.
  #   schema_contract.json a field grew and the contract wanted recording.
  #
  # The routine wrote all three up as proposals and stopped, which is what this map said to do,
  # and the deck did not reach the site. The owner's judgement: the map was protecting builders
  # and gates that a routine breaking should simply fix, and using the lane as a reason not to
  # fix its own mistake is worse than the mistake.
  #
  # SO THE BUILDERS AND THE GATES MOVE TO `daily` AND THE RECORD DOES NOT. What the map is
  # actually for is stated two hundred lines above: Phase 17's whole job is editing the machine,
  # and a self-editing phase must never be able to edit the public record. That property is
  # unchanged. `ledger/**` and `config/**` are still `human` or their own actor's, `CLAUDE.md`,
  # `ownership.yaml`, `.githooks/**` and `.github/workflows/**` are still `human`, and a routine
  # still cannot rewrite what it published or the rules it is judged by.
  - path: "scripts/site/**"
    owner: daily
  - path: "scripts/shared/**"
    owner: daily

  # Carve-outs, each naming ONE file. A glob here would hand back the gates the rule above
  # just took away.

  # THE LOCAL GATE RUNNER, opened to `upgrade` on 2026-08-20 on the owner's explicit call.
  #
  # It is not a gate. It is the thing that RUNS the gates on this machine, and it keeps no
  # opinion of its own about what should pass: it reads guards.yml and executes what is there,
  # by exit code. So it cannot be loosened to make a run pass, which is the property that makes
  # every other file in `scripts/shared/**` maintainer-owned. Loosening this one only stops the
  # gates running, which shows up as a smaller step count in its own summary.
  #
  # What made this urgent: it broke without anybody editing it. A security fix moved a `${{ }}`
  # expression from a step's `run:` block into its `env:` block, this runner watched only
  # `run:`, and from that push it ran a CI-only step with an unset variable and exited 1 on a
  # clean checkout of main. The routine's Phase 0 tells a run to fix a gate that is red at wake
  # before doing anything else, and the map told it the fix belonged to somebody who was not
  # there. A pre-push runner that is permanently red is worse than none, because the next run
  # learns to push past it.
  #
  # `upgrade` and not `daily`, deliberately. This stays out of reach during the record and the
  # deck, and is reachable only from Phase 17, the phase whose whole job is editing the machine.
  # `branch_also_allows` already lets a `claude/daily-` branch carry `upgrade` commits.
  - path: "scripts/shared/guards_local.py"
    owner: upgrade
    note: >
      The runner, not a gate. It reads guards.yml rather than keeping its own step list, so it
      cannot quietly narrow what CI checks. Phase 17's lane, never the record's.

  - path: "scripts/site/ask_*.py"
    owner: human
    note: The answer engine is a gate on what the site may claim. Maintainer-owned.
  - path: "scripts/site/gridwatch_page.py"
    owner: human
    rebuild_by: [daily]
    note: Presentation only. The collectors, the model config and the ledgers stay off limits.
  - path: "scripts/site/waterwatch_page.py"
    owner: human
    rebuild_by: [daily]
    note: Presentation only, same terms as the grid watch page.

  # ---------------------------------------------------------------- ask lane
  - path: "workers/ask/**"
    owner: ask
  - path: "prompts/ask_routine.md"
    owner: human

  # `dispatch` was added on 2026-08-19, on the owner's explicit instruction, and the reason is
  # a structural one rather than a convenience. The publish step owns `docs/videos/videos.json`
  # and nothing else, but writing that file CHANGES A NUMBER THE SITE DISPLAYS, so a Dispatch
  # publish could not leave this site consistent with its own ledgers. The first video published
  # took the count from zero to one, `index.html` still said zero, and CI went red on a PR whose
  # only content was the file the Dispatch is contracted to write.
  #
  # Waiting for the next `daily` run to reconcile it is the wrong trade: the video is live and
  # the site says there are none, for a whole cycle, on the one surface a reader looks at. A run
  # that publishes a thing regenerates the pages that count it.
  #
  # This does NOT widen what `dispatch` may author. `docs/` is generated output and nobody may
  # edit it by hand; `site_fresh_check` still proves byte equality against a fresh build, so the
  # worst a bad publish can do is fail that check rather than corrupt a page.
  - path: "docs/**"
    owner: human
    generated: true
    rebuild_by: [daily, gridwatch, human, dispatch]
    note: >
      A pure deterministic function of the ledgers. site_fresh_check.py rebuilds into a temp
      dir and proves byte equality, which is what makes it impossible for a run to corrupt
      the live site by hand. Regenerate it; never edit it.

  # ---------------------------------------------------------------- hard guards
  - path: "docs/videos/videos.json"
    owner: dispatch
    append_only: true
    note: >
      EXTERNAL DATA. Owned by the publish step in TexasAIDispatch, which prepends one entry
      per shipped video. No build in this repo may write, reformat, or delete it, and
      site_build copies it through verbatim.
  - path: "docs/videos/index.html"
    owner: human
    rebuild_by: [daily, gridwatch, dispatch]
    note: >
      GENERATED, and this rule changed on 2026-08-13. It was written as a hand-built static
      passthrough, copied verbatim and never regenerated, which is how the sibling product
      does it. That is the wrong trade here. A standalone page carries its own copy of the
      masthead, and this site's masthead changed twice in one afternoon. A hand-maintained
      nav does not fail loudly; it keeps pointing at a tab that no longer exists, on the one
      page nothing regenerates. The shell is built by site_build like every other page and
      only the FEED is external.
  - path: "vendor/**"
    owner: human
    note: >
      Vendored copies of another repo's contract, kept for checking only and never served.
      Updated deliberately by a maintainer when the upstream contract moves.
