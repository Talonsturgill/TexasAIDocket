name: Texas tech headline

on:
  schedule:
    # Four small feed reads per day; offset from the top-of-hour collector traffic.
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news-headline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --quiet --no-deps --requirement requirements.txt
      - name: Check selection rules before reading the feed
        run: python3 scripts/site/news_headlines.py --self-test
      - name: Collect the latest Texas tech coverage
        run: |
          python3 scripts/site/news_headlines.py --collect
          cp ledger/news/latest.json "$RUNNER_TEMP/news-latest.json"

      # This is an ephemeral checkout. Rebuild on current main on each attempt, instead of
      # rebasing generated HTML across another collector's update. Never overwrite trunk.
      - name: Rebuild and commit the headline
        run: |
          git config user.name "texas-ai-docket-bot"
          git config user.email "bot@texasaidocket.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/news-latest.json" ledger/news/latest.json
            python3 scripts/site/news_headlines.py --check
            python3 scripts/site/site_build.py --out docs --today "$(date -u +%F)"
            python3 scripts/site/house_style_check.py
            git add ledger/news/latest.json docs
            git diff --cached --quiet && exit 0
            python3 scripts/shared/ownership_check.py --actor news --staged
            git commit -m "news: refresh the Texas tech headline" -m "Actor: news"
            test "$(git rev-list --count origin/main..HEAD)" = "1"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::error::main kept moving; headline update was not pushed"
          exit 1
      # GITHUB_TOKEN pushes do not trigger push workflows. Full guards dispatch Pages only
      # after their aggregate check passes for the exact main SHA.
      - name: Run full guards before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run guards.yml --ref main
