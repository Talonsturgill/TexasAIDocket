name: gridwatch

# THE ONE JOB IN THIS REPO THAT CANNOT BE MADE UP LATER.
#
# ERCOT's dashboard feeds are rolling windows with no archive behind them. Miss a day and it is
# gone, from here and from anywhere else. Everything below is shaped by that single fact.
#
# WHY THIS IS A CRON AND NOT A PHASE OF THE CAROUSEL ROUTINE
#   The delivery policy says a failed run does not merge. That is right for editorial output
#   and wrong for a time series: a carousel run failing its gates on a Tuesday must not cost
#   Tuesday's reading. So the collector runs alone, owes nothing to any other job, and no
#   editorial failure can reach it.
#
# WHY TWICE A DAY, AT THESE HOURS
#   The collector takes ERCOT's settled PREVIOUS local day, so it does not race local midnight
#   and does not care about being a few minutes late. 14:00 and 20:00 UTC are 9am and 3pm in
#   Texas in summer, 8am and 2pm in winter. Both land inside the same Texas day year round, so
#   the second run is a genuine retry of the first rather than a different day's work. If the
#   morning run fails for any reason, the afternoon one still gets the day.
#
# WHY IT PUSHES STRAIGHT TO MAIN
#   A pull request per day would put a required review, a CI queue and a merge between us and
#   an unrepeatable measurement. The lane is enforced instead by ownership_check running here
#   with the gridwatch actor before anything is pushed, which is the same gate a PR would run.
#
# WHY THE READING IS COMMITTED EVEN IF THE SITE REBUILD FAILS
#   The reading is irreplaceable and the site is not. If the rebuild breaks, the commit lands
#   with the ledger alone, the pages workflow then fails its freshness gate, and that failure
#   is the correct alarm: the site is stale and somebody needs to know. The measurement is
#   already safe on main by then.

# A RECOVERY LEVER THAT NEEDS NO UI AND NO EXTRA PERMISSION.
#
# `workflow_dispatch` is the obvious way to re-run a missed collection and it is not always
# reachable. Triggering it over the API needs `actions: write`, which the GitHub App working on
# this repository does not hold, so an automated maintainer hits `403 Resource not accessible by
# integration` and the only route left is a human at the Actions tab. On 2026-08-13 that was the
# difference between recovering a lost ERCOT day and losing it, because the window to recover one
# closes at Texas midnight and nobody was guaranteed to be at a keyboard before then.
#
# Pushing a commit needs no permission beyond the one that already exists, so touching the
# sentinel file below and pushing it to `main` starts a collection:
#
#     date -u +%FT%TZ > .github/recover-gridwatch   # then commit, PR, merge
#
# Firing this more than once is harmless. `worth_writing` refuses to rewrite a settled verified
# day, so a spurious run reads ERCOT, finds the day already held, and writes nothing.
on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/recover-gridwatch"

permissions:
  contents: write

# Never cancel a collection in flight, and never run two at once against an append only ledger.
concurrency:
  group: gridwatch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # `main` BY NAME, NEVER THE DEFAULT BRANCH.
      #
      # This step used to take the checkout action's default, which is whatever the
      # repository's default branch happens to be, while every push below targets `main`.
      # Those are the same branch only by luck, and on 2026-08-13 they stopped being.
      #
      # What that cost: this job checked out the feature branch, committed the reading on
      # top of it, and ran `git rebase origin/main`, which replayed the whole feature
      # branch. While `main` was an ancestor that rebase was a no-op and the push
      # fast-forwarded, so nobody noticed that **a data collection cron was quietly
      # pushing unreviewed feature work to trunk every single day.** The moment the
      # feature branch was squash merged, the two held identical content through
      # different history, the replay conflicted with itself in `WORKLOG.md` and
      # `places.py`, and both of that day's runs died with the reading still in the
      # workspace. ERCOT's dashboard keeps no archive, so that is the one loss this
      # project cannot repair.
      #
      # Naming the branch fixes both halves at once. The workspace is trunk, so the only
      # commit a rebase can replay is this job's own reading, and there is no longer any
      # path by which this job pushes somebody else's work.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pyyaml

      - name: Prove the collector's own checks can go red
        # Hermetic, no network. A collector whose checks are broken has no business appending
        # to a series nobody can rebuild, so this gates the fetch rather than reporting after.
        run: python3 scripts/gridwatch/gridwatch_collect.py --self-test

      - name: Prove the water collector's own checks can go red
        run: python3 scripts/gridwatch/waterwatch_collect.py --self-test

      - name: Prove the weather collector's own checks can go red
        run: python3 scripts/gridwatch/weather_collect.py --self-test

      - name: Collect the settled previous day
        id: collect
        run: |
          echo gridwatch > .git/ACTOR
          python3 scripts/gridwatch/gridwatch_collect.py --collect

      - name: Collect today's reservoir storage
        id: water
        continue-on-error: true
        run: |
          # A second instrument on the same schedule, deliberately not gating the first. The
          # grid and the reservoirs share nothing but a cron: TWDB being down must never cost
          # an ERCOT day, and the step order puts the irreplaceable one first.
          python3 scripts/gridwatch/waterwatch_collect.py --collect

      - name: Say plainly if the water collection failed
        if: steps.water.outcome == 'failure'
        run: echo "::warning::the reservoir reading did not land; the grid reading is unaffected"

      - name: Fill any gap in the observed weather record
        id: heat
        continue-on-error: true
        run: |
          # THE ONE COLLECTOR HERE THAT CANNOT LOSE ANYTHING. NCEI's daily summaries are the
          # permanent public archive, so this fetches a trailing window and fills whatever is
          # absent. A week of failures costs nothing but a week of staleness, and the next
          # successful run catches up completely. It runs last and gates nothing for that
          # reason: the two collectors above are the ones with something to lose.
          python3 scripts/gridwatch/weather_collect.py --collect

      - name: Say plainly if the heat collection failed
        if: steps.heat.outcome == 'failure'
        run: echo "::warning::the weather record did not update; it backfills, so nothing is lost"

      - name: Rebuild the published site
        id: rebuild
        continue-on-error: true
        run: python3 scripts/site/site_build.py --out docs --today "$(date -u +%F)"

      - name: Stay in lane
        run: |
          # The same ownership gate a pull request would run, run here because there is no
          # pull request. gridwatch owns its ledger and may rebuild docs; it may not touch
          # the docket, the carousel, or any script but its own.
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed, nothing to check"; exit 0
          fi
          python3 scripts/shared/ownership_check.py --actor gridwatch --staged

      - name: Commit and push
        run: |
          if git diff --cached --quiet; then
            echo "no new reading and no site change; the day was already held"; exit 0
          fi
          git config user.name  "Talon Sturgill"
          git config user.email "Talon.sturgill@gmail.com"
          DAY=$(python3 -c "import json,pathlib;p=pathlib.Path('ledger/gridwatch/readings.jsonl');\
          print(json.loads(p.read_text().splitlines()[-1])['date'] if p.exists() else 'none')")
          git commit -q -m "gridwatch: ERCOT settled day ${DAY}"

          # ONE COMMIT AHEAD OF TRUNK, CHECKED BEFORE ANYTHING IS PUSHED. With `main`
          # checked out above, this job's history is trunk plus exactly one reading. If it
          # is ever more than that, something has put work in this workspace that this job
          # does not own, and pushing it is how a collector becomes a deploy mechanism.
          AHEAD=$(git rev-list --count origin/main..HEAD)
          if [ "$AHEAD" != "1" ]; then
            echo "::error::this job is ${AHEAD} commits ahead of main and should be 1. \
          Refusing to push, because a collector must only ever push its own reading."
            exit 1
          fi

          for delay in 2 4 8 16 0; do
            git fetch --quiet origin main || true
            # A FAILED REBASE MEANS DO NOT PUSH. The old loop aborted the rebase and then
            # pushed anyway, which is a guaranteed non-fast-forward, so a single conflict
            # burned all five attempts printing the same rejection five times and buried
            # the real cause under it.
            if git rebase --quiet origin/main; then
              if git push origin HEAD:main; then
                echo "pushed"; exit 0
              fi
              echo "push rejected"
            else
              git rebase --abort || true
              echo "::warning::rebase onto origin/main conflicted. Trunk holds a change \
          this reading cannot be replayed over."
            fi
            [ "$delay" = 0 ] && break
            echo "retrying in ${delay}s"; sleep "$delay"
          done
          echo "::error::could not push the reading. The measurement is in this run's \
          workspace only and the day is at risk. Re-run this workflow once trunk is \
          settled; the collector takes the settled previous day, so a same-day re-run \
          recovers it."
          exit 1

      - name: Say plainly if the site rebuild failed
        if: steps.rebuild.outcome == 'failure'
        run: |
          echo "::error::The reading was collected and pushed, but the site did not rebuild. \
          The published site is now stale and the pages freshness gate will refuse to deploy \
          until it is fixed."
          exit 1
