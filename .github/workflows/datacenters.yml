name: data center registry

# The Texas Comptroller's registry of data centers, read DAILY.
#
# DAILY BECAUSE IT CHANGES WHENEVER A FACILITY REGISTERS, with no schedule and no
# announcement. The page is one small HTML table, so a daily read costs almost nothing and
# a weekly one would date every reading by up to six days for no saving. The collector
# writes the full roster and appends a counts-only record, so a day with no change costs
# one short line rather than 149 rows.
#
# ITS OWN WORKFLOW AND NOT A STEP IN gridwatch.yml. A Comptroller outage must never be able
# to cost an ERCOT demand day, which is the one irreversible failure in this repository.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gridwatch/datacenters_collect.py"
      - ".github/workflows/datacenters.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: datacenters
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # THE SITE BUILD NEEDS THESE AND THE COLLECTOR DOES NOT. The rebuild step below was
      # added to close the stale-page hole and could never have run without them, and
      # `continue-on-error` kept that quiet. `gridwatch.yml` installs the same one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install --quiet --no-deps --requirement requirements.txt

      # Hermetic, no network. A collector whose own checks are broken has no business
      # appending to a series, so this gates the fetch rather than reporting after it.
      - name: Prove the collector's checks can go red
        run: python3 scripts/gridwatch/datacenters_collect.py --self-test

      # Exit 2 is "read, but unverified", which is the correct OUTPUT when the Comptroller
      # changes the table or the fetch fails. Only a crash fails the job.
      - name: Read the registry
        run: |
          python3 scripts/gridwatch/datacenters_collect.py --collect || rc=$?
          if [ "${rc:-0}" -gt 2 ]; then exit "$rc"; fi

      # THE READING AND THE SITE GO IN ONE COMMIT, which is what gridwatch already does and
      # this workflow did not. It committed the ledger alone, so docs/ was left describing the
      # PREVIOUS registry, and the very next pages run failed site_fresh_check with
      # datacenters/index.html and registry-changes/index.html reported as hand edited. They
      # were not. They were simply older than the ledger they are a function of.
      #
      # It looked intermittent because it self-heals: any later build that did rebuild put
      # docs/ back in step. So it went red on 2026-08-19, 08-21, 08-23 and 08-24, went green
      # in between, and read as flakiness rather than as one workflow missing a step.
      - name: Rebuild the published site
        id: rebuild
        continue-on-error: true
        run: python3 scripts/site/site_build.py --out docs --today "$(date -u +%F)"

      - name: Commit the reading
        run: |
          git config user.name  "texas-ai-docket-bot"
          git config user.email "bot@texasaidocket.com"
          git add ledger/gridwatch/datacenters.json ledger/gridwatch/datacenters.jsonl \
                  ledger/gridwatch/raw docs || true
          git diff --cached --quiet && echo "nothing new" && exit 0
          # The ownership gate a pull request would run, run here because there is no pull
          # request. This actor owns its ledger and may rebuild docs, and nothing else.
          python3 scripts/shared/ownership_check.py --actor gridwatch --staged
          git commit -m "datacenters: registry reading"
          AHEAD=$(git rev-list --count origin/main..HEAD)
          if [ "$AHEAD" != "1" ]; then
            echo "::error::this job is ${AHEAD} commits ahead of main; refusing to push"
            exit 1
          fi

          for delay in 2 4 8 16 0; do
            git fetch --quiet origin main || true
            if git rebase --quiet origin/main; then
              if git push origin HEAD:main; then
                echo "pushed"; exit 0
              fi
              echo "push rejected"
            else
              git rebase --abort || true
              echo "::warning::rebase onto main conflicted; refusing to overwrite trunk"
            fi
            [ "$delay" = 0 ] && break
            echo "retrying in ${delay}s"; sleep "$delay"
          done
          echo "::error::could not push the registry reading; rerun once main is settled"
          exit 1

      # A push made with GITHUB_TOKEN does not start another workflow. Dispatch the full guard
      # suite explicitly so Pages never has to choose between deploying early and missing this
      # update entirely.
      - name: Run full guards for the new main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run guards.yml --ref main

      # A SWALLOWED FAILURE IS THE ONE THAT COSTS THE MOST, because nothing reports it and the
      # damage shows up somewhere else. `continue-on-error` above is right, since a broken site
      # build must never cost a reading, and it is only right if the failure is still said out
      # loud. Without this the job goes green, the reading lands, docs/ is left older than the
      # ledger it is a function of, and the red arrives on the next pull request to touch
      # anything at all.
      - name: Say so when the rebuild failed
        if: steps.rebuild.outcome == 'failure'
        run: |
          echo "::error::the reading landed and the site rebuild did not, so docs/ is now \
          older than the ledger and site_fresh_check will go red on the next pull request."
