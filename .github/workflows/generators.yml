name: generator inventory

# EIA-860M, the generator inventory, read MONTHLY.
#
# MONTHLY BECAUSE THAT IS THE PUBLICATION CADENCE. EIA issues one workbook a month and it is
# fourteen megabytes; reading it daily would download the same file thirty times to learn
# nothing. The schedule fires daily and the collector EXITS EARLY once the month is held and
# verified, because the publication day inside the month moves and guessing it wrong means
# waiting another month for a reading nobody can backfill.
#
# ITS OWN WORKFLOW, same reason as every other collector here.

on:
  schedule:
    - cron: "40 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gridwatch/generators_collect.py"
      - ".github/workflows/generators.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: generators
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # THE SITE BUILD NEEDS THESE AND THE COLLECTOR DOES NOT, which is why they were missing.
      # `gridwatch.yml` installs the same one before its own rebuild.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install --quiet --no-deps --requirement requirements.txt

      - name: Prove the collector's checks can go red
        run: python3 scripts/gridwatch/generators_collect.py --self-test

      - name: Read the newest published inventory
        run: |
          python3 scripts/gridwatch/generators_collect.py --collect || rc=$?
          if [ "${rc:-0}" -gt 2 ]; then exit "$rc"; fi

      # THE READING AND THE SITE GO IN ONE COMMIT. This workflow committed the ledger alone,
      # so `docs/` was left describing the PREVIOUS edition, and the next pull request to run
      # `site_fresh_check` was told `datacenters/index.html` had been hand edited. It had not.
      # It was simply older than the ledger it is a function of.
      #
      # 2026-08-26 IS WHAT THIS COST. `4b8d04fd` added the July EIA-860M row at 16:37 UTC and
      # rebuilt nothing, so the page said "Generator inventory, June 2026 edition" against a
      # ledger holding July, and every pull request open at the time went red on a file none
      # of them had touched. `datacenters.yml` carries this same step and a comment recording
      # the same failure on 08-19, 08-21, 08-23 and 08-24. Its sibling never got the fix.
      #
      # continue-on-error, because a broken site build must not cost a reading. EIA publishes
      # once a month on a day that moves, and a missed edition waits a month.
      - name: Rebuild the published site
        id: rebuild
        continue-on-error: true
        run: python3 scripts/site/site_build.py --out docs --today "$(date -u +%F)"

      - name: Stay in lane
        run: |
          # The ownership gate a pull request would run, run here because there is no pull
          # request. This actor owns its ledger and may rebuild docs, and nothing else.
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed, nothing to check"; exit 0
          fi
          python3 scripts/shared/ownership_check.py --actor gridwatch --staged

      - name: Commit the reading
        run: |
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git config user.name  "texas-ai-docket-bot"
          git config user.email "bot@texasaidocket.com"
          git commit -q -m "generators: EIA-860M reading"

          # ONE COMMIT AHEAD OF TRUNK, CHECKED BEFORE ANYTHING IS PUSHED, which is the rule
          # gridwatch.yml already runs under. If this job's history is ever more than trunk
          # plus its own reading, something else has put work in this workspace, and pushing
          # it is how a collector becomes a deploy mechanism.
          AHEAD=$(git rev-list --count origin/main..HEAD)
          if [ "$AHEAD" != "1" ]; then
            echo "::error::this job is ${AHEAD} commits ahead of main and should be 1. \
          Refusing to push, because a collector must only ever push its own reading."
            exit 1
          fi

          for delay in 2 4 8 16 0; do
            git fetch --quiet origin main || true
            if git rebase --quiet origin/main; then
              if git push origin HEAD:main; then
                echo "pushed"; exit 0
              fi
              echo "push rejected"
            else
              git rebase --abort || true
              echo "::warning::rebase onto main conflicted; refusing to overwrite trunk"
            fi
            [ "$delay" = 0 ] && break
            echo "retrying in ${delay}s"; sleep "$delay"
          done
          echo "::error::could not push the generator reading; rerun once main is settled"
          exit 1

      # GITHUB_TOKEN pushes do not start guards.yml through its push trigger. Dispatch it
      # explicitly; Pages listens to that completed guard run rather than racing this writer.
      - name: Run full guards for the new main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run guards.yml --ref main

      - name: Say so when the rebuild failed
        if: steps.rebuild.outcome == 'failure'
        run: |
          echo "::error::the reading landed and the site rebuild did not, so docs/ is now \
          older than the ledger and site_fresh_check will go red on the next pull request."
