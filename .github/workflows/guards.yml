name: guards

# The two structural gates for this repo, run on every PULL REQUEST and every MERGE to main.
#
# ownership  no automation may write outside its lane. Several unattended routines share this
#            history and each ends in a phase that edits its own machine, so the lane is only
#            real if something checks it. The actor is inferred from the branch prefix.
# port-audit is the port done, and is what we moved actually wired up? The previous attempt at
#            this port failed by copying files across and never connecting them, which nothing
#            else would notice, because an unreferenced script does not throw.
#
# Both self-test FIRST. A gate that cannot go red proves nothing about what it guards, so the
# self-test reintroduces known-bad inputs and requires the checker to reject them before the
# real run is allowed to mean anything.
#
# WHY NOT ON EVERY PUSH. This used to run on every push to every branch but main, so each
# intermediate dev commit and each unattended routine step fired the gate, and every failing
# WORK-IN-PROGRESS commit mailed the maintainer a failure. The merge is where a change becomes
# real, and the pull_request trigger already gates every merge, so the per-commit runs were
# redundant noise. Now it runs on PRs and on main itself, so main is validated on the way in
# and a red is a red that MEANS something. Maintainer-directed change, 2026-08-14.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ownership needs the diff against the base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Pillow and numpy are for ship_images, which measures the encode it produced rather
        # than asserting a figure. Installed rather than skipped when absent: a self-test that
        # quietly skips is a self-test that never runs, and the whole point of running these in
        # CI is that the developer's container is not the thing being checked. This exact gap
        # shipped green locally and failed here on the first push.
        run: pip install --quiet pyyaml pillow numpy

      - name: Ownership self-test (prove the gate can go red)
        run: python3 scripts/shared/ownership_check.py --self-test

      - name: Port audit self-test (prove every gate can go red)
        run: python3 scripts/shared/port_audit.py --self-test

      - name: Places self-test (the canonical place record and its resolver)
        run: python3 scripts/shared/places.py --self-test

      - name: Places record is reproducible from its source geodata
        run: |
          # The place record is load-bearing: every stored location resolves through it, so a
          # hand-edit would silently repoint pins and break per-metro counts. Rebuild it and
          # require byte equality, the same discipline docs/ is held to.
          cp assets/geo/tx-places.json /tmp/tx-places.committed.json
          python3 scripts/shared/places.py build
          diff -q /tmp/tx-places.committed.json assets/geo/tx-places.json \
            || { echo "tx-places.json is not reproducible from tx-counties.topo.json"; exit 1; }
          echo "places record reproduces byte-for-byte"

      - name: Docket gates self-test (prove every gate can go red)
        run: python3 scripts/site/docket_build.py --self-test

      - name: Docket staleness selector self-test
        run: python3 scripts/site/docket_staleness.py --self-test

      - name: Docket gates against the committed record
        run: |
          # The record is the product. Nobody reviews it before it publishes, so these gates
          # are the review: schema, a verbatim quote behind every claim, no numeral that is
          # not quoted or computed, and no machine narration in reader copy.
          if [ -f ledger/docket.json ]; then
            python3 scripts/site/docket_build.py --validate
          else
            echo "no ledger yet, skipping"
          fi

      - name: Nothing rotten in the record
        run: |
          # Exit 2 means an item is past twice its re-verification limit while still live,
          # which is the record quietly going stale in public.
          # NO --budget. The owner removed it on 2026-08-18 and this line still carried the old
          # 6, so on every run CI printed "Raise --budget" under a list of due items, advising a
          # flag the routine no longer has. The rotten check never depended on it. Uncapped is
          # also the honest report: it names every item past the leash rather than the first six.
          if [ -f ledger/docket.json ]; then
            python3 scripts/site/docket_staleness.py || \
              { [ $? -eq 2 ] && echo "ROTTEN items present" && exit 1; }
          fi

      - name: Grid watch collector self-test (hermetic, gates every collection)
        run: python3 scripts/gridwatch/gridwatch_collect.py --self-test

      - name: Numeral lint self-test (the gate behind "no number is ever typed")
        run: python3 scripts/site/numeral_lint.py

      - name: Water watch collector self-test (hermetic, gates every collection)
        run: python3 scripts/gridwatch/waterwatch_collect.py --self-test

      - name: Weather collector self-test (a dry day is zero, a missing high is not)
        run: python3 scripts/gridwatch/weather_collect.py --self-test

      - name: Drought collector self-test (the severity columns are cumulative, and are checked)
        run: python3 scripts/gridwatch/drought_collect.py --self-test

      - name: Docket ingest self-test (an undated comment window is demoted, never published)
        run: python3 scripts/site/docket_ingest.py --self-test

      - name: Front chip self-test (the rotation, and no day of the year left empty)
        run: python3 scripts/site/frontchip.py --self-test

      - name: Grid watch page self-test (the numeral gate, and the bar that is never a dial)
        run: python3 scripts/site/gridwatch_page.py

      - name: Water watch page self-test (one hue per bar, El Paso excluded on purpose)
        run: python3 scripts/site/waterwatch_page.py

      - name: Grid watch page check self-test
        run: python3 scripts/gridwatch/gridwatch_pagecheck.py --self-test

      - name: The published grid watch page holds its promises
        run: |
          # Advisory by design: exit 2 means the page wants attention, and the grid watch must
          # never be able to fail a build over presentation. Exit 1 would mean the checker
          # itself broke, which is a real failure.
          python3 scripts/gridwatch/gridwatch_pagecheck.py || {
            code=$?
            [ "$code" = 2 ] && echo "::warning::the grid watch page wants attention" && exit 0
            exit "$code"
          }

      - name: Media check self-test (it can go red)
        run: python3 scripts/site/media_check.py --self-test

      # THE PRODUCT, NOT THE BUILDER'S INTENT. On 2026-08-16 every gate here was green while
      # the live article page carried two broken images and had silently dropped two slides.
      # Nothing in the suite opened a built page and asked whether what it points at is there.
      - name: Every image the site points at exists
        run: python3 scripts/site/media_check.py

      - name: Water watch page check self-test
        run: python3 scripts/gridwatch/waterwatch_pagecheck.py --self-test

      - name: The published water watch page holds its promises
        run: |
          # Advisory by design, exactly like the grid watch above and for the same reason: an
          # instrument must never fail a build over presentation. Exit 2 is a finding, exit 1
          # would mean the checker itself broke.
          python3 scripts/gridwatch/waterwatch_pagecheck.py || {
            code=$?
            [ "$code" = 2 ] && echo "::warning::the water watch page wants attention" && exit 0
            exit "$code"
          }

      - name: Caption lint self-test (the house rules, and that they can go red)
        run: python3 scripts/carousel/caption_check.py --self-test

      - name: Claims gate self-test (every drift the sibling suffered, replayed)
        run: |
          # The fact-checker is an agent given a schema, and an agent given a schema returns
          # what it returns. In the sibling product the shape drifted across eighteen runs and
          # the verification record rendered empty on fourteen decks, silently, because nothing
          # read the file closely enough to complain. Texas has shipped zero decks, which is
          # exactly when to install this: a gate written after the drift is archaeology.
          python3 scripts/carousel/claims_check.py --self-test

      - name: Aggregate gate self-test (the arithmetic on top of the claims)
        run: |
          # claims_check proves each claim has a source. numeral_lint proves each published
          # figure traces to a computation. Neither looks at the arithmetic performed ON TOP of
          # the claims, and that is where a slide invents a number out of verified parts. The
          # sibling printed FIVE where the answer was four, with every other gate passing.
          python3 scripts/carousel/aggregate_check.py --self-test

      - name: Dedupe pre-flight self-test (reads the whole entry, not the title)
        run: |
          # The thirty day rule is a semantic judgement, and judgements are made by reading. A
          # sibling run nearly repeated a story eleven days old because the showrunner read a
          # ledger entry's truncated title rather than its angle and entities.
          python3 scripts/carousel/dedupe_check.py --self-test

      - name: Dossier gate self-test (the plan, before anything is drawn)
        run: |
          # The only gate that fires before a slide exists. A pixel critic grades each slide
          # against its OWN dossier, so a bad plan executed faithfully passes every review after
          # it. The sibling's scorer named a dead lower zone in six consecutive runs and it was
          # never fixed, because by the time the only reviewer who could see it looked, the
          # budget to rebuild four slides was gone.
          python3 scripts/carousel/dossier_check.py --self-test

      - name: Copy sync self-test (the record still says what the deck says)
        run: |
          # Pixel review is where display text gets edited straight into a slide's HTML, and
          # copy.json goes stale from that moment. Everything downstream is built from the
          # record. Also catches a slide citing a claim id that is not in the claims file, which
          # no other gate looks at.
          python3 scripts/carousel/copy_sync_check.py --self-test

      - name: Instincts ledger self-test (confidence is earned, never claimed)
        run: |
          # The sibling's ledger carries 101 entries, 47 at 0.90 confidence, of which 25 have
          # ever been confirmed once. Those numbers were typed by the model that wrote the
          # lesson, and they decide which lessons reach the next run's prompt. Here an entry
          # records the dates it was confirmed and contradicted, confidence is Laplace's rule of
          # succession over those events, and a written confidence field is a hard fail.
          python3 scripts/carousel/instincts.py --self-test
          python3 scripts/carousel/instincts.py --validate

      - name: Gate status self-test (the record cannot contradict the artifacts)
        run: |
          # A hand-written reconciliation once claimed zero QA warnings while the artifact said
          # five. The run after that pasted a correct block, ran four more render rounds under
          # it, and shipped a record wrong on four rows. Artifacts are PARSED, never measured by
          # length, and a row older than the newest render reads STALE rather than PASS.
          python3 scripts/carousel/gate_status.py --self-test

      - name: Ship images self-test (measured, never asserted)
        run: |
          # Every figure it prints is computed from the files in front of it, including the PSNR
          # it refuses a bad encode on. The fixture is built in int16 and clipped, because the
          # first one accumulated grain in uint8, wrapped 255 to 4, and measured its own bug.
          python3 scripts/carousel/ship_images.py --self-test

      - name: Bespoke check self-test (a template scores 1.0, a real deck scores near zero)
        run: python3 scripts/carousel/bespoke_check.py --self-test

      - name: The demo deck is genuinely bespoke
        run: |
          # The engine-proof deck is the reference this gate was fitted against, so it has to
          # keep passing. If it ever drifts up, either the deck got lazier or the exclusion
          # list got too generous, and both are worth knowing.
          python3 scripts/carousel/bespoke_check.py --slides-dir examples/demo-deck/slides

      - name: Gmail draft self-test (drafts only, and the address is a constant)
        run: python3 scripts/carousel/gmail_draft.py --self-test

      - name: Email check self-test (the run's email is postable, not an essay)
        run: |
          # Run 2's email was a plaintext essay with no post copy, no first comment and no
          # images, because the run hand-wrote it instead of calling the builder. This gate
          # replays that and each of the other three ways the email has failed to be postable.
          python3 scripts/carousel/email_check.py --self-test

      - name: Every shipped run carries a postable email
        run: |
          # Not a self-test. This reads the real gmail_payload.json committed beside each deck
          # and fails if any run's email is missing, hand-written, or does not carry the post
          # copy and the first comment verbatim with every linked file on disk. A run that
          # shipped a deck and no postable email did not finish its one human-facing job.
          python3 scripts/carousel/email_check.py --all

      - name: House style self-test (our prose is checked, a quote never is)
        run: python3 scripts/site/house_style_check.py --self-test

      - name: The scan page and the scanner repo agree on the contract
        run: |
          # The scan form exists twice: docs/scan/index.html built by scan_page(), and the
          # scanner repo's web/scan.html. Neither reads the other, and they had drifted twice.
          # The one that matters: the scanner turned the captcha ON with a written rationale,
          # its repo law said so, and the published page stayed at false for a day, because the
          # fix landed in a file nothing serves. A change to the scanner's copy does not reach a
          # reader. Only a change here does.
          #
          # Field names are the silent half. Phase 0 of the scan routine parses them out of the
          # forwarded mail, so a rename here means a request arrives without the key the routine
          # reads and nothing throws.
          python3 scripts/site/scanner_sync_check.py --self-test
          python3 scripts/site/scanner_sync_check.py

      - name: The structured data is checked as the published copy it is
        run: |
          # house_style_check strips every <script> before it lints, correctly, because the ask
          # page ships its engine inline. JSON-LD lives in a <script>. So the moment schema.py
          # began emitting 633 generated question and answer pairs, those became the largest
          # surface of published prose on the site that NO gate read.
          #
          # This reads them: house style on every sentence, every numeral traced to a value in
          # the ledger, every citation url present in a claim, no dangling @id, and nothing
          # wearing NewsArticle, which these pages are not.
          python3 scripts/site/schema.py --self-test
          python3 scripts/site/schema_check.py --self-test
          python3 scripts/site/schema_check.py

      - name: The published site keeps the house rules
        run: |
          # Checked against the built pages, because the copy a reader sees is assembled from
          # f-strings and ledger fields and exists as a whole sentence nowhere else. Quoted
          # source text is stripped first: rewriting a quotation to fit house style would be
          # falsifying it, which is far worse than an inconsistent date.
          python3 scripts/site/house_style_check.py

      - name: Ask engine self-test (routes not cached answers, and it phones nobody)
        run: python3 scripts/site/ask_answers.py --self-test

      # The record the written answer lane reads, and the key it is marked against. Both are
      # published daily and both are paid for on every question, so both are gated.
      #
      # The pack's size check is the one with a bill attached. Every character in it is sent
      # with every question forever, so the ceiling is a budget decision and raising it to
      # make this step green would be spending money to silence a warning.
      #
      # The corpus check that matters most is the one asserting the allow-list does NOT cover
      # the whole ledger. It is derived from the pack, so numerals living only in dropped
      # fields have to be absent. If they ever all appear, the trim has stopped working and
      # the numeral guard has quietly gone permissive, which nothing else would notice.
      - name: The answering record, and what an answer may contain
        run: |
          python3 scripts/site/ask_pack.py --self-test
          python3 scripts/site/ask_corpus.py --self-test

      # The worker's checker, which is the only thing standing between a model's guess and a
      # published claim. Half of these assertions are sentences that must NOT trip a guard: a
      # verdict gate that blocks its own correct refusal teaches the model to answer instead
      # of decline, and it fails silently, because the answer still looks fine.
      - name: What a written answer is allowed to say
        run: node workers/ask/test.js

      # The client for the lane that leaves the page, and the copy a reader is shown. The copy
      # ships inside a JavaScript string where house_style_check cannot reach it, so the house
      # rules are enforced here instead, over the copy block rather than the source around it.
      - name: The written lane's client, and every word it shows
        run: python3 scripts/site/ask_written.py --self-test

      - name: The index can be told a page changed
        run: |
          # Nothing here submits anything. It proves the key is well formed, that the file
          # which verifies ownership is actually served, and that a submission is built
          # correctly, because a key file that is missing makes every future submission fail
          # verification silently.
          python3 scripts/site/indexnow.py --self-test

      - name: Glyph outlines come out of the committed fonts
        run: |
          # The card carries the decision's headline, and it got there without a dependency.
          # A TrueType glyph is quadratic contours, and the implied on-curve midpoint between
          # two off-curve points is the compression that makes a naive reader draw a letter
          # inside out, so that path is exercised on a real glyph rather than assumed.
          python3 scripts/site/truetype.py --self-test

      - name: A shared link has a card rather than a bare string
        run: |
          # Four Open Graph tags shipped and none was an image, so every link pasted into a
          # chat or a timeline rendered as a bare blue string. Drawn from the same statute
          # geometry as the tab icon and the wordmark, and textured with the site's own grain,
          # so the card is this record rather than a generic flag crop.
          python3 scripts/site/og.py --self-test

      - name: The tab icon is drawn, not defaulted
        run: |
          # The site shipped no icon of any kind, so every tab showed the browser's generic
          # globe. The icon is GENERATED from the same statute as the wordmark rather than
          # committed as a binary, for grain.py's reason: the sibling made its texture a soft
          # Pillow dependency, a box without Pillow stripped it silently, and nothing threw.
          # An icon that can go missing on a green build puts the globe straight back.
          #
          # This checks the geometry on the RASTER as well as on the numbers, because a star
          # resting on a point is this flag's most recognisable failure and it is invisible in
          # a coordinate list.
          python3 scripts/site/favicon.py --self-test

      - name: Web fonts are committed, licensed, and actually served
        run: |
          # The check exists because brand.yaml named three faces, theme.py wrote them into
          # every font stack, assets/fonts/ held all three, and NOTHING SERVED THEM. A font
          # stack naming a family no @font-face defines renders fine in the fallback, so the
          # config and the page disagreed silently for the whole life of the site.
          python3 scripts/site/fonts_build.py --self-test

      - name: Theme self-test (every contrast ratio computed and gated, red stays reserved)
        run: |
          # Contrast is a numeral and a palette is data, so the compute-not-generate law
          # applies to the design system too. Texas red on the night register measures 2.94
          # to 1, below even the large-text floor, and it was worn by the comment countdown.
          python3 scripts/site/theme.py --self-test

      - name: Map self-test (orientation, extent, determinism, and the scale bar tells the truth)
        run: |
          # The scale bar is checked the way a reader would use it: a known distance measured
          # off the drawing against the great circle. A decorative scale bar is worse than
          # none, because it invites somebody to measure with it.
          python3 scripts/site/texas_map.py --self-test

      - name: Site build self-test
        run: python3 scripts/site/site_build.py --self-test

      - name: Freshness gate self-test (it bites, and a date change alone does not)
        run: python3 scripts/site/site_fresh_check.py --self-test

      - name: The published site is exactly what the ledgers produce
        run: |
          # site_build --self-test proves two fresh builds agree. This proves the COMMITTED
          # site agrees with a fresh one, which is the only check that catches a hand edit or
          # a stale build. It is the guarantee behind "docs/ is generated, never hand-edited".
          python3 scripts/site/site_fresh_check.py

      - name: The ask engine answers every question it catalogues
        run: |
          # This one needs a browser, because the engine writes its prose at READ time and no
          # build-time lint can reach the sentence a reader actually sees. It asks every
          # catalogued question in a real page, checks no answer claims more than the record
          # holds, and cuts the network to prove the page phones nobody.
          npm install --no-save --silent playwright
          npx --yes playwright install --with-deps chromium
          SITE=docs node tests/ask_engine.mjs

      # The other lane, in the same browser. The worker is stubbed; the streaming, the thread
      # memory, the guard's wording and the two-press follow-up are not.
      #
      # The check that matters most here is the one in ask_engine above, which asserts NO
      # request leaves the page after any interaction. It went red when the human check was
      # armed on focus, because that fetched Cloudflare's script the moment a caret landed in
      # the field, during what this page's own note calls typing. The check was right and the
      # arming moved to the first press.
      - name: The written lane holds a conversation, and says what it sends
        run: SITE=docs node tests/ask_written.mjs

      - name: The page actually renders as night
        run: |
          # This one needs a browser because the bug it exists for lived in the COMPOSITE.
          # Every token was correct in isolation and all 62 contrast pairings passed, and the
          # page still rendered mauve, because warm veils were screening over a violet ground.
          # Nothing that reads tokens can see that, and contrast does not care: mauve at the
          # right luminance passes perfectly. So this samples the ground a reader actually
          # sees, and also checks the horizon is still warmer than the sky, so the fix cannot
          # be "delete the atmosphere".
          SITE=docs node tests/page_ground.mjs

      - name: The map moves like a map on a phone
        run: |
          # On a phone you cannot see which county you are tapping, because it is under your
          # finger, and a Panhandle county is a few millimetres of glass. The readout names
          # what is under the thumb; this is the other half. Pinch to zoom, two fingers to
          # move, and a control that puts the whole state back.
          #
          # A BROWSER, because the whole feature is touch events, a live viewBox and a bounding
          # box. A test that mocked all three would be testing the mock. The context declares
          # hasTouch, since the feature is behind `'ontouchstart' in window` and a desktop
          # context would exercise nothing and report green.
          SITE=docs node tests/map_gestures.mjs

      - name: The site fits the screen it is on
        run: |
          # THIS SUITE EXISTED AND DID NOT RUN HERE, which is its own lesson: it caught a real
          # regression locally, the Lone Star landing on the telemetry strip after the hero was
          # tightened for phones, and nothing in CI would have. It asserts the things a phone
          # gets wrong quietly: nothing overflows sideways, the sticky bar never lands on the
          # copy, the nav is one row at every width AND its last link can be scrolled to, the
          # mark is shown everywhere and touches nothing, and the load chart's labels are
          # legible and uncut at the size they actually render.
          SITE=docs node tests/responsive.mjs

      - name: Every word is legible against the ground it lands on
        run: |
          # A browser again, and for the same reason as the night check above: the defect lived
          # in a COMPOSITE. theme.py pairs a foreground token with a ground token, which cannot
          # see a well built out of `color-mix()` over an accent. One shipped at 2.92 with every
          # token pairing green. This composites the whole ancestor stack the way a browser does
          # and measures the glyph against that, over every run of text on every page.
          SITE=docs node tests/text_contrast.mjs

      - name: The map helper is oriented correctly
        run: |
          # No browser needed: the UMD libraries load under node, which is the point of
          # testing the projection here rather than only inside a rendered slide.
          npm install --no-save --silent playwright >/dev/null 2>&1 || true
          node tests/txgeo.mjs

      # A LANE IS SCOPED TO A COMMIT, NOT TO A BRANCH.
      # This step used to pin one actor from the branch prefix and check the whole branch diff,
      # which disagreed with the pre-commit hook, which reads a per-commit stamp. The daily
      # routine's Phase 17 stamps `upgrade` and commits on a `claude/daily-` branch, so obeying
      # the routine produced a branch this step was built to reject. It now walks the range one
      # commit at a time and reads each commit's `Actor:` trailer, written by
      # .githooks/commit-msg from the same stamp the hook reads. `branch_also_allows` in
      # ownership.yaml bounds which lanes a prefix may stamp.
      - name: Ownership check
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            RANGE="$BASE...HEAD"
          else
            git fetch --quiet origin main || true
            RANGE="origin/main...HEAD"
          fi
          echo "branch=$BRANCH range=$RANGE"
          python3 scripts/shared/ownership_check.py --branch "$BRANCH" --diff-per-commit "$RANGE"

      # The checker's own red cases. Without this the step above could be passing because it
      # cannot fail, which is the fault this repo has shipped more than once.
      - name: Ownership checker can go red
        run: python3 scripts/shared/ownership_check.py --self-test

      - name: Port manifest is current
        run: |
          # The manifest is generated from the upstream source repos, which are not checked
          # out in CI, so regenerating it here is impossible by design. Assert instead that it
          # parses, carries the expected columns, and that nothing is left UNROUTED.
          python3 - <<'PY'
          import csv, sys
          from pathlib import Path
          rows = list(csv.DictReader(Path("PORT_MANIFEST.tsv").open(newline="", encoding="utf-8"),
                                     delimiter="\t"))
          expected = {"source_repo", "source_path", "bytes", "lines", "ak_hits",
                      "disposition", "target_path", "status", "reason"}
          missing_cols = expected - set(rows[0].keys())
          if missing_cols:
              sys.exit(f"manifest is missing columns: {sorted(missing_cols)}")
          bad = [r for r in rows if r["disposition"] == "UNROUTED"]
          if bad:
              sys.exit(f"{len(bad)} manifest row(s) still UNROUTED, first: {bad[0]['source_path']}")
          print(f"manifest ok: {len(rows)} rows, none unrouted")
          PY

      - name: Port audit
        run: python3 scripts/shared/port_audit.py
