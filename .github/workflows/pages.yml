name: pages

# Publish docs/ to GitHub Pages on every merge to main that touches the site or the record it
# is built from.
#
# TWO THINGS HERE ARE NOT OBVIOUS AND BOTH ARE LOAD BEARING.
#
# 1. THE FRESHNESS GATE RUNS BEFORE THE DEPLOY. docs/ is a pure function of the ledgers, and
#    this is the last place that promise can be checked before it becomes a live page. If the
#    committed site does not match a rebuild, something was hand-edited or the ledgers moved
#    without a rebuild, and publishing either would put a claim on the internet that the record
#    does not support. Refusing to deploy is the correct failure.
#
# 2. THE DEPLOY RETRIES. GitHub's Pages API returns transient 5xx often enough that a single
#    attempt loses a day's publish for no reason, and an unattended pipeline has nobody to
#    press the button again.
#
# 3. IT DOES NOT DEPEND ON WHO PUSHED, and it used to. `push` was the only real trigger, and a
#    push made with GITHUB_TOKEN does not start a workflow. That is deliberate on GitHub's part,
#    to stop a workflow triggering itself forever, and it meant this deploy fired for a merge made
#    with a user token and silently did not for a merge made by a bot. Both happen here: the
#    delivery policy says a passing run merges itself, and the grid watch collector commits to
#    main on a cron. On 2026-08-12 a merged pull request left the live site on the previous
#    build with nothing reporting a failure, because nothing had failed. No run had started.
#
#    That is the worst shape a fault can take in an unattended system. The record said the change
#    shipped, every gate was green, and the site a reader loads was stale.
#
#    So deployment now begins only after the success-only `release` job downstream of `guards`
#    dispatches this workflow for main. User-token pushes start guards through its push trigger.
#    Collector workflows dispatch guards after their GITHUB_TOKEN push, because GitHub
#    deliberately suppresses workflow-to-workflow push events. The release job uses an explicit
#    workflow_dispatch too: unlike workflow_run chaining, GitHub permits that event from a
#    workflow token. The schedule remains the backstop, but it checks the current main SHA for a
#    successful aggregate guard result before it may deploy anything.
#    The release dispatch carries the exact guarded SHA. If main moves before Pages starts, the
#    verify job exits green without deploying; the newer commit's own guard run will dispatch its
#    release. The schedule is what makes a genuinely missed publish self-healing rather than
#    permanent. Deploying an unchanged site is a no-op for a reader, and the verify job below still
#    refuses to publish a docs/ that does not match a rebuild, so a redundant run cannot do harm.

on:
  schedule:
    # Every two hours. The pages this publishes carry comment deadlines and a daily grid
    # reading, so the cost of being stale is measured in hours rather than days.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      guarded_sha:
        description: Exact main commit whose guards dispatched this release; blank for recovery
        required: false
        type: string

permissions:
  contents: read
  checks: read
  pages: write
  id-token: write

# Never cancel a deploy in flight. A half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      # PINNED TO main, and that is required rather than tidy. A scheduled recovery or a dispatch
      # can begin while another collector is moving the branch. This workflow only ever publishes
      # main, so naming it is correct for every trigger and the exact-SHA proof below decides
      # whether that current commit is releasable.
      - uses: actions/checkout@v4
        with:
          ref: main

      # A GREEN STALE DISPATCH IS NOT A RED RELEASE. An older guard run can finish after main has
      # moved. Before this comparison, that completion launched Pages against the newer unguarded
      # head and created a failed release by design. It was safe and noisy. The newer head will
      # dispatch its own release after its own guards pass, so the stale request exits cleanly.
      - name: Select the guarded main commit
        id: target
        env:
          GUARDED_SHA: ${{ inputs.guarded_sha }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          if [ -n "$GUARDED_SHA" ] && [ "$GUARDED_SHA" != "$SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main advanced from guarded ${GUARDED_SHA} to ${SHA}; the newer guard run owns the release"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # THE EXACT SHA, NOT A GREEN RUN SOMEWHERE NEAR IT. Scheduled recovery has no input SHA,
      # so it selects current main here and still must prove that commit's aggregate guard result.
      - name: Full guards passed for this exact main commit
        if: steps.target.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=guards&filter=latest&per_page=1" \
            --jq '.check_runs[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "::error::main ${SHA} has no successful full guards result; refusing to deploy"
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.target.outputs.deploy == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - if: steps.target.outputs.deploy == 'true'
        run: python -m pip install --quiet --no-deps --requirement requirements.txt

      - name: The record passes its own gates
        if: steps.target.outputs.deploy == 'true'
        run: python3 scripts/site/docket_build.py --validate

      - name: The copy about to be published keeps the house rules
        if: steps.target.outputs.deploy == 'true'
        run: |
          # guards.yml runs this on every branch, and it was missing HERE, which is the one
          # place it actually gates a publish. A house-rule violation caught on a branch is a
          # note; the same violation caught at the deploy is the difference between a reader
          # seeing it and not. Quoted source text is exempt: rewriting a quotation to fit
          # house style would be falsifying it.
          python3 scripts/site/house_style_check.py

      - name: The published site is exactly what the ledgers produce
        if: steps.target.outputs.deploy == 'true'
        run: |
          # No --today. The check rebuilds using the date the committed site was BUILT with,
          # read from its own docket.json, because the question is "does docs/ say anything
          # the ledgers do not" and never "was docs/ built today". Passing the current date
          # here made every page report as changed the moment UTC rolled past midnight, and
          # this gate refused to publish a perfectly correct site every day for three days.
          python3 scripts/site/site_fresh_check.py || {
            echo "::error::docs/ does not match a rebuild. Refusing to deploy."
            exit 1
          }

  deploy:
    needs: verify
    if: needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # PINNED TO THE VERIFIED SHA. Main can move between jobs, and checking out its name again
      # would package a commit the verify job never examined.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/configure-pages@v5
        # enablement turns Pages on via the API if it is not already configured, so the site
        # does not sit behind a settings toggle nobody knows to flip. The workflow already
        # holds pages:write, which is the permission this needs.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy, with backoff
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry once
        if: steps.deployment.outcome == 'failure'
        id: retry1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry twice
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # TELL THE INDEX WHAT CHANGED, once the deploy has actually landed.
      #
      # AFTER the deploy and never before: submitting a url the crawler then fetches and finds
      # unchanged spends the request for nothing, and doing it on a failed deploy points a
      # crawler at the old page.
      #
      # ONLY WHAT CHANGED TODAY. IndexNow expects the delta. Sending all 150 urls on every
      # deploy when one page moved reads as abuse and earns 429s or quiet ignoring, so this
      # filters on the sitemap's own lastmod. The full set was submitted once by hand as a
      # seed and does not need repeating.
      #
      # NOT `strict`, so this can never red a deploy. The site is live either way and a crawl
      # hint is a courtesy on top of it. Google does not participate in IndexNow, so nothing
      # here is what reaches Google.
      - name: Tell the index what changed
        if: success()
        continue-on-error: true
        run: |
          git fetch origin main --depth=1 -q || true
          python3 scripts/site/indexnow.py --since "$(date -u +%F)"
