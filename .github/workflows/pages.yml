name: pages

# Publish docs/ to GitHub Pages on every merge to main that touches the site or the record it
# is built from.
#
# TWO THINGS HERE ARE NOT OBVIOUS AND BOTH ARE LOAD BEARING.
#
# 1. THE FRESHNESS GATE RUNS BEFORE THE DEPLOY. docs/ is a pure function of the ledgers, and
#    this is the last place that promise can be checked before it becomes a live page. If the
#    committed site does not match a rebuild, something was hand-edited or the ledgers moved
#    without a rebuild, and publishing either would put a claim on the internet that the record
#    does not support. Refusing to deploy is the correct failure.
#
# 2. THE DEPLOY RETRIES. GitHub's Pages API returns transient 5xx often enough that a single
#    attempt loses a day's publish for no reason, and an unattended pipeline has nobody to
#    press the button again.
#
# 3. IT DOES NOT DEPEND ON WHO PUSHED, and it used to. `push` was the only real trigger, and a
#    push made with GITHUB_TOKEN does not start a workflow. That is deliberate on GitHub's part,
#    to stop a workflow triggering itself forever, and it meant this deploy fired for a merge made
#    with a user token and silently did not for a merge made by a bot. Both happen here: the
#    delivery policy says a passing run merges itself, and the grid watch collector commits to
#    main on a cron. On 2026-08-12 a merged pull request left the live site on the previous
#    build with nothing reporting a failure, because nothing had failed. No run had started.
#
#    That is the worst shape a fault can take in an unattended system. The record said the change
#    shipped, every gate was green, and the site a reader loads was stale.
#
#    So there are now three triggers and only one of them cares about the actor:
#      push          the fast path, for a merge made with a user token
#      workflow_run  after the collector's cron, which is the usual way main moves
#      schedule      the backstop, which fires whatever else did or did not happen
#    The schedule is what makes a missed publish self-healing rather than permanent. Deploying an
#    unchanged site is a no-op for a reader, and the verify job below still refuses to publish a
#    docs/ that does not match a rebuild, so a redundant run cannot do harm.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ledger/**"
      - "scripts/site/**"
      - "config/brand.yaml"
      - "assets/geo/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [gridwatch]
    types: [completed]
  schedule:
    # Every two hours. The pages this publishes carry comment deadlines and a daily grid
    # reading, so the cost of being stale is measured in hours rather than days.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight. A half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # PINNED TO main, and that is required rather than tidy. Under `workflow_run` the default
      # ref is the SHA of the run that triggered this one, which for a collector that pushes is
      # the commit BEFORE its own write, so an unpinned checkout would faithfully publish the
      # state that existed just before the thing being published. This workflow only ever
      # publishes main, so naming it is correct for every trigger.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml

      - name: The record passes its own gates
        run: python3 scripts/site/docket_build.py --validate

      - name: The copy about to be published keeps the house rules
        run: |
          # guards.yml runs this on every branch, and it was missing HERE, which is the one
          # place it actually gates a publish. A house-rule violation caught on a branch is a
          # note; the same violation caught at the deploy is the difference between a reader
          # seeing it and not. Quoted source text is exempt: rewriting a quotation to fit
          # house style would be falsifying it.
          python3 scripts/site/house_style_check.py

      - name: The published site is exactly what the ledgers produce
        run: |
          # No --today. The check rebuilds using the date the committed site was BUILT with,
          # read from its own docket.json, because the question is "does docs/ say anything
          # the ledgers do not" and never "was docs/ built today". Passing the current date
          # here made every page report as changed the moment UTC rolled past midnight, and
          # this gate refused to publish a perfectly correct site every day for three days.
          python3 scripts/site/site_fresh_check.py || {
            echo "::error::docs/ does not match a rebuild. Refusing to deploy."
            exit 1
          }

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # PINNED TO main, and that is required rather than tidy. Under `workflow_run` the default
      # ref is the SHA of the run that triggered this one, which for a collector that pushes is
      # the commit BEFORE its own write, so an unpinned checkout would faithfully publish the
      # state that existed just before the thing being published. This workflow only ever
      # publishes main, so naming it is correct for every trigger.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        # enablement turns Pages on via the API if it is not already configured, so the site
        # does not sit behind a settings toggle nobody knows to flip. The workflow already
        # holds pages:write, which is the permission this needs.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy, with backoff
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry once
        if: steps.deployment.outcome == 'failure'
        id: retry1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry twice
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
