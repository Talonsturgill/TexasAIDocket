  <template id="provenance-template"><details><summary>Why this concept for Star Precision? Public sources and limits</summary><p>Star Precision publicly describes a turnkey offering across fabrication and machining through electronics and final assembly. Its pages identify fabrication at Brystone. Machining and electronics share Brittmoore with assembly. That supports exploring coordinated revision review. It does not confirm a missing capability or an internal problem.</p><ul><li><a href="https://star-precision.com/services/turnkey-manufacturing/" target="_blank" rel="noopener noreferrer">Turnkey manufacturing</a> covers cross-discipline design changes and two work locations.</li><li><a href="https://star-precision.com/services/electro-mechanical-assembly/" target="_blank" rel="noopener noreferrer">Electro-mechanical assembly</a> brings an enclosure and populated boards together with a harness and functional test.</li><li><a href="https://star-precision.com/services/manufacturing-support/" target="_blank" rel="noopener noreferrer">Manufacturing support</a> describes existing SolidWorks and GibbsCAM with DFM expertise.</li><li><a href="https://star-precision.com/services/pcb-assembly/" target="_blank" rel="noopener noreferrer">PCB assembly</a> describes existing MES tracking. Interfaces and change-review features remain unverified.</li><li><a href="https://star-precision.com/projects/" target="_blank" rel="noopener noreferrer">Their published projects</a> are their work. Those projects are not Texas AI Docket portfolio evidence.</li></ul><p>Source pages checked October 22nd, 2026. This is an independent concept. No affiliation or endorsement is implied. It does not diagnose Star Precision's internal workflow. Existing PDM or PLM software may already cover this coordination. ERP and MES or quality workflows may already cover it. All source records and corrections were created for this synthetic story. No real drawings or private customer information are used. No CAD or DFM decision is made. The concept does not assess physical compatibility or safety or compliance.</p></details></template>
  <script type="module">// Pure deterministic metadata checks. No inference, code evaluation or network access.
const ROLES = {

  quality:{name:'Final quality review',scope:'Assembly instruction + test procedure'}

const SCENARIOS = {

  amendment:{label:'02 · Proposed revision B',description:'25 requested units and IF-02. Harness and assembly/test evidence still need review.'},
  quantity:{label:'03 · Quantity disagreement',description:'Amendment requests 25; the proposed manifest still says 10. Both values are preserved.'},
  missing:{label:'04 · Missing enclosure evidence',description:'The graph requires ENC-100, but its declared source is absent.'},

const clone = v => structuredClone(v);

function cite(source,line=1,field=''){return {source_id:source,source_line:line,field};}
function jsonLine(raw,key,value){const lines=raw.split('\n');let i=lines.findIndex(l=>l.includes(`"${key}": ${JSON.stringify(value)}`));return i<0?1:i+1;}

function makeInput(scenario,fixtures){

  const input={scenario,manifest_id:baseline?'manifest-A.json':'manifest-B.json',request_id:baseline?'request-A.txt':'amendment-B.txt',slots:{enclosure:baseline?'enclosure-A.txt':'enclosure-B.txt',harness:'harness-A.txt',assembly:'assembly-test-A.txt'},sources:clone(fixtures)};

function validate(input){

  }

  if(!Array.isArray(m.required_review_roles)||canonical([...m.required_review_roles].sort())!==canonical(Object.keys(ROLES).sort()))add('manifest:roles','Invalid review roles','All three illustrative review functions are required.',[cite(input.manifest_id)]);
  for(const node of m.graph){if(!Array.isArray(node.dependency_ids)||node.dependency_ids.some(id=>!graphSet.has(id)))add(`graph:${node.component_id}`,'Undeclared graph dependency',`${node.component_id} refers to a dependency without declared evidence.`,[cite(input.manifest_id,jsonLine(raw,'component_id',node.component_id))],[node.component_id]);}

function affectedNodes(review,issue){

function lineExcerpt(source,citations){const raw=session.input.sources[source];if(raw===undefined)return '';const lines=raw.split('\n'),targets=citations.map(c=>c.source_line);const wanted=new Set();for(const n of targets)for(let i=Math.max(1,n-1);i<=Math.min(lines.length,n+2);i++)wanted.add(i);return `<div class="source-block"><div class="source-block-head">${esc(source)} · synthetic fixture</div><div class="source-lines" tabindex="0" aria-label="Source excerpt ${esc(source)}">${[...wanted].sort((a,b)=>a-b).map(n=>`<div class="source-line ${targets.includes(n)?'highlight':''}"><span class="ln">${n}</span><span class="source-text">${esc(lines[n-1])}</span></div>`).join('')}</div></div>`;}
function inspector(r,issue,affected){
  const node=r.graph.find(n=>n.component_id===selectedComponent);const doc=node&&r.manifest?.documents.find(d=>d.document_id===node.document_id);const rec=doc&&r.records[doc.document_id];
  let title,explanation,citations,repair;
  if(sourceFocus){title='Source evidence';explanation='Exact local fixture lines. Content is displayed as text; it cannot set approval state.';citations=[cite(sourceFocus.id,sourceFocus.line)];}
  else if(issue){title=issue.title;explanation=issue.component_ids.length?'Declared downstream review path. Selection follows only the fixture dependency graph.':'Source-level exception. No component impact is inferred.';citations=issue.sources;repair=issue.repair;}
  else if(node){title=`${node.label} · ${node.component_id}`;explanation=`Declared dependencies: ${node.dependency_ids.join(', ')||'none'}. ${rec?`Own required revision ${doc.revision}; current evidence ${rec.data.revision}.`:'No new evidence invented.'}`;citations=rec?[cite(rec.source_id,rec.source_line)]:[cite(session.input.manifest_id,jsonLine(session.input.sources[session.input.manifest_id],'component_id',node.component_id))];}
  else{title=r.issues.length?'Choose a review issue':'Declared evidence reconciled';explanation='Inspect sources, record all three review acknowledgements, then approve this review packet. Engineering decisions remain with staff.';citations=[cite(session.input.manifest_id,jsonLine(session.input.sources[session.input.manifest_id],'packet_revision',r.manifest?.packet_revision))];}
  const groups={};for(const c of citations)(groups[c.source_id]??=[]).push(c);const editSource=citations.find(c=>c.source_id!==session.input.manifest_id)?.source_id||citations[0]?.source_id;
  return `<section class="panel inspector" aria-labelledby="source-title"><div class="panel-head"><div><div class="section-no">SOURCE INSPECTOR</div><h2 id="source-title" tabindex="-1">Follow the evidence</h2><p class="mini">File and line citations, not generated claims.</p></div></div><div class="inspector-title"><b>${esc(title)}</b><span class="mini">${esc(explanation)}</span></div>${issue&&affected.length?`<div class="trace">${affected.filter(id=>id!=='AT-100').map((id,i)=>`${i?'→':''}<span>${esc(id)}</span>`).join('')}</div>`:''}${Object.entries(groups).map(([id,cs])=>lineExcerpt(id,cs)).join('')}${node?`<div class="dependency-detail">Evidence document: <code>${esc(node.document_id||'packet root')}</code><br>Work area: ${esc(node.work_area)} · illustrative fixture metadata.</div>`:''}<div class="resolution">${repair?`<p>Resolve by attaching this explicit corrected metadata fixture. This does not validate the design.</p><button class="btn repair" data-action="repair" data-repair="${esc(repair.type)}">${esc(repair.label)} <span aria-hidden="true">↗</span></button>`:`<p>Only corrected evidence can clear a source conflict. A review acknowledgement cannot clear it.</p>`}</div>${editSource?`<details class="edit-details" id="edit-details"><summary>Edit source · test approval invalidation</summary><label for="source-editor">${esc(editSource)}</label><textarea id="source-editor" spellcheck="false">${esc(session.input.sources[editSource])}</textarea><button class="btn" data-action="apply-edit" data-source="${esc(editSource)}">Apply input edit &amp; revalidate</button><p class="mini">Every input edit resets acknowledgements and invalidates approval, including whitespace changes.</p></details>`:''}</section>`;
}
function render(){
  const active=document.activeElement,previous=active?.id,focusData=active?.dataset?{...active.dataset}:{};const r=session.review(),issue=currentIssue(r),affected=affectedNodes(r,issue),ackCount=Object.values(session.acknowledgements).filter(Boolean).length,approved=!!session.approval,clear=!r.issues.length,ready=clear&&ackCount===3;
  const manifest=r.manifest;
  const status=approved?'APPROVED · REVIEW PACKET':clear?(ready?'READY FOR HUMAN APPROVAL':'HUMAN REVIEW REQUIRED'):'REVIEW REQUIRED';
  const reqId=session.input.request_id,base=parseRecord(FIXTURES['request-A.txt'],'request-A.txt'),proposed=r.request;const rows=[['packet_revision','Packet','A',proposed.data.packet_revision],['requested_quantity','Requested units',base.data.requested_quantity,proposed.data.requested_quantity],['declared_interface_id','Interface identifier',base.data.declared_interface_id,proposed.data.declared_interface_id]];
  $('#app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="m12 1.8 2.7 6.4 6.9.6-5.2 4.5 1.6 6.7-6-3.5-6 3.5 1.6-6.7L2.4 8.8l6.9-.6Z"/></svg></div><div class="brand-name">TEXAS AI<br>DOCKET</div></div><div class="top-meta"><span>PREPARED FOR <strong>STAR PRECISION · HOUSTON</strong></span><span class="outline-tag">INDEPENDENT CONCEPT</span></div></header><section class="hero"><div class="hero-message"><div class="eyebrow">Turnkey Revision Readiness</div><h1>One revision.<br><span>The whole build.</span></h1><p class="hero-copy"><strong>Enclosure. Board. Harness. Assembly &amp; test.</strong><br>Follow one fictional customer amendment across a complete product, with source evidence behind every review decision.</p></div><div class="hero-art"><div class="drawing-label"><span>TXD-100 / SYNTHETIC ASSEMBLY</span><span>CONCEPT SHEET 01</span></div>${diagram}<div class="drawing-foot"><span>BRACKET + ENCLOSURE + PCBA + HARNESS<br>→ ASSEMBLY INSTRUCTION + TEST PROCEDURE</span><span><b>METADATA REVIEW</b><br>NO ENGINEERING VALIDATION</span></div></div></section><div class="synth"><span class="synth-dot" aria-hidden="true"></span><b>SYNTHETIC DEMONSTRATION</b><span>Deterministic rules, not live AI. No Star Precision data, engineering validation or production connection.</span></div><div class="toolbar"><div class="scenario-group"><label class="scenario-label" for="scenario">Choose a review scenario</label><select id="scenario">${Object.entries(SCENARIOS).map(([id,s])=>`<option value="${id}" ${session.input.scenario===id?'selected':''}>${esc(s.label)}</option>`).join('')}</select></div><div class="story-steps">01 Inspect <span>→</span> 02 Reconcile <span>→</span> 03 Acknowledge <span>→</span> 04 Approve</div></div><div class="state-banner ${clear?'ready':''}" id="packet-status" data-status="${approved?'approved':clear?'clear':'blocked'}"><div class="state-main"><div class="state-icon" aria-hidden="true">${clear?'✓':'!'}</div><div><div class="state-label">${status}</div><p class="state-note">${esc(clear?`Declared evidence agrees with packet ${manifest?.packet_revision||'?'}. Human review remains separate from engineering clearance.`:SCENARIOS[session.input.scenario].description)}${approved?' Approval applies only to this content version.':''}</p></div></div><div class="state-counts"><div><b id="conflict-count">${r.issues.length}</b><small>Source conflicts</small></div><div><b id="ack-count">${ackCount}/3</b><small>Reviews acknowledged</small></div></div></div><main id="workspace" class="review-grid"><section class="panel assembly-map" aria-labelledby="map-title"><div class="panel-head"><div><div class="section-no">01 / ASSEMBLY MAP</div><h2 id="map-title">One connected build</h2><p class="mini">Declared dependencies, linked to their evidence.</p></div></div><div class="product-name"><b>TXD-100</b><span class="mini">Bench Instrument Housing<br>Fictional, non-safety-critical product</span></div><div class="component-list">${r.graph.filter(n=>n.component_id!=='TXD-100').map((n,i)=>{const d=manifest.documents.find(d=>d.document_id===n.document_id),rec=r.records[n.document_id],highlight=affected.includes(n.component_id);return `<button class="component ${highlight?'selected':''} ${selectedComponent===n.component_id?'focused':''}" data-action="component" data-component="${esc(n.component_id)}" aria-pressed="${selectedComponent===n.component_id}"><span class="node-symbol" aria-hidden="true">${['EN','BR','PC','HR','AI','TP'][i]||'·'}</span><span class="component-info"><b>${esc(n.label)}</b><small>${esc(n.component_id)} · ${rec?`rev ${esc(rec.data.revision)}`:'MISSING'}</small></span><span class="component-state">${highlight?'REVIEW PATH':d&&rec&&d.revision===rec.data.revision?'MATCH':'CHECK'}</span></button>`;}).join('')}</div><div class="map-note">Connections are explicitly declared in <span class="source-link">${esc(session.input.manifest_id)}</span>. Affected items are review tasks, not proven engineering defects.</div></section><section class="panel change-inbox" aria-labelledby="change-title"><div class="panel-head"><div><div class="section-no">02 / CHANGE INBOX</div><h2 id="change-title">A → ${esc(proposed.data.packet_revision||'?')} / what changed?</h2><p class="mini">Request comparison and proposed manifest evidence.</p></div><span class="badge ${clear?'ok':''}">${clear?'✓ CONSISTENT':'! REVIEW'}</span></div><div class="compare"><div class="compare-head"><div><span>BASELINE REQUEST</span><strong>Prototype A</strong></div><div><span>PROPOSED REQUEST</span><strong>Revision ${esc(proposed.data.packet_revision||'?')}<em>FOR REVIEW</em></strong></div></div>${rows.map(([key,label,old,val])=>`<div class="comparison-row"><div class="comparison-cell"><span class="key">${label}</span>${esc(old)}<br>${sourceButton('request-A.txt',base.lines[key])}</div><div class="comparison-cell ${old!==val?'changed':''}"><span class="key">${label}</span>${esc(val||'missing')}${old!==val?'<span class="change-marker">changed</span>':''}<br>${sourceButton(reqId,proposed.lines[key])}${key==='requested_quantity'?`<div class="mini">Manifest: ${esc(manifest?.requested_quantity??'unreadable')} units · ${sourceButton(session.input.manifest_id,manifest?jsonLine(session.input.sources[session.input.manifest_id],'requested_quantity',manifest.requested_quantity):1,'source ↗')}</div>`:''}</div></div>`).join('')}</div><div class="issues-heading"><h3>Source exceptions</h3><span class="badge ${clear?'ok':''}">${r.issues.length} blocking</span></div><div class="issues">${r.issues.map((i,n)=>`<button class="issue ${issue?.id===i.id?'active':''}" data-action="issue" data-issue="${esc(i.id)}" aria-pressed="${issue?.id===i.id}"><div class="issue-top"><span>EXCEPTION ${String(n+1).padStart(2,'0')}</span><span>BLOCKING ↗</span></div><h3>${esc(i.title)}</h3><p>${esc(i.detail)}</p><div class="issue-sources">${i.sources.map(s=>esc(`${s.source_id}:${s.source_line}`)).join(' · ')}</div></button>`).join('')||'<div class="clear-state"><b>✓ No declared source conflicts</b>Metadata agrees with each document’s own required revision. Staff acknowledgement and explicit approval are still required.</div>'}</div><div class="unchanged-note"><strong>Different letters can be correct.</strong> BRK-100 and PCB-100 stay at revision A because this manifest requires A. Packet B does not force every component to B.</div></section>${inspector(r,issue,affected)}<section class="panel review-board" aria-labelledby="review-title"><div class="panel-head"><div><div class="section-no">03 / REVIEW BOARD</div><h2 id="review-title">Three reviews. One packet.</h2><p class="mini">Illustrative functions, not Star Precision’s verified org chart or permissions. Acknowledgement is not technical clearance.</p></div></div><div class="review-lanes">${Object.entries(ROLES).map(([id,role],i)=>{const count=r.issues.filter(is=>is.component_ids.some(c=>manifest?.documents.some(d=>d.component_id===c&&d.required_review_role===id))||(!is.component_ids.length)).length;return `<div class="lane"><div class="lane-num"><span>REVIEW 0${i+1}</span><span>${session.acknowledgements[id]?'✓ RECORDED':'○ PENDING'}</span></div><h3>${role.name}</h3><p>${role.scope}</p><p>${id==='quality'?'Includes declared downstream assembly/test dependencies.':'Review tasks follow declared component evidence.'}</p><label class="ack"><input type="checkbox" id="ack-${id}" data-role="${id}" ${session.acknowledgements[id]?'checked':''}><span>Review task acknowledged.</span></label><div class="lane-note">${count?`${count} source conflict${count>1?'s':''} still blocking`:'No direct source conflicts'}</div></div>`;}).join('')}</div></section><section class="panel handoff" aria-labelledby="handoff-title"><div class="panel-head"><div><div class="section-no">04 / APPROVED HANDOFF</div><h2 id="handoff-title">Review packet only</h2><p class="mini">Local sandbox · no manufacturing release</p></div></div><div class="handoff-body"><div class="handoff-state" id="handoff-state">${approved?'✓ APPROVAL RECORDED':`○ CONTENT VERSION ${session.version} · NOT APPROVED`}</div><p id="approval-reason">${r.issues.length?'Resolve all source conflicts before approval. Acknowledgements alone cannot clear them.':ackCount<3?'All declared evidence agrees. Record all three review acknowledgements before approval.':approved?'Any content edit will invalidate this approval and block export.':'Ready for an explicit human decision on this review packet.'}</p>${approved?`<div class="hash">VERSION ${session.approval.content_version} / SHA-256<br>${session.approval.fingerprint}</div>`:''}<div class="handoff-actions"><button class="btn primary" id="approve" data-action="approve" ${!ready||approved||busy?'disabled':''}>${approved?'✓ Current packet approved':'Approve current review packet'}</button><button class="btn" id="commit" data-action="commit" ${!approved||busy?'disabled':''}>${session.records.some(x=>x.fingerprint===session.approval?.fingerprint)?'Replay handoff · deduplicated':'Record sandbox handoff'}</button><button class="btn" id="export" data-action="export" ${!approved||!session.records.some(x=>x.fingerprint===session.approval?.fingerprint)||busy?'disabled':''}>Export review packet ↓</button></div><p><span id="record-count">${session.records.length}</span> immutable sandbox record${session.records.length===1?'':'s'} in this session. Reloading starts a fresh session.</p></div></section></main><details class="panel event-panel"><summary>Sandbox event history · ${session.events.length} events / ${session.resolved.length} resolved exceptions</summary><ol class="event-list">${session.events.map(e=>`<li><b>${String(e.sequence).padStart(2,'0')}</b><span>v${e.content_version} / ${esc(e.type)}<br>${esc(e.detail)}</span></li>`).join('')}</ol></details>${WALKTHROUGH_PDF_DATA_URL?`<div class="walkthrough-strip"><div><strong>Take the review story with you.</strong><span>A concise walkthrough and bounded pilot outline.</span></div><a class="btn" id="download-walkthrough" href="${WALKTHROUGH_PDF_DATA_URL}" download="Star-Precision-Client-Walkthrough.pdf" rel="nofollow noreferrer">Download the concept walkthrough <span aria-hidden="true">↓</span></a></div>`:''}<footer class="provenance">${PROVENANCE_HTML}<div class="footer-mark">TEXAS AI DOCKET / CONCEPT 01<br>STAR-PRECISION.COM / HOUSTON<br>INDEPENDENT SYNTHETIC CONCEPT</div></footer></div><div id="notice" class="notice" role="status" aria-live="polite"></div>`;
  if(previous)document.getElementById(previous)?.focus({preventScroll:true});
  else if(focusData.action){const target=[...document.querySelectorAll('[data-action]')].find(el=>Object.entries(focusData).every(([k,v])=>el.dataset[k]===v));(target||document.getElementById('source-title'))?.focus({preventScroll:true});}
}
document.addEventListener('change',e=>{if(e.target.id==='scenario'){session=new ReviewSession(e.target.value,FIXTURES);selectedIssue=session.review().issues[0]?.id||null;selectedComponent=null;sourceFocus=null;render();notify('Loaded synthetic scenario. This starts a fresh sandbox session.');}else if(e.target.dataset.role){session.acknowledge(e.target.dataset.role,e.target.checked);render();notify('Acknowledgement recorded. Source conflicts still require corrected evidence.');}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-action]');if(!b||b.disabled||busy)return;const action=b.dataset.action;let finalMessage=null;
  try{
    if(action==='issue'){selectedIssue=b.dataset.issue;selectedComponent=null;sourceFocus=null;render();if(innerWidth<650)$('#source-title').scrollIntoView({behavior:'instant',block:'start'});}
    if(action==='component'){selectedComponent=b.dataset.component;selectedIssue=null;sourceFocus=null;render();}
    if(action==='source'){sourceFocus={id:b.dataset.source,line:Number(b.dataset.line)||1};selectedComponent=null;render();}
    if(action==='repair'){session.correct(b.dataset.repair);selectedIssue=session.review().issues[0]?.id||null;selectedComponent=null;sourceFocus=null;render();notify('Corrected fixture attached. Revalidated; all review acknowledgements reset.');}
    if(action==='apply-edit'){const raw=$('#source-editor').value;session.editSource(b.dataset.source,raw);selectedIssue=session.review().issues[0]?.id||null;render();notify('Input edited. Approval invalidated; export blocked until review and reapproval.');}
    if(['approve','commit','export'].includes(action)){
      busy=true;
      if(action==='approve'){await session.approve();finalMessage='Human approval recorded for this review packet version only.';}
      if(action==='commit'){const result=await session.commit();finalMessage=result.duplicate?'Existing sandbox record returned. No duplicate created.':`${result.record.sandbox_record_id} recorded. This is not manufacturing release.`;}
      if(action==='export'){const packet=await session.exportPacket(),blob=new Blob([JSON.stringify(packet,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`SYNTHETIC-REVIEW-PACKET-${packet.sandbox_record_id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Synthetic REVIEW PACKET exported. No manufacturing release or production instruction.');}
    }
  }catch(error){finalMessage=error.message;}finally{busy=false;if(['approve','commit'].includes(action))render();if(finalMessage)notify(finalMessage);}
});
// Read-only state access for retained browser assertions. All mutations use visible controls.
globalThis.demoInspection=()=>({input:structuredClone(session.input),review:session.review(),version:session.version,approval:session.approval,records:session.records,events:session.events,acknowledgements:session.acknowledgements});
render();
</script>
