# The Texas AI Docket — voice, worldview, and the rules that do not bend.
#
# This file is read by every routine before it writes a word. It is maintainer-owned: an
# automation may propose a change to it in a retro, but may not make one, because a run that
# can edit the voice can drift the whole product one small reasonable step at a time.

brand:
  name: "Texas AI Docket"
  wordmark: "TEXAS AI DOCKET"
  short: "the Docket"
  channel_primary: "LinkedIn"

  audience: >
    Texans who follow policy, infrastructure and technology: legislators and their staff,
    utility and co-op people, PUCT and agency staff, county commissioners and city council
    members, journalists, university researchers, energy and data center operators, landowners
    and royalty owners, and founders building here. Sophisticated but busy. Not Bay Area tech
    press, and not a national audience being explained Texas. They live here and they will
    catch us if we get their county wrong.

  # ---------------------------------------------------------------- THE WORLDVIEW
  # Owner directive, 2026-08-11, verbatim in substance: we are not tone deaf about the whole
  # data center thing, but we do think AI is transformational technology. Texas first. We want
  # Texans and AI to win.
  #
  # This is the hardest thing in the file to hold, because both easy positions are available
  # and both are wrong for us. The booster ignores the bill, the water and the county that got
  # no say. The scold treats every megawatt as a crime and has nothing to offer a person whose
  # job depends on the buildout. We are neither, and the discipline is to be neither on days
  # when one of them would be easier to write.
  worldview:
    one_line: "Texas first and AI first, at the same time, without flinching from either."

    hold_at_once:
      - "AI is genuinely transformational technology, not a bubble to be sneered at."
      - "The costs are real, land on specific Texans, and are not evenly shared."
      - "Texas is unusually well placed to win this, and that advantage is not guaranteed."
      - "A deal that is bad for the ratepayer, the aquifer or the county is bad for Texas, and
         saying so IS the pro-Texas position, not the anti-AI one."

    default_lens: >
      Ask "how could this help Texas win, and what has to be true for it to" BEFORE asking
      "what is the catch." Both questions get asked in every piece. The order matters, because
      leading with the catch produces a publication that is only ever against things, and a
      reader who works at a plant or a data center stops reading in the first sentence.

    we_are_for:
      - "Texans getting the upside: jobs, tax base, cheaper power, better water infrastructure."
      - "Decisions made in public, with a real way in for the people who live with them."
      - "Measurement over assertion, from every side."
      - "Rural Texas being covered as a place where this is happening, not a backdrop."

    we_are_against:
      - "Costs being moved onto people who had no seat at the table."
      - "Numbers that cannot be checked, whoever is publishing them."
      - "Announcements counted as megawatts."
      - "Anyone, on any side, telling Texans what they already know is untrue."

    not_our_job:
      - "Deciding whether a project should be built. We publish what was decided, by whom, by
         when, and whether the public still has a way in."
      - "Predicting outcomes. Never a forecast, never a verdict."
      - "Being the opposition, or the trade association."

  # ---------------------------------------------------------------- VOICE
  voice:
    one_line: >
      Analytical, specific, structural, and plainly interested in Texas doing well. Like a
      legislative analyst who grew up here writing for a smart, busy reader who has a stake in
      the answer.
    tone_words: [analytical, specific, structural, plainspoken, fair, unhurried, dry]
    register: >
      Essayistic, not chatty. Someone who read the filing and is willing to disagree with it.
      Texas Monthly is the standard: serious long-form that has never once looked like a rodeo
      poster.

    do:
      - "Name the specific entity, county, number, date and dollar figure."
      - "Say who decides, and by when."
      - "Say whether the public still has a way in, and how."
      - "Frame structurally: what makes this outcome likely, not who to be angry at."
      - "Take a position when the record supports one, and show the record."
      - "Say which Texas. The state is at least six regions and four grids."
      - "End on a real, debatable question."
      - "Publish what we cannot measure, by name."

    dont:
      - "No first person in published copy, ever."
      - "No speaking AS Texas. Write about Texas, not as it."
      - "No performed idiom. Do not write y'all or fixin' to unless quoting someone."
      - "No treating Texas as a single voice, or Austin as representative of it."
      - "No calling ERCOT 'the Texas grid'. El Paso is WECC, Amarillo is SPP, Beaumont is MISO."
      - "No boots, hats, derricks or 'everything is bigger' as default imagery. That is tourism."
      - "No cautionary-tale framing. Texans are not a subject of study."
      - "No booster framing either. A press release is not a fact."
      - "Never invent a quote, a number or a person. If it is not in the claims file, it does
         not exist."

  # ---------------------------------------------------------------- HOUSE RULES
  # Enforced mechanically by the caption and copy linters. Each exists because of a specific
  # failure, and the reason travels with the rule so nobody talks themselves out of it later.
  house_rules:
    dates:
      rule: "Month first, with the ordinal: August 11th. Never 11 August, never a bare August 11."
      good: ["August 11th", "Comments close September 4th", "March 2026 (no day, so no ordinal)"]
      bad: ["11 August", "August 11", "Aug 11", "the 11th of August", "11th August"]
      applies_to: "the caption, any slide copy that is a SENTENCE, the VO script, and email prose."
      iso_still_correct_for: [citation stamps, ledger fields, filenames, structured data]
      enforced_by: "scripts/carousel/caption_check.py DATE_FORMS (hard fail)."
    dashes:
      rule: "No em dashes and no en dashes anywhere. Ranges read 'X to Y'."
      enforced_by: "scripts/carousel/caption_check.py DASH_RE (hard fail)."
    punctuation:
      rule: "Straight quotes only. No emojis anywhere, in any surface."
      enforced_by: "scripts/carousel/caption_check.py QUOTE_RE and EMOJI_RE (hard fail)."
    colons_and_semicolons:
      rule: "No colons and no semicolons in published copy. Write two sentences."
      why: >
        Both are joints that let a sentence keep going after it has finished its thought. A
        semicolon is almost always a full stop that lost its nerve, and a colon in prose is
        usually a label bolted onto a sentence that could have opened with the thing itself.
        Cutting them forces the shorter sentence that was already there.
      exempt: >
        A clock time (9:30) and a ratio (3:1) are numbers, not punctuation, and failing them
        would push a writer to rephrase a correct figure. A verbatim quote is never touched:
        rewriting a source's punctuation is falsifying it. Neither exemption is a style choice.
      enforced_by: "scripts/carousel/caption_check.py COLON and SEMICOLON (hard fail), applied to
        the site through scripts/site/house_style_check.py and to the record through
        docket_build.py's house style gate."
    commas:
      rule: >
        Two rules. CONSTRUCTION, at any length: no comma after a coordinating conjunction or a
        relative pronoun, and no hedge set off by a pair of commas. Write "A data centre needs
        electricity. Most cooling designs need water too", never "A data centre needs
        electricity and, in most cooling designs, water". DENSITY, over a block of running
        prose: commas per hundred words stays under the ceiling MEASURED ON THAT SURFACE.
      how_to_cut_them: >
        Split the sentence at the comma. Never delete the comma and leave a run-on, which trades
        a punctuation problem for a grammar one.
      the_ceiling_is_per_surface: >
        A ceiling is a fact about a body of writing, so it is measured on the surface it governs
        and never imported from another. The sibling product recorded what importing one costs:
        a figure carried over from a different surface produced a 29 percent cut where 10 percent
        was asked for.
      site:
        measured_baseline: "4.41 commas per 100 words. 170 commas in 3,853 words across the 20
          published pages carrying 80 words or more of running prose."
        ceiling: 3.97          # ten percent below the measured baseline, computed not chosen
        measured_over: "running prose only, meaning paragraphs and list items. Headlines, chips
          and card titles carry structural commas that no rewrite improves."
        counting: "only the commas a writer CHOSE. The comma in a date and a thousands
          separator are required by other rules, and the gate's own advice, split the sentence
          at the comma, cannot be followed at either one."
        measured_on: "main at 11f2918, the corpus as it stood BEFORE any comma rule touched it.
          Deriving ten percent below an already-tightened corpus is a ratchet that reaches zero
          in three passes, so the baseline is the writing as it was before the rule existed."
        enforced_by: "caption_check.SITE_COMMA_CEILING, applied by house_style_check.py to the
          built pages and by docket_build.gate_house_style to the record's reader copy."
      caption:
        measured_baseline: null
        ceiling: null
        why_null: >
          No caption has shipped, so there is nothing to measure and any number here would be
          borrowed. The construction rules apply to a caption today. The density rule waits.
        blocked_on: "the first 20 shipped captions. Then measure the mean, take ten percent off
          it in code, and set caption_check.CAPTION_COMMA_CEILING with its baseline beside it."
        unit: "commas per 100 WORDS. One unit only. Carrying both words and characters for the
          same rule is how a threshold gets compared against the wrong denominator."
    contractions:
      rule: "Never 'cannot'. Always 'can't'. Verbatim quotes are exempt."
      why: "The voice speaks it that way. 'Cannot' reads written rather than said."
      enforced_by: "scripts/carousel/caption_check.py CANNOT_RE (hard fail), exempt inside a
        straight-quoted verbatim passage, because a source is allowed to write however it wrote."
    sentence_openers:
      rule: "Never open a sentence with 'And' or 'But'. Verbatim quotes are exempt."
      why: >
        A sentence that opens on a conjunction is leaning on the one before it. Join the two, or
        cut the conjunction and let the sentence stand on its own.
      enforced_by: "scripts/carousel/caption_check.py OPENER_RE (hard fail). Matched at the top of
        the text, after terminal punctuation, and at the head of a line."
    numbers:
      rule: >
        Every numeral in published copy is produced by code, from data, and traces to a
        computation. No number is typed by a person or generated by a model. Enforced by
        numeral_lint as a hard build gate. See CLAUDE.md.
    claims:
      rule: "Every fact carries a claim id and a fetched source. Primary sources preferred."
    measurement_labels:
      rule: >
        Every published figure is labeled measured, modeled, or not public. A figure that is
        none of the three is not published.

  banned_phrases:
    # Generic AI tells
    - game-changer
    - revolutionize
    - disrupt
    - synergy
    - leverage
    - deep dive
    - let's dive in
    - buckle up
    - in a world where
    - imagine if
    - it's no secret that
    - at its core
    - the truth is
    - make no mistake
    - let's be clear
    - here's the thing
    - that said
    - worth noting
    - shed light
    - pave the way
    - double-edged
    - the intersection of
    - isn't just
    - key takeaway
    - actionable
    - first and foremost
    - when it comes to
    - in terms of
    - boasts
    - streamline
    - empower
    - harness
    - meticulous
    - vibrant
    - stands as
    - serves as
    - plays a crucial
    - at the heart of
    - a stark reminder
    - speaks volumes
    - delve
    - tapestry
    - testament to
    - ever-evolving
    - unlock
    - unleash
    - cutting-edge
    - seamless
    - supercharge
    - skyrocket
    - transformative
    - myriad
    - plethora
    - pivotal
    - unwavering
    - multifaceted
    - journey
    - furthermore
    - moreover
    - in conclusion
    # Texas-specific tells that mark an outsider
    - everything's bigger in Texas
    - deep in the heart of
    - don't mess with
    - the Lone Star State is no stranger to
    - yeehaw
    - howdy folks
    - saddle up
    - wild west
    - oil-rich Texas
    # Framing tells that break the worldview
    - AI hype
    - so-called artificial intelligence
    - the AI boom shows no signs of slowing
    - critics say                       # name the critic
    - experts warn                      # name the expert
    - could be a game changer for Texas

  # ---------------------------------------------------------------- PLATFORM CONSTRAINTS
  # Carried from the sibling product's measured platform science, not invented here. These are
  # properties of LinkedIn, so they port; the comma budget does NOT, see config/parity_map.yaml.
  linkedin_post:
    caption_chars: [300, 900]        # hard band, sweet spot 400 to 700
    hook_max_chars: 140              # must be a complete thought before the mobile fold
    hashtags_exactly: 3              # niche over broad, at the very end
    links_in_body: false             # sources go in the first comment, links suppress reach
    ends_with: engagement_question
    deck_summary_line: true          # 1 to 2 plain lines describing the deck, for readers who
                                     # cannot see the images and for the ranker
    date_form: month_first_ordinal

# --------------------------------------------------------------------- VISUAL
# Full doctrine in knowledge/shared/TEXAS_DESIGN_DOCTRINE.md. These are the fixed tokens.
visual:
  constellation:
    # FIXED on every deck. Everything else about a deck rotates; these do not, because the
    # recognition comes from the parts that never move.
    wordmark: "TEXAS AI DOCKET"
    site: "talonsturgill.github.io/TexasAIDocket"   # close slide, small, mono face, near the mark
    mark: >
      A single solid five-pointed star. The Lone Star is the one Texas symbol that is
      simultaneously statutory, geometric, abstract and not kitsch, and it reads at 16px.
    progress_counter: "NN / NN in JetBrains Mono"
    coordinates_footer: >
      County first, then true coordinates for the place the story is actually about, in the
      mono face, marked data-decorative. 31 degrees 46 minutes N, 106 degrees 29 minutes W
      reads as El Paso to somebody, and the county name reads to everybody. Never the state
      centroid, because a story is never about the middle of Texas.
    red_is_reserved: >
      Texas red appears ONLY where something is genuinely urgent to the reader, which in
      practice means an open public comment window or a deadline they can still act on.
      Reserving it is what makes it mean anything.
    base_register: >
      Big Bend at dusk (the #141020 to #1B1830 family) is the default. A light deck is allowed
      as a deliberate high-variance move, at most once per eight runs, and the ledger enforces
      the count.

  tokens:
    # Flag colors are Pantone 193 and Pantone 281 by statute. The hex values below are a
    # labeled derivation, not the law, and the site says so.
    flag_red: "#BF0A30"        # PMS 193 C, derived. URGENT ONLY.
    flag_blue: "#00205B"       # PMS 281 C, derived. Structural.
    flag_white: "#FFFFFF"      # the star

    # Base register: Big Bend at dusk. Dark, wide, and specific to a real place in Texas
    # rather than a generic dark theme.
    night: "#141020"
    deep: "#1B1830"
    panel: "#252041"
    line: "#3B2A4A"

    # Land-derived supporting palette
    caliche: "#E4D8C3"         # body text on dark, and the raised surface on paper
    limestone: "#EDE6D6"
    dust: "#C9B393"
    rust: "#8C5A3C"
    dusk_ember: "#B4664F"
    dusk_gold: "#E0956A"
    bluebonnet: "#4E5FA8"
    mesquite: "#6E7A5A"

    # THE PAPER REGISTER. The light palette is not a lightened dark palette, it is a second
    # real Texas material. Caliche is the pale calcium carbonate hardpan a ranch road is cut
    # down into, and it is the same stuff as `caliche` above: on a dark page it is the type,
    # on a light page it is the ground. One material, two jobs, which is why light mode is
    # not a generic cream.
    paper: "#F6F1E4"           # a caliche road cut in full sun, the page itself
    paper_rule: "#CFC2A6"      # a hairline in that ground, the shadow in the same stone

    # CAPITOL GRANITE. The Texas Capitol is faced in sunset red granite quarried at Granite
    # Mountain in Burnet County, which is the most specific, most public and least kitsch red
    # the state owns. It is the accent on paper, where flag red is reserved and dusk gold is a
    # night colour that disappears.
    capitol_granite: "#9A3B2A"

    # SIGNAL COLOURS. Each means exactly one thing about a public process and nothing on the
    # site may wear it decoratively. The sibling product carries four for the same job and it
    # is the reason a reader can scan its docket without reading it.
    #
    # `signal_open` is deliberately the only cool hue in a warm palette. A comment window that
    # is open right now is the single thing a reader came to find, and against ember, gold and
    # caliche a cool green is the fastest thing on the page to spot. It is a spring green
    # rather than a screen green, so it sits with the dusk register instead of buzzing on it.
    signal_open: "#4FC79A"     # a door is open to the public right now
    signal_soon: "#E0956A"     # a window closing within a week. The accent, doing double duty
    signal_shut: "#8E85A0"     # decided, or no public process exists
    signal_link: "#7FB2D9"     # a link out to a source. Never a state, always a destination

    supporting_palettes_rotate: >
      Beyond the fixed tokens, each deck draws its accents from the material world of ITS OWN
      story and region. A Permian story is caliche, rust and flare orange. A Piney Woods story
      is not. See knowledge/shared/TEXAS_DESIGN_DOCTRINE.md. One palette across all regions is
      the tell that an outsider drew it.

  # WHICH TOKENS THE WEBSITE USES, and the honest reason the list is shorter than the palette.
  #
  # A token defined and never used is decoration pretending to be a decision. The site needs
  # nine roles filled twice, once per mode, and no more: two grounds, three inks, two rules,
  # an accent pair, and one reserved urgent. Everything above that is deck material, where a
  # per-story palette is the point (see supporting_palettes_rotate).
  #
  # theme.py reads this list, and its self-test requires every name here to reach the
  # stylesheet. That is what stops the palette drifting back into a mood board.
  site_palette:
    dark: [night, deep, panel, line, caliche, limestone, dust, dusk_gold, dusk_ember]
    light: [paper, limestone, caliche, paper_rule, night, deep, capitol_granite]
    both: [flag_red, flag_blue, flag_white]
    deck_only:
      # Real Texas material with no job on a record page. Named here so their absence from the
      # stylesheet reads as a decision rather than an oversight.
      rust: "a Permian and oilfield accent, for decks about that country"
      bluebonnet: "the state flower, for decks where a soft blue is the story's own colour"
      mesquite: "brush country green, same rule"

  type:
    # Kept deliberately. Changing the typeface would cost the family resemblance with the
    # sibling product and buy nothing. Differentiation is by color and geometry.
    display: "Fraunces"
    body: "Manrope"
    mono: "JetBrains Mono"

  on_slide_text_rules:
    - "No em or en dashes, no colons in prose, straight quotes, no emojis, no hashtags."
    - "Tabular numerals. Spaced units: 43 MW, not 43MW."
    - "Dates month first with the ordinal, on slides too."
    - "No first person. No slide opens with And or But."
    - "Every factual number carries a claim id."
