# The rubric the scorer grades every deck against.
#
# WHY THE WEIGHTS LOOK LIKE THIS. Craft carries the most weight because craft is what a reader
# actually experiences and it is the criterion a machine most reliably lets slide: nothing
# breaks when a deck is merely competent, no gate fires, and the score drifts down a tenth at a
# time until the product is boring and nobody can point at the run where that happened.
#
# The hard fails are not weighted at all. They are conditions, and any one of them makes the
# deck unshippable whatever the weighted score says, because each one is a promise this product
# has made in public.
#
# THE THRESHOLD MOVED TO 8.0 AND THE ART WEIGHTS WERE SPLIT, 2026-09-16, on the owner's report
# that the artwork is not good enough and the frames do not flow together.
#
# 6.7 was doing nothing. The last fourteen runs scored 6.56, 6.76, 6.68, 6.92, 6.95, 6.96, 6.71,
# 6.58, 6.94, 6.92, 6.78, 7.12, 7.58, 7.49. The bar sat BELOW the mean of the thing it was
# supposed to be judging, so it never once asked a run for another round. A threshold under the
# observed distribution is a number in a file, not a standard. The sibling product holds 8.3 with
# the same agents and the same engine, which is what says 8.0 is reachable here rather than
# aspirational. `max_rounds` still bounds the SEARCH, so this does not risk a run that cannot
# ship: past the cap the deck ships at whatever it got, with the shortfall stated in the email
# and in the run record. What changes is that a 7.5 now costs a round instead of passing.
#
# THE ART SPLIT. `artwork_craft` went 0.28 to 0.22 and the 0.06, plus 0.06 taken from story and
# sequence and voice, funds `deck_coherence` at 0.12. Art now carries 0.34 between the two,
# UP from 0.28, and `claim_integrity` did not move because it is this product's spine. The split
# exists because one number could not hold both questions: the old criterion asked whether each
# FRAME was drawn and rewarded a deck for "a different layout on every frame", which is a
# per-frame question answered per frame, and nothing at all asked whether the nine frames were
# one deck. That is why a deck whose value track jumped 43 points between frames 6 and 7 was
# described by its own judge as having "a genuine value arc" and given credit for the amplitude.

# THE SCALE WAS RECALIBRATED TO THE SIBLING'S, 2026-09-24, on the owner's diagnosis and
# instruction. In their words: "[The sibling] just passes the ship gate every day. That's the
# difference." And: "Yes, recalibrate Texas scoring to [the sibling's], go ahead."
#
# THE 8.0 BAR WAS SET ON A PREMISE THAT WAS FALSE, and it was measured rather than argued. The
# note above says "the sibling product holds 8.3 with the same agents and the same engine". It
# did not. The sibling scores with ONE scorer told "most good work is 7-8", against descriptors
# whose 10 is a concrete checklist. This file told three judges "7 is acceptable and 9 is the best
# thing shipped this month", and their brief said "the only way you fail at that is by being
# generous". On that scale a typical deck lands on 7 by definition. In 32 panel-scored decks none
# ever scored above 7.58, so an 8.0 bar on it was a bar nothing could clear.
#
# The cross-score that settled it, each grader blind to the other's number:
#
#     deck                     sibling's scorer     this panel, old scale
#     sibling no. 66           8.67                 6.01 (judges 5.43, 6.36, 5.96), and held
#     Texas no. 33             6.70                 6.42
#
# The same deck lost about 2.7 points to this file alone. The sibling's own totals read about 10
# percent high, because its weights sum to 1.10, so its 8.67 is about 7.9 on a true scale. That
# was reported to its owner and is NOT copied here: these weights sum to 1.00.
#
# WHAT CHANGED. The scale sentence is the sibling's. Every criterion carries 10, 7 and 4
# descriptors in the sibling's form, the 10 being the checklist of the best version. THE
# SHOWSTOPPER TEST is the artwork 10 and no longer a cap at 6, because a cap on a scale whose
# typical deck is 7 decides the verdict before the deck is read. The judges' brief loses "the only
# way you fail is by being generous". The bar steps down by round, the sibling's gate (see
# `ladder` below). What did NOT change: three judges with their lenses, because the panel is what
# catches fabrications (2026-08-19), every hard fail, and "do not round up".
#
# AND WHAT THE RECALIBRATION IS NOT. On the sibling's own scale no. 33 scored 6.70, under any
# bar. The decks have real deficits as well and a scale does not hide them. The gates and the kit
# carry those.
#
version: 2
threshold: 8.0          # the top rung of the ladder below
max_rounds: 5           # the last rung: at this many scoring rounds the finished deck ships

# THE LADDER, the sibling's gate, adopted 2026-09-24 on the owner's instruction. The bar a deck
# must clear steps down with the rounds of work it has had, and at `max_rounds` the finished deck
# ships with its score and the shortfall named in the email and the run record. There is no hold
# and no floor under it. A deck under its round's rung goes back for the named defects, because
# a low score is a work order and never a reason to stop. A hard fail is repaired, never shipped
# and never held. `run_complete.py` and `panel.py` both read this block, from `ladder_from` on.
ladder_from: "2026-09-24"
ladder:
  - {from_round: 1, threshold: 8.0}
  - {from_round: 4, threshold: 7.7}

# THE THRESHOLD MOVED AND A ROUND CAP WENT IN, on the owner's instruction, 2026-08-26.
#
# WHY. Carousel no. 7 was scored FIFTEEN times in one run and never cleared 7.0. The judge scores
# went 6.66, 6.72, 6.90, 6.66, and back to the mid sixes, sideways rather than up, across a night
# of work. Every round closed what the previous round named and every round named new things, and
# the run kept scoring instead of shipping. That is not a deck failing a bar. That is a loop with
# no exit, and it cost the owner a night and a great deal of money.
#
# TWO THINGS WERE TRUE AT ONCE and the run only reported the first, which was itself a failure.
# The panel is three judges told to default to dissatisfaction, graded on a rubric where 7 means
# "competent and consistent, nothing memorable in it", combined by a per-criterion MEDIAN. On
# rounds 5 through 11 individual judges returned 7.24, 7.19, 7.14, 7.23 and 7.10 and the median
# never cleared 7.0, because there was always one judge below it and never the same one.
# AND the judges were finding real defects every round: a gesture whose guards silently deleted
# it while the ledger recorded it shipped, repairs that met a numeric floor and were invisible in
# the pixels, typed constants under comments claiming they were computed, a rule struck through a
# line of type. The deck was genuinely not finished. Both halves are true and neither excuses the
# other.
#
# WHAT THE CAP IS FOR. It is not permission to ship a bad deck. A hard fail still stops the deck
# at any round, because a hard fail is a claim about a promise this product made in public: a
# figure with no computation behind it, a quote that is not in the source, a universal the run's
# own numbers refute. That is a factual gate and not a polish gate, and it does not move.
# `max_rounds` bounds the SEARCH, not the standard: past the cap the run ships whatever the
# weighted score is, states that score honestly in the email, and records in the run record that
# it shipped under the bar and by how much. A run that would rather keep scoring than say a
# number out loud is the failure this cap exists to make impossible.
#
# TEN BECAME FIVE the same day, on the owner's second instruction, and the reason is sharper than
# the first: "judges are becoming a token burning crutch masking your inefficiencies". That is
# the correct diagnosis. A panel is a CHECK on a deck the run already believes is finished. This
# run used it as a design loop, shipping a half-considered frame into three judges and letting
# them find what a careful pass would have found for nothing, then repeating that fifteen times.
# Five rounds is not a smaller budget for the same behaviour. It is a different behaviour: get
# the frame right before it is scored, and treat every round after the first as evidence that
# something upstream of the panel was skipped.
#
# 6.8 BECAME 6.7 ON THE OWNER'S INSTRUCTION, 2026-09-13, and the reason is a pattern rather than
# one deck. In their words: "u keep on getting just under the bar, not merging to main. but the
# decks look fine, and should have all been merged to main, u keep on doing this mistake daily."
#
# The evidence is in the ledger. Carousel no. 14 shipped at 6.762 at the cap. No. 17 held on a
# hard fail. No. 22 on 2026-09-13 finished at 6.784, which is sixteen THOUSANDTHS under the old
# bar, after five rounds and fifteen judge reports with no hard fail outstanding. A bar a careful
# deck lands a hundredth below, repeatedly, is measuring the panel's own scatter rather than the
# product: the three judges on that deck returned 6.9, 6.65 and 6.542, a spread of 0.358, which is
# more than twenty times the distance the verdict turned on.
#
# WHAT THIS DOES NOT CHANGE, and the distinction is the whole reason the number can move at all.
# The hard fails are not weighted and do not move. A figure with no computation behind it, a quote
# that is not in its source, a universal the run's own numbers refute, each still stops the deck at
# any round and at any score. Those are claims about promises this product made in public. The
# threshold is a POLISH gate over a rubric where 7 means competent, and a tenth of a point on a
# polish gate is a judgement call the owner gets to make. A hard fail is not, and no instruction
# in this file lowers one.
#
# NOR IS IT A LICENCE TO SHIP UNDER THE NEW BAR. The rule above stands unchanged: a deck under the
# threshold at the cap ships with its score said out loud in the email and in the run record, and
# the shortfall named. Lowering the bar moves where that line falls. It does not remove it, and a
# run that treats 6.7 as the new floor to aim at has misread this paragraph.
scale: "Score each criterion 1 to 10 against its descriptors. Be harsh at the top: 9 to 10 means best-in-class on LinkedIn that week. Most good work is 7 to 8."

criteria:
  - name: artwork_craft
    weight: 0.22
    asks: >
      This is the PER FRAME question. `deck_coherence` below is the whole deck, and a judge that
      answers one here and calls it both is the defect that made this split necessary.
      Is there an IMAGE on every frame, a drawn subject that owns the frame, reads as one
      silhouette at feed size and runs off an edge on most frames, or is there a headline with
      a small drawing under it? Is the subject a thing at true scale, with a size a reader can
      check against a person, or a slab in a void? Is the frame FINISHED, meaning graded rather
      than left as flat fills, with a real light and a real dark rather than one mid band? Does
      the type sit in quiet the picture actually has, or on a plate that was put there because
      the art was drawn without knowing where the type goes? Is the detail budgeted where the
      argument lands rather than where it starts? Would a designer look at this and want to know
      how it was drawn? knowledge/carousel/ILLUSTRATION_SYSTEM.md is the standard.
      A DIFFERENT LAYOUT ON EVERY FRAME IS NOT AN ANSWER TO THIS QUESTION and this criterion no
      longer asks for one. It used to, and it is the reason the decks stopped hanging together.
      THE SHOWSTOPPER TEST (2026-09-24, owner: "every single slide should literally look world
      reknowned"). Cover the type and read each rendered frame at 432 px. Is it a photograph of a
      PLACE at a TIME OF DAY: a sky or a deliberate interior, a horizon on a third, haze in depth,
      light from the side its shadows say, contact and dirt where things meet the ground? A frame
      that passes it is what the 10 below describes. One that fails it scores by how far it falls
      on the descriptors, and is not capped. ILLUSTRATION_SYSTEM.md, THE WORLD.
    scoring:
      10: "Every frame is a PLACE at an HOUR, or a deliberate interior: a sky, a ground with contact and dirt, haze in depth, light from the side its shadows say. One hero at true scale owns each frame, graded with a real light and a real dark, type seated in quiet the composition made for it, and it survives the zoom test at full size. It would hold as the opening spread of a serious magazine's feature."
      7: "Strong overall. One frame leans on a default, a primitive model, a dead zone or a render artifact."
      4: "Decorated templates, objects floating in a flat gradient, ungraded banding, or type on plates."

  - name: deck_coherence
    weight: 0.12
    asks: >
      Do the nine frames read as ONE DECK, cut from one piece of stock, or as nine pictures that
      arrived in the same envelope? Look at the contact sheet as a FILMSTRIP and answer in the
      reader's order, because a reader swipes and never sees a frame alone.
      Does one light run through the whole deck, every cast the same way? One ground, one HERO
      OBJECT rendered in one material, one grade, one ramp? A deck held together by a print
      screen is not coherent, it is the deleted faded look, and scores no higher than a 3 here. Does the VALUE hold from frame to frame, or does the deck strobe light
      to dark to light? Are at least two continuity devices actually working and named in the
      storyboard, a spine, an edge tease, a motif that changes state, a camera that moves, a
      value arc that goes one way? When the deck cuts, is the cut the argument's turn and did
      somebody declare it?
      `scripts/carousel/deck_coherence.py` measures the value track and `deck_chassis.py` reads
      the source. A judge may not score this above 7 on a deck either one of them refuses.
      A SPREAD IS A PROPERTY OF A SET AND A DECK IS A SEQUENCE. Judge adjacency, not range. On
      2026-09-16 a judge called a track of 77.8, 77.4, 32.5, 36.1, 54.9, 34.4, 77.4, 44.3, 17.9
      "a genuine value arc" and gave it credit. Four of those eight steps are hard cuts.
    scoring:
      10: "A filmstrip. One world, one light, one grade, one hero in one material, and a spine a reader could describe unprompted. Any frame is unmistakably from this deck."
      7: "Clearly one deck, with a continuity device or two doing real work and one frame that sits slightly outside."
      4: "Nine unrelated pictures sharing a wordmark, or frames held together only by a screen texture."

  - name: claim_integrity
    weight: 0.20
    asks: >
      Does every fact trace to a verified claim, and every numeral to a claim or a computation?
      Is anything asserted that a fetched page does not support?
    scoring:
      10: "Every figure traces to a claim or a computation, every source is primary where a primary exists, every universal names its set, and nothing is inferred past what its source says."
      7: "Traceable throughout. One claim leans on journalism where a filing existed, or one phrasing is looser than its source without changing what a reader believes."
      4: "A claim that stretches its source."

  - name: story_and_stakes
    weight: 0.16
    asks: >
      Does a Texan reading this understand what happened, who decided it, where, and whether
      they can still act on it? Is the stake concrete rather than abstract?
    scoring:
      10: "A Texan knows what happened, who decided it, where, and what they can do next. The county, the body, the decision and the deadline are named."
      7: "Clear and accurate, with one stake stated generally."
      4: "A topic rather than a story."

  - name: sequence_and_momentum
    weight: 0.10
    asks: >
      Does the deck move? Is there a turn, a place where understanding changes? Does the cover
      earn a swipe and the close land?
    scoring:
      10: "The cover earns the swipe, frame 2 pays at once, the deck turns where understanding changes, and the close lands. Nothing is cuttable."
      7: "Reads well in order, with one frame that could move without loss."
      4: "Nine slides in a row."

  - name: voice
    weight: 0.10
    asks: >
      Does this sound like a person from Texas wrote it? Texas First without boosterism, honest
      about costs without doom. Regional specificity over state-level abstraction.
    scoring:
      10: "Reads as a Texan who knows the subject wrote it. Specific, Texas First without boosterism, honest about costs without doom. Nobody would guess a machine wrote it."
      7: "Clean and on register, with one flat or generic line."
      4: "A press release, or an outsider describing Texas."

  - name: variety
    weight: 0.10
    asks: >
      Is this distinct from recent decks in technique, palette, structure and opening move?
    scoring:
      10: "Technique, palette, structure and opening move all diverge from the last four decks."
      7: "A fresh concept with one familiar move."
      4: "A re-skin of a recent deck."

# ANY ONE OF THESE AND THE DECK DOES NOT SHIP, whatever the weighted score says.
hard_fails:
  - "a numeral on a slide or in the caption that traces to no claim and no computation"
  - "a machine QA failure in the render report"
  - "a caption_check violation"
  - "a bespoke_check failure: the deck is one drawing repeated"
  - "a topic repeated inside the 30 day window"
  - "an unverified fact presented as verified"
  - "a placeholder, a lorem, or an unfinished frame"
  - "a source cited that was never fetched"

# WHICH KIND OF NO A JUDGE IS SAYING. Added 2026-08-28, and it is what makes the cap above
# expressible. `panel.py` is the code that reads this and its comment carries the incident.
#
# Deck no. 10 was refused twice by judges who wrote, in the same file, that the refusal was the
# threshold and not a fault. One added "I looked hard for one and I will not manufacture it".
# `panel.py` synthesized a hard fail from `ship: false` with an empty `hard_fails`, a hard fail
# stops a deck at ANY round, and the run reached the cap reading its own gate as saying both ship
# and do not ship. It resolved that in four paragraphs of prose, which is not a gate.
refusal:
  # THE KIND OF A REFUSAL IS DERIVED FROM YOUR OWN NUMBERS. YOU DO NOT DECLARE IT.
  #
  # An earlier version of this contract asked a judge to write `refusal_reason: threshold`, and
  # the hole opened inside the very run that shipped it. A judge scored 6.51 and explained itself
  # in prose. The field did not exist when it scored. THE RUN WROTE THE FIELD ONTO THE JUDGE'S
  # FILE, and the panel moved from HOLD to SHIP on a word the graded party had typed. The run
  # labelled what it had done, honestly, in a key beside it. Honest labelling is not a control.
  #
  # So there is nothing left to write. The panel reads your score and your hard_fails list, which
  # are the two things you were always going to produce, and works the rest out.
  derived: true
  field: >
    Do not emit refusal_reason. The panel derives the kind of a refusal and ignores a written
    field except to check it, so writing one can only hurt you.
  when: "you set ship: false and your hard_fails list is empty"
  threshold_dissent: >
    Your no is about the NUMBER when your own weighted score is under the bar. You do not say so
    and you do not need to: scoring 6.51 against a 6.8 bar has already said it. The panel records
    the dissent in score.json by name and carries it where it belongs, in the median. If the
    median is under the bar the deck still holds.
  fault: >
    Your no is about a FAULT when you put one in hard_fails. That is your real veto, it stops the
    deck at any round whatever the other two judges said and whatever the median is, and nothing
    about this change touches it. If you mean to stop the deck, name the fault.
  written: >
    A refusal_reason in your file that your own numbers do not support stops the deck. After this
    change no judge emits one, so its presence means a hand reached in.
  incoherent: >
    ship: false, an empty hard_fails list, and a score that CLEARS the bar describes neither a
    fault nor the number. That fails closed, which is the case the original rule was written for
    and which has not changed.
  never: >
    This is not a way to ship a deck. A declared threshold dissent moves no verdict field. If
    the panel's median is under the bar the deck still holds, and if you can name a fault it is
    a hard fail and it still stops the deck whatever else you write.

honesty:
  rule: >
    Do not round up. Not to reach the threshold, not because the run worked hard, not because
    the story is good. A 6.94 is a 6.94 and the email says so.
  why: >
    The score exists to tell the maintainer what actually shipped. A score that flatters is
    worse than no score, because it is a measurement nobody can use and everybody believes.
