# Where this repo's config deliberately diverges from the config it was ported from.
#
# WHY THIS FILE EXISTS. `port_audit.py`'s parity gate holds Texas config to every KEY its Alaska
# counterpart carried, because the failure this whole port is built to prevent is a file that got
# copied over, half finished, and looked done. A key that quietly vanished is that failure in
# miniature. So the gate is strict, and every divergence has to be argued HERE, in data, where it
# is reviewable, rather than by loosening the gate.
#
# Three dispositions, and the audit enforces the difference:
#
#   renamed:  the concept survived under a different key. The audit FAILS if the Texas key does
#             not actually exist, so a rename can never be used to wave away a key nobody wrote.
#   dropped:  the concept does not apply to Texas. A non-empty `reason` is REQUIRED.
#   deferred: the concept applies, but the value cannot honestly be written yet. Requires a
#             `reason` and a `blocked_on`. The audit PRINTS every deferral on every run, so this
#             is a loud parking space and not a quiet grave.
#
# Adding a `dropped` entry is a real decision. Read the Alaska value first and make sure the
# thing being dropped is the Alaska-ness of it and not the discipline behind it.

"config/brand.yaml":

  renamed:
    # Naming. The product is a docket, not a page.
    brand.page_name:                    brand.name
    brand.channel:                      brand.channel_primary

    # The house rules were regrouped under one `house_rules` subtree. Alaska grew them one
    # maintainer ruling at a time, so they sit as siblings of `voice` and `audience` and read
    # like sediment. Same rules, same reasons, one place to look.
    brand.date_format:                        brand.house_rules.dates
    brand.date_format.rule:                   brand.house_rules.dates.rule
    brand.date_format.good:                   brand.house_rules.dates.good
    brand.date_format.bad:                    brand.house_rules.dates.bad
    brand.date_format.applies_to:             brand.house_rules.dates.applies_to
    brand.date_format.enforced_by:            brand.house_rules.dates.enforced_by
    brand.date_format.iso_is_still_correct_for: brand.house_rules.dates.iso_still_correct_for
    brand.contractions:                       brand.house_rules.contractions
    brand.contractions.rule:                  brand.house_rules.contractions.rule
    brand.contractions.why:                   brand.house_rules.contractions.why
    brand.contractions.enforced_by:           brand.house_rules.contractions.enforced_by
    brand.sentence_openers:                   brand.house_rules.sentence_openers
    brand.sentence_openers.rule:              brand.house_rules.sentence_openers.rule
    brand.sentence_openers.why:               brand.house_rules.sentence_openers.why
    brand.sentence_openers.enforced_by:       brand.house_rules.sentence_openers.enforced_by

    # The comma discipline, landed 2026-08-12. It joins the other house rules rather than
    # standing alone, and it splits per surface, because the SITE now has a measured ceiling
    # while CAPTIONS still have no corpus to measure. See the note under `deferred`.
    brand.comma_discipline:                   brand.house_rules.commas
    brand.comma_discipline.rule:              brand.house_rules.commas.rule
    brand.comma_discipline.how_to_cut_them:   brand.house_rules.commas.how_to_cut_them
    brand.comma_discipline.measured_baseline: brand.house_rules.commas.site.measured_baseline
    brand.comma_discipline.enforced_by:       brand.house_rules.commas.site.enforced_by
    # Alaska recorded the lesson as a fact about one sibling repo's number. Texas keeps the
    # lesson and drops the anecdote, because the principle is what generalises: a ceiling
    # belongs to the surface it was measured on.
    brand.comma_discipline.why_not_the_weekly_repos_number:
      brand.house_rules.commas.the_ceiling_is_per_surface

    # Visual. Same structural role, Texas material.
    visual.constellation.polaris_star:  visual.constellation.mark
    visual.constellation.gold_presence: visual.constellation.red_is_reserved
    visual.tokens.flag_gold:            visual.tokens.flag_red
    visual.tokens.deep_night:           visual.tokens.night
    visual.tokens.flag_blue_horizon:    visual.tokens.flag_blue
    visual.tokens.panel_navy:           visual.tokens.panel
    visual.tokens.snow:                 visual.tokens.flag_white

  dropped:
    visual.tokens.aurora_green:
      reason: >
        An aurora color. Texas has no aurora, and a green-cyan-violet accent family carried into
        a Big Bend dusk palette would be the single loudest tell that this product was cloned
        rather than designed. The ROLE the aurora family played, a rotating accent family drawn
        from the story's own material world, is preserved at visual.tokens.supporting_palettes_rotate.
    visual.tokens.aurora_ice:
      reason: "Same as aurora_green. Role preserved at supporting_palettes_rotate."
    visual.tokens.aurora_violet:
      reason: "Same as aurora_green. Role preserved at supporting_palettes_rotate."
    visual.tokens.forget_me_not:
      reason: >
        The Alaska state flower, used as a soft blue accent. Texas has a state flower and it is
        the bluebonnet, so the slot is filled by visual.tokens.bluebonnet rather than renamed:
        the hex, the connotation and the usage are all different, and calling it a rename would
        overstate the continuity.
    visual.tokens.gold_halo:
      reason: >
        The lighter halo of the accent gold, which exists because Alaska's gold appears on every
        slide and needs a glow value. Texas red is URGENT ONLY by explicit rule, so it appears on
        few slides and must never glow. A halo token would invite exactly the decorative use the
        reservation rule exists to forbid.

  deferred:
    # RESOLVED 2026-08-12 for the WEBSITE, still deferred for CAPTIONS. The original deferral was
    # right about the thing that mattered: a ceiling is a property of the surface it governs, so
    # it has to be measured on that surface. The website is now a surface with a corpus. 24
    # published pages carrying 80 words or more hold 366 commas in 6,180 words, which is 5.92 per
    # hundred, and ten percent below that is 5.33. That number was computed from this product's
    # own copy, not typed from anyone's, and it is live at caption_check.SITE_COMMA_CEILING with
    # the rest of the rule at brand.house_rules.commas.
    #
    # Captions still have no corpus, so CAPTION_COMMA_CEILING is None ON PURPOSE, and
    # `rate_problem` takes the ceiling as an argument specifically so the measured site number
    # can never leak onto the unmeasured caption surface. The construction rules run on both
    # today. Only the density rule waits.
    brand.linkedin_post.comma_per_100_chars:
      reason: >
        The caption threshold, expressed in the OTHER unit. Texas settled on commas per 100
        WORDS and carries one unit only, because holding a rule in two denominators is how a
        threshold eventually gets compared against the wrong one. The words-based caption
        ceiling is the deferred value; this key is the unit Texas chose not to keep.
      blocked_on: >
        Nothing, for this key. The caption ceiling it duplicates is blocked on the first 20
        shipped captions, recorded at brand.house_rules.commas.caption.blocked_on.
