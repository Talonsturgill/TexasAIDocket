 <script type="module">import * as THREE from '@@ASSETS@@/js/three.module.min.js';import {init} from '@@ASSETS@@/js/txthree.js';import {initKit} from '@@ASSETS@@/js/txkit.js';
 window.renderReady=(async()=>{const TXT=init(THREE);const {K,F,R,W,gl}=await STUDY.boot(THREE,TXT,initKit);const group=new THREE.Group(),count=F.crew_drawn.value,local=F.crew_local_drawn.value;
 const silver=new THREE.MeshStandardMaterial({color:0x9eafb9,roughness:.28,metalness:.72});
