<!doctype html>
<!-- EDITORIAL DECK, frame 7 of 9. Archetype CLOSE_CROP.
     The board's release, so close the reader is inside the newsprint: the sentence set large
     on a tilted sheet cropped by three edges, the halftone of the page visible as a texture
     under the type, and the two words the sentence ends on ringed by hand in the accent.
     The hook sits on the dark desk above the sheet. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  :root { --night:#0F0C1C; --ink:#EDE6D6; --dim:#B9B2A3; --accent:#E0956A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:var(--night); }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:150px; width:920px; font-family:"Fraunces", serif; font-weight:700;
          font-size:92px; line-height:1.0; letter-spacing:-0.02em; color:var(--ink); font-variation-settings:"opsz" 144; }
  .dek { position:absolute; left:80px; top:372px; width:760px; font-size:28px; line-height:1.4; color:var(--dim); }
  .sheet { position:absolute; left:110px; top:600px; width:900px; height:580px; overflow:hidden;
           font-family:"Instrument Serif", serif; color:#1B1830; }
  .sheet .q { font-size:106px; line-height:1.06; width:900px; }
  .sheet .q span { display:block; white-space:nowrap; }
  .sheet .q .end { display:inline-block; }
  svg.ring { position:absolute; left:0; top:0; width:1080px; height:1350px; overflow:visible; pointer-events:none; }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace; font-size:24px; letter-spacing:0.07em; line-height:1.5; color:var(--dim); white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Its own summary ends in "and more."</h1>
<p class="dek">The board's release names the goals and no technology. The course text names three.</p>
<div class="sheet" id="sheet">
  <div class="q"><span>The new TEKS will teach</span><span>students how to set goals,</span><span>budget, save, invest,</span><span>develop business plans</span><span><span class="end" id="end">and more.</span></span></div>
</div>
<svg class="ring" viewBox="0 0 1080 1350" aria-hidden="true"><path id="ringpath" d="" fill="none" stroke="#E0956A" stroke-width="10" stroke-linecap="round" opacity="0.95"/></svg>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txscene.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(async function (resolve, reject) {
  try {
    await document.fonts.ready;
    TXLAYOUT.mount(document.body, { kicker: "The announcement", counter: "07 / 09", src: "c22 c23 c24   TEXAS AI DOCKET", ink: "#B9B2A3" });
    TX.fitText(document.getElementById("hook"), { min: 64, max: 92, maxLines: 2 });
    var cv = document.getElementById("art"), cx = cv.getContext("2d"); cx.scale(2, 2);
    var W = 1080, H = 1350;
    var rot = -0.9 * Math.PI / 180, ox = -70, oy = 566, pw = 1320, ph = 630;
    var corner = function (x, y) { return [ox + x * Math.cos(rot) - y * Math.sin(rot), oy + x * Math.sin(rot) + y * Math.cos(rot)]; };
    var sheet = [corner(0, 0), corner(pw, 0), corner(pw, ph), corner(0, ph)];
    TXINK.print(cx, {
      ground: "#0F0C1C", ink: "#EDE6D6", fibre: 0.06, seed: 27,
      screen: { mode: "halftone", cell: 9, angle: 18, gamma: 1.0, floor: 0.03 },
      edges: { threshold: 40, width: 1.2, alpha: 0.6, dx: 1.6, dy: -1.2 },
      draw: function (a) {
        // the desk falls to black at the top; the sheet is a mid tone so the halftone prints
        // it as a visible dot field, which is the point of the crop
        var g = a.createLinearGradient(0, 420, 0, 700); g.addColorStop(0, "#000000"); g.addColorStop(1, "#1E1E1E");
        a.fillStyle = g; a.fillRect(0, 0, W, H);
        a.save(); a.filter = "blur(22px)"; a.fillStyle = "#000000"; poly(a, sheet.map(function (p) { return [p[0] + 18, p[1] + 34]; })); a.restore();
        var sg = a.createLinearGradient(0, 560, 0, H); sg.addColorStop(0, "#A8A8A8"); sg.addColorStop(1, "#7C7C7C");
        a.fillStyle = sg; poly(a, sheet);
      },
      over: function (c) {
        // the ring around the two words, drawn by hand in the accent, laid under nothing
        TXINK.reserve(c, { ground: "#0F0C1C", bottom: 150, bottomSolid: 120 });
        // the ring around the two words, drawn by hand in the accent as an SVG path in the
        // DOM rather than on the canvas, so it is a mark beside the type and never a rule
        // through it
        var r = document.getElementById("end").getBoundingClientRect();
        var cxr = r.left + r.width / 2, cyr = r.top + r.height / 2 + 4, rx = r.width / 2 + 40, ry = r.height / 2 + 30;
        var d = "M" + (cxr + rx) + " " + cyr;
        for (var i = 1; i <= 40; i++) { var t = i / 40 * Math.PI * 2; d += " L" + (cxr + Math.cos(t) * rx).toFixed(1) + " " + (cyr + Math.sin(t) * ry).toFixed(1); }
        document.getElementById("ringpath").setAttribute("d", TXINK.wobble(d, { amp: 3.0, freq: 0.03, seed: 8, step: 6 }));
      }
    });
    function poly(a, pts) { a.beginPath(); a.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) a.lineTo(pts[i][0], pts[i][1]); a.closePath(); a.fill(); }
    resolve();
  } catch (e) { reject(e); }
});
</script>
</body>
</html>
