<!doctype html>
<!-- EDITORIAL DECK, frame 5 of 9. Archetype GRID.
     The isotype. Ten knowledge statements of the course text as ten identical units, a student
     seated at a desk, on two shelves of ground, three of them printed in the accent because
     those three name a machine. The count is the image and a reader can count it. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  :root { --night:#0F0C1C; --ink:#EDE6D6; --dim:#B9B2A3; --accent:#E0956A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:var(--night); }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:186px; width:920px; font-family:"Fraunces", serif; font-weight:700;
          font-size:100px; line-height:1.0; letter-spacing:-0.02em; color:var(--ink); font-variation-settings:"opsz" 144; }
  .dek { position:absolute; left:80px; top:420px; width:840px; font-size:28px; line-height:1.4; color:var(--dim); }
  .lab { position:absolute; width:150px; text-align:center; font-family:"JetBrains Mono", monospace; font-size:24px; letter-spacing:0.06em; color:var(--dim); text-transform:uppercase; }
  .lab.on { color:var(--accent); }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace; font-size:24px; letter-spacing:0.07em; line-height:1.5; color:var(--dim); white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Ten chapters. The machine is in three.</h1>
<p class="dek">Every chapter of the course text is a thing a student must be able to do with money. Seven of them carry none of the four machine terms.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txscene.js"></script>
<script src="@@ASSETS@@/js/txfig.js"></script>
<script src="@@ASSETS@@/js/txobjects.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(async function (resolve, reject) {
  try {
    await document.fonts.ready;
    TXLAYOUT.mount(document.body, { kicker: "The course text", kicker2: "Ten knowledge statements", counter: "05 / 09", src: "c12 c13 c19 c20 c21   TEXAS AI DOCKET", ink: "#B9B2A3" });
    TX.fitText(document.getElementById("hook"), { min: 72, max: 100, maxLines: 2 });
    var cv = document.getElementById("art"), cx = cv.getContext("2d"); cx.scale(2, 2);
    var W = 1080, H = 1350;
    // two shelves of five. One long lens per shelf so every unit is the same size: 150 px a metre.
    var F = 2400, Z = 16, ppm = F / Z, STEP = 1.28;
    var rows = [{ y: 820 }, { y: 1160 }];
    var hits = { 3: "research", 4: "explain", 7: "appraise" };
    var desk = TXOBJ.sprite("student_desk");
    var units = [];
    for (var i = 0; i < 10; i++) units.push({ n: i + 1, row: Math.floor(i / 5), col: i % 5,
      fig: TXFIG.figure({ pose: "sit", seat: 0.45, height: 1.58 + (i % 3) * 0.06, hat: i === 6 ? "cap" : undefined }) });
    var camFor = function (r, ctx) { return TXSCENE.create(ctx, { w: W, h: H, eye: 1.0, horizon: r.y - 1.0 * ppm, f: F, fogZ: 1e9, sky: "#000", light: { az: -40, el: 40 } }); };
    TXINK.print(cx, {
      ground: "#0F0C1C", ink: "#EDE6D6", fibre: 0.05, seed: 25,
      screen: { mode: "line", cell: 4, angle: 90, gamma: 1.1, floor: 0.04 },
      edges: { threshold: 22, width: 1.3, alpha: 0.8, dx: 0.9, dy: -0.7 },
      draw: function (a) {
        a.fillStyle = "#000000"; a.fillRect(0, 0, W, H);
        rows.forEach(function (r, ri) {
          var S = camFor(r, a);
          a.fillStyle = "#3A3A3A"; a.fillRect(80, r.y - 3, W - 160, 5);          // the shelf
          units.filter(function (u) { return u.row === ri; }).forEach(function (u) {
            var X = (u.col - 2) * STEP, on = !!hits[u.n];
            var tone = on ? "#000000" : "#D8D8D8";
            S.shadow(desk, { X: X, Z: Z, ink: "#000", alpha: 0.5 }); S.shadow(u.fig, { X: X - 0.35, Z: Z, ink: "#000", alpha: 0.5 });
            S.sprite(u.fig, { X: X - 0.35, Z: Z, inks: { ink: tone, paper: "#111", accent: tone }, fade: false });
            S.sprite(desk, { X: X, Z: Z, inks: { ink: on ? "#000000" : "#8A8A8A", paper: "#111", accent: tone }, fade: false });
          });
        });
      },
      over: function (c) {
        rows.forEach(function (r, ri) {
          var S = camFor(r, c);
          units.filter(function (u) { return u.row === ri; }).forEach(function (u) {
            var X = (u.col - 2) * STEP;
            if (hits[u.n]) {
              S.sprite(u.fig, { X: X - 0.35, Z: Z, inks: { ink: "#E0956A", paper: "#0F0C1C", accent: "#E0956A" }, fade: false });
              S.sprite(desk, { X: X, Z: Z, inks: { ink: "#E0956A", paper: "#0F0C1C", accent: "#E0956A" }, fade: false });
            }
            var b = S.spriteBox(desk, { X: X, Z: Z });
            var lab = document.createElement("div"); lab.className = "lab" + (hits[u.n] ? " on" : "");
            lab.style.left = Math.round(X * ppm + W / 2 - 75 - 0.2 * ppm) + "px"; lab.style.top = Math.round(r.y + 14) + "px";
            lab.textContent = hits[u.n] ? hits[u.n] : String(u.n).padStart(2, "0");
            document.body.appendChild(lab);
          });
        });
      }
    });
    resolve();
  } catch (e) { reject(e); }
});
</script>
</body>
</html>
