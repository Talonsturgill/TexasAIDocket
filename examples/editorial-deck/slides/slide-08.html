<!doctype html>
<!-- EDITORIAL DECK, frame 8 of 9. Archetype SPLIT_HORIZON.
     One straight cut. Above it, a Texas high school at dusk at true scale: the long low
     building, the entrance block, the flagpole, three buses in the lot, the water tower of the
     town behind, a live oak. Below the cut, flat night and the type. One accent: the flag. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  :root { --night:#0F0C1C; --ink:#EDE6D6; --dim:#B9B2A3; --accent:#E0956A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:var(--night); }
  body { position:relative; font-family:"Manrope", sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#art { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .hook { position:absolute; left:80px; top:150px; width:920px; font-family:"Fraunces", serif; font-weight:700;
          font-size:84px; line-height:1.0; letter-spacing:-0.02em; color:var(--ink); font-variation-settings:"opsz" 144; }
  .dek { position:absolute; left:80px; top:352px; width:860px; font-size:28px; line-height:1.4; color:var(--dim); }
  .tx-site { position:absolute; right:80px; bottom:80px; font-family:"JetBrains Mono", monospace; font-size:24px; letter-spacing:0.07em; line-height:1.5; color:var(--dim); white-space:nowrap; z-index:20; }
</style>
</head>
<body>
<canvas id="art" width="2160" height="2700"></canvas>
<div class="tx-site" id="site">texasaidocket.com</div>
<h1 class="hook" id="hook">Ask your district who is staffing the three expectations.</h1>
<p class="dek">The release quotes the board chairman on what he calls the vital aspect of the new standards, and it is not the machine.</p>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/txtype.js"></script>
<script src="@@ASSETS@@/js/txscene.js"></script>
<script src="@@ASSETS@@/js/txfig.js"></script>
<script src="@@ASSETS@@/js/txobjects.js"></script>
<script src="@@ASSETS@@/js/txink.js"></script>
<script src="@@ASSETS@@/js/txlayout.js"></script>
<script>
window.renderReady = new Promise(async function (resolve, reject) {
  try {
    await document.fonts.ready;
    TXLAYOUT.mount(document.body, { kicker: "The district", counter: "08 / 09", src: "c22 c24   TEXAS AI DOCKET", ink: "#B9B2A3" });
    TX.fitText(document.getElementById("hook"), { min: 60, max: 84, maxLines: 2 });
    var cv = document.getElementById("art"), cx = cv.getContext("2d"); cx.scale(2, 2);
    var W = 1080, H = 1350, CUT = 540;
    var cam = { w: W, h: H, eye: 1.7, horizon: 790, f: 640, fogZ: 1e9, light: { az: -75, el: 14 } };
    var school = TXOBJ.sprite("school", { length: 64 }), tower = TXOBJ.sprite("water_tower"), bus = TXOBJ.sprite("school_bus"), oak = TXOBJ.sprite("live_oak", { seed: 12 }), pole = TXOBJ.sprite("utility_pole");
    var S2;
    TXINK.print(cx, {
      ground: "#0F0C1C", ink: "#EDE6D6", fibre: 0.05, seed: 28,
      screen: { mode: "halftone", cell: 6, angle: 26, gamma: 1.1, floor: 0.05 },
      edges: { threshold: 20, width: 1.4, alpha: 0.85, dx: 1.1, dy: -0.8 },
      draw: function (a) {
        var S = TXSCENE.create(a, Object.assign({ sky: "#000000" }, cam)); S2 = S;
        a.fillStyle = "#000000"; a.fillRect(0, 0, W, H);
        var sky = a.createLinearGradient(0, CUT, 0, 790); sky.addColorStop(0, "#000000"); sky.addColorStop(1, "#4E4E4E");
        a.fillStyle = sky; a.fillRect(0, 0, W, 790);
        S.ground({ near: 1.0, far: 900, fill: "#3E3E3E" });
        var inks = { ink: "#D4D4D4", paper: "#141414", accent: "#D4D4D4" }, dim = { ink: "#8A8A8A", paper: "#141414", accent: "#8A8A8A" };
        S.sprite(tower, { X: 70, Z: 260, inks: dim, fade: false });
        S.shadow(school, { X: 6, Z: 58, ink: "#000", alpha: 0.5 }); S.sprite(school, { X: 6, Z: 58, inks: inks, fade: false });
        S.shadow(oak, { X: -34, Z: 44, ink: "#000", alpha: 0.5 }); S.sprite(oak, { X: -34, Z: 44, inks: dim, fade: false });
        [[-10, 30], [4, 27], [18, 24]].forEach(function (p) { S.shadow(bus, { X: p[0], Z: p[1], ink: "#000", alpha: 0.55 }); S.sprite(bus, { X: p[0], Z: p[1], inks: inks, fade: false }); });
        S.shadow(pole, { X: -18, Z: 16, ink: "#000", alpha: 0.5 }); S.sprite(pole, { X: -18, Z: 16, inks: inks, fade: false });
        TXOBJ.wire(S, [-18, 16, 11.1], [40, 40, 11.1], { ink: "#9A9A9A", width: 1.3, sag: 0.9 });
        var kids = TXFIG.crowd(7, { seed: 5, poses: ["walk", "stride", "walk", "stand"], holds: ["bag", undefined, "bag"] });
        kids.forEach(function (e, i) { var X = -4 + i * 1.5 + e.dx, Z = 7 + (i % 2) * 1.2; S.shadow(e.sprite, { X: X, Z: Z, ink: "#000", alpha: 0.55, mirror: e.mirror }); S.sprite(e.sprite, { X: X, Z: Z, inks: inks, mirror: e.mirror, fade: false }); });
        // the cut: everything above it is the type's ground
        a.fillStyle = "#000000"; a.fillRect(0, 0, W, CUT);
      },
      over: function (c) {
        c.fillStyle = "#0F0C1C"; c.fillRect(0, 0, W, CUT);
        c.fillStyle = "rgba(237,230,214,0.35)"; c.fillRect(0, CUT, W, 2);
        TXINK.reserve(c, { ground: "#0F0C1C", bottom: 150, bottomSolid: 115 });
        // the flag, flat accent, on the school's pole
        var p = S2.project(6 - 32 + 6.06, 9.6, 58), q = S2.project(6 - 32 + 6.06 + 1.6, 9.1, 58);
        c.fillStyle = "#E0956A"; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1] - 4); c.lineTo(q[0], q[1] + 8); c.lineTo(p[0], p[1] + 12); c.closePath(); c.fill();
      }
    });
    resolve();
  } catch (e) { reject(e); }
});
</script>
</body>
</html>
